name: Trigger Drive OAuth Bootstrap Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-drive-oauth-bootstrap-once.yml

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch bootstrap workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'bootstrap-google-drive-archive.yml',
              ref: 'main'
            })
            core.info('DRIVE_OAUTH_BOOTSTRAP_DISPATCHED=PASS')
