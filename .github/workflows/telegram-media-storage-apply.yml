name: Apply Telegram Media Storage

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-media-storage-apply.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-media || true
          yc config profile activate telegram-media
          yc config set service-account-key "$key"

      - name: Create private media bucket and grant upload access
        shell: bash
        run: |
          set -euo pipefail
          folder="b1gk4p83brasi8g811jv"
          bucket="telegram-reader-media-alexpmtk-20260910"
          vm_sa="$(yc compute instance get telegram-news-reader --folder-id "$folder" --format json | jq -r '.service_account_id')"
          test -n "$vm_sa" && test "$vm_sa" != "null"

          if ! yc storage bucket get --name "$bucket" --folder-id "$folder" >/dev/null 2>&1; then
            yc storage bucket create --name "$bucket" --folder-id "$folder" --max-size 5368709120
          fi

          yc resource-manager folder add-access-binding "$folder" \
            --role storage.uploader \
            --subject "serviceAccount:$vm_sa" >/dev/null

          info="$(yc storage bucket get --name "$bucket" --folder-id "$folder" --format json)"
          echo "$info" | jq -e '.name == "telegram-reader-media-alexpmtk-20260910"' >/dev/null
          if echo "$info" | jq -e '(.anonymous_access_flags.read == true) or (.anonymous_access_flags.list == true)' >/dev/null; then
            echo "BUCKET_PUBLIC_UNEXPECTED"
            exit 21
          fi
          echo "MEDIA_STORAGE_APPLY_PASS bucket=$bucket"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json"
