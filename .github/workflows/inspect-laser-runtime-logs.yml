name: Inspect Laser Runtime Logs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-laser-runtime-logs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL --retry 5 --retry-delay 3 https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Read recent container logs
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY"
          chmod 600 "$KEY"
          yc config profile create inspect-laser-runtime || true
          yc config set service-account-key "$KEY"
          FOLDER_ID="$(yc resource-manager folder list --cloud-id b1gi4pr9msenirafh2c7 --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          yc config set folder-id "$FOLDER_ID"
          CONTAINER_ID="$(yc serverless container list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$CONTAINER_ID"
          timeout 90s yc logging read --resource-ids="$CONTAINER_ID" --since '20m ago' --limit 500 --format json > "$RUNNER_TEMP/logs.json"
          echo "LOG_COUNT=$(jq 'length' "$RUNNER_TEMP/logs.json")"
          jq -r '.[] | [.timestamp // .created_at // "", .level // "", (.message // .json_payload.message // .text_payload // .json_payload // "" | tostring)] | @tsv' "$RUNNER_TEMP/logs.json" | tail -n 300

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/logs.json"
