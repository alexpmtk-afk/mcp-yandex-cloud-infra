name: Bootstrap Marketplaces Google Drive Bridge v1

on:
  workflow_dispatch:
    inputs:
      bridge_url:
        description: Marketplaces Apps Script Bridge v1 /exec URL
        required: true
        type: string

permissions:
  contents: read

env:
  PROJECT_ID: marketplaces
  EXPECTED_ROOT_ID: 1UVKUcFfDhCDk6nMHX1mWg9cRL05DT-OJ
  EXPECTED_ROOT_NAME: MCP архив базы данных
  LOCKBOX_NAME: marketplaces-mcp-api-credentials
  LOCKBOX_KEY: gdrive_bridge_v1_secret

concurrency:
  group: marketplaces-drive-bridge-v1-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Validate central Bridge v1 contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'protocol_version.*1' shared/google-drive-bridge/PROTOCOL.md
          grep -q "projectId: 'marketplaces'" shared/google-drive-bridge/deploy/marketplaces_config.gs
          grep -q "rootId: '$EXPECTED_ROOT_ID'" shared/google-drive-bridge/deploy/marketplaces_config.gs
          grep -q 'idempotency_key' shared/google-drive-bridge/PROTOCOL.md
          grep -q 'request_id' shared/google-drive-bridge/PROTOCOL.md
          echo 'SHARED_BRIDGE_CONTRACT=PASS'

      - name: Validate Marketplaces Bridge identity before Lockbox bootstrap
        shell: bash
        env:
          BRIDGE_URL: ${{ inputs.bridge_url }}
          BOOTSTRAP_SECRET: ${{ secrets.MARKETPLACES_GDRIVE_BRIDGE_V1_BOOTSTRAP_SECRET }}
        run: |
          set -euo pipefail
          test -n "$BRIDGE_URL"
          test -n "$BOOTSTRAP_SECRET"
          echo "::add-mask::$BOOTSTRAP_SECRET"
          python - <<'PY'
          import json, os, urllib.request, uuid
          body = {
              'secret': os.environ['BOOTSTRAP_SECRET'],
              'project_id': 'marketplaces',
              'request_id': str(uuid.uuid4()),
              'action': 'health',
              'payload': {},
          }
          req = urllib.request.Request(
              os.environ['BRIDGE_URL'],
              data=json.dumps(body).encode('utf-8'),
              headers={'Content-Type':'application/json','Accept':'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              data=json.loads(resp.read().decode('utf-8'))
          assert data.get('ok') is True, data
          assert int(data.get('protocol_version') or 0) == 1, data
          assert data.get('project_id') == 'marketplaces', data
          assert data.get('request_id') == body['request_id'], data
          result=data.get('result') or {}
          assert result.get('project_id') == 'marketplaces', data
          assert result.get('root_id') == os.environ['EXPECTED_ROOT_ID'], data
          caps=result.get('capabilities') or {}
          assert caps.get('fixed_root_file_id_guard') is True, data
          assert caps.get('idempotent_mutations') is True, data
          assert caps.get('global_script_lock') is False, data
          print('MARKETPLACES_BRIDGE_IDENTITY=PASS')
          PY

      - name: Install Yandex Cloud CLI
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          ARCHIVE="$RUNNER_TEMP/yc.tgz"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          for attempt in $(seq 1 8); do
            rm -f "$ARCHIVE"
            if timeout 75s curl --fail --silent --show-error --retry 2 --retry-all-errors -o "$ARCHIVE" "$URL" \
              && tar -tzf "$ARCHIVE" >/dev/null 2>&1; then
              break
            fi
            [[ "$attempt" -lt 8 ]]
            sleep 4
          done
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate and resolve project Lockbox
        id: lockbox
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          DEPLOYER_ID="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          test -n "$DEPLOYER_ID"
          yc config profile create bridge-v1-marketplaces || true
          yc config set service-account-key "$KEY_FILE"
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(timeout 45s yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r --arg n "$LOCKBOX_NAME" '.[]|select(.name==$n)|.id'|head -1)"
          test -n "$SECRET_ID"
          timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions-before.json"
          BASE_VERSION_ID="$(jq -r '[.[]|select(.status=="ACTIVE")]|sort_by(.created_at)|last|.id // empty' "$RUNNER_TEMP/versions-before.json")"
          test -n "$BASE_VERSION_ID"
          jq -r --arg id "$BASE_VERSION_ID" '.[]|select(.id==$id)|(.payload_entry_keys // [])[]?' "$RUNNER_TEMP/versions-before.json" | sort -u > "$RUNNER_TEMP/base-keys.txt"
          test -s "$RUNNER_TEMP/base-keys.txt"
          echo "folder_id=$FOLDER_ID" >> "$GITHUB_OUTPUT"
          echo "secret_id=$SECRET_ID" >> "$GITHUB_OUTPUT"
          echo "base_version_id=$BASE_VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "deployer_id=$DEPLOYER_ID" >> "$GITHUB_OUTPUT"
          echo 'MARKETPLACES_PROJECT_LOCKBOX=RESOLVED'

      - name: Detect whether Bridge v1 secret is already current
        id: change
        shell: bash
        env:
          SECRET_ID: ${{ steps.lockbox.outputs.secret_id }}
          BASE_VERSION_ID: ${{ steps.lockbox.outputs.base_version_id }}
          BOOTSTRAP_SECRET: ${{ secrets.MARKETPLACES_GDRIVE_BRIDGE_V1_BOOTSTRAP_SECRET }}
        run: |
          set -euo pipefail
          echo "::add-mask::$BOOTSTRAP_SECRET"
          if grep -Fxq "$LOCKBOX_KEY" "$RUNNER_TEMP/base-keys.txt"; then
            timeout 45s yc lockbox payload get --id "$SECRET_ID" --version-id "$BASE_VERSION_ID" --key "$LOCKBOX_KEY" --format json --no-user-output > "$RUNNER_TEMP/current-v1.json"
            CURRENT="$(jq -r --arg k "$LOCKBOX_KEY" '.entries[]|select(.key==$k)|.text_value // empty' "$RUNNER_TEMP/current-v1.json")"
            echo "::add-mask::$CURRENT"
            if [[ -n "$CURRENT" && "$CURRENT" == "$BOOTSTRAP_SECRET" ]]; then
              echo 'required=false' >> "$GITHUB_OUTPUT"
              echo 'MARKETPLACES_BRIDGE_V1_SECRET=ALREADY_CURRENT'
              exit 0
            fi
          fi
          echo 'required=true' >> "$GITHUB_OUTPUT"
          echo 'MARKETPLACES_BRIDGE_V1_SECRET=UPDATE_REQUIRED'

      - name: Grant temporary TEST-folder admin for version write
        if: steps.change.outputs.required == 'true'
        id: grant
        shell: bash
        env:
          FOLDER_ID: ${{ steps.lockbox.outputs.folder_id }}
          DEPLOYER_ID: ${{ steps.lockbox.outputs.deployer_id }}
        run: |
          set -euo pipefail
          timeout 90s yc resource-manager folder add-access-binding "$FOLDER_ID" --role admin --service-account-id "$DEPLOYER_ID"
          echo 'granted=true' >> "$GITHUB_OUTPUT"
          echo 'TEMP_TEST_FOLDER_ADMIN=GRANTED'
          sleep 20

      - name: Add isolated Bridge v1 key while preserving every existing key
        if: steps.change.outputs.required == 'true'
        id: version
        shell: bash
        env:
          SECRET_ID: ${{ steps.lockbox.outputs.secret_id }}
          BASE_VERSION_ID: ${{ steps.lockbox.outputs.base_version_id }}
          BOOTSTRAP_SECRET: ${{ secrets.MARKETPLACES_GDRIVE_BRIDGE_V1_BOOTSTRAP_SECRET }}
        run: |
          set -euo pipefail
          echo "::add-mask::$BOOTSTRAP_SECRET"
          python - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/bridge-v1-change.json','w',encoding='utf-8') as f:
              json.dump([{'key':'gdrive_bridge_v1_secret','text_value':os.environ['BOOTSTRAP_SECRET']}],f,separators=(',',':'))
          PY
          chmod 600 "$RUNNER_TEMP/bridge-v1-change.json"
          ok=0
          for attempt in $(seq 1 6); do
            rm -f "$RUNNER_TEMP/new-version.json"
            if timeout 60s yc lockbox secret add-version \
              --id "$SECRET_ID" \
              --base-version-id "$BASE_VERSION_ID" \
              --description 'Marketplaces Google Drive Bridge Protocol v1 credential' \
              --payload - --format json --no-user-output \
              < "$RUNNER_TEMP/bridge-v1-change.json" > "$RUNNER_TEMP/new-version.json"; then
              ok=1
              break
            fi
            echo "lockbox add-version retry $attempt/6"
            sleep 6
          done
          test "$ok" = 1
          VERSION_ID="$(jq -r '.id // .response.id // empty' "$RUNNER_TEMP/new-version.json")"
          test -n "$VERSION_ID"
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo 'MARKETPLACES_BRIDGE_V1_VERSION=ACTIVE'

      - name: Verify no legacy Lockbox keys were lost
        shell: bash
        env:
          SECRET_ID: ${{ steps.lockbox.outputs.secret_id }}
          BASE_VERSION_ID: ${{ steps.lockbox.outputs.base_version_id }}
          NEW_VERSION_ID: ${{ steps.version.outputs.version_id }}
          CHANGE_REQUIRED: ${{ steps.change.outputs.required }}
          BOOTSTRAP_SECRET: ${{ secrets.MARKETPLACES_GDRIVE_BRIDGE_V1_BOOTSTRAP_SECRET }}
        run: |
          set -euo pipefail
          echo "::add-mask::$BOOTSTRAP_SECRET"
          VERSION_ID="$NEW_VERSION_ID"
          if [[ "$CHANGE_REQUIRED" != true ]]; then VERSION_ID="$BASE_VERSION_ID"; fi
          test -n "$VERSION_ID"
          timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions-after.json"
          jq -r --arg id "$VERSION_ID" '.[]|select(.id==$id)|(.payload_entry_keys // [])[]?' "$RUNNER_TEMP/versions-after.json" | sort -u > "$RUNNER_TEMP/final-keys.txt"
          grep -Fxq "$LOCKBOX_KEY" "$RUNNER_TEMP/final-keys.txt"
          comm -23 "$RUNNER_TEMP/base-keys.txt" "$RUNNER_TEMP/final-keys.txt" > "$RUNNER_TEMP/missing-keys.txt"
          test ! -s "$RUNNER_TEMP/missing-keys.txt"
          timeout 45s yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --key "$LOCKBOX_KEY" --format json --no-user-output > "$RUNNER_TEMP/verify-v1.json"
          ACTUAL="$(jq -r --arg k "$LOCKBOX_KEY" '.entries[]|select(.key==$k)|.text_value // empty' "$RUNNER_TEMP/verify-v1.json")"
          echo "::add-mask::$ACTUAL"
          test "$ACTUAL" = "$BOOTSTRAP_SECRET"
          echo "MARKETPLACES_BRIDGE_V1_SECRET_VERSION_ID=$VERSION_ID"
          echo 'MARKETPLACES_BRIDGE_V1_LOCKBOX_BOOTSTRAP=PASS'
          echo 'LEGACY_LOCKBOX_KEYS_PRESERVED=PASS'
          echo 'RUNTIME_BINDING_CHANGED=NO'

      - name: Revoke temporary TEST-folder admin
        if: always() && steps.grant.outputs.granted == 'true'
        shell: bash
        env:
          FOLDER_ID: ${{ steps.lockbox.outputs.folder_id }}
          DEPLOYER_ID: ${{ steps.lockbox.outputs.deployer_id }}
        run: |
          set -euo pipefail
          timeout 90s yc resource-manager folder remove-access-binding "$FOLDER_ID" --role admin --service-account-id "$DEPLOYER_ID"
          echo 'TEMP_TEST_FOLDER_ADMIN=REVOKED'

      - name: Cleanup ephemeral credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/yc.tgz" \
            "$RUNNER_TEMP/versions-before.json" "$RUNNER_TEMP/versions-after.json" \
            "$RUNNER_TEMP/base-keys.txt" "$RUNNER_TEMP/final-keys.txt" "$RUNNER_TEMP/missing-keys.txt" \
            "$RUNNER_TEMP/current-v1.json" "$RUNNER_TEMP/bridge-v1-change.json" \
            "$RUNNER_TEMP/new-version.json" "$RUNNER_TEMP/verify-v1.json"
