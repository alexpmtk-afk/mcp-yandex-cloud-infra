name: Migrate Marketplaces MCP TEST Terraform State

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplaces-mcp-test-terraform
  cancel-in-progress: false

jobs:
  migrate:
    name: Import existing TEST resources into remote state
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --fail --silent --show-error -o "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate CI service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "TF_VAR_yc_service_account_key_file=$KEY_FILE" >> "$GITHUB_ENV"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Initialize protected remote state
        shell: bash
        env:
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$YC_TFSTATE_ACCESS_KEY"
          test -n "$YC_TFSTATE_SECRET_KEY"
          terraform -chdir=terraform init -reconfigure -input=false \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" \
            -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY"

      - name: Import existing TEST resources
        shell: bash
        run: |
          set -euo pipefail

          FOLDER_ID="b1gnd0dqoq3ljod88i8t"
          REGISTRY_ID="crpnhk1hs1gsai91b164"
          RUNTIME_SA_ID="ajems6nusv4frv6f29vt"
          GATEWAY_SA_ID="aje1rm15eom0se5ivo2o"
          LOCKBOX_ID="e6qb8b3u57e71731j1os"
          CONTAINER_ID="bba6lj5ggejtop0jl5k8"
          GATEWAY_ID="d5deoa6cl4irtmkp5ad6"

          # This value only enables count-based addresses during import.
          # It is never applied; the deploy workflow supplies the real image URL.
          MCP_IMAGE_URL="state-migration-placeholder"

          FAILED_IMPORTS=()
          FAILED_IMPORT_COUNT=0

          import_if_absent() {
            local address="$1"
            local resource_id="$2"
            if terraform -chdir=terraform state list | grep -Fxq "$address"; then
              echo "Already present in remote state: $address"
            elif ! terraform -chdir=terraform import -input=false \
              -var="mcp_image_url=$MCP_IMAGE_URL" "$address" "$resource_id"; then
              FAILED_IMPORTS+=("$address")
              ((FAILED_IMPORT_COUNT += 1))
            fi
          }

          import_if_absent yandex_resourcemanager_folder.mcp_test "$FOLDER_ID"
          import_if_absent yandex_container_registry.mcp "$REGISTRY_ID"
          import_if_absent yandex_iam_service_account.runtime "$RUNTIME_SA_ID"
          import_if_absent yandex_iam_service_account.gateway "$GATEWAY_SA_ID"
          import_if_absent yandex_resourcemanager_folder_iam_member.runtime_registry_pull "$FOLDER_ID,container-registry.images.puller,serviceAccount:$RUNTIME_SA_ID"
          import_if_absent yandex_resourcemanager_folder_iam_member.runtime_lockbox_viewer "$FOLDER_ID,lockbox.payloadViewer,serviceAccount:$RUNTIME_SA_ID"
          import_if_absent yandex_lockbox_secret.marketplace_credentials "$LOCKBOX_ID"
          import_if_absent 'yandex_serverless_container.mcp[0]' "$CONTAINER_ID"
          import_if_absent 'yandex_serverless_container_iam_member.gateway_invoker[0]' "$CONTAINER_ID,serverless-containers.containerInvoker,serviceAccount:$GATEWAY_SA_ID"

          if (( FAILED_IMPORT_COUNT > 0 )); then
            {
              echo "## Terraform state migration needs attention"
              echo
              echo "The following existing resources could not be imported:"
              printf '%s\\n' "${FAILED_IMPORTS[@]}" | sed 's/^/- `/' | sed 's/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
            for address in "${FAILED_IMPORTS[@]}"; do
              echo "::error title=Terraform state import failed::$address"
            done
            exit 1
          fi

      - name: Verify imported state without changing infrastructure
        shell: bash
        run: |
          set -euo pipefail
          # Import verification only: no plan is applied from this workflow.
          MCP_IMAGE_URL="state-migration-placeholder"

          set +e
          terraform -chdir=terraform plan -detailed-exitcode -input=false -var="mcp_image_url=$MCP_IMAGE_URL"
          PLAN_EXIT_CODE=$?
          set -e

          if [[ "$PLAN_EXIT_CODE" -eq 0 ]]; then
            echo "Remote state import is complete; the plan is empty."
          elif [[ "$PLAN_EXIT_CODE" -eq 2 ]]; then
            echo "Remote state import is complete. Terraform detected drift; no infrastructure changes were applied."
          else
            exit "$PLAN_EXIT_CODE"
          fi

      - name: Remove ephemeral CI key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json"
