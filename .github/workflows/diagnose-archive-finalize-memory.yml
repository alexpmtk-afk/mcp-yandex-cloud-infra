name: Diagnose Archive Finalize Memory

on:
  push:
    paths:
      - 'control/run-archive-finalize-memory-diag.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
      CLOUD_ID: b1gi4pr9msenirafh2c7
      FOLDER_NAME: marketplaces-mcp-test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install Yandex CLI and app dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL --retry 5 --retry-delay 3 https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
          python -m pip install --quiet -e ./app
      - name: Resolve archive bucket and IAM token
        shell: bash
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY"
          chmod 600 "$KEY"
          yc config profile create finalize-memory-diag || true
          yc config set service-account-key "$KEY"
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r --arg n "$FOLDER_NAME" '.[]|select(.name==$n)|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          BUCKET="$(yc storage bucket list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|startswith("marketplaces-mcp-archive-"))][0].name//empty')"
          test -n "$BUCKET"
          TOKEN="$(yc iam create-token)"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          printf '%s' "$BUCKET" > "$RUNNER_TEMP/bucket"
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/token"
          chmod 600 "$RUNNER_TEMP/token"
      - name: Download exact annual and Laser staging files from Yandex backup
        shell: bash
        run: |
          set -euo pipefail
          export BUCKET="$(cat "$RUNNER_TEMP/bucket")"
          export IAM_TOKEN="$(cat "$RUNNER_TEMP/token")"
          python -u - <<'PY'
          import os, urllib.parse, httpx
          out=os.environ['RUNNER_TEMP']
          items={
            'dmitrieva.csv':'База данных/WB/wb_dmitrieva/2026/finance/weekly/main/wb_dmitrieva__weekly_main__2026.csv',
            'novokshenov.csv':'База данных/WB/wb_novokshenov/2026/finance/weekly/main/wb_novokshenov__weekly_main__2026.csv',
            'laser.csv':'База данных/WB/wb_laser_master/2026/finance/weekly/main/wb_laser_master__weekly_main__2026.csv',
            'laser-stage.csv':'app/jobs/wb-finance/wb-finance-wb_laser_master-2026/staging/report-736978984.csv',
          }
          headers={'Authorization':'Bearer '+os.environ['IAM_TOKEN']}
          with httpx.Client(timeout=120, follow_redirects=True) as c:
            for name,key in items.items():
              url='https://storage.yandexcloud.net/'+os.environ['BUCKET']+'/'+urllib.parse.quote(key,safe='/-_.~')
              r=c.get(url,headers=headers)
              r.raise_for_status()
              path=os.path.join(out,name)
              open(path,'wb').write(r.content)
              print(f'FILE={name} BYTES={len(r.content)}')
          PY
      - name: Profile exact current merge algorithm
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/profile_merge.py" <<'PY'
          import os, sys, resource
          sys.path.insert(0, os.path.abspath('app'))
          from core.wb_finance_archive import merge_annual_csv, parse_csv_bytes
          annual_path=sys.argv[1]
          stage_path=sys.argv[2] if len(sys.argv)>2 else ''
          existing=open(annual_path,'rb').read()
          stage_rows=[]
          if stage_path:
              stage_raw=open(stage_path,'rb').read()
              _, stage_rows=parse_csv_bytes(stage_raw)
              print(f'STAGE_ROWS={len(stage_rows)} STAGE_BYTES={len(stage_raw)}', flush=True)
          merged, stats=merge_annual_csv(existing, stage_rows)
          rss_kb=resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
          print(f'ANNUAL_BYTES={len(existing)} MERGED_BYTES={len(merged)} TOTAL_ROWS={stats.get("total_rows")} ADDED_ROWS={stats.get("added_rows")} PEAK_RSS_KB={rss_kb} PEAK_RSS_MIB={rss_kb/1024:.1f}', flush=True)
          PY
          for f in dmitrieva novokshenov; do
            echo "=== PROFILE_${f^^} ==="
            /usr/bin/time -v python "$RUNNER_TEMP/profile_merge.py" "$RUNNER_TEMP/$f.csv" 2>&1 | grep -E 'ANNUAL_BYTES|Maximum resident set size|Elapsed'
          done
          echo '=== PROFILE_LASER_CURRENT_FINALIZE ==='
          /usr/bin/time -v python "$RUNNER_TEMP/profile_merge.py" "$RUNNER_TEMP/laser.csv" "$RUNNER_TEMP/laser-stage.csv" 2>&1 | grep -E 'STAGE_ROWS|ANNUAL_BYTES|Maximum resident set size|Elapsed'
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/token" "$RUNNER_TEMP/bucket" "$RUNNER_TEMP/dmitrieva.csv" "$RUNNER_TEMP/novokshenov.csv" "$RUNNER_TEMP/laser.csv" "$RUNNER_TEMP/laser-stage.csv" "$RUNNER_TEMP/profile_merge.py"
