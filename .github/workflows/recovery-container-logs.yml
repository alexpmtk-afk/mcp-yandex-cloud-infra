name: Recovery Container Startup Logs

on:
  push:
    branches:
      - recovery/marketplaces-mcp-deploy-20260830
    paths:
      - '.github/workflows/recovery-container-logs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --fail --silent --show-error -o "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Read startup failure
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create marketplaces-logs || true
          yc config set service-account-key "$KEY_FILE"
          CLOUD_ID="b1gi4pr9msenirafh2c7"
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[] | select(.name == "marketplaces-mcp-test") | .id' | head -1)"
          yc config set folder-id "$FOLDER_ID"
          CONTAINER_ID="$(yc serverless container list --folder-id "$FOLDER_ID" --format json | jq -r '.[] | select(.name == "marketplaces-mcp-test") | .id' | head -1)"
          test -n "$CONTAINER_ID"
          echo "container_revision_summary_begin"
          yc serverless container revision list --container-id "$CONTAINER_ID" --format json | jq '[.[0:3][] | {id,created_at,status,image:.image.image_url,network_id:.connectivity.network_id}]'
          echo "container_revision_summary_end"
          echo "container_logs_begin"
          yc logging read --resource-ids="$CONTAINER_ID" --since '1h ago' --limit 200 || true
          echo "container_logs_end"
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json"
