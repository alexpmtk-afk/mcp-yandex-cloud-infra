name: Diagnose Bridge v1 Lockbox Create Permission

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bridge-v1-lockbox-policy-diagnostic.yml'
      - 'control/diagnose-bridge-v1-lockbox-policy.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -o "$RUNNER_TEMP/yc.tgz" \
            'https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate CI service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          DEPLOYER_ID="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          test -n "$DEPLOYER_ID"
          echo "DEPLOYER_ID=$DEPLOYER_ID" >> "$GITHUB_ENV"
          yc config profile create bridge-policy-diag || true
          yc config set service-account-key "$KEY_FILE"

      - name: Inspect cloud and access-policy bindings
        shell: bash
        env:
          CLOUD_ID: b1gi4pr9msenirafh2c7
        run: |
          set -euo pipefail
          echo "DEPLOYER_ID=$DEPLOYER_ID"
          yc resource-manager cloud get "$CLOUD_ID" --format json > "$RUNNER_TEMP/cloud.json"
          ORG_ID="$(jq -r '.organization_id // .organizationId // empty' "$RUNNER_TEMP/cloud.json")"
          echo "CLOUD_ID=$CLOUD_ID"
          echo "ORGANIZATION_ID=${ORG_ID:-UNAVAILABLE}"

          set +e
          yc resource-manager cloud list-access-policy-bindings "$CLOUD_ID" --format json > "$RUNNER_TEMP/cloud-policies.json" 2> "$RUNNER_TEMP/cloud-policies.err"
          CLOUD_POLICY_RC=$?
          set -e
          echo "CLOUD_POLICY_QUERY_RC=$CLOUD_POLICY_RC"
          if [[ "$CLOUD_POLICY_RC" -eq 0 ]]; then
            jq -c '.[]? | {template_id:(.access_policy_template_id // .accessPolicyTemplateId), parameters}' "$RUNNER_TEMP/cloud-policies.json" || true
          else
            sed -n '1,5p' "$RUNNER_TEMP/cloud-policies.err"
          fi

          if [[ -n "$ORG_ID" ]]; then
            set +e
            yc organization-manager organization list-access-policy-bindings --id "$ORG_ID" --format json > "$RUNNER_TEMP/org-policies.json" 2> "$RUNNER_TEMP/org-policies.err"
            ORG_POLICY_RC=$?
            set -e
            echo "ORG_POLICY_QUERY_RC=$ORG_POLICY_RC"
            if [[ "$ORG_POLICY_RC" -eq 0 ]]; then
              jq -c '.[]? | {template_id:(.access_policy_template_id // .accessPolicyTemplateId), parameters}' "$RUNNER_TEMP/org-policies.json" || true
            else
              sed -n '1,5p' "$RUNNER_TEMP/org-policies.err"
            fi
          fi

      - name: Inspect direct TEST-folder roles for deployer
        shell: bash
        env:
          CLOUD_ID: b1gi4pr9msenirafh2c7
        run: |
          set -euo pipefail
          for folder_name in marketplaces-mcp-test birzha-mcp-forecast-test; do
            FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r --arg n "$folder_name" '.[]|select(.name==$n)|.id' | head -1)"
            test -n "$FOLDER_ID"
            echo "FOLDER=$folder_name ID=$FOLDER_ID"
            yc resource-manager folder list-access-bindings "$FOLDER_ID" --format json > "$RUNNER_TEMP/$folder_name-access.json"
            jq -c --arg sid "$DEPLOYER_ID" '.[]? | select((.subject.id // "") == $sid) | {role_id,subject}' "$RUNNER_TEMP/$folder_name-access.json" || true
            echo "EXISTING_LOCKBOX_METADATA:"
            yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -c '.[]? | {id,name,status,deletion_protection}' || true
          done

      - name: Verify role definitions are visible
        shell: bash
        run: |
          set -euo pipefail
          for role in lockbox.admin lockbox.editor lockbox.payloadViewer; do
            set +e
            yc iam role get "$role" --format json > "$RUNNER_TEMP/role.json" 2> "$RUNNER_TEMP/role.err"
            RC=$?
            set -e
            echo "ROLE=$role QUERY_RC=$RC"
            if [[ "$RC" -eq 0 ]]; then jq -c '{id,name,description}' "$RUNNER_TEMP/role.json"; else sed -n '1,2p' "$RUNNER_TEMP/role.err"; fi
          done
          echo 'DIAGNOSTIC_ONLY=PASS'
          echo 'RESOURCE_MUTATIONS=NONE'

      - name: Cleanup credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP"/*.json "$RUNNER_TEMP"/*.err
