name: Diagnose MCP Readiness Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-mcp-readiness-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe unauthenticated MCP initialize
        shell: bash
        run: |
          set -euo pipefail
          URL='https://d5deoa6cl4irtmkp5ad6.bu9mdbe1.apigw.yandexcloud.net/mcp'
          CODE="$(curl -sS --max-time 30 -D "$RUNNER_TEMP/headers" -o "$RUNNER_TEMP/body" -w '%{http_code}' -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"unauth-diagnostic","version":"1"}}}' || true)"
          echo "UNAUTH_STATUS=$CODE"
          echo '--- response headers ---'
          sed -n '1,30p' "$RUNNER_TEMP/headers" | sed -E 's/(set-cookie:).*/\1 [redacted]/I'
          echo '--- response body ---'
          head -c 1500 "$RUNNER_TEMP/body" || true
          echo
