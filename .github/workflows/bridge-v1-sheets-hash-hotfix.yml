name: Bridge v1 Sheets hash hotfix

on:
  push:
    paths:
      - '.github/workflows/bridge-v1-sheets-hash-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Python sheet chunk canonicalization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          client = Path('shared/google-drive-bridge/python_client/bridge_client.py')
          text = client.read_text(encoding='utf-8')

          old_import = 'import json\nimport random\n'
          new_import = 'import json\nimport math\nimport random\n'
          if new_import not in text:
              if old_import not in text:
                  raise SystemExit('expected import anchor not found')
              text = text.replace(old_import, new_import, 1)

          old_hash = 'chunk_sha = hashlib.sha256(json.dumps(values, ensure_ascii=False, separators=(",", ":")).encode("utf-8")).hexdigest()'
          new_hash = 'chunk_sha = hashlib.sha256(json.dumps(_normalize_js_json(values), ensure_ascii=False, separators=(",", ":")).encode("utf-8")).hexdigest()'
          if new_hash not in text:
              if old_hash not in text:
                  raise SystemExit('expected sheet hash anchor not found')
              text = text.replace(old_hash, new_hash, 1)

          helper_anchor = '\n\ndef _is_sha256(value: str) -> bool:\n'
          helper = '''\n\ndef _normalize_js_json(value: Any) -> Any:\n    \"\"\"Normalize JSON values to Apps Script JSON.stringify number semantics.\n\n    In particular, JSON.parse/JSON.stringify collapses integral JSON numbers such\n    as 100.0 to 100 and negative zero to 0. Python json.dumps preserves 100.0,\n    which would otherwise produce a different SHA256 for the same parsed values.\n    \"\"\"\n    if isinstance(value, float):\n        if not math.isfinite(value):\n            raise ValueError(\"sheet values must not contain NaN or Infinity\")\n        if value == 0.0 or value.is_integer():\n            return int(value)\n        return value\n    if isinstance(value, list):\n        return [_normalize_js_json(item) for item in value]\n    if isinstance(value, dict):\n        return {key: _normalize_js_json(item) for key, item in value.items()}\n    return value\n'''
          if 'def _normalize_js_json(value: Any) -> Any:' not in text:
              if helper_anchor not in text:
                  raise SystemExit('expected helper anchor not found')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          client.write_text(text, encoding='utf-8')

          test = Path('shared/google-drive-bridge/tests/test_protocol_contract.py')
          t = test.read_text(encoding='utf-8')
          if 'test_sheet_chunk_hash_normalizes_integral_float_like_json_stringify' not in t:
              t = t.replace(
                  'from bridge_client import _confirmed_offset  # noqa: E402',
                  'from bridge_client import _confirmed_offset, _normalize_js_json  # noqa: E402',
                  1,
              )
              t += '''\n\ndef test_sheet_chunk_hash_normalizes_integral_float_like_json_stringify() -> None:\n    import json\n    values = [[1, 100.0, 101.5, -0.0]]\n    canonical = json.dumps(_normalize_js_json(values), ensure_ascii=False, separators=(\",\", \":\"))\n    assert canonical == \"[[1,100,101.5,0]]\"\n'''
              test.write_text(t, encoding='utf-8')
          PY
          python -m pytest -q shared/google-drive-bridge/tests
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shared/google-drive-bridge/python_client/bridge_client.py shared/google-drive-bridge/tests/test_protocol_contract.py
          git commit -m 'Bridge v1: canonicalize Sheets chunk hash numbers'
          git push origin HEAD:main
