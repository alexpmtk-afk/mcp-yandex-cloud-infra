name: Identify Yandex billing audit service account temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/yandex-billing-usage-audit-20260917-temp.yml']
permissions:
  contents: read
jobs:
  identify:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 3
    steps:
      - name: Identify service account
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSLo "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          export PATH="$RUNNER_TEMP/yc:$PATH"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"
          chmod 600 "$RUNNER_TEMP/key.json"
          SA_ID=$(jq -r '.service_account_id // .serviceAccountId' "$RUNNER_TEMP/key.json")
          yc config profile create identify-billing-auditor || true
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          yc iam service-account get "$SA_ID" --format json | jq '{id,name,description,folder_id}'
          rm -f "$RUNNER_TEMP/key.json"
