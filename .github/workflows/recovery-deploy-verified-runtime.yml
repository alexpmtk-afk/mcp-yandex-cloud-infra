name: Recovery Deploy Verified Marketplace Runtime

on:
  push:
    branches: [recovery/marketplaces-mcp-deploy-20260830]
    paths: ['.github/workflows/recovery-deploy-verified-runtime.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsS -o "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Resolve existing TEST resources
        id: r
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY"
          chmod 600 "$KEY"
          yc config profile create marketplace-runtime-deploy || true
          yc config set service-account-key "$KEY"
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          VERSION_ID="$(yc lockbox secret list-versions --id "$SECRET_ID" --format json | jq -r '[.[]|select(.status=="ACTIVE")][0].id')"
          CONTAINER_ID="$(yc serverless container list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          RUNTIME_SA="$(yc iam service-account list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-runtime")|.id'|head -1)"
          REGISTRY_ID="$(yc container registry list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp")|.id'|head -1)"
          NETWORK_ID="$(yc vpc network list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-net")|.id'|head -1)"
          CLUSTER_ID="$(yc managed-redis cluster list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-valkey")|.id'|head -1)"
          REDIS_HOST="$(yc managed-redis hosts list --cluster-id "$CLUSTER_ID" --format json | jq -r '.[0].name')"
          DOMAIN="$(yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//.[0].domain')"
          for v in FOLDER_ID SECRET_ID VERSION_ID CONTAINER_ID RUNTIME_SA REGISTRY_ID NETWORK_ID REDIS_HOST DOMAIN; do test -n "${!v}"; done
          echo "folder=$FOLDER_ID" >> "$GITHUB_OUTPUT"
          echo "secret=$SECRET_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "container=$CONTAINER_ID" >> "$GITHUB_OUTPUT"
          echo "sa=$RUNTIME_SA" >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY_ID" >> "$GITHUB_OUTPUT"
          echo "network=$NETWORK_ID" >> "$GITHUB_OUTPUT"
          echo "redis_host=$REDIS_HOST" >> "$GITHUB_OUTPUT"
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "resources_resolved=true"
      - name: Build and push verified image
        id: image
        shell: bash
        env:
          REGISTRY_ID: ${{ steps.r.outputs.registry }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sed -n 's/.*@\([0-9a-f]\{40\}\).*/\1/p' app/.source-revision)"
          test "$SOURCE_SHA" = "0955be12ea3f20ce128bd47e977995fae511c337"
          python -m compileall -q app/core app/wb_mcp app/ozon_mcp app/ozon_perf_mcp
          IMAGE="cr.yandex/${REGISTRY_ID}/marketplaces-mcp:${SOURCE_SHA:0:12}"
          docker build --label "org.opencontainers.image.revision=$SOURCE_SHA" -t "$IMAGE" app
          yc iam create-token | docker login --username iam --password-stdin cr.yandex
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "verified_image_published=true"
      - name: Deploy new revision
        id: d
        shell: bash
        env:
          FOLDER_ID: ${{ steps.r.outputs.folder }}
          SECRET_ID: ${{ steps.r.outputs.secret }}
          VERSION_ID: ${{ steps.r.outputs.version }}
          CONTAINER_ID: ${{ steps.r.outputs.container }}
          RUNTIME_SA: ${{ steps.r.outputs.sa }}
          NETWORK_ID: ${{ steps.r.outputs.network }}
          REDIS_HOST: ${{ steps.r.outputs.redis_host }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          yc serverless container revision deploy \
            --container-id "$CONTAINER_ID" --folder-id "$FOLDER_ID" \
            --image "$IMAGE" --memory 512MB --cores 1 --execution-timeout 60s --concurrency 8 \
            --service-account-id "$RUNTIME_SA" --network-id "$NETWORK_ID" \
            --environment "MARKETPLACE_REQUIRE_REDIS=1,MARKETPLACE_MCP_REDIS_HOST=$REDIS_HOST,MARKETPLACE_MCP_REDIS_PORT=6380,MARKETPLACE_MCP_REDIS_TLS=1,MARKETPLACE_MCP_REDIS_CA_CERT=/opt/yandex/YandexInternalRootCA.crt,WB_GLOBAL_RPS=5,OZON_GLOBAL_RPS=20,OZON_PERF_GLOBAL_RPS=10" \
            --secret "environment-variable=MARKETPLACE_MCP_CABINETS_JSON,id=$SECRET_ID,version-id=$VERSION_ID,key=cabinets_json" \
            --secret "environment-variable=MARKETPLACE_MCP_BEARER_TOKEN,id=$SECRET_ID,version-id=$VERSION_ID,key=mcp_bearer_token" \
            --secret "environment-variable=MARKETPLACE_MCP_REDIS_PASSWORD,id=$SECRET_ID,version-id=$VERSION_ID,key=redis_password" \
            --format json --no-user-output > "$RUNNER_TEMP/revision.json"
          REV="$(jq -r '.id//empty' "$RUNNER_TEMP/revision.json")"
          test -n "$REV"
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "new_revision_deployed=true"
      - name: Basic remote proof
        shell: bash
        env:
          DOMAIN: ${{ steps.r.outputs.domain }}
          SECRET_ID: ${{ steps.r.outputs.secret }}
          VERSION_ID: ${{ steps.r.outputs.version }}
        run: |
          set -euo pipefail
          yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/sec.json"
          BEARER="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value' "$RUNNER_TEMP/sec.json")"
          echo "::add-mask::$BEARER"
          BASE="https://$DOMAIN"
          for i in $(seq 1 12); do
            CODE="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/h" -w '%{http_code}' "$BASE/healthz" || true)"
            [[ "$CODE" == 200 ]] && break
            sleep 5
          done
          test "$CODE" = 200
          UNAUTH="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/u" -w '%{http_code}' -X POST "$BASE/mcp" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"unauth","version":"1"}}}')"
          test "$UNAUTH" = 401
          AUTH="$(curl -sS --max-time 60 -o "$RUNNER_TEMP/a" -w '%{http_code}' -X POST "$BASE/mcp" -H "Authorization: Bearer $BEARER" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data '{"jsonrpc":"2.0","id":2,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"auth","version":"1"}}}')"
          test "$AUTH" = 200
          echo "health_200=true"
          echo "unauthorized_401=true"
          echo "authenticated_mcp_200=true"
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/revision.json" "$RUNNER_TEMP/sec.json" "$RUNNER_TEMP/h" "$RUNNER_TEMP/u" "$RUNNER_TEMP/a"
