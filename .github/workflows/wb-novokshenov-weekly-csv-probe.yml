name: WB Novokshenov Weekly CSV Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wb-novokshenov-weekly-csv-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          ARCHIVE="$RUNNER_TEMP/yc/yc.tgz"
          ok=0
          for attempt in $(seq 1 6); do
            if timeout 75s wget -q --continue --timeout=30 --tries=2 --retry-connrefused --output-document="$ARCHIVE" "$URL"; then
              if tar -tzf "$ARCHIVE" >/dev/null 2>&1; then ok=1; break; fi
              rm -f "$ARCHIVE"
            fi
            sleep 3
          done
          test "$ok" = 1
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Resolve TEST MCP endpoint and bearer
        id: target
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          DOMAIN="$(timeout 45s yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//.[0].domain//empty')"
          SECRET_ID="$(timeout 45s yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          VERSION_ID="$(timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json | jq -r '[.[]|select(.status=="ACTIVE")][0].id')"
          timeout 45s yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/sec.json"
          BEARER="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value' "$RUNNER_TEMP/sec.json")"
          test -n "$DOMAIN" && test -n "$BEARER"
          echo "::add-mask::$BEARER"
          printf '%s' "$BEARER" > "$RUNNER_TEMP/bearer"
          chmod 600 "$RUNNER_TEMP/bearer"
          echo "url=https://${DOMAIN}/mcp" >> "$GITHUB_OUTPUT"

      - name: Download full latest weekly report and measure raw CSV
        shell: bash
        timeout-minutes: 15
        env:
          MCP_URL: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          export MCP_BEARER="$(cat "$RUNNER_TEMP/bearer")"
          export CSV_PATH="$RUNNER_TEMP/wb_novokshenov_weekly.csv"
          python -m pip install --quiet 'httpx>=0.27,<1'
          timeout 840s python -u - <<'PY'
          import csv, datetime, hashlib, itertools, json, os, time
          import httpx

          def unpack(r):
              r.raise_for_status()
              for line in r.text.splitlines():
                  if line.startswith('data:'):
                      return json.loads(line[5:].strip())
              return r.json() if r.text.strip() else None

          def retry_after(data):
              return float(data.get('retry_after_seconds',0) or data.get('retry_after_sec',0) or 0)

          def is_rate_limited(data):
              return retry_after(data) > 0 and (data.get('error_type') == 'rate_limit' or data.get('error') in ('rate_limit','rate_limit_busy'))

          timeout=httpx.Timeout(connect=10.0,read=90.0,write=30.0,pool=10.0)
          headers={'Authorization':'Bearer '+os.environ['MCP_BEARER'],'Accept':'application/json, text/event-stream','Content-Type':'application/json'}
          ids=itertools.count(1)
          with httpx.Client(timeout=timeout,follow_redirects=True) as c:
              r=c.post(os.environ['MCP_URL'],headers=headers,json={'jsonrpc':'2.0','id':next(ids),'method':'initialize','params':{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'wb-weekly-csv-probe','version':'1'}}})
              init=unpack(r); assert init and 'result' in init,init
              h=dict(headers); sid=r.headers.get('mcp-session-id')
              if sid: h['Mcp-Session-Id']=sid
              h['MCP-Protocol-Version']=init['result'].get('protocolVersion','2025-06-18')
              n=c.post(os.environ['MCP_URL'],headers=h,json={'jsonrpc':'2.0','method':'notifications/initialized'}); assert n.status_code in (200,202)

              def rpc(method,params=None):
                  rr=c.post(os.environ['MCP_URL'],headers=h,json={'jsonrpc':'2.0','id':next(ids),'method':method,'params':params or {}})
                  d=unpack(rr); assert d and 'result' in d,(method,d); return d['result']

              def call(name,args):
                  result=rpc('tools/call',{'name':name,'arguments':args}); assert not result.get('isError'),(name,result)
                  text=next((x.get('text') for x in result.get('content',[]) if x.get('type')=='text'),None); assert text is not None,name
                  return json.loads(text)

              def call_wait(name,args):
                  deadline=time.monotonic()+150
                  while True:
                      data=call(name,args)
                      if not is_rate_limited(data): return data
                      wait=max(1.0,retry_after(data)+1.0)
                      assert time.monotonic()+wait <= deadline,(name,data)
                      print(f'{name}=WAIT_FOR_QUOTA seconds={wait:.2f}',flush=True)
                      time.sleep(wait)

              today=datetime.date.today()
              list_data=call_wait('wb_list_realization_reports',{
                  'seller':'wb_novokshenov',
                  'date_from':(today-datetime.timedelta(days=60)).isoformat(),
                  'date_to':today.isoformat(),
                  'period':'weekly','limit':1000,'offset':0,
              })
              assert list_data.get('ok') is True and int(list_data.get('status',0))==200,list_data
              reports=list_data.get('data') or []
              assert reports,'weekly report list is empty'
              latest=max(reports,key=lambda x:(str(x.get('dateTo','')),str(x.get('createDate','')),int(x.get('reportId',0))))
              report_id=int(latest['reportId'])

              all_rows=[]
              rrd_id=0
              page_calls=0
              while True:
                  detail=call_wait('wb_get_realization_report_by_id',{
                      'seller':'wb_novokshenov','report_id':report_id,'limit':100000,'rrd_id':rrd_id,
                  })
                  assert detail.get('ok') is True,detail
                  status=int(detail.get('status',0))
                  page_calls += 1
                  if status==204:
                      break
                  assert status==200,detail
                  rows=detail.get('data') or []
                  assert isinstance(rows,list),type(rows)
                  if not rows:
                      raise AssertionError('WB returned 200 with empty detail list instead of terminal 204')
                  all_rows.extend(rows)
                  last=rows[-1]
                  new_rrd=last.get('rrdId') if isinstance(last,dict) else None
                  assert new_rrd is not None and int(new_rrd)!=int(rrd_id),(rrd_id,new_rrd)
                  rrd_id=int(new_rrd)
                  print(f'WB_PAGE_ACCEPTED rows={len(rows)} cumulative_rows={len(all_rows)} next_rrd_id={rrd_id}',flush=True)

              assert all_rows,'report has no detail rows'
              columns=[]; seen=set()
              for row in all_rows:
                  assert isinstance(row,dict),type(row)
                  for key in row:
                      if key not in seen:
                          seen.add(key); columns.append(key)

              def scalar(v):
                  if v is None: return ''
                  if isinstance(v,(dict,list)): return json.dumps(v,ensure_ascii=False,separators=(',',':'))
                  if isinstance(v,bool): return 'true' if v else 'false'
                  return str(v)

              path=os.environ['CSV_PATH']
              with open(path,'w',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=columns,extrasaction='raise',lineterminator='\n')
                  w.writeheader()
                  for row in all_rows:
                      w.writerow({k:scalar(row.get(k)) for k in columns})

              size=os.path.getsize(path)
              sha=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): sha.update(chunk)
              meta={
                  'marketplace':'wb','cabinet':'wb_novokshenov','dataset':'finance_weekly',
                  'reportId':report_id,'dateFrom':latest.get('dateFrom'),'dateTo':latest.get('dateTo'),
                  'createDate':latest.get('createDate'),'sellerFinanceName':latest.get('sellerFinanceName'),
                  'rows':len(all_rows),'columns':len(columns),'bytes':size,
                  'megabytes':round(size/1024/1024,3),'sha256':sha.hexdigest(),
                  'detail_calls_including_terminal_204':page_calls,
                  'last_rrd_id':rrd_id,
                  'csv_encoding':'utf-8','csv_delimiter':',',
              }
              print('WB_WEEKLY_FULL_CSV_META='+json.dumps(meta,ensure_ascii=False,sort_keys=True),flush=True)
              print('WB_WEEKLY_FULL_CSV_PROBE=PASS',flush=True)
          PY
          rm -f "$CSV_PATH"
          test ! -e "$CSV_PATH"
          echo 'CSV_SECURE_CLEANUP=PASS'

      - name: Cleanup credentials and report data
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/sec.json" "$RUNNER_TEMP/bearer" "$RUNNER_TEMP/wb_novokshenov_weekly.csv"
