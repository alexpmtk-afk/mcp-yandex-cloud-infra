name: Recovery Remote MCP Diagnose

on:
  push:
    branches:
      - recovery/marketplaces-mcp-deploy-20260830
    paths:
      - '.github/workflows/recovery-remote-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --fail --silent --show-error -o "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Diagnose live endpoint
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create marketplaces-remote-diag || true
          yc config set service-account-key "$KEY_FILE"
          CLOUD_ID="b1gi4pr9msenirafh2c7"
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[] | select(.name == "marketplaces-mcp-test") | .id' | head -1)"
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[] | select(.name == "marketplaces-mcp-api-credentials") | .id' | head -1)"
          ACTIVE_VERSION="$(yc lockbox secret list-versions --id "$SECRET_ID" --format json | jq -r '[.[] | select((.status // "") == "ACTIVE")][0].id // empty')"
          CONTAINER_ID="$(yc serverless container list --folder-id "$FOLDER_ID" --format json | jq -r '.[] | select(.name == "marketplaces-mcp-test") | .id' | head -1)"
          GATEWAY_DOMAIN="$(yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[] | select((.name // "") | contains("marketplaces"))][0].domain // .[0].domain // empty')"
          test -n "$SECRET_ID"; test -n "$ACTIVE_VERSION"; test -n "$CONTAINER_ID"; test -n "$GATEWAY_DOMAIN"
          yc lockbox payload get --id "$SECRET_ID" --version-id "$ACTIVE_VERSION" --format json --no-user-output > "$RUNNER_TEMP/marketplace-secret-diag.json"
          MCP_BEARER="$(jq -r '.entries[] | select(.key == "mcp_bearer_token") | .text_value' "$RUNNER_TEMP/marketplace-secret-diag.json")"
          test -n "$MCP_BEARER"
          echo "::add-mask::$MCP_BEARER"
          BASE_URL="https://$GATEWAY_DOMAIN"

          HEALTH_STATUS="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/health.out" -w '%{http_code}' "$BASE_URL/healthz" || true)"
          echo "health_status=$HEALTH_STATUS"
          printf 'health_body='; head -c 500 "$RUNNER_TEMP/health.out" 2>/dev/null | tr '\n' ' ' || true; echo

          UNAUTH_STATUS="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/unauth.out" -w '%{http_code}' -X POST "$BASE_URL/mcp" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"unauth-diag","version":"1"}}}' || true)"
          echo "unauth_status=$UNAUTH_STATUS"
          printf 'unauth_body='; head -c 500 "$RUNNER_TEMP/unauth.out" 2>/dev/null | tr '\n' ' ' || true; echo

          AUTH_STATUS="$(curl -sS --max-time 30 -D "$RUNNER_TEMP/auth.headers" -o "$RUNNER_TEMP/auth.out" -w '%{http_code}' -X POST "$BASE_URL/mcp" -H "Authorization: Bearer $MCP_BEARER" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data '{"jsonrpc":"2.0","id":2,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"auth-diag","version":"1"}}}' || true)"
          echo "auth_initialize_status=$AUTH_STATUS"
          if grep -qi '^mcp-session-id:' "$RUNNER_TEMP/auth.headers"; then echo "auth_session_header=true"; else echo "auth_session_header=false"; fi
          printf 'auth_body='; head -c 1000 "$RUNNER_TEMP/auth.out" 2>/dev/null | tr '\n' ' ' || true; echo

          echo "recent_container_logs_begin"
          yc logging read --resource-ids="$CONTAINER_ID" --since '20m ago' --limit 80 --format json 2>/dev/null \
            | jq -r '.[] | [(.timestamp // ""), (.level // ""), ((.message // .json_payload.message // .text_payload // "")|tostring)] | @tsv' \
            | tail -40 || true
          echo "recent_container_logs_end"
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/marketplace-secret-diag.json" "$RUNNER_TEMP/health.out" "$RUNNER_TEMP/unauth.out" "$RUNNER_TEMP/auth.out" "$RUNNER_TEMP/auth.headers"
