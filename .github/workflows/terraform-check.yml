name: Terraform Check

on:
  pull_request:
    paths:
      - "terraform/**"
      - "environments/**"
      - "docs/**"
      - ".github/workflows/terraform-check.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "environments/**"
      - "docs/**"
      - ".github/workflows/terraform-check.yml"

permissions:
  contents: read

jobs:
  terraform-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Marketplace Terraform init without backend
        run: terraform -chdir=terraform init -backend=false

      - name: Marketplace Terraform validate
        run: terraform -chdir=terraform validate

      - name: BIRZHA Terraform init without backend using committed lockfile
        run: terraform -chdir=terraform/birzha_test init -backend=false -lockfile=readonly

      - name: BIRZHA Terraform validate
        run: terraform -chdir=terraform/birzha_test validate

  birzha-publisher-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Prepare ephemeral Yandex provider key
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "TF_VAR_yc_service_account_key_file=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Initialize isolated BIRZHA remote state using committed lockfile
        shell: bash
        env:
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$YC_TFSTATE_ACCESS_KEY"
          test -n "$YC_TFSTATE_SECRET_KEY"
          terraform -chdir=terraform/birzha_test init -reconfigure -input=false -lockfile=readonly \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" \
            -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY"

      - name: Confirm Foundation state boundary before publisher plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/birzha_test state list | sort > "$RUNNER_TEMP/state-before.txt"
          grep -Fxq 'yandex_container_registry.birzha' "$RUNNER_TEMP/state-before.txt"
          grep -Fxq 'yandex_iam_service_account.runtime' "$RUNNER_TEMP/state-before.txt"
          grep -Fxq 'yandex_iam_service_account.gateway' "$RUNNER_TEMP/state-before.txt"
          grep -Fxq 'yandex_resourcemanager_folder.birzha_test' "$RUNNER_TEMP/state-before.txt"
          grep -Fxq 'yandex_resourcemanager_folder_iam_member.runtime_registry_pull' "$RUNNER_TEMP/state-before.txt"
          ! grep -q 'yandex_serverless_container.mcp' "$RUNNER_TEMP/state-before.txt"
          ! grep -q 'yandex_api_gateway.mcp' "$RUNNER_TEMP/state-before.txt"

      - name: Build image publisher IAM plan only
        shell: bash
        run: |
          set -euo pipefail
          APP_SHA="e8463b8a034b2a7ed92ac06894ce960d9fa3a021"
          terraform -chdir=terraform/birzha_test plan \
            -lock=false \
            -input=false \
            -no-color \
            -out=publisher.tfplan \
            -var="source_commit_sha=$APP_SHA"
          terraform -chdir=terraform/birzha_test show -json publisher.tfplan > "$RUNNER_TEMP/publisher-plan.json"
          terraform -chdir=terraform/birzha_test show -no-color publisher.tfplan > "$RUNNER_TEMP/publisher-plan.txt"

      - name: Assert exact two-resource publisher delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          plan = json.loads(Path(os.environ['RUNNER_TEMP']).joinpath('publisher-plan.json').read_text())
          changes = plan.get('resource_changes', [])
          actual = {
              item['address']: item['change']['actions']
              for item in changes
              if item['change']['actions'] != ['no-op']
          }
          expected = {
              'yandex_iam_service_account.publisher': ['create'],
              'yandex_container_registry_iam_binding.publisher_push': ['create'],
          }
          if actual != expected:
              raise SystemExit(f'Unexpected publisher plan delta: {actual!r}')
          print('PUBLISHER_PLAN_EXACT_2_ADD_PASS')
          PY
          grep -Fq 'Plan: 2 to add, 0 to change, 0 to destroy.' "$RUNNER_TEMP/publisher-plan.txt"
          if grep -Eq 'yandex_serverless_container\.mcp|yandex_api_gateway\.mcp' "$RUNNER_TEMP/publisher-plan.txt"; then
            echo "Runtime resource unexpectedly present in publisher plan" >&2
            exit 1
          fi

      - name: Sanitize publisher plan
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s#${RUNNER_TEMP}#<RUNNER_TEMP>#g" "$RUNNER_TEMP/publisher-plan.txt"
          if grep -Eq 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|private_key[[:space:]]*=' "$RUNNER_TEMP/publisher-plan.txt"; then
            echo "Refusing to publish plan: secret-like material detected" >&2
            exit 1
          fi

      - name: Upload sanitized publisher plan
        uses: actions/upload-artifact@v4
        with:
          name: birzha-image-publisher-iam-plan
          path: ${{ runner.temp }}/publisher-plan.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove ephemeral provider key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json"
