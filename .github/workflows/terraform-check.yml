name: Terraform Check

on:
  pull_request:
    paths:
      - "terraform/**"
      - "environments/**"
      - "docs/**"
      - ".github/workflows/terraform-check.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "environments/**"
      - "docs/**"
      - ".github/workflows/terraform-check.yml"

permissions:
  contents: read

jobs:
  terraform-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Marketplace Terraform init without backend
        run: terraform -chdir=terraform init -backend=false

      - name: Marketplace Terraform validate
        run: terraform -chdir=terraform validate

      - name: BIRZHA Terraform init without backend using committed lockfile
        run: terraform -chdir=terraform/birzha_test init -backend=false -lockfile=readonly

      - name: BIRZHA Terraform validate
        run: terraform -chdir=terraform/birzha_test validate

  birzha-oidc-subject-plan:
    # This is a legacy, deliberately single-resource proof. It must run only on
    # OIDC-subject correction PRs; ordinary BIRZHA infrastructure changes such
    # as YDB/runtime resources are validated by terraform-check above.
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'OIDC')
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.8"

      - name: Prepare ephemeral provider key
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "TF_VAR_yc_service_account_key_file=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Initialize isolated BIRZHA remote state
        shell: bash
        env:
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          terraform -chdir=terraform/birzha_test init -reconfigure -input=false -lockfile=readonly \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" \
            -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY"

      - name: Build exact OIDC subject correction plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/birzha_test plan \
            -lock=false -input=false -no-color \
            -out=oidc-subject.tfplan \
            -var="source_commit_sha=e8463b8a034b2a7ed92ac06894ce960d9fa3a021"
          terraform -chdir=terraform/birzha_test show -json oidc-subject.tfplan > "$RUNNER_TEMP/oidc-subject-plan.json"
          terraform -chdir=terraform/birzha_test show -no-color oidc-subject.tfplan > "$RUNNER_TEMP/oidc-subject-plan.txt"

      - name: Assert only federated credential changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan=json.loads(Path(os.environ['RUNNER_TEMP']).joinpath('oidc-subject-plan.json').read_text())
          changes=[x for x in plan.get('resource_changes',[]) if x['change']['actions'] != ['no-op']]
          if len(changes) != 1:
              raise SystemExit(f'Expected exactly one changed resource, got {[x["address"] for x in changes]!r}')
          change=changes[0]
          if change['address'] != 'yandex_iam_workload_identity_federated_credential.github_image_publisher':
              raise SystemExit(f'Unexpected changed resource: {change["address"]}')
          if change['change']['actions'] not in (['update'], ['delete','create'], ['create','delete']):
              raise SystemExit(f'Unexpected credential action: {change["change"]["actions"]!r}')
          after=change['change'].get('after') or {}
          expected='repo:alexpmtk-afk@309119594/birzha-mcp-forecast@1350648480:ref:refs/heads/main'
          if after.get('external_subject_id') != expected:
              raise SystemExit('Planned external_subject_id is not the observed immutable GitHub subject')
          print('OIDC_SUBJECT_PLAN_SINGLE_RESOURCE_PASS')
          print('actions=' + ','.join(change['change']['actions']))
          PY
          ! grep -Eq 'yandex_serverless_container\.mcp|yandex_api_gateway\.mcp|lockbox' "$RUNNER_TEMP/oidc-subject-plan.txt"

      - name: Upload sanitized subject plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: birzha-oidc-subject-fix-plan
          path: ${{ runner.temp }}/oidc-subject-plan.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove ephemeral provider key
        if: always()
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json"
