name: Terraform Check

on:
  pull_request:
    paths:
      - "terraform/**"
      - "environments/**"
      - "docs/**"
      - ".github/workflows/terraform-check.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "environments/**"
      - "docs/**"
      - ".github/workflows/terraform-check.yml"

permissions:
  contents: read

jobs:
  terraform-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Marketplace Terraform init without backend
        run: terraform -chdir=terraform init -backend=false

      - name: Marketplace Terraform validate
        run: terraform -chdir=terraform validate

      - name: BIRZHA Terraform init without backend using committed lockfile
        run: terraform -chdir=terraform/birzha_test init -backend=false -lockfile=readonly

      - name: BIRZHA Terraform validate
        run: terraform -chdir=terraform/birzha_test validate

  birzha-publisher-wif-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.8"

      - name: Prepare ephemeral Yandex provider key
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "TF_VAR_yc_service_account_key_file=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Initialize isolated BIRZHA remote state using committed lockfile
        shell: bash
        env:
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$YC_TFSTATE_ACCESS_KEY"
          test -n "$YC_TFSTATE_SECRET_KEY"
          terraform -chdir=terraform/birzha_test init -reconfigure -input=false -lockfile=readonly \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" \
            -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY"

      - name: Confirm current state boundary before WIF plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/birzha_test state list | sort > "$RUNNER_TEMP/state-before.txt"
          for address in \
            yandex_container_registry.birzha \
            yandex_container_registry_iam_binding.publisher_push \
            yandex_iam_service_account.gateway \
            yandex_iam_service_account.publisher \
            yandex_iam_service_account.runtime \
            yandex_resourcemanager_folder.birzha_test \
            yandex_resourcemanager_folder_iam_member.runtime_registry_pull; do
            grep -Fxq "$address" "$RUNNER_TEMP/state-before.txt"
          done
          ! grep -q 'yandex_serverless_container.mcp' "$RUNNER_TEMP/state-before.txt"
          ! grep -q 'yandex_api_gateway.mcp' "$RUNNER_TEMP/state-before.txt"
          ! grep -qi 'lockbox' "$RUNNER_TEMP/state-before.txt"

      - name: Build publisher WIF plan only
        shell: bash
        run: |
          set -euo pipefail
          APP_SHA="e8463b8a034b2a7ed92ac06894ce960d9fa3a021"
          terraform -chdir=terraform/birzha_test plan \
            -lock=false \
            -input=false \
            -no-color \
            -out=publisher-wif.tfplan \
            -var="source_commit_sha=$APP_SHA"
          terraform -chdir=terraform/birzha_test show -json publisher-wif.tfplan > "$RUNNER_TEMP/publisher-wif-plan.json"
          terraform -chdir=terraform/birzha_test show -no-color publisher-wif.tfplan > "$RUNNER_TEMP/publisher-wif-plan.txt"

      - name: Assert exact two-resource WIF delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          plan = json.loads(Path(os.environ['RUNNER_TEMP']).joinpath('publisher-wif-plan.json').read_text())
          actual = {
              item['address']: item['change']['actions']
              for item in plan.get('resource_changes', [])
              if item['change']['actions'] != ['no-op']
          }
          expected = {
              'yandex_iam_workload_identity_oidc_federation.github_image_publisher': ['create'],
              'yandex_iam_workload_identity_federated_credential.github_image_publisher': ['create'],
          }
          if actual != expected:
              raise SystemExit(f'Unexpected publisher WIF plan delta: {actual!r}')
          print('PUBLISHER_WIF_PLAN_EXACT_2_ADD_PASS')
          PY
          grep -Fq 'Plan: 2 to add, 0 to change, 0 to destroy.' "$RUNNER_TEMP/publisher-wif-plan.txt"
          if grep -Eq 'yandex_serverless_container\.mcp|yandex_api_gateway\.mcp' "$RUNNER_TEMP/publisher-wif-plan.txt"; then
            echo "Runtime resource unexpectedly present in WIF plan" >&2
            exit 1
          fi

      - name: Sanitize WIF plan
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s#${RUNNER_TEMP}#<RUNNER_TEMP>#g" "$RUNNER_TEMP/publisher-wif-plan.txt"
          if grep -Eq 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|private_key[[:space:]]*=' "$RUNNER_TEMP/publisher-wif-plan.txt"; then
            echo "Refusing to publish plan: secret-like material detected" >&2
            exit 1
          fi

      - name: Upload sanitized WIF plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: birzha-image-publisher-wif-plan
          path: ${{ runner.temp }}/publisher-wif-plan.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove ephemeral provider key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json"
