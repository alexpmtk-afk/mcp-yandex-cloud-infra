name: Semantic Core Existing Registry Probe

on:
  push:
    branches:
      - fix/semantic-core-test-iam-20260914
    paths:
      - .github/workflows/semantic-core-existing-registry-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -o "$RUNNER_TEMP/yc.tgz" \
            'https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/yc/yc" version

      - name: Authenticate CI service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          CI_SA_ID="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          test -n "$CI_SA_ID"
          echo "CI_SA_ID=$CI_SA_ID" >> "$GITHUB_ENV"
          yc config profile create semantic-registry-probe || true
          yc config set service-account-key "$KEY_FILE"

      - name: Resolve existing TEST registry without mutations
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          REGISTRY_ID="$(timeout 45s yc container registry list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp")|.id'|head -1)"
          test -n "$REGISTRY_ID"
          REPOSITORY_ID="$(timeout 45s yc container repository list --registry-id "$REGISTRY_ID" --format json | jq -r --arg n "$REGISTRY_ID/marketplaces-mcp" '.[]|select(.name==$n)|.id'|head -1)"
          test -n "$REPOSITORY_ID"
          echo "TEST_FOLDER_ID=$FOLDER_ID" >> "$GITHUB_ENV"
          echo "TEST_REGISTRY_ID=$REGISTRY_ID" >> "$GITHUB_ENV"
          echo "TEST_REPOSITORY_ID=$REPOSITORY_ID" >> "$GITHUB_ENV"
          echo "existing_registry=$REGISTRY_ID"
          echo "existing_repository=$REPOSITORY_ID"
          echo 'REGISTRY_MUTATIONS=NONE'

      - name: Inspect effective registry gates read-only
        shell: bash
        run: |
          set -euo pipefail
          echo '--- REGISTRY METADATA ---'
          timeout 45s yc container registry get "$TEST_REGISTRY_ID" --format json || true
          echo '--- IP PERMISSIONS ---'
          timeout 45s yc container registry list-ip-permissions "$TEST_REGISTRY_ID" --format json || true
          echo '--- FOLDER BINDINGS FOR CI ---'
          timeout 45s yc resource-manager folder list-access-bindings "$TEST_FOLDER_ID" --format json \
            | jq -c --arg sid "$CI_SA_ID" '.[]? | select((.subject.id // "") == $sid) | {role_id,subject}' || true
          echo '--- REGISTRY BINDINGS FOR CI ---'
          timeout 45s yc container registry list-access-bindings "$TEST_REGISTRY_ID" --format json \
            | jq -c --arg sid "$CI_SA_ID" '.[]? | select((.subject.id // "") == $sid) | {role_id,subject}' || true
          echo '--- REPOSITORY BINDINGS FOR CI ---'
          timeout 45s yc container repository list-access-bindings "$TEST_REPOSITORY_ID" --format json \
            | jq -c --arg sid "$CI_SA_ID" '.[]? | select((.subject.id // "") == $sid) | {role_id,subject}' || true
          echo '--- EXISTING IMAGES ---'
          timeout 45s yc container image list --repository-name "$TEST_REGISTRY_ID/marketplaces-mcp" --limit 5 --format json > "$RUNNER_TEMP/images.json"
          jq -c '[.[] | {id,name,digest,tags,created_at}]' "$RUNNER_TEMP/images.json"
          IMAGE_COUNT="$(jq 'length' "$RUNNER_TEMP/images.json")"
          echo "image_count=$IMAGE_COUNT"
          echo 'READ_ONLY_REGISTRY_DIAGNOSTIC=PASS'

      - name: Login once for data-plane probes
        shell: bash
        run: |
          set -euo pipefail
          IAM_TOKEN="$(yc iam create-token)"
          test -n "$IAM_TOKEN"
          echo "::add-mask::$IAM_TOKEN"
          printf '%s' "$IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
          unset IAM_TOKEN
          echo 'DOCKER_LOGIN=PASS'

      - name: Prove pull with same identity
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="$(jq -r '.[0].digest // empty' "$RUNNER_TEMP/images.json")"
          test -n "$DIGEST"
          EXISTING_IMAGE="cr.yandex/${TEST_REGISTRY_ID}/marketplaces-mcp@${DIGEST}"
          timeout 180s docker pull "$EXISTING_IMAGE"
          echo 'EXISTING_REGISTRY_DIRECT_PULL=PASS'

      - name: Probe first push to a new repository name
        shell: bash
        run: |
          set -euo pipefail
          PROBE_TAG="${GITHUB_SHA}"
          NEW_IMAGE="cr.yandex/${TEST_REGISTRY_ID}/semantic-core-probe:${PROBE_TAG}"
          mkdir -p "$RUNNER_TEMP/new-repository-probe"
          printf 'FROM scratch\nLABEL purpose="semantic-core-new-repository-probe"\n' > "$RUNNER_TEMP/new-repository-probe/Dockerfile"
          docker build --tag "$NEW_IMAGE" "$RUNNER_TEMP/new-repository-probe"
          docker push "$NEW_IMAGE"
          echo "new_repository_probe_image=$NEW_IMAGE"
          echo 'NEW_REPOSITORY_FIRST_PUSH=PASS'

      - name: Prove push to existing repository
        shell: bash
        run: |
          set -euo pipefail
          PROBE_TAG="semantic-direct-probe-${GITHUB_SHA}"
          IMAGE="cr.yandex/${TEST_REGISTRY_ID}/marketplaces-mcp:${PROBE_TAG}"
          mkdir -p "$RUNNER_TEMP/registry-probe"
          printf 'FROM scratch\nLABEL purpose="semantic-core-existing-registry-direct-push-probe"\n' > "$RUNNER_TEMP/registry-probe/Dockerfile"
          docker build --tag "$IMAGE" "$RUNNER_TEMP/registry-probe"
          docker push "$IMAGE"
          echo "probe_image=$IMAGE"
          echo 'EXISTING_REGISTRY_DIRECT_PUSH=PASS'

      - name: Cleanup credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/images.json"
