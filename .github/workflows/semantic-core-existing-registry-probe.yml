name: Semantic Core Existing Registry Probe

on:
  push:
    branches:
      - fix/semantic-core-test-iam-20260914
    paths:
      - .github/workflows/semantic-core-existing-registry-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -o "$RUNNER_TEMP/yc.tgz" \
            'https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/yc/yc" version

      - name: Authenticate CI service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          CI_SA_ID="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          test -n "$CI_SA_ID"
          echo "CI_SA_ID=$CI_SA_ID" >> "$GITHUB_ENV"
          yc config profile create semantic-registry-probe || true
          yc config set service-account-key "$KEY_FILE"

      - name: Resolve existing TEST registry without mutations
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          REGISTRY_ID="$(timeout 45s yc container registry list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp")|.id'|head -1)"
          test -n "$REGISTRY_ID"
          echo "TEST_FOLDER_ID=$FOLDER_ID" >> "$GITHUB_ENV"
          echo "TEST_REGISTRY_ID=$REGISTRY_ID" >> "$GITHUB_ENV"
          echo "existing_registry=$REGISTRY_ID"
          echo 'REGISTRY_MUTATIONS=NONE'

      - name: Prove direct pusher data-plane access
        shell: bash
        run: |
          set -euo pipefail
          IAM_TOKEN="$(yc iam create-token)"
          test -n "$IAM_TOKEN"
          echo "::add-mask::$IAM_TOKEN"
          printf '%s' "$IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
          unset IAM_TOKEN
          PROBE_TAG="semantic-direct-probe-${GITHUB_SHA}"
          IMAGE="cr.yandex/${TEST_REGISTRY_ID}/marketplaces-mcp:${PROBE_TAG}"
          mkdir -p "$RUNNER_TEMP/registry-probe"
          printf 'FROM scratch\nLABEL purpose="semantic-core-existing-registry-direct-push-probe"\n' > "$RUNNER_TEMP/registry-probe/Dockerfile"
          docker build --tag "$IMAGE" "$RUNNER_TEMP/registry-probe"
          docker push "$IMAGE"
          echo "probe_image=$IMAGE"
          echo 'EXISTING_REGISTRY_DIRECT_PUSH=PASS'

      - name: Cleanup credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/yc.tgz"
