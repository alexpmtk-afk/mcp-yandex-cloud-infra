name: Telegram API Audit

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-api-audit.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-news-reader-ssh
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 8
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-api-audit || true
          yc config profile activate telegram-api-audit
          yc config set service-account-key "$key"
      - name: Audit read-only API
        shell: bash
        run: |
          set -euo pipefail
          folder="b1gk4p83brasi8g811jv"
          ip="$(curl -fsS https://api.ipify.org)"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/tgkey"
          old_keys="$(yc compute instance get telegram-news-reader --folder-id "$folder" --format json | jq -r '.metadata["ssh-keys"] // ""')"
          printf '%s' "$old_keys" > "$RUNNER_TEMP/oldkeys"
          { printf '%s\n' "$old_keys"; printf 'ubuntu:'; cat "$RUNNER_TEMP/tgkey.pub"; } > "$RUNNER_TEMP/newkeys"
          yc compute instance add-metadata telegram-news-reader --folder-id "$folder" --metadata-from-file ssh-keys="$RUNNER_TEMP/newkeys"
          yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id "$folder" --add-rule "description=github-telegram-api-audit,direction=ingress,port=22,protocol=tcp,v4-cidrs=$ip/32"
          ssh_opts=(-o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -i "$RUNNER_TEMP/tgkey")
          ready=0
          for attempt in $(seq 1 12); do
            if ssh "${ssh_opts[@]}" ubuntu@111.88.248.156 true >/dev/null 2>&1; then ready=1; break; fi
            sleep 10
          done
          test "$ready" -eq 1
          ssh "${ssh_opts[@]}" ubuntu@111.88.248.156 'sudo docker exec telegram-reader python -c '\''import os,json,urllib.request,urllib.parse; base="http://127.0.0.1:8000"; token=os.environ["READER_API_TOKEN"]; get=lambda p: json.loads(urllib.request.urlopen(urllib.request.Request(base+p,headers={"Authorization":"Bearer "+token}),timeout=10).read()); chats=get("/api/chats"); assert len(chats)==9, chats; cid=int(chats[0]["chat_id"]); recent=get(f"/api/chats/{cid}/recent?limit=1"); assert isinstance(recent,list); search=get("/api/search?query="+urllib.parse.quote("а")+"&limit=1"); assert isinstance(search,list); print("API_CHATS_PASS count="+str(len(chats))); print("API_RECENT_PASS rows="+str(len(recent))); print("API_SEARCH_PASS rows="+str(len(search)))'\'''
          echo TELEGRAM_API_AUDIT_PASS
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          yc config profile activate telegram-api-audit >/dev/null 2>&1 || true
          folder="b1gk4p83brasi8g811jv"
          ids=$(yc vpc security-group get enpocnvnpdu2goj9nkjn --folder-id "$folder" --format json | jq -r '.rules[] | select(.description=="github-telegram-api-audit") | .id')
          for id in $ids; do yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id "$folder" --delete-rule-id "$id"; done
          if [ -f "$RUNNER_TEMP/oldkeys" ]; then yc compute instance add-metadata telegram-news-reader --folder-id "$folder" --metadata-from-file ssh-keys="$RUNNER_TEMP/oldkeys"; fi
