name: Marketplaces Source Router Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app/**
      - terraform/*.tf
      - terraform/*.tftpl
      - .github/workflows/deploy-mcp-test.yml

permissions:
  contents: read
  actions: read

jobs:
  accept:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 35
    steps:
      - name: Wait for successful TEST deploy of this exact commit
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=''
          for attempt in $(seq 1 150); do
            runs="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-mcp-test.yml/runs" \
              -f branch=main -f event=push -f per_page=30)"
            row="$(jq -r --arg sha "$GITHUB_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha)]
              | sort_by(.run_number)
              | last
              | if . == null then "" else (.status + "|" + (.conclusion // "") + "|" + (.html_url // "")) end
            ' <<<"$runs")"
            if [[ -z "$row" ]]; then
              echo "deploy wait $attempt/150: run not created yet"
              sleep 10
              continue
            fi
            IFS='|' read -r status conclusion url <<<"$row"
            echo "deploy wait $attempt/150: status=$status conclusion=${conclusion:-pending} url=$url"
            if [[ "$status" == completed ]]; then
              if [[ "$conclusion" == success ]]; then
                state=success
                break
              fi
              echo "TEST deploy for $GITHUB_SHA completed with conclusion=$conclusion"
              exit 1
            fi
            sleep 10
          done
          test "$state" = success
          echo 'EXACT_COMMIT_TEST_DEPLOY=PASS'

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          ARCHIVE="$RUNNER_TEMP/yc/yc.tgz"
          rm -f "$ARCHIVE"
          ok=0
          for attempt in $(seq 1 8); do
            if timeout 75s wget --continue --timeout=30 --tries=2 --retry-connrefused --output-document="$ARCHIVE" "$URL"; then
              if tar -tzf "$ARCHIVE" >/dev/null 2>&1; then
                ok=1
                break
              fi
              rm -f "$ARCHIVE"
            fi
            sleep 4
          done
          test "$ok" = 1
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate and resolve TEST endpoint
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create source-router-acceptance || true
          yc config set service-account-key "$KEY_FILE"
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          VERSION_ID="$(yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output | jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys // [])|index("mcp_bearer_token") != null)]|sort_by(.created_at)|last|.id // empty')"
          DOMAIN="$(yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//.[0].domain//empty')"
          test -n "$SECRET_ID"
          test -n "$VERSION_ID"
          test -n "$DOMAIN"
          yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/sec.json"
          BEARER="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value' "$RUNNER_TEMP/sec.json")"
          test -n "$BEARER"
          echo "::add-mask::$BEARER"
          printf '%s' "$BEARER" > "$RUNNER_TEMP/bearer"
          printf '%s' "https://${DOMAIN}/mcp" > "$RUNNER_TEMP/mcp-url"

      - name: Accept query plan, Clarification Gate, and Execution Controller V1 on live TEST MCP
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'httpx>=0.27,<1'
          export MCP_URL="$(cat "$RUNNER_TEMP/mcp-url")"
          export MCP_BEARER="$(cat "$RUNNER_TEMP/bearer")"
          python -u - <<'PY'
          import datetime
          import itertools
          import json
          import os
          import time
          import httpx

          TRANSIENT = {502, 503, 504}

          def unpack(response):
              response.raise_for_status()
              for line in response.text.splitlines():
                  if line.startswith('data:'):
                      return json.loads(line[5:].strip())
              return response.json() if response.text.strip() else None

          headers = {
              'Authorization': 'Bearer ' + os.environ['MCP_BEARER'],
              'Accept': 'application/json, text/event-stream',
              'Content-Type': 'application/json',
          }
          ids = itertools.count(1)
          timeout = httpx.Timeout(connect=10.0, read=45.0, write=30.0, pool=10.0)

          with httpx.Client(timeout=timeout, follow_redirects=True) as client:
              def post(payload):
                  last = None
                  for attempt in range(1, 9):
                      response = client.post(os.environ['MCP_URL'], headers=headers, json=payload)
                      last = response
                      if response.status_code not in TRANSIENT:
                          return response
                      print(f'transient_gateway_status={response.status_code} attempt={attempt}/8', flush=True)
                      time.sleep(3)
                  return last

              response = post({
                  'jsonrpc':'2.0','id':next(ids),'method':'initialize','params':{
                      'protocolVersion':'2025-06-18','capabilities':{},
                      'clientInfo':{'name':'source-router-acceptance','version':'5'}
                  }
              })
              init = unpack(response)
              assert init and 'result' in init, init
              instructions = init['result'].get('instructions','')
              assert 'marketplace_query_plan as the first server-side planning step' in instructions, instructions
              assert 'marketplace_execution_plan.v2' in instructions, instructions
              assert 'cross-source arithmetic' in instructions, instructions
              assert 'Clarification Gate' in instructions, instructions
              assert 'Never guess the closest metric' in instructions, instructions
              assert 'must not execute any data leg' in instructions, instructions
              assert 'Do not resume the old ambiguous plan directly' in instructions, instructions
              assert 'marketplace_execution_control before every provider/archive/card executor' in instructions, instructions
              assert 'exact executor_arguments' in instructions, instructions
              assert 'Never pass the original compound multi-source user question unchanged' in instructions, instructions
              assert 'dispatch_contracts must be empty' in instructions, instructions
              session = response.headers.get('mcp-session-id')
              if session:
                  headers['Mcp-Session-Id'] = session
              headers['MCP-Protocol-Version'] = init['result'].get('protocolVersion','2025-06-18')
              note = post({'jsonrpc':'2.0','method':'notifications/initialized'})
              assert note.status_code in (200,202), note.status_code

              def rpc(method, params=None):
                  response = post({'jsonrpc':'2.0','id':next(ids),'method':method,'params':params or {}})
                  data = unpack(response)
                  assert data and 'result' in data, (method, data)
                  return data['result']

              def call(name, args):
                  result = rpc('tools/call', {'name':name,'arguments':args})
                  assert not result.get('isError'), (name, result)
                  text = next(x.get('text') for x in result.get('content',[]) if x.get('type') == 'text')
                  return json.loads(text)

              names = {tool['name'] for tool in rpc('tools/list')['tools']}
              assert 'marketplace_query_plan' in names, sorted(names)
              assert 'marketplace_execution_control' in names, sorted(names)

              system_map = call('marketplace_system_map', {})
              router = system_map['request_source_router']
              assert router['status'] == 'EXECUTION_PLAN_V2', router
              assert router['source_revision'].endswith('4fe77f5359803e92230b7e7e7744cf61c1ec0c49'), router
              assert router['clarification_source_revision'].endswith('2bc3e48740400689de67360e02c6b1a7fcb12ded'), router
              assert router['execution_controller_source_revision'].endswith('e1b62a70442ace8b511a1ba6635a6821065c1b74'), router
              assert router['execution_plan']['version'] == 'marketplace_execution_plan.v2', router
              controller = router['execution_controller']
              assert controller['status'] == 'CONTRACT_DISPATCH_V1', controller
              assert controller['runtime_entry'] == 'marketplace_execution_control', controller
              assert controller['controller_version'] == 'marketplace_execution_controller.v1', controller
              assert controller['leg_contract_version'] == 'marketplace_leg_execution.v1', controller
              assert 'no required leg is dispatchable' in controller['all_or_nothing_policy'], controller
              assert 'prohibit arithmetic' in controller['join_policy'], controller
              assert router['availability_facts']['wb_orders_historical_archive'] is False, router
              assert router['availability_facts']['wb_stock_historical_archive'] is False, router

              clarification = router['clarification_gate']
              assert clarification['position'] == 'after marketplace_query_plan and before any data executor', clarification
              assert clarification['interaction_state'] == 'CLARIFICATION_REQUIRED', clarification
              triggers = ' '.join(clarification['triggers'])
              assert 'NEEDS_CONTEXT' in triggers, clarification
              assert 'AMBIGUOUS' in triggers, clarification
              assert 'UNKNOWN' in triggers, clarification
              assert 'must not execute' in clarification['assistant_response_policy'], clarification
              assert 'call marketplace_query_plan again' in clarification['resume_policy'], clarification
              assert 'source gap' in clarification['known_source_gap_behavior'], clarification
              assert 'do not ask for clarification' in clarification['recognized_multi_source_behavior'], clarification

              today = datetime.date.today().isoformat()
              current_stock = call('marketplace_query_plan', {
                  'question':'Сколько остатков сейчас на Wildberries?',
                  'marketplace':'wb','seller':'wb_novokshenov',
                  'date_from':today,'date_to':today
              })
              assert current_stock['planner'] == 'marketplace_query_plan.v2', current_stock
              assert current_stock['source_family'] == 'LIVE_CABINET_API', current_stock
              assert current_stock['execution_plan']['status'] == 'READY', current_stock

              current_control = call('marketplace_execution_control', {
                  'question':'Сколько остатков сейчас на Wildberries?',
                  'marketplace':'wb','seller':'wb_novokshenov',
                  'date_from':today,'date_to':today,'nm_ids':[12345]
              })
              assert current_control['controller'] == 'marketplace_execution_controller.v1', current_control
              assert current_control['state'] == 'READY', current_control
              assert current_control['can_dispatch'] is True, current_control
              assert len(current_control['dispatch_contracts']) == 1, current_control
              cc = current_control['dispatch_contracts'][0]
              assert cc['contract_version'] == 'marketplace_leg_execution.v1', cc
              assert cc['executor'] == 'marketplace_business_query', cc
              assert cc['executor_arguments']['question'] == 'текущие остатки', cc
              assert cc['executor_arguments']['nm_ids'] == [12345], cc
              assert cc['semantic_target'] == {'type':'BUSINESS_METRIC','id':'CURRENT_STOCK'}, cc

              historical_control = call('marketplace_execution_control', {
                  'question':'Сколько остатков было 1 сентября?',
                  'marketplace':'wb','seller':'wb_novokshenov',
                  'date_from':'2026-09-01','date_to':'2026-09-01'
              })
              assert historical_control['state'] == 'BLOCKED', historical_control
              assert historical_control['can_dispatch'] is False, historical_control
              assert historical_control['dispatch_contracts'] == [], historical_control
              assert historical_control['source_gap']['source_status'] == 'HISTORICAL_SOURCE_ABSENT', historical_control

              missing_control = call('marketplace_execution_control', {
                  'question':'Сколько заказов сегодня?', 'seller':'shop'
              })
              assert missing_control['state'] == 'CLARIFICATION_REQUIRED', missing_control
              assert missing_control['can_dispatch'] is False, missing_control
              assert missing_control['dispatch_contracts'] == [], missing_control
              assert 'marketplace' in missing_control['required_context'], missing_control
              assert missing_control['replan_required_after_clarification'] is True, missing_control

              compound = 'Сравни продажи и рекламные расходы за август'
              hybrid_control = call('marketplace_execution_control', {
                  'question':compound,
                  'marketplace':'wb','seller':'wb_novokshenov',
                  'date_from':'2026-08-01','date_to':'2026-08-31'
              })
              assert hybrid_control['state'] == 'READY_WITH_GATES', hybrid_control
              assert hybrid_control['can_dispatch'] is True, hybrid_control
              contracts = hybrid_control['dispatch_contracts']
              assert len(contracts) == 2, hybrid_control
              questions = {x['executor_arguments']['question'] for x in contracts}
              assert questions == {'продажи','рекламные расходы'}, hybrid_control
              assert compound not in questions, hybrid_control
              assert all(x['original_compound_question_allowed'] is False for x in contracts), hybrid_control
              assert all(x['coverage_gate'] == 'FULL_COVERAGE' for x in contracts), hybrid_control
              targets = {(x['semantic_target']['type'],x['semantic_target']['id']) for x in contracts}
              assert targets == {('CAPABILITY','sale_and_return_operations'),('CAPABILITY','advertising_performance')}, hybrid_control
              policy = hybrid_control['dispatch_policy']
              assert policy['use_only_returned_executor_and_arguments'] is True, policy
              assert policy['do_not_rewrite_executor_arguments'] is True, policy
              assert policy['do_not_pass_original_compound_question_to_each_leg'] is True, policy
              join = hybrid_control['join_control']
              assert join['requires_all_required_legs'] is True, join
              assert join['allow_partial_answer'] is False, join
              assert join['missing_required_leg_behavior'] == 'FAIL_CLOSED', join
              assert join['arithmetic_allowed'] is False, join
              assert join['explicit_calculation_contract_required_for_arithmetic'] is True, join
              assert join['provenance_required'] is True, join

              no_target = call('marketplace_execution_control', {
                  'question':'Сравни цену на сайте и текущие остатки Wildberries',
                  'marketplace':'wb','seller':'wb_novokshenov',
                  'date_from':today,'date_to':today
              })
              assert no_target['state'] == 'BLOCKED', no_target
              assert no_target['can_dispatch'] is False, no_target
              assert no_target['dispatch_contracts'] == [], no_target
              assert any(x['type'] == 'PRODUCT_TARGET_REQUIRED' for x in no_target['blockers']), no_target
              assert no_target['prepared_non_dispatchable_contracts'], no_target

              with_target = call('marketplace_execution_control', {
                  'question':'Сравни цену на сайте и текущие остатки Wildberries',
                  'marketplace':'wb','seller':'wb_novokshenov',
                  'date_from':today,'date_to':today,
                  'target_ids':['wb-card-1']
              })
              assert with_target['state'] == 'READY_WITH_GATES', with_target
              assert {x['executor'] for x in with_target['dispatch_contracts']} == {'card_monitor_get_latest','marketplace_business_query'}, with_target
              public = next(x for x in with_target['dispatch_contracts'] if x['executor'] == 'card_monitor_get_latest')
              assert public['executor_arguments']['target_ids'] == ['wb-card-1'], public
              assert public['executor_arguments']['marketplace'] == 'wildberries', public

              unknown = call('marketplace_execution_control', {
                  'question':'Покажи мне коэффициент счастья товара за август',
                  'marketplace':'wb','seller':'wb_novokshenov',
                  'date_from':'2026-08-01','date_to':'2026-08-31'
              })
              assert unknown['state'] == 'CLARIFICATION_REQUIRED', unknown
              assert unknown['dispatch_contracts'] == [], unknown
              assert unknown['semantic_resolution']['resolution_type'] == 'UNKNOWN', unknown

              print('MARKETPLACE_QUERY_EXECUTION_PLAN_V2_LIVE_ACCEPTANCE=PASS', flush=True)
              print('MARKETPLACE_CLARIFICATION_GATE_LIVE_ACCEPTANCE=PASS', flush=True)
              print('MARKETPLACE_EXECUTION_CONTROLLER_V1_LIVE_ACCEPTANCE=PASS', flush=True)
          PY

      - name: Cleanup ephemeral credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/sec.json" "$RUNNER_TEMP/bearer" "$RUNNER_TEMP/mcp-url"
