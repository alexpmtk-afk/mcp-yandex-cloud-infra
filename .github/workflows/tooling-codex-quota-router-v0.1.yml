name: Codex Quota Router v0.3

on:
  push:
    branches:
      - tooling/codex-quota-router-v0.1
    paths:
      - 'tools/codex-quota-router/**'
      - '.github/workflows/tooling-codex-quota-router-v0.1.yml'
  workflow_dispatch:

jobs:
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Router unit tests
        shell: pwsh
        run: node .\tools\codex-quota-router\test\router.test.js

      - name: Proxy routing unit tests
        shell: pwsh
        run: node .\tools\codex-quota-router\test\proxy.test.js

      - name: Transparent stdio proxy e2e
        shell: pwsh
        run: node .\tools\codex-quota-router\test\proxy-e2e.test.js

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(
            '.\tools\codex-quota-router\install.ps1',
            '.\tools\codex-quota-router\uninstall.ps1',
            '.\tools\codex-quota-router\install-proxy.ps1',
            '.\tools\codex-quota-router\uninstall-proxy.ps1',
            '.\tools\codex-quota-router\install-standalone.ps1',
            '.\tools\codex-quota-router\uninstall-standalone.ps1'
          )
          foreach ($script in $scripts) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List; throw "$script parse failed" }
          }

      - name: Compile Windows standalone launcher
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'codex-router.exe'
          Add-Type -Path .\tools\codex-quota-router\shim\CodexRouterShim.cs -OutputAssembly $out -OutputType ConsoleApplication
          if (-not (Test-Path $out)) { throw 'launcher compile failed' }
          Write-Host ("LAUNCHER_SHA256=" + (Get-FileHash $out -Algorithm SHA256).Hash)

      - name: Standalone launcher auto-discovery
        shell: powershell
        run: |
          $launcher = Join-Path $env:RUNNER_TEMP 'codex-router.exe'
          $local = Join-Path $env:RUNNER_TEMP 'localappdata-discovery'
          $oldDir = Join-Path $local 'OpenAI\Codex\bin\oldhash'
          $newDir = Join-Path $local 'OpenAI\Codex\bin\newhash'
          New-Item -ItemType Directory -Force -Path $oldDir,$newDir | Out-Null
          Set-Content -LiteralPath (Join-Path $oldDir 'codex.exe') -Value 'old'
          Set-Content -LiteralPath (Join-Path $newDir 'codex.exe') -Value 'new'
          (Get-Item (Join-Path $oldDir 'codex.exe')).LastWriteTimeUtc = [datetime]::UtcNow.AddDays(-2)
          (Get-Item (Join-Path $newDir 'codex.exe')).LastWriteTimeUtc = [datetime]::UtcNow.AddMinutes(-1)
          $env:CODEX_ROUTER_LOCALAPPDATA = $local
          $env:CODEX_ROUTER_DISCOVER_ONLY = '1'
          $found = (& $launcher).Trim()
          $expected = Join-Path $newDir 'codex.exe'
          if ([IO.Path]::GetFullPath($found) -ne [IO.Path]::GetFullPath($expected)) {
            throw "auto-discovery selected wrong Codex: $found"
          }
          Remove-Item Env:CODEX_ROUTER_DISCOVER_ONLY -ErrorAction SilentlyContinue
          Remove-Item Env:CODEX_ROUTER_LOCALAPPDATA -ErrorAction SilentlyContinue

      - name: Standalone launcher routing e2e
        shell: powershell
        run: |
          $launcher = Join-Path $env:RUNNER_TEMP 'codex-router.exe'
          $fake = Join-Path $env:RUNNER_TEMP 'fake-codex.exe'
          $fakeSource = @'
          using System;
          public static class FakeCodex {
              public static int Main(string[] args) {
                  if (args.Length == 1 && args[0] == "--version") { Console.WriteLine("codex-cli 0.0.0-fake"); return 0; }
                  string line;
                  while ((line = Console.ReadLine()) != null) Console.WriteLine(line);
                  return 0;
              }
          }
          '@
          Add-Type -TypeDefinition $fakeSource -OutputAssembly $fake -OutputType ConsoleApplication
          $codexHome = Join-Path $env:RUNNER_TEMP '.codex-standalone-e2e'
          New-Item -ItemType Directory -Force -Path (Join-Path $codexHome 'quota-router') | Out-Null
          $env:CODEX_HOME = $codexHome
          $env:CODEX_ROUTER_REAL_EXE = $fake
          $env:CODEX_ROUTER_PROXY_JS = (Resolve-Path '.\tools\codex-quota-router\bin\app-server-proxy.js').Path
          $request = '{"jsonrpc":"2.0","id":7,"method":"turn/start","params":{"threadId":"old-thread","model":"gpt-5.6-sol","effort":"medium","input":[{"type":"text","text":"Покажи список файлов в текущей папке. Ничего не изменяй.","text_elements":[]}]}}'
          $response = $request | & $launcher
          if ($LASTEXITCODE -ne 0) { throw "standalone launcher exited $LASTEXITCODE" }
          $json = $response | ConvertFrom-Json
          if ($json.params.threadId -ne 'old-thread') { throw 'threadId was not preserved' }
          if ($json.params.model -ne 'gpt-5.6-luna') { throw "expected Luna, got $($json.params.model)" }
          if ($json.params.effort -ne 'low') { throw "expected low, got $($json.params.effort)" }
          Remove-Item Env:CODEX_ROUTER_REAL_EXE -ErrorAction SilentlyContinue
          Remove-Item Env:CODEX_ROUTER_PROXY_JS -ErrorAction SilentlyContinue

      - name: Standalone installer simulation
        shell: powershell
        run: |
          $fake = Join-Path $env:RUNNER_TEMP 'fake-codex.exe'
          $profile = Join-Path $env:RUNNER_TEMP 'fake-user'
          $local = Join-Path $profile 'AppData\Local'
          $binDir = Join-Path $local 'OpenAI\Codex\bin\testhash'
          $codexHome = Join-Path $profile '.codex'
          New-Item -ItemType Directory -Force -Path $binDir,$codexHome | Out-Null
          Copy-Item -LiteralPath $fake -Destination (Join-Path $binDir 'codex.exe') -Force
          & .\tools\codex-quota-router\install-standalone.ps1 -CodexHome $codexHome -UserProfilePath $profile -UserLocalAppData $local -SkipEnvironmentRegistration
          if (-not (Test-Path (Join-Path $codexHome 'quota-router\codex-router.exe'))) { throw 'standalone launcher missing after install' }
          $marker = Get-Content (Join-Path $codexHome 'quota-router\standalone-install.json') -Raw | ConvertFrom-Json
          if ($marker.version -ne '0.3.0') { throw 'wrong standalone marker version' }
          if ($marker.environmentRegistered) { throw 'CI simulation unexpectedly registered environment' }

      - name: Simulate v0.1 hook install
        shell: pwsh
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP '.codex-test'
          New-Item -ItemType Directory -Force -Path $env:CODEX_HOME | Out-Null
          @'
          model = "gpt-5.6-sol"
          model_reasoning_effort = "high"

          [mcp_servers.example]
          url = "https://example.invalid/mcp"
          required = false
          '@ | Set-Content (Join-Path $env:CODEX_HOME 'config.toml') -Encoding utf8

          & .\tools\codex-quota-router\install.ps1 -SkipUsageMonitor

          node (Join-Path $env:CODEX_HOME 'quota-router\test\router.test.js')

          $hooks = Get-Content (Join-Path $env:CODEX_HOME 'hooks.json') -Raw | ConvertFrom-Json
          if (-not $hooks.hooks.UserPromptSubmit) { throw 'UserPromptSubmit hook missing' }
          if (-not $hooks.hooks.Stop) { throw 'Stop hook missing' }

          $cfg = Get-Content (Join-Path $env:CODEX_HOME 'config.toml') -Raw
          if ($cfg -notmatch '(?m)^model = "gpt-5.6-luna"\r?$') { throw 'default Luna model not set' }
          if ($cfg -notmatch '(?m)^model_reasoning_effort = "low"\r?$') { throw 'default low effort not set' }
          if ($cfg -notmatch '(?m)^\[mcp_servers\.example\]\r?$') { throw 'existing config table was damaged' }

      - name: Preflight allow and block tests
        shell: pwsh
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP '.codex-test'
          $session = Join-Path $env:RUNNER_TEMP 'session.jsonl'
          $reset5 = [DateTimeOffset]::UtcNow.AddHours(4).ToUnixTimeSeconds()
          $reset7 = [DateTimeOffset]::UtcNow.AddDays(5).ToUnixTimeSeconds()
          @"
          {"timestamp":"2026-08-31T12:00:00Z","type":"turn_context","payload":{"turn_id":"t0","model":"gpt-5.6-luna","effort":"low","model_context_window":1050000}}
          {"timestamp":"2026-08-31T12:01:00Z","type":"event_msg","payload":{"type":"token_count","info":{"total_token_usage":{"input_tokens":1000,"cached_input_tokens":500,"output_tokens":100,"reasoning_output_tokens":20,"total_tokens":1120},"last_token_usage":{"input_tokens":1000,"cached_input_tokens":500,"output_tokens":100,"reasoning_output_tokens":20,"total_tokens":1120}},"rate_limits":{"plan_type":"plus","primary":{"used_percent":20,"window_minutes":300,"resets_at":$reset5},"secondary":{"used_percent":10,"window_minutes":10080,"resets_at":$reset7}}}}
          "@ | Set-Content $session -Encoding utf8

          $allow = @{session_id='s1';turn_id='t1';transcript_path=$session;cwd='C:\work';hook_event_name='UserPromptSubmit';model='gpt-5.6-luna';permission_mode='default';prompt='Покажи последний commit и статус workflow'} | ConvertTo-Json -Compress
          $allowOut = $allow | node (Join-Path $env:CODEX_HOME 'quota-router\bin\quota-router.js')
          $allowJson = $allowOut | ConvertFrom-Json
          if (-not $allowJson.hookSpecificOutput.additionalContext) { throw 'allow preflight failed' }

          $block = @{session_id='s1';turn_id='t2';transcript_path=$session;cwd='C:\work';hook_event_name='UserPromptSubmit';model='gpt-5.6-luna';permission_mode='default';prompt='Найди и исправь сложную интеграционную ошибку MCP между GitHub, Yandex Cloud и API, затем протестируй'} | ConvertTo-Json -Compress
          $blockOut = $block | node (Join-Path $env:CODEX_HOME 'quota-router\bin\quota-router.js')
          $blockJson = $blockOut | ConvertFrom-Json
          if ($blockJson.decision -ne 'block') { throw 'model route block failed' }
          if ($blockJson.reason -notmatch 'gpt-5.6-terra') { throw 'Terra recommendation missing' }

      - name: Rollback hook install test
        shell: pwsh
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP '.codex-test'
          & .\tools\codex-quota-router\uninstall.ps1 -KeepUsageMonitor
          if (Test-Path (Join-Path $env:CODEX_HOME 'quota-router')) { throw 'quota-router files not removed' }
          $hooks = Get-Content (Join-Path $env:CODEX_HOME 'hooks.json') -Raw | ConvertFrom-Json
          if (@($hooks.hooks.UserPromptSubmit).Count -ne 0) { throw 'router UserPromptSubmit hook not removed' }
          if (@($hooks.hooks.Stop).Count -ne 0) { throw 'router Stop hook not removed' }
