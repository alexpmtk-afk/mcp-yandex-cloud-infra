name: Publish Semantic Core TEST via Existing Central Pusher

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-semantic-core-test-central.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY_ID: crp6o36mbl2tqonu1qbi
  APPROVED_SEMANTIC_SHA: 920f3f1458a1700ad350d43cf35178256e8e858f
  IMAGE_NAME: marketplaces-mcp
  REGISTRY_API: https://container-registry.api.cloud.yandex.net/container-registry/v1

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prove exact vendored Semantic Core
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx "Semantic Core source: alexpmtk-afk/marketplaces-mcp-ru@${APPROVED_SEMANTIC_SHA}" app/.source-revision
          grep -Fq "${APPROVED_SEMANTIC_SHA}" app/core/system_map.py
          TARGET_TAG="semantic-${APPROVED_SEMANTIC_SHA}"
          TARGET_REPOSITORY="${REGISTRY_ID}/${IMAGE_NAME}"
          echo "TARGET_TAG=$TARGET_TAG" >> "$GITHUB_ENV"
          echo "TARGET_REPOSITORY=$TARGET_REPOSITORY" >> "$GITHUB_ENV"
          echo "TARGET_IMAGE=cr.yandex/${TARGET_REPOSITORY}:${TARGET_TAG}" >> "$GITHUB_ENV"
          echo "LOCAL_IMAGE=marketplaces-mcp:semantic-${APPROVED_SEMANTIC_SHA}" >> "$GITHUB_ENV"

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"

      - name: Authenticate existing central registry pusher
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          CI_SA_ID="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          [[ "$CI_SA_ID" == "ajecdjjrkdo1t3itpl9k" ]]
          echo "::add-mask::$CI_SA_ID"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"
          yc container registry list-access-bindings "$REGISTRY_ID" --format json --no-user-output > "$RUNNER_TEMP/bindings.json"
          jq -e --arg id "$CI_SA_ID" '.[]|select(.role_id=="container-registry.images.pusher" and .subject.type=="serviceAccount" and .subject.id==$id)' "$RUNNER_TEMP/bindings.json" >/dev/null
          IAM_TOKEN="$(yc iam create-token)"
          test -n "$IAM_TOKEN"
          echo "::add-mask::$IAM_TOKEN"
          umask 077
          printf '%s' "$IAM_TOKEN" > "$RUNNER_TEMP/central-iam-token"
          echo 'central_registry_pusher_token=PASS'

      - name: Build exact image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --label "org.opencontainers.image.revision=${APPROVED_SEMANTIC_SHA}" -t "$LOCAL_IMAGE" app
          echo 'semantic_image_build=PASS'

      - name: Push exact image with existing direct registry pusher
        shell: bash
        run: |
          set -euo pipefail
          IAM_TOKEN="$(cat "$RUNNER_TEMP/central-iam-token")"
          DOCKER_CONFIG_DIR="$RUNNER_TEMP/docker-central"
          mkdir -p "$DOCKER_CONFIG_DIR"
          printf '%s' "$IAM_TOKEN" | docker --config "$DOCKER_CONFIG_DIR" login --username iam --password-stdin cr.yandex >/dev/null
          docker tag "$LOCAL_IMAGE" "$TARGET_IMAGE"
          docker --config "$DOCKER_CONFIG_DIR" push "$TARGET_IMAGE"
          echo 'semantic_image_push=PASS'

      - name: Resolve immutable digest
        shell: bash
        run: |
          set -euo pipefail
          IAM_TOKEN="$(cat "$RUNNER_TEMP/central-iam-token")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -H "Authorization: Bearer ${IAM_TOKEN}" \
            "${REGISTRY_API}/images?registryId=${REGISTRY_ID}&pageSize=1000" -o "$RUNNER_TEMP/images.json"
          mkdir -p evidence
          python - "$RUNNER_TEMP/images.json" evidence/semantic-core-test-image.json <<'PY'
          import json,os,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text())
          m=[x for x in d.get('images',[]) if x.get('name')==os.environ['TARGET_REPOSITORY'] and os.environ['TARGET_TAG'] in (x.get('tags') or [])]
          assert len(m)==1, len(m)
          image=m[0]; digest=image.get('digest','')
          assert digest.startswith('sha256:') and len(digest)==71, digest
          e={'schema':'MARKETPLACES_SEMANTIC_CORE_TEST_IMAGE_V1','semantic_source_sha':os.environ['APPROVED_SEMANTIC_SHA'],'registry_id':os.environ['REGISTRY_ID'],'image_id':image.get('id'),'image_tag':os.environ['TARGET_IMAGE'],'digest':digest,'immutable_url':f"cr.yandex/{os.environ['TARGET_REPOSITORY']}@{digest}",'production_changed':False}
          Path(sys.argv[2]).write_text(json.dumps(e,indent=2,sort_keys=True)+'\n')
          print(json.dumps(e,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: marketplaces-semantic-core-test-image-central
          path: evidence/semantic-core-test-image.json
          retention-days: 30

      - name: Cleanup credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/central-iam-token" "$RUNNER_TEMP/bindings.json" "$RUNNER_TEMP/images.json"
          rm -rf "$RUNNER_TEMP/docker-central"
