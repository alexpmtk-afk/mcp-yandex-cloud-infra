name: Patch Archive Finalize Telemetry Sync

on:
  push:
    branches:
      - sync/archive-finalize-telemetry
    paths:
      - .github/workflows/patch-archive-finalize-telemetry-sync.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/archive-finalize-telemetry
          fetch-depth: 0
      - name: Apply selective telemetry sync
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def must_replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          q = "app/core/archive_queue.py"
          must_replace(q, "from .archive_yandex import YandexObjectStorageArchiveStore\n", "from .archive_yandex import YandexObjectStorageArchiveStore\nfrom .archive_finalize_telemetry import (\n    ensure_finalize_telemetry,\n    finalize_telemetry_snapshot,\n    public_finalize_telemetry,\n    record_finalize_event,\n)\n")
          must_replace(q,
              '            "finalize_report_id": int((state.get("finalize") or {}).get("report_id", 0) or 0),\n            "last_retry_after_seconds": state.get("last_retry_after_seconds", 0),\n',
              '            "finalize_report_id": int((state.get("finalize") or {}).get("report_id", 0) or 0),\n            "finalize_telemetry": public_finalize_telemetry(state),\n            "last_retry_after_seconds": state.get("last_retry_after_seconds", 0),\n')
          must_replace(q,
              '            state["finalize"] = {"report_id": report_id, "phase": "PREPARE"}\n            state["status"] = "QUEUED"\n',
              '            finalize = {"report_id": report_id, "phase": "PREPARE"}\n            state["finalize"] = finalize\n            ensure_finalize_telemetry(state, finalize)\n            record_finalize_event(\n                state, finalize, "DOWNLOAD_TO_PREPARE",\n                transition="DOWNLOAD->PREPARE",\n            )\n            state["status"] = "QUEUED"\n')
          must_replace(q,
              '            await self.store.upload_bytes(\n                candidate_folder,\n                candidate_name,\n                merged,\n                mime_type="text/csv",\n            )\n            finalize.update({\n',
              '            candidate_obj = await self.store.upload_bytes(\n                candidate_folder,\n                candidate_name,\n                merged,\n                mime_type="text/csv",\n            )\n            finalize.update({\n')
          must_replace(q,
              '            state["finalize"] = finalize\n            state["status"] = "QUEUED"\n            await self._save(state)\n            await self._schedule(str(state["job_id"]), 0)\n            return {\n                "ok": True,\n                "job_id": state["job_id"],\n                "status": state["status"],\n                "phase": state["phase"],\n                "action": "report_finalize_prepared",\n',
              '            state["finalize"] = finalize\n            ensure_finalize_telemetry(\n                state, finalize, candidate_object_id=str(getattr(candidate_obj, "id", "") or "")\n            )\n            record_finalize_event(\n                state, finalize, "PREPARE_TO_UPLOAD_ANNUAL",\n                candidate_object_id=str(getattr(candidate_obj, "id", "") or ""),\n                candidate_bytes=finalize["annual_bytes"],\n                candidate_sha256=finalize["annual_sha256"],\n                resumable_offset=0,\n                transition="PREPARE->UPLOAD_ANNUAL",\n            )\n            state["status"] = "QUEUED"\n            await self._save(state)\n            await self._schedule(str(state["job_id"]), 0)\n            return {\n                "ok": True,\n                "job_id": state["job_id"],\n                "status": state["status"],\n                "phase": state["phase"],\n                "action": "report_finalize_prepared",\n')
          must_replace(q,
              '        annual_object_id = str(finalize.get("annual_object_id") or "")\n        if not annual_object_id:\n',
              '        record_finalize_event(\n            state, finalize, "COMMIT_STARTED", transition="UPLOAD_ANNUAL->COMMIT"\n        )\n        annual_object_id = str(finalize.get("annual_object_id") or "")\n        if not annual_object_id:\n')
          must_replace(q,
              '        state["current_rrd_id"] = 0\n        state.pop("finalize", None)\n',
              '        state["current_rrd_id"] = 0\n        record_finalize_event(\n            state, finalize, "COMMIT_COMPLETE",\n            canonical_file_id=annual_object_id,\n            candidate_bytes=int(finalize.get("annual_bytes", 0) or 0),\n            candidate_sha256=str(finalize.get("annual_sha256") or ""),\n            transition="COMMIT->NEXT",\n        )\n        state["last_finalize_telemetry"] = finalize_telemetry_snapshot(state, finalize)\n        state.pop("finalize", None)\n')

          w = "app/core/archive_resumable_worker.py"
          must_replace(w, 'from .archive_google import ArchiveStorageError\n', 'from .archive_google import ArchiveStorageError\nfrom .archive_finalize_telemetry import (\n    record_finalize_event,\n    sync_resumable_telemetry,\n)\n')
          must_replace(w,
              '        if candidate_obj.size is not None and int(candidate_obj.size) != expected_bytes:\n            raise RuntimeError("Durable annual finalize candidate failed size verification")\n\n        if self.uploader is None:\n',
              '        if candidate_obj.size is not None and int(candidate_obj.size) != expected_bytes:\n            raise RuntimeError("Durable annual finalize candidate failed size verification")\n        sync_resumable_telemetry(\n            state, finalize, candidate_object_id=str(candidate_obj.id)\n        )\n\n        if self.uploader is None:\n')
          must_replace(w,
              '                finalize["resumable_upload"] = upload\n                state["finalize"] = finalize\n                state["status"] = "QUEUED"\n                state["last_error"] = None\n                await self.queue._save(state)\n                await self.queue._schedule(job_id, 0)\n                return {\n                    "ok": True,\n                    "job_id": job_id,\n                    "status": state["status"],\n                    "phase": state.get("phase"),\n                    "action": "drive_resumable_session_started",\n',
              '                finalize["resumable_upload"] = upload\n                state["finalize"] = finalize\n                sync_resumable_telemetry(\n                    state, finalize, candidate_object_id=str(candidate_obj.id)\n                )\n                record_finalize_event(\n                    state, finalize, "RESUMABLE_SESSION_STARTED",\n                    staging_file_id=str(session.file_id or ""),\n                    previous_canonical_file_id=str(previous_canonical_id or ""),\n                    resumable_offset=0,\n                )\n                state["status"] = "QUEUED"\n                state["last_error"] = None\n                await self.queue._save(state)\n                await self.queue._schedule(job_id, 0)\n                return {\n                    "ok": True,\n                    "job_id": job_id,\n                    "status": state["status"],\n                    "phase": state.get("phase"),\n                    "action": "drive_resumable_session_started",\n')
          must_replace(w,
              '            finalize["resumable_upload"] = upload\n            state["finalize"] = finalize\n            state["status"] = "QUEUED"\n            state["last_error"] = None\n            await self.queue._save(state)\n            await self.queue._schedule(job_id, 0)\n            return {\n                "ok": True,\n                "job_id": job_id,\n                "status": state["status"],\n                "phase": state.get("phase"),\n                "action": "drive_resumable_chunk_uploaded",\n',
              '            finalize["resumable_upload"] = upload\n            state["finalize"] = finalize\n            sync_resumable_telemetry(\n                state, finalize, candidate_object_id=str(candidate_obj.id)\n            )\n            record_finalize_event(\n                state, finalize, "RESUMABLE_CHUNK_CONFIRMED",\n                staging_file_id=str(upload.get("target_file_id") or ""),\n                resumable_offset=confirmed,\n            )\n            state["status"] = "QUEUED"\n            state["last_error"] = None\n            await self.queue._save(state)\n            await self.queue._schedule(job_id, 0)\n            return {\n                "ok": True,\n                "job_id": job_id,\n                "status": state["status"],\n                "phase": state.get("phase"),\n                "action": "drive_resumable_chunk_uploaded",\n')
          must_replace(w,
              '                state["status"] = "FAILED"\n                state["last_error"] = str(exc)[:1000]\n                state["finalize"] = finalize\n                await self.queue._save(state)\n',
              '                state["status"] = "FAILED"\n                state["last_error"] = str(exc)[:1000]\n                state["finalize"] = finalize\n                sync_resumable_telemetry(state, finalize, candidate_object_id=str(candidate_obj.id))\n                record_finalize_event(\n                    state, finalize, "UPLOAD_FAILED",\n                    canonical_state="recheck_required" if promotion_attempted else "untouched",\n                )\n                await self.queue._save(state)\n')
          must_replace(w,
              '            state["status"] = "WAITING_RETRY"\n            state["last_error"] = str(exc)[:1000]\n            state["finalize"] = finalize\n            await self.queue._save(state)\n',
              '            state["status"] = "WAITING_RETRY"\n            state["last_error"] = str(exc)[:1000]\n            state["finalize"] = finalize\n            sync_resumable_telemetry(state, finalize, candidate_object_id=str(candidate_obj.id))\n            record_finalize_event(\n                state, finalize, "UPLOAD_WAITING_RETRY",\n                retry_count=retry_count,\n                canonical_state="recheck_required" if promotion_attempted else "untouched",\n            )\n            await self.queue._save(state)\n')
          must_replace(w,
              '        upload["staged_file_id"] = file_id\n        upload["promotion_attempted"] = True\n        upload["offset"] = expected_bytes\n        finalize["resumable_upload"] = upload\n        state["finalize"] = finalize\n        state["status"] = "PROMOTION_PENDING"\n',
              '        upload["staged_file_id"] = file_id\n        upload["promotion_attempted"] = True\n        upload["offset"] = expected_bytes\n        finalize["resumable_upload"] = upload\n        state["finalize"] = finalize\n        sync_resumable_telemetry(state, finalize, candidate_object_id=candidate_id)\n        record_finalize_event(\n            state, finalize, "PROMOTION_PENDING",\n            staging_file_id=file_id,\n            previous_canonical_file_id=str(upload.get("previous_canonical_file_id") or ""),\n            resumable_offset=expected_bytes,\n        )\n        state["status"] = "PROMOTION_PENDING"\n')
          must_replace(w,
              '        finalize["annual_object_id"] = str(file_id)\n        finalize["phase"] = "COMMIT"\n        finalize["resumable_upload_verified"] = {\n',
              '        finalize["annual_object_id"] = str(file_id)\n        finalize["phase"] = "COMMIT"\n        sync_resumable_telemetry(state, finalize)\n        record_finalize_event(\n            state, finalize, "UPLOAD_ANNUAL_TO_COMMIT",\n            canonical_file_id=str(file_id),\n            candidate_bytes=expected_bytes,\n            candidate_sha256=expected_sha,\n            resumable_offset=expected_bytes,\n            transition="UPLOAD_ANNUAL->COMMIT",\n        )\n        finalize["resumable_upload_verified"] = {\n')
          PY
          rm .github/workflows/patch-archive-finalize-telemetry-sync.yml
          git diff --check
      - name: Commit selective sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/core/archive_queue.py app/core/archive_resumable_worker.py .github/workflows/patch-archive-finalize-telemetry-sync.yml
          git commit -m "sync: integrate archive finalize telemetry into runtime"
          git push origin HEAD:sync/archive-finalize-telemetry
