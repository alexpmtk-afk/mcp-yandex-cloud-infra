name: BIRZHA business integrity once 2026-09-12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/birzha-business-integrity-once-20260912.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false
      - name: Resolve endpoint and token
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"; chmod 600 "$RUNNER_TEMP/key.json"
          echo "YC_KEY_FILE=$RUNNER_TEMP/key.json" >> "$GITHUB_ENV"
          terraform -chdir=terraform/birzha_test init -reconfigure -input=false -lockfile=readonly \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY" >/dev/null
          terraform -chdir=terraform/birzha_test output -json > "$RUNNER_TEMP/o.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          o=json.loads((Path(os.environ['RUNNER_TEMP'])/'o.json').read_text()); v=lambda k:o[k]['value']
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'MCP_ENDPOINT={v("mcp_endpoint")}\nMCP_AUTH_SECRET_ID={v("mcp_auth_secret_id")}\nMCP_AUTH_VERSION_ID={v("mcp_auth_secret_version_id")}\n')
          PY
          python -m pip install --disable-pip-version-check 'mcp==2.1.1' 'yandexcloud' >/dev/null
          python - <<'PY'
          import json,os
          from pathlib import Path
          import yandexcloud
          from yandex.cloud.lockbox.v1.payload_service_pb2 import GetPayloadRequest
          from yandex.cloud.lockbox.v1.payload_service_pb2_grpc import PayloadServiceStub
          key=json.loads(Path(os.environ['YC_KEY_FILE']).read_text())
          p=yandexcloud.SDK(service_account_key=key).client(PayloadServiceStub).Get(GetPayloadRequest(secret_id=os.environ['MCP_AUTH_SECRET_ID'],version_id=os.environ['MCP_AUTH_VERSION_ID']))
          t=[x.text_value for x in p.entries if x.key=='bearer_token'][0]; print(f'::add-mask::{t}'); Path(os.environ['RUNNER_TEMP']+'/token').write_text(t)
          PY
      - name: Business integrity with fresh session per call
        shell: bash
        run: |
          python - <<'PY'
          import asyncio,json,os
          from pathlib import Path
          import httpx2
          from mcp import Client
          from mcp.client.streamable_http import streamable_http_client

          token=Path(os.environ['RUNNER_TEMP']+'/token').read_text()
          report={'errors':[]}
          async def call(name,args,critical=False):
              try:
                  async with httpx2.AsyncClient(headers={'Authorization':f'Bearer {token}'},timeout=httpx2.Timeout(30,read=300),follow_redirects=True) as hc:
                      async with Client(streamable_http_client(os.environ['MCP_ENDPOINT'],http_client=hc)) as c:
                          r=await c.call_tool(name,args)
                          if r.is_error: raise RuntimeError(str(r))
                          return r.structured_content
              except Exception as e:
                  report['errors'].append({'tool':name,'args':args,'critical':critical,'type':type(e).__name__,'error':str(e)[:700]})
                  return None

          def last_close(d):
              xs=(d or {}).get('candles') or []
              return xs[-1].get('close') if xs and isinstance(xs[-1],dict) else None

          async def main():
              gold=await call('market.resolve_instrument',{'symbol':'GOLD'},True)
              report['gold_resolution']={k:(gold or {}).get(k) for k in ('symbol','secid','asset_class','root_symbol','board','market')}
              gold_ok=bool(gold and gold.get('asset_class')=='future' and gold.get('root_symbol')=='GOLD' and str(gold.get('secid','')).upper().startswith('GD'))
              report['gold_semantics_ok']=gold_ok
              if gold and not gold_ok:
                  report['errors'].append({'tool':'market.resolve_instrument','args':{'symbol':'GOLD'},'critical':True,'type':'SemanticMismatch','error':'GOLD resolved outside rolling GD* futures semantics'})

              direct={}
              for tf in ('D1','H1','M15'):
                  d=await call('market.candles',{'symbol':'SBER','timeframe':tf,'from_date':'2026-09-11','till_date':'2026-09-11','completed_only':True},True)
                  direct[tf]=last_close(d)
              snap=await call('market.snapshot',{'symbol':'SBER','as_of_date':'2026-09-11'},True)
              snapc={tf:(snap or {}).get(tf.lower(),{}).get('last_close') for tf in ('D1','H1','M15')}
              report['direct_last_close']=direct; report['snapshot_last_close']=snapc
              mm={tf:{'direct':direct[tf],'snapshot':snapc[tf]} for tf in direct if direct[tf] is not None and snapc[tf] is not None and abs(float(direct[tf])-float(snapc[tf]))>1e-9}
              report['snapshot_close_mismatches']=mm
              if mm: report['errors'].append({'tool':'market.snapshot','args':{'symbol':'SBER','as_of_date':'2026-09-11'},'critical':True,'type':'PriceConsistencyMismatch','error':json.dumps(mm)})

              flow=await call('market.flow',{'symbol':'SBER','from_date':'2026-09-08','till_date':'2026-09-11','lookback_days':5},False)
              report['flow_summary']={k:(flow or {}).get(k) for k in ('data_quality','intervals','volume_delta','volume_delta_ratio','from_date','till_date')}

              hs=await call('history.sync',{'symbol':'SBER','timeframe':'D1','from_date':'2026-09-01','till_date':'2026-09-05'},True)
              report['history_sync_summary']={k:(hs or {}).get(k) for k in ('status','requested_sessions','missing_sessions','fetched_candles','stored_candles','contract_count')}
              if hs and hs.get('status')!='PASS': report['errors'].append({'tool':'history.sync','args':{},'critical':True,'type':'StatusError','error':str(hs)[:500]})

              cr=await call('forecast.create',{'symbol':'SBER','as_of_date':'2026-09-11'},True)
              f=(cr or {}).get('forecast') or cr or {}; fid=f.get('forecast_id')
              report['created_forecast_id']=fid
              if fid:
                  got=await call('forecast.get',{'forecast_id':fid},True)
                  report['forecast_readback_ok']=bool(got and got.get('forecast_id')==fid)
                  if not report['forecast_readback_ok']: report['errors'].append({'tool':'forecast.get','args':{'forecast_id':fid},'critical':True,'type':'JournalMismatch','error':'readback mismatch'})
              else:
                  report['errors'].append({'tool':'forecast.create','args':{},'critical':True,'type':'MissingForecastId','error':'forecast_id absent'})

              fl=await call('forecast.list',{'limit':20,'symbol':'SBER'},True)
              fs=(fl or {}).get('forecasts') or []
              report['forecast_list_count']=(fl or {}).get('count')
              if fs:
                  old=sorted(fs,key=lambda x:str(x.get('created_at_t0','')))[0]
                  ofid=old.get('forecast_id'); report['outcome_probe_forecast_id']=ofid
                  if ofid:
                      ev=await call('outcome.evaluate',{'forecast_id':ofid,'evaluation_date':'2026-09-11'},True)
                      ol=await call('outcome.list',{'forecast_id':ofid},True)
                      report['outcome_evaluate']={k:(ev or {}).get(k) for k in ('status','new_outcomes','total_outcomes','pending_horizons')}
                      report['outcome_count']=(ol or {}).get('count')

              va=await call('validation.assess_model',{'symbol':'SBER','start_date':'2026-06-01','end_date':'2026-08-14','step_sessions':10,'max_points':5},False)
              report['validation_summary']={k:(va or {}).get(k) for k in ('status','decision','reason','observations','directional_accuracy')}

              crit=[e for e in report['errors'] if e.get('critical')]
              report['critical_error_count']=len(crit); report['error_count']=len(report['errors']); report['status']='PASS' if not crit else 'FAIL'
              print('BIRZHA_BUSINESS_INTEGRITY_REPORT='+json.dumps(report,ensure_ascii=False,sort_keys=True))
              if crit: raise SystemExit(2)
          asyncio.run(main())
          PY
      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/token"
