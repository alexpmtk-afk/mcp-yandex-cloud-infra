name: Telegram Serverless Media Deploy

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-serverless-media-deploy.yml]

permissions:
  contents: read

concurrency:
  group: telegram-serverless-media-deploy
  cancel-in-progress: false

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: telegram-serverless-smoke-20260916
          fetch-depth: 0

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create tg-media-deploy || true
          yc config profile activate tg-media-deploy
          yc config set service-account-key "$key"
          yc config set folder-id b1gk4p83brasi8g811jv

      - name: Create isolated media identity and least-privilege storage access
        shell: bash
        run: |
          set -euo pipefail
          folder=b1gk4p83brasi8g811jv
          reader_sa=ajeaad0m00gncv22tagf
          media_sa="$(yc iam service-account list --folder-id "$folder" --format json | jq -r '.[] | select(.name=="telegram-reader-media-proxy") | .id' | head -1)"
          if [ -z "$media_sa" ]; then
            media_sa="$(yc iam service-account create --name telegram-reader-media-proxy --folder-id "$folder" --format json | jq -r '.id')"
          fi
          test -n "$media_sa"
          yc resource-manager folder add-access-binding "$folder" --role storage.uploader --service-account-id "$reader_sa" >/dev/null
          yc resource-manager folder add-access-binding "$folder" --role storage.viewer --service-account-id "$media_sa" >/dev/null
          echo "MEDIA_SA=$media_sa" >> "$GITHUB_ENV"
          echo MEDIA_IAM_PASS

      - name: Create isolated media Lockbox secret
        shell: bash
        run: |
          set -euo pipefail
          folder=b1gk4p83brasi8g811jv
          source_secret=e6qnt0bt655jltrr5sid
          token="$(yc iam create-token)"
          curl -fsS -H "Authorization: Bearer $token" \
            "https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/$source_secret/payload" \
            -o "$RUNNER_TEMP/source.json"
          link_secret="$(jq -er '.entries[] | select(.key=="READER_API_TOKEN") | .textValue | select(length>0)' "$RUNNER_TEMP/source.json")"
          jq -n --arg secret "$link_secret" '[
            {key:"TELEGRAM_MEDIA_BUCKET",text_value:"telegram-reader-media-alexpmtk-20260910"},
            {key:"TELEGRAM_MEDIA_PREFIX",text_value:"telegram-media"},
            {key:"TELEGRAM_MEDIA_LINK_SECRET",text_value:$secret}
          ]' > "$RUNNER_TEMP/media-payload.json"
          media_secret="$(yc lockbox secret list --folder-id "$folder" --format json | jq -r '.[] | select(.name=="telegram-reader-media-runtime") | .id' | head -1)"
          if [ -z "$media_secret" ]; then
            media_secret="$(yc lockbox secret create --name telegram-reader-media-runtime --folder-id "$folder" --description 'Telegram Reader media-only runtime' --payload - --format json < "$RUNNER_TEMP/media-payload.json" | jq -r '.id')"
          else
            yc lockbox secret add-version "$media_secret" --description 'Refresh Serverless media settings' --payload - < "$RUNNER_TEMP/media-payload.json" >/dev/null
          fi
          test -n "$media_secret"
          yc lockbox secret add-access-binding "$media_secret" --role lockbox.payloadViewer --service-account-id "$MEDIA_SA" >/dev/null
          echo "MEDIA_SECRET=$media_secret" >> "$GITHUB_ENV"
          echo MEDIA_LOCKBOX_PASS

      - name: Build and publish Reader and media-only images
        shell: bash
        run: |
          set -euo pipefail
          registry=crphagvid8e8g5pp4fpe
          tag="media-$(git rev-parse --short=12 HEAD)"
          reader_image="cr.yandex/$registry/telegram-news-reader:$tag"
          media_image="cr.yandex/$registry/telegram-reader-media:$tag"
          yc iam create-token | docker login --username iam --password-stdin cr.yandex >/dev/null
          docker build -t "$reader_image" telegram-news-reader >/dev/null
          docker push "$reader_image" >/dev/null
          docker build -f telegram-news-reader/Dockerfile.media -t "$media_image" telegram-news-reader >/dev/null
          docker push "$media_image" >/dev/null
          echo "READER_IMAGE=$reader_image" >> "$GITHUB_ENV"
          echo "MEDIA_IMAGE=$media_image" >> "$GITHUB_ENV"
          echo MEDIA_IMAGES_PASS

      - name: Deploy public media-only container
        shell: bash
        run: |
          set -euo pipefail
          folder=b1gk4p83brasi8g811jv
          if ! yc serverless container list --folder-id "$folder" --format json | jq -e '.[] | select(.name=="telegram-reader-media")' >/dev/null; then
            yc serverless container create --name telegram-reader-media --folder-id "$folder" >/dev/null
          fi
          yc serverless container revision deploy \
            --folder-id "$folder" \
            --container-name telegram-reader-media \
            --runtime http \
            --image "$MEDIA_IMAGE" \
            --cores 1 \
            --memory 256MB \
            --concurrency 4 \
            --execution-timeout 30s \
            --service-account-id "$MEDIA_SA" \
            --environment LOCKBOX_MEDIA_SECRET_ID="$MEDIA_SECRET" >/dev/null
          yc serverless container allow-unauthenticated-invoke telegram-reader-media --folder-id "$folder" >/dev/null
          media_url="$(yc serverless container get telegram-reader-media --folder-id "$folder" --format json | jq -r '.url')"
          media_url="${media_url%/}"
          test -n "$media_url" && test "$media_url" != null
          echo "MEDIA_URL=$media_url" >> "$GITHUB_ENV"
          for attempt in $(seq 1 12); do
            body="$(curl -fsS --max-time 15 "$media_url/health" 2>/dev/null || true)"
            if echo "$body" | jq -e '.status=="ok" and .media_storage=="enabled"' >/dev/null 2>&1; then break; fi
            test "$attempt" -lt 12
            sleep 5
          done
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$media_url/media/object?key=x&expires=1&sig=x")"
          test "$code" = 403
          internal_code="$(curl -sS -o /dev/null -w '%{http_code}' "$media_url/internal/chats")"
          test "$internal_code" = 404
          echo MEDIA_PUBLIC_BOUNDARY_PASS

      - name: Add media settings to private Reader Lockbox
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg base "$MEDIA_URL" '[
            {key:"TELEGRAM_MEDIA_BUCKET",text_value:"telegram-reader-media-alexpmtk-20260910"},
            {key:"TELEGRAM_MEDIA_PREFIX",text_value:"telegram-media"},
            {key:"TELEGRAM_PUBLIC_BASE_URL",text_value:$base}
          ]' > "$RUNNER_TEMP/reader-media-payload.json"
          yc lockbox secret add-version e6qnt0bt655jltrr5sid \
            --description 'Enable Serverless media capture and public signed proxy' \
            --payload - < "$RUNNER_TEMP/reader-media-payload.json" >/dev/null
          echo READER_MEDIA_LOCKBOX_PASS

      - name: Deploy private Reader revision with media capture
        shell: bash
        run: |
          set -euo pipefail
          folder=b1gk4p83brasi8g811jv
          yc serverless container revision deploy \
            --folder-id "$folder" \
            --container-name telegram-reader-serverless-smoke \
            --runtime http \
            --image "$READER_IMAGE" \
            --cores 1 \
            --memory 512MB \
            --concurrency 1 \
            --execution-timeout 120s \
            --service-account-id ajeaad0m00gncv22tagf \
            --environment LOCKBOX_RUNTIME_SECRET_ID=e6qnt0bt655jltrr5sid \
            --environment TELEGRAM_DATABASE_PATH=/tmp/telegram.db \
            --environment TELEGRAM_SESSION_PATH=/tmp/telegram_news \
            --environment TELEGRAM_MEDIA_PATH=/tmp/media \
            --environment COLLECTOR_ENABLED=false >/dev/null
          reader_url="$(yc serverless container get telegram-reader-serverless-smoke --folder-id "$folder" --format json | jq -r '.url')"
          reader_url="${reader_url%/}"
          echo "READER_URL=$reader_url" >> "$GITHUB_ENV"
          token="$(yc iam create-token)"
          echo "IAM_TOKEN=$token" >> "$GITHUB_ENV"
          ok=0
          for attempt in $(seq 1 15); do
            body="$(curl -sS --max-time 30 -H "Authorization: Bearer $token" "$reader_url/health" || true)"
            if echo "$body" | jq -e '.status=="ok" and .telegram_authorized==true and .allowed_chats==9 and .media_storage=="enabled"' >/dev/null 2>&1; then ok=1; break; fi
            sleep 5
          done
          test "$ok" -eq 1
          public_code="$(curl -sS -o /dev/null -w '%{http_code}' "$reader_url/internal/chats")"
          test "$public_code" = 401 -o "$public_code" = 403
          echo PRIVATE_READER_MEDIA_REVISION_PASS

      - name: Capture and fetch one real Telegram media object end-to-end
        shell: bash
        run: |
          set -euo pipefail
          date_from="$(date -u -d '192 hours ago' '+%Y-%m-%dT%H:%M:%SZ')"
          date_to="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          chats="$(curl -fsS --max-time 30 -H "Authorization: Bearer $IAM_TOKEN" "$READER_URL/internal/chats")"
          found=""
          while read -r cid; do
            page="$(curl -fsS --retry 2 --retry-delay 2 --max-time 110 -H "Authorization: Bearer $IAM_TOKEN" --get \
              --data-urlencode "date_from=$date_from" --data-urlencode "date_to=$date_to" --data-urlencode 'limit=500' \
              "$READER_URL/internal/chats/$cid/messages")" || continue
            row="$(echo "$page" | jq -c '[.messages[] | select(.media_type=="photo" or .media_type=="image" or .media_type=="gif" or .media_type=="animation")][0] // empty')"
            if [ -n "$row" ]; then found="$row"; break; fi
          done < <(echo "$chats" | jq -r '.chats[].chat_id')
          test -n "$found"
          cid="$(echo "$found" | jq -r '.chat_id')"
          mid="$(echo "$found" | jq -r '.message_id')"
          mtype="$(echo "$found" | jq -r '.media_type')"
          asset="$(curl -fsS --retry 1 --max-time 100 -H "Authorization: Bearer $IAM_TOKEN" --get \
            --data-urlencode "media_type=$mtype" "$READER_URL/internal/chats/$cid/messages/$mid/media")"
          echo "$asset" | jq -e '.object_key!=null and (.object_key|length)>0 and .media_url!=null and (.media_url|length)>0 and .preview_object_key!=null and (.preview_object_key|length)>0 and .preview_url!=null and (.preview_url|length)>0' >/dev/null
          media_url="$(echo "$asset" | jq -r '.media_url')"
          preview_url="$(echo "$asset" | jq -r '.preview_url')"
          curl -fsS --max-time 30 "$media_url" -o "$RUNNER_TEMP/media.bin"
          curl -fsS --max-time 30 "$preview_url" -o "$RUNNER_TEMP/preview.bin"
          test -s "$RUNNER_TEMP/media.bin"
          test -s "$RUNNER_TEMP/preview.bin"
          echo "MEDIA_TEST_CHAT=$cid"
          echo "MEDIA_TEST_MESSAGE=$mid"
          echo "MEDIA_TEST_TYPE=$mtype"
          echo "MEDIA_TEST_BYTES=$(wc -c < "$RUNNER_TEMP/media.bin")"
          echo "MEDIA_TEST_PREVIEW_BYTES=$(wc -c < "$RUNNER_TEMP/preview.bin")"
          echo SERVERLESS_MEDIA_E2E_PASS

      - name: Cleanup local credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/source.json" "$RUNNER_TEMP/media-payload.json" "$RUNNER_TEMP/reader-media-payload.json" "$RUNNER_TEMP/media.bin" "$RUNNER_TEMP/preview.bin"
