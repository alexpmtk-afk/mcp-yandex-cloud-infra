name: Inspect Current TEST Deployer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-current-test-deployer.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"

      - name: Authenticate and print non-secret identity
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          CURRENT_SA_ID="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          test -n "$CURRENT_SA_ID"
          echo "CURRENT_SA_ID=$CURRENT_SA_ID" >> "$GITHUB_ENV"
          echo "CURRENT_TEST_DEPLOYER_SA=$CURRENT_SA_ID"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"
          FOLDER_ID="$(yc resource-manager folder list --cloud-id b1gi4pr9msenirafh2c7 --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          echo "FOLDER_ID=$FOLDER_ID" >> "$GITHUB_ENV"
          yc config set folder-id "$FOLDER_ID"

      - name: Inspect TEST folder bindings for current and historical deployers
        shell: bash
        run: |
          set -euo pipefail
          HISTORICAL_SA_ID=ajecdjjrkdo1t3itpl9k
          yc resource-manager folder list-access-bindings "$FOLDER_ID" --format json --no-user-output > "$RUNNER_TEMP/folder-bindings.json"
          echo '--- CURRENT_DEPLOYER_FOLDER_ROLES ---'
          jq -r --arg id "$CURRENT_SA_ID" '.[]? | select((.subject.id // .subjectId // "") == $id or (.subject_id // "") == $id) | .role_id // .roleId // .role // empty' "$RUNNER_TEMP/folder-bindings.json" | sort -u
          echo '--- HISTORICAL_DEPLOYER_FOLDER_ROLES ---'
          jq -r --arg id "$HISTORICAL_SA_ID" '.[]? | select((.subject.id // .subjectId // "") == $id or (.subject_id // "") == $id) | .role_id // .roleId // .role // empty' "$RUNNER_TEMP/folder-bindings.json" | sort -u
          echo '--- DEPLOYER_BINDING_RECORDS ---'
          jq -c --arg cur "$CURRENT_SA_ID" --arg old "$HISTORICAL_SA_ID" '.[]? | select(((.subject.id // .subjectId // .subject_id // "") == $cur) or ((.subject.id // .subjectId // .subject_id // "") == $old))' "$RUNNER_TEMP/folder-bindings.json"

      - name: Inspect container and runtime-SA bindings
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_ID="$(yc serverless container list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          RUNTIME_SA_ID="$(yc iam service-account list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-runtime")|.id'|head -1)"
          echo "CONTAINER_ID=$CONTAINER_ID"
          echo "RUNTIME_SA_ID=$RUNTIME_SA_ID"
          echo '--- CONTAINER_BINDINGS ---'
          yc serverless container list-access-bindings --id "$CONTAINER_ID" --format json --no-user-output || true
          echo '--- RUNTIME_SA_BINDINGS ---'
          yc iam service-account list-access-bindings --id "$RUNTIME_SA_ID" --format json --no-user-output || true

      - name: Verify historical deployer service account still exists
        shell: bash
        run: |
          set +e
          yc iam service-account get ajecdjjrkdo1t3itpl9k --format json --no-user-output
          echo "historical_sa_lookup_exit=$?"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/folder-bindings.json"
