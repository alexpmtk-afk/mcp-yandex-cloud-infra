name: Marketplaces Archive Backfill 2026

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/marketplaces-archive-backfill-2026.yml

permissions:
  contents: read

concurrency:
  group: marketplaces-archive-backfill-2026
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 180
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          curl -fsSL --retry 5 --retry-delay 3 "$URL" -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate and resolve live MCP
        id: live
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create archive-backfill || true
          yc config set service-account-key "$KEY_FILE"

          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(timeout 45s yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          VERSION_ID="$(timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json | jq -r '[.[]|select(.status=="ACTIVE")][0].id')"
          DOMAIN="$(timeout 45s yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//.[0].domain//empty')"
          test -n "$SECRET_ID"
          test -n "$VERSION_ID"
          test -n "$DOMAIN"

          timeout 45s yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/sec.json"
          BEARER="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value' "$RUNNER_TEMP/sec.json")"
          test -n "$BEARER"
          echo "::add-mask::$BEARER"
          printf '%s' "$BEARER" > "$RUNNER_TEMP/bearer"
          chmod 600 "$RUNNER_TEMP/bearer"
          echo "url=https://${DOMAIN}/mcp" >> "$GITHUB_OUTPUT"
          echo 'LIVE_MCP_RESOLVED=PASS'

      - name: Backfill canonical WB 2026 archive
        shell: bash
        timeout-minutes: 170
        env:
          MCP_URL: ${{ steps.live.outputs.url }}
        run: |
          set -euo pipefail
          python -m pip install --quiet 'httpx>=0.27,<1'
          export MCP_BEARER="$(cat "$RUNNER_TEMP/bearer")"
          python -u - <<'PY'
          import itertools
          import json
          import os
          import sys
          import time
          import httpx

          YEAR = 2026
          MAX_REPORTS = 2
          MAX_ROUNDS = 80
          CABINETS = ("wb_dmitrieva", "wb_novokshenov", "wb_laser_master")

          timeout = httpx.Timeout(connect=15.0, read=650.0, write=60.0, pool=30.0)

          def unpack(response):
              response.raise_for_status()
              for line in response.text.splitlines():
                  if line.startswith('data:'):
                      return json.loads(line[5:].strip())
              return response.json() if response.text.strip() else None

          headers0 = {
              'Authorization': 'Bearer ' + os.environ['MCP_BEARER'],
              'Accept': 'application/json, text/event-stream',
              'Content-Type': 'application/json',
          }
          ids = itertools.count(1)

          with httpx.Client(timeout=timeout, follow_redirects=True) as client:
              response = client.post(os.environ['MCP_URL'], headers=headers0, json={
                  'jsonrpc': '2.0', 'id': next(ids), 'method': 'initialize', 'params': {
                      'protocolVersion': '2025-06-18', 'capabilities': {},
                      'clientInfo': {'name': 'archive-backfill-2026', 'version': '1'}
                  }
              })
              init = unpack(response)
              assert init and 'result' in init, init
              headers = dict(headers0)
              sid = response.headers.get('mcp-session-id')
              if sid:
                  headers['Mcp-Session-Id'] = sid
              headers['MCP-Protocol-Version'] = init['result'].get('protocolVersion', '2025-06-18')
              ready = client.post(os.environ['MCP_URL'], headers=headers, json={
                  'jsonrpc': '2.0', 'method': 'notifications/initialized'
              })
              assert ready.status_code in (200, 202), ready.status_code

              def rpc(method, params=None):
                  response = client.post(os.environ['MCP_URL'], headers=headers, json={
                      'jsonrpc': '2.0', 'id': next(ids), 'method': method, 'params': params or {}
                  })
                  data = unpack(response)
                  assert data and 'result' in data, (method, data)
                  return data['result']

              def call(name, arguments):
                  result = rpc('tools/call', {'name': name, 'arguments': arguments})
                  if result.get('isError'):
                      raise RuntimeError(f'{name} failed: {result}')
                  text = next((item.get('text') for item in result.get('content', []) if item.get('type') == 'text'), None)
                  if text is None:
                      raise RuntimeError(f'{name} returned no text')
                  return json.loads(text)

              tools = {item['name'] for item in rpc('tools/list')['tools']}
              required = {'marketplace_archive_update', 'marketplace_archive_status', 'marketplace_archive_query'}
              assert required <= tools, sorted(required - tools)
              print('ARCHIVE_TOOLS=PASS', flush=True)

              before = call('marketplace_archive_status', {'year': YEAR})
              assert before.get('ok') is True, before
              print('ARCHIVE_STATUS_BEFORE=PASS', flush=True)

              control = call('marketplace_archive_update', {
                  'year': YEAR,
                  'seller': 'wb_novokshenov',
                  'max_reports_per_cabinet': 1,
              })
              assert control.get('ok') is True, control
              control_rows = control.get('cabinets') or []
              assert len(control_rows) == 1, control
              downloaded = control_rows[0].get('downloaded_report_ids') or []
              assert len(downloaded) <= 1, control
              assert int(control_rows[0].get('bytes') or 0) > 0 or not downloaded, control
              print(f'CONTROL_REPORT=PASS downloaded={downloaded}', flush=True)

              complete = False
              for round_no in range(1, MAX_ROUNDS + 1):
                  result = call('marketplace_archive_update', {
                      'year': YEAR,
                      'seller': 'all',
                      'max_reports_per_cabinet': MAX_REPORTS,
                  })
                  assert result.get('ok') is True, result
                  states = []
                  for cabinet in result.get('cabinets') or []:
                      states.append({
                          'cabinet': cabinet.get('cabinet'),
                          'downloaded': len(cabinet.get('downloaded_report_ids') or []),
                          'remaining': len(cabinet.get('remaining_report_ids') or []),
                          'rows': int(cabinet.get('total_rows') or 0),
                          'bytes': int(cabinet.get('bytes') or 0),
                      })
                  print(f'BACKFILL_ROUND={round_no} complete={result.get("complete")} states={json.dumps(states, ensure_ascii=False)}', flush=True)
                  if result.get('complete') is True and result.get('continue_required') is False:
                      complete = True
                      break
                  time.sleep(2)

              if not complete:
                  raise RuntimeError('Archive backfill did not reach complete=true within bounded rounds')

              status = call('marketplace_archive_status', {'year': YEAR})
              assert status.get('ok') is True, status
              cabinets = status.get('cabinets') or {}
              assert set(CABINETS) <= set(cabinets), cabinets
              for name in CABINETS:
                  item = cabinets[name]
                  assert int(item.get('complete_report_ids') or 0) > 0, (name, item)
                  assert int(item.get('bytes') or 0) > 0, (name, item)
                  assert item.get('storage_object_key'), (name, item)
              print('ARCHIVE_STATUS_FINAL=PASS', flush=True)

              rerun = call('marketplace_archive_update', {
                  'year': YEAR,
                  'seller': 'all',
                  'max_reports_per_cabinet': 1,
              })
              assert rerun.get('ok') is True and rerun.get('complete') is True, rerun
              for cabinet in rerun.get('cabinets') or []:
                  assert not (cabinet.get('downloaded_report_ids') or []), cabinet
                  assert not (cabinet.get('remaining_report_ids') or []), cabinet
              print('ARCHIVE_IDEMPOTENCY=PASS', flush=True)

              query = call('marketplace_archive_query', {
                  'year': YEAR,
                  'sql': 'SELECT archive_cabinet, count(*) AS rows FROM wb_all GROUP BY archive_cabinet ORDER BY archive_cabinet'
              })
              assert query.get('ok') is True, query
              rows = query.get('rows') or []
              assert len(rows) == 3, query
              counts = {str(row[0]): int(row[1]) for row in rows}
              assert set(CABINETS) == set(counts), counts
              assert all(value > 0 for value in counts.values()), counts
              print('ARCHIVE_QUERY=PASS ' + json.dumps(counts, ensure_ascii=False), flush=True)

              sizes = {name: int(cabinets[name].get('bytes') or 0) for name in CABINETS}
              report_counts = {name: int(cabinets[name].get('complete_report_ids') or 0) for name in CABINETS}
              print('ARCHIVE_BACKFILL_2026=PASS', flush=True)
              print('ARCHIVE_FINAL_SIZES=' + json.dumps(sizes, ensure_ascii=False, sort_keys=True), flush=True)
              print('ARCHIVE_FINAL_REPORT_COUNTS=' + json.dumps(report_counts, ensure_ascii=False, sort_keys=True), flush=True)
          PY

      - name: Cleanup ephemeral credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/sec.json" "$RUNNER_TEMP/bearer"
