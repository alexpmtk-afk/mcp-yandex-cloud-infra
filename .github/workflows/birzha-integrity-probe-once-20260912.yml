name: BIRZHA MCP integrity probe once 2026-09-12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/birzha-integrity-probe-once-20260912.yml'

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 25
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Ground runtime and token coordinates
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"; chmod 600 "$KEY_FILE"
          echo "YC_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          terraform -chdir=terraform/birzha_test init -reconfigure -input=false -lockfile=readonly \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" \
            -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY"
          terraform -chdir=terraform/birzha_test output -json > "$RUNNER_TEMP/outputs.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          o=json.loads((Path(os.environ['RUNNER_TEMP'])/'outputs.json').read_text()); v=lambda k:o[k]['value']
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'MCP_ENDPOINT={v("mcp_endpoint")}\n')
              f.write(f'MCP_AUTH_SECRET_ID={v("mcp_auth_secret_id")}\n')
              f.write(f'MCP_AUTH_VERSION_ID={v("mcp_auth_secret_version_id")}\n')
          PY

      - name: Install clients and read masked token
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'mcp==2.1.1' 'yandexcloud'
          python - <<'PY'
          import json, os
          from pathlib import Path
          import yandexcloud
          from yandex.cloud.lockbox.v1.payload_service_pb2 import GetPayloadRequest
          from yandex.cloud.lockbox.v1.payload_service_pb2_grpc import PayloadServiceStub
          key=json.loads(Path(os.environ['YC_KEY_FILE']).read_text())
          service=yandexcloud.SDK(service_account_key=key).client(PayloadServiceStub)
          p=service.Get(GetPayloadRequest(secret_id=os.environ['MCP_AUTH_SECRET_ID'],version_id=os.environ['MCP_AUTH_VERSION_ID']))
          vals=[e.text_value for e in p.entries if e.key=='bearer_token']; assert len(vals)==1
          token=vals[0]; print(f'::add-mask::{token}')
          q=Path(os.environ['RUNNER_TEMP'])/'mcp-token'; q.write_text(token); q.chmod(0o600)
          PY

      - name: Run integrity probes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio, json, os
          from pathlib import Path
          import httpx2
          from mcp import Client
          from mcp.client.streamable_http import streamable_http_client

          report={'errors':[],'results':{}}
          async def call(c,n,a,critical=False):
              try:
                  r=await c.call_tool(n,a)
                  if r.is_error: raise RuntimeError(str(r))
                  d=r.structured_content
                  report['results'][n+':'+json.dumps(a,sort_keys=True)] = d
                  return d
              except Exception as e:
                  report['errors'].append({'tool':n,'args':a,'critical':critical,'type':type(e).__name__,'error':str(e)[:1200]})
                  return None

          def last_close(d):
              if not isinstance(d,dict): return None
              xs=d.get('candles') or []
              if not xs: return None
              x=xs[-1]
              return x.get('close') if isinstance(x,dict) else None

          async def main():
              token=(Path(os.environ['RUNNER_TEMP'])/'mcp-token').read_text()
              timeout=httpx2.Timeout(30.0,read=600.0)
              async with httpx2.AsyncClient(headers={'Authorization':f'Bearer {token}'},timeout=timeout,follow_redirects=True) as hc:
                  async with Client(streamable_http_client(os.environ['MCP_ENDPOINT'],http_client=hc)) as c:
                      # GOLD semantic correctness: accepted project meaning is rolling futures root GD*.
                      gold=await call(c,'market.resolve_instrument',{'symbol':'GOLD'},True)
                      if gold:
                          ok=(gold.get('asset_class')=='future' and gold.get('root_symbol')=='GOLD' and str(gold.get('secid','')).upper().startswith('GD'))
                          report['gold_semantics_ok']=ok
                          report['gold_resolution']={k:gold.get(k) for k in ('symbol','secid','asset_class','root_symbol','board','market')}
                          if not ok: report['errors'].append({'tool':'market.resolve_instrument','args':{'symbol':'GOLD'},'critical':True,'type':'SemanticMismatch','error':'GOLD is not resolving to rolling GD* futures'})

                      # Exact same-day price consistency across direct candles and snapshot.
                      direct={}
                      for tf in ('D1','H1','M15'):
                          d=await call(c,'market.candles',{'symbol':'SBER','timeframe':tf,'from_date':'2026-09-11','till_date':'2026-09-11','completed_only':True},True)
                          direct[tf]=last_close(d)
                      snap=await call(c,'market.snapshot',{'symbol':'SBER','as_of_date':'2026-09-11'},True)
                      snap_close={tf:(snap or {}).get(tf.lower(),{}).get('last_close') for tf in ('D1','H1','M15')}
                      report['direct_last_close']=direct; report['snapshot_last_close']=snap_close
                      mismatches={tf:{'direct':direct[tf],'snapshot':snap_close[tf]} for tf in direct if direct[tf] is not None and snap_close[tf] is not None and abs(float(direct[tf])-float(snap_close[tf]))>1e-9}
                      report['snapshot_close_mismatches']=mismatches
                      if mismatches: report['errors'].append({'tool':'market.snapshot','args':{'symbol':'SBER','as_of_date':'2026-09-11'},'critical':True,'type':'PriceConsistencyMismatch','error':json.dumps(mismatches,sort_keys=True)})

                      # Explicit ALGOPACK interval over trading days.
                      flow=await call(c,'market.flow',{'symbol':'SBER','from_date':'2026-09-08','till_date':'2026-09-11','lookback_days':5},False)
                      if flow: report['flow_summary']={k:flow.get(k) for k in ('data_quality','intervals','volume_delta','volume_delta_ratio','from_date','till_date')}

                      # Idempotent historical write on an already-covered D1 range.
                      hs=await call(c,'history.sync',{'symbol':'SBER','timeframe':'D1','from_date':'2026-09-01','till_date':'2026-09-05'},True)
                      if hs:
                          report['history_sync_summary']={k:hs.get(k) for k in ('status','requested_sessions','missing_sessions','fetched_candles','stored_candles','contract_count')}
                          if hs.get('status')!='PASS': report['errors'].append({'tool':'history.sync','args':{},'critical':True,'type':'StatusError','error':str(hs)[:900]})

                      # Forecast journal write/read in TEST runtime.
                      cr=await call(c,'forecast.create',{'symbol':'SBER','as_of_date':'2026-09-11'},True)
                      f=(cr or {}).get('forecast') or cr or {}; fid=f.get('forecast_id')
                      report['created_forecast_id']=fid
                      if not fid:
                          report['errors'].append({'tool':'forecast.create','args':{},'critical':True,'type':'MissingForecastId','error':'forecast_id absent'})
                      else:
                          got=await call(c,'forecast.get',{'forecast_id':fid},True)
                          if not got or got.get('forecast_id')!=fid:
                              report['errors'].append({'tool':'forecast.get','args':{'forecast_id':fid},'critical':True,'type':'JournalMismatch','error':'created forecast could not be read back identically by id'})

                      # Outcome append-only path on an older durable forecast if one is available.
                      fl=await call(c,'forecast.list',{'limit':20,'symbol':'SBER'},True)
                      forecasts=(fl or {}).get('forecasts') or []
                      older=None
                      if forecasts:
                          older=sorted(forecasts,key=lambda x:str(x.get('created_at_t0','')))[0]
                      if older and older.get('forecast_id'):
                          ofid=older['forecast_id']; report['outcome_probe_forecast_id']=ofid
                          ev=await call(c,'outcome.evaluate',{'forecast_id':ofid,'evaluation_date':'2026-09-11'},True)
                          ol=await call(c,'outcome.list',{'forecast_id':ofid},True)
                          report['outcome_evaluate_status']=(ev or {}).get('status')
                          report['outcome_count']=(ol or {}).get('count')

                      # Model-validation surface should execute, even if statistical result is reject/no-data.
                      va=await call(c,'validation.assess_model',{'symbol':'SBER','start_date':'2026-06-01','end_date':'2026-08-14','step_sessions':10,'max_points':5},False)
                      if va: report['validation_status']=va.get('status')

              crit=[e for e in report['errors'] if e.get('critical')]
              report['critical_error_count']=len(crit); report['error_count']=len(report['errors']); report['status']='PASS' if not crit else 'FAIL'
              # Keep only compact summaries in log.
              for k in list(report['results']): del report['results'][k]
              print('BIRZHA_INTEGRITY_REPORT='+json.dumps(report,ensure_ascii=False,sort_keys=True))
              if crit: raise SystemExit(2)
          asyncio.run(main())
          PY

      - name: Cleanup credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/mcp-token"
