name: Yandex Cloud one-shot inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yandex-cloud-inventory-now.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    env:
      YC_CLOUD_ID: b1gi4pr9msenirafh2c7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"

      - name: Authenticate read-only inventory
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create inventory || true
          yc config set service-account-key "$KEY_FILE"
          yc config set cloud-id "$YC_CLOUD_ID"

      - name: Inventory cloud and folders
        shell: bash
        run: |
          set +e
          echo '=== CLOUD ==='
          yc resource-manager cloud get "$YC_CLOUD_ID" --format json --no-user-output | jq '{id,name,created_at,organization_id}'
          echo '=== FOLDERS ==='
          yc resource-manager folder list --cloud-id "$YC_CLOUD_ID" --format json --no-user-output | jq '[.[] | {id,name,status,created_at}]'

          yc resource-manager folder list --cloud-id "$YC_CLOUD_ID" --format json --no-user-output | jq -r '.[].id' | while read -r FID; do
            FNAME="$(yc resource-manager folder get "$FID" --format json --no-user-output 2>/dev/null | jq -r '.name // "?"')"
            echo "=== FOLDER id=$FID name=$FNAME ==="

            echo '-- SERVERLESS_CONTAINERS --'
            CONTAINERS="$(yc serverless container list --folder-id "$FID" --format json --no-user-output 2>/dev/null)"
            printf '%s\n' "$CONTAINERS" | jq '[.[] | {id,name,status,created_at,url}]' 2>/dev/null || true
            printf '%s\n' "$CONTAINERS" | jq -r '.[].id' 2>/dev/null | while read -r CID; do
              echo "-- CONTAINER_REVISIONS container=$CID --"
              yc serverless container revision list --container-id "$CID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,container_id,created_at,status,resources,execution_timeout,concurrency,provision_policy,service_account_id}]' || true
            done

            echo '-- API_GATEWAYS --'
            yc serverless api-gateway list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,status,created_at,domain,execution_timeout}]' || true

            echo '-- FUNCTIONS --'
            yc serverless function list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,status,created_at}]' || true

            echo '-- TRIGGERS --'
            yc serverless trigger list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,status,created_at}]' || true

            echo '-- CONTAINER_REGISTRIES --'
            REGISTRIES="$(yc container registry list --folder-id "$FID" --format json --no-user-output 2>/dev/null)"
            printf '%s\n' "$REGISTRIES" | jq '[.[] | {id,name,status,created_at}]' 2>/dev/null || true
            printf '%s\n' "$REGISTRIES" | jq -r '.[].id' 2>/dev/null | while read -r RID; do
              echo "-- REGISTRY_IMAGES registry=$RID --"
              yc container image list --registry-id "$RID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,digest,created_at,compressed_size}]' || true
            done

            echo '-- OBJECT_STORAGE_BUCKETS --'
            yc storage bucket list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {name,folder_id,created_at,max_size,default_storage_class,versioning}]' || true

            echo '-- LOCKBOX_METADATA --'
            yc lockbox secret list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,status,created_at}]' || true

            echo '-- SERVICE_ACCOUNTS --'
            yc iam service-account list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,created_at}]' || true

            echo '-- COMPUTE_INSTANCES --'
            yc compute instance list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,status,created_at,zone_id,platform_id,resources}]' || true

            echo '-- VPC_NETWORKS --'
            yc vpc network list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,created_at}]' || true

            echo '-- VPC_SUBNETS --'
            yc vpc subnet list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,created_at,zone_id,network_id,v4_cidr_blocks}]' || true

            echo '-- YDB_DATABASES --'
            yc ydb database list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,status,created_at,type}]' || true

            echo '-- KUBERNETES_CLUSTERS --'
            yc managed-kubernetes cluster list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,status,created_at}]' || true

            echo '-- POSTGRES_CLUSTERS --'
            yc managed-postgresql cluster list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,status,created_at}]' || true

            echo '-- MYSQL_CLUSTERS --'
            yc managed-mysql cluster list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,status,created_at}]' || true

            echo '-- CLICKHOUSE_CLUSTERS --'
            yc managed-clickhouse cluster list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,status,created_at}]' || true

            echo '-- LOG_GROUPS --'
            yc logging group list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,status,created_at,retention_period}]' || true

            echo '-- KMS_SYMMETRIC_KEYS --'
            yc kms symmetric-key list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,status,created_at,rotation_period}]' || true
          done

      - name: Cleanup ephemeral key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json"
