name: Telegram News On-Demand

on:
  push:
    branches: [main]
    paths:
      - telegram-news-reader/requests/ondemand.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-news-ondemand
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-news-ondemand || true
          yc config profile activate telegram-news-ondemand
          yc config set service-account-key "$key"

      - name: Export requested chat
        shell: bash
        run: |
          set -euo pipefail
          request="telegram-news-reader/requests/ondemand.json"
          test -f "$request"
          chat_id="$(jq -er '.chat_id | numbers' "$request")"
          limit="$(jq -er '(.limit // 20) | numbers' "$request")"
          if [ "$limit" -lt 1 ]; then limit=1; fi
          if [ "$limit" -gt 100 ]; then limit=100; fi

          folder="b1gk4p83brasi8g811jv"
          ip="$(curl -fsS https://api.ipify.org)"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/tgkey"
          old_keys="$(yc compute instance get telegram-news-reader --folder-id "$folder" --format json | jq -r '.metadata["ssh-keys"] // ""')"
          printf '%s' "$old_keys" > "$RUNNER_TEMP/oldkeys"
          { printf '%s\n' "$old_keys"; printf 'ubuntu:'; cat "$RUNNER_TEMP/tgkey.pub"; } > "$RUNNER_TEMP/newkeys"
          yc compute instance add-metadata telegram-news-reader --folder-id "$folder" --metadata-from-file ssh-keys="$RUNNER_TEMP/newkeys"
          yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id "$folder" --add-rule "description=github-telegram-news-ondemand,direction=ingress,port=22,protocol=tcp,v4-cidrs=$ip/32"
          sleep 20

          mkdir -p telegram-news-reader/ondemand
          remote_cmd="sudo docker exec telegram-reader python -c 'import json,sys; from datetime import datetime,timezone; from app.runtime import build_runtime; _,w,_,s=build_runtime(); cid=int(sys.argv[1]); lim=int(sys.argv[2]); w.assert_allowed(cid); print(json.dumps({\"schema\":\"TELEGRAM_NEWS_ONDEMAND_V1\",\"generated_at\":datetime.now(timezone.utc).isoformat(),\"chat_id\":cid,\"messages\":s.get_recent_local(cid,lim)},ensure_ascii=False))' $chat_id $limit"
          ssh -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o ConnectTimeout=20 -i "$RUNNER_TEMP/tgkey" ubuntu@111.88.248.156 "$remote_cmd" > telegram-news-reader/ondemand/latest.json

          jq -e '.schema == "TELEGRAM_NEWS_ONDEMAND_V1" and (.chat_id | type == "number") and (.messages | type == "array")' telegram-news-reader/ondemand/latest.json >/dev/null
          echo "ONDEMAND_EXPORT_PASS"
          jq '{generated_at,chat_id,message_count:(.messages|length),latest_datetime:(.messages[0].datetime // null),latest_message_id:(.messages[0].message_id // null)}' telegram-news-reader/ondemand/latest.json

      - name: Commit latest on-demand response
        shell: bash
        run: |
          set -euo pipefail
          git config user.name telegram-news-ondemand
          git config user.email telegram-news-ondemand@users.noreply.github.com
          git add telegram-news-reader/ondemand/latest.json
          if git diff --cached --quiet; then
            echo ONDEMAND_UNCHANGED
          else
            git commit -m "telegram-news: refresh on-demand chat"
            git push origin HEAD:main
            echo ONDEMAND_PUSH_PASS
          fi

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          yc config profile activate telegram-news-ondemand >/dev/null 2>&1 || true
          folder="b1gk4p83brasi8g811jv"
          ids=$(yc vpc security-group get enpocnvnpdu2goj9nkjn --folder-id "$folder" --format json | jq -r '.rules[] | select(.description=="github-telegram-news-ondemand") | .id')
          for id in $ids; do yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id "$folder" --delete-rule-id "$id"; done
          if [ -f "$RUNNER_TEMP/oldkeys" ]; then yc compute instance add-metadata telegram-news-reader --folder-id "$folder" --metadata-from-file ssh-keys="$RUNNER_TEMP/oldkeys"; fi
          rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/tgkey" "$RUNNER_TEMP/tgkey.pub" "$RUNNER_TEMP/oldkeys" "$RUNNER_TEMP/newkeys"
