name: Telegram News On-Demand

on:
  push:
    branches: [main]
    paths:
      - telegram-news-reader/requests/ondemand.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-news-reader-ssh
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-news-ondemand || true
          yc config profile activate telegram-news-ondemand
          yc config set service-account-key "$key"

      - name: Export requested chats
        shell: bash
        run: |
          set -euo pipefail
          request="telegram-news-reader/requests/ondemand.json"
          test -f "$request"

          limit="$(jq -er '(.limit // 200) | numbers' "$request")"
          if [ "$limit" -lt 1 ]; then limit=1; fi
          if [ "$limit" -gt 2000 ]; then limit=2000; fi

          chat_ids="$(jq -cer '
            if (.chat_ids? | type) == "array" then .chat_ids
            elif (.chat_id? | type) == "number" then [.chat_id]
            else error("chat_id or chat_ids required") end
            | map(select(type == "number"))
            | unique
            | if length == 0 then error("no chat ids") else . end
            | if length > 5 then error("maximum 5 chats per on-demand request") else . end
          ' "$request")"

          period_hours="$(jq -r '(.period_hours // 24) | tostring' "$request")"
          if ! [[ "$period_hours" =~ ^[0-9]+$ ]]; then period_hours=24; fi
          if [ "$period_hours" -lt 1 ]; then period_hours=1; fi
          if [ "$period_hours" -gt 192 ]; then period_hours=192; fi

          date_from="$(jq -r '.date_from // "-"' "$request")"
          date_to="$(jq -r '.date_to // "-"' "$request")"

          folder="b1gk4p83brasi8g811jv"
          ip="$(curl -fsS https://api.ipify.org)"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/tgkey"
          old_keys="$(yc compute instance get telegram-news-reader --folder-id "$folder" --format json | jq -r '.metadata["ssh-keys"] // ""')"
          printf '%s' "$old_keys" > "$RUNNER_TEMP/oldkeys"
          { printf '%s\n' "$old_keys"; printf 'ubuntu:'; cat "$RUNNER_TEMP/tgkey.pub"; } > "$RUNNER_TEMP/newkeys"
          yc compute instance add-metadata telegram-news-reader --folder-id "$folder" --metadata-from-file ssh-keys="$RUNNER_TEMP/newkeys"
          yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id "$folder" --add-rule "description=github-telegram-news-ondemand,direction=ingress,port=22,protocol=tcp,v4-cidrs=$ip/32"

          ssh_opts=(-o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -i "$RUNNER_TEMP/tgkey")
          ssh_ready=0
          for attempt in $(seq 1 12); do
            if ssh "${ssh_opts[@]}" ubuntu@111.88.248.156 true >/dev/null 2>&1; then
              ssh_ready=1
              break
            fi
            echo "SSH key not active yet; retry $attempt/12"
            sleep 10
          done
          if [ "$ssh_ready" -ne 1 ]; then
            echo "SSH_READY_TIMEOUT"
            exit 255
          fi

          mkdir -p telegram-news-reader/ondemand
          ids_csv="$(echo "$chat_ids" | jq -r 'join(",")')"
          remote_cmd="sudo docker exec telegram-reader python -c 'import json,sys; from datetime import datetime,timezone,timedelta; from app.runtime import build_runtime; _,w,_,s=build_runtime(); ids=[int(x) for x in sys.argv[1].split(\",\") if x]; lim=int(sys.argv[2]); ph=int(sys.argv[3]); raw_from=sys.argv[4]; raw_to=sys.argv[5]; parse=lambda x: datetime.fromisoformat(x.replace(\"Z\",\"+00:00\")) if x!=\"-\" else None; dt_to=parse(raw_to) or datetime.now(timezone.utc); dt_from=parse(raw_from) or (dt_to-timedelta(hours=ph)); out=[]; [w.assert_allowed(cid) for cid in ids]; [out.append({\"chat_id\":cid,\"messages\":s.get_messages_local(cid,date_from=dt_from,date_to=dt_to,limit=lim)}) for cid in ids]; print(json.dumps({\"schema\":\"TELEGRAM_NEWS_ONDEMAND_V3\",\"generated_at\":datetime.now(timezone.utc).isoformat(),\"date_from\":dt_from.isoformat(),\"date_to\":dt_to.isoformat(),\"period_hours\":ph,\"chat_count\":len(out),\"chats\":out},ensure_ascii=False))' $ids_csv $limit $period_hours $date_from $date_to"
          ssh "${ssh_opts[@]}" ubuntu@111.88.248.156 "$remote_cmd" > telegram-news-reader/ondemand/latest.json

          jq -e '.schema == "TELEGRAM_NEWS_ONDEMAND_V3" and (.chat_count | type == "number") and (.chats | type == "array") and ((.chats | length) == .chat_count) and (.date_from | type == "string") and (.date_to | type == "string")' telegram-news-reader/ondemand/latest.json >/dev/null
          echo "ONDEMAND_EXPORT_PASS"
          jq '{generated_at,date_from,date_to,period_hours,chat_count,chats:[.chats[]|{chat_id,message_count:(.messages|length),latest_datetime:(.messages[0].datetime // null),oldest_datetime:(.messages[-1].datetime // null),latest_message_id:(.messages[0].message_id // null)}]}' telegram-news-reader/ondemand/latest.json

      - name: Commit latest on-demand response
        shell: bash
        run: |
          set -euo pipefail
          git config user.name telegram-news-ondemand
          git config user.email telegram-news-ondemand@users.noreply.github.com
          git add telegram-news-reader/ondemand/latest.json
          if git diff --cached --quiet; then
            echo ONDEMAND_UNCHANGED
          else
            git commit -m "telegram-news: refresh on-demand period"
            git push origin HEAD:main
            echo ONDEMAND_PUSH_PASS
          fi

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          yc config profile activate telegram-news-ondemand >/dev/null 2>&1 || true
          folder="b1gk4p83brasi8g811jv"
          ids=$(yc vpc security-group get enpocnvnpdu2goj9nkjn --folder-id "$folder" --format json | jq -r '.rules[] | select(.description=="github-telegram-news-ondemand") | .id')
          for id in $ids; do yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id "$folder" --delete-rule-id "$id"; done
          if [ -f "$RUNNER_TEMP/oldkeys" ]; then yc compute instance add-metadata telegram-news-reader --folder-id "$folder" --metadata-from-file ssh-keys="$RUNNER_TEMP/oldkeys"; fi
          rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/tgkey" "$RUNNER_TEMP/tgkey.pub" "$RUNNER_TEMP/oldkeys" "$RUNNER_TEMP/newkeys"
