name: Local Marketplaces Object Storage export 2026-09-17

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/local-marketplaces-object-storage-export-20260917-temp.yml"

permissions:
  contents: read

concurrency:
  group: local-marketplaces-object-storage-export-20260917
  cancel-in-progress: false

jobs:
  export:
    runs-on: [self-hosted, Windows, X64, gpt-powershell-work]
    environment: test
    timeout-minutes: 90
    env:
      YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
    steps:
      - name: Export Yandex Object Storage directly to WORK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $python = 'C:\MCP\projects\marketplaces-mcp-ru\.venv\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'Marketplaces Python venv missing' }
          $script = Join-Path $env:RUNNER_TEMP 'export_yandex_marketplaces.py'
          @'
          import hashlib
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import jwt

          ROOT = Path(r'C:\MCP\data\marketplaces\yandex-object-storage')
          BUCKETS = {
              'archive': 'marketplaces-mcp-archive-b1gnd0dqoq3ljod88i8t',
              'tfstate': 'marketplaces-mcp-tfstate-b1gnd0dqoq3ljod88i8t',
          }
          ENDPOINT = 'https://storage.yandexcloud.net'

          key = json.loads(os.environ['YC_SERVICE_ACCOUNT_KEY_JSON'])
          for field in ('service_account_id', 'private_key', 'id'):
              if not key.get(field):
                  raise RuntimeError(f'missing service-account field: {field}')
          now = int(time.time())
          signed = jwt.encode(
              {'aud':'https://iam.api.cloud.yandex.net/iam/v1/tokens',
               'iss':key['service_account_id'],'iat':now,'exp':now+3600},
              key['private_key'], algorithm='PS256', headers={'kid':key['id']},
          )
          req = urllib.request.Request(
              'https://iam.api.cloud.yandex.net/iam/v1/tokens',
              data=json.dumps({'jwt': signed}).encode('utf-8'),
              headers={'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(req, timeout=30) as response:
              token = json.loads(response.read())['iamToken']
          if not token:
              raise RuntimeError('empty IAM token')
          headers = {'Authorization': f'Bearer {token}'}
          print('YANDEX_IAM_TOKEN=PASS')

          def text_of(elem, local):
              for child in elem:
                  if child.tag.rsplit('}', 1)[-1] == local:
                      return child.text or ''
              return ''

          def list_objects(bucket):
              token_next = None
              items = []
              while True:
                  q = {'list-type':'2','max-keys':'1000'}
                  if token_next:
                      q['continuation-token'] = token_next
                  url = f"{ENDPOINT}/{bucket}?{urllib.parse.urlencode(q)}"
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=90) as response:
                      root = ET.fromstring(response.read())
                  for node in root.iter():
                      if node.tag.rsplit('}', 1)[-1] != 'Contents':
                          continue
                      k = text_of(node, 'Key')
                      if not k:
                          continue
                      items.append({
                          'key': k,
                          'size': int(text_of(node, 'Size') or 0),
                          'etag': text_of(node, 'ETag').strip('"'),
                          'last_modified': text_of(node, 'LastModified'),
                      })
                  truncated = next((n.text for n in root.iter() if n.tag.rsplit('}',1)[-1]=='IsTruncated'), 'false')
                  if str(truncated).lower() != 'true':
                      break
                  token_next = next((n.text for n in root.iter() if n.tag.rsplit('}',1)[-1]=='NextContinuationToken'), None)
                  if not token_next:
                      raise RuntimeError('truncated list without continuation token')
              return items

          def safe_target(base, key_name):
              rel = Path(*[p for p in key_name.replace('\\','/').split('/') if p not in ('', '.')])
              if '..' in rel.parts:
                  raise RuntimeError(f'unsafe object key: {key_name!r}')
              target = (base / rel).resolve()
              base_resolved = base.resolve()
              try:
                  target.relative_to(base_resolved)
              except ValueError:
                  raise RuntimeError(f'object escapes destination: {key_name!r}')
              return target

          ROOT.mkdir(parents=True, exist_ok=True)
          all_summary = {}
          for label, bucket in BUCKETS.items():
              dest = ROOT / label
              dest.mkdir(parents=True, exist_ok=True)
              objects = list_objects(bucket)
              expected_total = sum(x['size'] for x in objects)
              print(f'BUCKET_LIST=PASS label={label} objects={len(objects)} bytes={expected_total}')
              manifest = []
              downloaded_total = 0
              files = 0
              for index, item in enumerate(objects, 1):
                  key_name = item['key']
                  if key_name.endswith('/'):
                      continue
                  target = safe_target(dest, key_name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  encoded = urllib.parse.quote(key_name, safe='/-_.~')
                  request = urllib.request.Request(f'{ENDPOINT}/{bucket}/{encoded}', headers=headers)
                  h = hashlib.sha256()
                  n = 0
                  with urllib.request.urlopen(request, timeout=180) as response, target.open('wb') as out:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          out.write(chunk)
                          h.update(chunk)
                          n += len(chunk)
                  if n != item['size']:
                      raise RuntimeError(f'size mismatch for {key_name!r}: expected={item["size"]} got={n}')
                  downloaded_total += n
                  files += 1
                  manifest.append({**item, 'downloaded_size': n, 'sha256': h.hexdigest()})
                  if index % 100 == 0:
                      print(f'EXPORT_PROGRESS label={label} processed={index}/{len(objects)} bytes={downloaded_total}')
              manifest_path = dest / '_manifest.json'
              manifest_path.write_text(json.dumps({
                  'bucket': bucket,
                  'exported_at_epoch': int(time.time()),
                  'objects': manifest,
              }, ensure_ascii=False, indent=2), encoding='utf-8')
              if downloaded_total != sum(x['size'] for x in objects if not x['key'].endswith('/')):
                  raise RuntimeError(f'aggregate size mismatch for {bucket}')
              all_summary[label] = {
                  'bucket': bucket,
                  'listed_objects': len(objects),
                  'downloaded_files': files,
                  'downloaded_bytes': downloaded_total,
              }
              print(f'BUCKET_EXPORT=PASS label={label} files={files} bytes={downloaded_total}')

          summary_path = ROOT / '_export_summary.json'
          summary_path.write_text(json.dumps(all_summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print('MARKETPLACES_OBJECT_STORAGE_EXPORT=PASS')
          '@ | Set-Content -LiteralPath $script -Encoding UTF8
          try {
            & $python $script
            if ($LASTEXITCODE -ne 0) { throw "export failed with exit code $LASTEXITCODE" }
          }
          finally {
            Remove-Item -LiteralPath $script -Force -ErrorAction SilentlyContinue
          }

      - name: Verify local export summary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $summary = 'C:\MCP\data\marketplaces\yandex-object-storage\_export_summary.json'
          if (-not (Test-Path -LiteralPath $summary -PathType Leaf)) { throw 'export summary missing' }
          $obj = Get-Content -LiteralPath $summary -Raw | ConvertFrom-Json
          Write-Host ("MARKETPLACES_LOCAL_COPY=PASS archive_files={0} archive_bytes={1} tfstate_files={2} tfstate_bytes={3}" -f $obj.archive.downloaded_files,$obj.archive.downloaded_bytes,$obj.tfstate.downloaded_files,$obj.tfstate.downloaded_bytes)
