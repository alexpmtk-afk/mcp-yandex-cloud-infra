name: Telegram Reader MTProxy Layered Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/telegram-reader-mtproxy-layered-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Independent Fake-TLS MTProxy 443 check outside Yandex
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" -q install telethon==1.44.0 python-socks
          cat > "$RUNNER_TEMP/independent.py" <<'PY'
          import asyncio, json, socket, time, urllib.parse, urllib.request
          from telethon import TelegramClient, connection
          from telethon.sessions import MemorySession

          URL='https://raw.githubusercontent.com/SoliSpirit/mtproto/main/all_proxies.txt'
          raw=urllib.request.urlopen(URL, timeout=20).read().decode()
          proxies=[]
          for line in raw.splitlines():
              line=line.strip()
              if not (line.startswith('tg://proxy?') or line.startswith('https://t.me/proxy?')):
                  continue
              q=urllib.parse.parse_qs(urllib.parse.urlsplit(line).query)
              try:
                  host=q['server'][0].rstrip('.')
                  port=int(q['port'][0])
                  secret=urllib.parse.unquote(q['secret'][0])
                  bytes.fromhex(secret)
                  if port != 443 or not secret.lower().startswith('ee'):
                      continue
                  proxies.append({'host':host,'port':port,'secret':secret})
              except Exception:
                  continue
              if len(proxies)>=80:
                  break

          print(f'FAKETLS443_SOURCE_CANDIDATES={len(proxies)}')

          async def check(idx,p):
              host,port,secret=p['host'],p['port'],p['secret']
              t=time.monotonic()
              try:
                  infos=await asyncio.get_running_loop().run_in_executor(None, socket.getaddrinfo, host, port, socket.AF_UNSPEC, socket.SOCK_STREAM)
                  ips=sorted({x[4][0] for x in infos})
                  print(f'INDEP_{idx}_DNS=PASS host={host} ips={",".join(ips[:6])} latency_ms={int((time.monotonic()-t)*1000)}')
              except Exception as e:
                  print(f'INDEP_{idx}=PROXY_DNS_FAIL host={host} error={type(e).__name__}')
                  return None
              t=time.monotonic()
              try:
                  s=socket.create_connection((host,port),timeout=5)
                  peer=s.getpeername(); s.close()
                  print(f'INDEP_{idx}_TCP=PASS host={host} port={port} peer={peer[0]}:{peer[1]} latency_ms={int((time.monotonic()-t)*1000)}')
              except Exception as e:
                  print(f'INDEP_{idx}=PROXY_DEAD host={host} port={port} stage=tcp error={type(e).__name__} latency_ms={int((time.monotonic()-t)*1000)}')
                  return None
              cls=connection.ConnectionTcpMTProxyRandomizedIntermediate
              print(f'INDEP_{idx}_MTPROXY_BEGIN class={cls.__name__} host={host} port={port} secret_type=fake-tls-ee secret_hex_len={len(secret)}')
              c=TelegramClient(MemorySession(),1,'0'*32,connection=cls,proxy=(host,port,secret),connection_retries=1,retry_delay=0,timeout=7)
              t=time.monotonic()
              try:
                  await asyncio.wait_for(c.connect(),timeout=10)
                  if c.is_connected():
                      print(f'INDEP_{idx}_MTPROXY=PASS host={host} port={port} latency_ms={int((time.monotonic()-t)*1000)}')
                      return p
                  print(f'INDEP_{idx}=PROXY_DEAD host={host} port={port} stage=mtproxy error=not_connected')
              except Exception as e:
                  print(f'INDEP_{idx}=PROXY_DEAD host={host} port={port} stage=mtproxy error={type(e).__name__} latency_ms={int((time.monotonic()-t)*1000)}')
              finally:
                  try: await c.disconnect()
                  except Exception: pass
              return None

          async def main():
              alive=[]
              for i,p in enumerate(proxies,1):
                  r=await check(i,p)
                  if r:
                      alive.append(r)
                  if len(alive)>=3:
                      break
              with open('/tmp/alive.json','w') as f:
                  json.dump(alive,f)
              print(f'INDEPENDENT_ALIVE={len(alive)}')
              if not alive:
                  print('LAYERED_GATE=NO_INDEPENDENTLY_ALIVE_FAKETLS443')
                  raise SystemExit(20)
          asyncio.run(main())
          PY
          "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/independent.py" | tee "$RUNNER_TEMP/independent.log"
          cp /tmp/alive.json "$RUNNER_TEMP/alive.json"

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate to Yandex
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-mtproxy-layered || true
          yc config set service-account-key "$key"

      - name: Create disposable Yandex layered probe VM
        id: vm
        shell: bash
        run: |
          set -euo pipefail
          folder='b1gk4p83brasi8g811jv'
          prod="$(yc compute instance get --name telegram-news-reader --folder-id "$folder" --full --format json)"
          zone="$(printf '%s' "$prod" | jq -r '.zone_id')"
          subnet="$(printf '%s' "$prod" | jq -r '.network_interfaces[0].subnet_id')"
          name="telegram-mtproxy-layered-${GITHUB_RUN_ID}"
          alive_b64="$(base64 -w0 "$RUNNER_TEMP/alive.json")"
          cat > "$RUNNER_TEMP/yandex_probe.py" <<'PY'
          import asyncio, json, socket, time
          from telethon import TelegramClient, connection
          from telethon.sessions import MemorySession

          CANDIDATES=json.load(open('/opt/alive.json'))

          async def test_one(i,p):
              host,port,secret=p['host'],p['port'],p['secret']
              t=time.monotonic()
              try:
                  infos=socket.getaddrinfo(host,port,socket.AF_UNSPEC,socket.SOCK_STREAM)
                  ips=sorted({x[4][0] for x in infos})
                  print(f'PROXY_{i}_DNS=PASS host={host} ips={",".join(ips[:6])} latency_ms={int((time.monotonic()-t)*1000)}',flush=True)
              except Exception as e:
                  print(f'PROXY_{i}=PROXY_DNS_FAIL host={host} error={type(e).__name__}',flush=True)
                  return False

              t=time.monotonic()
              try:
                  s=socket.create_connection((host,port),timeout=5)
                  peer=s.getpeername(); s.close()
                  print(f'PROXY_{i}_TCP=PASS host={host} port={port} peer={peer[0]}:{peer[1]} latency_ms={int((time.monotonic()-t)*1000)}',flush=True)
              except Exception as e:
                  print(f'PROXY_{i}=YANDEX_TO_PROXY_TCP_FAIL host={host} port={port} error={type(e).__name__} latency_ms={int((time.monotonic()-t)*1000)}',flush=True)
                  return False

              cls=connection.ConnectionTcpMTProxyRandomizedIntermediate
              print(f'PROXY_{i}_MTPROXY_BEGIN class={cls.__name__} host={host} port={port} secret_type=fake-tls-ee secret_hex_len={len(secret)}',flush=True)
              c=TelegramClient(MemorySession(),1,'0'*32,connection=cls,proxy=(host,port,secret),connection_retries=1,retry_delay=0,timeout=7)
              t=time.monotonic()
              try:
                  await asyncio.wait_for(c.connect(),timeout=10)
                  if c.is_connected():
                      print(f'PROXY_{i}=MTPROXY_GATE_PASS host={host} port={port} latency_ms={int((time.monotonic()-t)*1000)}',flush=True)
                      return True
                  print(f'PROXY_{i}=MTPROXY_HANDSHAKE_FAIL host={host} port={port} error=not_connected',flush=True)
              except ValueError as e:
                  print(f'PROXY_{i}=MTPROXY_SECRET_OR_CODEC_FAIL host={host} port={port} error={type(e).__name__}',flush=True)
              except Exception as e:
                  print(f'PROXY_{i}=MTPROXY_HANDSHAKE_FAIL host={host} port={port} error={type(e).__name__} latency_ms={int((time.monotonic()-t)*1000)}',flush=True)
              finally:
                  try: await c.disconnect()
                  except Exception: pass
              return False

          async def main():
              print(f'YANDEX_CANDIDATES={len(CANDIDATES)}',flush=True)
              ok=False
              for i,p in enumerate(CANDIDATES,1):
                  if await test_one(i,p): ok=True
              print('MTPROXY_GATE=PASS' if ok else 'MTPROXY_GATE=FAIL',flush=True)
              return 0 if ok else 1
          raise SystemExit(asyncio.run(main()))
          PY
          sed 's/^/      /' "$RUNNER_TEMP/yandex_probe.py" > "$RUNNER_TEMP/yandex_probe.indented"
          {
            echo '#cloud-config'
            echo 'package_update: true'
            echo 'packages:'
            echo '  - python3-venv'
            echo '  - strace'
            echo 'write_files:'
            echo '  - path: /opt/alive.json.b64'
            echo "    permissions: '0600'"
            echo '    content: |'
            echo "      $alive_b64"
            echo '  - path: /opt/yandex_probe.py'
            echo "    permissions: '0644'"
            echo '    content: |'
            cat "$RUNNER_TEMP/yandex_probe.indented"
            echo '  - path: /usr/local/sbin/run-layered-probe'
            echo "    permissions: '0755'"
            echo '    content: |'
            echo '      #!/usr/bin/env bash'
            echo '      set -uo pipefail'
            echo '      base64 -d /opt/alive.json.b64 > /opt/alive.json'
            echo '      chmod 600 /opt/alive.json'
            echo '      python3 -m venv /opt/probe-venv'
            echo '      /opt/probe-venv/bin/pip -q install telethon==1.44.0 python-socks'
            echo '      strace -f -e trace=connect -s 200 -o /tmp/connect.trace /opt/probe-venv/bin/python /opt/yandex_probe.py > /tmp/result.txt 2>&1'
            echo '      rc=$?'
            echo "      echo '===LAYERED_PROBE_BEGIN===' > /dev/ttyS0"
            echo '      cat /tmp/result.txt > /dev/ttyS0'
            echo "      echo '---STRACE_CONNECT_BEGIN---' > /dev/ttyS0"
            echo "      grep -E 'connect\\(' /tmp/connect.trace | tail -n 80 > /dev/ttyS0 || true"
            echo "      echo '---STRACE_CONNECT_END---' > /dev/ttyS0"
            echo "      echo '===LAYERED_PROBE_END===' > /dev/ttyS0"
            echo '      exit $rc'
            echo 'runcmd:'
            echo '  - [bash, -lc, "/usr/local/sbin/run-layered-probe || true"]'
          } > "$RUNNER_TEMP/cloud-init.yaml"
          yc compute instance create \
            --name "$name" --folder-id "$folder" --zone "$zone" \
            --platform standard-v3 --cores 2 --memory 1GB --core-fraction 20 \
            --create-boot-disk image-folder-id=standard-images,image-family=ubuntu-2404-lts-oslogin,size=10,type=network-hdd \
            --network-interface subnet-id="$subnet",nat-ip-version=ipv4 \
            --metadata-from-file user-data="$RUNNER_TEMP/cloud-init.yaml" \
            --metadata serial-port-enable=1 >/dev/null
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "folder=$folder" >> "$GITHUB_OUTPUT"

      - name: Read and classify Yandex layered result
        shell: bash
        env:
          VM_NAME: ${{ steps.vm.outputs.name }}
          FOLDER_ID: ${{ steps.vm.outputs.folder }}
        run: |
          set -euo pipefail
          for n in $(seq 1 90); do
            yc compute instance get-serial-port-output --name "$VM_NAME" --folder-id "$FOLDER_ID" > "$RUNNER_TEMP/serial.txt" 2>/dev/null || true
            if grep -q '===LAYERED_PROBE_END===' "$RUNNER_TEMP/serial.txt"; then
              sed -n '/===LAYERED_PROBE_BEGIN===/,/===LAYERED_PROBE_END===/p' "$RUNNER_TEMP/serial.txt" | tee "$RUNNER_TEMP/layered-result.txt"
              if grep -q 'MTPROXY_GATE=PASS' "$RUNNER_TEMP/layered-result.txt"; then exit 0; fi
              exit 1
            fi
            sleep 5
          done
          echo 'LAYERED_GATE=TIMEOUT'
          tail -n 160 "$RUNNER_TEMP/serial.txt" || true
          exit 1

      - name: Destroy disposable probe VM
        if: always()
        shell: bash
        env:
          VM_NAME: ${{ steps.vm.outputs.name }}
          FOLDER_ID: ${{ steps.vm.outputs.folder }}
        run: |
          set +e
          if [ -n "$VM_NAME" ] && [ -n "$FOLDER_ID" ]; then
            yc compute instance delete --name "$VM_NAME" --folder-id "$FOLDER_ID" >/dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/alive.json"
