name: Telegram Serverless Reader Smoke

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-serverless-reader-smoke.yml]
  workflow_dispatch:

permissions:
  contents: read

# Re-run after least-privilege Lockbox metadata access was granted to the deployer.
jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: telegram-serverless-smoke-20260916

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create tg-serverless-reader-smoke || true
          yc config profile activate tg-serverless-reader-smoke
          yc config set service-account-key "$key"
          yc config set folder-id b1gk4p83brasi8g811jv

      - name: Build and push full Reader image
        shell: bash
        run: |
          set -euo pipefail
          image="cr.yandex/crphagvid8e8g5pp4fpe/telegram-news-reader:serverless-reader-${GITHUB_SHA::12}"
          yc iam create-token | docker login --username iam --password-stdin cr.yandex >/dev/null
          docker build -t "$image" telegram-news-reader
          docker push "$image" >/dev/null
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo READER_IMAGE_PUSH_PASS

      - name: Resolve Lockbox secret
        shell: bash
        run: |
          set -euo pipefail
          secret_id="$(yc lockbox secret list --format json | jq -r '.[] | select(.name=="telegram-reader-serverless-runtime") | .id' | head -n1)"
          test -n "$secret_id"
          echo "SECRET_ID=$secret_id" >> "$GITHUB_ENV"
          echo LOCKBOX_SECRET_FOUND

      - name: Deploy full Reader to Serverless
        shell: bash
        run: |
          set -euo pipefail
          folder="b1gk4p83brasi8g811jv"
          name="telegram-reader-serverless-smoke"
          runtime_sa="ajeaad0m00gncv22tagf"
          id="$(yc serverless container list --folder-id "$folder" --format json | jq -r --arg n "$name" '.[] | select(.name==$n) | .id' | head -n1)"
          if [ -z "$id" ]; then
            yc serverless container create --folder-id "$folder" --name "$name" >/dev/null
          fi
          yc serverless container revision deploy \
            --folder-id "$folder" \
            --container-name "$name" \
            --runtime http \
            --image "$IMAGE" \
            --cores 1 \
            --memory 512MB \
            --concurrency 1 \
            --execution-timeout 120s \
            --service-account-id "$runtime_sa" \
            --environment TELEGRAM_DATABASE_PATH=/tmp/telegram.db \
            --environment TELEGRAM_SESSION_PATH=/tmp/telegram_news \
            --environment COLLECT_BOOTSTRAP_LIMIT=3 \
            --environment COLLECT_INTERVAL_SECONDS=3600 \
            --environment OBJECT_STORAGE_ENABLED=false \
            --secret environment-variable=TELEGRAM_API_ID,id="$SECRET_ID",key=TELEGRAM_API_ID \
            --secret environment-variable=TELEGRAM_API_HASH,id="$SECRET_ID",key=TELEGRAM_API_HASH \
            --secret environment-variable=TELEGRAM_WS_RELAY_URL,id="$SECRET_ID",key=TELEGRAM_WS_RELAY_URL \
            --secret environment-variable=TELEGRAM_SESSION_STRING,id="$SECRET_ID",key=TELEGRAM_SESSION_STRING \
            --secret environment-variable=READER_API_TOKEN,id="$SECRET_ID",key=READER_API_TOKEN \
            >/dev/null
          yc serverless container allow-unauthenticated-invoke "$name" --folder-id "$folder" >/dev/null
          url="$(yc serverless container get "$name" --folder-id "$folder" --format json | jq -r '.url')"
          echo "URL=${url%/}" >> "$GITHUB_ENV"
          echo "SERVERLESS_READER_DEPLOY_PASS url=$url"

      - name: Verify live Telegram connection and collected messages
        shell: bash
        run: |
          set -euo pipefail
          pass=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 25 "$URL/health" > "$RUNNER_TEMP/health.json" 2>/dev/null; then
              cat "$RUNNER_TEMP/health.json" | jq '{status,telegram_status,telegram_connected,telegram_authorized,allowed_chats,messages,media_storage}'
              if jq -e '.status=="ok" and .telegram_authorized==true and (.messages|tonumber)>0' "$RUNNER_TEMP/health.json" >/dev/null 2>&1; then
                pass=1
                break
              fi
            fi
            sleep 5
          done
          if [ "$pass" -ne 1 ]; then
            echo SERVERLESS_READER_LIVE_FAILED
            exit 1
          fi
          echo SERVERLESS_READER_LIVE_PASS

      - name: Cleanup local credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json"
