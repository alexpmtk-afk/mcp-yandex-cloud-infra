name: Telegram post-decommission live audit temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-post-decommission-live-audit-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 4
    steps:
      - name: Install YC CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"
      - name: Read current Telegram compute state
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"
          chmod 600 "$RUNNER_TEMP/key.json"
          yc config profile create telegram-post-decom-live || true
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          yc config set cloud-id b1gi4pr9msenirafh2c7
          F=b1gk4p83brasi8g811jv
          echo '=== INSTANCES ==='
          yc compute instance list --folder-id "$F" --format json --no-user-output | jq '[.[]|{id,name,status}]'
          echo '=== DISKS ==='
          yc compute disk list --folder-id "$F" --format json --no-user-output | jq '[.[]|{id,name,status,type_id,size_gib:((.size|tonumber)/1073741824)}]'
          echo '=== ADDRESSES ==='
          yc vpc address list --folder-id "$F" --format json --no-user-output | jq '[.[]|{id,name,reserved,used,external_ipv4_address:(.external_ipv4_address.address//null)}]'
          echo '=== SNAPSHOTS ==='
          yc compute snapshot list --folder-id "$F" --format json --no-user-output | jq '[.[]|{id,name,status}]'
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json"
