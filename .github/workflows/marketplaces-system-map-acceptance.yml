name: Marketplaces System Map Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          curl -fsSL --retry 5 --retry-delay 3 "$URL" -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate and resolve MCP endpoint
        id: mcp
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create system-map-acceptance || true
          yc config set service-account-key "$KEY_FILE"
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          DOMAIN="$(yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//.[0].domain//empty')"
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          VERSION_ID="$(yc lockbox secret list-versions --id "$SECRET_ID" --format json | jq -r '[.[]|select(.status=="ACTIVE")][0].id')"
          yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/sec.json"
          BEARER="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value' "$RUNNER_TEMP/sec.json")"
          test -n "$DOMAIN" && test -n "$BEARER"
          echo "::add-mask::$BEARER"
          printf '%s' "$BEARER" > "$RUNNER_TEMP/bearer"
          echo "url=https://${DOMAIN}/mcp" >> "$GITHUB_OUTPUT"

      - name: Verify canonical map live
        shell: bash
        env:
          MCP_URL: ${{ steps.mcp.outputs.url }}
        run: |
          set -euo pipefail
          python -m pip install --quiet 'httpx>=0.27,<1'
          export MCP_BEARER="$(cat "$RUNNER_TEMP/bearer")"
          python - <<'PY'
          import json, os
          import httpx

          def unpack(r):
              r.raise_for_status()
              for line in r.text.splitlines():
                  if line.startswith('data:'):
                      return json.loads(line[5:].strip())
              return r.json()

          headers = {
              'Authorization': 'Bearer ' + os.environ['MCP_BEARER'],
              'Accept': 'application/json, text/event-stream',
              'Content-Type': 'application/json',
          }
          with httpx.Client(timeout=45.0, follow_redirects=True) as c:
              r = c.post(os.environ['MCP_URL'], headers=headers, json={
                  'jsonrpc':'2.0','id':1,'method':'initialize','params':{
                      'protocolVersion':'2025-06-18','capabilities':{},
                      'clientInfo':{'name':'system-map-acceptance','version':'1'}
                  }})
              init = unpack(r)
              assert 'result' in init, init
              instructions = init['result'].get('instructions','')
              assert 'CANONICAL MARKETPLACES MCP ARCHITECTURE' in instructions, instructions
              assert 'Yandex Cloud' in instructions, instructions
              h = dict(headers)
              sid = r.headers.get('mcp-session-id')
              if sid: h['Mcp-Session-Id'] = sid
              h['MCP-Protocol-Version'] = init['result'].get('protocolVersion','2025-06-18')
              n = c.post(os.environ['MCP_URL'], headers=h, json={'jsonrpc':'2.0','method':'notifications/initialized'})
              assert n.status_code in (200,202), n.status_code
              tl = unpack(c.post(os.environ['MCP_URL'], headers=h, json={'jsonrpc':'2.0','id':2,'method':'tools/list','params':{}}))
              names = {x['name'] for x in tl['result']['tools']}
              assert 'marketplace_system_map' in names, sorted(names)
              call = unpack(c.post(os.environ['MCP_URL'], headers=h, json={
                  'jsonrpc':'2.0','id':3,'method':'tools/call','params':{
                      'name':'marketplace_system_map','arguments':{}
                  }}))
              result = call['result']
              assert not result.get('isError'), result
              text = next(x['text'] for x in result['content'] if x.get('type')=='text')
              body = json.loads(text)
              assert body['status'] == 'CANONICAL', body
              assert body['runtime']['cloud'] == 'Yandex Cloud only', body
              assert body['storage_policy']['primary_runtime_storage'] == 'Yandex Cloud', body
              assert body['storage_policy']['google_cloud'] == 'not part of the runtime architecture', body
              print('MARKETPLACE_SYSTEM_MAP_LIVE=PASS')
              print('architecture_version=' + body['architecture_version'])
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/sec.json" "$RUNNER_TEMP/bearer" "$RUNNER_TEMP/yc.tgz"
