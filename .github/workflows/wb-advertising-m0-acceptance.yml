name: WB Advertising M0 Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app/core/wb_advertising.py
      - app/core/combined.py
      - app/core/system_map.py
      - app/.source-revision
      - .github/workflows/wb-advertising-m0-acceptance.yml

permissions:
  contents: read

concurrency:
  group: marketplaces-test-runtime-write
  cancel-in-progress: false
  queue: max

jobs:
  accept:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 12
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          ARCHIVE="$RUNNER_TEMP/yc/yc.tgz"
          for attempt in $(seq 1 5); do
            rm -f "$ARCHIVE"
            if timeout 90s wget --quiet --timeout=30 --tries=2 --output-document="$ARCHIVE" "$URL" \
              && tar -tzf "$ARCHIVE" >/dev/null 2>&1; then
              break
            fi
            test "$attempt" -lt 5
            sleep 3
          done
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate CI service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create wb-ads-acceptance || true
          yc config set service-account-key "$KEY_FILE"

      - name: Resolve TEST gateway and credentials
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(timeout 45s yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          test -n "$SECRET_ID"
          timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"
          VERSION_ID="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys // [])|index("cabinets_json") != null)|select((.payload_entry_keys // [])|index("mcp_bearer_token") != null)]|sort_by(.created_at)|last|.id // empty' "$RUNNER_TEMP/versions.json")"
          test -n "$VERSION_ID"
          DOMAIN="$(timeout 45s yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//.[0].domain//empty')"
          test -n "$DOMAIN"
          timeout 45s yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/payload.json"
          jq -r '.entries[]|select(.key=="cabinets_json")|.text_value' "$RUNNER_TEMP/payload.json" > "$RUNNER_TEMP/cabinets.json"
          jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value' "$RUNNER_TEMP/payload.json" > "$RUNNER_TEMP/bearer"
          test -s "$RUNNER_TEMP/cabinets.json"
          test -s "$RUNNER_TEMP/bearer"
          chmod 600 "$RUNNER_TEMP/cabinets.json" "$RUNNER_TEMP/bearer"
          echo "gateway=https://${DOMAIN}" >> "$GITHUB_OUTPUT"
          echo 'runtime_resolution=PASS'

      - name: Verify permanent WB advertising credential model
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'cabinets.json').read_text(encoding='utf-8'))
          required = ('wb_dmitrieva', 'wb_novokshenov', 'wb_laser_master')
          wb = data.get('wb') if isinstance(data, dict) else None
          ads = data.get('wb_ads') if isinstance(data, dict) else None
          assert isinstance(wb, dict), 'wb service is absent from cabinets_json'
          wb_cabs = wb.get('cabinets')
          assert isinstance(wb_cabs, dict), 'wb.cabinets is absent'
          ads_cabs = ads.get('cabinets') if isinstance(ads, dict) else {}
          ads_cabs = ads_cabs if isinstance(ads_cabs, dict) else {}

          def promotion_scope(token: str) -> bool:
              try:
                  parts = token.split('.')
                  if len(parts) < 2:
                      return False
                  payload = parts[1] + '=' * (-len(parts[1]) % 4)
                  claims = json.loads(base64.urlsafe_b64decode(payload.encode('ascii')).decode('utf-8'))
                  return bool(int(claims.get('s') or 0) & (1 << 5))
              except Exception:
                  return False

          modes = []
          for name in required:
              explicit = ads_cabs.get(name)
              explicit_token = str(explicit.get('token', '')).strip() if isinstance(explicit, dict) else ''
              if explicit_token:
                  modes.append(f'{name}:explicit')
                  continue
              normal = wb_cabs.get(name)
              token = str(normal.get('token', '')).strip() if isinstance(normal, dict) else ''
              assert token, f'missing WB token for {name}'
              assert promotion_scope(token), f'WB token lacks Promotion scope for {name}'
              modes.append(f'{name}:scope_verified_alias')
          print('WB_ADS_CREDENTIAL_MODEL=PASS ' + ','.join(modes))
          PY

      - name: Accept remote WB Advertising M0
        shell: bash
        env:
          GATEWAY_URL: ${{ steps.runtime.outputs.gateway }}
        run: |
          set -euo pipefail
          python -m pip install --quiet 'httpx>=0.27,<1'
          export MCP_URL="${GATEWAY_URL}/mcp"
          export MCP_BEARER="$(cat "$RUNNER_TEMP/bearer")"
          python -u - <<'PY'
          import itertools
          import json
          import os
          import time
          import httpx

          def unpack(resp):
              resp.raise_for_status()
              for line in resp.text.splitlines():
                  if line.startswith('data:'):
                      return json.loads(line[5:].strip())
              return resp.json() if resp.text.strip() else None

          headers0 = {
              'Authorization': 'Bearer ' + os.environ['MCP_BEARER'],
              'Accept': 'application/json, text/event-stream',
              'Content-Type': 'application/json',
          }
          ids = itertools.count(1)
          timeout = httpx.Timeout(connect=10.0, read=60.0, write=30.0, pool=10.0)
          with httpx.Client(timeout=timeout, follow_redirects=True) as client:
              init_resp = client.post(os.environ['MCP_URL'], headers=headers0, json={
                  'jsonrpc': '2.0', 'id': next(ids), 'method': 'initialize',
                  'params': {'protocolVersion': '2025-06-18', 'capabilities': {},
                             'clientInfo': {'name': 'wb-ads-m0-acceptance', 'version': '2'}}
              })
              init = unpack(init_resp)
              assert init and 'result' in init, init
              headers = dict(headers0)
              sid = init_resp.headers.get('mcp-session-id')
              if sid:
                  headers['Mcp-Session-Id'] = sid
              headers['MCP-Protocol-Version'] = init['result'].get('protocolVersion', '2025-06-18')
              note = client.post(os.environ['MCP_URL'], headers=headers,
                                 json={'jsonrpc': '2.0', 'method': 'notifications/initialized'})
              assert note.status_code in (200, 202), note.status_code

              def rpc(method, params=None):
                  resp = client.post(os.environ['MCP_URL'], headers=headers, json={
                      'jsonrpc': '2.0', 'id': next(ids), 'method': method,
                      'params': params or {},
                  })
                  data = unpack(resp)
                  assert data and 'result' in data, (method, data)
                  return data['result']

              def call(name, args):
                  result = rpc('tools/call', {'name': name, 'arguments': args})
                  assert not result.get('isError'), (name, result)
                  text = next((x.get('text') for x in result.get('content', []) if x.get('type') == 'text'), None)
                  assert text is not None, name
                  return json.loads(text)

              names = {tool['name'] for tool in rpc('tools/list')['tools']}
              required_tools = {
                  'wb_ads_list_active_campaigns',
                  'wb_ads_get_campaign_stats',
                  'wb_ads_audit_active',
              }
              assert required_tools <= names, sorted(required_tools - names)
              print('WB_ADS_TOOL_REGISTRATION=PASS')

              system_map = call('marketplace_system_map', {})
              ads = system_map.get('advertising_policy') or {}
              assert ads.get('current_scope', '').startswith('Wildberries only'), ads
              assert ads.get('credential_service') == 'wb_ads', ads
              assert set(ads.get('m0_tools') or []) == required_tools, ads
              assert ads.get('write_control_status', '').startswith('not accepted in M0'), ads
              print('WB_ADS_POLICY=PASS architecture=' + str(system_map.get('architecture_version')))

              sellers = ('Дмитриева', 'Новокшенов', 'Лазер-Мастер')
              for seller in sellers:
                  data = call('wb_ads_list_active_campaigns', {'seller': seller})
                  if not data.get('ok') and data.get('error_type') == 'rate_limit' and data.get('retryable') is True:
                      time.sleep(max(0.5, min(float(data.get('retry_after_seconds') or 1.0), 5.0)))
                      data = call('wb_ads_list_active_campaigns', {'seller': seller})
                  assert data.get('ok') is True, {
                      'seller': seller,
                      'error': data.get('error'),
                      'code': data.get('code'),
                      'status': data.get('status'),
                      'upstream_request_sent': data.get('upstream_request_sent'),
                  }
                  assert data.get('live') is True, seller
                  assert data.get('status_filter') == 9, seller
                  binding = data.get('credential_binding')
                  backing = data.get('credential_backing_service')
                  proof = data.get('promotion_scope_proof')
                  assert binding in {'explicit', 'scope_verified_alias'}, (seller, binding)
                  if binding == 'scope_verified_alias':
                      assert backing == 'wb', (seller, backing)
                      assert proof == 'jwt_s_bit_6', (seller, proof)
                  print(f'WB_ADS_LIVE_LIST=PASS seller={seller} binding={binding} active_campaign_count={data.get("campaign_count")}')

              audit = call('wb_ads_audit_active', {'seller': 'Новокшенов', 'days': 1})
              if not audit.get('ok'):
                  assert audit.get('code') == 'WB_ADS_M0_MAX_50_CAMPAIGNS', {
                      'error': audit.get('error'), 'code': audit.get('code'), 'status': audit.get('status')
                  }
                  print('WB_ADS_AUDIT=PASS mode=FAIL_CLOSED_MAX_50')
              else:
                  assert audit.get('evaluation_class') == 'advertising_attribution_operational', audit
                  assert audit.get('business_profitability') == 'not_evaluated', audit
                  assert audit.get('metric_contract_version') in (None, 'wb_ads_m0.v1'), audit
                  print('WB_ADS_AUDIT=PASS mode=LIVE_READ_ONLY')

              print('WB_ADVERTISING_M0_ACCEPTANCE=PASS')
          PY

      - name: Cleanup ephemeral credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/payload.json" "$RUNNER_TEMP/cabinets.json" "$RUNNER_TEMP/bearer"
