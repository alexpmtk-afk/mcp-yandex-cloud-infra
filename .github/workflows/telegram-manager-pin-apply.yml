name: Apply Telegram Manager PIN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10

    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-manager-pin || true
          yc config profile activate telegram-manager-pin
          yc config set service-account-key "$key"

      - name: Apply manager PIN hash
        env:
          MANAGE_HASH: ${{ secrets.TELEGRAM_MANAGE_TOKEN_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MANAGE_HASH"
          yc config profile activate telegram-manager-pin

          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/tgkey"
          ip="$(curl -fsS https://api.ipify.org)"

          old_keys="$(yc compute instance get telegram-news-reader --folder-id b1gk4p83brasi8g811jv --format json | jq -r '.metadata["ssh-keys"] // ""')"
          printf '%s' "$old_keys" > "$RUNNER_TEMP/oldkeys"
          { printf '%s\n' "$old_keys"; printf 'ubuntu:'; cat "$RUNNER_TEMP/tgkey.pub"; } > "$RUNNER_TEMP/newkeys"

          yc compute instance add-metadata telegram-news-reader --folder-id b1gk4p83brasi8g811jv --metadata-from-file ssh-keys="$RUNNER_TEMP/newkeys"
          yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id b1gk4p83brasi8g811jv --add-rule "description=github-telegram-manager-pin,direction=ingress,port=22,protocol=tcp,v4-cidrs=$ip/32"

          sleep 20

          printf '%s\n' "$MANAGE_HASH" | ssh -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o ConnectTimeout=20 -i "$RUNNER_TEMP/tgkey" ubuntu@111.88.248.156 'read -r h; set -euo pipefail; if grep -q "^MANAGE_TOKEN_SHA256=" /opt/telegram-reader/runtime.env; then sudo sed -i "s/^MANAGE_TOKEN_SHA256=.*/MANAGE_TOKEN_SHA256=$h/" /opt/telegram-reader/runtime.env; else printf "\nMANAGE_TOKEN_SHA256=%s\n" "$h" | sudo tee -a /opt/telegram-reader/runtime.env >/dev/null; fi; image=$(sudo docker inspect --format="{{.Config.Image}}" telegram-reader); sudo docker rm -f telegram-reader >/dev/null; sudo docker run -d --name telegram-reader --restart unless-stopped -p 127.0.0.1:8080:8080 --env-file /opt/telegram-reader/runtime.env -v /state:/state "$image" >/dev/null; for i in $(seq 1 20); do curl -fsS --max-time 3 http://127.0.0.1:8080/health >/tmp/tg-health 2>/dev/null && break; sleep 2; done; cat /tmp/tg-health; jq -e ".status == \"ok\"" /tmp/tg-health >/dev/null; echo PIN_HASH_APPLY_PASS'

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          yc config profile activate telegram-manager-pin >/dev/null 2>&1 || true
          ids=$(yc vpc security-group get enpocnvnpdu2goj9nkjn --folder-id b1gk4p83brasi8g811jv --format json | jq -r '.rules[] | select(.description=="github-telegram-manager-pin") | .id')
          for id in $ids; do
            yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id b1gk4p83brasi8g811jv --delete-rule-id "$id"
          done
          if [ -f "$RUNNER_TEMP/oldkeys" ]; then
            yc compute instance add-metadata telegram-news-reader --folder-id b1gk4p83brasi8g811jv --metadata-from-file ssh-keys="$RUNNER_TEMP/oldkeys"
          fi
          rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/tgkey" "$RUNNER_TEMP/tgkey.pub" "$RUNNER_TEMP/oldkeys" "$RUNNER_TEMP/newkeys"
