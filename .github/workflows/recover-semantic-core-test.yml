name: Recover Semantic Core TEST via Clean Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-semantic-core-test.yml

permissions:
  contents: read

concurrency:
  group: marketplaces-test-runtime-write
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 45
    env:
      ARCHIVE_DRIVE_ROOT_ID: 1UVKUcFfDhCDk6nMHX1mWg9cRL05DT-OJ
      DRIVE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbzgFDAQY4rcsblKhiAONfOI6315k8W3vwbSIEsczE3ycQtnJ8ctcVKjhzjgdTgfy0cvIA/exec
      CLEAN_REGISTRY_NAME: marketplaces-mcp-semantic-test
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Prove Semantic Core runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -f app/.source-revision
          grep -Eq '^Semantic Core source: alexpmtk-afk/marketplaces-mcp-ru@[0-9a-f]{40}$' app/.source-revision
          test -f app/Dockerfile
          echo "semantic_source=$(grep '^Semantic Core source:' app/.source-revision)"
          echo 'semantic_snapshot=PASS'

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/yc/bin/yc" version

      - name: Authenticate CI service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          CI_SA_ID="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          test -n "$CI_SA_ID"
          echo "CI_SA_ID=$CI_SA_ID" >> "$GITHUB_ENV"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"

      - name: Create clean TEST registry and bind least-privilege image roles
        id: clean_registry
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          echo "TEST_FOLDER_ID=$FOLDER_ID" >> "$GITHUB_ENV"

          timeout 90s yc resource-manager folder add-access-binding "$FOLDER_ID" \
            --role admin --service-account-id "$CI_SA_ID"
          echo 'temporary_test_folder_admin=GRANTED'
          sleep 25

          REGISTRY_ID="$(timeout 45s yc container registry list --folder-id "$FOLDER_ID" --format json | jq -r --arg n "$CLEAN_REGISTRY_NAME" '.[]|select(.name==$n)|.id'|head -1)"
          if [[ -z "$REGISTRY_ID" ]]; then
            timeout 90s yc container registry create --name "$CLEAN_REGISTRY_NAME" --folder-id "$FOLDER_ID" --format json --no-user-output > "$RUNNER_TEMP/new-registry.json"
            REGISTRY_ID="$(jq -r '.id//empty' "$RUNNER_TEMP/new-registry.json")"
            test -n "$REGISTRY_ID"
            echo "clean_registry_created=$REGISTRY_ID"
          else
            echo "clean_registry_reused=$REGISTRY_ID"
          fi

          RUNTIME_SA="$(timeout 45s yc iam service-account list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-runtime")|.id'|head -1)"
          test -n "$RUNTIME_SA"
          timeout 90s yc container registry add-access-binding "$REGISTRY_ID" \
            --role container-registry.images.pusher \
            --subject "serviceAccount:$CI_SA_ID"
          timeout 90s yc container registry add-access-binding "$REGISTRY_ID" \
            --role container-registry.images.puller \
            --subject "serviceAccount:$RUNTIME_SA"
          echo 'clean_registry_roles=PASS'

          timeout 90s yc resource-manager folder remove-access-binding "$FOLDER_ID" \
            --role admin --service-account-id "$CI_SA_ID"
          echo 'temporary_test_folder_admin=REMOVED'
          sleep 20

          echo "folder=$FOLDER_ID" >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY_ID" >> "$GITHUB_OUTPUT"
          echo "runtime_sa=$RUNTIME_SA" >> "$GITHUB_OUTPUT"

      - name: Resolve existing TEST runtime resources
        id: resources
        shell: bash
        env:
          FOLDER_ID: ${{ steps.clean_registry.outputs.folder }}
        run: |
          set -euo pipefail
          SECRET_ID="$(timeout 45s yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          test -n "$SECRET_ID"
          timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"
          VERSION_ID="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys // [])|index("cabinets_json") != null)|select((.payload_entry_keys // [])|index("mcp_bearer_token") != null)|select((.payload_entry_keys // [])|index("redis_password") != null)|select((.payload_entry_keys // [])|index("google_drive_bridge_secret") != null)]|sort_by(.created_at)|last|.id // empty' "$RUNNER_TEMP/versions.json")"
          CONTAINER_ID="$(timeout 45s yc serverless container list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          NETWORK_ID="$(timeout 45s yc vpc network list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-net")|.id'|head -1)"
          CLUSTER_ID="$(timeout 45s yc managed-redis cluster list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-valkey")|.id'|head -1)"
          REDIS_HOST="$(timeout 45s yc managed-redis hosts list --cluster-id "$CLUSTER_ID" --format json | jq -r '[.[]|select((.role//"")=="MASTER")][0].name // .[0].name // empty')"
          DOMAIN="$(timeout 45s yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//.[0].domain//empty')"
          ARCHIVE_BUCKET="marketplaces-mcp-archive-${FOLDER_ID}"
          for v in SECRET_ID VERSION_ID CONTAINER_ID NETWORK_ID CLUSTER_ID REDIS_HOST DOMAIN ARCHIVE_BUCKET; do test -n "${!v}"; done
          echo "secret=$SECRET_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "container=$CONTAINER_ID" >> "$GITHUB_OUTPUT"
          echo "network=$NETWORK_ID" >> "$GITHUB_OUTPUT"
          echo "redis_host=$REDIS_HOST" >> "$GITHUB_OUTPUT"
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "archive_bucket=$ARCHIVE_BUCKET" >> "$GITHUB_OUTPUT"
          echo 'runtime_resources=PASS'

      - name: Build and push Semantic Core image to clean registry
        id: image
        shell: bash
        env:
          REGISTRY_ID: ${{ steps.clean_registry.outputs.registry }}
        run: |
          set -euo pipefail
          IAM_TOKEN="$(yc iam create-token)"
          test -n "$IAM_TOKEN"
          echo "::add-mask::$IAM_TOKEN"
          printf '%s' "$IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
          unset IAM_TOKEN
          IMAGE="cr.yandex/${REGISTRY_ID}/marketplaces-mcp:semantic-test-${GITHUB_SHA}"
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$IMAGE" app
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo 'CLEAN_REGISTRY_IMAGE_PUSH=PASS'

      - name: Deploy real TEST runtime revision
        id: deploy
        shell: bash
        env:
          FOLDER_ID: ${{ steps.clean_registry.outputs.folder }}
          SECRET_ID: ${{ steps.resources.outputs.secret }}
          VERSION_ID: ${{ steps.resources.outputs.version }}
          CONTAINER_ID: ${{ steps.resources.outputs.container }}
          RUNTIME_SA: ${{ steps.clean_registry.outputs.runtime_sa }}
          NETWORK_ID: ${{ steps.resources.outputs.network }}
          REDIS_HOST: ${{ steps.resources.outputs.redis_host }}
          DOMAIN: ${{ steps.resources.outputs.domain }}
          ARCHIVE_BUCKET: ${{ steps.resources.outputs.archive_bucket }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          timeout 240s yc serverless container revision deploy \
            --container-id "$CONTAINER_ID" --folder-id "$FOLDER_ID" \
            --image "$IMAGE" --memory 2048MB --cores 1 --execution-timeout 600s --concurrency 8 \
            --service-account-id "$RUNTIME_SA" --network-id "$NETWORK_ID" \
            --environment "MARKETPLACE_REQUIRE_REDIS=1,MARKETPLACE_MCP_REDIS_HOST=$REDIS_HOST,MARKETPLACE_MCP_REDIS_PORT=6380,MARKETPLACE_MCP_REDIS_TLS=1,MARKETPLACE_MCP_REDIS_CA_CERT=/opt/yandex/YandexInternalRootCA.crt,OZON_GLOBAL_RPS=50,OZON_PERF_GLOBAL_RPS=10,MARKETPLACE_MCP_ARCHIVE_BUCKET=$ARCHIVE_BUCKET,MARKETPLACE_MCP_ARCHIVE_DRIVE_ROOT_ID=$ARCHIVE_DRIVE_ROOT_ID,MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_URL=$DRIVE_BRIDGE_URL" \
            --secret "environment-variable=MARKETPLACE_MCP_CABINETS_JSON,id=$SECRET_ID,version-id=$VERSION_ID,key=cabinets_json" \
            --secret "environment-variable=MARKETPLACE_MCP_BEARER_TOKEN,id=$SECRET_ID,version-id=$VERSION_ID,key=mcp_bearer_token" \
            --secret "environment-variable=MARKETPLACE_MCP_REDIS_PASSWORD,id=$SECRET_ID,version-id=$VERSION_ID,key=redis_password" \
            --secret "environment-variable=MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_SECRET,id=$SECRET_ID,version-id=$VERSION_ID,key=google_drive_bridge_secret" \
            --format json --no-user-output > "$RUNNER_TEMP/revision.json"
          REVISION_ID="$(jq -r '.id//empty' "$RUNNER_TEMP/revision.json")"
          test -n "$REVISION_ID"
          BASE="https://${DOMAIN}"
          CODE=000
          for attempt in $(seq 1 24); do
            CODE="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/health" -w '%{http_code}' "$BASE/healthz" || true)"
            [[ "$CODE" == 200 ]] && break
            echo "health attempt $attempt/24 status=$CODE"
            sleep 5
          done
          test "$CODE" = 200
          echo "gateway_url=$BASE" >> "$GITHUB_OUTPUT"
          echo "revision_id=$REVISION_ID" >> "$GITHUB_OUTPUT"
          echo "LIVE_TEST_REVISION=$REVISION_ID"
          echo 'LIVE_TEST_HEALTH=PASS'

      - name: Resolve MCP bearer
        shell: bash
        env:
          SECRET_ID: ${{ steps.resources.outputs.secret }}
          VERSION_ID: ${{ steps.resources.outputs.version }}
        run: |
          set -euo pipefail
          timeout 45s yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/sec.json"
          BEARER="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value' "$RUNNER_TEMP/sec.json")"
          test -n "$BEARER"
          echo "::add-mask::$BEARER"
          printf '%s' "$BEARER" > "$RUNNER_TEMP/bearer"
          chmod 600 "$RUNNER_TEMP/bearer"

      - name: Live Semantic Core MCP E2E
        shell: bash
        timeout-minutes: 8
        env:
          GATEWAY_URL: ${{ steps.deploy.outputs.gateway_url }}
        run: |
          set -euo pipefail
          python -m pip install --quiet 'httpx>=0.27,<1'
          export MCP_URL="${GATEWAY_URL}/mcp"
          export MCP_BEARER="$(cat "$RUNNER_TEMP/bearer")"
          python -u - <<'PY'
          import itertools, json, os
          import httpx

          def unpack(r):
              r.raise_for_status()
              for line in r.text.splitlines():
                  if line.startswith('data:'):
                      return json.loads(line[5:].strip())
              return r.json() if r.text.strip() else None

          h0={'Authorization':'Bearer '+os.environ['MCP_BEARER'],'Accept':'application/json, text/event-stream','Content-Type':'application/json'}
          ids=itertools.count(1)
          timeout=httpx.Timeout(connect=10,read=60,write=30,pool=10)
          with httpx.Client(timeout=timeout,follow_redirects=True) as c:
              unauth=c.post(os.environ['MCP_URL'],headers={'Accept':'application/json, text/event-stream','Content-Type':'application/json'},json={'jsonrpc':'2.0','id':0,'method':'initialize','params':{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'semantic-e2e-unauth','version':'1'}}})
              assert unauth.status_code==401, unauth.status_code
              print('MCP_UNAUTHORIZED_401=PASS',flush=True)

              r=c.post(os.environ['MCP_URL'],headers=h0,json={'jsonrpc':'2.0','id':next(ids),'method':'initialize','params':{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'semantic-e2e','version':'1'}}})
              init=unpack(r); assert init and 'result' in init,init
              assert 'Semantic Core' in init['result'].get('instructions',''),init
              h=dict(h0); sid=r.headers.get('mcp-session-id')
              if sid: h['Mcp-Session-Id']=sid
              h['MCP-Protocol-Version']=init['result'].get('protocolVersion','2025-06-18')
              n=c.post(os.environ['MCP_URL'],headers=h,json={'jsonrpc':'2.0','method':'notifications/initialized'})
              assert n.status_code in (200,202),n.status_code
              print('MCP_INITIALIZE=PASS',flush=True)

              def rpc(method,params=None):
                  rr=c.post(os.environ['MCP_URL'],headers=h,json={'jsonrpc':'2.0','id':next(ids),'method':method,'params':params or {}})
                  d=unpack(rr); assert d and 'result' in d,(method,d)
                  return d['result']
              def call(name,args):
                  z=rpc('tools/call',{'name':name,'arguments':args})
                  assert not z.get('isError'),(name,z)
                  text=next((x.get('text') for x in z.get('content',[]) if x.get('type')=='text'),None)
                  assert text is not None,name
                  return json.loads(text)

              names={x['name'] for x in rpc('tools/list')['tools']}
              assert {'marketplace_business_query','marketplace_system_map','marketplace_archive_status'} <= names,names
              print('SEMANTIC_TOOLS_LIST=PASS',flush=True)

              sm=call('marketplace_system_map',{})
              assert sm.get('architecture_version')=='2026-09-14.v17',sm
              assert sm['semantic_core']['status']=='TEST_RUNTIME_WIRED',sm
              print('SEMANTIC_SYSTEM_MAP=PASS',flush=True)

              fail=call('marketplace_business_query',{'marketplace':'wb','seller':'wb_novokshenov','date_from':'2026-09-01','date_to':'2026-09-07','question':'Какой актуальный коэффициент склада сейчас?'})
              assert fail.get('ok') is False,fail
              assert fail.get('error')=='source_not_suitable',fail
              print('SEMANTIC_FAIL_CLOSED=PASS',flush=True)

              hist=call('marketplace_business_query',{'marketplace':'wb','seller':'wb_novokshenov','date_from':'2026-08-01','date_to':'2026-08-31','question':'Какие схемы отгрузки наблюдались за этот период?'})
              assert hist.get('ok') is True,hist
              print('SEMANTIC_HISTORICAL_EXECUTION=PASS',flush=True)

              archive=call('marketplace_archive_status',{'year':2026})
              assert archive.get('ok') is True,archive
              storage=archive.get('storage') or {}
              assert storage.get('backend')=='google_drive_primary',archive
              assert storage.get('reachable') is True,archive
              print('CANONICAL_GOOGLE_DRIVE_ARCHIVE=PASS',flush=True)
              print('LIVE_SEMANTIC_CORE_E2E=PASS',flush=True)
          PY

      - name: Cleanup ephemeral credentials and any temporary admin
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${TEST_FOLDER_ID:-}" && -n "${CI_SA_ID:-}" ]]; then
            yc resource-manager folder remove-access-binding "$TEST_FOLDER_ID" --role admin --service-account-id "$CI_SA_ID" >/dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/new-registry.json" "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/revision.json" "$RUNNER_TEMP/health" "$RUNNER_TEMP/sec.json" "$RUNNER_TEMP/bearer"
