name: Telegram Serverless On-Demand Shadow

on:
  push:
    branches: [main]
    paths:
      - telegram-news-reader/requests/ondemand-shadow.json

permissions:
  contents: write

concurrency:
  group: telegram-serverless-ondemand-shadow
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create tg-serverless-ondemand-shadow || true
          yc config profile activate tg-serverless-ondemand-shadow
          yc config set service-account-key "$key"
          yc config set folder-id b1gk4p83brasi8g811jv

      - name: Build V3 shadow response from direct Telegram reads
        shell: bash
        run: |
          set -euo pipefail
          request="telegram-news-reader/requests/ondemand-shadow.json"
          test -f "$request"

          limit="$(jq -er '(.limit // 200) | if type=="number" then . else tonumber end' "$request")"
          if [ "$limit" -lt 1 ]; then limit=1; fi
          if [ "$limit" -gt 2000 ]; then limit=2000; fi

          chat_ids="$(jq -cer '
            if (.chat_ids? | type) == "array" then .chat_ids
            elif (.chat_id? != null) then [.chat_id]
            else error("chat_id or chat_ids required") end
            | map(if type=="number" then . elif type=="string" and test("^-?[0-9]+$") then tonumber else empty end)
            | unique
            | if length == 0 then error("no chat ids") else . end
            | if length > 5 then error("maximum 5 chats per on-demand request") else . end
          ' "$request")"

          period_hours="$(jq -r '(.period_hours // 24) | tostring' "$request")"
          if ! [[ "$period_hours" =~ ^[0-9]+$ ]]; then period_hours=24; fi
          if [ "$period_hours" -lt 1 ]; then period_hours=1; fi
          if [ "$period_hours" -gt 192 ]; then period_hours=192; fi

          raw_from="$(jq -r '(.date_from // "") | tostring' "$request")"
          raw_to="$(jq -r '(.date_to // "") | tostring' "$request")"
          date_to="${raw_to:-$(date -u '+%Y-%m-%dT%H:%M:%SZ')}"
          if [ -n "$raw_from" ]; then
            date_from="$raw_from"
          else
            date_from="$(date -u -d "$date_to - $period_hours hours" '+%Y-%m-%dT%H:%M:%SZ')"
          fi

          url="$(yc serverless container get telegram-reader-serverless-smoke --folder-id b1gk4p83brasi8g811jv --format json | jq -r '.url')"
          test -n "$url" && test "$url" != "null"
          url="${url%/}"
          token="$(yc iam create-token)"

          allowed="$(curl -fsS --retry 2 --retry-delay 2 --max-time 30 -H "Authorization: Bearer $token" "$url/internal/chats")"
          echo "$allowed" | jq -e '.chat_count==9 and (.chats|length)==9' >/dev/null
          while read -r cid; do
            echo "$allowed" | jq -e --argjson id "$cid" '.chats[] | select(.chat_id==$id)' >/dev/null || { echo "ACCESS_DENIED chat_id=$cid"; exit 1; }
          done < <(echo "$chat_ids" | jq -r '.[]')

          work="$RUNNER_TEMP/tg-ondemand-shadow"
          mkdir -p "$work"
          : > "$work/chats.ndjson"
          generated_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          while read -r cid; do
            probe="$(curl -fsS --retry 2 --retry-delay 2 --max-time 45 -H "Authorization: Bearer $token" "$url/internal/chats/$cid/probe")"
            echo "$probe" | jq -e --argjson id "$cid" '.resolved==true and .chat_id==$id' >/dev/null
            page="$(curl -fsS --retry 2 --retry-delay 2 --max-time 110 \
              -H "Authorization: Bearer $token" --get \
              --data-urlencode "date_from=$date_from" \
              --data-urlencode "date_to=$date_to" \
              --data-urlencode "limit=$limit" \
              "$url/internal/chats/$cid/messages")"
            echo "$page" | jq -e --argjson id "$cid" --argjson lim "$limit" '.chat_id==$id and (.message_count|tonumber)>=0 and .message_count<= $lim and (.messages|length)==.message_count' >/dev/null
            echo "$page" | jq -c --argjson id "$cid" --arg collected_at "$generated_at" '{chat_id:$id,messages:[.messages[] + {username:null,collected_at:$collected_at}]}' >> "$work/chats.ndjson"
          done < <(echo "$chat_ids" | jq -r '.[]')

          jq -s '.' "$work/chats.ndjson" > "$work/chats.json"
          jq -n \
            --arg schema "TELEGRAM_NEWS_ONDEMAND_V3" \
            --arg generated_at "$generated_at" \
            --arg date_from "$date_from" \
            --arg date_to "$date_to" \
            --argjson period_hours "$period_hours" \
            --slurpfile chats "$work/chats.json" \
            '{schema:$schema,generated_at:$generated_at,date_from:$date_from,date_to:$date_to,period_hours:$period_hours,chat_count:($chats[0]|length),chats:$chats[0]}' \
            > "$work/output.json"

          jq -e --argjson expected "$(echo "$chat_ids" | jq 'length')" '
            .schema=="TELEGRAM_NEWS_ONDEMAND_V3" and
            .chat_count==$expected and
            (.chats|length)==.chat_count and
            ([.chats[].chat_id]|sort)==([.chats[].chat_id]|unique|sort) and
            ([.chats[].messages[]|select((has("chat_id") and has("message_id") and has("chat_title") and has("datetime") and has("text") and has("sender_id") and has("views") and has("forwards") and has("reply_to_message_id") and has("media_type") and has("url") and has("username") and has("collected_at") and has("media_asset"))|not)]|length)==0
          ' "$work/output.json" >/dev/null

          python - "$work/output.json" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          def dt(value):
              parsed=datetime.fromisoformat(value.replace('Z','+00:00'))
              if parsed.tzinfo is None: parsed=parsed.replace(tzinfo=timezone.utc)
              return parsed.astimezone(timezone.utc)
          low, high=dt(data['date_from']), dt(data['date_to'])
          if low > high: raise SystemExit('date_from after date_to')
          for chat in data['chats']:
              last=None
              for row in chat['messages']:
                  moment=dt(row['datetime'])
                  if not (low <= moment <= high): raise SystemExit('message outside requested interval')
                  if last is not None and moment > last: raise SystemExit('messages not newest-first')
                  last=moment
          print('SERVERLESS_ONDEMAND_RANGE_VALIDATION_PASS')
          PY

          mkdir -p telegram-news-reader/ondemand
          cp "$work/output.json" telegram-news-reader/ondemand/serverless_shadow.json
          jq '{generated_at,date_from,date_to,period_hours,chat_count,chats:[.chats[]|{chat_id,message_count:(.messages|length),latest_datetime:(.messages[0].datetime // null)}]}' "$work/output.json"
          echo SERVERLESS_ONDEMAND_SHADOW_BUILD_PASS

      - name: Commit shadow response
        shell: bash
        run: |
          set -euo pipefail
          file="telegram-news-reader/ondemand/serverless_shadow.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          if git diff --cached --quiet; then echo SERVERLESS_ONDEMAND_SHADOW_NO_CHANGE; exit 0; fi
          git commit -m "chore: update Telegram serverless on-demand shadow"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo SERVERLESS_ONDEMAND_SHADOW_PUBLISH_PASS
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 2
          done
          exit 1

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json"
