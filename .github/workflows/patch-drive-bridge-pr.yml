name: Patch Drive Bridge PR Guardrails

on:
  push:
    branches:
      - feature/deploy-drive-bridge-20260914
    paths:
      - .github/workflows/patch-drive-bridge-pr.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/deploy-drive-bridge-20260914
          fetch-depth: 0

      - name: Prepare patched workflow copies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/drive-bridge-patch
          python - <<'PY'
          from pathlib import Path

          validate = Path('.github/workflows/marketplaces-archive-storage-validate.yml').read_text(encoding='utf-8')
          validate = validate.replace(
              "          grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_OAUTH_JSON' .github/workflows/deploy-mcp-test.yml\n"
              "          grep -q 'google_drive_oauth_json' .github/workflows/deploy-mcp-test.yml\n",
              "          grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_URL' .github/workflows/deploy-mcp-test.yml\n"
              "          grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_SECRET' .github/workflows/deploy-mcp-test.yml\n"
              "          grep -q 'google_drive_bridge_secret' .github/workflows/deploy-mcp-test.yml\n"
              "          ! grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_OAUTH_JSON' .github/workflows/deploy-mcp-test.yml\n"
              "          ! grep -q 'google_drive_oauth_json' .github/workflows/deploy-mcp-test.yml\n"
          )
          validate = validate.replace(
              "          grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_OAUTH_JSON' .github/workflows/configure-card-monitor.yml\n"
              "          grep -q 'google_drive_oauth_json' .github/workflows/configure-card-monitor.yml\n",
              "          grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_URL' .github/workflows/configure-card-monitor.yml\n"
              "          grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_SECRET' .github/workflows/configure-card-monitor.yml\n"
              "          grep -q 'google_drive_bridge_secret' .github/workflows/configure-card-monitor.yml\n"
              "          ! grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_OAUTH_JSON' .github/workflows/configure-card-monitor.yml\n"
              "          ! grep -q 'google_drive_oauth_json' .github/workflows/configure-card-monitor.yml\n"
          )
          Path('tmp/drive-bridge-patch/marketplaces-archive-storage-validate.yml').write_text(validate, encoding='utf-8')

          card = Path('.github/workflows/configure-card-monitor.yml').read_text(encoding='utf-8')
          if 'DRIVE_BRIDGE_URL:' not in card:
              card = card.replace(
                  'env:\n  ARCHIVE_DRIVE_ROOT_ID: 1UVKUcFfDhCDk6nMHX1mWg9cRL05DT-OJ\n',
                  'env:\n  ARCHIVE_DRIVE_ROOT_ID: 1UVKUcFfDhCDk6nMHX1mWg9cRL05DT-OJ\n  DRIVE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbzgFDAQY4rcsblKhiAONfOI6315k8W3vwbSIEsczE3ycQtnJ8ctcVKjhzjgdTgfy0cvIA/exec\n'
              )
          card = card.replace(
              '          VERSION_ID="$(timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json | jq -r \'[.[]|select(.status=="ACTIVE")][0].id\')"\n',
              '          timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"\n'
              '          VERSION_ID="$(jq -r \'[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys // [])|index("cabinets_json") != null)|select((.payload_entry_keys // [])|index("mcp_bearer_token") != null)|select((.payload_entry_keys // [])|index("redis_password") != null)|select((.payload_entry_keys // [])|index("google_drive_bridge_secret") != null)]|sort_by(.created_at)|last|.id // empty\' "$RUNNER_TEMP/versions.json")"\n'
          )
          card = card.replace(
              '          jq -e \'[.entries[].key] | index("google_drive_oauth_json") != null\' "$RUNNER_TEMP/current-payload.json" >/dev/null\n',
              '          jq -e \'[.entries[].key] | index("google_drive_bridge_secret") != null\' "$RUNNER_TEMP/current-payload.json" >/dev/null\n'
          )
          card = card.replace("          echo 'google_drive_oauth_lockbox=RESOLVED'\n", "          echo 'google_drive_bridge_lockbox=RESOLVED'\n")
          card = card.replace(
              '            --environment "MARKETPLACE_REQUIRE_REDIS=1,MARKETPLACE_MCP_REDIS_HOST=$REDIS_HOST,MARKETPLACE_MCP_REDIS_PORT=6380,MARKETPLACE_MCP_REDIS_TLS=1,MARKETPLACE_MCP_REDIS_CA_CERT=/opt/yandex/YandexInternalRootCA.crt,OZON_GLOBAL_RPS=50,OZON_PERF_GLOBAL_RPS=10,MARKETPLACE_MCP_ARCHIVE_BUCKET=$ARCHIVE_BUCKET,MARKETPLACE_MCP_ARCHIVE_DRIVE_ROOT_ID=$ARCHIVE_DRIVE_ROOT_ID" \\\n',
              '            --environment "MARKETPLACE_REQUIRE_REDIS=1,MARKETPLACE_MCP_REDIS_HOST=$REDIS_HOST,MARKETPLACE_MCP_REDIS_PORT=6380,MARKETPLACE_MCP_REDIS_TLS=1,MARKETPLACE_MCP_REDIS_CA_CERT=/opt/yandex/YandexInternalRootCA.crt,OZON_GLOBAL_RPS=50,OZON_PERF_GLOBAL_RPS=10,MARKETPLACE_MCP_ARCHIVE_BUCKET=$ARCHIVE_BUCKET,MARKETPLACE_MCP_ARCHIVE_DRIVE_ROOT_ID=$ARCHIVE_DRIVE_ROOT_ID,MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_URL=$DRIVE_BRIDGE_URL" \\\n'
          )
          card = card.replace(
              '            --secret "environment-variable=MARKETPLACE_MCP_GOOGLE_DRIVE_OAUTH_JSON,id=$SECRET_ID,version-id=$VERSION_ID,key=google_drive_oauth_json" \\\n',
              '            --secret "environment-variable=MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_SECRET,id=$SECRET_ID,version-id=$VERSION_ID,key=google_drive_bridge_secret" \\\n'
          )
          card = card.replace(
              '            "$RUNNER_TEMP/current-payload.json" "$RUNNER_TEMP/card-monitor-token" \\\n',
              '            "$RUNNER_TEMP/current-payload.json" "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/card-monitor-token" \\\n'
          )
          Path('tmp/drive-bridge-patch/configure-card-monitor.yml').write_text(card, encoding='utf-8')
          PY

          grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_SECRET' tmp/drive-bridge-patch/configure-card-monitor.yml
          ! grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_OAUTH_JSON' tmp/drive-bridge-patch/configure-card-monitor.yml
          git diff --check -- tmp/drive-bridge-patch || true

      - name: Publish patched copies outside workflows directory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/drive-bridge-patch
          git commit -m 'tmp: materialize Drive bridge workflow patches'
          git push origin HEAD:feature/deploy-drive-bridge-20260914
