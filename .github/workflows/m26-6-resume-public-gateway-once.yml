name: M26.6 Resume Public Forecast Gateway Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m26-6-resume-public-gateway-once.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: birzha-m26-6-resume-public-gateway-once
  cancel-in-progress: false

env:
  DEPLOYER_SERVICE_ACCOUNT_ID: ajecdjjrkdo1t3itpl9k
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/mcp-yandex-cloud-infra@1349853397:environment:test
  GATEWAY_ID: d5d6sgh96p1fs4mnlfsr
  PUBLIC_DOMAIN: d5d6sgh96p1fs4mnlfsr.0ly8ed4d.apigw.yandexcloud.net

jobs:
  resume:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Mint Yandex token
        shell: bash
        run: |
          set -euo pipefail
          A="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          S='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && S='&'
          R="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${S}audience=${A}")"
          J="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$R")"
          echo "::add-mask::$J"
          python - "$J" <<'PY'
          import base64,json,os,sys
          p=sys.argv[1].split('.')[1]; p += '='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          assert c.get('sub')==os.environ['EXPECTED_OIDC_SUBJECT']
          assert c.get('aud')==os.environ['OIDC_AUDIENCE']
          assert c.get('ref')=='refs/heads/main'
          assert c.get('environment')=='test'
          PY
          X="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${DEPLOYER_SERVICE_ACCOUNT_ID}" --data-urlencode "subject_token=${J}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          T="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$X")"
          test -n "$T"
          echo "::add-mask::$T"
          umask 077
          printf '%s' "$T" > "$RUNNER_TEMP/iam-token"
          echo 'GATEWAY_CLOUD_ACCESS=PASS'

      - name: Install Yandex CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tar.gz"
          tar -xzf "$RUNNER_TEMP/yc.tar.gz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"

      - name: Resume only the existing Birzha API Gateway
        shell: bash
        run: |
          set -euo pipefail
          export YC_IAM_TOKEN="$(cat "$RUNNER_TEMP/iam-token")"
          YC="$RUNNER_TEMP/yc/yc"
          "$YC" serverless api-gateway get "$GATEWAY_ID" --format=json > "$RUNNER_TEMP/before.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'before.json').read_text())
          assert d.get('id')==os.environ['GATEWAY_ID']
          assert d.get('status') in ('STOPPED','ACTIVE'), d.get('status')
          print('GATEWAY_BEFORE_STATUS=' + str(d.get('status')))
          PY
          status="$(python -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["RUNNER_TEMP"])/"before.json").read_text()).get("status"))')"
          if [ "$status" = "STOPPED" ]; then
            "$YC" serverless api-gateway resume "$GATEWAY_ID" --format=json > "$RUNNER_TEMP/resume.json"
          fi
          for i in $(seq 1 30); do
            "$YC" serverless api-gateway get "$GATEWAY_ID" --format=json > "$RUNNER_TEMP/after.json"
            current="$(python -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["RUNNER_TEMP"])/"after.json").read_text()).get("status"))')"
            if [ "$current" = "ACTIVE" ]; then break; fi
            sleep 2
          done
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'after.json').read_text())
          assert d.get('id')==os.environ['GATEWAY_ID']
          assert d.get('status')=='ACTIVE', d.get('status')
          print('GATEWAY_ACTIVE=PASS')
          PY

      - name: Verify forecast service through the resumed gateway
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            code="$(curl --proto '=https' --tlsv1.2 --silent --show-error --output "$RUNNER_TEMP/health.txt" --write-out '%{http_code}' "https://${PUBLIC_DOMAIN}/healthz" || true)"
            [ "$code" = "200" ] && break
            sleep 2
          done
          test "$code" = 200 || { echo "health_status=$code"; cat "$RUNNER_TEMP/health.txt" || true; exit 1; }
          echo 'PUBLIC_FORECAST_HEALTH=PASS'
          code="$(curl --proto '=https' --tlsv1.2 --silent --show-error --output "$RUNNER_TEMP/mcp.txt" --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"unauthorized-smoke","version":"1"}}}' "https://${PUBLIC_DOMAIN}/mcp")"
          test "$code" = 401 || { echo "unexpected_unauthenticated_mcp_status=$code"; cat "$RUNNER_TEMP/mcp.txt" || true; exit 1; }
          echo 'PUBLIC_FORECAST_AUTH_BOUNDARY=PASS'

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/iam-token" "$RUNNER_TEMP/yc" "$RUNNER_TEMP/yc.tar.gz" "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/resume.json" "$RUNNER_TEMP/after.json" "$RUNNER_TEMP/health.txt" "$RUNNER_TEMP/mcp.txt"
