name: M26 YDB Endpoint Read Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m26-ydb-endpoint-read-once.yml"

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Read existing YDB endpoint only
        env:
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/birzha_test init -reconfigure -input=false -lockfile=readonly \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" \
            -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY" >/dev/null
          ENDPOINT="$(terraform -chdir=terraform/birzha_test output -raw ydb_connection_string)"
          test -n "$ENDPOINT"
          echo "M26_YDB_ENDPOINT=$ENDPOINT"
