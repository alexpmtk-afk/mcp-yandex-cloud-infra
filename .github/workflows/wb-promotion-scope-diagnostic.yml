name: WB Promotion Scope Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/wb-promotion-scope-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: marketplaces-test-runtime-write
  cancel-in-progress: false
  queue: max

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          ARCHIVE="$RUNNER_TEMP/yc/yc.tgz"
          wget --quiet --timeout=30 --tries=3 --output-document="$ARCHIVE" "$URL"
          tar -tzf "$ARCHIVE" >/dev/null
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate and read deployment-managed cabinet map
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create wb-promotion-scope || true
          yc config set service-account-key "$KEY_FILE"
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(timeout 45s yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          test -n "$SECRET_ID"
          timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"
          VERSION_ID="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys // [])|index("cabinets_json") != null)]|sort_by(.created_at)|last|.id // empty' "$RUNNER_TEMP/versions.json")"
          test -n "$VERSION_ID"
          timeout 45s yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/payload.json"
          jq -r '.entries[]|select(.key=="cabinets_json")|.text_value' "$RUNNER_TEMP/payload.json" > "$RUNNER_TEMP/cabinets.json"
          test -s "$RUNNER_TEMP/cabinets.json"
          chmod 600 "$RUNNER_TEMP/cabinets.json"

      - name: Decode only non-secret WB token claims and probe Promotion ping
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'httpx>=0.27,<1'
          python -u - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import httpx

          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'cabinets.json').read_text(encoding='utf-8'))
          wb = data.get('wb') if isinstance(data, dict) else None
          assert isinstance(wb, dict), 'wb service is absent from cabinets_json'
          cabinets = wb.get('cabinets')
          assert isinstance(cabinets, dict), 'wb.cabinets is absent'

          required = ('wb_dmitrieva', 'wb_novokshenov', 'wb_laser_master')
          token_types = {1: 'base', 2: 'test', 3: 'personal', 4: 'service'}
          all_promotion = True
          all_ping = True

          with httpx.Client(timeout=20.0, follow_redirects=False) as client:
              for name in required:
                  item = cabinets.get(name)
                  assert isinstance(item, dict), f'missing WB cabinet: {name}'
                  token = str(item.get('token', '')).strip()
                  assert token, f'missing WB token: {name}'
                  parts = token.split('.')
                  assert len(parts) >= 2, f'WB token is not JWT-shaped: {name}'
                  payload = parts[1] + '=' * (-len(parts[1]) % 4)
                  claims = json.loads(base64.urlsafe_b64decode(payload.encode('ascii')).decode('utf-8'))
                  mask = int(claims.get('s') or 0)
                  promotion = bool(mask & (1 << 5))
                  acc = token_types.get(int(claims.get('acc') or 0), 'unknown')
                  sid_present = bool(claims.get('sid'))
                  all_promotion = all_promotion and promotion

                  status = client.get(
                      'https://advert-api.wildberries.ru/ping',
                      headers={'Authorization': token},
                  ).status_code
                  ping_ok = status == 200
                  if status == 429:
                      # JWT category remains authoritative for this diagnostic when ping is throttled.
                      ping_ok = promotion
                  all_ping = all_ping and ping_ok
                  print(
                      f'WB_PROMOTION_SCOPE cabinet={name} token_type={acc} '
                      f'sid_present={sid_present} promotion_bit={promotion} ping_status={status}'
                  )

          print(f'WB_PROMOTION_REUSE_CANDIDATE={all_promotion and all_ping}')
          if not all_promotion:
              raise SystemExit('At least one existing WB token lacks Promotion category bit 6')
          if not all_ping:
              raise SystemExit('At least one existing WB token did not pass Promotion-domain validation')
          print('WB_PROMOTION_SCOPE_DIAGNOSTIC=PASS')
          PY

      - name: Cleanup ephemeral credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/payload.json" "$RUNNER_TEMP/cabinets.json"
