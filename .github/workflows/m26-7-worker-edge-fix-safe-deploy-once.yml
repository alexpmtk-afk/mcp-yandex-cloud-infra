name: M26.9 First Real Forecast

on:
  push:
    branches: [main]
    paths:
      - "control/run-m26-9-first-real-forecast.txt"

permissions:
  contents: read
  id-token: write

concurrency:
  group: birzha-m26-9-first-real-forecast
  cancel-in-progress: false

env:
  TF_DIR: terraform/birzha_test
  DEPLOYER_SERVICE_ACCOUNT_ID: ajecdjjrkdo1t3itpl9k
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/mcp-yandex-cloud-infra@1349853397:environment:test
  FORECAST_SYMBOL: SBER

jobs:
  first-real-forecast:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Mint Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          A="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          S='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && S='&'
          R="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${S}audience=${A}")"
          J="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$R")"
          echo "::add-mask::$J"
          python - "$J" <<'PY'
          import base64,json,os,sys
          p=sys.argv[1].split('.')[1]; p += '='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          assert c.get('sub')==os.environ['EXPECTED_OIDC_SUBJECT']
          assert c.get('aud')==os.environ['OIDC_AUDIENCE']
          assert c.get('ref')=='refs/heads/main'
          assert c.get('environment')=='test'
          PY
          X="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${DEPLOYER_SERVICE_ACCOUNT_ID}" --data-urlencode "subject_token=${J}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          T="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$X")"
          test -n "$T"
          echo "::add-mask::$T"
          umask 077
          printf '%s' "$T" > "$RUNNER_TEMP/iam-token"
          echo 'M26_9_YANDEX_AUTH=PASS'

      - name: Resolve protected runtime endpoints
        shell: bash
        env:
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" init -reconfigure -input=false -lockfile=readonly \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" \
            -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY" >/dev/null
          terraform -chdir="$TF_DIR" output -raw ydb_connection_string > "$RUNNER_TEMP/ydb"
          terraform -chdir="$TF_DIR" output -raw mcp_endpoint > "$RUNNER_TEMP/mcp-endpoint"
          terraform -chdir="$TF_DIR" output -raw mcp_auth_secret_id > "$RUNNER_TEMP/mcp-secret-id"
          terraform -chdir="$TF_DIR" output -raw mcp_auth_secret_version_id > "$RUNNER_TEMP/mcp-secret-version"
          test -s "$RUNNER_TEMP/ydb" && test -s "$RUNNER_TEMP/mcp-endpoint" && test -s "$RUNNER_TEMP/mcp-secret-id" && test -s "$RUNNER_TEMP/mcp-secret-version"
          echo 'M26_9_RUNTIME_OUTPUTS=PASS'

      - name: Install exact clients
        run: python -m pip install --disable-pip-version-check --quiet 'mcp==2.1.1' ydb httpx2

      - name: Fail closed unless D1 gate is fully PASS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,ydb
          from pathlib import Path
          token=(Path(os.environ['RUNNER_TEMP'])/'iam-token').read_text()
          ep=(Path(os.environ['RUNNER_TEMP'])/'ydb').read_text().strip()
          d=ydb.Driver(connection_string=ep,credentials=ydb.AccessTokenCredentials(token)); d.wait(timeout=10,fail_fast=True); p=ydb.QuerySessionPool(d)
          def rows(x):
              out=[]
              for rs in x or []: out += list(getattr(rs,'rows',[]) or [])
              return out
          def g(r,k,default=None):
              try:return r[k]
              except:return getattr(r,k,default)
          run=rows(p.execute_with_retries("SELECT workflow_id,status,last_error FROM `orchestration_runs` WHERE kind='D1_ARCHIVE_REFRESH_V1' ORDER BY updated_at DESC,workflow_id DESC LIMIT 1;")); assert len(run)==1
          wid=str(g(run[0],'workflow_id') or ''); status=str(g(run[0],'status') or ''); err=str(g(run[0],'last_error') or '')
          assert status=='PASS', (wid,status,err)
          q="DECLARE $wid AS Utf8; SELECT kind,status,payload_json,last_error FROM `orchestration_actions` WHERE workflow_id=$wid ORDER BY sequence,action_id;"
          aa=rows(p.execute_with_retries(q,{'$wid':(wid,ydb.PrimitiveType.Utf8)}))
          expected={'SBER':7,'Si':24,'BR':24,'GOLD':24,'IMOEX':7,'RTSI':7}; seen={k:0 for k in expected}; failures=[]
          for a in aa:
              try: payload=json.loads(str(g(a,'payload_json') or '{}'))
              except: payload={}
              sym=str(payload.get('symbol') or ''); st=str(g(a,'status') or ''); le=str(g(a,'last_error') or '')
              if sym in expected:
                  if st=='PASS': seen[sym]+=1
                  else: failures.append((sym,str(g(a,'kind') or ''),st,le[:200]))
          assert not failures, failures
          assert seen==expected, (seen,expected)
          candle=rows(p.execute_with_retries("SELECT secid,begin,payload_json FROM `historical_candles` WHERE secid='SiU6' AND timeframe='D1' AND begin>='2026-09-15' AND begin<'2026-09-16';"))
          assert len(candle)==1
          vr=rows(p.execute_with_retries("SELECT symbol,timeframe,from_date,till_date FROM `historical_candles_verified_ranges` WHERE symbol='SI' AND timeframe='D1' AND from_date<='2026-09-15' AND till_date>='2026-09-15';"))
          svr=rows(p.execute_with_retries("SELECT symbol,from_date,till_date FROM `historical_candles_session_verified_ranges` WHERE symbol='SI' AND from_date<='2026-09-15' AND till_date>='2026-09-15';"))
          assert vr and svr
          evidence={'workflow_id':wid,'status':status,'counts':seen,'si_2026_09_15_candle':True,'si_verified':True,'si_session_verified':True}
          Path(os.environ['RUNNER_TEMP']+'/d1-gate.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print('M26_9_D1_GATE='+json.dumps(evidence,sort_keys=True))
          p.stop(); d.stop(timeout=5)
          PY

      - name: Fetch MCP bearer from Lockbox without exposing it
        shell: bash
        run: |
          set -euo pipefail
          SID="$(cat "$RUNNER_TEMP/mcp-secret-id")"; VER="$(cat "$RUNNER_TEMP/mcp-secret-version")"; T="$(cat "$RUNNER_TEMP/iam-token")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -H "Authorization: Bearer ${T}" \
            "https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/${SID}/payload?versionId=${VER}" > "$RUNNER_TEMP/mcp-payload.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'mcp-payload.json').read_text())
          vals=[x.get('textValue') for x in d.get('entries',[]) if x.get('key')=='bearer_token' and x.get('textValue')]
          assert len(vals)==1
          p=Path(os.environ['RUNNER_TEMP'])/'mcp-bearer'; p.write_text(vals[0]); p.chmod(0o600)
          print('M26_9_MCP_BEARER_RESOLVED=PASS')
          PY
          B="$(cat "$RUNNER_TEMP/mcp-bearer")"; echo "::add-mask::$B"

      - name: Create first real forecast and verify MCP journal views
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio,json,os
          from pathlib import Path
          import httpx2
          from mcp import Client
          from mcp.client.streamable_http import streamable_http_client

          endpoint=(Path(os.environ['RUNNER_TEMP'])/'mcp-endpoint').read_text().strip().rstrip('/') + '/mcp'
          token=(Path(os.environ['RUNNER_TEMP'])/'mcp-bearer').read_text()
          symbol=os.environ['FORECAST_SYMBOL']
          async def main():
              timeout=httpx2.Timeout(30.0,read=300.0)
              async with httpx2.AsyncClient(headers={'Authorization':f'Bearer {token}'},timeout=timeout) as hc:
                  transport=streamable_http_client(endpoint,http_client=hc)
                  async with Client(transport) as client:
                      created=await client.call_tool('forecast.create',{'symbol':symbol})
                      assert not created.is_error
                      c=created.structured_content or {}
                      forecast=c.get('forecast') or {}
                      journal=c.get('journal') or {}
                      fid=str(forecast.get('forecast_id') or '')
                      assert fid and forecast.get('symbol')==symbol
                      assert journal.get('status') in {'APPENDED','DUPLICATE_IDENTICAL'}
                      got=await client.call_tool('forecast.get',{'forecast_id':fid}); assert not got.is_error
                      g=got.structured_content or {}
                      get_record=g.get('forecast') if isinstance(g.get('forecast'),dict) else g
                      assert get_record==forecast
                      listed=await client.call_tool('forecast.list',{'limit':20,'symbol':symbol}); assert not listed.is_error
                      l=listed.structured_content or {}; records=l.get('forecasts') or []
                      assert any(isinstance(x,dict) and x.get('forecast_id')==fid for x in records)
                      out={'forecast':forecast,'journal':journal,'storage_scope':c.get('storage_scope'),'get_verified':True,'list_verified':True}
                      Path(os.environ['RUNNER_TEMP']+'/forecast-result.json').write_text(json.dumps(out,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
                      Path(os.environ['RUNNER_TEMP']+'/forecast-id').write_text(fid)
                      print('M26_9_FORECAST_CREATE=PASS')
                      print('M26_9_FORECAST_ID='+fid)
                      print('M26_9_FORECAST_GET_LIST=PASS')
          asyncio.run(main())
          PY

      - name: Prove immutable Forecast Journal row directly in YDB
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,ydb
          from pathlib import Path
          token=(Path(os.environ['RUNNER_TEMP'])/'iam-token').read_text(); ep=(Path(os.environ['RUNNER_TEMP'])/'ydb').read_text().strip(); fid=(Path(os.environ['RUNNER_TEMP'])/'forecast-id').read_text().strip()
          expected=json.loads((Path(os.environ['RUNNER_TEMP'])/'forecast-result.json').read_text())['forecast']
          d=ydb.Driver(connection_string=ep,credentials=ydb.AccessTokenCredentials(token)); d.wait(timeout=10,fail_fast=True); p=ydb.QuerySessionPool(d)
          q="DECLARE $fid AS Utf8; SELECT payload_hash,payload_json,symbol,secid,created_at_t0,engine_version FROM `forecast_records` WHERE forecast_id=$fid;"
          out=[]
          for rs in p.execute_with_retries(q,{'$fid':(fid,ydb.PrimitiveType.Utf8)}): out += list(getattr(rs,'rows',[]) or [])
          assert len(out)==1
          r=out[0]
          try: payload=str(r['payload_json']); symbol=str(r['symbol'])
          except: payload=str(getattr(r,'payload_json')); symbol=str(getattr(r,'symbol'))
          actual=json.loads(payload)
          assert actual==expected and symbol==os.environ['FORECAST_SYMBOL']
          print('M26_9_DIRECT_YDB_JOURNAL=PASS')
          p.stop(); d.stop(timeout=5)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: birzha-first-real-forecast
          path: |
            ${{ runner.temp }}/d1-gate.json
            ${{ runner.temp }}/forecast-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup secrets
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/iam-token" "$RUNNER_TEMP/mcp-bearer" "$RUNNER_TEMP/mcp-payload.json" "$RUNNER_TEMP/mcp-secret-id" "$RUNNER_TEMP/mcp-secret-version" "$RUNNER_TEMP/mcp-endpoint" "$RUNNER_TEMP/ydb" "$RUNNER_TEMP/forecast-id"
