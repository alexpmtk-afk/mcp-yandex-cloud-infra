name: Marketplaces Single Runtime Rewrite

on:
  push:
    branches:
      - feature/marketplaces-single-runtime
    paths:
      - '.github/workflows/marketplaces-single-runtime-rewrite.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/marketplaces-single-runtime
          fetch-depth: 0

      - name: Make Marketplace workflows transition-safe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_dir = Path('.github/workflows')
          skip = {
              Path('.github/workflows/marketplaces-single-runtime-audit.yml'),
              Path('.github/workflows/marketplaces-single-runtime-rewrite.yml'),
          }
          for path in workflow_dir.glob('*.yml'):
              if path in skip:
                  continue
              text = path.read_text(encoding='utf-8')
              new = text
              new = new.replace('Deploy Marketplaces MCP TEST', 'Deploy Marketplaces MCP')
              new = new.replace('marketplaces-test-runtime-write', 'marketplaces-runtime-write')
              new = new.replace(
                  'select(.name=="marketplaces-mcp-test")',
                  'select(.name=="marketplaces-mcp" or .name=="marketplaces-mcp-test")',
              )
              if new != text:
                  path.write_text(new, encoding='utf-8')

          for path in [Path('docs/CURRENT_RUNTIME_BASELINE.md')]:
              if path.exists():
                  text = path.read_text(encoding='utf-8')
                  new = text.replace('marketplaces-test-runtime-write', 'marketplaces-runtime-write')
                  if new != text:
                      path.write_text(new, encoding='utf-8')
          PY

          rm -f .github/workflows/marketplaces-single-runtime-rewrite.yml
          git diff --check
          git status --short
          git config user.name 'marketplaces-single-runtime'
          git config user.email 'marketplaces-single-runtime@users.noreply.github.com'
          git add .github/workflows docs/CURRENT_RUNTIME_BASELINE.md
          if git diff --cached --quiet; then
            echo 'no transition rewrites required'
            exit 0
          fi
          git commit -m 'marketplaces: make workflows single-runtime compatible'
          git push origin HEAD:feature/marketplaces-single-runtime
