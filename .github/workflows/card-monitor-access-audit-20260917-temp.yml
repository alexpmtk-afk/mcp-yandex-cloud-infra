name: Card Monitor access audit 2026-09-17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/card-monitor-access-audit-20260917-temp.yml'

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    env:
      SA_ID: ajecdjjrkdo1t3itpl9k
      AUD: https://github.com/alexpmtk-afk
      FOLDER_ID: b1g0224nfivl9224dm96
    steps:
      - name: Inspect card-monitor access via REST
        shell: bash
        run: |
          set -euo pipefail
          A="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["AUD"], safe=""))')"
          SEP='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && SEP='&'
          R="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${SEP}audience=${A}")"
          J="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$R")"
          echo "::add-mask::$J"
          X="$(curl -fsS -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${SA_ID}" --data-urlencode "subject_token=${J}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          T="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$X")"
          echo "::add-mask::$T"
          echo 'CALLER_SERVICE_ACCOUNT_BEGIN'
          curl -fsS -H "Authorization: Bearer $T" "https://iam.api.cloud.yandex.net/iam/v1/serviceAccounts/${SA_ID}" || true
          echo
          echo 'CALLER_SERVICE_ACCOUNT_END'
          echo 'ACCESS_BINDINGS_BEGIN'
          curl -fsS -H "Authorization: Bearer $T" "https://resource-manager.api.cloud.yandex.net/resource-manager/v1/folders/${FOLDER_ID}:listAccessBindings?pageSize=1000" || true
          echo
          echo 'ACCESS_BINDINGS_END'
          echo 'FOLDER_METADATA_BEGIN'
          curl -fsS -H "Authorization: Bearer $T" "https://resource-manager.api.cloud.yandex.net/resource-manager/v1/folders/${FOLDER_ID}" || true
          echo
          echo 'FOLDER_METADATA_END'

      - name: Cleanup
        if: always()
        shell: bash
        run: true
