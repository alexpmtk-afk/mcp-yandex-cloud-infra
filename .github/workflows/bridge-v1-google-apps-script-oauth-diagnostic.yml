name: Diagnose Google OAuth for Apps Script Bridge Bootstrap

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bridge-v1-google-apps-script-oauth-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL --retry 5 --retry-delay 3 \
            https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate Yandex and obtain historical Google OAuth payload
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"
          chmod 600 "$RUNNER_TEMP/key.json"
          yc config profile create bridge-google-oauth-diag || true
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          test -n "$SECRET_ID"
          yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"
          SOURCE_VERSION_ID="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys//[])|index("google_drive_oauth_json")!=null)]|sort_by(.created_at)|last|.id//empty' "$RUNNER_TEMP/versions.json")"
          test -n "$SOURCE_VERSION_ID"
          yc lockbox payload get --id "$SECRET_ID" --version-id "$SOURCE_VERSION_ID" --key google_drive_oauth_json --format json --no-user-output > "$RUNNER_TEMP/oauth-entry.json"
          jq -r '.entries[0].text_value // empty' "$RUNNER_TEMP/oauth-entry.json" > "$RUNNER_TEMP/oauth.json"
          chmod 600 "$RUNNER_TEMP/oauth.json"
          jq -e '(.client_id|length>0) and (.client_secret|length>0) and (.refresh_token|length>0) and (.token_uri|length>0)' "$RUNNER_TEMP/oauth.json" >/dev/null
          echo 'GOOGLE_OAUTH_CREDENTIAL=FOUND'

      - name: Refresh token and inspect granted scopes only
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_ID="$(jq -r '.client_id' "$RUNNER_TEMP/oauth.json")"
          CLIENT_SECRET="$(jq -r '.client_secret' "$RUNNER_TEMP/oauth.json")"
          REFRESH_TOKEN="$(jq -r '.refresh_token' "$RUNNER_TEMP/oauth.json")"
          TOKEN_URI="$(jq -r '.token_uri' "$RUNNER_TEMP/oauth.json")"
          RESPONSE="$(curl -fsS --max-time 30 -X POST "$TOKEN_URI" \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET" \
            --data-urlencode "refresh_token=$REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token')"
          ACCESS_TOKEN="$(jq -r '.access_token // empty' <<< "$RESPONSE")"
          test -n "$ACCESS_TOKEN"
          echo "::add-mask::$ACCESS_TOKEN"
          TOKENINFO="$(curl -fsS --max-time 30 -H "Authorization: Bearer $ACCESS_TOKEN" https://oauth2.googleapis.com/tokeninfo)"
          SCOPE="$(jq -r '.scope // empty' <<< "$TOKENINFO")"
          python - "$SCOPE" <<'PY'
          import sys
          scopes=set(sys.argv[1].split())
          wanted={
            'script_projects':'https://www.googleapis.com/auth/script.projects',
            'script_deployments':'https://www.googleapis.com/auth/script.deployments',
            'drive':'https://www.googleapis.com/auth/drive',
          }
          for name,scope in wanted.items():
              print(f'GOOGLE_SCOPE_{name.upper()}=' + ('YES' if scope in scopes else 'NO'))
          print('GOOGLE_SCOPE_COUNT=' + str(len(scopes)))
          PY

      - name: Probe Apps Script API without creating resources
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_ID="$(jq -r '.client_id' "$RUNNER_TEMP/oauth.json")"
          CLIENT_SECRET="$(jq -r '.client_secret' "$RUNNER_TEMP/oauth.json")"
          REFRESH_TOKEN="$(jq -r '.refresh_token' "$RUNNER_TEMP/oauth.json")"
          TOKEN_URI="$(jq -r '.token_uri' "$RUNNER_TEMP/oauth.json")"
          ACCESS_TOKEN="$(curl -fsS --max-time 30 -X POST "$TOKEN_URI" \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET" \
            --data-urlencode "refresh_token=$REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token' | jq -r '.access_token // empty')"
          test -n "$ACCESS_TOKEN"
          echo "::add-mask::$ACCESS_TOKEN"
          CODE="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/script-probe.json" -w '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            https://script.googleapis.com/v1/projects/not-a-real-script-id || true)"
          echo "APPS_SCRIPT_API_PROBE_HTTP=$CODE"
          case "$CODE" in
            400|404) echo 'APPS_SCRIPT_API_REACHABLE=YES' ;;
            401|403) echo 'APPS_SCRIPT_API_REACHABLE=AUTH_OR_SCOPE_BLOCKED' ;;
            *) echo 'APPS_SCRIPT_API_REACHABLE=UNKNOWN' ;;
          esac

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/oauth-entry.json" "$RUNNER_TEMP/oauth.json" "$RUNNER_TEMP/script-probe.json"
