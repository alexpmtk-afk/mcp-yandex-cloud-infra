name: Finalize Bridge v1 source once

on:
  push:
    branches:
      - bridge-v1-finalization-20260914
    paths:
      - .github/workflows/bridge-v1-finalize-source-once.yml
      - scripts/patch_bridge_v1_source_once.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge-v1-finalization-20260914

      - name: Patch canonical Bridge source deterministically
        run: python scripts/patch_bridge_v1_source_once.py

      - name: Validate Apps Script syntax and config invariant
        shell: bash
        run: |
          set -euo pipefail
          cp shared/google-drive-bridge/bridge.gs "$RUNNER_TEMP/bridge.js"
          node --check "$RUNNER_TEMP/bridge.js"
          grep -Fq 'injected.secret' shared/google-drive-bridge/bridge.gs
          for f in shared/google-drive-bridge/deploy/*_config.gs; do
            cp "$f" "$RUNNER_TEMP/config.js"
            node --check "$RUNNER_TEMP/config.js"
            grep -Fq "secret: ''" "$f"
          done
          echo BRIDGE_DEPLOYMENT_CONFIG_FALLBACK=PASS

      - name: Commit generated source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shared/google-drive-bridge/bridge.gs shared/google-drive-bridge/deploy/marketplaces_config.gs shared/google-drive-bridge/deploy/birzha_config.gs
          if git diff --cached --quiet; then
            echo 'No source changes.'
          else
            git commit -m 'bridge v1: support private deployment config fallback'
            git push origin HEAD:bridge-v1-finalization-20260914
          fi
