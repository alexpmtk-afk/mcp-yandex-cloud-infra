name: Finalize Bridge v1 source once

on:
  push:
    branches:
      - bridge-v1-finalization-20260914
    paths:
      - .github/workflows/bridge-v1-finalize-source-once.yml
      - scripts/patch_bridge_v1_source_once.py
      - scripts/patch_bridge_v1_workflows_once.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge-v1-finalization-20260914

      - name: Patch canonical Bridge source deterministically
        run: python scripts/patch_bridge_v1_source_once.py

      - name: Patch v1 workflows and Terraform references
        run: python scripts/patch_bridge_v1_workflows_once.py

      - name: Validate Apps Script syntax and config invariant
        shell: bash
        run: |
          set -euo pipefail
          cp shared/google-drive-bridge/bridge.gs "$RUNNER_TEMP/bridge.js"
          node --check "$RUNNER_TEMP/bridge.js"
          grep -Fq 'injected.secret' shared/google-drive-bridge/bridge.gs
          for f in shared/google-drive-bridge/deploy/*_config.gs; do
            cp "$f" "$RUNNER_TEMP/config.js"
            node --check "$RUNNER_TEMP/config.js"
            grep -Fq "secret: ''" "$f"
          done
          grep -Fq 'LOCKBOX_NAME: marketplaces-mcp-api-credentials' .github/workflows/marketplaces-drive-bridge-v1-acceptance.yml
          grep -Fq 'LOCKBOX_NAME: birzha-mcp-forecast-test-auth' .github/workflows/birzha-drive-bridge-v1-acceptance.yml
          grep -Fq 'LOCKBOX_KEY: gdrive_bridge_v1_secret' .github/workflows/marketplaces-drive-bridge-v1-acceptance.yml
          grep -Fq 'LOCKBOX_KEY: gdrive_bridge_v1_secret' .github/workflows/birzha-drive-bridge-v1-acceptance.yml
          grep -Fq 'key                  = "gdrive_bridge_v1_secret"' terraform/birzha_test/m24_autonomous_worker.tf
          echo BRIDGE_V1_FINALIZATION_STATIC=PASS

      - name: Commit generated finalization changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            shared/google-drive-bridge/bridge.gs \
            shared/google-drive-bridge/deploy/marketplaces_config.gs \
            shared/google-drive-bridge/deploy/birzha_config.gs \
            shared/google-drive-bridge/EXTERNAL_OWNER_GATES.md \
            .github/workflows/marketplaces-drive-bridge-v1-acceptance.yml \
            .github/workflows/birzha-drive-bridge-v1-acceptance.yml \
            .github/workflows/marketplaces-drive-bridge-v1-cutover-gate.yml \
            .github/workflows/birzha-drive-bridge-v1-cutover-gate.yml \
            terraform/birzha_test/m25_market_mirror.tf
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'bridge v1: align acceptance and runtime with isolated project keys'
            git push origin HEAD:bridge-v1-finalization-20260914
          fi
