name: Telegram Serverless Relay Smoke

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-serverless-relay-smoke.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: telegram-serverless-smoke-20260916

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create tg-serverless-relay-smoke || true
          yc config profile activate tg-serverless-relay-smoke
          yc config set service-account-key "$key"
          yc config set folder-id b1gk4p83brasi8g811jv

      - name: Build and push probe image
        shell: bash
        run: |
          set -euo pipefail
          image="cr.yandex/crphagvid8e8g5pp4fpe/telegram-serverless-probe:${GITHUB_SHA::12}"
          yc iam create-token | docker login --username iam --password-stdin cr.yandex >/dev/null
          docker build -t "$image" telegram-serverless-probe
          docker push "$image" >/dev/null
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo IMAGE_PUSH_PASS

      - name: Deploy serverless probe
        shell: bash
        run: |
          set -euo pipefail
          folder="b1gk4p83brasi8g811jv"
          name="telegram-relay-serverless-smoke"
          runtime_sa="ajeaad0m00gncv22tagf"
          id="$(yc serverless container list --folder-id "$folder" --format json | jq -r --arg n "$name" '.[] | select(.name==$n) | .id' | head -n1)"
          if [ -z "$id" ]; then
            yc serverless container create --folder-id "$folder" --name "$name" >/dev/null
          fi
          yc serverless container revision deploy \
            --folder-id "$folder" \
            --container-name "$name" \
            --runtime http \
            --image "$IMAGE" \
            --cores 1 \
            --memory 256MB \
            --concurrency 1 \
            --execution-timeout 30s \
            --service-account-id "$runtime_sa" \
            --environment RELAY_URL=wss://telegram-reader-relay.alexpmtk.workers.dev \
            >/dev/null
          yc serverless container allow-unauthenticated-invoke "$name" --folder-id "$folder" >/dev/null
          url="$(yc serverless container get "$name" --folder-id "$folder" --format json | jq -r '.url')"
          echo "URL=$url" >> "$GITHUB_ENV"
          echo "SERVERLESS_DEPLOY_PASS url=$url"

      - name: Probe from Serverless to Cloudflare relay
        shell: bash
        run: |
          set -euo pipefail
          base="${URL%/}"
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 20 "$base/health" > "$RUNNER_TEMP/health.json"; then break; fi
            sleep 5
          done
          jq -e '.status=="ok"' "$RUNNER_TEMP/health.json" >/dev/null
          echo SERVERLESS_HEALTH_PASS
          curl -fsS --max-time 30 "$base/probe" > "$RUNNER_TEMP/probe.json"
          cat "$RUNNER_TEMP/probe.json"
          jq -e '.status=="pass" and .websocket_open==true' "$RUNNER_TEMP/probe.json" >/dev/null
          echo SERVERLESS_RELAY_WEBSOCKET_PASS

      - name: Cleanup local key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json"
