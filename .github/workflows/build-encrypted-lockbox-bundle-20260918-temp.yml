name: Build encrypted Lockbox bundle for WORK 2026-09-18

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-encrypted-lockbox-bundle-20260918-temp.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    env:
      YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
    steps:
      - name: Install and configure Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL --retry 5 --retry-delay 3 https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          YC="$RUNNER_TEMP/yc/yc"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/yc-sa-key.json"
          chmod 600 "$RUNNER_TEMP/yc-sa-key.json"
          "$YC" config profile create migration-lockbox-export >/dev/null
          "$YC" config set service-account-key "$RUNNER_TEMP/yc-sa-key.json" >/dev/null
          echo "YC_BIN=$YC" >> "$GITHUB_ENV"

      - name: Export Lockbox payloads to ephemeral plaintext
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          yc=os.environ["YC_BIN"]
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"lockbox-plain"
          targets=[
              ("marketplaces","b1gnd0dqoq3ljod88i8t"),
              ("birzha","b1g00gqb66tbnfoumnkv"),
          ]
          summary={}
          for label,fid in targets:
              d=root/label
              d.mkdir(parents=True,exist_ok=True)
              p=subprocess.run([yc,"lockbox","secret","list","--folder-id",fid,"--format","json"],text=True,capture_output=True,timeout=60)
              if p.returncode:
                  raise RuntimeError(f"list failed {label}: {(p.stderr or '')[:200]}")
              items=json.loads(p.stdout or "[]")
              names=[]
              for item in items:
                  sid=str(item.get("id","")).strip()
                  name=str(item.get("name","")).strip()
                  if not sid:
                      raise RuntimeError(f"missing secret id in {label}")
                  safe=re.sub(r"[^A-Za-z0-9._-]+","_",name)[:120] or sid
                  out=d/(safe+".json")
                  with out.open("w",encoding="utf-8") as f:
                      q=subprocess.run([yc,"lockbox","payload","get","--id",sid,"--format","json"],stdout=f,stderr=subprocess.PIPE,text=True,timeout=60)
                  if q.returncode:
                      out.unlink(missing_ok=True)
                      raise RuntimeError(f"payload failed {label}/{name}: {(q.stderr or '')[:200]}")
                  obj=json.loads(out.read_text(encoding="utf-8"))
                  entries=obj.get("entries",[]) if isinstance(obj,dict) else []
                  if not isinstance(entries,list) or len(entries)==0:
                      raise RuntimeError(f"empty payload {label}/{name}")
                  names.append(name)
              summary[label]={"count":len(items),"names":names}
              print(f"LOCKBOX_EXPORT={label}=PASS secrets={len(items)}")
          if summary.get("marketplaces",{}).get("count") != 2 or summary.get("birzha",{}).get("count") != 2:
              raise RuntimeError(f"unexpected counts {summary}")
          (root/"_manifest.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: Encrypt bundle to MANAGER-MP2 public certificate
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/work-cert.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEKTCCApGgAwIBAgIUAnp9rJwf48SBosV3RsAxaZtDQmQwDQYJKoZIhvcNAQEL
          BQAwJDEiMCAGA1UEAwwZTUNQLVlhbmRleC1NaWdyYXRpb24tVGVtcDAeFw0yNjA5
