          f+jcVZ9cMPqwyZseXxI4NT0B9AWLVwTPNEbeTc5xNzF28bKUUeMpn6Mq84jnVJ/Z
          dxh/pV+LKIqNzVaNxTJiG0RhzV0sgXwqG+vLOV7exLG0Jz3uqfAzf1arstxBIu7o
          1nxT/BGeBIrQlMUjupInPQ8UQPX1Sy86l3REAtMQuB75IqsQrnIhWb5saonT5mUA
          liAmHXhAtzbAsgZ0hA==
          -----END CERTIFICATE-----
          CERT
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/lockbox-plain.tar.gz" lockbox-plain
          openssl cms -encrypt -binary -aes256 -in "$RUNNER_TEMP/lockbox-plain.tar.gz" -out "$GITHUB_WORKSPACE/lockbox-for-work.cms" -outform DER "$RUNNER_TEMP/work-cert.pem"
          test -s "$GITHUB_WORKSPACE/lockbox-for-work.cms"
          echo "LOCKBOX_ENCRYPTED_BUNDLE=PASS bytes=$(stat -c%s "$GITHUB_WORKSPACE/lockbox-for-work.cms")"

      - name: Delete ephemeral plaintext before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/lockbox-plain" "$RUNNER_TEMP/lockbox-plain.tar.gz" "$RUNNER_TEMP/yc-sa-key.json" "$RUNNER_TEMP/work-cert.pem"
          echo "PLAINTEXT_CLEANUP=PASS"

      - name: Upload encrypted-only Lockbox bundle
        uses: actions/upload-artifact@v4
        with:
          name: lockbox-encrypted-for-work
          path: lockbox-for-work.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
