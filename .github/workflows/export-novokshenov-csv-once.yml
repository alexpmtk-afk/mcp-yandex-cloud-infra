name: Export Archive Registry Once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-novokshenov-csv-once.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          curl -fsSL --retry 5 --retry-delay 3 "$URL" -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Export current reports registry from Object Storage
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          OBJECT_KEY: 'app/registry/reports_registry.csv'
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create archive-registry-export || true
          yc config set service-account-key "$KEY_FILE"
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          BUCKET="marketplaces-mcp-archive-${FOLDER_ID}"
          IAM_TOKEN="$(yc iam create-token)"
          test -n "$IAM_TOKEN"
          echo "::add-mask::$IAM_TOKEN"
          ENCODED_KEY="$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["OBJECT_KEY"], safe="/-_.~"))')"
          OUT="$RUNNER_TEMP/reports_registry.csv"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${IAM_TOKEN}" \
            "https://storage.yandexcloud.net/${BUCKET}/${ENCODED_KEY}" \
            --output "$OUT"
          test -s "$OUT"
          echo "REGISTRY_BYTES=$(wc -c < "$OUT" | tr -d ' ')"
          sha256sum "$OUT" | sed 's/^/REGISTRY_SHA256=/'

      - name: Upload temporary transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketplaces-reports-registry-current
          path: ${{ runner.temp }}/reports_registry.csv
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/reports_registry.csv"
