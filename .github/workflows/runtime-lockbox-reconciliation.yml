name: Runtime Lockbox Reconciliation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/runtime-lockbox-reconciliation.yml

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    env:
      YC_CLOUD_ID: b1gi4pr9msenirafh2c7
      YC_FOLDER_ID: b1gnd0dqoq3ljod88i8t
      CONTAINER_ID: bba6lj5ggejtop0jl5k8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --fail --silent --show-error -o "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Reconcile deployed revision with Lockbox cabinet metadata
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/yc-service-account-key.json"
          payload_file="$RUNNER_TEMP/lockbox-payload.json"
          cleanup() { rm -f "$key_file" "$payload_file"; }
          trap cleanup EXIT
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key_file"
          yc config profile create reconciliation-ci || true
          yc config set service-account-key "$key_file"
          yc config set cloud-id "$YC_CLOUD_ID"
          yc config set folder-id "$YC_FOLDER_ID"

          container="$(yc serverless container get "$CONTAINER_ID" --format json)"
          revision_id="$(jq -r '.current_revision_id // .currentRevisionId // empty' <<<"$container")"
          test -n "$revision_id"
          revision="$(yc serverless container revision get "$revision_id" --format json)"
          binding="$(jq -c '[.secrets[]? | select((.environment_variable // .environmentVariable) == "MARKETPLACE_MCP_CABINETS_JSON")] | if length == 1 then .[0] else error("expected exactly one cabinets binding") end' <<<"$revision")"
          secret_id="$(jq -r '.id // empty' <<<"$binding")"
          version_id="$(jq -r '.version_id // .versionId // empty' <<<"$binding")"
          key_name="$(jq -r '.key // empty' <<<"$binding")"
          test -n "$secret_id" && test -n "$version_id" && test "$key_name" = cabinets_json

          # Payload is written only to a protected runner-temp file, then deleted
          # by the EXIT trap. It is never echoed, uploaded, or committed.
          yc lockbox payload get --id "$secret_id" --version-id "$version_id" --format json --no-user-output > "$payload_file"
          python - "$payload_file" <<'PY'
          import base64, json, sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          entries = payload.get("entries") or []
          cabinets_raw = next((x.get("text_value", x.get("textValue")) for x in entries if x.get("key") == "cabinets_json"), None)
          if not isinstance(cabinets_raw, str):
              raise SystemExit("cabinets_json entry missing")
          data = json.loads(cabinets_raw)
          if not isinstance(data, dict):
              raise SystemExit("cabinets_json root is not an object")

          def wb_class(value):
              try:
                  part = str(value).split(".")[1]
                  part += "=" * (-len(part) % 4)
                  acc = json.loads(base64.urlsafe_b64decode(part.encode("ascii")).decode("utf-8")).get("acc")
                  return {1: "BASE", 2: "TEST", 3: "PERSONAL", 4: "SERVICE"}.get(acc, "UNVERIFIED")
              except Exception:
                  return "UNVERIFIED"

          ids = []
          wb = (data.get("wb") or {}).get("cabinets") or {}
          ozon = (data.get("ozon") or {}).get("cabinets") or {}
          if not isinstance(wb, dict) or not isinstance(ozon, dict):
              raise SystemExit("invalid cabinets structure")
          for cabinet_id in sorted(wb):
              ids.append(cabinet_id)
          for cabinet_id in sorted(ozon):
              ids.append(cabinet_id)
          print(f"CABINET_COUNT={len(ids)}")
          print("CABINET_IDS=" + ",".join(ids))
          for cabinet_id, cred in sorted(wb.items()):
              print(f"{cabinet_id}={wb_class((cred or {}).get('token', ''))}")
          for cabinet_id, cred in sorted(ozon.items()):
              configured = bool((cred or {}).get("client_id")) and bool((cred or {}).get("api_key"))
              print(f"{cabinet_id}=" + ("CONFIGURED" if configured else "MISSING"))
          PY
          echo "CURRENT_REVISION_ID=$revision_id"
          echo "MARKETPLACE_MCP_CABINETS_JSON_SECRET_ID=$secret_id"
          echo "MARKETPLACE_MCP_CABINETS_JSON_VERSION_ID=$version_id"
          echo "RECONCILIATION_METADATA=PASS"
