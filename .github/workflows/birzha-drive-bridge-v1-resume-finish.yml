name: Birzha Drive Bridge v1 Resume Finish

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact already-applied Birzha M25 source SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: birzha-m25-bridge-v1-cutover
  cancel-in-progress: false

env:
  TF_DIR: terraform/birzha_test
  BIRZHA_REPO: alexpmtk-afk/birzha-mcp-forecast
  REGISTRY_ID: crpk5qvf4p7kcqil2u3v
  LEGACY_MARKETPLACES_SECRET_ID: e6qb8b3u57e71731j1os

jobs:
  finish:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Validate exact canonical Birzha source
        id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          REMOTE_MAIN="$(git ls-remote "https://github.com/${BIRZHA_REPO}.git" refs/heads/main | awk '{print $1}')"
          [[ "$SOURCE_SHA" == "$REMOTE_MAIN" ]] || { echo 'source_sha is not current Birzha main' >&2; exit 1; }
          IMAGE="cr.yandex/${REGISTRY_ID}/birzha-mcp-forecast:m25-bridge-v1-git-${SOURCE_SHA}"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo 'BIRZHA_RESUME_CANONICAL_MAIN=PASS'

      - name: Install Yandex Cloud CLI and authenticate
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 5 \
            https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/yc:$PATH"
          KEY="$RUNNER_TEMP/yc-key.json"
          umask 077
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY"
          yc config profile create birzha-v1-resume >/dev/null 2>&1 || true
          yc config set service-account-key "$KEY"
          FOLDER_ID="$(yc resource-manager folder list --cloud-id b1gi4pr9msenirafh2c7 --format json | jq -r '.[]|select(.name=="birzha-mcp-forecast-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          TOKEN="$(yc iam create-token)"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/iam-token"
          echo 'BIRZHA_RESUME_YC_AUTH=PASS'

      - name: Initialize protected Birzha Terraform state
        shell: bash
        env:
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" init -reconfigure -input=false -lockfile=readonly \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" \
            -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY" >/dev/null
          terraform -chdir="$TF_DIR" validate
          echo 'BIRZHA_RESUME_TF_STATE=PASS'

      - name: Verify already-applied Bridge v1 worker state
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          IMAGE: ${{ steps.source.outputs.image }}
          BRIDGE_URL: ${{ vars.BIRZHA_GDRIVE_BRIDGE_V1_URL }}
        run: |
          set -euo pipefail
          test -n "$BRIDGE_URL"
          [[ "$BRIDGE_URL" == https://script.google.com/macros/s/*/exec ]]
          terraform -chdir="$TF_DIR" show -json > "$RUNNER_TEMP/state.json"
          python - <<'PY' > "$RUNNER_TEMP/runtime.env"
          import json,os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'state.json').read_text())
          by={r['address']:r['values'] for r in s['values']['root_module']['resources']}
          w=by['yandex_serverless_container.orchestrator_worker[0]']
          i=w['image'][0]
          e=i.get('environment') or {}
          sec=w.get('secrets') or []
          assert i['url']==os.environ['IMAGE'], i['url']
          assert e.get('BIRZHA_SOURCE_COMMIT')==os.environ['SOURCE_SHA']
          assert e.get('BIRZHA_MARKET_MIRROR_REQUIRED')=='true'
          assert e.get('BIRZHA_MARKET_MIRROR_PROJECT_ID')=='birzha'
          assert e.get('BIRZHA_MARKET_MIRROR_BRIDGE_URL')==os.environ['BRIDGE_URL']
          assert any(x.get('key')=='gdrive_bridge_v1_secret' and x.get('environment_variable')=='BIRZHA_MARKET_MIRROR_BRIDGE_SECRET' for x in sec), sec
          runtime=by['yandex_iam_service_account.runtime']
          timer=by['yandex_function_trigger.orchestrator_timer[0]']
          vals={'WORKER_ID':w['id'],'RUNTIME_SA':runtime['id'],'TIMER_ID':timer['id']}
          for k,v in vals.items():
              v=str(v); assert '\n' not in v and '\r' not in v
              print(f'{k}={v}')
          PY
          cat "$RUNNER_TEMP/runtime.env" >> "$GITHUB_ENV"
          echo 'BIRZHA_M25_V1_STATE=PASS'

      - name: Verify live Bridge v1 worker health
        shell: bash
        run: |
          set -euo pipefail
          URL="$(yc serverless container get "$WORKER_ID" --format json | jq -r '.url//empty')"
          test -n "$URL"
          BASE_URL="${URL%/}"
          TOKEN="$(cat "$RUNNER_TEMP/iam-token")"
          CODE=000
          for attempt in $(seq 1 20); do
            CODE="$(curl -sS --max-time 30 -H "Authorization: Bearer $TOKEN" -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "$BASE_URL/healthz" || true)"
            [[ "$CODE" == 200 ]] && break
            sleep 4
          done
          if [[ "$CODE" != 200 ]]; then
            echo "BIRZHA_WORKER_HEALTH_HTTP=$CODE"
            python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path(os.environ['RUNNER_TEMP'])/'health.json'
          s=p.read_text(errors='replace')[:2000] if p.exists() else '<no body>'
          s=re.sub(r'(?i)(token|secret|authorization|bearer)["\s:=]+[^\s,"}]+', r'\1=<redacted>', s)
          print('BIRZHA_WORKER_HEALTH_BODY='+s.replace('\n',' ')[:1500])
          PY
            exit 1
          fi
          jq -e '.status=="ok" and .market_mirror_required==true and .market_mirror_configured==true and .market_mirror_protocol==1 and .market_mirror_bridge_release=="1.0.0"' "$RUNNER_TEMP/health.json" >/dev/null
          echo "WORKER_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo 'BIRZHA_M25_V1_HEALTH=PASS'

      - name: Run one controlled orchestration tick
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/iam-token")"
          CODE="$(curl -sS --max-time 115 -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -o "$RUNNER_TEMP/tick.json" -w '%{http_code}' "$WORKER_URL/tick" || true)"
          test "$CODE" = 200
          jq -e 'type=="object"' "$RUNNER_TEMP/tick.json" >/dev/null
          echo 'BIRZHA_M25_CONTROLLED_TICK=PASS'

      - name: Retire and verify legacy Marketplaces secret access
        shell: bash
        run: |
          set -euo pipefail
          yc lockbox secret list-access-bindings --id "$LEGACY_MARKETPLACES_SECRET_ID" --format json > "$RUNNER_TEMP/legacy-before.json"
          HAS_LEGACY="$(jq -r --arg id "$RUNTIME_SA" '[.[] | select(.role_id=="lockbox.payloadViewer" and .subject.type=="serviceAccount" and .subject.id==$id)] | length' "$RUNNER_TEMP/legacy-before.json")"
          if [[ "$HAS_LEGACY" != 0 ]]; then
            yc lockbox secret remove-access-binding --id "$LEGACY_MARKETPLACES_SECRET_ID" --role lockbox.payloadViewer --service-account-id "$RUNTIME_SA"
          fi
          yc lockbox secret list-access-bindings --id "$LEGACY_MARKETPLACES_SECRET_ID" --format json > "$RUNNER_TEMP/legacy-after.json"
          jq -e --arg id "$RUNTIME_SA" '[.[] | select(.role_id=="lockbox.payloadViewer" and .subject.type=="serviceAccount" and .subject.id==$id)] | length == 0' "$RUNNER_TEMP/legacy-after.json" >/dev/null
          echo 'BIRZHA_LEGACY_MARKETPLACES_ACCESS=RETIRED'

      - name: Enable autonomous timer on verified v1 worker
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(yc serverless trigger get "$TIMER_ID" --format json | jq -r '.status//empty')"
          if [[ "$STATUS" != ACTIVE ]]; then
            yc serverless trigger resume "$TIMER_ID"
          fi
          yc serverless trigger get "$TIMER_ID" --format json > "$RUNNER_TEMP/timer.json"
          jq -e '.status=="ACTIVE"' "$RUNNER_TEMP/timer.json" >/dev/null
          echo 'BIRZHA_M25_TIMER=ACTIVE'
          echo 'BIRZHA_DRIVE_BRIDGE_V1_CUTOVER=PASS'

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/yc" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/iam-token" "$RUNNER_TEMP/state.json" "$RUNNER_TEMP/runtime.env" "$RUNNER_TEMP/health.json" "$RUNNER_TEMP/tick.json" "$RUNNER_TEMP/legacy-before.json" "$RUNNER_TEMP/legacy-after.json" "$RUNNER_TEMP/timer.json"
