name: Recovery Complete Serverless Network

on:
  push:
    branches:
      - recovery/marketplaces-mcp-deploy-20260830
    paths:
      - '.github/workflows/recovery-complete-serverless-network.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --fail --silent --show-error -o "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Ensure subnets in supported Serverless zones
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create marketplaces-network-complete || true
          yc config set service-account-key "$KEY_FILE"
          CLOUD_ID="b1gi4pr9msenirafh2c7"
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[] | select(.name == "marketplaces-mcp-test") | .id' | head -1)"
          NETWORK_ID="$(yc vpc network list --folder-id "$FOLDER_ID" --format json | jq -r '.[] | select(.name == "marketplaces-mcp-net") | .id' | head -1)"
          test -n "$FOLDER_ID"; test -n "$NETWORK_ID"
          ensure_subnet() {
            local zone="$1" name="$2" cidr="$3"
            local id
            id="$(yc vpc subnet list --folder-id "$FOLDER_ID" --format json | jq -r --arg n "$name" '.[] | select(.name == $n) | .id' | head -1)"
            if [[ -z "$id" ]]; then
              yc vpc subnet create --name "$name" --folder-id "$FOLDER_ID" --network-id "$NETWORK_ID" --zone "$zone" --range "$cidr" --no-user-output
              echo "created_subnet_$zone=true"
            else
              echo "created_subnet_$zone=false"
            fi
          }
          ensure_subnet ru-central1-b marketplaces-mcp-b 10.60.1.0/24
          ensure_subnet ru-central1-d marketplaces-mcp-d 10.60.2.0/24
          ensure_subnet ru-central1-e marketplaces-mcp-e 10.60.3.0/24
          yc vpc subnet list --folder-id "$FOLDER_ID" --format json | jq '[.[] | select(.network_id == "'"$NETWORK_ID"'") | {name,zone_id,v4_cidr_blocks}]'
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json"
