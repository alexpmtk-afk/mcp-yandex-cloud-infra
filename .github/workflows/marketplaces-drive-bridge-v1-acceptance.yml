name: Accept Marketplaces Google Drive Bridge v1

on:
  workflow_dispatch:
    inputs:
      bridge_url:
        description: Dedicated Marketplaces Apps Script Bridge v1 /exec URL
        required: true
        type: string
      foreign_file_id:
        description: File ID outside Marketplaces root for negative isolation test
        required: true
        type: string

permissions:
  contents: read

env:
  PROJECT_ID: marketplaces
  EXPECTED_ROOT_ID: 1UVKUcFfDhCDk6nMHX1mWg9cRL05DT-OJ
  LOCKBOX_NAME: marketplaces-google-drive-bridge-v1
  LOCKBOX_KEY: gdrive_bridge_secret

concurrency:
  group: marketplaces-drive-bridge-v1-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 30
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Fail closed until common large-read and concurrency acceptance exist
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'large_download' shared/google-drive-bridge/scripts/acceptance.py || {
            echo 'Shared Bridge acceptance does not yet validate large direct download.' >&2
            exit 1
          }
          grep -Eqi 'concurr|parallel' shared/google-drive-bridge/scripts/acceptance.py || {
            echo 'Shared Bridge acceptance does not yet validate independent-resource concurrency.' >&2
            exit 1
          }
          echo 'COMMON_ACCEPTANCE_MATRIX_IMPLEMENTED=PASS'

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'httpx>=0.27,<1'

      - name: Install Yandex Cloud CLI
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          ARCHIVE="$RUNNER_TEMP/yc.tgz"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          for attempt in $(seq 1 8); do
            rm -f "$ARCHIVE"
            if timeout 75s curl --fail --silent --show-error --retry 2 --retry-all-errors -o "$ARCHIVE" "$URL" \
              && tar -tzf "$ARCHIVE" >/dev/null 2>&1; then
              break
            fi
            [[ "$attempt" -lt 8 ]]
            sleep 4
          done
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate Yandex CI service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"

      - name: Resolve dedicated Bridge v1 credential
        id: credential
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(timeout 45s yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r --arg n "$LOCKBOX_NAME" '.[]|select(.name==$n)|.id'|head -1)"
          test -n "$SECRET_ID"
          timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"
          VERSION_ID="$(jq -r --arg k "$LOCKBOX_KEY" '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys // [])|index($k) != null)]|sort_by(.created_at)|last|.id // empty' "$RUNNER_TEMP/versions.json")"
          test -n "$VERSION_ID"
          timeout 45s yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/payload.json"
          BRIDGE_SECRET="$(jq -r --arg k "$LOCKBOX_KEY" '.entries[]|select(.key==$k)|.text_value // empty' "$RUNNER_TEMP/payload.json")"
          test -n "$BRIDGE_SECRET"
          echo "::add-mask::$BRIDGE_SECRET"
          printf '%s' "$BRIDGE_SECRET" > "$RUNNER_TEMP/bridge-secret"
          chmod 600 "$RUNNER_TEMP/bridge-secret"
          echo 'DEDICATED_MARKETPLACES_BRIDGE_CREDENTIAL=RESOLVED'

      - name: Authenticated deep health and capability gate
        shell: bash
        env:
          GDRIVE_BRIDGE_URL: ${{ inputs.bridge_url }}
        run: |
          set -euo pipefail
          export GDRIVE_BRIDGE_SECRET="$(cat "$RUNNER_TEMP/bridge-secret")"
          export GDRIVE_BRIDGE_PROJECT_ID="$PROJECT_ID"
          export GDRIVE_BRIDGE_EXPECTED_ROOT_ID="$EXPECTED_ROOT_ID"
          python - <<'PY'
          import asyncio, os, sys
          from pathlib import Path
          root=Path('shared/google-drive-bridge')
          sys.path.insert(0,str(root/'python_client'))
          from bridge_client import BridgeConfig, GoogleDriveBridgeClient
          async def main():
              client=GoogleDriveBridgeClient(BridgeConfig(
                  url=os.environ['GDRIVE_BRIDGE_URL'],
                  secret=os.environ['GDRIVE_BRIDGE_SECRET'],
                  project_id='marketplaces',
              ))
              health=await client.health()
              assert int(health.get('protocol_version') or 0) == 1, health
              assert health.get('project_id') == 'marketplaces', health
              assert health.get('root_id') == os.environ['GDRIVE_BRIDGE_EXPECTED_ROOT_ID'], health
              caps=health.get('capabilities') or {}
              for key in ('drive_small_io','drive_resumable_upload','drive_large_download','fixed_root_file_id_guard','idempotent_mutations'):
                  assert caps.get(key) is True, (key, health)
              assert caps.get('global_script_lock') is False, health
              print('MARKETPLACES_V1_DEEP_HEALTH=PASS')
          asyncio.run(main())
          PY

      - name: Run canonical common acceptance
        shell: bash
        env:
          GDRIVE_BRIDGE_URL: ${{ inputs.bridge_url }}
          GDRIVE_BRIDGE_PROJECT_ID: marketplaces
          GDRIVE_BRIDGE_EXPECTED_ROOT_ID: 1UVKUcFfDhCDk6nMHX1mWg9cRL05DT-OJ
          GDRIVE_BRIDGE_FOREIGN_FILE_ID: ${{ inputs.foreign_file_id }}
          GDRIVE_BRIDGE_RUN_LARGE: '1'
        run: |
          set -euo pipefail
          export GDRIVE_BRIDGE_SECRET="$(cat "$RUNNER_TEMP/bridge-secret")"
          python shared/google-drive-bridge/scripts/acceptance.py
          echo 'MARKETPLACES_COMMON_BRIDGE_V1_ACCEPTANCE=PASS'

      - name: Confirm production remains untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_URL' .github/workflows/deploy-mcp-test.yml
          grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_SECRET' .github/workflows/deploy-mcp-test.yml
          ! grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_V1_SECRET' .github/workflows/deploy-mcp-test.yml
          ! grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_PROTOCOL=v1' .github/workflows/deploy-mcp-test.yml
          echo 'PRODUCTION_CUTOVER_PERFORMED=NO'

      - name: Cleanup ephemeral credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/yc.tgz" \
            "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/payload.json" "$RUNNER_TEMP/bridge-secret"
