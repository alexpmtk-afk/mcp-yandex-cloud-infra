name: BIRZHA full MCP smoke once 2026-09-12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/birzha-full-server-smoke-once-20260912.yml'

permissions:
  contents: read

concurrency:
  group: birzha-full-server-smoke-once-20260912
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 25
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Prepare ephemeral Yandex key
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "YC_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Ground live runtime from Terraform state
        shell: bash
        env:
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          terraform -chdir=terraform/birzha_test init -reconfigure -input=false -lockfile=readonly \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" \
            -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY"
          terraform -chdir=terraform/birzha_test output -json > "$RUNNER_TEMP/outputs.json"
          terraform -chdir=terraform/birzha_test show -json > "$RUNNER_TEMP/state.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=Path(os.environ['RUNNER_TEMP'])
          o=json.loads((r/'outputs.json').read_text()); v=lambda k:o[k]['value']
          domain=v('api_gateway_domain').strip(); endpoint=v('mcp_endpoint').strip()
          assert endpoint==f'https://{domain}/mcp'
          required=('ydb_database_id','mcp_auth_secret_id','mcp_auth_secret_version_id','serverless_container_id','api_gateway_id')
          for k in required: assert v(k), k
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'GATEWAY_DOMAIN={domain}\n')
              f.write(f'MCP_ENDPOINT={endpoint}\n')
              f.write(f'MCP_AUTH_SECRET_ID={v("mcp_auth_secret_id")}\n')
              f.write(f'MCP_AUTH_VERSION_ID={v("mcp_auth_secret_version_id")}\n')
          state=json.loads((r/'state.json').read_text())
          source_sha=image_url=None
          def walk(mod):
              global source_sha,image_url
              for x in mod.get('resources',[]):
                  if x.get('address')=='yandex_serverless_container.mcp[0]':
                      vals=x.get('values',{})
                      imgs=vals.get('image') or []
                      if imgs:
                          image_url=imgs[0].get('url')
                          env=imgs[0].get('environment') or {}
                          source_sha=env.get('BIRZHA_SOURCE_COMMIT')
              for c in mod.get('child_modules',[]) or []: walk(c)
          walk(state.get('values',{}).get('root_module',{}))
          print('LIVE_COORDINATES',json.dumps({
              'gateway_domain':domain,
              'container_id':v('serverless_container_id'),
              'ydb_database_id':v('ydb_database_id'),
              'source_sha':source_sha,
              'image_ref':image_url,
          },sort_keys=True))
          PY

      - name: Public health and unauthenticated security
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="https://${GATEWAY_DOMAIN}/healthz"
          OK=0
          for i in $(seq 1 12); do
            CODE="$(curl --proto '=https' --tlsv1.2 -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' --max-time 30 "$HEALTH" || true)"
            if [ "$CODE" = "200" ]; then OK=1; break; fi
            sleep 5
          done
          test "$OK" = "1"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'health.json').read_text())
          assert d.get('status')=='ok', d
          assert d.get('state_backend')=='ydb', d
          assert d.get('historical_storage')=='distributed', d
          print('HEALTH_PASS',json.dumps(d,sort_keys=True))
          PY
          CODE="$(curl --proto '=https' --tlsv1.2 -sS -o "$RUNNER_TEMP/unauth.json" -w '%{http_code}' --max-time 30 "$MCP_ENDPOINT" || true)"
          echo "UNAUTH_MCP_HTTP=$CODE"
          test "$CODE" = "401"
          echo AUTH_GATE_PASS

      - name: Install acceptance clients
        run: python -m pip install --disable-pip-version-check 'mcp==2.1.1' 'yandexcloud'

      - name: Read masked MCP token
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import yandexcloud
          from yandex.cloud.lockbox.v1.payload_service_pb2 import GetPayloadRequest
          from yandex.cloud.lockbox.v1.payload_service_pb2_grpc import PayloadServiceStub
          key=json.loads(Path(os.environ['YC_KEY_FILE']).read_text())
          sdk=yandexcloud.SDK(service_account_key=key)
          service=sdk.client(PayloadServiceStub)
          payload=service.Get(GetPayloadRequest(secret_id=os.environ['MCP_AUTH_SECRET_ID'],version_id=os.environ['MCP_AUTH_VERSION_ID']))
          vals=[e.text_value for e in payload.entries if e.key=='bearer_token']
          assert len(vals)==1 and len(vals[0])>=48
          token=vals[0]; print(f'::add-mask::{token}')
          p=Path(os.environ['RUNNER_TEMP'])/'mcp-token'; p.write_text(token); p.chmod(0o600)
          print('MASKED_TOKEN_READY')
          PY

      - name: Authorized full read-only MCP smoke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio, json, os, traceback
          from pathlib import Path
          import httpx2
          from mcp import Client
          from mcp.client.streamable_http import streamable_http_client

          EXPECTED_TOOLS={
            'system.version','market.resolve_instrument','market.resolve_active_future','market.candles','market.recent_candles',
            'history.sync','history.sync_batch','history.sync_core','history.flow_sync','history.coverage',
            'market.flow','market.snapshot','forecast.build','forecast.create','forecast.get','forecast.list',
            'outcome.evaluate','outcome.list','validation.walk_forward','validation.assess_model',
            'validation.development_holdout','validation.calibrate_model','validation.calibrate_core'
          }
          report={'probes':{},'errors':[]}

          def compact(x):
              if isinstance(x,dict):
                  keep={}
                  for k,v in x.items():
                      if k in {'candles','rows','records','forecasts','outcomes','trades','items'} and isinstance(v,list):
                          keep[k+'_count']=len(v)
                      elif isinstance(v,(str,int,float,bool)) or v is None:
                          keep[k]=v
                      elif isinstance(v,list):
                          keep[k+'_count']=len(v)
                      elif isinstance(v,dict):
                          keep[k]=compact(v)
                  return keep
              return x

          async def call(client,name,args,critical=False):
              try:
                  r=await client.call_tool(name,args)
                  if r.is_error:
                      raise RuntimeError(str(r))
                  data=r.structured_content
                  report['probes'][name+':'+json.dumps(args,sort_keys=True,ensure_ascii=False)]={'ok':True,'summary':compact(data)}
                  return data
              except Exception as e:
                  entry={'tool':name,'args':args,'type':type(e).__name__,'error':str(e)[:900],'critical':critical}
                  report['errors'].append(entry)
                  report['probes'][name+':'+json.dumps(args,sort_keys=True,ensure_ascii=False)]={'ok':False,'error':entry}
                  return None

          async def main():
              token=(Path(os.environ['RUNNER_TEMP'])/'mcp-token').read_text()
              timeout=httpx2.Timeout(30.0,read=300.0)
              async with httpx2.AsyncClient(headers={'Authorization':f'Bearer {token}'},timeout=timeout,follow_redirects=True) as hc:
                  async with Client(streamable_http_client(os.environ['MCP_ENDPOINT'],http_client=hc)) as client:
                      listed=await client.list_tools(); names={t.name for t in listed.tools}
                      missing=sorted(EXPECTED_TOOLS-names); extra=sorted(names-EXPECTED_TOOLS)
                      report['tool_count']=len(names); report['tools']=sorted(names); report['missing_tools']=missing; report['extra_tools']=extra
                      if missing:
                          report['errors'].append({'tool':'tools/list','type':'MissingTools','error':','.join(missing),'critical':True})

                      await call(client,'system.version',{},True)

                      for sym in ['SBER','Si','BR','GOLD','IMOEX','RTSI']:
                          await call(client,'market.resolve_instrument',{'symbol':sym}, sym in {'SBER','Si'})

                      await call(client,'market.candles',{'symbol':'SBER','timeframe':'D1','from_date':'2026-09-01','till_date':'2026-09-05','completed_only':True},True)
                      await call(client,'market.recent_candles',{'symbol':'SBER','timeframe':'H1','lookback_days':5,'completed_only':True},True)

                      for tf in ['D1','H1','M15']:
                          await call(client,'history.coverage',{'secid':'SBER','timeframe':tf}, tf in {'D1','H1'})

                      await call(client,'market.flow',{'symbol':'SBER','lookback_days':3},False)
                      await call(client,'market.snapshot',{'symbol':'SBER'},True)
                      await call(client,'forecast.build',{'symbol':'SBER'},True)

                      fl=await call(client,'forecast.list',{'limit':3},True)
                      fid=None
                      def find_fid(x):
                          if isinstance(x,dict):
                              if x.get('forecast_id'): return x['forecast_id']
                              for v in x.values():
                                  z=find_fid(v)
                                  if z: return z
                          elif isinstance(x,list):
                              for v in x:
                                  z=find_fid(v)
                                  if z: return z
                          return None
                      fid=find_fid(fl)
                      report['existing_forecast_id_found']=bool(fid)
                      if fid:
                          await call(client,'forecast.get',{'forecast_id':fid},True)
                          await call(client,'outcome.list',{'forecast_id':fid},False)

                      # Tiny non-persistent validation probe: verifies the validation path without changing model thresholds or durable state.
                      await call(client,'validation.walk_forward',{'symbol':'SBER','start_date':'2026-08-03','end_date':'2026-08-14','step_sessions':5,'max_points':1},False)

              critical=[e for e in report['errors'] if e.get('critical')]
              report['critical_error_count']=len(critical)
              report['error_count']=len(report['errors'])
              report['status']='PASS' if not critical else 'FAIL'
              print('BIRZHA_FULL_SMOKE_REPORT='+json.dumps(report,ensure_ascii=False,sort_keys=True))
              if critical:
                  raise SystemExit(2)

          asyncio.run(main())
          PY

      - name: Remove ephemeral credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/mcp-token"
