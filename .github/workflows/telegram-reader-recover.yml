name: Recover Telegram Reader Manager

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-reader-recover.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-recover || true
          yc config profile activate telegram-recover
          yc config set service-account-key "$key"

      - name: Recover service
        shell: bash
        run: |
          set -euo pipefail
          yc config profile activate telegram-recover
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/tgkey"
          ip="$(curl -fsS https://api.ipify.org)"
          old_keys="$(yc compute instance get telegram-news-reader --folder-id b1gk4p83brasi8g811jv --format json | jq -r '.metadata["ssh-keys"] // ""')"
          printf '%s' "$old_keys" > "$RUNNER_TEMP/oldkeys"
          { printf '%s\n' "$old_keys"; printf 'ubuntu:'; cat "$RUNNER_TEMP/tgkey.pub"; } > "$RUNNER_TEMP/newkeys"
          yc compute instance add-metadata telegram-news-reader --folder-id b1gk4p83brasi8g811jv --metadata-from-file ssh-keys="$RUNNER_TEMP/newkeys"
          yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id b1gk4p83brasi8g811jv --add-rule "description=github-telegram-recover,direction=ingress,port=22,protocol=tcp,v4-cidrs=$ip/32"
          sleep 20
          remote='set -euo pipefail; image=cr.yandex/crphagvid8e8g5pp4fpe/telegram-news-reader:5fe892657de62d56cf848c18b9ef5bdf7fbddb87; token=$(curl -sf --max-time 10 -H Metadata-Flavor:Google 169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token | jq -r .access_token); echo "$token" | timeout 30 sudo docker login --username iam --password-stdin cr.yandex >/dev/null; timeout 120 sudo docker pull "$image" >/dev/null; sudo docker rm -f telegram-reader >/dev/null 2>&1 || true; sudo docker run -d --name telegram-reader --restart unless-stopped -p 127.0.0.1:8080:8080 --env-file /opt/telegram-reader/runtime.env -v /state:/state "$image" >/dev/null; for i in $(seq 1 20); do if curl -fsS --max-time 3 http://127.0.0.1:8080/health >/tmp/tg-health 2>/dev/null; then break; fi; sleep 2; done; cat /tmp/tg-health; jq -e ".status == \"ok\"" /tmp/tg-health >/dev/null; curl -fsS --max-time 5 http://127.0.0.1:8080/manage | grep -q "Telegram Reader — управление чатами"; echo RECOVERY_PASS'
          ssh -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o ConnectTimeout=20 -i "$RUNNER_TEMP/tgkey" ubuntu@111.88.248.156 "$remote"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          yc config profile activate telegram-recover >/dev/null 2>&1 || true
          ids=$(yc vpc security-group get enpocnvnpdu2goj9nkjn --folder-id b1gk4p83brasi8g811jv --format json | jq -r '.rules[] | select(.description=="github-telegram-recover") | .id')
          for id in $ids; do yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id b1gk4p83brasi8g811jv --delete-rule-id "$id"; done
          if [ -f "$RUNNER_TEMP/oldkeys" ]; then yc compute instance add-metadata telegram-news-reader --folder-id b1gk4p83brasi8g811jv --metadata-from-file ssh-keys="$RUNNER_TEMP/oldkeys"; fi
          rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/tgkey" "$RUNNER_TEMP/tgkey.pub" "$RUNNER_TEMP/oldkeys" "$RUNNER_TEMP/newkeys"
