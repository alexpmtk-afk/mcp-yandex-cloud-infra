name: Bootstrap Google Drive Apps Script Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DRIVE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbzgFDAQY4rcsblKhiAONfOI6315k8W3vwbSIEsczE3ycQtnJ8ctcVKjhzjgdTgfy0cvIA/exec
  ARCHIVE_DRIVE_ROOT_ID: 1UVKUcFfDhCDk6nMHX1mWg9cRL05DT-OJ
  ARCHIVE_DRIVE_ROOT_NAME: MCP архив базы данных

concurrency:
  group: marketplaces-google-drive-bridge-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Validate temporary bridge secret and live Apps Script
        shell: bash
        env:
          GOOGLE_DRIVE_BRIDGE_SECRET: ${{ secrets.GOOGLE_DRIVE_BRIDGE_SECRET }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_DRIVE_BRIDGE_SECRET"
          echo "::add-mask::$GOOGLE_DRIVE_BRIDGE_SECRET"
          python - <<'PY'
          import json, os, urllib.request

          url = os.environ['DRIVE_BRIDGE_URL']
          secret = os.environ['GOOGLE_DRIVE_BRIDGE_SECRET']
          payload = json.dumps({'secret': secret, 'action': 'health'}).encode('utf-8')
          req = urllib.request.Request(
              url,
              data=payload,
              headers={'Content-Type': 'application/json', 'Accept': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              body = json.loads(resp.read().decode('utf-8'))
          assert body.get('ok') is True, body
          assert str(body.get('root_id', '')) == os.environ['ARCHIVE_DRIVE_ROOT_ID'], body
          assert str(body.get('root_name', '')) == os.environ['ARCHIVE_DRIVE_ROOT_NAME'], body
          assert int(body.get('version', 0)) >= 2, body
          print('DRIVE_BRIDGE_HEALTH=PASS')
          PY

      - name: Install Yandex Cloud CLI
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          ARCHIVE="$RUNNER_TEMP/yc.tgz"
          rm -f "$ARCHIVE"
          ok=0
          for attempt in $(seq 1 10); do
            if timeout 75s wget --quiet --continue --timeout=30 --tries=2 --retry-connrefused --output-document="$ARCHIVE" "$URL"; then
              if tar -tzf "$ARCHIVE" >/dev/null 2>&1; then
                ok=1
                break
              fi
              rm -f "$ARCHIVE"
            fi
            sleep 3
          done
          test "$ok" = 1
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/yc/yc" version

      - name: Authenticate Yandex CI service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"

      - name: Resolve Lockbox base version
        id: live
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(timeout 45s yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          test -n "$SECRET_ID"
          timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"
          VERSION_ID="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys // [])|index("cabinets_json") != null)|select((.payload_entry_keys // [])|index("mcp_bearer_token") != null)|select((.payload_entry_keys // [])|index("redis_password") != null)]|sort_by(.created_at)|last|.id // empty' "$RUNNER_TEMP/versions.json")"
          test -n "$VERSION_ID"
          echo "secret=$SECRET_ID" >> "$GITHUB_OUTPUT"
          echo "base_version=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo 'LOCKBOX_BASE=RESOLVED'

      - name: Store bridge secret in Yandex Lockbox
        id: lockbox
        shell: bash
        env:
          GOOGLE_DRIVE_BRIDGE_SECRET: ${{ secrets.GOOGLE_DRIVE_BRIDGE_SECRET }}
          SECRET_ID: ${{ steps.live.outputs.secret }}
          BASE_VERSION_ID: ${{ steps.live.outputs.base_version }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GOOGLE_DRIVE_BRIDGE_SECRET"
          PAYLOAD="$RUNNER_TEMP/bridge-payload.json"
          python - <<'PY'
          import json, os
          secret = os.environ['GOOGLE_DRIVE_BRIDGE_SECRET']
          with open(os.environ['RUNNER_TEMP'] + '/bridge-payload.json', 'w', encoding='utf-8') as f:
              json.dump([{'key':'google_drive_bridge_secret','text_value':secret}], f, ensure_ascii=False, separators=(',', ':'))
          PY
          chmod 600 "$PAYLOAD"
          timeout 60s yc lockbox secret add-version \
            --id "$SECRET_ID" \
            --base-version-id "$BASE_VERSION_ID" \
            --description "Google Drive Apps Script bridge bootstrap 2026-09-14" \
            --payload - --format json --no-user-output \
            < "$PAYLOAD" > "$RUNNER_TEMP/new-version.json"
          NEW_VERSION_ID="$(jq -r '.id // .response.id // empty' "$RUNNER_TEMP/new-version.json")"
          test -n "$NEW_VERSION_ID"
          echo "version=$NEW_VERSION_ID" >> "$GITHUB_OUTPUT"

          timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions-after.json"
          jq -r --arg id "$NEW_VERSION_ID" '.[]|select(.id==$id)|.payload_entry_keys[]?' "$RUNNER_TEMP/versions-after.json" | sort -u > "$RUNNER_TEMP/keys.txt"
          for key in cabinets_json mcp_bearer_token redis_password google_drive_bridge_secret; do
            grep -Fxq "$key" "$RUNNER_TEMP/keys.txt"
          done
          echo 'LOCKBOX_DRIVE_BRIDGE=PASS'

      - name: Cleanup temporary files
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/yc-service-account-key.json" \
            "$RUNNER_TEMP/yc.tgz" \
            "$RUNNER_TEMP/versions.json" \
            "$RUNNER_TEMP/versions-after.json" \
            "$RUNNER_TEMP/bridge-payload.json" \
            "$RUNNER_TEMP/new-version.json" \
            "$RUNNER_TEMP/keys.txt"
