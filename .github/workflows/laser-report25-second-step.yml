name: Laser Report 25 Second Step

on:
  push:
    branches: [fix/marketplaces-destroy-v1-lockbox-history]
    paths: ['.github/workflows/laser-report25-second-step.yml']

permissions:
  contents: read

concurrency:
  group: marketplaces-archive-queue-worker
  cancel-in-progress: false

jobs:
  one-step:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL --retry 5 --retry-delay 3 https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
          python -m pip install --quiet 'httpx>=0.27,<1'
      - name: Resolve MCP
        id: live
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          K="$RUNNER_TEMP/k.json"; umask 077; printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$K"
          yc config profile create laser25-step2 >/dev/null 2>&1 || true; yc config set service-account-key "$K"
          F="$(yc resource-manager folder list --cloud-id b1gi4pr9msenirafh2c7 --format json|jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"; test -n "$F"; yc config set folder-id "$F"
          S="$(yc lockbox secret list --folder-id "$F" --format json|jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          yc lockbox secret list-versions --id "$S" --format json --no-user-output > "$RUNNER_TEMP/v.json"
          V="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys//[])|index("gdrive_bridge_v1_secret")==null)|select((.payload_entry_keys//[])|index("mcp_bearer_token")!=null)]|sort_by(.created_at)|last|.id//empty' "$RUNNER_TEMP/v.json")"; test "$V" = e6qnvjc1fpqj2osspbtt
          D="$(yc serverless api-gateway list --folder-id "$F" --format json|jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//empty')"; test -n "$D"
          yc lockbox payload get --id "$S" --version-id "$V" --format json --no-user-output > "$RUNNER_TEMP/p.json"
          B="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value//empty' "$RUNNER_TEMP/p.json")"; test -n "$B"; echo "::add-mask::$B"; printf '%s' "$B" > "$RUNNER_TEMP/b"; chmod 600 "$RUNNER_TEMP/b"
          echo "url=https://${D}/mcp" >> "$GITHUB_OUTPUT"
      - name: One exact worker call from staged page checkpoint
        shell: bash
        env:
          MCP_URL: ${{ steps.live.outputs.url }}
        run: |
          set -euo pipefail
          export MCP_BEARER="$(cat "$RUNNER_TEMP/b")"
          python -u - <<'PY'
          import itertools,json,os,httpx
          J='wb-finance-wb_laser_master-2026'; REPORT=751229976; RRD=3127015312325
          def unpack(r):
            r.raise_for_status()
            for line in r.text.splitlines():
              if line.startswith('data:'): return json.loads(line[5:].strip())
            return r.json()
          h0={'Authorization':'Bearer '+os.environ['MCP_BEARER'],'Accept':'application/json, text/event-stream','Content-Type':'application/json'}; ids=itertools.count(1)
          with httpx.Client(timeout=httpx.Timeout(connect=15,read=540,write=30,pool=15),follow_redirects=True) as c:
            r=c.post(os.environ['MCP_URL'],headers=h0,json={'jsonrpc':'2.0','id':next(ids),'method':'initialize','params':{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'laser25-step2','version':'1'}}}); init=unpack(r); assert 'result' in init
            h=dict(h0); sid=r.headers.get('mcp-session-id'); h.update({'MCP-Protocol-Version':init['result'].get('protocolVersion','2025-06-18')});
            if sid: h['Mcp-Session-Id']=sid
            c.post(os.environ['MCP_URL'],headers=h,json={'jsonrpc':'2.0','method':'notifications/initialized'})
            def tool(n,a):
              d=unpack(c.post(os.environ['MCP_URL'],headers=h,json={'jsonrpc':'2.0','id':next(ids),'method':'tools/call','params':{'name':n,'arguments':a}})); assert 'result' in d,d; x=d['result']; assert not x.get('isError'),x; t=next(i.get('text') for i in x.get('content',[]) if i.get('type')=='text'); return json.loads(t)
            before=tool('marketplace_archive_job_status',{'job_id':J})
            assert int(before.get('report_index') or -1)==24,before
            assert int(before.get('provider_calls') or -1)==50,before
            assert str(before.get('phase') or '')=='DOWNLOAD',before
            assert int(before.get('current_rrd_id') or 0)==RRD,before
            assert not before.get('finalize_phase') and not before.get('last_error'),before
            print('PRECHECK=PASS',flush=True)
            step=tool('marketplace_archive_worker_step',{'job_id':J}); print('STEP_RESULT='+json.dumps(step,ensure_ascii=False),flush=True); assert step.get('ok') is True,step
            action=str(step.get('action') or ''); assert action in {'report_page_staged','report_download_complete','waiting_rate_limit','worker_busy'},step
            after=tool('marketplace_archive_job_status',{'job_id':J}); pc=int(after.get('provider_calls') or 0)
            assert int(after.get('report_index') or -1)==24,after
            assert 50<=pc<=51,after
            assert pc-50<=1,after
            assert int(after.get('finalize_report_id') or 0) in (0,REPORT),after
            print('POST_ACTION='+action,flush=True); print('POST_PROVIDER_CALLS='+str(pc),flush=True); print('POST_CURRENT_RRD_ID='+str(after.get('current_rrd_id')),flush=True); print('POST_FINALIZE_PHASE='+str(after.get('finalize_phase')),flush=True); print('POST_FINALIZE_REPORT='+str(after.get('finalize_report_id')),flush=True); print('POST_LAST_ERROR='+str(after.get('last_error')),flush=True); print('EXACTLY_ONE_WORKER_CALL=PASS',flush=True)
          PY
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/yc" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/k.json" "$RUNNER_TEMP/v.json" "$RUNNER_TEMP/p.json" "$RUNNER_TEMP/b"
