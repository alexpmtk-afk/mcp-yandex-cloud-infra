name: Recovery Grant Marketplaces Deploy Role

on:
  push:
    branches:
      - recovery/marketplaces-mcp-deploy-20260830
    paths:
      - '.github/workflows/recovery-grant-marketplaces-deploy-role.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grant:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --fail --silent --show-error -o "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Ensure deploy permissions for CI service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          CI_SA_ID="$(jq -r '.service_account_id // empty' "$KEY_FILE")"
          test -n "$CI_SA_ID"
          yc config profile create marketplaces-grant || true
          yc config set service-account-key "$KEY_FILE"
          CLOUD_ID="b1gi4pr9msenirafh2c7"
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[] | select(.name == "marketplaces-mcp-test") | .id' | head -1)"
          test -n "$FOLDER_ID"
          echo "ci_service_account_resolved=true"
          yc resource-manager folder add-access-binding "$FOLDER_ID" --role editor --subject "serviceAccount:$CI_SA_ID" --no-user-output
          echo "folder_editor_granted=true"
          yc vpc network list --folder-id "$FOLDER_ID" --format json >/dev/null
          yc managed-redis cluster list --folder-id "$FOLDER_ID" --format json >/dev/null
          echo "vpc_access_verified=true"
          echo "managed_valkey_access_verified=true"
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json"
