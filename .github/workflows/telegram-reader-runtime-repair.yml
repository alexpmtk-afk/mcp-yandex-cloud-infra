name: Repair Telegram Reader Runtime

on:
  push:
    branches:
      - feature/telegram-news-reader
    paths:
      - ".github/workflows/telegram-reader-runtime-repair.yml"
      - "terraform/telegram_reader/scripts/repair-runtime.sh"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-reader-repair || true
          yc config set service-account-key "$key"

      - name: Add ephemeral SSH access
        id: access
        shell: bash
        run: |
          set -euo pipefail
          folder='b1gk4p83brasi8g811jv'
          vm='telegram-news-reader'
          runner_ip="$(curl -fsSL https://api.ipify.org)"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/id_ed25519"
          pub="$(cat "$RUNNER_TEMP/id_ed25519.pub")"
          yc compute instance get --name "$vm" --folder-id "$folder" --full --format json > "$RUNNER_TEMP/vm-full.json"
          ip="$(jq -r '.network_interfaces[0].primary_v4_address.one_to_one_nat.address' "$RUNNER_TEMP/vm-full.json")"
          sg="$(jq -r '.network_interfaces[0].security_group_ids[0]' "$RUNNER_TEMP/vm-full.json")"
          test -n "$ip"; test -n "$sg"; test -n "$runner_ip"
          yc compute instance add-metadata --name "$vm" --folder-id "$folder" \
            --metadata "ssh-keys=ubuntu:${pub}" >/dev/null
          yc vpc security-group update-rules --id "$sg" \
            --add-rule "description=ephemeral-runtime-repair,direction=ingress,port=22,protocol=tcp,v4-cidrs=[$runner_ip/32]" >/dev/null
          rule_id="$(yc vpc security-group get --id "$sg" --format json | jq -r '.rules[] | select(.description=="ephemeral-runtime-repair") | .id' | tail -1)"
          test -n "$rule_id"
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          echo "sg=$sg" >> "$GITHUB_OUTPUT"
          echo "rule_id=$rule_id" >> "$GITHUB_OUTPUT"

      - name: Repair runtime
        shell: bash
        env:
          VM_IP: ${{ steps.access.outputs.ip }}
        run: |
          set -euo pipefail
          ssh_opts=(-o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$RUNNER_TEMP/id_ed25519")
          for attempt in $(seq 1 18); do
            if ssh "${ssh_opts[@]}" ubuntu@"$VM_IP" true; then break; fi
            sleep 5
          done
          scp "${ssh_opts[@]}" terraform/telegram_reader/scripts/repair-runtime.sh ubuntu@"$VM_IP":/tmp/repair-runtime.sh
          ssh "${ssh_opts[@]}" ubuntu@"$VM_IP" \
            "sudo install -m 0750 /tmp/repair-runtime.sh /usr/local/sbin/repair-telegram-runtime && sudo /usr/local/sbin/repair-telegram-runtime"

      - name: Verify public HTTPS setup
        shell: bash
        env:
          VM_IP: ${{ steps.access.outputs.ip }}
        run: |
          set -euo pipefail
          host="$(printf '%s' "$VM_IP" | tr . -).sslip.io"
          url="https://${host}/setup/healthz"
          for attempt in $(seq 1 60); do
            if body="$(curl -fsS --max-time 10 "$url" 2>/dev/null)" && printf '%s' "$body" | grep -q setup_required; then
              printf 'setup_url=https://%s/setup/\n' "$host" > "$RUNNER_TEMP/runtime-repair-evidence.txt"
              echo 'PUBLIC_SETUP_READY=PASS'
              exit 0
            fi
            sleep 5
          done
          echo 'PUBLIC_SETUP_READY=FAIL' >&2
          exit 1

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-reader-runtime-repair-evidence
          path: ${{ runner.temp }}/runtime-repair-evidence.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Remove ephemeral access
        if: always()
        shell: bash
        env:
          SG_ID: ${{ steps.access.outputs.sg }}
          RULE_ID: ${{ steps.access.outputs.rule_id }}
        run: |
          set +e
          folder='b1gk4p83brasi8g811jv'
          vm='telegram-news-reader'
          yc compute instance remove-metadata --name "$vm" --folder-id "$folder" --keys ssh-keys >/dev/null 2>&1 || true
          if [ -n "$SG_ID" ] && [ -n "$RULE_ID" ]; then
            yc vpc security-group update-rules --id "$SG_ID" --delete-rule-id "$RULE_ID" >/dev/null
          fi
          rm -f "$RUNNER_TEMP/id_ed25519" "$RUNNER_TEMP/id_ed25519.pub" "$RUNNER_TEMP/yc-key.json"
