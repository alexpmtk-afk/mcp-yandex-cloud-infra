name: Telegram Reader tg-ws Default Cloudflare Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/telegram-reader-tgws-default-cf-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - name: Install and authenticate YC
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/a.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/a.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"
          chmod 600 "$RUNNER_TEMP/key.json"
          "$RUNNER_TEMP/yc/yc" config profile create tgws-cf-probe || true
          "$RUNNER_TEMP/yc/yc" config set service-account-key "$RUNNER_TEMP/key.json"

      - name: Create disposable Yandex VM
        id: vm
        shell: bash
        run: |
          set -euo pipefail
          folder='b1gk4p83brasi8g811jv'
          prod="$(yc compute instance get --name telegram-news-reader --folder-id "$folder" --full --format json)"
          zone="$(echo "$prod" | jq -r .zone_id)"
          subnet="$(echo "$prod" | jq -r '.network_interfaces[0].subnet_id')"
          name="tgws-cf-probe-${GITHUB_RUN_ID}"
          cat > "$RUNNER_TEMP/run.sh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          apt-get update -qq
          apt-get install -y -qq curl jq ca-certificates >/dev/null
          release="$(curl -fsSL https://api.github.com/repos/valnesfjord/tg-ws-proxy-rs/releases/latest)"
          tag="$(printf '%s' "$release" | jq -r .tag_name)"
          url="$(printf '%s' "$release" | jq -r '.assets[] | select(.name|test("x86_64.*linux|linux.*x86_64|x86_64-unknown-linux-musl";"i")) | select(.name|endswith(".tar.gz")) | .browser_download_url' | head -1)"
          echo "RELEASE_TAG=$tag"
          if [ -z "$url" ] || [ "$url" = null ]; then
            echo 'TGWS_BINARY=ASSET_NOT_FOUND'
            printf '%s' "$release" | jq -r '.assets[].name' | head -50
            exit 20
          fi
          curl -fL --retry 2 -o /tmp/tgws.tar.gz "$url"
          mkdir -p /tmp/tgws
          tar -xzf /tmp/tgws.tar.gz -C /tmp/tgws
          bin="$(find /tmp/tgws -type f -name 'tg-ws-proxy*' ! -name '*.sha*' | head -1)"
          chmod +x "$bin"
          "$bin" --version || true
          echo '===TGWS_CHECK_START==='
          timeout 120 "$bin" --default-domains --cf-priority --check --verbose
          rc=$?
          echo "TGWS_CHECK_RC=$rc"
          echo '===TGWS_CHECK_END==='
          exit "$rc"
          SH
          sed 's/^/      /' "$RUNNER_TEMP/run.sh" > "$RUNNER_TEMP/ri"
          {
            echo '#cloud-config'
            echo 'write_files:'
            echo '  - path: /opt/run.sh'
            echo "    permissions: '0755'"
            echo '    content: |'
            cat "$RUNNER_TEMP/ri"
            echo 'runcmd:'
            echo '  - [bash, -lc, "/opt/run.sh >/tmp/result 2>&1; rc=$?; echo ===TGWS_PROBE_BEGIN=== >/dev/ttyS0; cat /tmp/result >/dev/ttyS0; echo ===TGWS_PROBE_END=== >/dev/ttyS0; exit $rc"]'
          } > "$RUNNER_TEMP/cloud.yaml"
          yc compute instance create --name "$name" --folder-id "$folder" --zone "$zone" --platform standard-v3 --cores 2 --memory 1GB --core-fraction 20 --create-boot-disk image-folder-id=standard-images,image-family=ubuntu-2404-lts-oslogin,size=10,type=network-hdd --network-interface subnet-id="$subnet",nat-ip-version=ipv4 --metadata-from-file user-data="$RUNNER_TEMP/cloud.yaml" --metadata serial-port-enable=1 >/dev/null
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "folder=$folder" >> "$GITHUB_OUTPUT"

      - name: Read result
        shell: bash
        env:
          VM_NAME: ${{ steps.vm.outputs.name }}
          FOLDER_ID: ${{ steps.vm.outputs.folder }}
        run: |
          set -euo pipefail
          for n in $(seq 1 120); do
            yc compute instance get-serial-port-output --name "$VM_NAME" --folder-id "$FOLDER_ID" > "$RUNNER_TEMP/s" 2>/dev/null || true
            if grep -q '===TGWS_PROBE_END===' "$RUNNER_TEMP/s"; then
              sed -n '/===TGWS_PROBE_BEGIN===/,/===TGWS_PROBE_END===/p' "$RUNNER_TEMP/s"
              grep -q 'TGWS_CHECK_RC=0' "$RUNNER_TEMP/s"
              exit $?
            fi
            sleep 5
          done
          echo TGWS_DEFAULT_CF_GATE=TIMEOUT
          exit 1

      - name: Destroy disposable VM
        if: always()
        shell: bash
        env:
          VM_NAME: ${{ steps.vm.outputs.name }}
          FOLDER_ID: ${{ steps.vm.outputs.folder }}
        run: |
          set +e
          [ -n "$VM_NAME" ] && yc compute instance delete --name "$VM_NAME" --folder-id "$FOLDER_ID" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/key.json"
