name: Patch V3 acceptance branch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-v3-acceptance-branch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3-acceptance-backend
          fetch-depth: 0
      - name: Patch exact stale assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-mcp-test.yml')
          s=p.read_text()
          old="assert canonical.get('backend') == 'google_drive_apps_script_bridge', archive"
          new="assert canonical.get('backend') == 'google_drive_apps_script_bridge_v3', archive"
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old,new))
          PY
          git rm -f .github/workflows/fix-v3-acceptance-once.yml || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/deploy-mcp-test.yml
          git diff --check
          git commit -m 'Fix canonical V3 backend acceptance assertion'
          git push origin HEAD:fix/v3-acceptance-backend
