name: Retire Marketplaces Drive Bridge v1 Lockbox credential

on:
  push:
    branches:
      - fix/marketplaces-bridge-v3-canonical
    paths:
      - '.github/workflows/marketplaces-retire-drive-bridge-v1-secret.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplaces-retire-drive-bridge-v1-secret
  cancel-in-progress: false

env:
  CLOUD_ID: b1gi4pr9msenirafh2c7
  FOLDER_NAME: marketplaces-mcp-test
  LOCKBOX_NAME: marketplaces-mcp-api-credentials
  CONTAINER_NAME: marketplaces-mcp-test
  ROOT_ID: 1UVKUcFfDhCDk6nMHX1mWg9cRL05DT-OJ
  BRIDGE_URL: https://script.google.com/macros/s/AKfycbzgFDAQY4rcsblKhiAONfOI6315k8W3vwbSIEsczE3ycQtnJ8ctcVKjhzjgdTgfy0cvIA/exec

jobs:
  retire-v1-key:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 5 \
            https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate and resolve resources
        id: resolve
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/yc-key.json"
          umask 077
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY"
          DEPLOYER_ID="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY")"
          test -n "$DEPLOYER_ID"
          yc config profile create marketplaces-retire-v1 >/dev/null 2>&1 || true
          yc config set service-account-key "$KEY"
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r --arg n "$FOLDER_NAME" '.[]|select(.name==$n)|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r --arg n "$LOCKBOX_NAME" '.[]|select(.name==$n)|.id'|head -1)"
          CONTAINER_ID="$(yc serverless container list --folder-id "$FOLDER_ID" --format json | jq -r --arg n "$CONTAINER_NAME" '.[]|select(.name==$n)|.id'|head -1)"
          test -n "$SECRET_ID"; test -n "$CONTAINER_ID"
          yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions-before.json"
          BASE_VERSION="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys//[])|index("google_drive_bridge_secret")!=null)|select((.payload_entry_keys//[])|index("mcp_bearer_token")!=null)|select((.payload_entry_keys//[])|index("gdrive_bridge_v1_secret")!=null)]|sort_by(.created_at)|last|.id//empty' "$RUNNER_TEMP/versions-before.json")"
          echo "folder_id=$FOLDER_ID" >> "$GITHUB_OUTPUT"
          echo "secret_id=$SECRET_ID" >> "$GITHUB_OUTPUT"
          echo "container_id=$CONTAINER_ID" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "deployer_id=$DEPLOYER_ID" >> "$GITHUB_OUTPUT"
          if [[ -z "$BASE_VERSION" ]]; then
            echo 'v1_present=false' >> "$GITHUB_OUTPUT"
            echo 'MARKETPLACES_V1_LOCKBOX_ALREADY_ABSENT=PASS'
          else
            echo 'v1_present=true' >> "$GITHUB_OUTPUT"
            echo "BASE_VERSION=$BASE_VERSION"
          fi

      - name: Assert live runtime is already V3-only
        if: steps.resolve.outputs.v1_present == 'true'
        shell: bash
        env:
          CONTAINER_ID: ${{ steps.resolve.outputs.container_id }}
        run: |
          set -euo pipefail
          yc serverless container revision list --container-id "$CONTAINER_ID" --format json > "$RUNNER_TEMP/revisions.json"
          REVISION_ID="$(jq -r '[.[]|select((.status//"")=="ACTIVE")]|sort_by(.created_at)|last|.id//empty' "$RUNNER_TEMP/revisions.json")"
          test -n "$REVISION_ID"
          yc serverless container revision get "$REVISION_ID" --format json > "$RUNNER_TEMP/revision.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'revision.json').read_text())
          env=(d.get('image') or {}).get('environment') or {}
          blob=json.dumps(d)
          assert env.get('MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_URL') == os.environ['BRIDGE_URL']
          assert env.get('MARKETPLACE_MCP_ARCHIVE_DRIVE_ROOT_ID') == os.environ['ROOT_ID']
          assert 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_SECRET' in blob
          assert 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_V1_' not in blob
          assert str(env.get('MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_PROTOCOL') or '').lower() in ('','v3','3')
          print('PRECONDITION_RUNTIME_V3_ONLY=PASS')
          PY

      - name: Verify current V3 health before changing Lockbox
        if: steps.resolve.outputs.v1_present == 'true'
        shell: bash
        env:
          SECRET_ID: ${{ steps.resolve.outputs.secret_id }}
          BASE_VERSION: ${{ steps.resolve.outputs.base_version }}
        run: |
          set -euo pipefail
          yc lockbox payload get --id "$SECRET_ID" --version-id "$BASE_VERSION" --format json --no-user-output > "$RUNNER_TEMP/base-payload.json"
          BRIDGE_SECRET="$(jq -r '.entries[]|select(.key=="google_drive_bridge_secret")|.text_value//empty' "$RUNNER_TEMP/base-payload.json")"
          test -n "$BRIDGE_SECRET"
          echo "::add-mask::$BRIDGE_SECRET"
          export BRIDGE_SECRET
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          body=json.dumps({'secret':os.environ['BRIDGE_SECRET'],'action':'health'}).encode()
          for attempt in range(1,4):
              try:
                  req=urllib.request.Request(os.environ['BRIDGE_URL'],data=body,headers={'Content-Type':'application/json','Accept':'application/json'},method='POST')
                  with urllib.request.urlopen(req,timeout=60) as r: data=json.loads(r.read().decode())
                  assert data.get('ok') is True, data
                  assert int(data.get('version') or 0) == 3, data
                  assert data.get('root_id') == os.environ['ROOT_ID'], data
                  print('PRECONDITION_V3_HEALTH=PASS')
                  break
              except urllib.error.HTTPError as exc:
                  if attempt < 3 and (exc.code in (404,408,425,429) or 500 <= exc.code < 600):
                      time.sleep(0.75*attempt); continue
                  raise
          else:
              raise RuntimeError('V3 health did not pass')
          PY

      - name: Grant temporary folder admin for Lockbox version write
        if: steps.resolve.outputs.v1_present == 'true'
        shell: bash
        env:
          FOLDER_ID: ${{ steps.resolve.outputs.folder_id }}
          DEPLOYER_ID: ${{ steps.resolve.outputs.deployer_id }}
        run: |
          set -euo pipefail
          yc resource-manager folder add-access-binding "$FOLDER_ID" --role admin --service-account-id "$DEPLOYER_ID"
          sleep 15

      - name: Create V1-free Lockbox version
        if: steps.resolve.outputs.v1_present == 'true'
        id: newversion
        shell: bash
        env:
          SECRET_ID: ${{ steps.resolve.outputs.secret_id }}
          BASE_VERSION: ${{ steps.resolve.outputs.base_version }}
        run: |
          set -euo pipefail
          printf '%s\n' '[{"key":"gdrive_bridge_v1_secret"}]' > "$RUNNER_TEMP/remove-v1.json"
          yc lockbox secret add-version --id "$SECRET_ID" --base-version-id "$BASE_VERSION" \
            --description 'Marketplaces: retire Shared Bridge v1 credential; Bridge v3 canonical' \
            --payload - --format json --no-user-output \
            < "$RUNNER_TEMP/remove-v1.json" > "$RUNNER_TEMP/new-version.json"
          NEW_VERSION="$(jq -r '.id//.response.id//empty' "$RUNNER_TEMP/new-version.json")"
          test -n "$NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "NEW_V1_FREE_VERSION=$NEW_VERSION"

      - name: Verify V1-free version preserved every other key
        if: steps.resolve.outputs.v1_present == 'true'
        shell: bash
        env:
          SECRET_ID: ${{ steps.resolve.outputs.secret_id }}
          BASE_VERSION: ${{ steps.resolve.outputs.base_version }}
          NEW_VERSION: ${{ steps.newversion.outputs.new_version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions-after.json"
            STATUS="$(jq -r --arg id "$NEW_VERSION" '.[]|select(.id==$id)|.status//empty' "$RUNNER_TEMP/versions-after.json")"
            [[ "$STATUS" == ACTIVE ]] && break
            sleep 2
          done
          [[ "$STATUS" == ACTIVE ]]
          jq -c --arg id "$BASE_VERSION" '.[]|select(.id==$id)|(.payload_entry_keys//[])|sort' "$RUNNER_TEMP/versions-before.json" > "$RUNNER_TEMP/base-keys.json"
          jq -c --arg id "$NEW_VERSION" '.[]|select(.id==$id)|(.payload_entry_keys//[])|sort' "$RUNNER_TEMP/versions-after.json" > "$RUNNER_TEMP/new-keys.json"
          jq -c 'map(select(.!="gdrive_bridge_v1_secret"))|sort' "$RUNNER_TEMP/base-keys.json" > "$RUNNER_TEMP/expected-keys.json"
          diff -u "$RUNNER_TEMP/expected-keys.json" "$RUNNER_TEMP/new-keys.json"
          jq -e 'index("google_drive_bridge_secret")!=null' "$RUNNER_TEMP/new-keys.json" >/dev/null
          jq -e 'index("mcp_bearer_token")!=null' "$RUNNER_TEMP/new-keys.json" >/dev/null
          jq -e 'index("gdrive_bridge_v1_secret")==null' "$RUNNER_TEMP/new-keys.json" >/dev/null
          echo 'MARKETPLACES_V1_KEY_REMOVED_FROM_NEW_LOCKBOX_VERSION=PASS'
          echo "OLD_V1_VERSION=$BASE_VERSION"
          echo "NEW_V3_ONLY_VERSION=$NEW_VERSION"

      - name: Revoke temporary folder admin
        if: always() && steps.resolve.outputs.v1_present == 'true'
        shell: bash
        env:
          FOLDER_ID: ${{ steps.resolve.outputs.folder_id }}
          DEPLOYER_ID: ${{ steps.resolve.outputs.deployer_id }}
        run: |
          yc resource-manager folder remove-access-binding "$FOLDER_ID" --role admin --service-account-id "$DEPLOYER_ID" || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/yc" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/yc-key.json" \
            "$RUNNER_TEMP/versions-before.json" "$RUNNER_TEMP/versions-after.json" \
            "$RUNNER_TEMP/revisions.json" "$RUNNER_TEMP/revision.json" \
            "$RUNNER_TEMP/base-payload.json" "$RUNNER_TEMP/remove-v1.json" \
            "$RUNNER_TEMP/new-version.json" "$RUNNER_TEMP/base-keys.json" \
            "$RUNNER_TEMP/new-keys.json" "$RUNNER_TEMP/expected-keys.json"
