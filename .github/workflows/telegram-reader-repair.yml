name: Repair Telegram Reader Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-reader-repair || true
          yc config set service-account-key "$key"

      - name: Install repaired setup launcher
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/repair.sh" <<'SH'
          #!/bin/bash
          set -euo pipefail
          exec > >(tee -a /var/log/telegram-reader-repair.log /dev/ttyS0) 2>&1
          for i in $(seq 1 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker info >/dev/null
          token=$(curl -sf -H Metadata-Flavor:Google 169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token | jq -r .access_token)
          echo "$token" | docker login --username iam --password-stdin cr.yandex >/dev/null
          image='cr.yandex/crphagvid8e8g5pp4fpe/telegram-news-reader:900cae982b7678fdd1c53a7b613895613544babe'
          docker pull "$image"
          rm -f /state/setup.complete
          docker rm -f telegram-reader telegram-reader-setup >/dev/null 2>&1 || true
          docker run -d --name telegram-reader-setup --restart unless-stopped --network host \
            -e SETUP_TOKEN_SHA256='b33311a41482a4a1ccd84a293fdfc1c3097306249147e84f409920b915f07c2f' \
            -e TELEGRAM_CREDENTIALS_SECRET_ID='e6qgrhklnqgnml4lgn5u' \
            -e TELEGRAM_SESSION_PATH=/state/telegram_news \
            -e TELEGRAM_WHITELIST_PATH=/state/allowed_chats.yaml \
            -e SETUP_COMPLETE_MARKER=/state/setup.complete \
            -e TELEGRAM_WS_RELAY_URL='telegram-reader-relay.alexpmtk.workers.dev' \
            -e TELEGRAM_WS_RELAY_LOCAL_PORT='18888' \
            -v /state:/state "$image" uvicorn app.setup_service:app --host 127.0.0.1 --port 8081 --workers 1
          SH
          yc compute instance add-metadata telegram-news-reader --folder-id b1gk4p83brasi8g811jv --metadata-from-file startup-script="$RUNNER_TEMP/repair.sh"
          yc compute instance restart telegram-news-reader --folder-id b1gk4p83brasi8g811jv

      - name: Verify setup endpoint
        shell: bash
        run: |
          set -euo pipefail
          url='https://111-88-248-156.sslip.io/setup/healthz'
          for i in $(seq 1 60); do
            body=$(curl -fsS --max-time 10 "$url" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q 'setup_required'; then
              echo 'REPAIR_SETUP_READY=PASS'
              exit 0
            fi
            sleep 5
          done
          echo 'Setup endpoint did not recover' >&2
          exit 1

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/repair.sh"
