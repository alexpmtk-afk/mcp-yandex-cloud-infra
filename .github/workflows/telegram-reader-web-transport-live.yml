name: Telegram Reader Official Web Transport Live
on:
  push:
    branches: [diagnostic/telegram-mtproxy-faketls443]
    paths: [".github/workflows/telegram-reader-web-transport-live.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - name: Install and authenticate YC
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/a.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/a.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"; echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"; chmod 600 "$RUNNER_TEMP/key.json"
          "$RUNNER_TEMP/yc/yc" config profile create tg-web-live || true
          "$RUNNER_TEMP/yc/yc" config set service-account-key "$RUNNER_TEMP/key.json"
      - name: Create disposable Yandex VM
        id: vm
        shell: bash
        run: |
          set -euo pipefail
          folder='b1gk4p83brasi8g811jv'
          prod="$(yc compute instance get --name telegram-news-reader --folder-id "$folder" --full --format json)"
          zone="$(echo "$prod" | jq -r .zone_id)"; subnet="$(echo "$prod" | jq -r '.network_interfaces[0].subnet_id')"; name="tg-web-live-${GITHUB_RUN_ID}"
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import socket,ssl,time,urllib.request,urllib.error
          hosts=['pluto.web.telegram.org','venus.web.telegram.org','aurora.web.telegram.org','vesta.web.telegram.org','flora.web.telegram.org']
          any_tls=False
          for i,h in enumerate(hosts,1):
            try:
              ips=sorted({x[4][0] for x in socket.getaddrinfo(h,443,socket.AF_UNSPEC,socket.SOCK_STREAM)})
              print(f'DC{i}_DNS=PASS host={h} ips={",".join(ips[:4])}',flush=True)
              t=time.monotonic(); s=socket.create_connection((h,443),5); print(f'DC{i}_TCP=PASS latency_ms={int((time.monotonic()-t)*1000)}',flush=True)
              ctx=ssl.create_default_context(); ss=ctx.wrap_socket(s,server_hostname=h); print(f'DC{i}_TLS=PASS version={ss.version()}',flush=True); ss.close(); any_tls=True
            except Exception as e:
              print(f'DC{i}=FAIL host={h} error={type(e).__name__}',flush=True); continue
            for path in ['/api','/apiw','/apiws']:
              req=urllib.request.Request(f'https://{h}{path}',data=b'',method='POST',headers={'Content-Type':'application/octet-stream','User-Agent':'telegram-reader-probe/1'})
              try:
                r=urllib.request.urlopen(req,timeout=7); print(f'DC{i}_{path}=HTTP_{r.status}',flush=True)
              except urllib.error.HTTPError as e:
                print(f'DC{i}_{path}=HTTP_{e.code}',flush=True)
              except Exception as e:
                print(f'DC{i}_{path}=FAIL_{type(e).__name__}',flush=True)
          print('TELEGRAM_WEB_TLS_GATE=PASS' if any_tls else 'TELEGRAM_WEB_TLS_GATE=FAIL',flush=True)
          raise SystemExit(0 if any_tls else 1)
          PY
          sed 's/^/      /' "$RUNNER_TEMP/probe.py" > "$RUNNER_TEMP/pi"
          { echo '#cloud-config'; echo 'write_files:'; echo '  - path: /opt/probe.py'; echo "    permissions: '0644'"; echo '    content: |'; cat "$RUNNER_TEMP/pi"; echo 'runcmd:'; echo '  - [bash, -lc, "python3 /opt/probe.py >/tmp/result 2>&1; rc=$?; echo ===WEB_BEGIN=== >/dev/ttyS0; cat /tmp/result >/dev/ttyS0; echo ===WEB_END=== >/dev/ttyS0; exit $rc"]'; } > "$RUNNER_TEMP/cloud.yaml"
          yc compute instance create --name "$name" --folder-id "$folder" --zone "$zone" --platform standard-v3 --cores 2 --memory 1GB --core-fraction 20 --create-boot-disk image-folder-id=standard-images,image-family=ubuntu-2404-lts-oslogin,size=10,type=network-hdd --network-interface subnet-id="$subnet",nat-ip-version=ipv4 --metadata-from-file user-data="$RUNNER_TEMP/cloud.yaml" --metadata serial-port-enable=1 >/dev/null
          echo "name=$name" >> "$GITHUB_OUTPUT"; echo "folder=$folder" >> "$GITHUB_OUTPUT"
      - name: Read result
        env:
          VM_NAME: ${{ steps.vm.outputs.name }}
          FOLDER_ID: ${{ steps.vm.outputs.folder }}
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 72); do
            yc compute instance get-serial-port-output --name "$VM_NAME" --folder-id "$FOLDER_ID" > "$RUNNER_TEMP/s" 2>/dev/null || true
            if grep -q '===WEB_END===' "$RUNNER_TEMP/s"; then sed -n '/===WEB_BEGIN===/,/===WEB_END===/p' "$RUNNER_TEMP/s"; grep -q 'TELEGRAM_WEB_TLS_GATE=PASS' "$RUNNER_TEMP/s"; exit $?; fi
            sleep 5
          done
          exit 1
      - name: Destroy disposable VM
        if: always()
        env:
          VM_NAME: ${{ steps.vm.outputs.name }}
          FOLDER_ID: ${{ steps.vm.outputs.folder }}
        shell: bash
        run: |
          set +e
          [ -n "$VM_NAME" ] && yc compute instance delete --name "$VM_NAME" --folder-id "$FOLDER_ID" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/key.json"
