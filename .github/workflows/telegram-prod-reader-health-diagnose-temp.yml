name: Telegram Prod Reader Health Diagnose Temp

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-prod-reader-health-diagnose-temp.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create tg-prod-health-diag || true
          yc config profile activate tg-prod-health-diag
          yc config set service-account-key "$key"
          yc config set folder-id b1gk4p83brasi8g811jv

      - name: Diagnose authenticated health and unauthenticated boundary
        shell: bash
        run: |
          set -u
          url="$(yc serverless container get telegram-reader-serverless --folder-id b1gk4p83brasi8g811jv --format json | jq -r '.url // empty')"
          echo "URL_PRESENT=$([ -n "$url" ] && echo yes || echo no)"
          test -n "$url" || exit 1
          url="${url%/}"
          token="$(yc iam create-token)"
          passed=0
          for attempt in $(seq 1 12); do
            rm -f "$RUNNER_TEMP/health.json"
            code="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/health.json" -w '%{http_code}' -H "Authorization: Bearer $token" "$url/health" || echo CURLFAIL)"
            echo "HEALTH_ATTEMPT_${attempt}_CODE=$code"
            if [ "$code" = 200 ]; then
              jq -c '{status,telegram_connected,telegram_authorized,allowed_chats,media_storage}' "$RUNNER_TEMP/health.json" 2>/dev/null || echo HEALTH_BODY_NOT_JSON
              if jq -e '.status=="ok" and .telegram_authorized==true and .allowed_chats==9 and .media_storage=="enabled"' "$RUNNER_TEMP/health.json" >/dev/null 2>&1; then
                passed=1
                break
              fi
            else
              head -c 300 "$RUNNER_TEMP/health.json" 2>/dev/null | tr '\n' ' ' || true
              echo
            fi
            sleep 5
          done
          unauth="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$url/internal/chats" || echo CURLFAIL)"
          echo "UNAUTH_INTERNAL_CODE=$unauth"
          echo "HEALTH_EVENTUAL_PASS=$passed"
          if [ "$passed" -eq 1 ] && { [ "$unauth" = 401 ] || [ "$unauth" = 403 ]; }; then
            echo PROD_READER_HEALTH_DIAG_PASS
            exit 0
          fi
          echo PROD_READER_HEALTH_DIAG_FAIL
          exit 1

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/health.json"
