name: Telegram Session To Lockbox

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-session-to-lockbox.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-session-to-lockbox
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create tg-session-lockbox || true
          yc config profile activate tg-session-lockbox
          yc config set service-account-key "$key"
          yc config set folder-id b1gk4p83brasi8g811jv

      - name: Temporarily grant Lockbox writer to VM service account
        shell: bash
        run: |
          set -euo pipefail
          yc resource-manager folder add-access-binding b1gk4p83brasi8g811jv \
            --role lockbox.admin \
            --service-account-id ajeaad0m00gncv22tagf >/dev/null
          echo LOCKBOX_TEMP_ROLE_PASS

      - name: Start donor VM and prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          folder="b1gk4p83brasi8g811jv"
          status="$(yc compute instance get telegram-news-reader --folder-id "$folder" --format json | jq -r '.status')"
          if [ "$status" != "RUNNING" ]; then yc compute instance start telegram-news-reader --folder-id "$folder" >/dev/null; fi
          for _ in $(seq 1 30); do
            status="$(yc compute instance get telegram-news-reader --folder-id "$folder" --format json | jq -r '.status')"
            [ "$status" = "RUNNING" ] && break
            sleep 5
          done
          [ "$status" = "RUNNING" ]

          runner_ip="$(curl -fsS https://api.ipify.org)"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/tgkey"
          old_keys="$(yc compute instance get telegram-news-reader --folder-id "$folder" --format json | jq -r '.metadata["ssh-keys"] // ""')"
          printf '%s' "$old_keys" > "$RUNNER_TEMP/oldkeys"
          { printf '%s\n' "$old_keys"; printf 'ubuntu:'; cat "$RUNNER_TEMP/tgkey.pub"; } > "$RUNNER_TEMP/newkeys"
          yc compute instance add-metadata telegram-news-reader --folder-id "$folder" --metadata-from-file ssh-keys="$RUNNER_TEMP/newkeys" >/dev/null
          yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id "$folder" \
            --add-rule "description=github-tg-session-lockbox,direction=ingress,port=22,protocol=tcp,v4-cidrs=$runner_ip/32" >/dev/null

          ssh_opts=(-o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -i "$RUNNER_TEMP/tgkey")
          for attempt in $(seq 1 18); do
            if ssh "${ssh_opts[@]}" ubuntu@111.88.248.156 true >/dev/null 2>&1; then
              echo SSH_READY_PASS
              exit 0
            fi
            sleep 10
          done
          exit 255

      - name: Create Lockbox secret entirely inside donor VM
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -i "$RUNNER_TEMP/tgkey")
          ssh "${ssh_opts[@]}" ubuntu@111.88.248.156 'bash -s' <<'REMOTE'
          set -euo pipefail
          mkdir -p /tmp/yc-lockbox
          wget -q -O /tmp/yc-lockbox/yc.tgz https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf /tmp/yc-lockbox/yc.tgz -C /tmp/yc-lockbox
          YC=/tmp/yc-lockbox/yc
          "$YC" config profile create vm-lockbox >/dev/null 2>&1 || true
          "$YC" config profile activate vm-lockbox >/dev/null
          "$YC" config set instance-service-account true >/dev/null
          "$YC" config set folder-id b1gk4p83brasi8g811jv >/dev/null

          for _ in $(seq 1 24); do
            if sudo docker ps --format '{{.Names}}' | grep -qx telegram-reader; then break; fi
            sleep 5
          done
          sudo docker ps --format '{{.Names}}' | grep -qx telegram-reader

          payload=/tmp/telegram-reader-lockbox-payload.json
          sudo docker exec telegram-reader python -c '
          import json, os, secrets
          from telethon.sessions import StringSession
          from app.runtime import build_runtime
          _,_,reader,_=build_runtime()
          vals={
            "TELEGRAM_API_ID":os.environ.get("TELEGRAM_API_ID",""),
            "TELEGRAM_API_HASH":os.environ.get("TELEGRAM_API_HASH",""),
            "TELEGRAM_WS_RELAY_URL":os.environ.get("TELEGRAM_WS_RELAY_URL",""),
            "TELEGRAM_SESSION_STRING":StringSession.save(reader.client.session),
            "READER_API_TOKEN":secrets.token_urlsafe(36),
          }
          assert all(vals.values())
          print(json.dumps([{"key":k,"text_value":v} for k,v in vals.items()]))
          ' > "$payload"
          chmod 600 "$payload"

          name=telegram-reader-serverless-runtime
          secret_id="$($YC lockbox secret list --format json | python3 -c 'import json,sys; a=json.load(sys.stdin); print(next((x["id"] for x in a if x.get("name")=="telegram-reader-serverless-runtime"),""))')"
          if [ -z "$secret_id" ]; then
            "$YC" lockbox secret create --name "$name" --description 'Telegram Reader serverless runtime secrets' --payload - --format json < "$payload" > /tmp/lockbox-meta.json
            secret_id="$(python3 -c 'import json; print(json.load(open("/tmp/lockbox-meta.json"))["id"])')"
          else
            "$YC" lockbox secret add-version "$secret_id" --description 'Serverless migration 2026-09-16' --payload - >/dev/null < "$payload"
          fi
          "$YC" lockbox secret add-access-binding "$secret_id" --role lockbox.payloadViewer --service-account-id ajeaad0m00gncv22tagf >/dev/null
          rm -f "$payload" /tmp/lockbox-meta.json
          rm -rf /tmp/yc-lockbox
          echo "LOCKBOX_SECRET_CREATED id=$secret_id"
          REMOTE

      - name: Revoke temporary Lockbox admin role
        if: always()
        shell: bash
        run: |
          set +e
          yc config profile activate tg-session-lockbox >/dev/null 2>&1 || true
          yc resource-manager folder remove-access-binding b1gk4p83brasi8g811jv \
            --role lockbox.admin \
            --service-account-id ajeaad0m00gncv22tagf >/dev/null 2>&1
          echo LOCKBOX_TEMP_ROLE_REMOVED

      - name: Cleanup donor access and stop VM
        if: always()
        shell: bash
        run: |
          set +e
          yc config profile activate tg-session-lockbox >/dev/null 2>&1 || true
          folder="b1gk4p83brasi8g811jv"
          ids=$(yc vpc security-group get enpocnvnpdu2goj9nkjn --folder-id "$folder" --format json 2>/dev/null | jq -r '.rules[] | select(.description=="github-tg-session-lockbox") | .id')
          for id in $ids; do yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id "$folder" --delete-rule-id "$id" >/dev/null; done
          if [ -f "$RUNNER_TEMP/oldkeys" ]; then
            yc compute instance add-metadata telegram-news-reader --folder-id "$folder" --metadata-from-file ssh-keys="$RUNNER_TEMP/oldkeys" >/dev/null
          fi
          yc compute instance stop telegram-news-reader --folder-id "$folder" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/tgkey" "$RUNNER_TEMP/tgkey.pub" "$RUNNER_TEMP/oldkeys" "$RUNNER_TEMP/newkeys"
          echo DONOR_CLEANUP_DONE
