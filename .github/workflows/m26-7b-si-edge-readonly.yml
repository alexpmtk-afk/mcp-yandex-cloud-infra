name: M26.7b Si Edge Readonly Proof

on:
  push:
    branches: [main]
    paths:
      - "control/run-m26-7b-si-edge-readonly.txt"

permissions:
  contents: read
  id-token: write

env:
  TF_DIR: terraform/birzha_test
  DEPLOYER_SERVICE_ACCOUNT_ID: ajecdjjrkdo1t3itpl9k
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/mcp-yandex-cloud-infra@1349853397:environment:test

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Mint Yandex token
        shell: bash
        run: |
          set -euo pipefail
          A="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          S='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && S='&'
          R="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${S}audience=${A}")"
          J="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$R")"
          echo "::add-mask::$J"
          X="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${DEPLOYER_SERVICE_ACCOUNT_ID}" --data-urlencode "subject_token=${J}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          T="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$X")"
          test -n "$T"; echo "::add-mask::$T"; umask 077; printf '%s' "$T" > "$RUNNER_TEMP/token"
      - name: Resolve YDB
        shell: bash
        env:
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" init -reconfigure -input=false -lockfile=readonly \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" \
            -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY" >/dev/null
          terraform -chdir="$TF_DIR" output -raw ydb_connection_string > "$RUNNER_TEMP/ydb"
      - name: Prove Si edge rows read only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet ydb
          python - <<'PY'
          import json, os, ydb
          from pathlib import Path
          token=(Path(os.environ['RUNNER_TEMP'])/'token').read_text(); ep=(Path(os.environ['RUNNER_TEMP'])/'ydb').read_text().strip()
          d=ydb.Driver(connection_string=ep, credentials=ydb.AccessTokenCredentials(token)); d.wait(timeout=10, fail_fast=True); p=ydb.QuerySessionPool(d)
          def rows(x):
              out=[]
              for rs in x or []: out += list(getattr(rs,'rows',[]) or [])
              return out
          def val(r,k):
              try: return r[k]
              except Exception: return getattr(r,k,None)
          candles=rows(p.execute_with_retries("SELECT secid,timeframe,begin,end_time,payload_json,source FROM `historical_candles` WHERE secid='SiU6' AND timeframe='D1' AND begin>='2026-09-15' AND begin<'2026-09-16' ORDER BY begin;"))
          sessions=rows(p.execute_with_retries("SELECT symbol,secid,trade_date FROM `historical_candles_sessions` WHERE symbol='SI' AND trade_date='2026-09-15' ORDER BY secid;"))
          vr=rows(p.execute_with_retries("SELECT symbol,timeframe,from_date,till_date FROM `historical_candles_verified_ranges` WHERE symbol='SI' AND timeframe='D1' AND from_date<='2026-09-15' AND till_date>='2026-09-15' ORDER BY from_date,till_date;"))
          svr=rows(p.execute_with_retries("SELECT symbol,from_date,till_date FROM `historical_candles_session_verified_ranges` WHERE symbol='SI' AND from_date<='2026-09-15' AND till_date>='2026-09-15' ORDER BY from_date,till_date;"))
          compact=[]
          for r in candles:
              payload=json.loads(str(val(r,'payload_json') or '{}')); c=payload.get('candle') or {}
              compact.append({'secid':val(r,'secid'),'timeframe':val(r,'timeframe'),'begin':val(r,'begin'),'end':val(r,'end_time'),'source':val(r,'source'),'open':c.get('open'),'high':c.get('high'),'low':c.get('low'),'close':c.get('close'),'volume':c.get('volume'),'value':c.get('value')})
          print('SI_EDGE_CANDLES='+json.dumps(compact,ensure_ascii=False,sort_keys=True,default=str))
          print('SI_EDGE_SESSIONS='+json.dumps([{k:val(r,k) for k in ('symbol','secid','trade_date')} for r in sessions],sort_keys=True,default=str))
          print('SI_EDGE_VERIFIED='+json.dumps([{k:val(r,k) for k in ('symbol','timeframe','from_date','till_date')} for r in vr],sort_keys=True,default=str))
          print('SI_EDGE_SESSION_VERIFIED='+json.dumps([{k:val(r,k) for k in ('symbol','from_date','till_date')} for r in svr],sort_keys=True,default=str))
          print('SI_EDGE_CANDLE_COUNT='+str(len(candles))); print('SI_EDGE_SESSION_COUNT='+str(len(sessions))); print('SI_EDGE_READONLY=PASS')
          p.stop(); d.stop(timeout=5)
          PY
      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/token" "$RUNNER_TEMP/ydb"
