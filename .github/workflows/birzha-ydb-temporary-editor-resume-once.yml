name: BIRZHA YDB Runtime Impersonation Resume Once

on:
  push:
    branches: [birzha-ydb-resume-20260914-v2]
    paths: ['.github/workflows/birzha-ydb-temporary-editor-resume-once.yml']

permissions:
  contents: read

jobs:
  resume:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --fail --silent --show-error --retry 5 --retry-all-errors -o "$RUNNER_TEMP/yc.tgz" 'https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate central infra deployer
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          DEPLOYER_ID="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          test "$DEPLOYER_ID" = 'ajecdjjrkdo1t3itpl9k'
          yc config profile create birzha-ydb-resume || true
          yc config set service-account-key "$KEY_FILE"
          echo 'DEPLOYER_AUTH=PASS'

      - name: Verify exact runtime identity and YDB binding
        shell: bash
        env:
          FOLDER_ID: b1g00gqb66tbnfoumnkv
          YDB_ID: etnes7omhgut11oulsd5
          EXPECTED_RUNTIME_ID: ajegcsoflha6k57q640h
        run: |
          set -euo pipefail
          RUNTIME_ID="$(yc iam service-account list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="birzha-mcp-forecast-runtime")|.id' | head -1)"
          test "$RUNTIME_ID" = "$EXPECTED_RUNTIME_ID"
          echo "RUNTIME_ID=$RUNTIME_ID" >> "$GITHUB_ENV"
          yc ydb database get --id "$YDB_ID" --format json > "$RUNNER_TEMP/db-before.json"
          test "$(jq -r '.name' "$RUNNER_TEMP/db-before.json")" = 'birzha-mcp-forecast-state'
          STATUS="$(jq -r '.status' "$RUNNER_TEMP/db-before.json")"
          [[ "$STATUS" == 'STOPPED' || "$STATUS" == 'RUNNING' ]]
          yc ydb database list-access-bindings --id "$YDB_ID" --format json > "$RUNNER_TEMP/db-access.json"
          jq -e --arg sid "$RUNTIME_ID" '.[]? | select(.role_id=="ydb.editor" and (.subject.id // "")==$sid)' "$RUNNER_TEMP/db-access.json" >/dev/null
          echo "YDB_PRECHECK=PASS status=$STATUS runtime_ydb_editor=true"

      - name: Start exact Birzha YDB as runtime service account
        shell: bash
        env:
          YDB_ID: etnes7omhgut11oulsd5
        run: |
          set -euo pipefail
          STATUS="$(yc ydb database get --id "$YDB_ID" --format json | jq -r '.status')"
          if [[ "$STATUS" == 'STOPPED' ]]; then
            yc ydb database start --id "$YDB_ID" --impersonate-service-account-id "$RUNTIME_ID"
          elif [[ "$STATUS" != 'RUNNING' ]]; then
            echo "Unexpected YDB status: $STATUS" >&2
            exit 1
          fi
          for attempt in $(seq 1 30); do
            FINAL="$(yc ydb database get --id "$YDB_ID" --format json | jq -r '.status')"
            echo "YDB_STATUS attempt=$attempt status=$FINAL"
            if [[ "$FINAL" == 'RUNNING' ]]; then
              echo 'YDB_START=PASS status=RUNNING'
              exit 0
            fi
            [[ "$FINAL" == 'STARTING' || "$FINAL" == 'STOPPED' ]]
            sleep 5
          done
          echo 'YDB did not reach RUNNING' >&2
          exit 1

      - name: Verify no IAM bindings were changed
        shell: bash
        env:
          YDB_ID: etnes7omhgut11oulsd5
        run: |
          set -euo pipefail
          yc ydb database list-access-bindings --id "$YDB_ID" --format json > "$RUNNER_TEMP/db-access-final.json"
          jq -e --arg sid "$RUNTIME_ID" '.[]? | select(.role_id=="ydb.editor" and (.subject.id // "")==$sid)' "$RUNNER_TEMP/db-access-final.json" >/dev/null
          FINAL="$(yc ydb database get --id "$YDB_ID" --format json | jq -r '.status')"
          test "$FINAL" = 'RUNNING'
          echo 'YDB_RESUME=PASS iam_mutations=NONE status=RUNNING'

      - name: Cleanup local credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP"/*.json
