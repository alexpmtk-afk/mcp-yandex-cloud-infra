name: BIRZHA YDB Temporary Editor Resume Once

on:
  push:
    branches: [birzha-ydb-resume-20260914-v2]
    paths: ['.github/workflows/birzha-ydb-temporary-editor-resume-once.yml']

permissions:
  contents: read

jobs:
  resume:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --fail --silent --show-error --retry 5 --retry-all-errors -o "$RUNNER_TEMP/yc.tgz" 'https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate central infra deployer
        id: auth
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          DEPLOYER_ID="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          test "$DEPLOYER_ID" = 'ajecdjjrkdo1t3itpl9k'
          echo "DEPLOYER_ID=$DEPLOYER_ID" >> "$GITHUB_ENV"
          yc config profile create birzha-ydb-resume || true
          yc config set service-account-key "$KEY_FILE"
          echo 'DEPLOYER_AUTH=PASS'

      - name: Verify exact database and current binding absence
        id: precheck
        shell: bash
        env:
          YDB_ID: etnes7omhgut11oulsd5
        run: |
          set -euo pipefail
          yc ydb database get --id "$YDB_ID" --format json > "$RUNNER_TEMP/db-before.json"
          test "$(jq -r '.name' "$RUNNER_TEMP/db-before.json")" = 'birzha-mcp-forecast-state'
          STATUS="$(jq -r '.status' "$RUNNER_TEMP/db-before.json")"
          [[ "$STATUS" == 'STOPPED' || "$STATUS" == 'RUNNING' ]]
          yc ydb database list-access-bindings --id "$YDB_ID" --format json > "$RUNNER_TEMP/access-before.json"
          if jq -e --arg sid "$DEPLOYER_ID" '.[]? | select(.role_id=="ydb.editor" and (.subject.id // "")==$sid)' "$RUNNER_TEMP/access-before.json" >/dev/null; then
            echo 'FAIL: deployer already had ydb.editor; refusing temporary-grant workflow' >&2
            exit 1
          fi
          echo "YDB_PRECHECK=PASS status=$STATUS binding_absent=true"

      - name: Add temporary database-scoped ydb.editor
        id: grant
        shell: bash
        env:
          YDB_ID: etnes7omhgut11oulsd5
        run: |
          set -euo pipefail
          yc ydb database add-access-binding --id "$YDB_ID" --role ydb.editor --service-account-id "$DEPLOYER_ID"
          echo 'granted=true' >> "$GITHUB_OUTPUT"
          sleep 20
          yc ydb database list-access-bindings --id "$YDB_ID" --format json > "$RUNNER_TEMP/access-granted.json"
          jq -e --arg sid "$DEPLOYER_ID" '.[]? | select(.role_id=="ydb.editor" and (.subject.id // "")==$sid)' "$RUNNER_TEMP/access-granted.json" >/dev/null
          echo 'TEMP_DATABASE_YDB_EDITOR=GRANTED'

      - name: Start exact Birzha YDB
        shell: bash
        env:
          YDB_ID: etnes7omhgut11oulsd5
        run: |
          set -euo pipefail
          STATUS="$(yc ydb database get --id "$YDB_ID" --format json | jq -r '.status')"
          if [[ "$STATUS" == 'STOPPED' ]]; then
            yc ydb database start --id "$YDB_ID"
          elif [[ "$STATUS" != 'RUNNING' ]]; then
            echo "Unexpected YDB status: $STATUS" >&2
            exit 1
          fi
          FINAL="$(yc ydb database get --id "$YDB_ID" --format json | jq -r '.status')"
          test "$FINAL" = 'RUNNING'
          echo 'YDB_START=PASS status=RUNNING'

      - name: Remove temporary database-scoped ydb.editor
        if: always() && steps.grant.outputs.granted == 'true'
        shell: bash
        env:
          YDB_ID: etnes7omhgut11oulsd5
        run: |
          set -euo pipefail
          yc ydb database remove-access-binding --id "$YDB_ID" --role ydb.editor --service-account-id "$DEPLOYER_ID"
          echo 'TEMP_DATABASE_YDB_EDITOR=REVOKED'

      - name: Verify cleanup and final state
        if: always()
        shell: bash
        env:
          YDB_ID: etnes7omhgut11oulsd5
        run: |
          set -euo pipefail
          yc ydb database list-access-bindings --id "$YDB_ID" --format json > "$RUNNER_TEMP/access-final.json"
          if jq -e --arg sid "$DEPLOYER_ID" '.[]? | select(.role_id=="ydb.editor" and (.subject.id // "")==$sid)' "$RUNNER_TEMP/access-final.json" >/dev/null; then
            echo 'FAIL: temporary ydb.editor still present' >&2
            exit 1
          fi
          FINAL="$(yc ydb database get --id "$YDB_ID" --format json | jq -r '.status')"
          echo "YDB_FINAL_STATUS=$FINAL"
          test "$FINAL" = 'RUNNING'
          echo 'YDB_RESUME_CLEANUP=PASS'

      - name: Cleanup local credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP"/*.json
