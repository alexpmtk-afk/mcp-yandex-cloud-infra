name: Telegram Cost Audit

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-cost-audit.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-news-reader-ssh
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-cost-audit || true
          yc config profile activate telegram-cost-audit
          yc config set service-account-key "$key"
      - name: Audit Yandex Cloud resources
        shell: bash
        run: |
          set +e
          folder="b1gk4p83brasi8g811jv"
          echo '=== FOLDER ==='
          yc resource-manager folder get "$folder"
          echo '=== COMPUTE INSTANCES ==='
          yc compute instance list --folder-id "$folder"
          echo '=== DISKS ==='
          yc compute disk list --folder-id "$folder"
          echo '=== SNAPSHOTS ==='
          yc compute snapshot list --folder-id "$folder"
          echo '=== IMAGES ==='
          yc compute image list --folder-id "$folder"
          echo '=== NETWORKS ==='
          yc vpc network list --folder-id "$folder"
          echo '=== SUBNETS ==='
          yc vpc subnet list --folder-id "$folder"
          echo '=== SECURITY GROUPS ==='
          yc vpc security-group list --folder-id "$folder"
          echo '=== PUBLIC IPS ==='
          yc vpc address list --folder-id "$folder"
          echo '=== NAT GATEWAYS ==='
          yc vpc gateway list --folder-id "$folder"
          echo '=== API GATEWAYS ==='
          yc serverless api-gateway list --folder-id "$folder"
          echo '=== SERVERLESS CONTAINERS ==='
          yc serverless container list --folder-id "$folder"
          echo '=== FUNCTIONS ==='
          yc serverless function list --folder-id "$folder"
          echo '=== TRIGGERS ==='
          yc serverless trigger list --folder-id "$folder"
          echo '=== CONTAINER REGISTRIES ==='
          yc container registry list --folder-id "$folder"
          echo '=== LOCKBOX SECRETS ==='
          yc lockbox secret list --folder-id "$folder"
          echo '=== LOG GROUPS ==='
          yc logging group list --folder-id "$folder"
          echo '=== STORAGE BUCKETS ==='
          yc storage bucket list --folder-id "$folder"
          echo '=== BILLING ACCOUNTS ==='
          yc billing account list
          echo '=== BILLING HELP / AVAILABLE ==='
          yc billing account --help | head -n 80
          exit 0
      - name: Audit runtime writes and services
        shell: bash
        run: |
          set -euo pipefail
          folder="b1gk4p83brasi8g811jv"
          ip="$(curl -fsS https://api.ipify.org)"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/tgkey"
          old_keys="$(yc compute instance get telegram-news-reader --folder-id "$folder" --format json | jq -r '.metadata["ssh-keys"] // ""')"
          printf '%s' "$old_keys" > "$RUNNER_TEMP/oldkeys"
          { printf '%s\n' "$old_keys"; printf 'ubuntu:'; cat "$RUNNER_TEMP/tgkey.pub"; } > "$RUNNER_TEMP/newkeys"
          yc compute instance add-metadata telegram-news-reader --folder-id "$folder" --metadata-from-file ssh-keys="$RUNNER_TEMP/newkeys"
          yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id "$folder" --add-rule "description=github-telegram-cost-audit,direction=ingress,port=22,protocol=tcp,v4-cidrs=$ip/32"
          ssh_opts=(-o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -i "$RUNNER_TEMP/tgkey")
          ready=0
          for attempt in $(seq 1 12); do
            if ssh "${ssh_opts[@]}" ubuntu@111.88.248.156 true >/dev/null 2>&1; then ready=1; break; fi
            sleep 10
          done
          test "$ready" -eq 1
          ssh "${ssh_opts[@]}" ubuntu@111.88.248.156 'set -euo pipefail
            echo "=== UPTIME / LOAD ==="; uptime
            echo "=== DISKS ==="; df -h; findmnt /state || true
            echo "=== STATE USAGE ==="; sudo du -h -d 2 /state 2>/dev/null | sort -h | tail -n 40
            echo "=== RECENT WRITES /STATE 2H ==="; sudo find /state -type f -mmin -120 -printf "%TY-%Tm-%Td %TH:%TM:%TS %s %p\n" 2>/dev/null | sort | tail -n 100
            echo "=== DOCKER PS ==="; sudo docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}"
            echo "=== DOCKER STATS ==="; sudo docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.NetIO}}\t{{.BlockIO}}"
            echo "=== CONTAINER ENV NAMES ONLY ==="; sudo docker inspect telegram-reader --format "{{range .Config.Env}}{{println .}}{{end}}" | sed "s/=.*$/=<redacted>/" | sort
            echo "=== SYSTEMD TIMERS ==="; systemctl list-timers --all --no-pager | head -n 100
            echo "=== CRON ==="; (crontab -l || true); sudo cat /etc/crontab || true
            echo "=== PROCESSES TOP CPU ==="; ps -eo pid,comm,%cpu,%mem --sort=-%cpu | head -n 20
            echo "=== TELEGRAM LOG TAIL ==="; sudo docker logs --since 2h telegram-reader 2>&1 | tail -n 100
          '
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          yc config profile activate telegram-cost-audit >/dev/null 2>&1 || true
          folder="b1gk4p83brasi8g811jv"
          ids=$(yc vpc security-group get enpocnvnpdu2goj9nkjn --folder-id "$folder" --format json | jq -r '.rules[] | select(.description=="github-telegram-cost-audit") | .id')
          for id in $ids; do yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id "$folder" --delete-rule-id "$id"; done
          if [ -f "$RUNNER_TEMP/oldkeys" ]; then yc compute instance add-metadata telegram-news-reader --folder-id "$folder" --metadata-from-file ssh-keys="$RUNNER_TEMP/oldkeys"; fi
          rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/tgkey" "$RUNNER_TEMP/tgkey.pub" "$RUNNER_TEMP/oldkeys" "$RUNNER_TEMP/newkeys"
