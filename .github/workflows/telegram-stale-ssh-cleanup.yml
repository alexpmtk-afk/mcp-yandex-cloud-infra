name: Telegram Stale SSH Cleanup

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-stale-ssh-cleanup.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 8
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-ssh-cleanup || true
          yc config profile activate telegram-ssh-cleanup
          yc config set service-account-key "$key"

      - name: Remove stale debug-only SSH ingress rules
        shell: bash
        run: |
          set -euo pipefail
          folder='b1gk4p83brasi8g811jv'
          sg='enpocnvnpdu2goj9nkjn'
          mapfile -t ids < <(yc vpc security-group get "$sg" --folder-id "$folder" --format json | jq -r '.rules[] | select(.direction=="INGRESS" and .protocol_name=="TCP" and (.ports.from_port|tostring)=="22" and ((.description // "") == "ephemeral-runtime-debug" or (.description // "") == "telegram-runtime-debug")) | .id')
          echo "STALE_DEBUG_RULES=${#ids[@]}"
          for id in "${ids[@]}"; do
            yc vpc security-group update-rules "$sg" --folder-id "$folder" --delete-rule-id "$id" >/dev/null
          done
          remain="$(yc vpc security-group get "$sg" --folder-id "$folder" --format json | jq '[.rules[] | select(.direction=="INGRESS" and .protocol_name=="TCP" and (.ports.from_port|tostring)=="22" and ((.description // "") == "ephemeral-runtime-debug" or (.description // "") == "telegram-runtime-debug"))] | length')"
          test "$remain" -eq 0
          echo STALE_DEBUG_SSH_CLEANUP_PASS

      - name: Cleanup local credential file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json"
