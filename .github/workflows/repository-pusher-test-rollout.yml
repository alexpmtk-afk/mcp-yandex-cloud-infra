name: Repository Pusher TEST Rollout

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repository-pusher-test-rollout.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: marketplaces-test-repository-pusher-rollout
  cancel-in-progress: false

jobs:
  bind-probe-dispatch:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 25
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/yc/bin/yc" version

      - name: Authenticate CI service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          CI_SA_ID="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          test -n "$CI_SA_ID"
          echo "CI_SA_ID=$CI_SA_ID" >> "$GITHUB_ENV"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"

      - name: Grant repository-scoped pusher and prove data-plane push
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          REGISTRY_ID="$(timeout 45s yc container registry list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp")|.id'|head -1)"
          test -n "$REGISTRY_ID"
          TARGET_REPO_ID="$(timeout 45s yc container repository list --registry-id "$REGISTRY_ID" --format json | jq -r --arg n "$REGISTRY_ID/marketplaces-mcp" '.[]|select(.name==$n)|.id'|head -1)"
          test -n "$TARGET_REPO_ID"

          timeout 90s yc container repository add-access-binding "$TARGET_REPO_ID" \
            --role container-registry.images.pusher \
            --subject "serviceAccount:$CI_SA_ID"
          echo 'repository_registry_pusher_binding=PASS'
          sleep 20

          IAM_TOKEN="$(yc iam create-token)"
          test -n "$IAM_TOKEN"
          echo "::add-mask::$IAM_TOKEN"
          printf '%s' "$IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
          unset IAM_TOKEN

          PROBE_TAG="repo-scope-probe-${GITHUB_SHA}"
          IMAGE="cr.yandex/${REGISTRY_ID}/marketplaces-mcp:${PROBE_TAG}"
          mkdir -p "$RUNNER_TEMP/registry-probe"
          printf 'FROM scratch\nLABEL purpose="marketplaces-test-repository-pusher-probe"\n' > "$RUNNER_TEMP/registry-probe/Dockerfile"
          docker build --tag "$IMAGE" "$RUNNER_TEMP/registry-probe"
          docker push "$IMAGE"
          echo 'repository_scoped_pusher_docker_push=PASS'

      - name: Dispatch existing TEST deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-mcp-test.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'test_deploy_dispatch=PASS'

      - name: Cleanup ephemeral credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json"
