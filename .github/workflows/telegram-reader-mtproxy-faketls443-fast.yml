name: Telegram Reader Fake-TLS 443 Fast Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/telegram-reader-mtproxy-faketls443-fast.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 12
    steps:
      - name: Select independently alive Fake-TLS 443 proxies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" -q install telethon==1.44.0 python-socks
          cat > "$RUNNER_TEMP/select.py" <<'PY'
          import asyncio,json,socket,urllib.parse,urllib.request,time
          from telethon import TelegramClient,connection
          from telethon.sessions import MemorySession
          URL='https://raw.githubusercontent.com/mcny2809/mtproto-for-telegram/master/all_proxies.txt'
          raw=urllib.request.urlopen(URL,timeout=20).read().decode()
          ps=[]
          for line in raw.splitlines():
              if 'proxy?' not in line: continue
              q=urllib.parse.parse_qs(urllib.parse.urlsplit(line.strip()).query)
              try:
                  h=q['server'][0].rstrip('.'); p=int(q['port'][0]); s=urllib.parse.unquote(q['secret'][0]); bytes.fromhex(s)
                  if p==443 and s.lower().startswith('ee'): ps.append({'host':h,'port':p,'secret':s})
              except: pass
              if len(ps)>=60: break
          print(f'FAKETLS443_SOURCE_CANDIDATES={len(ps)}')
          sem=asyncio.Semaphore(12)
          async def check(i,x):
              async with sem:
                  h,p,s=x['host'],x['port'],x['secret']
                  try:
                      infos=await asyncio.get_running_loop().run_in_executor(None,socket.getaddrinfo,h,p,socket.AF_UNSPEC,socket.SOCK_STREAM)
                      ips=sorted({z[4][0] for z in infos}); print(f'INDEP_{i}_DNS=PASS host={h} ips={",".join(ips[:4])}')
                  except Exception as e: print(f'INDEP_{i}=PROXY_DNS_FAIL error={type(e).__name__}'); return None
                  try:
                      t=time.monotonic(); c=await asyncio.wait_for(asyncio.open_connection(h,p),5); c[1].close(); await c[1].wait_closed(); print(f'INDEP_{i}_TCP=PASS host={h} latency_ms={int((time.monotonic()-t)*1000)}')
                  except Exception as e: print(f'INDEP_{i}=PROXY_DEAD stage=tcp error={type(e).__name__}'); return None
                  cl=TelegramClient(MemorySession(),1,'0'*32,connection=connection.ConnectionTcpMTProxyRandomizedIntermediate,proxy=(h,p,s),connection_retries=1,retry_delay=0,timeout=6)
                  try:
                      t=time.monotonic(); await asyncio.wait_for(cl.connect(),8)
                      if cl.is_connected(): print(f'INDEP_{i}_MTPROXY=PASS host={h} port={p} latency_ms={int((time.monotonic()-t)*1000)}'); return x
                  except Exception as e: print(f'INDEP_{i}=PROXY_DEAD stage=mtproxy error={type(e).__name__}')
                  finally:
                      try: await cl.disconnect()
                      except: pass
                  return None
          async def main():
              rs=await asyncio.gather(*(check(i,x) for i,x in enumerate(ps,1)))
              alive=[x for x in rs if x][:3]; json.dump(alive,open('/tmp/alive.json','w')); print(f'INDEPENDENT_ALIVE={len(alive)}')
              if not alive: raise SystemExit(20)
          asyncio.run(main())
          PY
          "$RUNNER_TEMP/v/bin/python" "$RUNNER_TEMP/select.py"

      - name: Install and authenticate YC
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"; wget -q -O "$RUNNER_TEMP/yc/a.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz; tar -xzf "$RUNNER_TEMP/yc/a.tgz" -C "$RUNNER_TEMP/yc"; chmod +x "$RUNNER_TEMP/yc/yc"; echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"; chmod 600 "$RUNNER_TEMP/key.json"; "$RUNNER_TEMP/yc/yc" config profile create tg-faketls-fast || true; "$RUNNER_TEMP/yc/yc" config set service-account-key "$RUNNER_TEMP/key.json"

      - name: Create disposable Yandex VM
        id: vm
        shell: bash
        run: |
          set -euo pipefail
          folder='b1gk4p83brasi8g811jv'; prod="$(yc compute instance get --name telegram-news-reader --folder-id "$folder" --full --format json)"; zone="$(echo "$prod"|jq -r .zone_id)"; subnet="$(echo "$prod"|jq -r '.network_interfaces[0].subnet_id')"; name="tg-faketls-fast-${GITHUB_RUN_ID}"; b64="$(base64 -w0 /tmp/alive.json)"
          cat > "$RUNNER_TEMP/p.py" <<'PY'
          import asyncio,json,socket,time
          from telethon import TelegramClient,connection
          from telethon.sessions import MemorySession
          xs=json.load(open('/opt/a.json'))
          async def one(i,x):
              h,p,s=x['host'],x['port'],x['secret']
              try: ips=sorted({z[4][0] for z in socket.getaddrinfo(h,p,socket.AF_UNSPEC,socket.SOCK_STREAM)}); print(f'PROXY_{i}_DNS=PASS host={h} ips={",".join(ips[:6])}',flush=True)
              except Exception as e: print(f'PROXY_{i}=PROXY_DNS_FAIL error={type(e).__name__}',flush=True); return False
              t=time.monotonic()
              try: c=socket.create_connection((h,p),5); peer=c.getpeername(); c.close(); print(f'PROXY_{i}_TCP=PASS peer={peer[0]}:{peer[1]} latency_ms={int((time.monotonic()-t)*1000)}',flush=True)
              except Exception as e: print(f'PROXY_{i}=YANDEX_TO_PROXY_TCP_FAIL error={type(e).__name__} latency_ms={int((time.monotonic()-t)*1000)}',flush=True); return False
              cl=TelegramClient(MemorySession(),1,'0'*32,connection=connection.ConnectionTcpMTProxyRandomizedIntermediate,proxy=(h,p,s),connection_retries=1,retry_delay=0,timeout=6)
              print(f'PROXY_{i}_MTPROXY_BEGIN class=ConnectionTcpMTProxyRandomizedIntermediate host={h} port={p} secret_type=fake-tls-ee secret_hex_len={len(s)}',flush=True)
              try:
                  t=time.monotonic(); await asyncio.wait_for(cl.connect(),8)
                  if cl.is_connected(): print(f'PROXY_{i}=MTPROXY_GATE_PASS latency_ms={int((time.monotonic()-t)*1000)}',flush=True); return True
              except ValueError as e: print(f'PROXY_{i}=MTPROXY_SECRET_OR_CODEC_FAIL error={type(e).__name__}',flush=True)
              except Exception as e: print(f'PROXY_{i}=MTPROXY_HANDSHAKE_FAIL error={type(e).__name__} latency_ms={int((time.monotonic()-t)*1000)}',flush=True)
              finally:
                  try: await cl.disconnect()
                  except: pass
              return False
          async def main():
              print(f'YANDEX_CANDIDATES={len(xs)}',flush=True); ok=False
              for i,x in enumerate(xs,1): ok=(await one(i,x)) or ok
              print('MTPROXY_GATE=PASS' if ok else 'MTPROXY_GATE=FAIL',flush=True); return 0 if ok else 1
          raise SystemExit(asyncio.run(main()))
          PY
          sed 's/^/      /' "$RUNNER_TEMP/p.py" > "$RUNNER_TEMP/pi"
          {
            echo '#cloud-config'; echo 'package_update: true'; echo 'packages:'; echo '  - python3-venv'; echo '  - strace'; echo 'write_files:'; echo '  - path: /opt/a.b64'; echo "    permissions: '0600'"; echo '    content: |'; echo "      $b64"; echo '  - path: /opt/p.py'; echo "    permissions: '0644'"; echo '    content: |'; cat "$RUNNER_TEMP/pi"; echo 'runcmd:'; echo '  - [bash, -lc, "base64 -d /opt/a.b64 >/opt/a.json; python3 -m venv /opt/v; /opt/v/bin/pip -q install telethon==1.44.0 python-socks; strace -f -e trace=connect -s 200 -o /tmp/t /opt/v/bin/python /opt/p.py >/tmp/r 2>&1; rc=$?; echo ===FT443_BEGIN=== >/dev/ttyS0; cat /tmp/r >/dev/ttyS0; echo ---STRACE--- >/dev/ttyS0; grep connect\\( /tmp/t | tail -n 80 >/dev/ttyS0 || true; echo ===FT443_END=== >/dev/ttyS0; exit $rc"]'
          } > "$RUNNER_TEMP/cloud.yaml"
          yc compute instance create --name "$name" --folder-id "$folder" --zone "$zone" --platform standard-v3 --cores 2 --memory 1GB --core-fraction 20 --create-boot-disk image-folder-id=standard-images,image-family=ubuntu-2404-lts-oslogin,size=10,type=network-hdd --network-interface subnet-id="$subnet",nat-ip-version=ipv4 --metadata-from-file user-data="$RUNNER_TEMP/cloud.yaml" --metadata serial-port-enable=1 >/dev/null; echo "name=$name" >> "$GITHUB_OUTPUT"; echo "folder=$folder" >> "$GITHUB_OUTPUT"

      - name: Read result
        shell: bash
        env:
          VM_NAME: ${{ steps.vm.outputs.name }}
          FOLDER_ID: ${{ steps.vm.outputs.folder }}
        run: |
          set -euo pipefail
          for n in $(seq 1 72); do yc compute instance get-serial-port-output --name "$VM_NAME" --folder-id "$FOLDER_ID" > "$RUNNER_TEMP/s" 2>/dev/null || true; if grep -q '===FT443_END===' "$RUNNER_TEMP/s"; then sed -n '/===FT443_BEGIN===/,/===FT443_END===/p' "$RUNNER_TEMP/s"; grep -q 'MTPROXY_GATE=PASS' "$RUNNER_TEMP/s"; exit $?; fi; sleep 5; done; echo FT443_GATE=TIMEOUT; exit 1
      - name: Destroy disposable VM
        if: always()
        shell: bash
        env:
          VM_NAME: ${{ steps.vm.outputs.name }}
          FOLDER_ID: ${{ steps.vm.outputs.folder }}
        run: |
          set +e; [ -n "$VM_NAME" ] && yc compute instance delete --name "$VM_NAME" --folder-id "$FOLDER_ID" >/dev/null 2>&1 || true; rm -f "$RUNNER_TEMP/key.json"
