name: Yandex Cloud fast inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yandex-cloud-inventory-fast.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 7
    env:
      YC_CLOUD_ID: b1gi4pr9msenirafh2c7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install YC CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"
      - name: Authenticate
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"
          chmod 600 "$RUNNER_TEMP/key.json"
          yc config profile create fast-inventory || true
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          yc config set cloud-id "$YC_CLOUD_ID"
      - name: Fast inventory
        shell: bash
        run: |
          set +e
          echo '=== CLOUD ==='
          yc resource-manager cloud get "$YC_CLOUD_ID" --format json --no-user-output | jq '{id,name,created_at,organization_id}'
          FOLDERS="$(yc resource-manager folder list --cloud-id "$YC_CLOUD_ID" --format json --no-user-output)"
          echo '=== FOLDERS ==='
          printf '%s\n' "$FOLDERS" | jq '[.[] | {id,name,status,created_at}]'
          printf '%s\n' "$FOLDERS" | jq -r '.[].id' | while read -r FID; do
            FNAME="$(printf '%s\n' "$FOLDERS" | jq -r --arg id "$FID" '.[] | select(.id==$id) | .name')"
            echo "=== FOLDER id=$FID name=$FNAME ==="
            echo '-- SERVERLESS_CONTAINERS --'
            timeout 20s yc serverless container list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,status,created_at,url}]' || true
            echo '-- API_GATEWAYS --'
            timeout 20s yc serverless api-gateway list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,status,created_at,domain}]' || true
            echo '-- REGISTRIES --'
            timeout 20s yc container registry list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,status,created_at}]' || true
            echo '-- OBJECT_STORAGE_BUCKETS --'
            timeout 20s yc storage bucket list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {name,folder_id,created_at,max_size,default_storage_class}]' || true
            echo '-- COMPUTE_INSTANCES --'
            timeout 20s yc compute instance list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,status,created_at,zone_id,platform_id,resources}]' || true
            echo '-- YDB_DATABASES --'
            timeout 20s yc ydb database list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,status,created_at,type}]' || true
            echo '-- VPC_NETWORKS --'
            timeout 20s yc vpc network list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,created_at}]' || true
            echo '-- LOCKBOX_METADATA --'
            timeout 20s yc lockbox secret list --folder-id "$FID" --format json --no-user-output 2>/dev/null | jq '[.[] | {id,name,status,created_at}]' || true
          done
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json"
