name: Marketplaces Semantic Core Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app/**
      - terraform/*.tf
      - terraform/*.tftpl
      - .github/workflows/deploy-mcp-test.yml
      - .github/workflows/marketplaces-semantic-core-acceptance.yml

permissions:
  contents: read
  actions: read

jobs:
  accept:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 35
    steps:
      - name: Wait for successful TEST deploy of this exact commit
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=''
          for attempt in $(seq 1 150); do
            runs="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-mcp-test.yml/runs" \
              -f branch=main -f event=push -f per_page=30)"
            row="$(jq -r --arg sha "$GITHUB_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha)]
              | sort_by(.run_number)
              | last
              | if . == null then "" else (.status + "|" + (.conclusion // "") + "|" + (.html_url // "")) end
            ' <<<"$runs")"
            if [[ -z "$row" ]]; then
              echo "deploy wait $attempt/150: run not created yet"
              sleep 10
              continue
            fi
            IFS='|' read -r status conclusion url <<<"$row"
            echo "deploy wait $attempt/150: status=$status conclusion=${conclusion:-pending} url=$url"
            if [[ "$status" == completed ]]; then
              if [[ "$conclusion" == success ]]; then
                state=success
                break
              fi
              echo "TEST deploy for $GITHUB_SHA completed with conclusion=$conclusion"
              exit 1
            fi
            sleep 10
          done
          test "$state" = success
          echo 'EXACT_COMMIT_TEST_DEPLOY=PASS'

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          ARCHIVE="$RUNNER_TEMP/yc/yc.tgz"
          rm -f "$ARCHIVE"
          ok=0
          for attempt in $(seq 1 8); do
            if timeout 75s wget --continue --timeout=30 --tries=2 --retry-connrefused --output-document="$ARCHIVE" "$URL"; then
              if tar -tzf "$ARCHIVE" >/dev/null 2>&1; then
                ok=1
                break
              fi
              rm -f "$ARCHIVE"
            fi
            sleep 4
          done
          test "$ok" = 1
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate and resolve TEST endpoint
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create semantic-core-acceptance || true
          yc config set service-account-key "$KEY_FILE"
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          VERSION_ID="$(yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output | jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys // [])|index("mcp_bearer_token") != null)]|sort_by(.created_at)|last|.id // empty')"
          DOMAIN="$(yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//.[0].domain//empty')"
          test -n "$SECRET_ID"
          test -n "$VERSION_ID"
          test -n "$DOMAIN"
          yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/sec.json"
          BEARER="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value' "$RUNNER_TEMP/sec.json")"
          test -n "$BEARER"
          echo "::add-mask::$BEARER"
          printf '%s' "$BEARER" > "$RUNNER_TEMP/bearer"
          printf '%s' "https://${DOMAIN}/mcp" > "$RUNNER_TEMP/mcp-url"

      - name: Accept Unified Semantic Core V1 on live TEST MCP
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'httpx>=0.27,<1'
          export MCP_URL="$(cat "$RUNNER_TEMP/mcp-url")"
          export MCP_BEARER="$(cat "$RUNNER_TEMP/bearer")"
          python -u - <<'PY'
          import itertools
          import json
          import os
          import time
          import httpx

          TRANSIENT = {502, 503, 504}

          def unpack(response):
              response.raise_for_status()
              for line in response.text.splitlines():
                  if line.startswith('data:'):
                      return json.loads(line[5:].strip())
              return response.json() if response.text.strip() else None

          headers = {
              'Authorization': 'Bearer ' + os.environ['MCP_BEARER'],
              'Accept': 'application/json, text/event-stream',
              'Content-Type': 'application/json',
          }
          ids = itertools.count(1)
          timeout = httpx.Timeout(connect=10.0, read=45.0, write=30.0, pool=10.0)

          with httpx.Client(timeout=timeout, follow_redirects=True) as client:
              def post(payload):
                  last = None
                  for attempt in range(1, 9):
                      response = client.post(os.environ['MCP_URL'], headers=headers, json=payload)
                      last = response
                      if response.status_code not in TRANSIENT:
                          return response
                      print(f'transient_gateway_status={response.status_code} attempt={attempt}/8', flush=True)
                      time.sleep(3)
                  return last

              response = post({
                  'jsonrpc':'2.0','id':next(ids),'method':'initialize','params':{
                      'protocolVersion':'2025-06-18','capabilities':{},
                      'clientInfo':{'name':'semantic-core-acceptance','version':'1'}
                  }
              })
              init = unpack(response)
              assert init and 'result' in init, init
              session = response.headers.get('mcp-session-id')
              if session:
                  headers['Mcp-Session-Id'] = session
              headers['MCP-Protocol-Version'] = init['result'].get('protocolVersion','2025-06-18')
              note = post({'jsonrpc':'2.0','method':'notifications/initialized'})
              assert note.status_code in (200,202), note.status_code

              def rpc(method, params=None):
                  response = post({'jsonrpc':'2.0','id':next(ids),'method':method,'params':params or {}})
                  data = unpack(response)
                  assert data and 'result' in data, (method, data)
                  return data['result']

              def call(name, args=None):
                  result = rpc('tools/call', {'name':name,'arguments':args or {}})
                  assert not result.get('isError'), (name, result)
                  text = next(x.get('text') for x in result.get('content',[]) if x.get('type') == 'text')
                  return json.loads(text)

              names = {tool['name'] for tool in rpc('tools/list')['tools']}
              required = {
                  'marketplace_semantic_core',
                  'marketplace_data_catalog',
                  'marketplace_metric_route',
                  'marketplace_system_map',
                  'marketplace_query_plan',
                  'marketplace_execution_control',
                  'marketplace_join_control',
              }
              assert required <= names, sorted(required - names)

              summary = call('marketplace_semantic_core', {'section':'summary'})
              assert summary['version'] == 'marketplace_semantic_core.v1', summary
              assert summary['status'] == 'CANONICAL_BRAIN', summary
              assert summary['validated'] is True, summary
              assert summary['runtime_entry'] == 'marketplace_semantic_core', summary
              assert summary['canonical_flow'] == [
                  'UNDERSTAND','RESOLVE','PLAN_SOURCE','CLARIFY','DISPATCH',
                  'EXECUTE','JOIN','CALCULATE_IF_REGISTERED','ANSWER_WITH_PROVENANCE',
              ], summary
              assert summary['safety']['fail_closed'] is True, summary
              assert summary['safety']['silent_source_substitution_forbidden'] is True, summary
              assert summary['safety']['full_coverage_required_for_archive_execution'] is True, summary
              assert summary['safety']['client_authored_formulas_forbidden'] is True, summary
              assert summary['counts']['calculation_contracts'] == 0, summary
              assert summary['counts']['known_source_gaps'] > 0, summary

              versions = call('marketplace_semantic_core', {'section':'versions'})
              assert versions['semantic_core'] == 'marketplace_semantic_core.v1', versions
              assert versions['source_plan'] == 'marketplace_execution_plan.v2', versions
              assert versions['execution_controller'] == 'marketplace_execution_controller.v1', versions
              assert versions['join_controller'] == 'marketplace_join_controller.v1', versions
              assert versions['calculation_registry'] == 'marketplace_calculation_registry.v1', versions
              assert versions['calculation_contract'] == 'marketplace_calculation_contract.v1', versions

              calculation = call('marketplace_semantic_core', {'section':'calculation'})
              assert calculation['registry_version'] == 'marketplace_calculation_registry.v1', calculation
              assert calculation['contract_version'] == 'marketplace_calculation_contract.v1', calculation
              assert calculation['registered_calculation_ids'] == [], calculation
              assert calculation['registered_calculation_count'] == 0, calculation
              assert calculation['arithmetic_enabled'] is False, calculation
              assert calculation['policy']['currency_alignment'] == 'EXPLICIT_ONLY', calculation
              assert calculation['policy']['implicit_currency_conversion_forbidden'] is True, calculation

              join = call('marketplace_semantic_core', {'section':'join'})
              assert join['registered_contract_ids'] == ['wb_sales_vs_advertising_side_by_side.v1'], join
              contract = join['contracts'][0]
              assert contract['comparison_mode'] == 'SIDE_BY_SIDE_ONLY', contract
              assert contract['arithmetic_allowed'] is False, contract
              assert join['arithmetic_permission_is_separate'] is True, join

              gaps = call('marketplace_semantic_core', {'section':'gaps'})
              assert gaps['registry'] or gaps['inline'], gaps

              catalog = call('marketplace_data_catalog')
              assert catalog['status'] == 'SEMANTIC_CORE_VIEW', catalog
              assert catalog['source_of_truth'] == 'marketplace_semantic_core', catalog
              assert catalog['policy']['independent_metric_routes_forbidden'] is True, catalog
              assert catalog['policy']['route_through_semantic_core'] is True, catalog
              assert catalog['policy']['silent_dataset_substitution_forbidden'] is True, catalog

              system_map = call('marketplace_system_map')
              semantic_map = system_map['semantic_core']
              assert semantic_map['brain_status'] == 'CANONICAL_BRAIN', semantic_map
              assert semantic_map['brain_version'] == 'marketplace_semantic_core.v1', semantic_map
              assert semantic_map['brain_runtime_entry'] == 'marketplace_semantic_core', semantic_map
              assert semantic_map['brain_composer'] == 'core/semantic_core.py', semantic_map

              print('MARKETPLACE_SEMANTIC_CORE_V1_LIVE_ACCEPTANCE=PASS', flush=True)
          PY

      - name: Cleanup ephemeral credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/sec.json" "$RUNNER_TEMP/bearer" "$RUNNER_TEMP/mcp-url"
