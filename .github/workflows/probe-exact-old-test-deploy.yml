name: Probe Exact Old TEST Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-exact-old-test-deploy.yml

permissions:
  contents: read

concurrency:
  group: marketplaces-test-runtime-write
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    env:
      CLOUD_ID: b1gi4pr9msenirafh2c7
      FOLDER_ID: b1gnd0dqoq3ljod88i8t
      CONTAINER_ID: bba6lj5ggejtop0jl5k8
      RUNTIME_SA: ajems6nusv4frv6f29vt
      NETWORK_ID: enp3vuoau0hkv7hcb6mh
      REDIS_HOST: rc1a-bu0kmsr3iferj161.mdb.yandexcloud.net
      REGISTRY_ID: crp6o36mbl2tqonu1qbi
      IMAGE: cr.yandex/crp6o36mbl2tqonu1qbi/marketplaces-mcp:test-17debe3190caa575c270ecdd3484e1411410307e
      ARCHIVE_BUCKET: marketplaces-mcp-archive-b1gnd0dqoq3ljod88i8t
      ARCHIVE_DRIVE_ROOT_ID: 1UVKUcFfDhCDk6nMHX1mWg9cRL05DT-OJ
      DRIVE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbzgFDAQY4rcsblKhiAONfOI6315k8W3vwbSIEsczE3ycQtnJ8ctcVKjhzjgdTgfy0cvIA/exec

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/yc/bin/yc" version

      - name: Authenticate exact historical deployer
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          SA_ID="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          test "$SA_ID" = ajecdjjrkdo1t3itpl9k
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"
          yc config set folder-id "$FOLDER_ID"
          echo 'HISTORICAL_DEPLOYER_IDENTITY=PASS'

      - name: Resolve current secret version and rollback target
        shell: bash
        run: |
          set -euo pipefail
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          test -n "$SECRET_ID"
          yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"
          VERSION_ID="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys // [])|index("cabinets_json") != null)|select((.payload_entry_keys // [])|index("mcp_bearer_token") != null)|select((.payload_entry_keys // [])|index("redis_password") != null)|select((.payload_entry_keys // [])|index("google_drive_bridge_secret") != null)]|sort_by(.created_at)|last|.id // empty' "$RUNNER_TEMP/versions.json")"
          test -n "$VERSION_ID"
          yc serverless container revision list --container-id "$CONTAINER_ID" --format json --no-user-output > "$RUNNER_TEMP/revisions-before.json"
          PREVIOUS_REVISION_ID="$(jq -r '[.[]|select(.status=="ACTIVE")][0].id // empty' "$RUNNER_TEMP/revisions-before.json")"
          test -n "$PREVIOUS_REVISION_ID"
          echo "SECRET_ID=$SECRET_ID" >> "$GITHUB_ENV"
          echo "VERSION_ID=$VERSION_ID" >> "$GITHUB_ENV"
          echo "PREVIOUS_REVISION_ID=$PREVIOUS_REVISION_ID" >> "$GITHUB_ENV"
          echo "PREVIOUS_ACTIVE_REVISION=$PREVIOUS_REVISION_ID"

      - name: Exact historical Serverless revision deploy probe
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s yc serverless container revision deploy \
            --container-id "$CONTAINER_ID" --folder-id "$FOLDER_ID" \
            --image "$IMAGE" --memory 2048MB --cores 1 --execution-timeout 600s --concurrency 8 \
            --service-account-id "$RUNTIME_SA" --network-id "$NETWORK_ID" \
            --environment "MARKETPLACE_REQUIRE_REDIS=1,MARKETPLACE_MCP_REDIS_HOST=$REDIS_HOST,MARKETPLACE_MCP_REDIS_PORT=6380,MARKETPLACE_MCP_REDIS_TLS=1,MARKETPLACE_MCP_REDIS_CA_CERT=/opt/yandex/YandexInternalRootCA.crt,OZON_GLOBAL_RPS=50,OZON_PERF_GLOBAL_RPS=10,MARKETPLACE_MCP_ARCHIVE_BUCKET=$ARCHIVE_BUCKET,MARKETPLACE_MCP_ARCHIVE_DRIVE_ROOT_ID=$ARCHIVE_DRIVE_ROOT_ID,MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_URL=$DRIVE_BRIDGE_URL" \
            --secret "environment-variable=MARKETPLACE_MCP_CABINETS_JSON,id=$SECRET_ID,version-id=$VERSION_ID,key=cabinets_json" \
            --secret "environment-variable=MARKETPLACE_MCP_BEARER_TOKEN,id=$SECRET_ID,version-id=$VERSION_ID,key=mcp_bearer_token" \
            --secret "environment-variable=MARKETPLACE_MCP_REDIS_PASSWORD,id=$SECRET_ID,version-id=$VERSION_ID,key=redis_password" \
            --secret "environment-variable=MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_SECRET,id=$SECRET_ID,version-id=$VERSION_ID,key=google_drive_bridge_secret" \
            --format json --no-user-output > "$RUNNER_TEMP/probe-revision.json"
          NEW_REVISION_ID="$(jq -r '.id // empty' "$RUNNER_TEMP/probe-revision.json")"
          test -n "$NEW_REVISION_ID"
          echo "NEW_REVISION_ID=$NEW_REVISION_ID" >> "$GITHUB_ENV"
          echo "new_revision=$NEW_REVISION_ID"
          echo 'EXACT_HISTORICAL_DEPLOY=PASS'

      - name: Immediately restore previous active revision
        if: ${{ steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          yc serverless container rollback --id "$CONTAINER_ID" --revision-id "$PREVIOUS_REVISION_ID" --format json --no-user-output > "$RUNNER_TEMP/rollback.json"
          echo 'PREVIOUS_TEST_REVISION_RESTORED=PASS'

      - name: Verify rollback target is active
        if: ${{ steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          yc serverless container revision list --container-id "$CONTAINER_ID" --format json --no-user-output > "$RUNNER_TEMP/revisions-after.json"
          ACTIVE="$(jq -r '[.[]|select(.status=="ACTIVE")][0].id // empty' "$RUNNER_TEMP/revisions-after.json")"
          test "$ACTIVE" = "$PREVIOUS_REVISION_ID"
          echo "ACTIVE_TEST_REVISION=$ACTIVE"
          echo 'ROLLBACK_VERIFIED=PASS'

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/revisions-before.json" "$RUNNER_TEMP/probe-revision.json" "$RUNNER_TEMP/rollback.json" "$RUNNER_TEMP/revisions-after.json"
