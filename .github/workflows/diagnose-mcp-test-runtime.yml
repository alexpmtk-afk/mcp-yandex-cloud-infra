name: Diagnose Marketplaces MCP TEST Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-mcp-test-runtime.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          ARCHIVE="$RUNNER_TEMP/yc/yc.tgz"
          wget --quiet --timeout=30 --tries=3 --output-document="$ARCHIVE" "$URL"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate diagnostic service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "YC_SERVICE_ACCOUNT_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          yc config profile create runtime-diagnostic || true
          yc config set service-account-key "$KEY_FILE"

      - name: Resolve TEST runtime endpoints
        id: resources
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          CONTAINER_ID="$(timeout 45s yc serverless container list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$CONTAINER_ID"
          CONTAINER_URL="$(timeout 45s yc serverless container get --id "$CONTAINER_ID" --format json --no-user-output | jq -r '.url//empty')"
          GATEWAY_DOMAIN="$(timeout 45s yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//.[0].domain//empty')"
          CLUSTER_ID="$(timeout 45s yc managed-redis cluster list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-valkey")|.id'|head -1)"
          test -n "$CONTAINER_URL"
          test -n "$GATEWAY_DOMAIN"
          test -n "$CLUSTER_ID"
          echo "folder=$FOLDER_ID" >> "$GITHUB_OUTPUT"
          echo "container=$CONTAINER_ID" >> "$GITHUB_OUTPUT"
          echo "container_url=$CONTAINER_URL" >> "$GITHUB_OUTPUT"
          echo "gateway_url=https://$GATEWAY_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "cluster=$CLUSTER_ID" >> "$GITHUB_OUTPUT"
          echo 'test_runtime_endpoints=RESOLVED'

      - name: Probe direct container vs API Gateway
        shell: bash
        env:
          CONTAINER_URL: ${{ steps.resources.outputs.container_url }}
          GATEWAY_URL: ${{ steps.resources.outputs.gateway_url }}
        run: |
          set -euo pipefail
          IAM_TOKEN="$(timeout 45s yc iam create-token)"
          test -n "$IAM_TOKEN"
          echo "::add-mask::$IAM_TOKEN"
          DIRECT_CODE="$(curl -sS --max-time 20 -o "$RUNNER_TEMP/direct-health" -w '%{http_code}' \
            -H "Authorization: Bearer $IAM_TOKEN" "${CONTAINER_URL%/}/healthz" || true)"
          GATEWAY_CODE="$(curl -sS --max-time 20 -o "$RUNNER_TEMP/gateway-health" -w '%{http_code}' \
            "${GATEWAY_URL%/}/healthz" || true)"
          echo "direct_container_health_status=$DIRECT_CODE"
          echo "api_gateway_health_status=$GATEWAY_CODE"
          if [[ "$DIRECT_CODE" == 200 && "$GATEWAY_CODE" == 200 ]]; then
            echo 'HEALTH_PATH_CLASSIFICATION=BOTH_HEALTHY'
          elif [[ "$DIRECT_CODE" == 200 ]]; then
            echo 'HEALTH_PATH_CLASSIFICATION=GATEWAY_INTEGRATION_FAILURE'
          elif [[ "$GATEWAY_CODE" == 200 ]]; then
            echo 'HEALTH_PATH_CLASSIFICATION=DIRECT_AUTH_OR_INVOKE_ANOMALY'
          else
            echo 'HEALTH_PATH_CLASSIFICATION=CONTAINER_OR_SHARED_RUNTIME_FAILURE'
          fi

      - name: Print sanitized health response bodies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          def sanitize(text: str) -> str:
              text = re.sub(r"https?://[^\s\"']+", "<url>", text)
              text = re.sub(r"(?i)(authorization|bearer|token|secret|password)(\s*[:=]\s*)[^,}\s]+", r"\1\2<redacted>", text)
              text = re.sub(r"eyJ[A-Za-z0-9_\-.]{20,}", "<redacted-jwt>", text)
              text = re.sub(r"[A-Za-z0-9_\-]{48,}", "<redacted-long-value>", text)
              return text[:2000]

          for label, name in (("DIRECT_HEALTH_BODY", "direct-health"), ("GATEWAY_HEALTH_BODY", "gateway-health")):
              p = Path("/home/runner/work/_temp") / name
              text = p.read_text(errors="replace") if p.exists() else "<missing>"
              print(f"{label}={sanitize(text)}")
          PY

      - name: Inspect active revision structure and Redis state
        shell: bash
        env:
          CONTAINER_ID: ${{ steps.resources.outputs.container }}
          CLUSTER_ID: ${{ steps.resources.outputs.cluster }}
        run: |
          set -euo pipefail
          yc serverless container revision list --container-id "$CONTAINER_ID" --format json --no-user-output > "$RUNNER_TEMP/revisions.json"
          ACTIVE_ID="$(jq -r '[.[]|select(.status=="ACTIVE")]|sort_by(.created_at//.createdAt)|last|.id//empty' "$RUNNER_TEMP/revisions.json")"
          test -n "$ACTIVE_ID"
          yc serverless container revision get "$ACTIVE_ID" --format json --no-user-output > "$RUNNER_TEMP/active-revision.json"
          yc managed-redis cluster get --id "$CLUSTER_ID" --format json --no-user-output > "$RUNNER_TEMP/redis-cluster.json"
          yc managed-redis hosts list --cluster-id "$CLUSTER_ID" --format json --no-user-output > "$RUNNER_TEMP/redis-hosts.json"
          python - <<'PY'
          import json, re
          from pathlib import Path

          rev = json.loads(Path('/home/runner/work/_temp/active-revision.json').read_text())
          cluster = json.loads(Path('/home/runner/work/_temp/redis-cluster.json').read_text())
          hosts = json.loads(Path('/home/runner/work/_temp/redis-hosts.json').read_text())

          env = rev.get('environment') or {}
          if isinstance(env, list):
              env_keys = sorted(str(x.get('key') or x.get('name') or '') for x in env if isinstance(x, dict))
          elif isinstance(env, dict):
              env_keys = sorted(map(str, env.keys()))
          else:
              env_keys = []

          secrets = rev.get('secrets') or []
          secret_env = []
          for x in secrets if isinstance(secrets, list) else []:
              if isinstance(x, dict):
                  secret_env.append(str(x.get('environment_variable') or x.get('environmentVariable') or x.get('name') or ''))

          image = rev.get('image') or {}
          image_url = rev.get('image_url') or rev.get('imageUrl') or (image.get('image_url') if isinstance(image, dict) else None) or (image.get('imageUrl') if isinstance(image, dict) else None) or (image.get('url') if isinstance(image, dict) else None)
          summary = {
              'id': rev.get('id'),
              'status': rev.get('status'),
              'service_account_id': rev.get('service_account_id') or rev.get('serviceAccountId'),
              'network_id': rev.get('network_id') or rev.get('networkId'),
              'image_url': image_url,
              'execution_timeout': rev.get('execution_timeout') or rev.get('executionTimeout'),
              'concurrency': rev.get('concurrency'),
              'environment_keys': env_keys,
              'secret_environment_keys': sorted(x for x in secret_env if x),
          }
          print('ACTIVE_REVISION_SAFE_SUMMARY=' + json.dumps(summary, ensure_ascii=False, sort_keys=True))

          csum = {
              'id': cluster.get('id'),
              'name': cluster.get('name'),
              'status': cluster.get('status'),
              'health': cluster.get('health'),
              'environment': cluster.get('environment'),
          }
          print('REDIS_CLUSTER_SAFE_SUMMARY=' + json.dumps(csum, ensure_ascii=False, sort_keys=True))
          hsum = []
          for h in hosts if isinstance(hosts, list) else []:
              if not isinstance(h, dict):
                  continue
              hsum.append({
                  'name': h.get('name'),
                  'role': h.get('role'),
                  'health': h.get('health'),
                  'shard_name': h.get('shard_name') or h.get('shardName'),
              })
          print('REDIS_HOSTS_SAFE_SUMMARY=' + json.dumps(hsum, ensure_ascii=False, sort_keys=True))
          PY

      - name: Read and classify latest startup evidence
        shell: bash
        env:
          CONTAINER_ID: ${{ steps.resources.outputs.container }}
        run: |
          set -euo pipefail
          timeout 30s yc serverless container revision list --container-id "$CONTAINER_ID" --format json --no-user-output > "$RUNNER_TEMP/revisions.json" || printf '[]' > "$RUNNER_TEMP/revisions.json"
          if timeout 5s yc logging read --resource-ids="$CONTAINER_ID" --since '20m ago' --limit 300 --format json > "$RUNNER_TEMP/logs.json"; then
            echo 'runtime_log_read=PASS'
          else
            printf '[]' > "$RUNNER_TEMP/logs.json"
            echo 'runtime_log_read=UNAVAILABLE'
          fi
          python - <<'PY'
          import json, re
          from pathlib import Path

          revisions = json.loads(Path("/home/runner/work/_temp/revisions.json").read_text() or "[]")
          logs = json.loads(Path("/home/runner/work/_temp/logs.json").read_text() or "[]")

          def sanitize(text: str) -> str:
              text = re.sub(r"https?://[^\s\"']+", "<url>", text)
              text = re.sub(r"(?i)(authorization|bearer|token|secret|password)(\s*[:=]\s*)[^,}\s]+", r"\1\2<redacted>", text)
              text = re.sub(r"eyJ[A-Za-z0-9_\-.]{20,}", "<redacted-jwt>", text)
              text = re.sub(r"[A-Za-z0-9_\-]{48,}", "<redacted-long-value>", text)
              return text[:1600]

          def created_at(item):
              return str(item.get("created_at") or item.get("createdAt") or "")

          latest = sorted((x for x in revisions if isinstance(x, dict)), key=created_at, reverse=True)[:10]
          latest_ids = {str(x.get("id") or "") for x in latest if x.get("id")}
          print(f"revision_count={len(revisions)}")
          print(f"runtime_log_count={len(logs)}")
          for i, rev in enumerate(latest, 1):
              meta = {
                  "id": rev.get("id"),
                  "created_at": rev.get("created_at") or rev.get("createdAt"),
                  "status": rev.get("status"),
                  "image_url": rev.get("image_url") or rev.get("imageUrl"),
                  "image_digest": rev.get("image_digest") or rev.get("imageDigest"),
                  "execution_timeout": rev.get("execution_timeout") or rev.get("executionTimeout"),
                  "concurrency": rev.get("concurrency"),
              }
              print(f"LATEST_REVISION_{i}={sanitize(json.dumps(meta, ensure_ascii=False, sort_keys=True))}")

          needles = (
              "traceback", "exception", "error", "failed", "fatal", "module", "import",
              "typeerror", "valueerror", "keyerror", "validation", "redis", "startup",
              "application startup", "cannot", "refused", "timeout", "credential", "cabinet",
              "container", "panic", "killed", "memory",
          )
          candidates = []
          latest_candidates = []
          for item in logs:
              raw = json.dumps(item, ensure_ascii=False, sort_keys=True)
              low = raw.lower()
              if any(word in low for word in needles):
                  candidates.append(raw)
                  payload = item.get("json_payload") or item.get("jsonPayload") or {}
                  rid = str(payload.get("revision_id") or payload.get("revisionId") or "") if isinstance(payload, dict) else ""
                  if rid and rid in latest_ids:
                      latest_candidates.append(raw)

          selected = latest_candidates if latest_candidates else candidates[-40:]
          print(f"startup_error_candidate_count={len(candidates)}")
          print(f"latest_revision_candidate_count={len(latest_candidates)}")
          for i, text in enumerate(selected[-40:], 1):
              print(f"STARTUP_EVIDENCE_{i}={sanitize(text)}")
          PY

      - name: Cleanup diagnostic credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/revisions.json" "$RUNNER_TEMP/logs.json" "$RUNNER_TEMP/direct-health" "$RUNNER_TEMP/gateway-health" "$RUNNER_TEMP/active-revision.json" "$RUNNER_TEMP/redis-cluster.json" "$RUNNER_TEMP/redis-hosts.json"
