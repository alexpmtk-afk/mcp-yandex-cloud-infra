name: Telegram Audit Permission Cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-audit-permission-cleanup.yml]
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 5
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Remove temporary usage role
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"
          chmod 600 "$RUNNER_TEMP/key.json"
          sa_id=$(jq -r '.service_account_id // .serviceAccountId' "$RUNNER_TEMP/key.json")
          yc config profile create tg-audit-cleanup || true
          yc config profile activate tg-audit-cleanup
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          yc resource-manager folder remove-access-binding b1gk4p83brasi8g811jv --role billing.usagerecords.admin --service-account-id "$sa_id"
