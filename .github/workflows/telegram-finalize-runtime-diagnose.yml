name: Telegram Finalize Runtime Diagnose

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-finalize-runtime-diagnose.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-finalize || true
          yc config profile activate telegram-finalize
          yc config set service-account-key "$key"
      - name: Inspect persistent state mount
        shell: bash
        run: |
          set -euo pipefail
          folder='b1gk4p83brasi8g811jv'
          ip="$(curl -fsS https://api.ipify.org)"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/tgkey"
          old_keys="$(yc compute instance get telegram-news-reader --folder-id "$folder" --format json | jq -r '.metadata["ssh-keys"] // ""')"
          printf '%s' "$old_keys" > "$RUNNER_TEMP/oldkeys"
          { printf '%s\n' "$old_keys"; printf 'ubuntu:'; cat "$RUNNER_TEMP/tgkey.pub"; } > "$RUNNER_TEMP/newkeys"
          yc compute instance add-metadata telegram-news-reader --folder-id "$folder" --metadata-from-file ssh-keys="$RUNNER_TEMP/newkeys"
          yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id "$folder" --add-rule "description=github-telegram-finalize-diagnose,direction=ingress,port=22,protocol=tcp,v4-cidrs=$ip/32"
          sleep 20
          ssh -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i "$RUNNER_TEMP/tgkey" ubuntu@111.88.248.156 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== HOST FINDMNT ==='
          sudo findmnt -T /state -o TARGET,SOURCE,FSTYPE,OPTIONS || true
          echo '=== LSBLK ==='
          sudo lsblk -o NAME,FSTYPE,SIZE,LABEL,UUID,MOUNTPOINTS
          echo '=== FSTAB RELEVANT ==='
          sudo grep -Ei 'state|telegram|UUID' /etc/fstab || true
          echo '=== HOST STATE NAMES ==='
          sudo find /state -maxdepth 1 -mindepth 1 -printf '%f\n' 2>/dev/null | sort | head -100 || true
          echo '=== CONTAINER MOUNT INFO ==='
          sudo docker inspect telegram-reader --format '{{range .Mounts}}{{println .Source "->" .Destination}}{{end}}'
          pid="$(sudo docker inspect -f '{{.State.Pid}}' telegram-reader)"
          echo "CONTAINER_PID=$pid"
          sudo nsenter -t "$pid" -m -- findmnt -T /state -o TARGET,SOURCE,FSTYPE,OPTIONS || true
          echo '=== CONTAINER STATE NAMES ==='
          sudo nsenter -t "$pid" -m -- find /state -maxdepth 1 -mindepth 1 -printf '%f\n' 2>/dev/null | sort | head -100 || true
          echo 'MOUNT_DIAG_PASS'
          REMOTE
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          yc config profile activate telegram-finalize >/dev/null 2>&1 || true
          folder='b1gk4p83brasi8g811jv'
          ids=$(yc vpc security-group get enpocnvnpdu2goj9nkjn --folder-id "$folder" --format json | jq -r '.rules[] | select(.description=="github-telegram-finalize-diagnose") | .id')
          for id in $ids; do yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id "$folder" --delete-rule-id "$id"; done
          if [ -f "$RUNNER_TEMP/oldkeys" ]; then yc compute instance add-metadata telegram-news-reader --folder-id "$folder" --metadata-from-file ssh-keys="$RUNNER_TEMP/oldkeys"; fi
          rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/tgkey" "$RUNNER_TEMP/tgkey.pub" "$RUNNER_TEMP/oldkeys" "$RUNNER_TEMP/newkeys"
