name: Telegram Serverless Media Boundary Diagnose

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-serverless-media-boundary-diagnose.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create tg-media-boundary-diag || true
          yc config profile activate tg-media-boundary-diag
          yc config set service-account-key "$key"
          yc config set folder-id b1gk4p83brasi8g811jv

      - name: Inspect container and public binding
        shell: bash
        run: |
          set -u
          folder=b1gk4p83brasi8g811jv
          echo DIAG_CONTAINER_BEGIN
          yc serverless container get telegram-reader-media --folder-id "$folder" --format json \
            | jq '{id,name,url,status,created_at,revision_id:(.revision_id // .revisionId // null)}' || true
          echo DIAG_CONTAINER_END
          echo DIAG_BINDINGS_BEGIN
          yc serverless container list-access-bindings telegram-reader-media --folder-id "$folder" --format json \
            | jq '[.[] | {role_id,subjects:[.subjects[]? | {type,id}]}]' || true
          echo DIAG_BINDINGS_END
          if yc serverless container allow-unauthenticated-invoke telegram-reader-media --folder-id "$folder" >/dev/null 2>&1; then
            echo PUBLIC_BINDING_COMMAND=PASS
          else
            echo PUBLIC_BINDING_COMMAND=FAIL
          fi

      - name: Probe exact HTTP boundary
        shell: bash
        run: |
          set -u
          folder=b1gk4p83brasi8g811jv
          url="$(yc serverless container get telegram-reader-media --folder-id "$folder" --format json | jq -r '.url // empty')"
          echo URL_PRESENT=$([ -n "$url" ] && echo yes || echo no)
          [ -n "$url" ] || exit 0
          url="${url%/}"
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS --max-time 20 -o "$RUNNER_TEMP/health.out" -w '%{http_code}' "$url/health" || echo CURLFAIL)"
            echo "HEALTH_ATTEMPT_${attempt}_CODE=$code"
            if [ "$code" = 200 ]; then
              jq -c '{status,media_storage}' "$RUNNER_TEMP/health.out" 2>/dev/null || head -c 300 "$RUNNER_TEMP/health.out" || true
              break
            fi
            head -c 300 "$RUNNER_TEMP/health.out" 2>/dev/null || true
            echo
            sleep 4
          done
          invalid="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$url/media/object?key=x&expires=1&sig=x" || echo CURLFAIL)"
          internal="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$url/internal/chats" || echo CURLFAIL)"
          echo INVALID_MEDIA_CODE=$invalid
          echo INTERNAL_CODE=$internal
          echo MEDIA_BOUNDARY_DIAG_DONE

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/health.out"
