name: Diagnose Lockbox AddVersion on Disposable TEST Secret

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-lockbox-add-version-disposable.yml

permissions:
  contents: read

concurrency:
  group: marketplaces-test-runtime-write
  cancel-in-progress: false
  queue: max

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 12
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          ARCHIVE="$RUNNER_TEMP/yc/yc.tgz"
          wget --quiet --timeout=30 --tries=3 --output-document="$ARCHIVE" "$URL"
          tar -tzf "$ARCHIVE" >/dev/null
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate and resolve isolated TEST folder
        id: auth
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          CI_SA_ID="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          test -n "$CI_SA_ID"
          yc config profile create lockbox-disposable-diagnostic || true
          yc config set service-account-key "$KEY_FILE"
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          echo "folder_id=$FOLDER_ID" >> "$GITHUB_OUTPUT"
          echo "ci_sa_id=$CI_SA_ID" >> "$GITHUB_OUTPUT"
          echo 'TEST_FOLDER=RESOLVED'

      - name: Grant temporary TEST-folder admin
        id: grant
        shell: bash
        env:
          FOLDER_ID: ${{ steps.auth.outputs.folder_id }}
          CI_SA_ID: ${{ steps.auth.outputs.ci_sa_id }}
        run: |
          set -euo pipefail
          timeout 90s yc resource-manager folder add-access-binding "$FOLDER_ID" \
            --role admin \
            --service-account-id "$CI_SA_ID"
          echo 'granted=true' >> "$GITHUB_OUTPUT"
          echo 'TEMP_TEST_FOLDER_ADMIN=GRANTED'
          sleep 20

      - name: Create disposable secret with non-sensitive payload
        id: create
        shell: bash
        env:
          FOLDER_ID: ${{ steps.auth.outputs.folder_id }}
        run: |
          set -euo pipefail
          NAME="wb-ads-lockbox-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' '[{"key":"probe","text_value":"version-one"}]' | \
            timeout 90s yc lockbox secret create \
              --name "$NAME" \
              --folder-id "$FOLDER_ID" \
              --description 'Disposable WB Ads Lockbox AddVersion diagnostic; no business secrets' \
              --version-description 'probe-v1' \
              --payload - \
              --format json --no-user-output > "$RUNNER_TEMP/probe-create.json"
          SECRET_ID="$(jq -r '.id // empty' "$RUNNER_TEMP/probe-create.json")"
          test -n "$SECRET_ID"
          echo "secret_id=$SECRET_ID" >> "$GITHUB_OUTPUT"
          echo "PROBE_SECRET_ID=$SECRET_ID" >> "$GITHUB_ENV"
          echo 'DISPOSABLE_SECRET_CREATE=PASS'

      - name: Resolve initial disposable version
        id: version
        shell: bash
        env:
          SECRET_ID: ${{ steps.create.outputs.secret_id }}
        run: |
          set -euo pipefail
          sleep 5
          timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/probe-versions.json"
          VERSION_ID="$(jq -r '[.[]|select(.status=="ACTIVE")]|sort_by(.created_at)|last|.id // empty' "$RUNNER_TEMP/probe-versions.json")"
          test -n "$VERSION_ID"
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo 'DISPOSABLE_INITIAL_VERSION=PASS'

      - name: Add second version to disposable secret
        id: add
        shell: bash
        env:
          SECRET_ID: ${{ steps.create.outputs.secret_id }}
          BASE_VERSION_ID: ${{ steps.version.outputs.version_id }}
        run: |
          set -euo pipefail
          printf '%s' '[{"key":"probe","text_value":"version-two"}]' | \
            timeout 90s yc lockbox secret add-version \
              --id "$SECRET_ID" \
              --base-version-id "$BASE_VERSION_ID" \
              --description 'probe-v2' \
              --payload - \
              --format json --no-user-output > "$RUNNER_TEMP/probe-add.json"
          NEW_VERSION_ID="$(jq -r '.id // empty' "$RUNNER_TEMP/probe-add.json")"
          test -n "$NEW_VERSION_ID"
          echo 'DISPOSABLE_ADD_VERSION=PASS'

      - name: Verify second version metadata
        shell: bash
        env:
          SECRET_ID: ${{ steps.create.outputs.secret_id }}
        run: |
          set -euo pipefail
          timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/probe-versions-after.json"
          COUNT="$(jq '[.[]|select(.status=="ACTIVE")]|length' "$RUNNER_TEMP/probe-versions-after.json")"
          test "$COUNT" -ge 2
          echo "DISPOSABLE_ACTIVE_VERSION_COUNT=$COUNT"
          echo 'LOCKBOX_ADD_VERSION_SERVICE_PATH=PASS'

      - name: Cleanup disposable secret and temporary admin
        if: always()
        shell: bash
        env:
          FOLDER_ID: ${{ steps.auth.outputs.folder_id }}
          CI_SA_ID: ${{ steps.auth.outputs.ci_sa_id }}
          GRANTED: ${{ steps.grant.outputs.granted }}
        run: |
          set +e
          if [[ -n "${PROBE_SECRET_ID:-}" ]]; then
            timeout 90s yc lockbox secret delete --id "$PROBE_SECRET_ID" --no-user-output >/dev/null 2>&1
            echo 'DISPOSABLE_SECRET_CLEANUP=ATTEMPTED'
          fi
          if [[ "$GRANTED" == true && -n "$FOLDER_ID" && -n "$CI_SA_ID" ]]; then
            timeout 90s yc resource-manager folder remove-access-binding "$FOLDER_ID" \
              --role admin \
              --service-account-id "$CI_SA_ID" >/dev/null 2>&1
            echo 'TEMP_TEST_FOLDER_ADMIN=REVOKE_ATTEMPTED'
          fi
          rm -f \
            "$RUNNER_TEMP/yc-service-account-key.json" \
            "$RUNNER_TEMP/probe-create.json" \
            "$RUNNER_TEMP/probe-versions.json" \
            "$RUNNER_TEMP/probe-add.json" \
            "$RUNNER_TEMP/probe-versions-after.json"
