name: Telegram Reader Post-Decommission Acceptance

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-post-decommission-acceptance.yml]

permissions:
  contents: read

concurrency:
  group: telegram-reader-post-decommission-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-post-decommission || true
          yc config profile activate telegram-post-decommission
          yc config set service-account-key "$key"
          yc config set folder-id b1gk4p83brasi8g811jv

      - name: Assert legacy compute assets remain absent
        shell: bash
        run: |
          set -euo pipefail
          folder=b1gk4p83brasi8g811jv
          ! yc compute instance get --id fhm7p41jpj4uc2c6buou --folder-id "$folder" >/dev/null 2>&1
          ! yc compute disk get --id fhm3d8hhmujlu7akkstn --folder-id "$folder" >/dev/null 2>&1
          ! yc compute disk get --id fhm6hcjd5blbrbg8oine --folder-id "$folder" >/dev/null 2>&1
          ! yc vpc address get --id e9bv4ec7lo22sahplcpj --folder-id "$folder" >/dev/null 2>&1
          echo POST_DECOMMISSION_LEGACY_ABSENCE_PASS

      - name: Resolve and validate private production Reader
        shell: bash
        run: |
          set -euo pipefail
          folder=b1gk4p83brasi8g811jv
          reader="$(yc serverless container get telegram-reader-serverless --folder-id "$folder" --format json)"
          yc serverless container get telegram-reader-media --folder-id "$folder" >/dev/null
          url="$(echo "$reader" | jq -r '.url')"
          url="${url%/}"
          token="$(yc iam create-token)"
          healthy=0
          for attempt in $(seq 1 12); do
            body="$(curl -sS --max-time 30 -H "Authorization: Bearer $token" "$url/health" || true)"
            if echo "$body" | jq -e '.status=="ok" and .telegram_authorized==true and .allowed_chats==9 and .media_storage=="enabled"' >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 5
          done
          test "$healthy" -eq 1
          echo "READER_URL=$url" >> "$GITHUB_ENV"
          echo POST_DECOMMISSION_READER_HEALTH_PASS

      - name: Full 9-chat 192h direct-read acceptance
        shell: bash
        run: |
          set -euo pipefail
          token="$(yc iam create-token)"
          now="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          from="$(date -u -d '192 hours ago' '+%Y-%m-%dT%H:%M:%SZ')"
          chats="$(curl -fsS --retry 2 --retry-delay 2 --max-time 30 -H "Authorization: Bearer $token" "$READER_URL/internal/chats")"
          echo "$chats" | jq -e '.chat_count==9 and (.chats|length)==9' >/dev/null
          total=0
          while read -r cid; do
            before=''
            chat_total=0
            pages=0
            while :; do
              pages=$((pages+1))
              test "$pages" -le 25
              args=(--get --data-urlencode "date_from=$from" --data-urlencode "date_to=$now" --data-urlencode 'limit=2000')
              if [ -n "$before" ]; then args+=(--data-urlencode "before_id=$before"); fi
              page="$(curl -fsS --retry 2 --retry-delay 2 --max-time 110 -H "Authorization: Bearer $token" "${args[@]}" "$READER_URL/internal/chats/$cid/messages")"
              echo "$page" | jq -e --argjson id "$cid" '.chat_id==$id and (.messages|length)==.message_count' >/dev/null
              n="$(echo "$page" | jq -r '.message_count')"
              chat_total=$((chat_total+n))
              full="$(echo "$page" | jq -r '.page_full')"
              next="$(echo "$page" | jq -r '.next_before_id // empty')"
              if [ "$full" != true ]; then break; fi
              test -n "$next"
              before="$next"
            done
            total=$((total+chat_total))
          done < <(echo "$chats" | jq -r '.chats[].chat_id')
          test "$total" -gt 0
          echo "POST_DECOMMISSION_192H_MESSAGES=$total"
          echo POST_DECOMMISSION_9CHAT_192H_READ_PASS

      - name: Four-chat on-demand equivalent acceptance
        shell: bash
        run: |
          set -euo pipefail
          token="$(yc iam create-token)"
          now="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          from="$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')"
          chats="$(curl -fsS --retry 2 --retry-delay 2 --max-time 30 -H "Authorization: Bearer $token" "$READER_URL/internal/chats")"
          mapfile -t ids < <(echo "$chats" | jq -r '.chats[:4][].chat_id')
          test "${#ids[@]}" -eq 4
          total=0
          for cid in "${ids[@]}"; do
            page="$(curl -fsS --retry 2 --retry-delay 2 --max-time 110 -H "Authorization: Bearer $token" --get --data-urlencode "date_from=$from" --data-urlencode "date_to=$now" --data-urlencode 'limit=2000' "$READER_URL/internal/chats/$cid/messages")"
            echo "$page" | jq -e --argjson id "$cid" '.chat_id==$id and (.messages|length)==.message_count' >/dev/null
            n="$(echo "$page" | jq -r '.message_count')"
            total=$((total+n))
          done
          test "$total" -gt 0
          echo "POST_DECOMMISSION_4CHAT_24H_MESSAGES=$total"
          echo POST_DECOMMISSION_ONDEMAND_EQUIVALENT_PASS
          echo TELEGRAM_READER_POST_DECOMMISSION_E2E_PASS

      - name: Cleanup credential file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json"
