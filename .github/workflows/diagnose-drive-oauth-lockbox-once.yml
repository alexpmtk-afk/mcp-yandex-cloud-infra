name: Diagnose Drive OAuth Lockbox Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-drive-oauth-lockbox-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL --retry 5 --retry-delay 3 https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Authenticate
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"
          chmod 600 "$RUNNER_TEMP/key.json"
          yc config profile create drive-oauth-diag || true
          yc config set service-account-key "$RUNNER_TEMP/key.json"
      - name: Inspect Lockbox version metadata and payload access
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"
          jq -r '.[] | [.id,.status,.created_at,((.payload_entry_keys//[])|index("google_drive_oauth_json")!=null)] | @tsv' "$RUNNER_TEMP/versions.json" | tail -20
          SOURCE_VERSION_ID="$(jq -r '[.[]|select((.payload_entry_keys//[])|index("google_drive_oauth_json")!=null)]|sort_by(.created_at)|last|.id//empty' "$RUNNER_TEMP/versions.json")"
          test -n "$SOURCE_VERSION_ID"
          echo "SOURCE_VERSION_ID=$SOURCE_VERSION_ID"
          set +e
          yc lockbox payload get --id "$SECRET_ID" --version-id "$SOURCE_VERSION_ID" --key google_drive_oauth_json --format json --no-user-output > "$RUNNER_TEMP/payload.json" 2> "$RUNNER_TEMP/payload.err"
          RC=$?
          set -e
          echo "PAYLOAD_GET_RC=$RC"
          if [ "$RC" -ne 0 ]; then
            sed -E 's/[A-Za-z0-9_\-]{32,}/[REDACTED]/g' "$RUNNER_TEMP/payload.err"
            exit "$RC"
          fi
          jq -r '{entry_count:(.entries|length),keys:[.entries[].key]}' "$RUNNER_TEMP/payload.json"
          echo 'DRIVE_OAUTH_PAYLOAD_ACCESS=PASS'
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/payload.json" "$RUNNER_TEMP/payload.err"
