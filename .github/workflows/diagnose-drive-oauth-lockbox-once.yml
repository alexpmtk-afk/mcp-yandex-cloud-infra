name: Diagnose Drive OAuth Lockbox Once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-drive-oauth-lockbox-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL --retry 5 --retry-delay 3 https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Authenticate
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"
          chmod 600 "$RUNNER_TEMP/key.json"
          yc config profile create drive-oauth-diag || true
          yc config set service-account-key "$RUNNER_TEMP/key.json"
      - name: Inspect current Lockbox key presence without exposing values
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"

          CURRENT_VERSION_ID="$(jq -r '[.[]|select(.status=="ACTIVE")]|sort_by(.created_at)|last|.id//empty' "$RUNNER_TEMP/versions.json")"
          test -n "$CURRENT_VERSION_ID"
          CURRENT_HAS_OAUTH="$(jq -r --arg id "$CURRENT_VERSION_ID" '.[]|select(.id==$id)|((.payload_entry_keys//[])|index("google_drive_oauth_json")!=null)' "$RUNNER_TEMP/versions.json")"
          CURRENT_HAS_BRIDGE="$(jq -r --arg id "$CURRENT_VERSION_ID" '.[]|select(.id==$id)|((.payload_entry_keys//[])|index("google_drive_bridge_secret")!=null)' "$RUNNER_TEMP/versions.json")"
          echo "CURRENT_ACTIVE_HAS_DRIVE_OAUTH=$CURRENT_HAS_OAUTH"
          echo "CURRENT_ACTIVE_HAS_DRIVE_BRIDGE=$CURRENT_HAS_BRIDGE"

          SOURCE_VERSION_ID="$(jq -r '[.[]|select((.payload_entry_keys//[])|index("google_drive_oauth_json")!=null)]|sort_by(.created_at)|last|.id//empty' "$RUNNER_TEMP/versions.json")"
          if [ -n "$SOURCE_VERSION_ID" ]; then
            echo 'HISTORICAL_DRIVE_OAUTH_VERSION=FOUND'
          else
            echo 'HISTORICAL_DRIVE_OAUTH_VERSION=NOT_FOUND'
          fi

          if [ "$CURRENT_HAS_OAUTH" != true ]; then
            echo 'CURRENT_DRIVE_OAUTH=ABSENT'
            exit 2
          fi
          if [ "$CURRENT_HAS_BRIDGE" != true ]; then
            echo 'CURRENT_DRIVE_BRIDGE=ABSENT'
            exit 3
          fi

          yc lockbox payload get --id "$SECRET_ID" --version-id "$CURRENT_VERSION_ID" --key google_drive_oauth_json --format json --no-user-output > "$RUNNER_TEMP/payload.json"
          jq -e '.entries | length == 1 and .[0].key == "google_drive_oauth_json" and ((.[0].text_value // "") | length > 0)' "$RUNNER_TEMP/payload.json" >/dev/null
          echo 'CURRENT_DRIVE_OAUTH_PAYLOAD_ACCESS=PASS'
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/payload.json"
