name: WB Token Categories Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/wb-token-categories-diagnostic.yml

permissions:
  contents: read

jobs:
  categories-readonly:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          ARCHIVE="$RUNNER_TEMP/yc/yc.tgz"
          ok=0
          for attempt in $(seq 1 6); do
            if timeout 75s wget -q --continue --timeout=30 --tries=2 --retry-connrefused --output-document="$ARCHIVE" "$URL"; then
              if tar -tzf "$ARCHIVE" >/dev/null 2>&1; then ok=1; break; fi
              rm -f "$ARCHIVE"
            fi
            sleep 3
          done
          test "$ok" = 1
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Decode current WB token category mask without exposing token
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(timeout 45s yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          VERSION_ID="$(timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json | jq -r '[.[]|select(.status=="ACTIVE")][0].id')"
          timeout 45s yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/sec.json"
          jq -r '.entries[]|select(.key=="cabinets_json")|.text_value' "$RUNNER_TEMP/sec.json" > "$RUNNER_TEMP/cabinets.json"
          test -s "$RUNNER_TEMP/cabinets.json"
          python - <<'PY'
          import base64, json
          from pathlib import Path

          data=json.loads(Path('/tmp/placeholder').read_text()) if False else json.loads(Path(__import__('os').environ['RUNNER_TEMP']).joinpath('cabinets.json').read_text())
          wb=data.get('wb') or {}
          cabs=wb.get('cabinets') or {}
          active=wb.get('active')
          if active not in cabs:
              active=next(iter(cabs),None)
          assert active and active in cabs, 'no WB cabinet found'
          token=(cabs[active] or {}).get('token','')
          assert token and token.count('.')>=2, 'WB token is not JWT-shaped'
          payload=token.split('.')[1]
          payload += '=' * (-len(payload)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload.encode()).decode())
          mask=int(claims.get('s',0))
          bit_names={
              1:'Контент',2:'Аналитика',3:'Цены и скидки',4:'Маркетплейс',5:'Статистика',
              6:'Продвижение',7:'Вопросы и отзывы',9:'Чат с покупателями',10:'Поставки',
              11:'Возвраты покупателями',12:'Документы',13:'Финансы',16:'Пользователи'
          }
          categories=[name for bit,name in bit_names.items() if mask & (1<<bit)]
          read_only=bool(mask & (1<<30))
          print('WB_TOKEN_CATEGORIES='+json.dumps(categories,ensure_ascii=False))
          print('WB_TOKEN_READ_ONLY='+str(read_only).upper())
          print('WB_TOKEN_HAS_ANALYTICS='+str(bool(mask & (1<<2))).upper())
          print('WB_TOKEN_CATEGORY_DIAGNOSTIC=PASS')
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/sec.json" "$RUNNER_TEMP/cabinets.json"
