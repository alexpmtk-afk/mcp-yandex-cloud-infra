name: M24 Log Evidence Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m24-log-evidence-once.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: birzha-m24-log-evidence-once
  cancel-in-progress: false

env:
  DEPLOYER_SERVICE_ACCOUNT_ID: ajecdjjrkdo1t3itpl9k
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/mcp-yandex-cloud-infra@1349853397:environment:test
  FOLDER_ID: b1g00gqb66tbnfoumnkv
  WORKER_CONTAINER_ID: bbamdg0po6fkukhod2e9
  TIMER_TRIGGER_ID: a1s4ho32v7dha59aeu60
  EXPECTED_REVISION_ID: bbaojh9elqpd5p5mdsei

jobs:
  evidence:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 12
    steps:
      - name: Mint Yandex IAM token through GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          A="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          S='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && S='&'
          R="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${S}audience=${A}")"
          J="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$R")"
          echo "::add-mask::$J"
          python - "$J" <<'PY'
          import base64,json,os,sys
          p=sys.argv[1].split('.')[1]; p += '='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          assert c.get('sub')==os.environ['EXPECTED_OIDC_SUBJECT']
          assert c.get('aud')==os.environ['OIDC_AUDIENCE']
          assert c.get('environment')=='test'
          assert c.get('ref')=='refs/heads/main'
          print('M24_LOG_EVIDENCE_OIDC_CLAIMS=PASS')
          PY
          X="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${DEPLOYER_SERVICE_ACCOUNT_ID}" --data-urlencode "subject_token=${J}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          T="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$X")"
          test -n "$T"
          echo "::add-mask::$T"
          printf '%s' "$T" > "$RUNNER_TEMP/iam-token"
          echo 'M24_LOG_EVIDENCE_OIDC_EXCHANGE=PASS'

      - name: Install official Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tar.gz"
          tar -xzf "$RUNNER_TEMP/yc.tar.gz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          "$RUNNER_TEMP/yc/yc" version
          echo 'YC_CLI_INSTALL=PASS'

      - name: Re-verify active timer and exact worker revision before log proof
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/iam-token")"
          YC_IAM_TOKEN="$TOKEN" "$RUNNER_TEMP/yc/yc" serverless trigger get --id="$TIMER_TRIGGER_ID" --format=json > "$RUNNER_TEMP/trigger.json"
          YC_IAM_TOKEN="$TOKEN" "$RUNNER_TEMP/yc/yc" serverless container revision list --container-id="$WORKER_CONTAINER_ID" --format=json > "$RUNNER_TEMP/revisions.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])
          t=json.loads((base/'trigger.json').read_text())
          rule=t.get('rule') or {}; timer=rule.get('timer') or {}; inv=timer.get('invoke_container_with_retry') or timer.get('invokeContainerWithRetry') or {}
          assert str(t.get('status') or '')=='ACTIVE'
          assert str(inv.get('container_id') or inv.get('containerId') or '')==os.environ['WORKER_CONTAINER_ID']
          assert str(timer.get('cron_expression') or timer.get('cronExpression') or '')=='* * ? * * *'
          d=json.loads((base/'revisions.json').read_text()); rows=d if isinstance(d,list) else (d.get('revisions') or d.get('containerRevisions') or [])
          rows=[r for r in rows if isinstance(r,dict) and str(r.get('container_id') or r.get('containerId') or '')==os.environ['WORKER_CONTAINER_ID']]
          assert rows
          rows.sort(key=lambda r:str(r.get('created_at') or r.get('createdAt') or ''),reverse=True)
          latest=str(rows[0].get('id') or '')
          assert latest==os.environ['EXPECTED_REVISION_ID'], latest
          assert str(rows[0].get('status') or '')=='ACTIVE'
          print('M24_LOG_EVIDENCE_RUNTIME_COORDINATES=PASS')
          PY

      - name: Read corrected worker logs from bounded recent window
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/iam-token")"
          YC_IAM_TOKEN="$TOKEN" "$RUNNER_TEMP/yc/yc" logging read \
            --resource-ids="$WORKER_CONTAINER_ID" \
            --since=3m \
            --limit=1000 \
            --format=json \
            --folder-id="$FOLDER_ID" \
            > "$RUNNER_TEMP/worker-logs.json"
          python - <<'PY'
          import json,os
          from collections import Counter
          from pathlib import Path
          rows=json.loads((Path(os.environ['RUNNER_TEMP'])/'worker-logs.json').read_text())
          assert isinstance(rows,list) and rows
          print(f'M24_LOG_DIAGNOSTIC_RECORDS={len(rows)}')
          top=Counter(); payload=Counter(); levels=Counter(); resources=Counter()
          for e in rows:
              if not isinstance(e,dict): continue
              top.update(str(k) for k in e.keys())
              levels[str(e.get('level') or 'UNSET')]+=1
              r=e.get('resource') or {}
              if isinstance(r,dict): resources[str(r.get('type') or '')]+=1
              jp=e.get('json_payload') or e.get('jsonPayload') or {}
              if isinstance(jp,dict): payload.update(str(k) for k in jp.keys())
          print('M24_LOG_TOP_LEVEL_KEYS=' + ','.join(sorted(top)))
          print('M24_LOG_PAYLOAD_KEYS=' + ','.join(sorted(payload)))
          print('M24_LOG_LEVEL_COUNTS=' + ','.join(f'{k}:{v}' for k,v in sorted(levels.items())))
          print('M24_LOG_RESOURCE_TYPES=' + ','.join(f'{k}:{v}' for k,v in sorted(resources.items())))
          PY

      - name: Classify runtime failure signatures without raw payload disclosure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re
          from collections import Counter
          from pathlib import Path
          rows=json.loads((Path(os.environ['RUNNER_TEMP'])/'worker-logs.json').read_text())
          signatures=Counter(); known=Counter(); starts=ends=0
          exception_re=re.compile(r'\b([A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception|Denied|Unauthenticated|Unavailable|DeadlineExceeded|Aborted|Failure))\b')
          patterns={
            'TRACEBACK':r'\bTraceback\b',
            'ASGI_EXCEPTION':r'Exception in ASGI application',
            'YDB':r'\bydb\b|YDB',
            'PERMISSION':r'permission|denied|unauthori[sz]ed|unauthenticated',
            'DEADLINE':r'deadline|timed? out|timeout',
            'UNAVAILABLE':r'unavailable|connection refused|cannot connect|failed to connect',
            'CREDENTIALS':r'credential|metadata.*token|iam token',
            'HTTP_500':r'\b500\b|Internal Server Error',
            'HTTP_200':r'\b200\b|200 OK',
          }
          level_errors=0
          status_values=Counter()
          for e in rows:
              if not isinstance(e,dict): continue
              msg=str(e.get('message') or '')
              jp=e.get('json_payload') or e.get('jsonPayload') or {}
              values=[msg]
              if isinstance(jp,dict):
                  for k,v in jp.items():
                      lk=str(k).lower().replace('-','_')
                      if 'status' in lk or lk in {'code','http_code','response_code'}:
                          status_values[str(v)] += 1
                      values.append(str(v))
              text=' '.join(values)
              if re.search(r'\bSTART\b',text,re.I): starts += 1
              if re.search(r'\bEND\b',text,re.I): ends += 1
              if str(e.get('level') or '').upper() in {'ERROR','FATAL'}: level_errors += 1
              for label,pat in patterns.items():
                  if re.search(pat,text,re.I): known[label]+=1
              for sig in exception_re.findall(text): signatures[sig]+=1
          print(f'M24_LOG_START_MARKERS={starts}')
          print(f'M24_LOG_END_MARKERS={ends}')
          print(f'M24_LOG_ERROR_LEVEL_ENTRIES={level_errors}')
          print('M24_LOG_STATUS_VALUES=' + ','.join(f'{k}:{v}' for k,v in status_values.most_common(12)))
          print('M24_LOG_KNOWN_SIGNATURES=' + ','.join(f'{k}:{v}' for k,v in sorted(known.items())))
          print('M24_LOG_EXCEPTION_TYPES=' + ','.join(f'{k}:{v}' for k,v in signatures.most_common(20)))
          fps=Counter()
          for e in rows:
              if not isinstance(e,dict): continue
              if str(e.get('level') or '').upper() not in {'ERROR','FATAL'} and not re.search(r'Traceback|Exception|Error',str(e.get('message') or ''),re.I):
                  continue
              msg=str(e.get('message') or '')
              normalized=re.sub(r'[A-Za-z0-9_-]{20,}','<ID>',msg)
              normalized=re.sub(r'https?://\S+','<URL>',normalized)
              fps[hashlib.sha256(normalized.encode()).hexdigest()[:12]]+=1
          print('M24_LOG_ERROR_FINGERPRINTS=' + ','.join(f'{k}:{v}' for k,v in fps.most_common(12)))
          assert starts>0 and ends>0, 'timer container execution markers missing'
          assert level_errors==0 and known['TRACEBACK']==0 and known['ASGI_EXCEPTION']==0, 'runtime errors remain; see safe classifications above'
          print('M24_LOG_RUNTIME_ERRORS=NONE')
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/iam-token" "$RUNNER_TEMP/yc" "$RUNNER_TEMP/yc.tar.gz" "$RUNNER_TEMP/trigger.json" "$RUNNER_TEMP/revisions.json" "$RUNNER_TEMP/worker-logs.json"
