name: Hosted Marketplaces historical versions bundle 2026-09-17

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hosted-marketplaces-historical-versions-bundle-20260917-temp.yml"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 120
    env:
      YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
    steps:
      - name: Download non-current Object Storage versions and build bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, time, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path
          import jwt
          root=Path('/tmp/marketplaces-historical')
          root.mkdir(parents=True,exist_ok=True)
          buckets={
            'archive-versions':'marketplaces-mcp-archive-b1gnd0dqoq3ljod88i8t',
            'tfstate-versions':'marketplaces-mcp-tfstate-b1gnd0dqoq3ljod88i8t',
          }
          key=json.loads(os.environ['YC_SERVICE_ACCOUNT_KEY_JSON'])
          now=int(time.time())
          signed=jwt.encode({'aud':'https://iam.api.cloud.yandex.net/iam/v1/tokens','iss':key['service_account_id'],'iat':now,'exp':now+3600},key['private_key'],algorithm='PS256',headers={'kid':key['id']})
          req=urllib.request.Request('https://iam.api.cloud.yandex.net/iam/v1/tokens',data=json.dumps({'jwt':signed}).encode(),headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: token=json.loads(r.read())['iamToken']
          headers={'Authorization':'Bearer '+token}
          endpoint='https://storage.yandexcloud.net'
          def tx(n,k):
              for c in n:
                  if c.tag.rsplit('}',1)[-1]==k:return c.text or ''
              return ''
          def listing(bucket):
              km=vm=None; versions=[]; deletes=[]
              while True:
                  q={'versions':'','max-keys':'1000'}
                  if km:q['key-marker']=km
                  if vm:q['version-id-marker']=vm
                  u=f'{endpoint}/{bucket}?{urllib.parse.urlencode(q)}'
                  with urllib.request.urlopen(urllib.request.Request(u,headers=headers),timeout=90) as r: doc=ET.fromstring(r.read())
                  for n in doc:
                      kind=n.tag.rsplit('}',1)[-1]
                      if kind=='Version': versions.append({'key':tx(n,'Key'),'version_id':tx(n,'VersionId'),'latest':tx(n,'IsLatest').lower()=='true','size':int(tx(n,'Size') or 0),'last_modified':tx(n,'LastModified')})
                      elif kind=='DeleteMarker': deletes.append({'key':tx(n,'Key'),'version_id':tx(n,'VersionId'),'latest':tx(n,'IsLatest').lower()=='true','last_modified':tx(n,'LastModified')})
                  trunc=next((x.text for x in doc.iter() if x.tag.rsplit('}',1)[-1]=='IsTruncated'),'false')
                  if str(trunc).lower()!='true':break
                  km=next((x.text for x in doc.iter() if x.tag.rsplit('}',1)[-1]=='NextKeyMarker'),None)
                  vm=next((x.text for x in doc.iter() if x.tag.rsplit('}',1)[-1]=='NextVersionIdMarker'),None)
                  if not km:raise RuntimeError('pagination marker missing')
              return versions,deletes
          def rel(keyname):
              parts=[p for p in keyname.replace('\\','/').split('/') if p not in ('','.')]
              if '..' in parts:raise RuntimeError('unsafe key')
              return Path(*parts)
          expected={'archive-versions':(968,2298527130),'tfstate-versions':(71,1886182)}
          summary={}
          for label,bucket in buckets.items():
              dest=root/label;dest.mkdir(parents=True,exist_ok=True)
              versions,deletes=listing(bucket); hist=[v for v in versions if not v['latest']]
              exp_count,exp_bytes=expected[label]
              if len(hist)!=exp_count or sum(v['size'] for v in hist)!=exp_bytes: raise RuntimeError(f'cloud totals changed for {bucket}')
              manifest=[];total=0
              for i,v in enumerate(hist,1):
                  vid=v['version_id']; keyname=v['key']; bucketdir=dest/hashlib.sha256(vid.encode()).hexdigest()[:20]
                  target=bucketdir/rel(keyname);target.parent.mkdir(parents=True,exist_ok=True)
                  url=f'{endpoint}/{bucket}/{urllib.parse.quote(keyname,safe="/-_.~")}?{urllib.parse.urlencode({"versionId":vid})}'
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=180) as r,target.open('wb') as f:
                      n=0
                      while True:
                          chunk=r.read(1024*1024)
                          if not chunk:break
                          f.write(chunk);n+=len(chunk)
                  if n!=v['size']:raise RuntimeError(f'size mismatch {keyname}')
                  total+=n;manifest.append({**v,'local_rel':str(target.relative_to(dest)),'downloaded_size':n})
                  if i%100==0:print(f'PROGRESS {label} {i}/{len(hist)} bytes={total}',flush=True)
              (dest/'_manifest.json').write_text(json.dumps({'bucket':bucket,'historical_versions':manifest,'delete_markers':deletes},ensure_ascii=False,indent=2),encoding='utf-8')
              summary[label]={'bucket':bucket,'files':len(hist),'bytes':total,'delete_markers':len(deletes)}
              print(f'BUNDLE_SOURCE=PASS {label} files={len(hist)} bytes={total}',flush=True)
          (root/'_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          tar -C /tmp -czf marketplaces-historical-versions.tar.gz marketplaces-historical
          ls -lh marketplaces-historical-versions.tar.gz

      - name: Upload historical versions bundle
        uses: actions/upload-artifact@v4
        with:
          name: marketplaces-historical-versions
          path: marketplaces-historical-versions.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
