name: Yandex Auth Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/yandex-auth-preflight.yml"

permissions:
  contents: read

jobs:
  yandex-auth-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/yc"
          cd "${RUNNER_TEMP}/yc"
          curl --fail --silent --show-error -O \
            https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf yc_linux_amd64.tar.gz
          chmod +x yc
          echo "${RUNNER_TEMP}/yc" >> "${GITHUB_PATH}"
          ./yc version

      - name: Authenticate with service account authorized key
        id: auth
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail

          if [[ -z "${YC_SERVICE_ACCOUNT_KEY_JSON:-}" ]]; then
            echo "FAIL: YC_SERVICE_ACCOUNT_KEY_JSON secret is empty or unavailable."
            exit 1
          fi

          KEY_FILE="${RUNNER_TEMP}/yc-service-account-key.json"
          printf '%s' "${YC_SERVICE_ACCOUNT_KEY_JSON}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"

          jq -e '.id and .service_account_id and .private_key' "${KEY_FILE}" >/dev/null

          yc config profile create github-ci
          yc config set service-account-key "${KEY_FILE}"

          IAM_TOKEN=$(yc iam create-token)
          if [[ -z "${IAM_TOKEN}" ]]; then
            echo "FAIL: Yandex IAM token was not returned."
            exit 1
          fi

          echo "::add-mask::${IAM_TOKEN}"
          echo "iam_token=${IAM_TOKEN}" >> "${GITHUB_OUTPUT}"
          echo "PASS: authorized key produced a Yandex IAM token."

      - name: Verify access to target Yandex Cloud
        shell: bash
        env:
          IAM_TOKEN: ${{ steps.auth.outputs.iam_token }}
          YC_CLOUD_ID: b1gi4pr9msenirafh2c7
        run: |
          set -euo pipefail

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${IAM_TOKEN}" \
            "https://resource-manager.api.cloud.yandex.net/resource-manager/v1/clouds/${YC_CLOUD_ID}")

          NAME=$(jq -r '.name // empty' <<<"${RESPONSE}")
          if [[ "${NAME}" != "cloud-alexpmtk" ]]; then
            echo "FAIL: authenticated, but target cloud verification did not match."
            exit 1
          fi

          echo "PASS: GitHub Actions authenticated to cloud-alexpmtk."

      - name: Cleanup key material
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/yc-service-account-key.json"
