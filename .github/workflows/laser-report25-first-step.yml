name: Laser Report 25 First Step

on:
  push:
    branches:
      - fix/marketplaces-destroy-v1-lockbox-history
    paths:
      - '.github/workflows/laser-report25-first-step.yml'

permissions:
  contents: read

concurrency:
  group: marketplaces-archive-queue-worker
  cancel-in-progress: false

jobs:
  one-step:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL --retry 5 --retry-delay 3 https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
          python -m pip install --quiet 'httpx>=0.27,<1'

      - name: Resolve live V3-only MCP
        id: live
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/yc-key.json"
          umask 077
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY"
          yc config profile create laser-report25-first-step >/dev/null 2>&1 || true
          yc config set service-account-key "$KEY"
          FOLDER_ID="$(yc resource-manager folder list --cloud-id b1gi4pr9msenirafh2c7 --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"
          VERSION_ID="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys//[])|index("google_drive_bridge_secret")!=null)|select((.payload_entry_keys//[])|index("mcp_bearer_token")!=null)|select((.payload_entry_keys//[])|index("gdrive_bridge_v1_secret")==null)]|sort_by(.created_at)|last|.id//empty' "$RUNNER_TEMP/versions.json")"
          test "$VERSION_ID" = 'e6qnvjc1fpqj2osspbtt'
          DOMAIN="$(yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//.[0].domain//empty')"
          test -n "$DOMAIN"
          yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/payload.json"
          BEARER="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value//empty' "$RUNNER_TEMP/payload.json")"
          test -n "$BEARER"
          echo "::add-mask::$BEARER"
          printf '%s' "$BEARER" > "$RUNNER_TEMP/bearer"
          chmod 600 "$RUNNER_TEMP/bearer"
          echo "url=https://${DOMAIN}/mcp" >> "$GITHUB_OUTPUT"

      - name: Run exactly one worker call for Laser and stop
        shell: bash
        timeout-minutes: 10
        env:
          MCP_URL: ${{ steps.live.outputs.url }}
        run: |
          set -euo pipefail
          export MCP_BEARER="$(cat "$RUNNER_TEMP/bearer")"
          python -u - <<'PY'
          import itertools, json, os, httpx
          JOB='wb-finance-wb_laser_master-2026'
          CLOSED=743994450
          def unpack(r):
              r.raise_for_status()
              for line in r.text.splitlines():
                  if line.startswith('data:'):
                      return json.loads(line[5:].strip())
              return r.json() if r.text.strip() else None
          h0={'Authorization':'Bearer '+os.environ['MCP_BEARER'],'Accept':'application/json, text/event-stream','Content-Type':'application/json'}
          ids=itertools.count(1)
          with httpx.Client(timeout=httpx.Timeout(connect=15,read=540,write=30,pool=15),follow_redirects=True) as c:
              r=c.post(os.environ['MCP_URL'],headers=h0,json={'jsonrpc':'2.0','id':next(ids),'method':'initialize','params':{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'laser-report25-first-step','version':'1'}}})
              init=unpack(r); assert init and 'result' in init, init
              h=dict(h0); sid=r.headers.get('mcp-session-id')
              if sid: h['Mcp-Session-Id']=sid
              h['MCP-Protocol-Version']=init['result'].get('protocolVersion','2025-06-18')
              ready=c.post(os.environ['MCP_URL'],headers=h,json={'jsonrpc':'2.0','method':'notifications/initialized'})
              assert ready.status_code in (200,202), ready.status_code
              def tool(name,args):
                  rr=c.post(os.environ['MCP_URL'],headers=h,json={'jsonrpc':'2.0','id':next(ids),'method':'tools/call','params':{'name':name,'arguments':args}})
                  d=unpack(rr); assert d and 'result' in d,(name,d)
                  result=d['result']; assert not result.get('isError'),result
                  text=next((x.get('text') for x in result.get('content',[]) if x.get('type')=='text'),None)
                  assert text,result
                  return json.loads(text)
              before=tool('marketplace_archive_job_status',{'job_id':JOB})
              completed=[int(v) for v in (before.get('completed_report_ids') or [])]
              assert before.get('ok') is True,before
              assert int(before.get('reports_total') or 0)==38,before
              assert int(before.get('report_index') or -1)==24,before
              assert len(completed)==24 and CLOSED in completed,before
              assert int(before.get('provider_calls') or -1)==49,before
              assert str(before.get('phase') or '')=='DOWNLOAD',before
              assert str(before.get('finalize_phase') or '')=='',before
              assert int(before.get('current_rrd_id') or 0)==0,before
              assert not before.get('last_error'),before
              print('PRECHECK=PASS report_index=24 provider_calls=49 phase=DOWNLOAD',flush=True)

              step=tool('marketplace_archive_worker_step',{'job_id':JOB})
              print('STEP_RESULT='+json.dumps(step,ensure_ascii=False),flush=True)
              assert step.get('ok') is True,step
              action=str(step.get('action') or '')
              assert action in {'report_page_staged','report_download_complete','waiting_rate_limit','worker_busy'},step

              after=tool('marketplace_archive_job_status',{'job_id':JOB})
              completed2=[int(v) for v in (after.get('completed_report_ids') or [])]
              pc=int(after.get('provider_calls') or 0)
              assert after.get('ok') is True,after
              assert int(after.get('report_index') or -1)==24,after
              assert len(completed2)==24 and CLOSED in completed2,after
              assert 49 <= pc <= 50,after
              assert pc-int(before.get('provider_calls') or 0) <= 1,after
              assert int(after.get('finalize_report_id') or 0) != CLOSED,after
              print('POST_ACTION='+action,flush=True)
              print('POST_STATUS='+str(after.get('status')),flush=True)
              print('POST_PHASE='+str(after.get('phase')),flush=True)
              print('POST_REPORT_INDEX='+str(after.get('report_index')),flush=True)
              print('POST_PROVIDER_CALLS='+str(pc),flush=True)
              print('POST_CURRENT_RRD_ID='+str(after.get('current_rrd_id')),flush=True)
              print('POST_FINALIZE_PHASE='+str(after.get('finalize_phase')),flush=True)
              print('POST_FINALIZE_REPORT='+str(after.get('finalize_report_id')),flush=True)
              print('POST_LAST_ERROR='+str(after.get('last_error')),flush=True)
              print('EXACTLY_ONE_WORKER_CALL=PASS',flush=True)
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/yc" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/payload.json" "$RUNNER_TEMP/bearer"
