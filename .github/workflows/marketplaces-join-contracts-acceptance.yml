name: Marketplaces Join Contracts Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app/**
      - terraform/*.tf
      - terraform/*.tftpl
      - .github/workflows/deploy-mcp-test.yml
      - .github/workflows/marketplaces-join-contracts-acceptance.yml

permissions:
  contents: read
  actions: read

jobs:
  accept:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 35
    steps:
      - name: Wait for successful TEST deploy of this exact commit
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=''
          for attempt in $(seq 1 150); do
            runs="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-mcp-test.yml/runs" \
              -f branch=main -f event=push -f per_page=30)"
            row="$(jq -r --arg sha "$GITHUB_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha)]
              | sort_by(.run_number)
              | last
              | if . == null then "" else (.status + "|" + (.conclusion // "") + "|" + (.html_url // "")) end
            ' <<<"$runs")"
            if [[ -z "$row" ]]; then
              echo "deploy wait $attempt/150: run not created yet"
              sleep 10
              continue
            fi
            IFS='|' read -r status conclusion url <<<"$row"
            echo "deploy wait $attempt/150: status=$status conclusion=${conclusion:-pending} url=$url"
            if [[ "$status" == completed ]]; then
              if [[ "$conclusion" == success ]]; then
                state=success
                break
              fi
              echo "TEST deploy for $GITHUB_SHA completed with conclusion=$conclusion"
              exit 1
            fi
            sleep 10
          done
          test "$state" = success
          echo 'EXACT_COMMIT_TEST_DEPLOY=PASS'

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          ARCHIVE="$RUNNER_TEMP/yc/yc.tgz"
          rm -f "$ARCHIVE"
          ok=0
          for attempt in $(seq 1 8); do
            if timeout 75s wget --continue --timeout=30 --tries=2 --retry-connrefused --output-document="$ARCHIVE" "$URL"; then
              if tar -tzf "$ARCHIVE" >/dev/null 2>&1; then
                ok=1
                break
              fi
              rm -f "$ARCHIVE"
            fi
            sleep 4
          done
          test "$ok" = 1
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate and resolve TEST endpoint
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create join-contracts-acceptance || true
          yc config set service-account-key "$KEY_FILE"
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          VERSION_ID="$(yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output | jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys // [])|index("mcp_bearer_token") != null)]|sort_by(.created_at)|last|.id // empty')"
          DOMAIN="$(yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//.[0].domain//empty')"
          test -n "$SECRET_ID"
          test -n "$VERSION_ID"
          test -n "$DOMAIN"
          yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/sec.json"
          BEARER="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value' "$RUNNER_TEMP/sec.json")"
          test -n "$BEARER"
          echo "::add-mask::$BEARER"
          printf '%s' "$BEARER" > "$RUNNER_TEMP/bearer"
          printf '%s' "https://${DOMAIN}/mcp" > "$RUNNER_TEMP/mcp-url"

      - name: Accept Join / Calculation Contracts V1 and Calculation Registry V1 on live TEST MCP
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'httpx>=0.27,<1'
          export MCP_URL="$(cat "$RUNNER_TEMP/mcp-url")"
          export MCP_BEARER="$(cat "$RUNNER_TEMP/bearer")"
          python -u - <<'PY'
          import itertools
          import json
          import os
          import time
          import httpx

          TRANSIENT = {502, 503, 504}

          def unpack(response):
              response.raise_for_status()
              for line in response.text.splitlines():
                  if line.startswith('data:'):
                      return json.loads(line[5:].strip())
              return response.json() if response.text.strip() else None

          headers = {
              'Authorization': 'Bearer ' + os.environ['MCP_BEARER'],
              'Accept': 'application/json, text/event-stream',
              'Content-Type': 'application/json',
          }
          ids = itertools.count(1)
          timeout = httpx.Timeout(connect=10.0, read=45.0, write=30.0, pool=10.0)

          with httpx.Client(timeout=timeout, follow_redirects=True) as client:
              def post(payload):
                  last = None
                  for attempt in range(1, 9):
                      response = client.post(os.environ['MCP_URL'], headers=headers, json=payload)
                      last = response
                      if response.status_code not in TRANSIENT:
                          return response
                      print(f'transient_gateway_status={response.status_code} attempt={attempt}/8', flush=True)
                      time.sleep(3)
                  return last

              response = post({
                  'jsonrpc':'2.0','id':next(ids),'method':'initialize','params':{
                      'protocolVersion':'2025-06-18','capabilities':{},
                      'clientInfo':{'name':'join-contracts-acceptance','version':'1'}
                  }
              })
              init = unpack(response)
              assert init and 'result' in init, init
              instructions = init['result'].get('instructions','')
              assert 'marketplace_join_control' in instructions, instructions
              assert 'Join Controller V1' in instructions, instructions
              assert 'Join permission and arithmetic permission are separate' in instructions, instructions
              assert 'marketplace_calculation_contract' in instructions, instructions
              assert 'Calculation Contract Registry V1' in instructions, instructions
              assert 'Client-authored formulas and implicit currency conversion are forbidden' in instructions, instructions
              session = response.headers.get('mcp-session-id')
              if session:
                  headers['Mcp-Session-Id'] = session
              headers['MCP-Protocol-Version'] = init['result'].get('protocolVersion','2025-06-18')
              note = post({'jsonrpc':'2.0','method':'notifications/initialized'})
              assert note.status_code in (200,202), note.status_code

              def rpc(method, params=None):
                  response = post({'jsonrpc':'2.0','id':next(ids),'method':method,'params':params or {}})
                  data = unpack(response)
                  assert data and 'result' in data, (method, data)
                  return data['result']

              def call(name, args):
                  result = rpc('tools/call', {'name':name,'arguments':args})
                  assert not result.get('isError'), (name, result)
                  text = next(x.get('text') for x in result.get('content',[]) if x.get('type') == 'text')
                  return json.loads(text)

              names = {tool['name'] for tool in rpc('tools/list')['tools']}
              assert 'marketplace_query_plan' in names, sorted(names)
              assert 'marketplace_execution_control' in names, sorted(names)
              assert 'marketplace_join_control' in names, sorted(names)

              system_map = call('marketplace_system_map', {})
              router = system_map['request_source_router']
              assert router['join_controller_source_revision'].endswith('a48e06625add3655158cb0837ffe842cf44cf2c9'), router
              assert router['calculation_registry_source_revision'].endswith('fef591ecdfa43039cc34059200c2c79d9a270f73'), router
              join_map = router['join_controller']
              assert join_map['status'] == 'REGISTERED_JOIN_CONTRACTS_V1', join_map
              assert join_map['runtime_entry'] == 'marketplace_join_control', join_map
              assert join_map['controller_version'] == 'marketplace_join_controller.v1', join_map
              assert join_map['join_contract_version'] == 'marketplace_join_contract.v1', join_map
              assert join_map['calculation_contract_version'] == 'marketplace_calculation_contract.v1', join_map
              assert join_map['registered_cross_source_calculations'] == [], join_map
              assert 'side-by-side' in join_map['approved_v1_join'], join_map
              registry_map = join_map['calculation_registry']
              assert registry_map['registry_version'] == 'marketplace_calculation_registry.v1', registry_map
              assert registry_map['contract_version'] == 'marketplace_calculation_contract.v1', registry_map
              assert registry_map['status'] == 'VALIDATED_EMPTY_V1', registry_map
              assert registry_map['registered_cross_source_calculations'] == [], registry_map
              assert registry_map['currency_policy'] == 'EXPLICIT_ONLY', registry_map
              assert registry_map['provenance_required'] is True, registry_map

              question = 'Сравни продажи и рекламные расходы за август'
              args = {
                  'question': question,
                  'marketplace':'wb',
                  'seller':'wb_novokshenov',
                  'date_from':'2026-08-01',
                  'date_to':'2026-08-31',
              }
              execution = call('marketplace_execution_control', args)
              assert execution['state'] == 'READY_WITH_GATES', execution
              contracts = execution['dispatch_contracts']
              assert len(contracts) == 2, execution

              leg_results = []
              for contract in contracts:
                  target = contract['semantic_target']['id']
                  base = {
                      'ok': True,
                      'marketplace': 'wb',
                      'seller': 'wb_novokshenov',
                      'date_from': '2026-08-01',
                      'date_to': '2026-08-31',
                      'coverage': {'status': 'FULL_COVERAGE'},
                      'semantic_resolution': {
                          'resolution_type': 'CAPABILITY',
                          'capability_id': target,
                      },
                  }
                  if target == 'sale_and_return_operations':
                      base['calculation'] = {
                          'sales_and_returns_by_currency': [
                              {'currency':'RUB','net_sales_amount':1000.0,'net_units':10.0}
                          ],
                          'cross_currency_total': None,
                      }
                  elif target == 'advertising_performance':
                      base['metrics'] = {
                          'spend': 100.0,
                          'attributed_order_amount': 400.0,
                          'drr_order_pct': 25.0,
                          'roas': 4.0,
                      }
                  else:
                      raise AssertionError(target)
                  leg_results.append({'contract_id': contract['contract_id'], 'result': base})

              joined = call('marketplace_join_control', {**args, 'leg_results': leg_results})
              assert joined['controller'] == 'marketplace_join_controller.v1', joined
              assert joined['state'] == 'READY', joined
              assert joined['can_join'] is True, joined
              assert joined['join_contract']['contract_version'] == 'marketplace_join_contract.v1', joined
              assert joined['join_contract']['contract_id'] == 'wb_sales_vs_advertising_side_by_side.v1', joined
              assert joined['join_contract']['comparison_mode'] == 'SIDE_BY_SIDE_ONLY', joined
              assert joined['arithmetic_allowed'] is False, joined
              assert joined['calculation_contract'] is None, joined
              assert joined['calculation_contract_version'] == 'marketplace_calculation_contract.v1', joined
              assert joined['registered_cross_source_calculations'] == [], joined
              registry = joined['calculation_registry']
              assert registry['registry_version'] == 'marketplace_calculation_registry.v1', registry
              assert registry['contract_version'] == 'marketplace_calculation_contract.v1', registry
              assert registry['registered_calculation_ids'] == [], registry
              assert registry['registered_calculation_count'] == 0, registry
              assert registry['arithmetic_enabled'] is False, registry
              assert len(joined['joined_legs']) == 2, joined

              missing = call('marketplace_join_control', {**args, 'leg_results': leg_results[:1]})
              assert missing['state'] == 'BLOCKED', missing
              assert missing['can_join'] is False, missing
              assert missing['arithmetic_allowed'] is False, missing
              assert any(x['type'] == 'REQUIRED_LEG_RESULT_MISSING' for x in missing['blockers']), missing

              arithmetic = call('marketplace_join_control', {
                  **args,
                  'question':'Сравни продажи и рекламные расходы за август и рассчитай DRR',
              })
              assert arithmetic['state'] == 'BLOCKED', arithmetic
              assert arithmetic['can_join'] is False, arithmetic
              assert arithmetic['arithmetic_allowed'] is False, arithmetic
              assert arithmetic['calculation_registry']['registered_calculation_count'] == 0, arithmetic
              assert any(x['type'] == 'CALCULATION_CONTRACT_REQUIRED' for x in arithmetic['blockers']), arithmetic

              named_formula = call('marketplace_join_control', {
                  **args,
                  'leg_results': leg_results,
                  'calculation_id': 'overall_drr.v1',
              })
              assert named_formula['state'] == 'BLOCKED', named_formula
              assert named_formula['can_join'] is False, named_formula
              assert named_formula['arithmetic_allowed'] is False, named_formula
              assert named_formula['calculation_registry']['registered_calculation_count'] == 0, named_formula
              assert any(x['type'] == 'CALCULATION_CONTRACT_NOT_REGISTERED' for x in named_formula['blockers']), named_formula

              print('MARKETPLACE_JOIN_CALCULATION_CONTRACTS_V1_LIVE_ACCEPTANCE=PASS', flush=True)
              print('MARKETPLACE_CALCULATION_CONTRACT_REGISTRY_V1_LIVE_ACCEPTANCE=PASS', flush=True)
          PY

      - name: Cleanup ephemeral credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/sec.json" "$RUNNER_TEMP/bearer" "$RUNNER_TEMP/mcp-url"
