name: BIRZHA M23 Yandex credential reusable

on:
  workflow_call:

permissions:
  contents: read

jobs:
  credential-probe:
    runs-on: [self-hosted, Windows, X64, gpt-powershell-home]
    environment: test
    timeout-minutes: 10
    steps:
      - name: Verify TEST Yandex credential availability only
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"'
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:YC_SERVICE_ACCOUNT_KEY_JSON)) { throw 'YC_SERVICE_ACCOUNT_KEY_JSON unavailable' }
          $obj = $env:YC_SERVICE_ACCOUNT_KEY_JSON | ConvertFrom-Json
          if (-not $obj.service_account_id -or -not $obj.private_key -or -not $obj.id) { throw 'Yandex service-account key shape invalid' }
          Write-Host 'YANDEX_TEST_CREDENTIAL=PASS'
