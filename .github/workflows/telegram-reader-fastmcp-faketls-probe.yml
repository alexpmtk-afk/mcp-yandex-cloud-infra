name: Telegram Reader FastMCP FakeTLS Probe

on:
  push:
    branches: [diagnostic/telegram-mtproxy-faketls443]
    paths: [".github/workflows/telegram-reader-fastmcp-faketls-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - name: Select live FakeTLS proxy outside Yandex using TelethonFakeTLS
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" -q install telethon==1.44.0 TelethonFakeTLS
          cat > "$RUNNER_TEMP/select.py" <<'PY'
          import asyncio,json,socket,urllib.parse,urllib.request
          from telethon import TelegramClient
          from telethon.sessions import MemorySession
          from TelethonFakeTLS.Connection import ConnectionTcpMTProxyFakeTLS

          URL='https://raw.githubusercontent.com/mcny2809/mtproto-for-telegram/master/all_proxies.txt'
          raw=urllib.request.urlopen(URL,timeout=20).read().decode()
          cand=[]; seen=set()
          for line in raw.splitlines():
              line=line.strip()
              if not (line.startswith('tg://proxy?') or line.startswith('https://t.me/proxy?')): continue
              q=urllib.parse.parse_qs(urllib.parse.urlsplit(line).query)
              try:
                  h=q['server'][0].rstrip('.'); p=int(q['port'][0]); s=urllib.parse.unquote(q['secret'][0]); bytes.fromhex(s)
              except Exception: continue
              if p==443 and s.lower().startswith('ee'):
                  k=(h,p,s)
                  if k not in seen: seen.add(k); cand.append((h,p,s))
          cand=cand[:50]
          print(f'OUTSIDE_CANDIDATES={len(cand)}',flush=True)
          sem=asyncio.Semaphore(10)

          async def one(i,x):
              async with sem:
                  h,p,s=x; loop=asyncio.get_running_loop()
                  try:
                      def tcp():
                          z=socket.create_connection((h,p),timeout=4); peer=z.getpeername(); z.close(); return peer
                      peer=await asyncio.wait_for(loop.run_in_executor(None,tcp),5)
                      print(f'OUT_{i}_TCP=PASS host={h} peer={peer[0]}:{peer[1]}',flush=True)
                  except Exception as e:
                      return None
                  secret=s[2:]
                  c=TelegramClient(MemorySession(),1,'0'*32,connection=ConnectionTcpMTProxyFakeTLS,proxy=(h,p,secret),connection_retries=1,retry_delay=0,timeout=6)
                  try:
                      await asyncio.wait_for(c.connect(),8)
                      if c.is_connected():
                          print(f'OUT_{i}_FAKETLS=PASS host={h}',flush=True)
                          return {'host':h,'port':p,'secret':s}
                  except Exception as e:
                      print(f'OUT_{i}_FAKETLS=FAIL host={h} error={type(e).__name__}',flush=True)
                  finally:
                      try: await c.disconnect()
                      except Exception: pass
                  return None

          async def main():
              out=await asyncio.gather(*(one(i,x) for i,x in enumerate(cand,1)))
              alive=[x for x in out if x][:3]
              print(f'OUTSIDE_ALIVE={len(alive)}',flush=True)
              json.dump(alive,open('/tmp/alive.json','w'))
              raise SystemExit(0 if alive else 20)
          asyncio.run(main())
          PY
          "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/select.py"
          cp /tmp/alive.json "$RUNNER_TEMP/alive.json"

      - name: Install and authenticate YC CLI
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"; echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
          key="$RUNNER_TEMP/yc-key.json"; printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"; chmod 600 "$key"
          "$RUNNER_TEMP/yc/yc" config profile create telegram-fastmcp-faketls || true
          "$RUNNER_TEMP/yc/yc" config set service-account-key "$key"

      - name: Create disposable Yandex VM
        id: vm
        shell: bash
        run: |
          set -euo pipefail
          folder='b1gk4p83brasi8g811jv'
          prod="$(yc compute instance get --name telegram-news-reader --folder-id "$folder" --full --format json)"
          zone="$(printf '%s' "$prod" | jq -r '.zone_id')"; subnet="$(printf '%s' "$prod" | jq -r '.network_interfaces[0].subnet_id')"
          name="telegram-fastmcp-faketls-${GITHUB_RUN_ID}"
          alive_b64="$(base64 -w0 "$RUNNER_TEMP/alive.json")"
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import asyncio,json,socket,time
          from telethon import TelegramClient
          from telethon.sessions import MemorySession
          from TelethonFakeTLS.Connection import ConnectionTcpMTProxyFakeTLS
          C=json.load(open('/opt/alive.json'))
          async def one(i,p):
              h,port,s=p['host'],p['port'],p['secret']
              try:
                  ips=sorted({x[4][0] for x in socket.getaddrinfo(h,port,socket.AF_UNSPEC,socket.SOCK_STREAM)})
                  print(f'Y_{i}_DNS=PASS host={h} ips={",".join(ips[:5])}',flush=True)
              except Exception as e:
                  print(f'Y_{i}=DNS_FAIL host={h} error={type(e).__name__}',flush=True); return False
              t=time.monotonic()
              try:
                  z=socket.create_connection((h,port),timeout=5); peer=z.getpeername(); z.close()
                  print(f'Y_{i}_TCP=PASS host={h} peer={peer[0]}:{peer[1]} latency_ms={int((time.monotonic()-t)*1000)}',flush=True)
              except Exception as e:
                  print(f'Y_{i}=YANDEX_TO_PROXY_TCP_FAIL host={h} error={type(e).__name__} latency_ms={int((time.monotonic()-t)*1000)}',flush=True); return False
              c=TelegramClient(MemorySession(),1,'0'*32,connection=ConnectionTcpMTProxyFakeTLS,proxy=(h,port,s[2:]),connection_retries=1,retry_delay=0,timeout=7)
              t=time.monotonic()
              try:
                  await asyncio.wait_for(c.connect(),10)
                  if c.is_connected():
                      print(f'Y_{i}=FASTMCP_FAKETLS_GATE_PASS host={h} latency_ms={int((time.monotonic()-t)*1000)}',flush=True); return True
              except Exception as e:
                  print(f'Y_{i}=FASTMCP_FAKETLS_HANDSHAKE_FAIL host={h} error={type(e).__name__} latency_ms={int((time.monotonic()-t)*1000)}',flush=True)
              finally:
                  try: await c.disconnect()
                  except Exception: pass
              return False
          async def main():
              ok=False
              for i,p in enumerate(C,1): ok=(await one(i,p)) or ok
              print('FASTMCP_FAKETLS_GATE=PASS' if ok else 'FASTMCP_FAKETLS_GATE=FAIL',flush=True)
              raise SystemExit(0 if ok else 1)
          asyncio.run(main())
          PY
          sed 's/^/      /' "$RUNNER_TEMP/probe.py" > "$RUNNER_TEMP/probe.indented"
          {
            echo '#cloud-config'
            echo 'package_update: true'
            echo 'packages:'
            echo '  - python3-venv'
            echo '  - strace'
            echo 'write_files:'
            echo '  - path: /opt/alive.json.b64'
            echo "    permissions: '0600'"
            echo '    content: |'
            echo "      $alive_b64"
            echo '  - path: /opt/probe.py'
            echo "    permissions: '0644'"
            echo '    content: |'
            cat "$RUNNER_TEMP/probe.indented"
            echo '  - path: /usr/local/sbin/run-probe'
            echo "    permissions: '0755'"
            echo '    content: |'
            echo '      #!/usr/bin/env bash'
            echo '      set -uo pipefail'
            echo '      base64 -d /opt/alive.json.b64 > /opt/alive.json'
            echo '      python3 -m venv /opt/venv'
            echo '      /opt/venv/bin/pip -q install telethon==1.44.0 TelethonFakeTLS'
            echo '      strace -f -e trace=connect -s 200 -o /tmp/connect.trace /opt/venv/bin/python /opt/probe.py > /tmp/result.txt 2>&1'
            echo '      rc=$?'
            echo "      echo '===PROBE_BEGIN===' > /dev/ttyS0"
            echo '      cat /tmp/result.txt > /dev/ttyS0'
            echo "      echo '---STRACE---' > /dev/ttyS0"
            echo "      grep -E 'connect\\(' /tmp/connect.trace | tail -n 80 > /dev/ttyS0 || true"
            echo "      echo '===PROBE_END===' > /dev/ttyS0"
            echo '      exit $rc'
            echo 'runcmd:'
            echo '  - [bash, -lc, "/usr/local/sbin/run-probe || true"]'
          } > "$RUNNER_TEMP/cloud-init.yaml"
          yc compute instance create --name "$name" --folder-id "$folder" --zone "$zone" --platform standard-v3 --cores 2 --memory 1GB --core-fraction 20 \
            --create-boot-disk image-folder-id=standard-images,image-family=ubuntu-2404-lts-oslogin,size=10,type=network-hdd \
            --network-interface subnet-id="$subnet",nat-ip-version=ipv4 --metadata-from-file user-data="$RUNNER_TEMP/cloud-init.yaml" --metadata serial-port-enable=1 >/dev/null
          echo "name=$name" >> "$GITHUB_OUTPUT"; echo "folder=$folder" >> "$GITHUB_OUTPUT"

      - name: Read result
        env:
          VM_NAME: ${{ steps.vm.outputs.name }}
          FOLDER_ID: ${{ steps.vm.outputs.folder }}
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 90); do
            yc compute instance get-serial-port-output --name "$VM_NAME" --folder-id "$FOLDER_ID" > "$RUNNER_TEMP/serial.txt" 2>/dev/null || true
            if grep -q '===PROBE_END===' "$RUNNER_TEMP/serial.txt"; then
              sed -n '/===PROBE_BEGIN===/,/===PROBE_END===/p' "$RUNNER_TEMP/serial.txt" | tee "$RUNNER_TEMP/result.txt"
              grep -q 'FASTMCP_FAKETLS_GATE=PASS' "$RUNNER_TEMP/result.txt"; exit $?
            fi
            sleep 5
          done
          echo 'FASTMCP_FAKETLS_GATE=TIMEOUT'; exit 1

      - name: Destroy disposable VM
        if: always()
        env:
          VM_NAME: ${{ steps.vm.outputs.name }}
          FOLDER_ID: ${{ steps.vm.outputs.folder }}
        shell: bash
        run: |
          set +e
          if [ -n "$VM_NAME" ] && [ -n "$FOLDER_ID" ]; then yc compute instance delete --name "$VM_NAME" --folder-id "$FOLDER_ID" >/dev/null 2>&1 || true; fi
          rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/alive.json"
