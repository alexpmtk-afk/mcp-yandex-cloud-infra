name: Google Drive Bridge v1 Cross-Project Acceptance

on:
  workflow_dispatch:
    inputs:
      marketplaces_url:
        description: Marketplaces Bridge v1 /exec URL
        required: true
        type: string
      birzha_url:
        description: Birzha Bridge v1 /exec URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: google-drive-bridge-v1-cross-project-acceptance
  cancel-in-progress: false

jobs:
  cross-project:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies and Yandex CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'httpx>=0.27,<1'
          mkdir -p "$RUNNER_TEMP/yc"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            -o "$RUNNER_TEMP/yc.tgz" \
            'https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate Yandex
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"
          chmod 600 "$RUNNER_TEMP/key.json"
          yc config profile create bridge-v1-cross-project || true
          yc config set service-account-key "$RUNNER_TEMP/key.json"

      - name: Resolve both isolated v1 credentials
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_ID=b1gi4pr9msenirafh2c7
          resolve_key() {
            local folder_name="$1"
            local secret_name="$2"
            local output_file="$3"
            local folder_id secret_id version_id value
            folder_id="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r --arg n "$folder_name" '.[]|select(.name==$n)|.id'|head -1)"
            test -n "$folder_id"
            secret_id="$(yc lockbox secret list --folder-id "$folder_id" --format json | jq -r --arg n "$secret_name" '.[]|select(.name==$n)|.id'|head -1)"
            test -n "$secret_id"
            yc lockbox secret list-versions --id "$secret_id" --format json --no-user-output > "$RUNNER_TEMP/versions.json"
            version_id="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys//[])|index("gdrive_bridge_v1_secret")!=null)]|sort_by(.created_at)|last|.id//empty' "$RUNNER_TEMP/versions.json")"
            test -n "$version_id"
            value="$(yc lockbox payload get --id "$secret_id" --version-id "$version_id" --key gdrive_bridge_v1_secret --no-user-output)"
            test -n "$value"
            echo "::add-mask::$value"
            printf '%s' "$value" > "$output_file"
            chmod 600 "$output_file"
          }
          resolve_key marketplaces-mcp-test marketplaces-mcp-api-credentials "$RUNNER_TEMP/marketplaces-secret"
          resolve_key birzha-mcp-forecast-test birzha-mcp-forecast-test-auth "$RUNNER_TEMP/birzha-secret"
          echo 'CROSS_PROJECT_CREDENTIAL_RESOLUTION=PASS'

      - name: Run concurrent isolation acceptance
        shell: bash
        env:
          BRIDGE_A_URL: ${{ inputs.marketplaces_url }}
          BRIDGE_A_PROJECT_ID: marketplaces
          BRIDGE_A_ROOT_ID: 1UVKUcFfDhCDk6nMHX1mWg9cRL05DT-OJ
          BRIDGE_B_URL: ${{ inputs.birzha_url }}
          BRIDGE_B_PROJECT_ID: birzha
          BRIDGE_B_ROOT_ID: 1A7IzjXYSCWReZXdtrPZgZgLTnFIifsT2
        run: |
          set -euo pipefail
          export BRIDGE_A_SECRET="$(cat "$RUNNER_TEMP/marketplaces-secret")"
          export BRIDGE_B_SECRET="$(cat "$RUNNER_TEMP/birzha-secret")"
          python shared/google-drive-bridge/scripts/cross_project_acceptance.py

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/marketplaces-secret" "$RUNNER_TEMP/birzha-secret"
