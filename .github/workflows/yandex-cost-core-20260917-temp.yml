name: Yandex local migration encrypted token temp

on:
  push:
    branches: [main]
    paths: ['.github/workflows/yandex-cost-core-20260917-temp.yml']

permissions:
  contents: read

env:
  MIGRATION_PUBLIC_KEY_B64: 

jobs:
  mint-encrypted-token:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    env:
      YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
    steps:
      - name: Install crypto dependencies
        run: python -m pip install --quiet PyJWT cryptography
      - name: Mint IAM token and emit encrypted envelope only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, time, urllib.request
          import jwt
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          key = json.loads(os.environ['YC_SERVICE_ACCOUNT_KEY_JSON'])
          now = int(time.time())
          signed = jwt.encode(
              {'aud':'https://iam.api.cloud.yandex.net/iam/v1/tokens','iss':key['service_account_id'],'iat':now,'exp':now+3600},
              key['private_key'], algorithm='PS256', headers={'kid':key['id']})
          req = urllib.request.Request(
              'https://iam.api.cloud.yandex.net/iam/v1/tokens',
              data=json.dumps({'jwt':signed}).encode(),
              headers={'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(req, timeout=30) as r:
              token = json.loads(r.read())['iamToken']
          pub = serialization.load_pem_public_key(base64.b64decode(os.environ['MIGRATION_PUBLIC_KEY_B64']))
          aes_key = AESGCM.generate_key(bit_length=256)
          nonce = os.urandom(12)
          aad = b'mcp-yandex-local-migration-20260917'
          ct = AESGCM(aes_key).encrypt(nonce, token.encode(), aad)
          ek = pub.encrypt(aes_key, padding.OAEP(mgf=padding.MGF1(hashes.SHA256()), algorithm=hashes.SHA256(), label=None))
          env = {'v':1,'ek':base64.b64encode(ek).decode(),'nonce':base64.b64encode(nonce).decode(),'ct':base64.b64encode(ct).decode()}
          packed = base64.b64encode(json.dumps(env,separators=(',',':')).encode()).decode()
          print('MIGRATION_ENVELOPE_B64='+packed)
          print('YANDEX_IAM_TOKEN_ENCRYPTED=PASS')
          PY
