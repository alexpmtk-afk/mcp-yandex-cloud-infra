name: Marketplaces Valkey audit once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/marketplaces-valkey-audit-once.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 8
    steps:
      - name: Install YC and authenticate
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSLo "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
          K="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$K"
          chmod 600 "$K"
          "$RUNNER_TEMP/yc/yc" config profile create valkey-audit || true
          "$RUNNER_TEMP/yc/yc" config set service-account-key "$K"
      - name: Inspect Valkey cluster
        shell: bash
        run: |
          set -euo pipefail
          F='b1gnd0dqoq3ljod88i8t'
          C='c9qhtoqtl7hqnctc0r0k'
          echo '=== CLUSTER ==='
          yc managed-redis cluster get --id "$C" --format json --no-user-output | jq '{id,name,status,health,created_at,environment,config,network_id,security_group_ids,persistence_mode,disk_encryption_key_id}'
          echo '=== HOSTS ==='
          yc managed-redis hosts list --cluster-id "$C" --format json --no-user-output | jq '[.[] | {name,zone_id,subnet_id,assign_public_ip,replica_priority}]'
          echo '=== LIST ==='
          yc managed-redis cluster list --folder-id "$F" --format json --no-user-output | jq '[.[] | {id,name,status,health,created_at,environment,config}]'
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json"
