name: Provision Google Drive Bridge v1 Lockboxes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'control/provision-google-drive-bridge-v1-lockboxes.txt'

permissions:
  contents: read

concurrency:
  group: google-drive-bridge-v1-lockboxes
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          ARCHIVE="$RUNNER_TEMP/yc.tgz"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          for attempt in $(seq 1 8); do
            rm -f "$ARCHIVE"
            if timeout 75s curl --fail --silent --show-error --retry 2 --retry-all-errors -o "$ARCHIVE" "$URL" \
              && tar -tzf "$ARCHIVE" >/dev/null 2>&1; then
              break
            fi
            [[ "$attempt" -lt 8 ]]
            sleep 4
          done
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate Yandex CI service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          DEPLOYER_ID="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          test -n "$DEPLOYER_ID"
          printf '%s' "$DEPLOYER_ID" > "$RUNNER_TEMP/deployer-id"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"

      - name: Grant temporary admin only on the two TEST folders
        id: grant
        shell: bash
        env:
          CLOUD_ID: b1gi4pr9msenirafh2c7
        run: |
          set -euo pipefail
          DEPLOYER_ID="$(cat "$RUNNER_TEMP/deployer-id")"
          for folder_name in marketplaces-mcp-test birzha-mcp-forecast-test; do
            FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r --arg n "$folder_name" '.[]|select(.name==$n)|.id' | head -1)"
            test -n "$FOLDER_ID"
            printf '%s' "$FOLDER_ID" > "$RUNNER_TEMP/folder-$folder_name-id"
            timeout 90s yc resource-manager folder add-access-binding "$FOLDER_ID" \
              --role admin \
              --service-account-id "$DEPLOYER_ID"
            echo "TEMP_TEST_FOLDER_ADMIN=GRANTED folder=$folder_name"
          done
          echo 'granted=true' >> "$GITHUB_OUTPUT"
          sleep 20

      - name: Provision isolated Lockboxes and runtime access
        shell: bash
        env:
          CLOUD_ID: b1gi4pr9msenirafh2c7
        run: |
          set -euo pipefail

          ensure_bridge_lockbox() {
            local folder_name="$1"
            local secret_name="$2"
            local runtime_sa_name="$3"

            local folder_id
            folder_id="$(cat "$RUNNER_TEMP/folder-$folder_name-id")"
            test -n "$folder_id"

            local secret_id
            secret_id="$(timeout 45s yc lockbox secret list --folder-id "$folder_id" --format json | jq -r --arg n "$secret_name" '.[]|select(.name==$n)|.id' | head -1)"
            if [[ -z "$secret_id" ]]; then
              secret_id="$(timeout 60s yc lockbox secret create \
                --folder-id "$folder_id" \
                --name "$secret_name" \
                --description 'Dedicated Yandex Cloud ↔ Google Drive Bridge v1 credential container; payload added only after Apps Script deployment validation.' \
                --deletion-protection \
                --format json | jq -r '.id')"
            fi
            test -n "$secret_id"

            local runtime_sa_id
            runtime_sa_id="$(timeout 45s yc iam service-account list --folder-id "$folder_id" --format json | jq -r --arg n "$runtime_sa_name" '.[]|select(.name==$n)|.id' | head -1)"
            test -n "$runtime_sa_id"

            local access_json="$RUNNER_TEMP/access-$secret_id.json"
            timeout 45s yc lockbox secret list-access-bindings --id "$secret_id" --format json > "$access_json"
            if ! jq -e --arg sid "$runtime_sa_id" '
              ((.access_bindings // .)[]?)
              | select(.role_id=="lockbox.payloadViewer")
              | select((.subject.id // "") == $sid)
            ' "$access_json" >/dev/null 2>&1; then
              timeout 60s yc lockbox secret add-access-binding \
                --id "$secret_id" \
                --role lockbox.payloadViewer \
                --service-account-id "$runtime_sa_id" \
                --no-user-output
            fi

            echo "BRIDGE_LOCKBOX_READY folder=$folder_name secret=$secret_name secret_id=$secret_id runtime_sa=$runtime_sa_name runtime_sa_id=$runtime_sa_id"
          }

          ensure_bridge_lockbox \
            'marketplaces-mcp-test' \
            'marketplaces-google-drive-bridge-v1' \
            'marketplaces-mcp-runtime'

          ensure_bridge_lockbox \
            'birzha-mcp-forecast-test' \
            'birzha-google-drive-bridge-v1' \
            'birzha-mcp-forecast-runtime'

          echo 'BRIDGE_V1_LOCKBOX_PROVISIONING=PASS'
          echo 'SECRET_PAYLOAD_CREATED=NO'
          echo 'PRODUCTION_BINDINGS_CHANGED=NO'

      - name: Revoke temporary TEST-folder admin
        if: always() && steps.grant.outputs.granted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYER_ID="$(cat "$RUNNER_TEMP/deployer-id")"
          for folder_name in marketplaces-mcp-test birzha-mcp-forecast-test; do
            FOLDER_FILE="$RUNNER_TEMP/folder-$folder_name-id"
            if [[ -s "$FOLDER_FILE" ]]; then
              FOLDER_ID="$(cat "$FOLDER_FILE")"
              timeout 90s yc resource-manager folder remove-access-binding "$FOLDER_ID" \
                --role admin \
                --service-account-id "$DEPLOYER_ID"
              echo "TEMP_TEST_FOLDER_ADMIN=REVOKED folder=$folder_name"
            fi
          done

      - name: Cleanup credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/deployer-id" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP"/folder-*-id "$RUNNER_TEMP"/access-*.json
