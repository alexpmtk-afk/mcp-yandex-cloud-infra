name: Diagnose Marketplaces Registry IP Policy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-marketplaces-registry-ip-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUD_ID: b1gi4pr9msenirafh2c7
  TEST_FOLDER_NAME: marketplaces-mcp-test
  REGISTRY_ID: crp6o36mbl2tqonu1qbi

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"

      - name: Authenticate and grant temporary read-policy access
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          CI_SA_ID="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          [[ "$CI_SA_ID" == "ajecdjjrkdo1t3itpl9k" ]]
          echo "::add-mask::$CI_SA_ID"
          echo "CI_SA_ID=$CI_SA_ID" >> "$GITHUB_ENV"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r --arg n "$TEST_FOLDER_NAME" '.[]|select(.name==$n)|.id' | head -1)"
          test -n "$FOLDER_ID"
          echo "FOLDER_ID=$FOLDER_ID" >> "$GITHUB_ENV"
          yc config set folder-id "$FOLDER_ID"
          yc resource-manager folder list-access-bindings "$FOLDER_ID" --format json > "$RUNNER_TEMP/bindings.json"
          ADMIN_PRESENT="$(jq -r --arg id "$CI_SA_ID" 'any(.[]; .role_id=="admin" and .subject.type=="serviceAccount" and .subject.id==$id)' "$RUNNER_TEMP/bindings.json")"
          echo "ADMIN_PRESENT=$ADMIN_PRESENT" >> "$GITHUB_ENV"
          if [[ "$ADMIN_PRESENT" != "true" ]]; then
            yc resource-manager folder add-access-binding "$FOLDER_ID" --role admin --service-account-id "$CI_SA_ID"
            echo 'ADMIN_ADDED=true' >> "$GITHUB_ENV"
            sleep 15
          fi

      - name: Read registry IP permissions and registry IAM bindings
        shell: bash
        run: |
          set -euo pipefail
          yc container registry list-ip-permissions "$REGISTRY_ID" --format json --no-user-output > "$RUNNER_TEMP/ip-policy.json"
          yc container registry list-access-bindings "$REGISTRY_ID" --format json --no-user-output > "$RUNNER_TEMP/registry-bindings.json"
          echo '--- registry_ip_permissions ---'
          jq -c '.' "$RUNNER_TEMP/ip-policy.json"
          echo '--- registry_access_bindings ---'
          jq -c '.' "$RUNNER_TEMP/registry-bindings.json"
          PUSH_COUNT="$(jq '[.[] | select((.action // .permission // "") == "PUSH")] | length' "$RUNNER_TEMP/ip-policy.json")"
          TOTAL_COUNT="$(jq 'length' "$RUNNER_TEMP/ip-policy.json")"
          echo "ip_policy_total=$TOTAL_COUNT"
          echo "push_ip_permissions=$PUSH_COUNT"

      - name: Cleanup temporary admin
        if: always()
        shell: bash
        run: |
          set +e
          if [[ "${ADMIN_ADDED:-false}" == "true" && -n "${FOLDER_ID:-}" && -n "${CI_SA_ID:-}" ]]; then
            yc resource-manager folder remove-access-binding "$FOLDER_ID" --role admin --service-account-id "$CI_SA_ID" >/dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/bindings.json" "$RUNNER_TEMP/ip-policy.json" "$RUNNER_TEMP/registry-bindings.json"
          echo 'diagnostic_cleanup=PASS'
