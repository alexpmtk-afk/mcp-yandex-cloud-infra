name: Telegram Legacy Cleanup Audit Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/telegram-legacy-cleanup-audit-temp.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-cleanup-audit || true
          yc config profile activate telegram-cleanup-audit
          yc config set service-account-key "$key"
          yc config set folder-id b1gk4p83brasi8g811jv

      - name: Audit Telegram legacy resources
        shell: bash
        run: |
          set -euo pipefail
          folder=b1gk4p83brasi8g811jv

          echo '=== INSTANCES ==='
          yc compute instance list --folder-id "$folder" --format json | jq -c '[.[] | select(.name|startswith("telegram")) | {id,name,status,boot_disk:(.boot_disk.disk_id // null),secondary_disks:[.secondary_disks[]?.disk_id],network_interfaces:[.network_interfaces[]? | {subnet_id,primary_v4_address:(.primary_v4_address.address // null),one_to_one_nat_address:(.primary_v4_address.one_to_one_nat.address // null)}]}]'

          echo '=== DISKS ==='
          yc compute disk list --folder-id "$folder" --format json | jq -c '[.[] | select(.name|startswith("telegram")) | {id,name,status,size,type_id,instance_ids:(.instance_ids // [])}]'

          echo '=== ADDRESSES ==='
          yc vpc address list --folder-id "$folder" --format json | jq -c '[.[] | {id,name,reserved,used,external_ipv4_address:(.external_ipv4_address.address // null),zone_id:(.external_ipv4_address.zone_id // null)}]'

          echo '=== NAT GATEWAYS ==='
          yc vpc nat-gateway list --folder-id "$folder" --format json | jq -c '[.[] | {id,name}]'

          echo '=== ROUTE TABLES ==='
          yc vpc route-table list --folder-id "$folder" --format json | jq -c '[.[] | {id,name,network_id,static_routes}]'

          echo '=== SUBNETS ==='
          yc vpc subnet list --folder-id "$folder" --format json | jq -c '[.[] | {id,name,network_id,route_table_id,v4_cidr_blocks}]'

          echo '=== SERVERLESS CONTAINERS ==='
          yc serverless container list --folder-id "$folder" --format json | jq -c '[.[] | select(.name|startswith("telegram")) | {id,name,url,created_at}]'

          echo '=== SECURITY GROUP TELEGRAM RULES ==='
          yc vpc security-group list --folder-id "$folder" --format json | jq -c '[.[] | {id,name,rules:[.rules[]? | select((.description // "")|contains("telegram")) | {id,description,direction,ports,protocol_name,v4_cidr_blocks}]} | select((.rules|length)>0)]'

          echo TELEGRAM_LEGACY_CLEANUP_AUDIT_PASS

      - name: Cleanup credential file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json"
