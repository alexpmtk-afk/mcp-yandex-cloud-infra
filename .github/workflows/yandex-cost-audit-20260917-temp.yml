name: Yandex cost audit 2026-09-17 temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yandex-cost-audit-20260917-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 12
    steps:
      - name: Install YC CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"

      - name: Read cost-relevant state and usage
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -uo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"
          chmod 600 "$RUNNER_TEMP/key.json"
          yc config profile create cost-audit-20260917 || true
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          yc config set cloud-id b1gi4pr9msenirafh2c7
          START='2026-09-16T12:18:03Z'
          MONTH='2026-09-01T00:00:00Z'
          END="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          TOKEN="$(yc iam create-token)"
          echo "AUDIT_START=$START"
          echo "AUDIT_END=$END"

          echo '=== BILLING_VISIBILITY ==='
          curl -sS -H "Authorization: Bearer $TOKEN" 'https://billing.api.cloud.yandex.net/billing/v1/billingAccounts' | jq '{count:(.billingAccounts//[]|length),accounts:[(.billingAccounts//[])[]|{id,name,active,currency}]}' || true

          monitor_counter() {
            FOLDER="$1"
            QUERY="$2"
            FROM="$3"
            BODY="$RUNNER_TEMP/mon.json"
            jq -n --arg q "$QUERY" --arg f "$FROM" --arg t "$END" '{query:$q,fromTime:$f,toTime:$t,downsampling:{gridAggregation:"LAST",gapFilling:"NONE",gridInterval:900000}}' > "$BODY"
            curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @"$BODY" "https://monitoring.api.cloud.yandex.net/monitoring/v2/data/read?folderId=$FOLDER" | jq '[.metrics[]? | {labels,first:((.timeseries.doubleValues // .timeseries.int64Values // [])[0] // null),last:((.timeseries.doubleValues // .timeseries.int64Values // [])[-1] // null),points:((.timeseries.doubleValues // .timeseries.int64Values // [])|length)}]' || true
          }

          monitor_ydb() {
            FOLDER="$1"
            FROM="$2"
            BODY="$RUNNER_TEMP/ydb.json"
            jq -n --arg f "$FROM" --arg t "$END" '{query:"{service=\"ydb\",name=\"api.units.consumed_per_second\"}",fromTime:$f,toTime:$t,downsampling:{gridAggregation:"AVG",gapFilling:"NONE",gridInterval:300000}}' > "$BODY"
            curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @"$BODY" "https://monitoring.api.cloud.yandex.net/monitoring/v2/data/read?folderId=$FOLDER" | jq '{series:[.metrics[]? | {labels,points:((.timeseries.doubleValues // .timeseries.int64Values // [])|length),sample_sum:((.timeseries.doubleValues // .timeseries.int64Values // [])|map(select(.!=null)|tonumber)|add//0)}],sample_sum_total:([.metrics[]? | ((.timeseries.doubleValues // .timeseries.int64Values // [])|map(select(.!=null)|tonumber)|add//0)]|add//0)}' || true
          }

          for ITEM in \
            'birzha-mcp-forecast-test:b1g00gqb66tbnfoumnkv' \
            'default:b1g0r8h0no6tomn7f5rs' \
            'marketplace-card-monitor:b1g5t7v7u1mnsjd2ai7u' \
            'marketplaces-mcp-test:b1gnd0dqoq3ljod88i8t' \
            'telegram-news-reader:b1gk4p83brasi8g811jv'; do
            N="${ITEM%%:*}"
            F="${ITEM##*:}"
            echo "=== FOLDER $N ==="

            echo '-- COMPUTE --'
            yc compute instance list --folder-id "$F" --format json --no-user-output 2>/dev/null | jq '[.[]|{id,name,status,resources}]' || true
            yc compute disk list --folder-id "$F" --format json --no-user-output 2>/dev/null | jq '{count:length,total_gib:(map((.size|tonumber)/1073741824)|add//0),items:[.[]|{id,name,status,type_id,size_gib:((.size|tonumber)/1073741824)}]}' || true
            yc vpc address list --folder-id "$F" --format json --no-user-output 2>/dev/null | jq '[.[]|{id,name,reserved,used,external_ipv4_address:(.external_ipv4_address.address//null)}]' || true

            echo '-- CONTAINERS --'
            CJSON="$(yc serverless container list --folder-id "$F" --format json --no-user-output 2>/dev/null || echo '[]')"
            echo "$CJSON" | jq '[.[]|{id,name,status,created_at}]'
            while read -r CID; do
              [ -n "$CID" ] || continue
              echo "CONTAINER=$CID"
              yc serverless container revision list --container-id "$CID" --format json --no-user-output 2>/dev/null | jq 'sort_by(.created_at)|map({id,created_at,status,resources,execution_timeout,concurrency,provision_policy})' || true
              Q1='"serverless.containers.execution_time_milliseconds_count"{service="serverless-containers",container="'"$CID"'"}'
              Q2='"serverless.containers.execution_time_milliseconds_sum"{service="serverless-containers",container="'"$CID"'"}'
              echo 'COUNT_INTERVAL'
              monitor_counter "$F" "$Q1" "$START"
              echo 'EXEC_MS_INTERVAL'
              monitor_counter "$F" "$Q2" "$START"
              echo 'COUNT_MONTH'
              monitor_counter "$F" "$Q1" "$MONTH"
              echo 'EXEC_MS_MONTH'
              monitor_counter "$F" "$Q2" "$MONTH"
            done < <(echo "$CJSON" | jq -r '.[].id')

            echo '-- TRIGGERS --'
            yc serverless trigger list --folder-id "$F" --format json --no-user-output 2>/dev/null | jq '[.[]|{id,name,status,created_at,rule}]' || true
            echo '-- API_GATEWAYS --'
            yc serverless api-gateway list --folder-id "$F" --format json --no-user-output 2>/dev/null | jq '[.[]|{id,name,status,created_at}]' || true

            echo '-- YDB --'
            yc ydb database list --folder-id "$F" --format json --no-user-output 2>/dev/null | jq '[.[]|{id,name,status,type,created_at}]' || true
            echo 'YDB_INTERVAL_5MIN_AVG_SUM'
            monitor_ydb "$F" "$START"
            echo 'YDB_MONTH_5MIN_AVG_SUM'
            monitor_ydb "$F" "$MONTH"

            echo '-- LOCKBOX --'
            SJSON="$(yc lockbox secret list --folder-id "$F" --format json --no-user-output 2>/dev/null || echo '[]')"
            echo "$SJSON" | jq '[.[]|{id,name,status}]'
            while read -r SID; do
              [ -n "$SID" ] || continue
              yc lockbox secret list-versions "$SID" --format json --no-user-output 2>/dev/null | jq --arg sid "$SID" '{secret_id:$sid,total_versions:length,versions:[.[]|{id,status,created_at,destroy_at}]}' || true
            done < <(echo "$SJSON" | jq -r '.[].id')

            echo '-- OBJECT_STORAGE --'
            BJSON="$(yc storage bucket list --folder-id "$F" --format json --no-user-output 2>/dev/null || echo '[]')"
            echo "$BJSON" | jq '[.[]|{name,created_at,max_size,default_storage_class}]'
            while read -r B; do
              [ -n "$B" ] || continue
              yc storage bucket stats "$B" --format json --no-user-output 2>/dev/null | jq '{name,used_size,default_storage_class,storage_class_used_sizes,storage_class_counters}' || true
            done < <(echo "$BJSON" | jq -r '.[].name')

            echo '-- REGISTRY --'
            RJSON="$(yc container registry list --folder-id "$F" --format json --no-user-output 2>/dev/null || echo '[]')"
            echo "$RJSON" | jq '[.[]|{id,name,status,created_at}]'
            while read -r RID; do
              [ -n "$RID" ] || continue
              yc container image list --registry-id "$RID" --format json --no-user-output 2>/dev/null | jq --arg rid "$RID" '{registry_id:$rid,image_count:length,compressed_sum_gib_upper_bound:((map((.compressed_size//"0")|tonumber)|add//0)/1073741824)}' || true
            done < <(echo "$RJSON" | jq -r '.[].id')

            echo '-- LOGGING --'
            yc logging group list --folder-id "$F" --format json --no-user-output 2>/dev/null | jq '[.[]|{id,name,status,retention_period,created_at}]' || true
          done

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/mon.json" "$RUNNER_TEMP/ydb.json"
