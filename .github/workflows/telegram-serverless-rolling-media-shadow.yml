name: Telegram Serverless Rolling Media Shadow

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-serverless-rolling-media-shadow.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-serverless-rolling-media-shadow
  cancel-in-progress: false

jobs:
  rolling-media-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create tg-rolling-media-shadow || true
          yc config profile activate tg-rolling-media-shadow
          yc config set service-account-key "$key"
          yc config set folder-id b1gk4p83brasi8g811jv

      - name: Build canonical V1 snapshot with strict media enrichment
        shell: bash
        run: |
          set -euo pipefail
          folder=b1gk4p83brasi8g811jv
          url="$(yc serverless container get telegram-reader-serverless-smoke --folder-id "$folder" --format json | jq -r '.url')"
          test -n "$url" && test "$url" != null
          url="${url%/}"
          token="$(yc iam create-token)"
          generated_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          date_from="$(date -u -d '192 hours ago' '+%Y-%m-%dT%H:%M:%SZ')"
          date_to="$generated_at"

          chats_raw="$(curl -fsS --retry 2 --retry-delay 2 --max-time 30 -H "Authorization: Bearer $token" "$url/internal/chats")"
          echo "$chats_raw" | jq -e '.chat_count==9 and (.chats|length)==9' >/dev/null

          work="$RUNNER_TEMP/tg-rolling-media"
          mkdir -p "$work"
          : > "$work/messages.ndjson"

          while read -r chat_id; do
            probe="$(curl -fsS --retry 2 --retry-delay 2 --max-time 45 -H "Authorization: Bearer $token" "$url/internal/chats/$chat_id/probe")"
            echo "$probe" | jq -e --argjson id "$chat_id" '.resolved==true and .chat_id==$id and (.name|length)>0' >/dev/null
            before=''
            page_no=0
            while :; do
              page_no=$((page_no+1))
              test "$page_no" -le 25 || { echo "Too many Telegram pages for chat $chat_id"; exit 1; }
              args=(--get --data-urlencode "date_from=$date_from" --data-urlencode "date_to=$date_to" --data-urlencode 'limit=2000')
              if [ -n "$before" ]; then args+=(--data-urlencode "before_id=$before"); fi
              page="$(curl -fsS --retry 2 --retry-delay 2 --max-time 110 -H "Authorization: Bearer $token" "${args[@]}" "$url/internal/chats/$chat_id/messages")"
              echo "$page" | jq -e --argjson id "$chat_id" '.chat_id==$id and (.messages|length)==.message_count' >/dev/null
              echo "$page" | jq -c --arg collected_at "$generated_at" '.messages[] + {username:null,collected_at:$collected_at}' >> "$work/messages.ndjson"
              full="$(echo "$page" | jq -r '.page_full')"
              next="$(echo "$page" | jq -r '.next_before_id // empty')"
              if [ "$full" != true ]; then break; fi
              test -n "$next" || { echo "Full page without cursor for chat $chat_id"; exit 1; }
              if [ -n "$before" ]; then test "$next" -lt "$before" || { echo "Non-decreasing cursor for chat $chat_id"; exit 1; }; fi
              before="$next"
            done
          done < <(echo "$chats_raw" | jq -r '.chats[].chat_id')

          if [ -s "$work/messages.ndjson" ]; then
            jq -s 'unique_by([.chat_id,.message_id]) | sort_by(.datetime) | reverse | .[:20000]' "$work/messages.ndjson" > "$work/messages.json"
          else
            echo '[]' > "$work/messages.json"
          fi

          : > "$work/assets.ndjson"
          jq -r '.[] | select(.media_type=="photo" or .media_type=="image" or .media_type=="gif" or .media_type=="animation") | [.chat_id,.message_id,.media_type] | @tsv' "$work/messages.json" \
          | while IFS=$'\t' read -r cid mid mtype; do
              test -n "$cid" && test -n "$mid" && test -n "$mtype"
              asset="$(curl -fsS --retry 2 --retry-delay 2 --max-time 105 -H "Authorization: Bearer $token" --get \
                --data-urlencode "media_type=$mtype" "$url/internal/chats/$cid/messages/$mid/media")"
              echo "$asset" | jq -e --argjson cid "$cid" --argjson mid "$mid" '
                .chat_id==$cid and .message_id==$mid and
                (.object_key|type)=="string" and (.object_key|length)>0 and
                (.media_url|type)=="string" and (.media_url|length)>0 and
                (.preview_object_key|type)=="string" and (.preview_object_key|length)>0 and
                (.preview_url|type)=="string" and (.preview_url|length)>0
              ' >/dev/null
              echo "$asset" | jq -c '{chat_id,message_id,media_asset:{media_type,size,object_key,media_url,preview_size,preview_object_key,preview_url}}' >> "$work/assets.ndjson"
            done

          supported_count="$(jq '[.[] | select(.media_type=="photo" or .media_type=="image" or .media_type=="gif" or .media_type=="animation")]|length' "$work/messages.json")"
          asset_count=0
          if [ -s "$work/assets.ndjson" ]; then asset_count="$(wc -l < "$work/assets.ndjson" | tr -d ' ')"; fi
          test "$asset_count" -eq "$supported_count"

          if [ -s "$work/assets.ndjson" ]; then
            jq -s 'map({key:((.chat_id|tostring)+":"+(.message_id|tostring)),value:.media_asset}) | from_entries' "$work/assets.ndjson" > "$work/assets.json"
          else
            echo '{}' > "$work/assets.json"
          fi

          jq --slurpfile assets "$work/assets.json" '
            $assets[0] as $a |
            map(. as $m | (($m.chat_id|tostring)+":"+($m.message_id|tostring)) as $k | .media_asset=($a[$k] // null))
          ' "$work/messages.json" > "$work/messages.enriched.json"

          media_count="$(jq '[.[]|select(.media_asset!=null)]|length' "$work/messages.enriched.json")"
          preview_count="$(jq '[.[]|select(.media_asset.preview_url? != null)]|length' "$work/messages.enriched.json")"
          test "$media_count" -eq "$supported_count"
          test "$preview_count" -eq "$media_count"
          test "$media_count" -ge 1

          jq -n \
            --arg schema TELEGRAM_NEWS_READER_V1 \
            --arg generated_at "$generated_at" \
            --argjson window_hours 192 \
            --argjson allowed_chats 9 \
            --argjson media_count "$media_count" \
            --argjson preview_count "$preview_count" \
            --slurpfile messages "$work/messages.enriched.json" \
            '{schema:$schema,generated_at:$generated_at,window_hours:$window_hours,allowed_chats:$allowed_chats,message_count:($messages[0]|length),media_message_count:$media_count,preview_message_count:$preview_count,messages:$messages[0]}' \
            > "$work/output.json"

          jq -e '
            .schema=="TELEGRAM_NEWS_READER_V1" and .window_hours==192 and .allowed_chats==9 and
            .message_count==(.messages|length) and .media_message_count==([.messages[]|select(.media_asset!=null)]|length) and
            .preview_message_count==([.messages[]|select(.media_asset.preview_url?!=null)]|length) and
            .media_message_count>=1 and .preview_message_count==.media_message_count and
            ([.messages[]|select((.media_type=="photo" or .media_type=="image" or .media_type=="gif" or .media_type=="animation") and .media_asset==null)]|length)==0 and
            ([.messages[]|[.chat_id,.message_id]]|length)==([.messages[]|[.chat_id,.message_id]]|unique|length)
          ' "$work/output.json" >/dev/null

          python - "$work/output.json" "$date_from" "$date_to" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          path,lo,hi=sys.argv[1:]
          def dt(v):
              x=datetime.fromisoformat(v.replace('Z','+00:00'))
              return (x if x.tzinfo else x.replace(tzinfo=timezone.utc)).astimezone(timezone.utc)
          low,high=dt(lo),dt(hi)
          data=json.load(open(path,encoding='utf-8'))
          for row in data['messages']:
              moment=dt(row['datetime'])
              if not low <= moment <= high:
                  raise SystemExit(f"message outside rolling window {row['chat_id']}/{row['message_id']}")
          print('SERVERLESS_ROLLING_MEDIA_RANGE_PASS')
          PY

          test_url="$(jq -r '[.messages[]|select(.media_asset.preview_url?!=null)][0].media_asset.preview_url' "$work/output.json")"
          test -n "$test_url" && test "$test_url" != null
          curl -fsS --max-time 30 "$test_url" -o "$work/preview.bin"
          test -s "$work/preview.bin"

          mkdir -p telegram-news-reader/export
          cp "$work/output.json" telegram-news-reader/export/TELEGRAM_NEWS_LATEST_SERVERLESS_MEDIA_SHADOW.json
          echo "SHADOW_MESSAGES=$(jq -r '.message_count' "$work/output.json")"
          echo "SHADOW_MEDIA=$media_count"
          echo "SHADOW_PREVIEWS=$preview_count"
          echo "SIGNED_PREVIEW_BYTES=$(wc -c < "$work/preview.bin")"
          echo SERVERLESS_ROLLING_MEDIA_SHADOW_PASS

      - name: Publish media shadow snapshot
        shell: bash
        run: |
          set -euo pipefail
          file=telegram-news-reader/export/TELEGRAM_NEWS_LATEST_SERVERLESS_MEDIA_SHADOW.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          if git diff --cached --quiet; then echo MEDIA_SHADOW_UNCHANGED; exit 0; fi
          git commit -m 'chore: update Telegram serverless media rolling shadow'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then echo MEDIA_SHADOW_PUBLISH_PASS; exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 2
          done
          exit 1

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json"
