name: Bridge v1 hotfix authenticated large download

on:
  push:
    paths:
      - 'tools/hotfix_bridge_v1_large_download.py'
      - '.github/workflows/bridge-v1-hotfix-large-download.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Bridge v1 large download transport
        run: python tools/hotfix_bridge_v1_large_download.py

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile shared/google-drive-bridge/python_client/bridge_client.py
          grep -q "mode || '') === 'range_chunk'" shared/google-drive-bridge/bridge.gs
          grep -q 'mode=range_chunk' shared/google-drive-bridge/PROTOCOL.md
          echo 'BRIDGE_V1_AUTHENTICATED_RANGE_PROXY_VALIDATE=PASS'

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shared/google-drive-bridge/bridge.gs shared/google-drive-bridge/python_client/bridge_client.py shared/google-drive-bridge/PROTOCOL.md
          if git diff --cached --quiet; then
            echo 'NO_PATCH_NEEDED=PASS'
            exit 0
          fi
          git commit -m 'Bridge v1: secure authenticated range proxy for large downloads'
          git push origin HEAD:main
