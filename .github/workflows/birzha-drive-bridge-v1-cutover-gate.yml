name: Birzha Google Drive Bridge v1 Cutover Gate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_ID: birzha
  EXPECTED_ROOT_ID: 1A7IzjXYSCWReZXdtrPZgZgLTnFIifsT2
  EXPECTED_BRIDGE_RELEASE: 1.0.0
  LOCKBOX_NAME: birzha-mcp-forecast-test-auth
  LOCKBOX_KEY: gdrive_bridge_v1_secret

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate stable common standard identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'protocol_version.*1' shared/google-drive-bridge/PROTOCOL.md
          grep -q 'bridge_release=1.0.0' shared/google-drive-bridge/VERSION
          grep -q "BRIDGE_RELEASE = '1.0.0'" shared/google-drive-bridge/bridge.gs
          ! grep -R -n 'NOT_IMPLEMENTED' shared/google-drive-bridge
          grep -q 'Project id: `birzha`' shared/google-drive-bridge/clients/birzha.md
          grep -q "rootId: '$EXPECTED_ROOT_ID'" shared/google-drive-bridge/deploy/birzha_config.gs
          grep -q 'sheetsEnabled: true' shared/google-drive-bridge/deploy/birzha_config.gs
          echo 'BIRZHA_SHARED_STANDARD=PASS'

      - name: Validate isolated readiness workflows
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            .github/workflows/birzha-drive-bridge-v1-bootstrap.yml \
            .github/workflows/birzha-drive-bridge-v1-acceptance.yml; do
            test -f "$f"
            grep -q 'workflow_dispatch:' "$f"
            grep -q "LOCKBOX_NAME: $LOCKBOX_NAME" "$f"
            grep -q "LOCKBOX_KEY: $LOCKBOX_KEY" "$f"
          done
          grep -q "EXPECTED_BRIDGE_RELEASE: $EXPECTED_BRIDGE_RELEASE" .github/workflows/birzha-drive-bridge-v1-acceptance.yml
          echo 'BIRZHA_READINESS_WORKFLOW_ISOLATION=PASS'

      - name: Validate Birzha runtime binding
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'gdrive_bridge_v1_secret' terraform/birzha_test/m24_autonomous_worker.tf
          grep -q 'm25_birzha_bridge_v1_url' terraform/birzha_test/m24_autonomous_worker.tf
          grep -q 'project Lockbox' terraform/birzha_test/m25_market_mirror.tf
          echo 'BIRZHA_V1_RUNTIME_BINDING=PASS'

      - name: Verify complete Sheets acceptance is a hard prerequisite
        shell: bash
        run: |
          set -euo pipefail
          for action in sheet_stage_begin sheet_write_chunk sheet_verify sheet_inspect sheet_commit sheet_abort; do
            grep -q "$action" shared/google-drive-bridge/PROTOCOL.md
          done
          grep -q 'stage replay destroyed staged rows' shared/google-drive-bridge/scripts/sheets_acceptance.py
          grep -q 'post-commit read-back parity failed' shared/google-drive-bridge/scripts/sheets_acceptance.py
          test -f shared/google-drive-bridge/scripts/cross_project_acceptance.py
          test -f .github/workflows/google-drive-bridge-v1-cross-project-acceptance.yml
          echo 'BIRZHA_CUTOVER_PRECONDITIONS_DOCUMENTED=PASS'

      - name: Gate result
        run: |
          echo 'BIRZHA_V1_STABLE_CUTOVER_GATE=PASS'
          echo 'Actual activation remains rollback-capable until live Sheets and cross-project acceptance pass.'
