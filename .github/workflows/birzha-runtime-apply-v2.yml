name: Deploy BIRZHA MCP TEST runtime v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/birzha-runtime-apply-v2.yml"
      - "terraform/birzha_test/**"

permissions:
  contents: read

concurrency:
  group: birzha-current-test-runtime
  cancel-in-progress: false

env:
  SOURCE_SHA: 86f5ca4a5d22c3c3c97b0c097f8dec75d99be56f
  IMAGE_DIGEST: sha256:25e401f6fc25572ee5d0ad5a2ba7282a798fbfdadfa5c04e02ce5404f3e5265b
  IMAGE_URL: cr.yandex/crpk5qvf4p7kcqil2u3v/birzha-mcp-forecast@sha256:25e401f6fc25572ee5d0ad5a2ba7282a798fbfdadfa5c04e02ce5404f3e5265b
  EXPECTED_REGISTRY_ID: crpk5qvf4p7kcqil2u3v

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 30
    steps:
      - name: Checkout infrastructure main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Assert immutable application coordinates
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$IMAGE_URL" == "cr.yandex/${EXPECTED_REGISTRY_ID}/birzha-mcp-forecast@${IMAGE_DIGEST}" ]]

      - name: Prepare ephemeral Yandex provider key
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "TF_VAR_yc_service_account_key_file=$KEY_FILE" >> "$GITHUB_ENV"
          echo "YC_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Initialize BIRZHA remote state
        shell: bash
        env:
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          terraform -chdir=terraform/birzha_test init -reconfigure -input=false -lockfile=readonly \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" \
            -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY"

      - name: Capture current gateway
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/birzha_test output -json > "$RUNNER_TEMP/before-outputs.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          o=json.loads((Path(os.environ['RUNNER_TEMP'])/'before-outputs.json').read_text())
          v=lambda k:o[k]['value']
          assert v('container_registry_id')==os.environ['EXPECTED_REGISTRY_ID']
          domain=v('api_gateway_domain').strip()
          endpoint=v('mcp_endpoint').strip()
          assert endpoint==f'https://{domain}/mcp'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'GATEWAY_DOMAIN={domain}\n')
              f.write(f'MCP_ENDPOINT={endpoint}\n')
          print('CURRENT_RUNTIME_GROUNDED')
          PY

      - name: Plan only approved security migration
        shell: bash
        run: |
          set -euo pipefail
          REAL_HOSTS="${GATEWAY_DOMAIN},${GATEWAY_DOMAIN}:*"
          set +e
          terraform -chdir=terraform/birzha_test plan -detailed-exitcode -input=false -no-color -out="$RUNNER_TEMP/security.tfplan" \
            -var="source_commit_sha=${SOURCE_SHA}" \
            -var="mcp_image_url=${IMAGE_URL}" \
            -var="mcp_allowed_hosts=${REAL_HOSTS}" \
            -var="mcp_allowed_origins=https://chatgpt.com" \
            -var="ydb_bootstrap_enabled=false" > "$RUNNER_TEMP/security-plan.txt"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 2 ]; then cat "$RUNNER_TEMP/security-plan.txt"; exit "$RC"; fi
          terraform -chdir=terraform/birzha_test show -json "$RUNNER_TEMP/security.tfplan" > "$RUNNER_TEMP/security-plan.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'security-plan.json').read_text())
          allowed={
            'yandex_lockbox_secret.mcp_auth',
            'yandex_lockbox_secret_version.mcp_auth',
            'yandex_lockbox_secret_iam_member.runtime_mcp_auth',
            'yandex_lockbox_secret_iam_member.deployer_mcp_auth',
            'yandex_lockbox_secret_iam_member.deployer_mcp_auth_metadata',
            'yandex_iam_service_account_iam_member.terraform_runtime_user',
            'yandex_serverless_container.mcp[0]',
          }
          changed=[]
          for rc in d.get('resource_changes',[]):
              actions=rc.get('change',{}).get('actions',[])
              if actions==['no-op']: continue
              addr=rc['address']; changed.append((addr,actions))
              assert addr in allowed, (addr,actions)
              assert 'delete' not in actions, (addr,actions)
              assert actions in (['create'],['update']), (addr,actions)
          print('APPROVED_SECURITY_PLAN', changed)
          PY
          echo "PLAN_RC=$RC" >> "$GITHUB_ENV"

      - name: Apply approved migration when needed
        if: env.PLAN_RC == '2'
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/birzha_test apply -input=false -auto-approve "$RUNNER_TEMP/security.tfplan"

      - name: Capture secured runtime outputs
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/birzha_test output -json > "$RUNNER_TEMP/outputs.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          o=json.loads((Path(os.environ['RUNNER_TEMP'])/'outputs.json').read_text()); v=lambda k:o[k]['value']
          required=('test_folder_id','container_registry_id','runtime_service_account_id','gateway_service_account_id','ydb_database_id','mcp_auth_secret_id','mcp_auth_secret_version_id','serverless_container_id','api_gateway_id','api_gateway_domain','mcp_endpoint')
          for k in required: assert v(k), k
          assert v('container_registry_id')==os.environ['EXPECTED_REGISTRY_ID']
          assert v('api_gateway_domain').strip()==os.environ['GATEWAY_DOMAIN']
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'MCP_AUTH_SECRET_ID={v("mcp_auth_secret_id")}\n')
              f.write(f'MCP_AUTH_VERSION_ID={v("mcp_auth_secret_version_id")}\n')
          print('SECURED_OUTPUTS_PASS')
          PY

      - name: Wait for public health and private MCP
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="https://${GATEWAY_DOMAIN}/healthz"
          for i in $(seq 1 30); do
            if curl --proto '=https' --tlsv1.2 --silent --show-error --fail --max-time 15 "$HEALTH" > "$RUNNER_TEMP/health.json"; then
              if python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'health.json').read_text())
          assert d.get('status')=='ok' and d.get('state_backend')=='ydb', d
          PY
              then break; fi
            fi
            sleep 5
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'health.json').read_text())
          assert d.get('status')=='ok' and d.get('state_backend')=='ydb', d
          print('PUBLIC_HEALTH_PASS')
          PY
          CODE="$(curl --proto '=https' --tlsv1.2 --silent --output "$RUNNER_TEMP/unauth.json" --write-out '%{http_code}' --max-time 15 "$MCP_ENDPOINT")"
          echo "UNAUTH_HTTP_CODE=$CODE"
          if [ "$CODE" != "401" ]; then cat "$RUNNER_TEMP/unauth.json" || true; exit 1; fi
          echo UNAUTHENTICATED_MCP_BLOCKED

      - name: Install acceptance clients
        run: python -m pip install --disable-pip-version-check 'mcp==2.1.1' 'yandexcloud'

      - name: Read generated token only for masked acceptance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import yandexcloud
          from yandex.cloud.lockbox.v1.payload_service_pb2 import GetPayloadRequest
          from yandex.cloud.lockbox.v1.payload_service_pb2_grpc import PayloadServiceStub
          key=json.loads(Path(os.environ['YC_KEY_FILE']).read_text())
          sdk=yandexcloud.SDK(service_account_key=key)
          service=sdk.client(PayloadServiceStub)
          payload=service.Get(GetPayloadRequest(secret_id=os.environ['MCP_AUTH_SECRET_ID'], version_id=os.environ['MCP_AUTH_VERSION_ID']))
          values=[e.text_value for e in payload.entries if e.key=='bearer_token']
          assert len(values)==1 and len(values[0])>=48
          token=values[0]
          print(f'::add-mask::{token}')
          p=Path(os.environ['RUNNER_TEMP'])/'mcp-token'; p.write_text(token); p.chmod(0o600)
          print('MASKED_TOKEN_READY')
          PY

      - name: Prove authorized MCP, real MOEX, global pacing and durable Forecast
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio, json, os
          from pathlib import Path
          import httpx
          from mcp import Client
          from mcp.client.streamable_http import streamable_http_client

          async def main():
              token=(Path(os.environ['RUNNER_TEMP'])/'mcp-token').read_text()
              async with httpx.AsyncClient(headers={'Authorization':f'Bearer {token}'}) as hc:
                  transport=streamable_http_client(os.environ['MCP_ENDPOINT'], http_client=hc)
                  async with Client(transport) as client:
                      listed=await client.list_tools(); names={t.name for t in listed.tools}
                      required={'system.version','market.resolve_instrument','market.snapshot','forecast.create','forecast.get','forecast.list','validation.assess_model'}
                      assert not required-names, required-names
                      resolved=await client.call_tool('market.resolve_instrument', {'symbol':'SBER'})
                      assert not resolved.is_error and resolved.structured_content['secid']=='SBER', resolved
                      created=await client.call_tool('forecast.create', {'symbol':'SBER'})
                      assert not created.is_error, created
                      payload=created.structured_content; forecast=payload.get('forecast') or payload
                      fid=forecast.get('forecast_id'); assert fid
                      assert payload.get('storage_scope')=='distributed'
                      fetched=await client.call_tool('forecast.get', {'forecast_id':fid})
                      assert not fetched.is_error and fetched.structured_content.get('forecast_id')==fid
                      print(json.dumps({'authorized_mcp':'PASS','real_moex':'PASS','distributed_rate_gate':'PASS','durable_forecast':'PASS','forecast_id':fid},sort_keys=True))
          asyncio.run(main())
          PY

      - name: Re-assert zero Terraform drift
        shell: bash
        run: |
          set -euo pipefail
          REAL_HOSTS="${GATEWAY_DOMAIN},${GATEWAY_DOMAIN}:*"
          set +e
          terraform -chdir=terraform/birzha_test plan -detailed-exitcode -input=false -no-color \
            -var="source_commit_sha=${SOURCE_SHA}" \
            -var="mcp_image_url=${IMAGE_URL}" \
            -var="mcp_allowed_hosts=${REAL_HOSTS}" \
            -var="mcp_allowed_origins=https://chatgpt.com" \
            -var="ydb_bootstrap_enabled=false" > "$RUNNER_TEMP/post-drift.txt"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then cat "$RUNNER_TEMP/post-drift.txt"; exit "$RC"; fi
          echo POST_ACCEPTANCE_DRIFT_NONE

      - name: Write deployment evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          r=Path(os.environ['RUNNER_TEMP']); o=json.loads((r/'outputs.json').read_text()); v=lambda k:o[k]['value']
          e={
            'schema':'BIRZHA_MCP_TEST_DEPLOYMENT_V6',
            'timestamp_utc':datetime.now(timezone.utc).isoformat(),
            'infra_sha':os.environ['GITHUB_SHA'],
            'application_source_sha':os.environ['SOURCE_SHA'],
            'image_digest':os.environ['IMAGE_DIGEST'],
            'folder_id':v('test_folder_id'),
            'ydb_database_id':v('ydb_database_id'),
            'serverless_container_id':v('serverless_container_id'),
            'api_gateway_id':v('api_gateway_id'),
            'mcp_endpoint':v('mcp_endpoint'),
            'mcp_auth_secret_id':v('mcp_auth_secret_id'),
            'mcp_auth_secret_version_id':v('mcp_auth_secret_version_id'),
            'acceptance':{
              'public_health':'PASS',
              'unauthenticated_mcp':'BLOCKED_401',
              'authorized_mcp':'PASS',
              'real_moex':'PASS',
              'distributed_request_pacing':'PASS',
              'durable_forecast_roundtrip':'PASS',
              'terraform_postcheck':'NO_DRIFT'
            }
          }
          (r/'evidence'/'deployment.json').write_text(json.dumps(e,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload deployment evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: birzha-mcp-test-deployment-evidence-v6
          path: ${{ runner.temp }}/evidence/deployment.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove ephemeral credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/mcp-token"
