name: Yandex Lockbox version audit temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yandex-lockbox-version-audit-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 4
    steps:
      - name: Install YC CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"
      - name: Authenticate and count Lockbox versions
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"
          chmod 600 "$RUNNER_TEMP/key.json"
          yc config profile create lockbox-cost-audit || true
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          yc config set cloud-id b1gi4pr9msenirafh2c7
          for ITEM in \
            'birzha-mcp-forecast-test:b1g00gqb66tbnfoumnkv' \
            'marketplaces-mcp-test:b1gnd0dqoq3ljod88i8t' \
            'telegram-news-reader:b1gk4p83brasi8g811jv'; do
            N="${ITEM%%:*}"; F="${ITEM##*:}"
            echo "=== $N ==="
            S="$(yc lockbox secret list --folder-id "$F" --format json --no-user-output)"
            echo "$S" | jq '[.[]|{id,name,status,current_version_id}]'
            echo "$S" | jq -r '.[].id' | while read -r SID; do
              V="$(yc lockbox secret list-versions "$SID" --format json --no-user-output)"
              echo "$V" | jq --arg sid "$SID" '{secret_id:$sid,total_versions:length,active_versions:([.[]|select((.status//"")!="DESTROYED")]|length),statuses:[.[].status]}'
            done
          done
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json"
