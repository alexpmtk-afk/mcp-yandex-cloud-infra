name: BIRZHA YDB Billing Suspension Diagnostic

on:
  push:
    branches: [birzha-ydb-resume-20260914-v2]
    paths: ['.github/workflows/birzha-ydb-permission-diagnostic-once.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 12
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --fail --silent --show-error --retry 5 --retry-all-errors -o "$RUNNER_TEMP/yc.tgz" 'https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate diagnostic identity
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          DEPLOYER_ID="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          test "$DEPLOYER_ID" = 'ajecdjjrkdo1t3itpl9k'
          yc config profile create birzha-ydb-billing-diag || true
          yc config set service-account-key "$KEY_FILE"
          echo 'YC_AUTH=PASS'

      - name: Inspect exact cloud folder and YDB state
        shell: bash
        env:
          CLOUD_ID: b1gi4pr9msenirafh2c7
          FOLDER_ID: b1g00gqb66tbnfoumnkv
          YDB_ID: etnes7omhgut11oulsd5
        run: |
          set -euo pipefail
          yc resource-manager cloud get "$CLOUD_ID" --format json > "$RUNNER_TEMP/cloud.json"
          yc resource-manager folder get "$FOLDER_ID" --format json > "$RUNNER_TEMP/folder.json"
          yc ydb database get --id "$YDB_ID" --format json > "$RUNNER_TEMP/db.json"
          echo "CLOUD_STATUS=$(jq -r '.status // "UNSET"' "$RUNNER_TEMP/cloud.json")"
          echo "FOLDER_STATUS=$(jq -r '.status // "UNSET"' "$RUNNER_TEMP/folder.json")"
          echo "YDB_STATUS=$(jq -r '.status // "UNSET"' "$RUNNER_TEMP/db.json")"
          echo "YDB_TYPE=$(jq -r 'if .serverless_database then "SERVERLESS" elif .dedicated_database then "DEDICATED" else "UNKNOWN" end' "$RUNNER_TEMP/db.json")"
          echo "YDB_DELETION_PROTECTION=$(jq -r '.deletion_protection // .deletionProtection // "UNSET"' "$RUNNER_TEMP/db.json")"
          jq -c '{id,name,status,folder_id,created_at,serverless_database,labels}' "$RUNNER_TEMP/db.json" || true

      - name: Inspect billing visibility and status
        shell: bash
        run: |
          set -euo pipefail
          set +e
          yc billing account list --format json > "$RUNNER_TEMP/billing.json" 2> "$RUNNER_TEMP/billing.err"
          RC=$?
          set -e
          echo "BILLING_LIST_RC=$RC"
          if [[ "$RC" -eq 0 ]]; then
            jq -c '.[]? | {id,name,status,country_code,currency}' "$RUNNER_TEMP/billing.json" || true
          else
            sed -n '1,8p' "$RUNNER_TEMP/billing.err"
          fi

      - name: Recheck access policy visibility
        shell: bash
        env:
          CLOUD_ID: b1gi4pr9msenirafh2c7
          FOLDER_ID: b1g00gqb66tbnfoumnkv
        run: |
          set -euo pipefail
          ORG_ID="$(jq -r '.organization_id // .organizationId // empty' "$RUNNER_TEMP/cloud.json")"
          echo "ORG_ID=$ORG_ID"
          for scope in cloud folder org; do
            case "$scope" in
              cloud) CMD=(yc resource-manager cloud list-access-policy-bindings "$CLOUD_ID" --format json) ;;
              folder) CMD=(yc resource-manager folder list-access-policy-bindings "$FOLDER_ID" --format json) ;;
              org) CMD=(yc organization-manager organization list-access-policy-bindings --id "$ORG_ID" --format json) ;;
            esac
            set +e
            "${CMD[@]}" > "$RUNNER_TEMP/${scope}-policies.json" 2> "$RUNNER_TEMP/${scope}-policies.err"
            RC=$?
            set -e
            echo "${scope^^}_POLICY_RC=$RC"
            if [[ "$RC" -eq 0 ]]; then jq -c '.[]?' "$RUNNER_TEMP/${scope}-policies.json" || true; else sed -n '1,5p' "$RUNNER_TEMP/${scope}-policies.err"; fi
          done
          echo 'DIAGNOSTIC_ONLY=PASS'

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP"/*.json "$RUNNER_TEMP"/*.err
