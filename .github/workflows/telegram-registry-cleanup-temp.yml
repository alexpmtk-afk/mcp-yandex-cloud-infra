name: Telegram Registry Cleanup Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/telegram-registry-cleanup-temp.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-registry-cleanup || true
          yc config profile activate telegram-registry-cleanup
          yc config set service-account-key "$key"
          yc config set folder-id b1gk4p83brasi8g811jv

      - name: Production image safety gate
        shell: bash
        run: |
          set -euo pipefail
          folder=b1gk4p83brasi8g811jv
          registry=crphagvid8e8g5pp4fpe

          active_reader_id=crpttddondkva0249ck1
          active_reader_digest='sha256:1777742d65d8ff0a26e6bac64d4cb806c124799c172488890b6065034edcd5ff'
          rollback_reader_1=crp5f3l4odahojjing58
          rollback_reader_2=crp4hlidsd72g7kuu9oc
          active_media_id=crpguje4oluuh2e7m3qn
          active_media_digest='sha256:a02891fa7f16c9eebcb1013b8cbf3fa33f7d65d7b201384756abe5abd3d6f56c'

          reader="$(yc serverless container revision list --container-name telegram-reader-serverless --folder-id "$folder" --format json)"
          media="$(yc serverless container revision list --container-name telegram-reader-media --folder-id "$folder" --format json)"
          test "$(echo "$reader" | jq 'length')" -eq 1
          test "$(echo "$media" | jq 'length')" -eq 1
          echo "$reader" | jq -e --arg d "$active_reader_digest" '.[0].status=="ACTIVE" and .[0].image.image_digest==$d' >/dev/null
          echo "$media" | jq -e --arg d "$active_media_digest" '.[0].status=="ACTIVE" and .[0].image.image_digest==$d' >/dev/null

          yc container image list --registry-id "$registry" --folder-id "$folder" --limit 1000 --format json > "$RUNNER_TEMP/images-before.json"
          test "$(jq 'length' "$RUNNER_TEMP/images-before.json")" -eq 62
          total="$(jq '[.[].compressed_size|tonumber]|add' "$RUNNER_TEMP/images-before.json")"
          test "$total" -eq 9013979713

          jq -e --arg id "$active_reader_id" --arg d "$active_reader_digest" 'any(.[]; .id==$id and .digest==$d and (.name|endswith("/telegram-news-reader")))' "$RUNNER_TEMP/images-before.json" >/dev/null
          jq -e --arg id "$active_media_id" --arg d "$active_media_digest" 'any(.[]; .id==$id and .digest==$d and (.name|endswith("/telegram-reader-media")))' "$RUNNER_TEMP/images-before.json" >/dev/null
          jq -e --arg id "$rollback_reader_1" 'any(.[]; .id==$id and (.name|endswith("/telegram-news-reader")))' "$RUNNER_TEMP/images-before.json" >/dev/null
          jq -e --arg id "$rollback_reader_2" 'any(.[]; .id==$id and (.name|endswith("/telegram-news-reader")))' "$RUNNER_TEMP/images-before.json" >/dev/null

          jq -r --arg a "$active_reader_id" --arg b "$rollback_reader_1" --arg c "$rollback_reader_2" --arg d "$active_media_id" '.[] | select(.id!=$a and .id!=$b and .id!=$c and .id!=$d) | .id' "$RUNNER_TEMP/images-before.json" > "$RUNNER_TEMP/delete-ids.txt"
          test "$(wc -l < "$RUNNER_TEMP/delete-ids.txt" | tr -d ' ')" -eq 58

          delete_bytes="$(jq --arg a "$active_reader_id" --arg b "$rollback_reader_1" --arg c "$rollback_reader_2" --arg d "$active_media_id" '[.[] | select(.id!=$a and .id!=$b and .id!=$c and .id!=$d) | (.compressed_size|tonumber)] | add' "$RUNNER_TEMP/images-before.json")"
          keep_bytes="$(jq --arg a "$active_reader_id" --arg b "$rollback_reader_1" --arg c "$rollback_reader_2" --arg d "$active_media_id" '[.[] | select(.id==$a or .id==$b or .id==$c or .id==$d) | (.compressed_size|tonumber)] | add' "$RUNNER_TEMP/images-before.json")"
          test "$delete_bytes" -eq 8126990124
          test "$keep_bytes" -eq 886989589
          echo "REGISTRY_DELETE_COUNT=58"
          echo "REGISTRY_DELETE_COMPRESSED_BYTES=$delete_bytes"
          echo "REGISTRY_KEEP_COUNT=4"
          echo "REGISTRY_KEEP_COMPRESSED_BYTES=$keep_bytes"
          echo REGISTRY_PRODUCTION_IMAGE_GATE_PASS

      - name: Delete only audited unused image IDs
        shell: bash
        run: |
          set -euo pipefail
          n=0
          while read -r id; do
            test -n "$id"
            yc container image delete "$id" >/dev/null
            n=$((n+1))
          done < "$RUNNER_TEMP/delete-ids.txt"
          test "$n" -eq 58
          echo "REGISTRY_DELETE_ACCEPTED=$n"
          echo TELEGRAM_REGISTRY_DELETE_PASS

      - name: Verify production images remain
        shell: bash
        run: |
          set -euo pipefail
          folder=b1gk4p83brasi8g811jv
          registry=crphagvid8e8g5pp4fpe
          for id in crpttddondkva0249ck1 crp5f3l4odahojjing58 crp4hlidsd72g7kuu9oc crpguje4oluuh2e7m3qn; do
            yc container image get "$id" --folder-id "$folder" >/dev/null
          done

          reader="$(yc serverless container revision list --container-name telegram-reader-serverless --folder-id "$folder" --format json)"
          media="$(yc serverless container revision list --container-name telegram-reader-media --folder-id "$folder" --format json)"
          echo "$reader" | jq -e '.[0].status=="ACTIVE" and .[0].image.image_digest=="sha256:1777742d65d8ff0a26e6bac64d4cb806c124799c172488890b6065034edcd5ff"' >/dev/null
          echo "$media" | jq -e '.[0].status=="ACTIVE" and .[0].image.image_digest=="sha256:a02891fa7f16c9eebcb1013b8cbf3fa33f7d65d7b201384756abe5abd3d6f56c"' >/dev/null

          # Listing can lag while deletion is finalized; it must never lose a keep image.
          yc container image list --registry-id "$registry" --folder-id "$folder" --limit 1000 --format json > "$RUNNER_TEMP/images-after.json"
          for id in crpttddondkva0249ck1 crp5f3l4odahojjing58 crp4hlidsd72g7kuu9oc crpguje4oluuh2e7m3qn; do
            jq -e --arg id "$id" 'any(.[]; .id==$id)' "$RUNNER_TEMP/images-after.json" >/dev/null
          done
          echo "REGISTRY_VISIBLE_AFTER_DELETE=$(jq 'length' "$RUNNER_TEMP/images-after.json")"
          echo TELEGRAM_REGISTRY_KEEP_IMAGES_PASS

      - name: Cleanup credential file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/images-before.json" "$RUNNER_TEMP/images-after.json" "$RUNNER_TEMP/delete-ids.txt"
