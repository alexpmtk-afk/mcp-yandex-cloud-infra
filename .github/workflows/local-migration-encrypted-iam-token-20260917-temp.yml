name: Local migration encrypted IAM token 2026-09-17

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/local-migration-encrypted-iam-token-20260917-temp.yml"

permissions:
  contents: read

env:
  MIGRATION_PUBLIC_KEY_B64: 

jobs:
  mint-encrypted-token:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    env:
      YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
    steps:
      - name: Install crypto dependencies
        run: python -m pip install --quiet PyJWT cryptography

      - name: Mint IAM token and emit encrypted envelope only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.request
          import jwt
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          key = json.loads(os.environ['YC_SERVICE_ACCOUNT_KEY_JSON'])
          for field in ('service_account_id', 'private_key', 'id'):
              if not key.get(field):
                  raise RuntimeError(f'missing service-account field: {field}')

          now = int(time.time())
          signed = jwt.encode(
              {
                  'aud': 'https://iam.api.cloud.yandex.net/iam/v1/tokens',
                  'iss': key['service_account_id'],
                  'iat': now,
                  'exp': now + 3600,
              },
              key['private_key'],
              algorithm='PS256',
              headers={'kid': key['id']},
          )
          request = urllib.request.Request(
              'https://iam.api.cloud.yandex.net/iam/v1/tokens',
              data=json.dumps({'jwt': signed}).encode('utf-8'),
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.loads(response.read())['iamToken']
          if not token:
              raise RuntimeError('empty IAM token')

          public_pem = base64.b64decode(os.environ['MIGRATION_PUBLIC_KEY_B64'])
          public_key = serialization.load_pem_public_key(public_pem)
          aes_key = AESGCM.generate_key(bit_length=256)
          nonce = os.urandom(12)
          aad = b'mcp-yandex-local-migration-20260917'
          ciphertext = AESGCM(aes_key).encrypt(nonce, token.encode('utf-8'), aad)
          encrypted_key = public_key.encrypt(
              aes_key,
              padding.OAEP(
                  mgf=padding.MGF1(algorithm=hashes.SHA256()),
                  algorithm=hashes.SHA256(),
                  label=None,
              ),
          )
          envelope = {
              'v': 1,
              'ek': base64.b64encode(encrypted_key).decode('ascii'),
              'nonce': base64.b64encode(nonce).decode('ascii'),
              'ct': base64.b64encode(ciphertext).decode('ascii'),
          }
          packed = base64.b64encode(json.dumps(envelope, separators=(',', ':')).encode('utf-8')).decode('ascii')
          print('MIGRATION_ENVELOPE_B64=' + packed)
          print('YANDEX_IAM_TOKEN_ENCRYPTED=PASS')
          PY
