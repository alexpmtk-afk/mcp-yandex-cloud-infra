name: Telegram Billing Access Probe
on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-billing-access-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 8
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Authenticate and probe
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set +e
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          sa_id=$(jq -r '.service_account_id // .serviceAccountId // empty' "$key")
          echo "SERVICE_ACCOUNT_ID=$sa_id"
          yc config profile create tg-billing-probe || true
          yc config profile activate tg-billing-probe
          yc config set service-account-key "$key"
          folder=b1gk4p83brasi8g811jv
          echo '=== TRY READ-ONLY FOLDER USAGE ROLE ==='
          yc resource-manager folder add-access-binding "$folder" --role billing.usagerecords.admin --service-account-id "$sa_id"
          echo "ROLE_GRANT_EXIT=$?"
          echo '=== BILLING REPORT RETRY ==='
          yc billing consumption-core get-resource-usage-report d01fl7g1trd2i5d8l7r6 --start-date 2026-09-01T00:00:00Z --end-date 2026-09-16T23:59:59Z --folder-ids "$folder" --aggregation-period month --format json
          echo "REPORT_EXIT=$?"
