name: Telegram Manager Repair 2026-09-17

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-manager-repair-20260917.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 45
    env:
      FOLDER_ID: b1gk4p83brasi8g811jv
      READER_NAME: telegram-reader-serverless
      READER_ID: bbah0r3tpgdirfnpogv7
      RUNTIME_SA: ajeaad0m00gncv22tagf
      SECRET_ID: e6qnt0bt655jltrr5sid
      REGISTRY_ID: crphagvid8e8g5pp4fpe
      GATEWAY_NAME: telegram-reader-manager
      GATEWAY_SA_NAME: telegram-reader-manager-gateway
      SOURCE_BRANCH: telegram-manager-serverless-20260917
      TEMP_MANAGER_KEY: telegram-manager-repair-acceptance-20260917
      TEMP_MANAGER_HASH: 21bfa65ecd076b6a4a3c919b8f3561931b372c2ded3e771f738760a5f83e06fc
      FINAL_MANAGER_HASH: 91e76580136eb118f07f1eaf3c8bb2c6b05e86afce27e511271bf20c4d3b2b45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Validate updated manager source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            telegram-news-reader/app/admin_page.py \
            telegram-news-reader/app/lockbox_runtime.py \
            telegram-news-reader/app/manager_extension.py \
            telegram-news-reader/app/serverless_bootstrap.py \
            telegram-news-reader/app/service.py \
            telegram-news-reader/app/telegram_client.py
          grep -q 'localStorage' telegram-news-reader/app/admin_page.py
          grep -q '_SAFE_DIRECT_PAGE_SIZE = 250' telegram-news-reader/app/manager_extension.py
          grep -q 'app.manager_extension:app' telegram-news-reader/app/serverless_bootstrap.py
          echo MANAGER_REPAIR_SOURCE_VALIDATE_PASS

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate to Yandex Cloud
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-manager-repair || true
          yc config profile activate telegram-manager-repair
          yc config set service-account-key "$key"
          yc config set folder-id "$FOLDER_ID"
          yc serverless container get "$READER_NAME" --folder-id "$FOLDER_ID" >/dev/null
          yc serverless api-gateway get --name "$GATEWAY_NAME" --folder-id "$FOLDER_ID" >/dev/null
          echo YANDEX_CLOUD_AVAILABLE_PASS

      - name: Audit current production before repair
        shell: bash
        run: |
          set -euo pipefail
          reader_json="$(yc serverless container get "$READER_NAME" --folder-id "$FOLDER_ID" --format json)"
          reader_url="$(echo "$reader_json" | jq -r '.url')"
          reader_url="${reader_url%/}"
          test -n "$reader_url" && test "$reader_url" != null
          cloud_token="$(yc iam create-token)"
          ok=0
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 30 -H "Authorization: Bearer $cloud_token" "$reader_url/health" -o "$RUNNER_TEMP/pre-health.json" 2>/dev/null; then
              if jq -e '.status=="ok" and .telegram_authorized==true and .allowed_chats>=1 and .media_storage=="enabled"' "$RUNNER_TEMP/pre-health.json" >/dev/null; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" -eq 1
          gateway_json="$(yc serverless api-gateway get --name "$GATEWAY_NAME" --folder-id "$FOLDER_ID" --format json)"
          gateway_domain="$(echo "$gateway_json" | jq -r '.domain')"
          test -n "$gateway_domain" && test "$gateway_domain" != null
          gateway_url="https://$gateway_domain"
          page_code="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/pre-manage.html" -w '%{http_code}' "$gateway_url/manage" || true)"
          test "$page_code" = 200
          echo "READER_URL=$reader_url" >> "$GITHUB_ENV"
          echo "GATEWAY_URL=$gateway_url" >> "$GITHUB_ENV"
          echo "PRE_REPAIR_ALLOWED=$(jq -r '.allowed_chats' "$RUNNER_TEMP/pre-health.json")"
          echo PRE_REPAIR_LIVE_AUDIT_PASS

      - name: Ensure Reader may persist managed whitelist
        shell: bash
        run: |
          set -euo pipefail
          yc lockbox secret add-access-binding \
            --id "$SECRET_ID" \
            --service-account-id "$RUNTIME_SA" \
            --role lockbox.editor >/dev/null || true
          bindings="$(yc lockbox secret list-access-bindings --id "$SECRET_ID" --format json)"
          echo "$bindings" | jq -e --arg sa "$RUNTIME_SA" 'any(.[]?; .role_id=="lockbox.editor" and .subject.id==$sa and .subject.type=="serviceAccount")' >/dev/null
          echo READER_LOCKBOX_PERSIST_PERMISSION_PASS

      - name: Install temporary acceptance key
        shell: bash
        run: |
          set -euo pipefail
          yc lockbox secret add-version \
            --id "$SECRET_ID" \
            --description 'Temporary Telegram manager repair acceptance key' \
            --payload "[{\"key\":\"MANAGE_TOKEN_SHA256\",\"text_value\":\"$TEMP_MANAGER_HASH\"}]" >/dev/null
          echo TEMP_MANAGER_KEY_INSTALLED_PASS

      - name: Build and push repaired Reader image
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse --short=12 HEAD)"
          image="cr.yandex/$REGISTRY_ID/telegram-news-reader:manager-repair-$source_sha"
          yc iam create-token | docker login --username iam --password-stdin cr.yandex >/dev/null
          docker build -t "$image" telegram-news-reader
          docker push "$image" >/dev/null
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo REPAIRED_READER_IMAGE_PUSH_PASS

      - name: Deploy repaired private Reader
        shell: bash
        run: |
          set -euo pipefail
          yc serverless container revision deploy \
            --folder-id "$FOLDER_ID" \
            --container-name "$READER_NAME" \
            --runtime http \
            --image "$IMAGE" \
            --cores 1 \
            --memory 512MB \
            --concurrency 1 \
            --execution-timeout 120s \
            --service-account-id "$RUNTIME_SA" \
            --environment TELEGRAM_DATABASE_PATH=/tmp/telegram.db \
            --environment TELEGRAM_SESSION_PATH=/tmp/telegram_news \
            --environment TELEGRAM_MEDIA_PATH=/tmp/media \
            --environment COLLECTOR_ENABLED=false \
            --environment LOCKBOX_RUNTIME_SECRET_ID="$SECRET_ID" >/dev/null
          cloud_token="$(yc iam create-token)"
          ok=0
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 30 -H "Authorization: Bearer $cloud_token" "$READER_URL/health" -o "$RUNNER_TEMP/deployed-health.json" 2>/dev/null; then
              if jq -e '.status=="ok" and .telegram_authorized==true and .allowed_chats>=1 and .media_storage=="enabled"' "$RUNNER_TEMP/deployed-health.json" >/dev/null; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" -eq 1
          echo REPAIRED_READER_DEPLOY_PASS

      - name: Reconcile manager-only API Gateway
        shell: bash
        run: |
          set -euo pipefail
          gateway_sa="$(yc iam service-account list --folder-id "$FOLDER_ID" --format json | jq -r --arg n "$GATEWAY_SA_NAME" '.[]|select(.name==$n)|.id' | head -1)"
          test -n "$gateway_sa"
          yc serverless container add-access-binding \
            --id "$READER_ID" \
            --service-account-id "$gateway_sa" \
            --role serverless-containers.containerInvoker >/dev/null || true
          spec="$RUNNER_TEMP/manager-gateway.yaml"
          cat > "$spec" <<EOF
          openapi: 3.0.0
          info:
            title: Telegram Reader Manager
            version: 1.1.0
          paths:
            /manage:
              get:
                responses:
                  '200':
                    description: Manager page
                x-yc-apigateway-integration:
                  type: serverless_containers
                  container_id: $READER_ID
                  service_account_id: $gateway_sa
            /api/admin/dialogs:
              get:
                responses:
                  '200':
                    description: Dialog list
                x-yc-apigateway-integration:
                  type: serverless_containers
                  container_id: $READER_ID
                  service_account_id: $gateway_sa
            /api/admin/whitelist:
              post:
                responses:
                  '200':
                    description: Save allow-list
                x-yc-apigateway-integration:
                  type: serverless_containers
                  container_id: $READER_ID
                  service_account_id: $gateway_sa
          EOF
          gateway_id="$(yc serverless api-gateway get --name "$GATEWAY_NAME" --folder-id "$FOLDER_ID" --format json | jq -r '.id')"
          yc serverless api-gateway update --id "$gateway_id" --spec "$spec" --no-logging >/dev/null
          echo MANAGER_GATEWAY_RECONCILE_PASS

      - name: Validate page and durable no-op whitelist save
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 18); do
            code="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/manage.html" -w '%{http_code}' "$GATEWAY_URL/manage" || true)"
            if [ "$code" = 200 ] && grep -q 'Список сохраняется постоянно' "$RUNNER_TEMP/manage.html" && grep -q 'Забыть ключ на этом компьютере' "$RUNNER_TEMP/manage.html"; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          test "$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$GATEWAY_URL/api/admin/dialogs")" = 401
          test "$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$GATEWAY_URL/internal/chats")" = 404

          curl -fsS --max-time 90 -H "x-admin-token: $TEMP_MANAGER_KEY" "$GATEWAY_URL/api/admin/dialogs" -o "$RUNNER_TEMP/dialogs-before.json"
          jq -e '.dialogs|type=="array" and length>=1' "$RUNNER_TEMP/dialogs-before.json" >/dev/null
          jq -e '.selected|type=="array" and length>=1' "$RUNNER_TEMP/dialogs-before.json" >/dev/null
          jq -c '{chat_ids:(.selected|sort)}' "$RUNNER_TEMP/dialogs-before.json" > "$RUNNER_TEMP/save.json"
          curl -fsS --max-time 110 \
            -H "x-admin-token: $TEMP_MANAGER_KEY" \
            -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/save.json" \
            "$GATEWAY_URL/api/admin/whitelist" -o "$RUNNER_TEMP/saved.json"
          expected="$(jq '.selected|length' "$RUNNER_TEMP/dialogs-before.json")"
          jq -e --argjson expected "$expected" '.status=="saved" and .allowed_chats==$expected' "$RUNNER_TEMP/saved.json" >/dev/null
          echo "ACCEPTANCE_SELECTED=$expected"
          echo MANAGER_DURABLE_SAVE_PASS

      - name: Restart Reader and prove whitelist persistence
        shell: bash
        run: |
          set -euo pipefail
          yc serverless container revision deploy \
            --folder-id "$FOLDER_ID" \
            --container-name "$READER_NAME" \
            --runtime http \
            --image "$IMAGE" \
            --cores 1 \
            --memory 512MB \
            --concurrency 1 \
            --execution-timeout 120s \
            --service-account-id "$RUNTIME_SA" \
            --environment TELEGRAM_DATABASE_PATH=/tmp/telegram.db \
            --environment TELEGRAM_SESSION_PATH=/tmp/telegram_news \
            --environment TELEGRAM_MEDIA_PATH=/tmp/media \
            --environment COLLECTOR_ENABLED=false \
            --environment LOCKBOX_RUNTIME_SECRET_ID="$SECRET_ID" >/dev/null
          cloud_token="$(yc iam create-token)"
          ok=0
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 30 -H "Authorization: Bearer $cloud_token" "$READER_URL/health" -o "$RUNNER_TEMP/restart-health.json" 2>/dev/null; then
              if jq -e '.status=="ok" and .telegram_authorized==true and .allowed_chats>=1' "$RUNNER_TEMP/restart-health.json" >/dev/null; then ok=1; break; fi
            fi
            sleep 5
          done
          test "$ok" -eq 1
          curl -fsS --max-time 90 -H "x-admin-token: $TEMP_MANAGER_KEY" "$GATEWAY_URL/api/admin/dialogs" -o "$RUNNER_TEMP/dialogs-after.json"
          jq -S '.selected|sort' "$RUNNER_TEMP/dialogs-before.json" > "$RUNNER_TEMP/selected-before.json"
          jq -S '.selected|sort' "$RUNNER_TEMP/dialogs-after.json" > "$RUNNER_TEMP/selected-after.json"
          cmp "$RUNNER_TEMP/selected-before.json" "$RUNNER_TEMP/selected-after.json"
          echo MANAGER_RESTART_PERSISTENCE_PASS

      - name: Prove stable 192-hour read across every allowed chat
        shell: bash
        run: |
          set -euo pipefail
          cloud_token="$(yc iam create-token)"
          date_from="$(date -u -d '192 hours ago' '+%Y-%m-%dT%H:%M:%SZ')"
          date_to="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          chats="$(curl -fsS --max-time 30 -H "Authorization: Bearer $cloud_token" "$READER_URL/internal/chats")"
          total=0
          while read -r cid; do
            before=''
            pages=0
            chat_total=0
            while :; do
              pages=$((pages+1))
              test "$pages" -le 100
              args=(--get --data-urlencode "date_from=$date_from" --data-urlencode "date_to=$date_to" --data-urlencode 'limit=2000')
              if [ -n "$before" ]; then args+=(--data-urlencode "before_id=$before"); fi
              page="$(curl -fsS --retry 2 --retry-delay 2 --max-time 110 -H "Authorization: Bearer $cloud_token" "${args[@]}" "$READER_URL/internal/chats/$cid/messages")"
              jq -e --argjson cid "$cid" '.chat_id==$cid and .effective_page_limit<=250 and (.messages|length)==.message_count' >/dev/null <<<"$page"
              got="$(jq -r '.message_count' <<<"$page")"
              chat_total=$((chat_total+got))
              full="$(jq -r '.page_full' <<<"$page")"
              next="$(jq -r '.next_before_id // empty' <<<"$page")"
              if [ "$full" != true ]; then break; fi
              test -n "$next"
              if [ -n "$before" ]; then test "$next" -lt "$before"; fi
              before="$next"
            done
            total=$((total+chat_total))
            echo "CHAT_READ_PASS=$cid:$chat_total"
          done < <(jq -r '.chats[].chat_id' <<<"$chats")
          test "$total" -gt 0
          echo "POST_REPAIR_192H_MESSAGES=$total"
          echo POST_REPAIR_ALL_CHATS_192H_PASS

      - name: Install final private browser key hash
        shell: bash
        run: |
          set -euo pipefail
          yc lockbox secret add-version \
            --id "$SECRET_ID" \
            --description 'Telegram Reader browser manager permanent key 2026-09-17' \
            --payload "[{\"key\":\"MANAGE_TOKEN_SHA256\",\"text_value\":\"$FINAL_MANAGER_HASH\"}]" >/dev/null
          yc serverless container revision deploy \
            --folder-id "$FOLDER_ID" \
            --container-name "$READER_NAME" \
            --runtime http \
            --image "$IMAGE" \
            --cores 1 \
            --memory 512MB \
            --concurrency 1 \
            --execution-timeout 120s \
            --service-account-id "$RUNTIME_SA" \
            --environment TELEGRAM_DATABASE_PATH=/tmp/telegram.db \
            --environment TELEGRAM_SESSION_PATH=/tmp/telegram_news \
            --environment TELEGRAM_MEDIA_PATH=/tmp/media \
            --environment COLLECTOR_ENABLED=false \
            --environment LOCKBOX_RUNTIME_SECRET_ID="$SECRET_ID" >/dev/null
          cloud_token="$(yc iam create-token)"
          ok=0
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 30 -H "Authorization: Bearer $cloud_token" "$READER_URL/health" -o "$RUNNER_TEMP/final-health.json" 2>/dev/null; then
              if jq -e '.status=="ok" and .telegram_authorized==true and .allowed_chats>=1 and .media_storage=="enabled"' "$RUNNER_TEMP/final-health.json" >/dev/null; then ok=1; break; fi
            fi
            sleep 5
          done
          test "$ok" -eq 1
          old_code="$(curl -sS --max-time 40 -o /dev/null -w '%{http_code}' -H "x-admin-token: $TEMP_MANAGER_KEY" "$GATEWAY_URL/api/admin/dialogs")"
          test "$old_code" = 401
          page_code="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/final-manage.html" -w '%{http_code}' "$GATEWAY_URL/manage")"
          test "$page_code" = 200
          grep -q 'Telegram Reader — управление чатами' "$RUNNER_TEMP/final-manage.html"
          echo "FINAL_MANAGER_URL=$GATEWAY_URL/manage"
          echo TELEGRAM_MANAGER_REPAIR_FINAL_PASS

      - name: Dispatch canonical rolling workflow after repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/telegram-news-bridge.yml/dispatches" \
            -d '{"ref":"main"}'
          echo CANONICAL_ROLLING_DISPATCH_PASS

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP"/*.json "$RUNNER_TEMP"/*.html "$RUNNER_TEMP"/*.yaml
