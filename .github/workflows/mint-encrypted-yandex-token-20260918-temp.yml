name: Mint encrypted Yandex token for WORK 2026-09-18

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mint-encrypted-yandex-token-20260918-temp.yml'

permissions:
  contents: read

jobs:
  mint:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    env:
      YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
    steps:
      - name: Install and configure Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL --retry 5 --retry-delay 3 https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          YC="$RUNNER_TEMP/yc/yc"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/yc-sa-key.json"
          chmod 600 "$RUNNER_TEMP/yc-sa-key.json"
          "$YC" config profile create migration-token-mint >/dev/null
          "$YC" config set service-account-key "$RUNNER_TEMP/yc-sa-key.json" >/dev/null
          echo "YC_BIN=$YC" >> "$GITHUB_ENV"

      - name: Verify Lockbox metadata access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          yc=os.environ["YC_BIN"]
          for label,fid in [("marketplaces","b1gnd0dqoq3ljod88i8t"),("birzha","b1g00gqb66tbnfoumnkv")]:
              p=subprocess.run([yc,"lockbox","secret","list","--folder-id",fid,"--format","json"],text=True,capture_output=True,timeout=60)
              if p.returncode:
                  print(f"LOCKBOX_META={label}=FAIL rc={p.returncode} detail={(p.stderr or '')[:250]}")
                  raise SystemExit(2)
              items=json.loads(p.stdout or "[]")
              print(f"LOCKBOX_META={label}=PASS count={len(items)} names="+",".join(str(x.get("name","")) for x in items))
          PY

