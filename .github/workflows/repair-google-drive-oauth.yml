name: Repair Google Drive OAuth Lockbox

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-google-drive-oauth.yml

permissions:
  contents: read

concurrency:
  group: marketplaces-google-drive-oauth-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          ARCHIVE="$RUNNER_TEMP/yc/yc.tgz"
          ok=0
          for attempt in $(seq 1 10); do
            rm -f "$ARCHIVE"
            if timeout 75s curl --fail --silent --show-error --retry 2 --retry-all-errors -o "$ARCHIVE" "$URL" \
              && tar -tzf "$ARCHIVE" >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" = 1
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate Yandex CI service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create drive-oauth-repair || true
          yc config set service-account-key "$KEY_FILE"

      - name: Restore Google Drive OAuth from Lockbox history when missing
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"

          SECRET_ID="$(timeout 45s yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          test -n "$SECRET_ID"
          timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions-before.json"
          BASE_VERSION_ID="$(jq -r '[.[]|select(.status=="ACTIVE")]|sort_by(.created_at)|last|.id // empty' "$RUNNER_TEMP/versions-before.json")"
          test -n "$BASE_VERSION_ID"

          if jq -e --arg id "$BASE_VERSION_ID" '.[]|select(.id==$id)|(.payload_entry_keys // [])|index("google_drive_oauth_json") != null' "$RUNNER_TEMP/versions-before.json" >/dev/null; then
            echo 'GOOGLE_DRIVE_OAUTH_LOCKBOX=ALREADY_PRESENT'
            exit 0
          fi

          SOURCE_VERSION_ID="$(jq -r '[.[]|select((.payload_entry_keys // [])|index("google_drive_oauth_json") != null)]|sort_by(.created_at)|last|.id // empty' "$RUNNER_TEMP/versions-before.json")"
          test -n "$SOURCE_VERSION_ID"
          echo 'GOOGLE_DRIVE_OAUTH_HISTORY=FOUND'

          timeout 45s yc lockbox payload get \
            --id "$SECRET_ID" --version-id "$SOURCE_VERSION_ID" --key google_drive_oauth_json \
            --format json --no-user-output > "$RUNNER_TEMP/recovered-entry.json"
          OAUTH_JSON="$(jq -r '.entries[0].text_value // empty' "$RUNNER_TEMP/recovered-entry.json")"
          test -n "$OAUTH_JSON"
          echo "::add-mask::$OAUTH_JSON"
          export OAUTH_JSON

          python - <<'PY'
          import json, os
          cfg = json.loads(os.environ['OAUTH_JSON'])
          required = {'client_id', 'client_secret', 'refresh_token', 'token_uri'}
          missing = sorted(k for k in required if not str(cfg.get(k, '')).strip())
          if missing:
              raise SystemExit('Recovered Google Drive OAuth entry is missing required fields: ' + ', '.join(missing))
          compact = json.dumps(cfg, ensure_ascii=False, separators=(',', ':'))
          path = os.path.join(os.environ['RUNNER_TEMP'], 'oauth-payload.json')
          with open(path, 'w', encoding='utf-8') as f:
              json.dump([{'key':'google_drive_oauth_json','text_value':compact}], f, ensure_ascii=False, separators=(',', ':'))
          PY
          chmod 600 "$RUNNER_TEMP/oauth-payload.json"

          timeout 60s yc lockbox secret add-version \
            --id "$SECRET_ID" \
            --base-version-id "$BASE_VERSION_ID" \
            --description "Restore canonical Google Drive archive OAuth from Lockbox history 2026-09-13" \
            --payload - --format json --no-user-output \
            < "$RUNNER_TEMP/oauth-payload.json" > "$RUNNER_TEMP/new-version.json"
          NEW_VERSION_ID="$(jq -r '.id // .response.id // empty' "$RUNNER_TEMP/new-version.json")"
          test -n "$NEW_VERSION_ID"

          timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions-after.json"
          jq -r --arg id "$NEW_VERSION_ID" '.[]|select(.id==$id)|(.payload_entry_keys // [])[]?' "$RUNNER_TEMP/versions-after.json" | sort -u > "$RUNNER_TEMP/keys.txt"
          for key in cabinets_json mcp_bearer_token redis_password google_drive_oauth_json; do
            grep -Fxq "$key" "$RUNNER_TEMP/keys.txt"
          done
          echo 'GOOGLE_DRIVE_OAUTH_LOCKBOX=RESTORED_FROM_HISTORY'

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/yc/yc.tgz" \
            "$RUNNER_TEMP/versions-before.json" "$RUNNER_TEMP/versions-after.json" \
            "$RUNNER_TEMP/recovered-entry.json" "$RUNNER_TEMP/oauth-payload.json" \
            "$RUNNER_TEMP/new-version.json" "$RUNNER_TEMP/keys.txt"
