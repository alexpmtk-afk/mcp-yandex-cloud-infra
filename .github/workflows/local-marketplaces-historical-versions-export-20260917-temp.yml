name: Local Marketplaces historical versions export 2026-09-17

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/local-marketplaces-historical-versions-export-20260917-temp.yml"

permissions:
  contents: read

concurrency:
  group: local-marketplaces-historical-versions-export-20260917
  cancel-in-progress: false

jobs:
  export:
    runs-on: [self-hosted, Windows, X64, gpt-powershell-work]
    environment: test
    timeout-minutes: 180
    env:
      YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
    steps:
      - name: Export only non-current Yandex Object Storage versions directly to WORK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $python = 'C:\MCP\projects\marketplaces-mcp-ru\.venv\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'Marketplaces Python venv missing' }
          $script = Join-Path $env:RUNNER_TEMP 'export_yandex_marketplaces_versions.py'
          @'
          import hashlib, json, os, time, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path
          import jwt

          DEST_ROOT = Path(r'C:\MCP\migration\yandex-manual\marketplaces\object-storage')
          BUCKETS = {
              'archive-versions':'marketplaces-mcp-archive-b1gnd0dqoq3ljod88i8t',
              'tfstate-versions':'marketplaces-mcp-tfstate-b1gnd0dqoq3ljod88i8t',
          }
          ENDPOINT='https://storage.yandexcloud.net'
          key=json.loads(os.environ['YC_SERVICE_ACCOUNT_KEY_JSON'])
          now=int(time.time())
          signed=jwt.encode({'aud':'https://iam.api.cloud.yandex.net/iam/v1/tokens','iss':key['service_account_id'],'iat':now,'exp':now+3600},key['private_key'],algorithm='PS256',headers={'kid':key['id']})
          req=urllib.request.Request('https://iam.api.cloud.yandex.net/iam/v1/tokens',data=json.dumps({'jwt':signed}).encode(),headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: token=json.loads(r.read())['iamToken']
          headers={'Authorization':'Bearer '+token}

          def text_of(elem, local):
              for c in elem:
                  if c.tag.rsplit('}',1)[-1]==local: return c.text or ''
              return ''

          def list_versions(bucket):
              km=vm=None; out=[]; deletes=[]
              while True:
                  q={'versions':'','max-keys':'1000'}
                  if km: q['key-marker']=km
                  if vm: q['version-id-marker']=vm
                  u=f"{ENDPOINT}/{bucket}?{urllib.parse.urlencode(q)}"
                  with urllib.request.urlopen(urllib.request.Request(u,headers=headers),timeout=90) as r: root=ET.fromstring(r.read())
                  for n in root:
                      kind=n.tag.rsplit('}',1)[-1]
                      if kind=='Version':
                          out.append({'key':text_of(n,'Key'),'version_id':text_of(n,'VersionId'),'latest':text_of(n,'IsLatest').lower()=='true','size':int(text_of(n,'Size') or 0),'etag':text_of(n,'ETag').strip('"'),'last_modified':text_of(n,'LastModified')})
                      elif kind=='DeleteMarker':
                          deletes.append({'key':text_of(n,'Key'),'version_id':text_of(n,'VersionId'),'latest':text_of(n,'IsLatest').lower()=='true','last_modified':text_of(n,'LastModified')})
                  trunc=next((x.text for x in root.iter() if x.tag.rsplit('}',1)[-1]=='IsTruncated'),'false')
                  if str(trunc).lower()!='true': break
                  km=next((x.text for x in root.iter() if x.tag.rsplit('}',1)[-1]=='NextKeyMarker'),None)
                  vm=next((x.text for x in root.iter() if x.tag.rsplit('}',1)[-1]=='NextVersionIdMarker'),None)
                  if not km: raise RuntimeError('truncated version listing without marker')
              return out,deletes

          def safe_rel(key_name):
              parts=[p for p in key_name.replace('\\','/').split('/') if p not in ('','.')]
              if '..' in parts: raise RuntimeError('unsafe key')
              return Path(*parts)

          summaries={}
          for label,bucket in BUCKETS.items():
              dest=DEST_ROOT/label
              dest.mkdir(parents=True,exist_ok=True)
              versions,deletes=list_versions(bucket)
              hist=[v for v in versions if not v['latest']]
              expected=sum(v['size'] for v in hist)
              print(f'HIST_LIST bucket={bucket} historical_versions={len(hist)} bytes={expected} delete_markers={len(deletes)}')
              manifest=[]; total=0; files=0
              for i,v in enumerate(hist,1):
                  vid=v['version_id']; keyname=v['key']
                  token_dir=hashlib.sha256(vid.encode('utf-8')).hexdigest()[:20]
                  target=dest/token_dir/safe_rel(keyname)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  enc_key=urllib.parse.quote(keyname,safe='/-_.~')
                  url=f'{ENDPOINT}/{bucket}/{enc_key}?{urllib.parse.urlencode({"versionId":vid})}'
                  h=hashlib.sha256(); n=0
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=180) as r, target.open('wb') as f:
                      while True:
                          chunk=r.read(1024*1024)
                          if not chunk: break
                          f.write(chunk); h.update(chunk); n+=len(chunk)
                  if n!=v['size']: raise RuntimeError(f'size mismatch {keyname} {vid}: {n}!={v["size"]}')
                  manifest.append({**v,'local_rel':str(target.relative_to(dest)),'sha256':h.hexdigest(),'downloaded_size':n})
                  total+=n; files+=1
                  if i%100==0: print(f'HIST_PROGRESS bucket={bucket} {i}/{len(hist)} bytes={total}')
              (dest/'_historical_versions_manifest.json').write_text(json.dumps({'bucket':bucket,'historical_versions':manifest,'delete_markers':deletes},ensure_ascii=False,indent=2),encoding='utf-8')
              if total!=expected: raise RuntimeError(f'aggregate mismatch {bucket}: {total}!={expected}')
              summaries[label]={'bucket':bucket,'historical_files':files,'historical_bytes':total,'delete_markers':len(deletes)}
              print(f'HIST_EXPORT=PASS bucket={bucket} files={files} bytes={total}')
          (DEST_ROOT/'_historical_versions_export_summary.json').write_text(json.dumps(summaries,ensure_ascii=False,indent=2),encoding='utf-8')
          print('HISTORICAL_VERSIONS_EXPORT=PASS')
          '@ | Set-Content -LiteralPath $script -Encoding UTF8
          try {
            & $python $script
            if ($LASTEXITCODE -ne 0) { throw "historical export failed with exit code $LASTEXITCODE" }
          } finally {
            Remove-Item -LiteralPath $script -Force -ErrorAction SilentlyContinue
          }

      - name: Verify exact expected historical totals
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='C:\MCP\migration\yandex-manual\marketplaces\object-storage\_historical_versions_export_summary.json'
          if (-not (Test-Path -LiteralPath $p)) { throw 'summary missing' }
          $o=Get-Content -LiteralPath $p -Raw | ConvertFrom-Json
          if ([int64]$o.'archive-versions'.historical_files -ne 968) { throw 'archive historical count mismatch' }
          if ([int64]$o.'archive-versions'.historical_bytes -ne 2298527130) { throw 'archive historical bytes mismatch' }
          if ([int64]$o.'tfstate-versions'.historical_files -ne 71) { throw 'tfstate historical count mismatch' }
          if ([int64]$o.'tfstate-versions'.historical_bytes -ne 1886182) { throw 'tfstate historical bytes mismatch' }
          Write-Host 'HISTORICAL_LOCAL_COPY=PASS archive_versions=968 archive_bytes=2298527130 tfstate_versions=71 tfstate_bytes=1886182'
