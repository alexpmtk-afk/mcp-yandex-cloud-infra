name: M26.6 MOEX Si 2026-09-15 Readonly Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m26-6-moex-si-20260915-readonly-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query official MOEX ISS exact security and resolver source
        shell: bash
        run: |
          set -euo pipefail
          EXACT='https://iss.moex.com/iss/history/engines/futures/markets/forts/boards/RFUD/securities/SiU6.json?iss.meta=off&iss.only=history&history.columns=TRADEDATE%2CNUMTRADES%2CVOLUME%2CVALUE&from=2026-09-15&till=2026-09-15'
          ROOT15='https://iss.moex.com/iss/history/engines/futures/markets/forts/securities.json?iss.meta=off&iss.only=history&history.columns=TRADEDATE%2CSECID%2CBOARDID%2CASSETCODE%2CVALUE%2CVOLUME%2COPENPOSITIONVALUE%2COPENPOSITION%2CSHORTNAME%2CLASTTRADEDATE&date=2026-09-15&assetcode=Si'
          ROOT14='https://iss.moex.com/iss/history/engines/futures/markets/forts/securities.json?iss.meta=off&iss.only=history&history.columns=TRADEDATE%2CSECID%2CBOARDID%2CASSETCODE%2CVALUE%2CVOLUME%2COPENPOSITIONVALUE%2COPENPOSITION%2CSHORTNAME%2CLASTTRADEDATE&date=2026-09-14&assetcode=Si'
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 "$EXACT" -o "$RUNNER_TEMP/exact.json"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 "$ROOT15" -o "$RUNNER_TEMP/root15.json"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 "$ROOT14" -o "$RUNNER_TEMP/root14.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])
          def table(name):
              p=json.loads((base/name).read_text())
              h=p.get('history') or {}
              cols=h.get('columns') or []
              return cols, h.get('data') or []
          cols, rows=table('exact.json')
          print('EXACT_COLUMNS=' + json.dumps(cols,ensure_ascii=False,separators=(',',':')))
          print('EXACT_ROWS=' + json.dumps(rows,ensure_ascii=False,separators=(',',':')))
          assert rows and rows[0][0]=='2026-09-15'
          for label,name in [('ROOT15','root15.json'),('ROOT14','root14.json')]:
              c,r=table(name)
              print(label+'_ROW_COUNT=' + str(len(r)))
              matches=[]
              try:
                  sec_i=c.index('SECID'); asset_i=c.index('ASSETCODE'); date_i=c.index('TRADEDATE')
              except ValueError:
                  sec_i=asset_i=date_i=None
              if sec_i is not None:
                  for row in r:
                      sec=str(row[sec_i] or ''); asset=str(row[asset_i] or '')
                      if asset.lower()=='si' or (not asset and sec.lower().startswith('si')):
                          matches.append(row)
              print(label+'_SI_MATCHES=' + json.dumps(matches,ensure_ascii=False,separators=(',',':')))
          print('MOEX_SI_RESOLVER_PROBE_READONLY=PASS')
          PY
