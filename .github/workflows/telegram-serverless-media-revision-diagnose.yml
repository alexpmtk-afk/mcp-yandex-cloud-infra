name: Telegram Serverless Media Revision Diagnose

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-serverless-media-revision-diagnose.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: telegram-serverless-smoke-20260916
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Authenticate
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create tg-media-revision-diag || true
          yc config profile activate tg-media-revision-diag
          yc config set service-account-key "$key"
          yc config set folder-id b1gk4p83brasi8g811jv
      - name: Retry exact revision deploy and capture result
        shell: bash
        run: |
          set -u
          folder=b1gk4p83brasi8g811jv
          media_sa="$(yc iam service-account list --folder-id "$folder" --format json | jq -r '.[] | select(.name=="telegram-reader-media-proxy") | .id' | head -1)"
          media_secret="$(yc lockbox secret list --folder-id "$folder" --format json | jq -r '.[] | select(.name=="telegram-reader-media-runtime") | .id' | head -1)"
          tag="media-$(git rev-parse --short=12 HEAD)"
          image="cr.yandex/crphagvid8e8g5pp4fpe/telegram-reader-media:$tag"
          echo "MEDIA_SA_PRESENT=$([ -n "$media_sa" ] && echo yes || echo no)"
          echo "MEDIA_SECRET_PRESENT=$([ -n "$media_secret" ] && echo yes || echo no)"
          echo "IMAGE_TAG=$tag"
          echo MEDIA_SA_FOLDER_ROLES_BEGIN
          yc resource-manager folder list-access-bindings "$folder" --format json \
            | jq -r --arg id "$media_sa" '.[] | select(any(.subjects[]?; .id==$id)) | .role_id' | sort -u || true
          echo MEDIA_SA_FOLDER_ROLES_END
          set +e
          yc serverless container revision deploy \
            --folder-id "$folder" \
            --container-name telegram-reader-media \
            --runtime http \
            --image "$image" \
            --cores 1 \
            --memory 256MB \
            --concurrency 4 \
            --execution-timeout 30s \
            --service-account-id "$media_sa" \
            --environment LOCKBOX_MEDIA_SECRET_ID="$media_secret" \
            >"$RUNNER_TEMP/deploy.out" 2>"$RUNNER_TEMP/deploy.err"
          rc=$?
          set -e
          echo DEPLOY_RC=$rc
          echo DEPLOY_STDERR_BEGIN
          sed -E 's/(token|secret|password|authorization)[^ ]*/[REDACTED]/Ig' "$RUNNER_TEMP/deploy.err" | tail -n 40
          echo DEPLOY_STDERR_END
          if [ "$rc" -eq 0 ]; then
            echo MEDIA_REVISION_DEPLOY_DIAG=PASS
          else
            echo MEDIA_REVISION_DEPLOY_DIAG=FAIL
          fi
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/deploy.out" "$RUNNER_TEMP/deploy.err"
