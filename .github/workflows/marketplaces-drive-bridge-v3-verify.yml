name: Verify canonical Marketplaces Drive Bridge v3

on:
  push:
    branches:
      - fix/marketplaces-bridge-v3-canonical
    paths:
      - '.github/workflows/marketplaces-drive-bridge-v3-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplaces-drive-bridge-v3-verify
  cancel-in-progress: false

env:
  CLOUD_ID: b1gi4pr9msenirafh2c7
  ROOT_ID: 1UVKUcFfDhCDk6nMHX1mWg9cRL05DT-OJ
  BRIDGE_URL: https://script.google.com/macros/s/AKfycbzgFDAQY4rcsblKhiAONfOI6315k8W3vwbSIEsczE3ycQtnJ8ctcVKjhzjgdTgfy0cvIA/exec

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 5 \
            https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate and resolve Marketplaces resources
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/yc-key.json"
          umask 077
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY"
          yc config profile create marketplaces-v3-verify >/dev/null 2>&1 || true
          yc config set service-account-key "$KEY"
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          CONTAINER_ID="$(yc serverless container list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$SECRET_ID"; test -n "$CONTAINER_ID"
          yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"
          VERSION_ID="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys//[])|index("google_drive_bridge_secret")!=null)]|sort_by(.created_at)|last|.id//empty' "$RUNNER_TEMP/versions.json")"
          test -n "$VERSION_ID"
          yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/v3.json"
          BRIDGE_SECRET="$(jq -r '.entries[]|select(.key=="google_drive_bridge_secret")|.text_value//empty' "$RUNNER_TEMP/v3.json")"
          test -n "$BRIDGE_SECRET"
          echo "::add-mask::$BRIDGE_SECRET"
          printf '%s' "$BRIDGE_SECRET" > "$RUNNER_TEMP/v3-secret"
          yc serverless container revision list --container-id "$CONTAINER_ID" --format json > "$RUNNER_TEMP/revisions.json"
          REVISION_ID="$(jq -r '[.[]|select((.status//"")=="ACTIVE")]|sort_by(.created_at)|last|.id//empty' "$RUNNER_TEMP/revisions.json")"
          test -n "$REVISION_ID"
          yc serverless container revision get "$REVISION_ID" --format json > "$RUNNER_TEMP/revision.json"
          printf '%s' "$SECRET_ID" > "$RUNNER_TEMP/secret-id"
          printf '%s' "$VERSION_ID" > "$RUNNER_TEMP/version-id"
          echo "ACTIVE_REVISION=$REVISION_ID"

      - name: Assert active runtime is V3-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'revision.json').read_text())
          env=(d.get('image') or {}).get('environment') or {}
          blob=json.dumps(d)
          expected_url=os.environ['BRIDGE_URL']
          expected_root=os.environ['ROOT_ID']
          assert env.get('MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_URL') == expected_url, env
          assert env.get('MARKETPLACE_MCP_ARCHIVE_DRIVE_ROOT_ID') == expected_root, env
          assert 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_SECRET' in blob, 'V3 secret binding missing'
          assert 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_V1_' not in blob, 'retired V1 binding is still active'
          protocol=str(env.get('MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_PROTOCOL') or '').lower()
          assert protocol in ('', 'v3', '3'), protocol
          print('MARKETPLACES_RUNTIME_V3_ONLY=PASS')
          PY

      - name: Verify live Bridge v3 identity
        shell: bash
        run: |
          set -euo pipefail
          export BRIDGE_SECRET="$(cat "$RUNNER_TEMP/v3-secret")"
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          body=json.dumps({'secret':os.environ['BRIDGE_SECRET'],'action':'health'}).encode()
          last=None
          for attempt in range(1,4):
              req=urllib.request.Request(os.environ['BRIDGE_URL'],data=body,headers={'Content-Type':'application/json','Accept':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      data=json.loads(r.read().decode())
                  assert data.get('ok') is True, data
                  assert int(data.get('version') or 0) == 3, data
                  assert data.get('root_id') == os.environ['ROOT_ID'], data
                  print('MARKETPLACES_BRIDGE_V3_HEALTH=PASS')
                  print('BRIDGE_VERSION=3')
                  break
              except urllib.error.HTTPError as exc:
                  last=exc
                  if attempt < 3 and (exc.code in (404,408,425,429) or 500 <= exc.code < 600):
                      time.sleep(0.75*attempt); continue
                  raise
          else:
              raise last or RuntimeError('bridge health failed')
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/yc" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/yc-key.json" \
            "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/v3.json" "$RUNNER_TEMP/v3-secret" \
            "$RUNNER_TEMP/revisions.json" "$RUNNER_TEMP/revision.json" \
            "$RUNNER_TEMP/secret-id" "$RUNNER_TEMP/version-id"
