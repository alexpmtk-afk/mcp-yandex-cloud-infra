name: Deploy Telegram Channel Manager

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-reader-deploy-manager.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-manager || true
          yc config profile activate telegram-manager
          yc config set service-account-key "$key"
      - name: Deploy manager
        shell: bash
        run: |
          set -euo pipefail
          yc config profile activate telegram-manager
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/tgkey"
          ip="$(curl -fsS https://api.ipify.org)"
          old="$(yc compute instance get telegram-news-reader --folder-id b1gk4p83brasi8g811jv --format json | jq -r '.metadata["ssh-keys"] // ""')"
          printf '%s' "$old" > "$RUNNER_TEMP/oldkeys"
          { printf '%s\n' "$old"; printf 'ubuntu:'; cat "$RUNNER_TEMP/tgkey.pub"; } > "$RUNNER_TEMP/newkeys"
          yc compute instance add-metadata telegram-news-reader --folder-id b1gk4p83brasi8g811jv --metadata-from-file ssh-keys="$RUNNER_TEMP/newkeys"
          yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id b1gk4p83brasi8g811jv --add-rule "description=github-manager-deploy,direction=ingress,port=22,protocol=tcp,v4-cidrs=$ip/32"
          sleep 20
          remote='set -e; image=cr.yandex/crphagvid8e8g5pp4fpe/telegram-news-reader:23491c937251f977f04f05bdc0f4c8dd2094c878; token=$(curl -sf -H Metadata-Flavor:Google 169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token | jq -r .access_token); echo "$token" | sudo docker login --username iam --password-stdin cr.yandex >/dev/null; sudo docker pull "$image" >/dev/null; sudo grep -q "^MANAGE_TOKEN_SHA256=" /opt/telegram-reader/runtime.env || echo "MANAGE_TOKEN_SHA256=b33311a41482a4a1ccd84a293fdfc1c3097306249147e84f409920b915f07c2f" | sudo tee -a /opt/telegram-reader/runtime.env >/dev/null; sudo docker rm -f telegram-reader >/dev/null 2>&1 || true; sudo docker run -d --name telegram-reader --restart unless-stopped -p 127.0.0.1:8080:8080 --env-file /opt/telegram-reader/runtime.env -v /state:/state "$image" >/dev/null; ok=0; for i in $(seq 1 30); do if curl -fsS --max-time 5 http://127.0.0.1:8080/health >/tmp/tg-health 2>/dev/null; then ok=1; break; fi; sleep 3; done; test "$ok" = 1; cat /tmp/tg-health; jq -e ".status == \"ok\" and .telegram_authorized == true" /tmp/tg-health >/dev/null; curl -fsS --max-time 10 http://127.0.0.1:8080/manage | grep -q "Telegram Reader — управление чатами"; echo MANAGER_DEPLOY=PASS'
          success=0
          for attempt in $(seq 1 6); do
            if ssh -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o ConnectTimeout=15 -i "$RUNNER_TEMP/tgkey" ubuntu@111.88.248.156 "$remote"; then success=1; break; fi
            sleep 10
          done
          test "$success" = 1
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          yc config profile activate telegram-manager >/dev/null 2>&1 || true
          ids=$(yc vpc security-group get enpocnvnpdu2goj9nkjn --folder-id b1gk4p83brasi8g811jv --format json | jq -r '.rules[] | select(.description=="github-manager-deploy") | .id')
          for id in $ids; do yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id b1gk4p83brasi8g811jv --delete-rule-id "$id"; done
          if [ -f "$RUNNER_TEMP/oldkeys" ]; then yc compute instance add-metadata telegram-news-reader --folder-id b1gk4p83brasi8g811jv --metadata-from-file ssh-keys="$RUNNER_TEMP/oldkeys"; fi
          rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/tgkey" "$RUNNER_TEMP/tgkey.pub" "$RUNNER_TEMP/oldkeys" "$RUNNER_TEMP/newkeys"
