name: Marketplaces MCP Manager Acceptance

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy Marketplaces MCP TEST
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: marketplaces-mcp-manager-acceptance
  cancel-in-progress: true

jobs:
  manager-readonly:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 12
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          ARCHIVE="$RUNNER_TEMP/yc/yc.tgz"
          ok=0
          for attempt in $(seq 1 6); do
            if timeout 75s wget -q --continue --timeout=30 --tries=2 --retry-connrefused --output-document="$ARCHIVE" "$URL"; then
              if tar -tzf "$ARCHIVE" >/dev/null 2>&1; then ok=1; break; fi
              rm -f "$ARCHIVE"
            fi
            sleep 3
          done
          test "$ok" = 1
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Resolve TEST MCP
        id: target
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          DOMAIN="$(timeout 45s yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//.[0].domain//empty')"
          SECRET_ID="$(timeout 45s yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          VERSION_ID="$(timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json | jq -r '[.[]|select(.status=="ACTIVE")][0].id')"
          timeout 45s yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/sec.json"
          BEARER="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value' "$RUNNER_TEMP/sec.json")"
          test -n "$DOMAIN" && test -n "$BEARER"
          echo "::add-mask::$BEARER"
          printf '%s' "$BEARER" > "$RUNNER_TEMP/bearer"
          chmod 600 "$RUNNER_TEMP/bearer"
          echo "url=https://${DOMAIN}/mcp" >> "$GITHUB_OUTPUT"

      - name: Run bounded read-only manager matrix
        shell: bash
        timeout-minutes: 5
        env:
          MCP_URL: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          export MCP_BEARER="$(cat "$RUNNER_TEMP/bearer")"
          python -m pip install --quiet 'httpx>=0.27,<1'
          timeout 240s python -u - <<'PY'
          import datetime, itertools, json, os
          import httpx

          def unpack(r):
              r.raise_for_status()
              for line in r.text.splitlines():
                  if line.startswith('data:'): return json.loads(line[5:].strip())
              return r.json() if r.text.strip() else None

          def classify(name, data):
              if data.get('ok') is True and 200 <= int(data.get('status',0)) < 300:
                  print(f'{name}=LIVE_PASS', flush=True); return 'pass'
              retry=float(data.get('retry_after_seconds',0) or data.get('retry_after_sec',0) or 0)
              if retry > 0 and (data.get('error_type')=='rate_limit' or data.get('error') in ('rate_limit','rate_limit_busy')):
                  print(f'{name}=RATE_LIMIT_PROTECTED retry_after={retry}', flush=True); return 'rate_limit'
              if int(data.get('code',0) or 0)==403 and data.get('error_type')=='forbidden':
                  if data.get('required_token_category'):
                      category=str(data['required_token_category'])
                      print(f'{name}=BLOCKED_MISSING_TOKEN_CATEGORY category={category}', flush=True)
                      return 'missing_role'
                  if 'missing a required role' in str(data.get('message','')):
                      print(f'{name}=BLOCKED_MISSING_API_ROLE', flush=True); return 'missing_role'
              print(f'{name}=UNEXPECTED '+json.dumps(data,ensure_ascii=False,sort_keys=True), flush=True)
              return 'unexpected'

          timeout=httpx.Timeout(connect=10,read=60,write=30,pool=10)
          headers={'Authorization':'Bearer '+os.environ['MCP_BEARER'],'Accept':'application/json, text/event-stream','Content-Type':'application/json'}
          ids=itertools.count(1)
          with httpx.Client(timeout=timeout,follow_redirects=True) as c:
              r=c.post(os.environ['MCP_URL'],headers=headers,json={'jsonrpc':'2.0','id':next(ids),'method':'initialize','params':{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'manager-acceptance','version':'2'}}})
              init=unpack(r); assert init and 'result' in init,init
              h=dict(headers); sid=r.headers.get('mcp-session-id')
              if sid: h['Mcp-Session-Id']=sid
              h['MCP-Protocol-Version']=init['result'].get('protocolVersion','2025-06-18')
              n=c.post(os.environ['MCP_URL'],headers=h,json={'jsonrpc':'2.0','method':'notifications/initialized'}); assert n.status_code in (200,202)
              def rpc(method,params=None):
                  rr=c.post(os.environ['MCP_URL'],headers=h,json={'jsonrpc':'2.0','id':next(ids),'method':method,'params':params or {}})
                  d=unpack(rr); assert d and 'result' in d,(method,d); return d['result']
              def call(name,args):
                  result=rpc('tools/call',{'name':name,'arguments':args})
                  if result.get('isError'):
                      return {'ok':False,'error':'mcp_tool_error','message':str(result)}
                  text=next((x.get('text') for x in result.get('content',[]) if x.get('type')=='text'),None)
                  if text is None:
                      return {'ok':False,'error':'mcp_schema','message':f'{name} returned no text content'}
                  try: return json.loads(text)
                  except Exception as exc: return {'ok':False,'error':'mcp_schema','message':f'{name} returned non-JSON: {exc}'}

              names={x['name'] for x in rpc('tools/list')['tools']}
              required={'wb_get_stocks','wb_get_new_orders','wb_get_prices','ozon_get_stocks','ozon_get_prices','ozon_get_fbs_unfulfilled'}
              assert required <= names, sorted(required-names)
              now=datetime.datetime.now(datetime.timezone.utc)
              cases=[
                  ('wb_stocks','WB_STOCKS','wb_get_stocks',{'limit':1,'offset':0}),
                  ('wb_new_orders','WB_NEW_ORDERS','wb_get_new_orders',{}),
                  ('wb_prices','WB_PRICES','wb_get_prices',{'limit':1,'offset':0}),
                  ('ozon_stocks','OZON_STOCKS','ozon_get_stocks',{'visibility':'ALL','limit':1,'last_id':''}),
                  ('ozon_prices','OZON_PRICES','ozon_get_prices',{'visibility':'ALL','limit':1,'cursor':''}),
                  ('ozon_fbs','OZON_FBS_UNFULFILLED','ozon_get_fbs_unfulfilled',{
                      'cutoff_from':(now-datetime.timedelta(days=7)).isoformat().replace('+00:00','Z'),
                      'cutoff_to':(now+datetime.timedelta(days=7)).isoformat().replace('+00:00','Z'),
                      'limit':1,'cursor':''}),
              ]
              results={}
              for key,label,tool,args in cases:
                  try:
                      results[key]=classify(label,call(tool,args))
                  except Exception as exc:
                      print(f'{label}=UNEXPECTED_EXCEPTION {type(exc).__name__}: {exc}',flush=True)
                      results[key]='unexpected'
              print('MANAGER_CAPABILITY_MATRIX='+json.dumps(results,sort_keys=True),flush=True)
              unexpected=sorted(k for k,v in results.items() if v=='unexpected')
              assert not unexpected, f'unexpected manager failures: {unexpected}'
              print('MARKETPLACES_MANAGER_ACCEPTANCE=PASS',flush=True)
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/sec.json" "$RUNNER_TEMP/bearer"
