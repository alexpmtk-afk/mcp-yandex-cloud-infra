name: M26.8 Worker Safe Deploy

on:
  push:
    branches: [main]
    paths:
      - "control/run-m26-7b-worker-edge-fix-safe-deploy.txt"

permissions:
  contents: read
  id-token: write

concurrency:
  group: birzha-m26-8-worker-safe-deploy
  cancel-in-progress: false

env:
  TF_DIR: terraform/birzha_test
  DEPLOYER_SERVICE_ACCOUNT_ID: ajecdjjrkdo1t3itpl9k
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/mcp-yandex-cloud-infra@1349853397:environment:test
  TARGET_APP_SHA: fc4d205adc806446a98ebda5d3b210771f84d489
  TARGET_WORKER_IMAGE: cr.yandex/crpk5qvf4p7kcqil2u3v/birzha-mcp-forecast@sha256:ebedf5bd996deafe9197589f1ce2fa3515d51aaf5214c59a63b12d9b0e992c97
  PUBLIC_IMAGE: cr.yandex/crpk5qvf4p7kcqil2u3v/birzha-mcp-forecast@sha256:d6dad1f3efc8687cb93f7a745bd480eddff8dbefabab384ff785b57cdae8823c
  PUBLIC_SHA: 301f4880f555b4d6fd7cbdc509fa8e99af19ff33
  PUBLIC_HOSTS: d5d6sgh96p1fs4mnlfsr.0ly8ed4d.apigw.yandexcloud.net,d5d6sgh96p1fs4mnlfsr.0ly8ed4d.apigw.yandexcloud.net:*
  PUBLIC_ORIGINS: https://chatgpt.com
  WORKER_ID: bbamdg0po6fkukhod2e9
  TIMER_ID: a1s4ho32v7dha59aeu60
  BRIDGE_URL: https://script.google.com/macros/s/AKfycbxRqmudGWqwCSgEuikPi23pe9YjqK5wfSk4syldQQmI9cDMxcYfKz6DzftRnSgGm69H9g/exec
  BRIDGE_ROOT: 1A7IzjXYSCWReZXdtrPZgZgLTnFIifsT2
  BRIDGE_CHUNK_ROWS: "500"
  BRIDGE_SECRET_ID: e6qecl857uj9b21reng9
  BRIDGE_SECRET_VERSION: e6qrir8bf747fu333qdi

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Mint Yandex token
        shell: bash
        run: |
          set -euo pipefail
          A="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          S='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && S='&'
          R="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${S}audience=${A}")"
          J="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$R")"
          echo "::add-mask::$J"
          python - "$J" <<'PY'
          import base64,json,os,sys
          p=sys.argv[1].split('.')[1]; p += '='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          assert c.get('sub')==os.environ['EXPECTED_OIDC_SUBJECT']
          assert c.get('aud')==os.environ['OIDC_AUDIENCE']
          assert c.get('ref')=='refs/heads/main'
          assert c.get('environment')=='test'
          PY
          X="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${DEPLOYER_SERVICE_ACCOUNT_ID}" --data-urlencode "subject_token=${J}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          T="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$X")"
          test -n "$T"
          echo "::add-mask::$T"
          umask 077
          printf '%s' "$T" > "$RUNNER_TEMP/iam-token"
          echo 'M26_8_CLOUD_ACCESS=PASS'

      - name: Prove timer paused
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tar.gz"
          tar -xzf "$RUNNER_TEMP/yc.tar.gz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          YC_IAM_TOKEN="$(cat "$RUNNER_TEMP/iam-token")" "$RUNNER_TEMP/yc/yc" serverless trigger get "$TIMER_ID" --format=json > "$RUNNER_TEMP/timer-before.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'timer-before.json').read_text())
          assert d.get('id')==os.environ['TIMER_ID']
          assert d.get('status')=='PAUSED', d.get('status')
          assert os.environ['WORKER_ID'] in json.dumps(d)
          print('M26_8_TIMER_PREDEPLOY_PAUSED=PASS')
          PY

      - name: Init and protect baseline
        shell: bash
        env:
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" init -reconfigure -input=false -lockfile=readonly \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" \
            -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY" >/dev/null
          terraform -chdir="$TF_DIR" validate
          terraform -chdir="$TF_DIR" show -json > "$RUNNER_TEMP/state-before.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'state-before.json').read_text())
          by={r['address']:r['values'] for r in s['values']['root_module']['resources']}
          p=by['yandex_serverless_container.mcp[0]']['image'][0]; pe=p.get('environment') or {}
          w=by['yandex_serverless_container.orchestrator_worker[0]']; we=w['image'][0].get('environment') or {}
          assert p['url']==os.environ['PUBLIC_IMAGE'] and pe.get('BIRZHA_SOURCE_COMMIT')==os.environ['PUBLIC_SHA']
          assert pe.get('MCP_ALLOWED_HOSTS','')==os.environ['PUBLIC_HOSTS']
          assert pe.get('MCP_ALLOWED_ORIGINS','')==os.environ['PUBLIC_ORIGINS']
          assert w['id']==os.environ['WORKER_ID']
          assert we.get('BIRZHA_MARKET_MIRROR_REQUIRED')=='true'
          assert we.get('BIRZHA_MARKET_MIRROR_BRIDGE_URL')==os.environ['BRIDGE_URL']
          assert we.get('BIRZHA_MARKET_MIRROR_ROOT_FOLDER_ID')==os.environ['BRIDGE_ROOT']
          m=[x for x in (w.get('secrets') or []) if x.get('environment_variable')=='BIRZHA_MARKET_MIRROR_BRIDGE_SECRET']
          assert len(m)==1 and m[0].get('id')==os.environ['BRIDGE_SECRET_ID'] and m[0].get('version_id')==os.environ['BRIDGE_SECRET_VERSION']
          assert by['yandex_function_trigger.orchestrator_timer[0]']['id']==os.environ['TIMER_ID']
          print('M26_8_BASELINE_PROTECTED=PASS')
          PY

      - name: Plan exactly one worker update
        shell: bash
        run: |
          set -euo pipefail
          export TF_VAR_yc_token="$(cat "$RUNNER_TEMP/iam-token")"
          terraform -chdir="$TF_DIR" plan -input=false -no-color -out="$RUNNER_TEMP/plan" \
            -var="mcp_image_url=${PUBLIC_IMAGE}" -var="source_commit_sha=${PUBLIC_SHA}" \
            -var="mcp_allowed_hosts=${PUBLIC_HOSTS}" -var="mcp_allowed_origins=${PUBLIC_ORIGINS}" \
            -var="m24_worker_image_url=${TARGET_WORKER_IMAGE}" -var="m24_worker_source_sha=${TARGET_APP_SHA}" \
            -var="m24_infra_oidc_bootstrap_enabled=false" -var="m24_observability_probe_enabled=false" \
            -var="m25_birzha_bridge_v1_url=${BRIDGE_URL}" -var="m25_birzha_bridge_v1_required=true" \
            -var="m25_birzha_bridge_v1_root_folder_id=${BRIDGE_ROOT}" \
            -var="m25_birzha_bridge_v1_secret_id=${BRIDGE_SECRET_ID}" \
            -var="m25_birzha_bridge_v1_secret_version_id=${BRIDGE_SECRET_VERSION}" \
            -var="m25_birzha_bridge_v1_chunk_rows=${BRIDGE_CHUNK_ROWS}"
          terraform -chdir="$TF_DIR" show -json "$RUNNER_TEMP/plan" > "$RUNNER_TEMP/plan.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads((Path(os.environ['RUNNER_TEMP'])/'plan.json').read_text())
          changed=[]
          for r in p.get('resource_changes') or []:
              a=(r.get('change') or {}).get('actions') or []
              if a not in (['no-op'],['read']): changed.append((r.get('address'),a))
          assert changed==[('yandex_serverless_container.orchestrator_worker[0]',['update'])], changed
          print('M26_8_ONLY_WORKER_CHANGES=PASS')
          PY

      - name: Apply saved plan
        shell: bash
        run: |
          set -euo pipefail
          export TF_VAR_yc_token="$(cat "$RUNNER_TEMP/iam-token")"
          terraform -chdir="$TF_DIR" apply -input=false -auto-approve "$RUNNER_TEMP/plan"
          echo 'M26_8_APPLY=PASS'

      - name: Verify exact worker, unchanged public and bridge, paused timer
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" show -json > "$RUNNER_TEMP/state-after.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'state-after.json').read_text())
          by={r['address']:r['values'] for r in s['values']['root_module']['resources']}
          p=by['yandex_serverless_container.mcp[0]']['image'][0]; pe=p.get('environment') or {}
          w=by['yandex_serverless_container.orchestrator_worker[0]']; wi=w['image'][0]; we=wi.get('environment') or {}
          assert p['url']==os.environ['PUBLIC_IMAGE'] and pe.get('BIRZHA_SOURCE_COMMIT')==os.environ['PUBLIC_SHA']
          assert wi['url']==os.environ['TARGET_WORKER_IMAGE'] and we.get('BIRZHA_SOURCE_COMMIT')==os.environ['TARGET_APP_SHA']
          assert we.get('BIRZHA_MARKET_MIRROR_BRIDGE_URL')==os.environ['BRIDGE_URL']
          assert we.get('BIRZHA_MARKET_MIRROR_ROOT_FOLDER_ID')==os.environ['BRIDGE_ROOT']
          print('M26_8_NEW_WORKER_ACTIVE=PASS')
          print('M26_8_PUBLIC_UNCHANGED=PASS')
          print('M26_8_BRIDGE_UNCHANGED=PASS')
          PY
          YC_IAM_TOKEN="$(cat "$RUNNER_TEMP/iam-token")" "$RUNNER_TEMP/yc/yc" serverless trigger get "$TIMER_ID" --format=json > "$RUNNER_TEMP/timer-after.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'timer-after.json').read_text())
          assert d.get('id')==os.environ['TIMER_ID'] and d.get('status')=='PAUSED'
          assert os.environ['WORKER_ID'] in json.dumps(d)
          print('M26_8_TIMER_POSTDEPLOY_PAUSED=PASS')
          PY

      - name: Verify zero drift
        shell: bash
        run: |
          set -euo pipefail
          export TF_VAR_yc_token="$(cat "$RUNNER_TEMP/iam-token")"
          set +e
          terraform -chdir="$TF_DIR" plan -detailed-exitcode -input=false -no-color \
            -var="mcp_image_url=${PUBLIC_IMAGE}" -var="source_commit_sha=${PUBLIC_SHA}" \
            -var="mcp_allowed_hosts=${PUBLIC_HOSTS}" -var="mcp_allowed_origins=${PUBLIC_ORIGINS}" \
            -var="m24_worker_image_url=${TARGET_WORKER_IMAGE}" -var="m24_worker_source_sha=${TARGET_APP_SHA}" \
            -var="m24_infra_oidc_bootstrap_enabled=false" -var="m24_observability_probe_enabled=false" \
            -var="m25_birzha_bridge_v1_url=${BRIDGE_URL}" -var="m25_birzha_bridge_v1_required=true" \
            -var="m25_birzha_bridge_v1_root_folder_id=${BRIDGE_ROOT}" \
            -var="m25_birzha_bridge_v1_secret_id=${BRIDGE_SECRET_ID}" \
            -var="m25_birzha_bridge_v1_secret_version_id=${BRIDGE_SECRET_VERSION}" \
            -var="m25_birzha_bridge_v1_chunk_rows=${BRIDGE_CHUNK_ROWS}" > "$RUNNER_TEMP/zero.txt"
          rc=$?; set -e
          test "$rc" = 0 || { cat "$RUNNER_TEMP/zero.txt"; exit "$rc"; }
          echo 'M26_8_ZERO_DRIFT=PASS'

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/iam-token" "$RUNNER_TEMP/yc" "$RUNNER_TEMP/yc.tar.gz" "$RUNNER_TEMP/timer-before.json" "$RUNNER_TEMP/timer-after.json" "$RUNNER_TEMP/state-before.json" "$RUNNER_TEMP/state-after.json" "$RUNNER_TEMP/plan" "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/zero.txt"
