name: Telegram Registry Audit Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/telegram-registry-audit-temp.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-registry-audit || true
          yc config profile activate telegram-registry-audit
          yc config set service-account-key "$key"
          yc config set folder-id b1gk4p83brasi8g811jv

      - name: Audit active production revisions and registry images
        shell: bash
        run: |
          set -euo pipefail
          folder=b1gk4p83brasi8g811jv
          registry_id=crphagvid8e8g5pp4fpe

          echo '=== PRODUCTION CONTAINERS ==='
          for name in telegram-reader-serverless telegram-reader-media; do
            c="$(yc serverless container get "$name" --folder-id "$folder" --format json)"
            echo "$c" | jq -c '{id,name,url,created_at}'
            cid="$(echo "$c" | jq -r '.id')"
            echo "=== REVISIONS:$name ==="
            yc serverless container revision list --container-id "$cid" --folder-id "$folder" --format json \
              | jq -c '[.[] | {id,container_id,created_at,image:(.image // null),image_url:(.image_url // null),image_digest:(.image_digest // null),status:(.status // null),resources:(.resources // null)}]'
          done

          echo '=== REGISTRY ==='
          yc container registry get --id "$registry_id" --folder-id "$folder" --format json | jq -c '{id,name,folder_id,created_at}'

          echo '=== IMAGES ==='
          yc container image list --registry-id "$registry_id" --folder-id "$folder" --limit 1000 --format json \
            | jq -c '[.[] | {id,name,digest,created_at,compressed_size,tags}] | sort_by(.created_at) | reverse'

          echo '=== IMAGE SUMMARY ==='
          yc container image list --registry-id "$registry_id" --folder-id "$folder" --limit 1000 --format json \
            | jq -c '{count:length,total_compressed_bytes:(map((.compressed_size // 0)|tonumber)|add // 0),repositories:(group_by(.name)|map({name:.[0].name,count:length,latest:(sort_by(.created_at)|reverse|.[0].created_at)}))}'

          echo TELEGRAM_REGISTRY_AUDIT_PASS

      - name: Cleanup credential file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json"
