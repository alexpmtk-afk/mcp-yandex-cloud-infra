name: Reconcile Drive Archive Registry Once v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - control/run-drive-registry-reconcile-once-v2.txt

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Yandex Cloud CLI and Python HTTP client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget --quiet --timeout=30 --tries=3 -O "$RUNNER_TEMP/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
          python -m pip install --quiet 'httpx>=0.27,<1'

      - name: Resolve Yandex source registry and bridge secret
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          BUCKET: marketplaces-mcp-archive-b1gnd0dqoq3ljod88i8t
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create registry-reconcile-v2 || true
          yc config set service-account-key "$KEY_FILE"
          FOLDER_ID="$(yc resource-manager folder list --cloud-id b1gi4pr9msenirafh2c7 --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"
          VERSION_ID="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys // [])|index("google_drive_bridge_secret") != null)|select((.payload_entry_keys // [])|index("cabinets_json") != null)|select((.payload_entry_keys // [])|index("mcp_bearer_token") != null)|select((.payload_entry_keys // [])|index("redis_password") != null)]|sort_by(.created_at)|last|.id // empty' "$RUNNER_TEMP/versions.json")"
          test -n "$VERSION_ID"
          yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/payload.json"
          BRIDGE_SECRET="$(jq -r '.entries[]|select(.key=="google_drive_bridge_secret")|.text_value' "$RUNNER_TEMP/payload.json")"
          test -n "$BRIDGE_SECRET"
          echo "::add-mask::$BRIDGE_SECRET"
          printf '%s' "$BRIDGE_SECRET" > "$RUNNER_TEMP/bridge-secret"
          chmod 600 "$RUNNER_TEMP/bridge-secret"
          TOKEN="$(yc iam create-token)"
          echo "::add-mask::$TOKEN"
          CODE="$(curl -sS --max-time 90 -H "Authorization: Bearer $TOKEN" -o "$RUNNER_TEMP/yandex-registry.csv" -w '%{http_code}' "https://storage.yandexcloud.net/${BUCKET}/app/registry/reports_registry.csv")"
          test "$CODE" = 200
          echo 'REGISTRY_INPUTS=RESOLVED'

      - name: Strict reconcile with Drive backup and read-back verification
        shell: bash
        env:
          DRIVE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbzgFDAQY4rcsblKhiAONfOI6315k8W3vwbSIEsczE3ycQtnJ8ctcVKjhzjgdTgfy0cvIA/exec
        run: |
          set -euo pipefail
          export BRIDGE_SECRET="$(cat "$RUNNER_TEMP/bridge-secret")"
          python -u - <<'PY'
          import base64, csv, hashlib, io, json, os
          from collections import Counter
          import httpx

          url=os.environ['DRIVE_BRIDGE_URL']
          secret=os.environ['BRIDGE_SECRET']
          yandex_raw=open(os.environ['RUNNER_TEMP']+'/yandex-registry.csv','rb').read()
          client=httpx.Client(timeout=httpx.Timeout(120.0, connect=20.0), follow_redirects=True)

          def post(action, **extra):
              r=client.post(url, json={'secret':secret,'action':action,**extra}, headers={'Accept':'application/json'})
              r.raise_for_status()
              body=r.json()
              if body.get('ok') is not True:
                  raise RuntimeError(f'bridge rejected {action}: {body}')
              return body

          def parse(raw):
              reader=csv.DictReader(io.StringIO(raw.decode('utf-8-sig')), delimiter=';')
              rows=list(reader)
              return list(reader.fieldnames or []), rows

          def index(rows):
              out={}
              for row in rows:
                  key=(row.get('cabinet',''),row.get('dataset',''),row.get('report_id',''))
                  if not all(key) or key in out:
                      raise RuntimeError(f'invalid/duplicate registry key: {key}')
                  out[key]=row
              return out

          resp=post('read', path='app/registry', filename='reports_registry.csv')
          if resp.get('found') is not True:
              raise RuntimeError('canonical Drive registry missing')
          drive_raw=base64.b64decode(resp.get('content_base64',''), validate=True)
          df,dr=parse(drive_raw); yf,yr=parse(yandex_raw)
          if df != yf:
              raise RuntimeError('registry headers differ')
          di=index(dr); yi=index(yr)
          if set(di)-set(yi):
              raise RuntimeError(f'Drive has {len(set(di)-set(yi))} keys absent from Yandex; refusing')
          mismatches=[k for k in di if di[k] != yi[k]]
          if mismatches:
              raise RuntimeError(f'overlap mismatch total={len(mismatches)} first={mismatches[:3]}')
          if len(yi) < len(di):
              raise RuntimeError('Yandex registry older than Drive')

          dsha=hashlib.sha256(drive_raw).hexdigest(); ysha=hashlib.sha256(yandex_raw).hexdigest()
          print(f'DRIVE_BEFORE rows={len(dr)} bytes={len(drive_raw)} sha256={dsha}')
          print(f'YANDEX_SOURCE rows={len(yr)} bytes={len(yandex_raw)} sha256={ysha}')
          print(f'OVERLAP_EXACT={len(di)} NEW_KEYS={len(yi)-len(di)}')

          if drive_raw != yandex_raw:
              backup=f'reports_registry__pre_reconcile_2026-09-14__{dsha[:12]}.csv'
              b=post('write', path='app/registry/backups', filename=backup, mime_type='text/csv', content_base64=base64.b64encode(drive_raw).decode('ascii'), sha256=dsha)
              if str(b.get('sha256','')).lower()!=dsha:
                  raise RuntimeError('backup SHA mismatch')
              w=post('write', path='app/registry', filename='reports_registry.csv', mime_type='text/csv', content_base64=base64.b64encode(yandex_raw).decode('ascii'), sha256=ysha)
              if str(w.get('sha256','')).lower()!=ysha:
                  raise RuntimeError('canonical write SHA mismatch')
              v=post('read', path='app/registry', filename='reports_registry.csv')
              vr=base64.b64decode(v.get('content_base64',''), validate=True)
              if vr != yandex_raw or hashlib.sha256(vr).hexdigest()!=ysha:
                  raise RuntimeError('canonical read-back mismatch')
              print('DRIVE_REGISTRY_RECONCILE=PASS')
              print('BACKUP_FILE='+backup)
          else:
              print('REGISTRY_ALREADY_SYNCED=PASS')

          counts=Counter(r.get('cabinet','') for r in yr if r.get('status')=='COMPLETE')
          for c in ('wb_dmitrieva','wb_novokshenov','wb_laser_master'):
              print(f'CANONICAL_COMPLETE_{c}={counts[c]}')
          print('CANONICAL_REGISTRY_SHA256='+ysha)
          client.close()
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/payload.json" "$RUNNER_TEMP/bridge-secret" "$RUNNER_TEMP/yandex-registry.csv"
