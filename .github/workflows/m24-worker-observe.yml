name: M24 Worker Observe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m24-worker-observe.yml"

permissions:
  contents: read
  id-token: write

jobs:
  observe:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 12
    env:
      DEPLOYER_SERVICE_ACCOUNT_ID: ajecdjjrkdo1t3itpl9k
      OIDC_AUDIENCE: https://github.com/alexpmtk-afk
      EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/mcp-yandex-cloud-infra@1349853397:environment:test
      FOLDER_ID: b1g00gqb66tbnfoumnkv
      WORKER_CONTAINER_ID: bbamdg0po6fkukhod2e9
      TIMER_TRIGGER_ID: a1s4ho32v7dha59aeu60
    steps:
      - name: Mint Yandex IAM token through GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          A="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          S='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && S='&'
          R="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${S}audience=${A}")"
          J="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$R")"
          echo "::add-mask::$J"
          python - "$J" <<'PY'
          import base64,json,os,sys
          p=sys.argv[1].split('.')[1]; p += '='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          assert c.get('sub')==os.environ['EXPECTED_OIDC_SUBJECT']
          assert c.get('aud')==os.environ['OIDC_AUDIENCE']
          assert c.get('environment')=='test'
          assert c.get('ref')=='refs/heads/main'
          print('M24_OBSERVE_OIDC_CLAIMS=PASS')
          PY
          X="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${DEPLOYER_SERVICE_ACCOUNT_ID}" --data-urlencode "subject_token=${J}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          T="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$X")"
          test -n "$T"
          echo "::add-mask::$T"
          printf '%s' "$T" > "$RUNNER_TEMP/iam-token"
          echo 'M24_OBSERVE_OIDC_EXCHANGE=PASS'

      - name: Install official Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tar.gz"
          tar -xzf "$RUNNER_TEMP/yc.tar.gz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          "$RUNNER_TEMP/yc/yc" version
          echo 'YC_CLI_INSTALL=PASS'

      - name: Inspect timer target, latest container revision and invoker binding
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/iam-token")"
          YC_IAM_TOKEN="$TOKEN" "$RUNNER_TEMP/yc/yc" serverless trigger get --id="$TIMER_TRIGGER_ID" --format=json > "$RUNNER_TEMP/trigger.json"
          YC_IAM_TOKEN="$TOKEN" "$RUNNER_TEMP/yc/yc" serverless container list-access-bindings --id="$WORKER_CONTAINER_ID" --format=json > "$RUNNER_TEMP/bindings.json"
          YC_IAM_TOKEN="$TOKEN" "$RUNNER_TEMP/yc/yc" serverless container revision list --container-id="$WORKER_CONTAINER_ID" --format=json > "$RUNNER_TEMP/revisions.json"
          REVISION_ID="$(python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'revisions.json').read_text())
          rows=d if isinstance(d,list) else (d.get('revisions') or d.get('containerRevisions') or [])
          assert isinstance(rows,list) and rows, 'no revisions returned for worker container'
          rows=[r for r in rows if isinstance(r,dict) and str(r.get('container_id') or r.get('containerId') or '')==os.environ['WORKER_CONTAINER_ID']]
          assert rows, 'no revision belongs to expected worker container'
          rows.sort(key=lambda r: str(r.get('created_at') or r.get('createdAt') or ''), reverse=True)
          latest=rows[0]
          revision_id=str(latest.get('id') or '')
          assert revision_id, 'latest revision id missing'
          print(revision_id)
          PY
          )"
          test -n "$REVISION_ID"
          YC_IAM_TOKEN="$TOKEN" "$RUNNER_TEMP/yc/yc" serverless container revision get --id="$REVISION_ID" --format=json > "$RUNNER_TEMP/revision.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])
          t=json.loads((base/'trigger.json').read_text())
          rule=t.get('rule') or {}
          timer=rule.get('timer') or {}
          invoke=timer.get('invoke_container_with_retry') or timer.get('invokeContainerWithRetry') or {}
          status=str(t.get('status') or '')
          cron=str(timer.get('cron_expression') or timer.get('cronExpression') or '')
          target=str(invoke.get('container_id') or invoke.get('containerId') or '')
          sa=str(invoke.get('service_account_id') or invoke.get('serviceAccountId') or '')
          assert status=='ACTIVE', status
          assert target==os.environ['WORKER_CONTAINER_ID'], target
          assert sa, 'trigger service account missing'
          print(f'M24_TRIGGER_STATUS={status}')
          print(f'M24_TRIGGER_CRON={cron}')
          print('M24_TRIGGER_TARGET_MATCH=PASS')

          b=json.loads((base/'bindings.json').read_text())
          rows=b if isinstance(b,list) else (b.get('access_bindings') or b.get('accessBindings') or [])
          ok=False
          for x in rows:
              if not isinstance(x,dict):
                  continue
              role=str(x.get('role_id') or x.get('roleId') or '')
              subject=x.get('subject') or {}
              sid=str(subject.get('id') or '') if isinstance(subject,dict) else ''
              if role in {'serverless-containers.containerInvoker','serverless.containers.invoker'} and sid==sa:
                  ok=True
          assert ok, 'timer service account lacks container invoker binding'
          print(f'M24_CONTAINER_BINDING_COUNT={len(rows)}')
          print('M24_TRIGGER_CONTAINER_INVOKER_BINDING=PASS')
          print(f'M24_TRIGGER_SERVICE_ACCOUNT_ID={sa}')

          r=json.loads((base/'revision.json').read_text())
          revision_status=str(r.get('status') or '')
          revision_container=str(r.get('container_id') or r.get('containerId') or '')
          assert revision_container==os.environ['WORKER_CONTAINER_ID'], revision_container
          log_opts=r.get('log_options') or r.get('logOptions') or {}
          log_disabled=bool(log_opts.get('disabled')) if isinstance(log_opts,dict) else False
          runtime=r.get('runtime') or {}
          runtime_type=str(runtime.get('type') or '') if isinstance(runtime,dict) else ''
          assert revision_status=='ACTIVE', revision_status
          assert not log_disabled, 'worker revision logging is explicitly disabled'
          print(f'M24_WORKER_REVISION_ID={r.get("id","")}')
          print(f'M24_WORKER_REVISION_STATUS={revision_status}')
          print(f'M24_WORKER_RUNTIME_TYPE={runtime_type or "UNKNOWN"}')
          print(f'M24_WORKER_LOGGING_DISABLED={str(log_disabled).upper()}')
          print('M24_WORKER_REVISION_DIAGNOSTICS=PASS')
          PY

      - name: Query trigger and container Monitoring metrics
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/iam-token")"
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          now=datetime.now(timezone.utc)
          start=now-timedelta(minutes=30)
          queries={
            'trigger_events': f'serverless.triggers.read_events_per_second{{service="serverless-functions",trigger="{os.environ["TIMER_TRIGGER_ID"]}",type="incoming"}}',
            'trigger_access_errors': f'serverless.triggers.access_error_per_second{{service="serverless-functions",trigger="{os.environ["TIMER_TRIGGER_ID"]}",type="request"}}',
            'trigger_call_errors': f'serverless.triggers.error_per_second{{service="serverless-functions",trigger="{os.environ["TIMER_TRIGGER_ID"]}",type="request"}}',
            'trigger_execution': f'serverless.triggers.execution_time_milliseconds{{service="serverless-functions",trigger="{os.environ["TIMER_TRIGGER_ID"]}",type="request"}}',
            'container_execution': f'serverless.containers.execution_time_milliseconds{{service="serverless-containers",container="{os.environ["WORKER_CONTAINER_ID"]}"}}',
          }
          base=Path(os.environ['RUNNER_TEMP'])
          for name,q in queries.items():
              body={
                'query': q,
                'fromTime': start.isoformat().replace('+00:00','Z'),
                'toTime': now.isoformat().replace('+00:00','Z'),
                'downsampling': {'disabled': True},
              }
              (base/f'monitoring-{name}-request.json').write_text(json.dumps(body))
          PY

          for name in trigger_events trigger_access_errors trigger_call_errors trigger_execution container_execution; do
            code="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
              --output "$RUNNER_TEMP/monitoring-${name}.json" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --header "Authorization: Bearer ${TOKEN}" \
              --data "@$RUNNER_TEMP/monitoring-${name}-request.json" \
              "https://monitoring.api.cloud.yandex.net/monitoring/v2/data/read?folderId=${FOLDER_ID}")"
            echo "M24_MONITORING_${name^^}_HTTP=$code"
            printf '%s' "$code" > "$RUNNER_TEMP/monitoring-${name}-code.txt"
          done

          python - <<'PY'
          import json, os
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])
          names=['trigger_events','trigger_access_errors','trigger_call_errors','trigger_execution','container_execution']
          all_200=True
          for name in names:
              code=(base/f'monitoring-{name}-code.txt').read_text().strip()
              if code!='200':
                  all_200=False
                  print(f'M24_MONITORING_{name.upper()}_ACCESS=UNAVAILABLE_HTTP_{code}')
                  continue
              data=json.loads((base/f'monitoring-{name}.json').read_text())
              metrics=data.get('metrics') or [] if isinstance(data,dict) else []
              points=0
              nonzero=0
              for m in metrics:
                  ts=(m.get('timeseries') or {}) if isinstance(m,dict) else {}
                  vals=[]
                  vals.extend(ts.get('doubleValues') or [])
                  vals.extend(ts.get('int64Values') or [])
                  points += len(vals)
                  nonzero += sum(1 for v in vals if isinstance(v,(int,float)) and v>0)
              print(f'M24_MONITORING_{name.upper()}_SERIES={len(metrics)}')
              print(f'M24_MONITORING_{name.upper()}_POINTS={points}')
              print(f'M24_MONITORING_{name.upper()}_NONZERO_POINTS={nonzero}')
          print('M24_MONITORING_ACCESS=' + ('PASS' if all_200 else 'INSUFFICIENT_OR_UNAVAILABLE'))
          PY

      - name: Check logging visibility independently
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/iam-token")"
          set +e
          YC_IAM_TOKEN="$TOKEN" "$RUNNER_TEMP/yc/yc" logging group list --folder-id="$FOLDER_ID" --format=json > "$RUNNER_TEMP/log-groups.json" 2> "$RUNNER_TEMP/log-groups.err"
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            echo "M24_LOG_GROUP_LIST=UNAVAILABLE_RC_${rc}"
          else
            python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'log-groups.json').read_text())
          rows=d if isinstance(d,list) else (d.get('log_groups') or d.get('logGroups') or d.get('groups') or [])
          print(f'M24_LOG_GROUP_COUNT={len(rows) if isinstance(rows,list) else 0}')
          print('M24_LOG_GROUP_LIST=PASS')
          PY
          fi

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/iam-token" "$RUNNER_TEMP/yc" "$RUNNER_TEMP/yc.tar.gz" "$RUNNER_TEMP/trigger.json" "$RUNNER_TEMP/revisions.json" "$RUNNER_TEMP/revision.json" "$RUNNER_TEMP/bindings.json" "$RUNNER_TEMP/log-groups.json" "$RUNNER_TEMP/log-groups.err" "$RUNNER_TEMP"/monitoring-*.json "$RUNNER_TEMP"/monitoring-*-code.txt
