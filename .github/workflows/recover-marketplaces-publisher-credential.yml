name: Recover Marketplaces Publisher Federated Credential

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-marketplaces-publisher-credential.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplaces-test-publisher-credential-recovery
  cancel-in-progress: false

env:
  CLOUD_ID: b1gi4pr9msenirafh2c7
  MARKETPLACES_FOLDER_NAME: marketplaces-mcp-test
  BIRZHA_FOLDER_NAME: birzha-mcp-forecast-test
  PUBLISHER_SA_ID: ajepo7pe5jcrufdf0mv0
  PUBLISHER_SA_NAME: marketplaces-mcp-image-publisher
  SHARED_GITHUB_FEDERATION_ID: ajeccljd5pi9ive0i18u
  EXPECTED_SUBJECT: repo:alexpmtk-afk@309119594/marketplaces-mcp-ru@1349601380:ref:refs/heads/main
  EXPECTED_AUDIENCE: https://github.com/alexpmtk-afk
  EXPECTED_ISSUER: https://token.actions.githubusercontent.com

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/yc/bin/yc" version

      - name: Authenticate central infrastructure deployer
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          CI_SA_ID="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          [[ "$CI_SA_ID" == "ajecdjjrkdo1t3itpl9k" ]]
          echo "::add-mask::$CI_SA_ID"
          echo "CI_SA_ID=$CI_SA_ID" >> "$GITHUB_ENV"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"

      - name: Resolve and prove existing project identities
        shell: bash
        run: |
          set -euo pipefail
          MARKET_FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r --arg n "$MARKETPLACES_FOLDER_NAME" '.[]|select(.name==$n)|.id' | head -1)"
          BIRZHA_FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r --arg n "$BIRZHA_FOLDER_NAME" '.[]|select(.name==$n)|.id' | head -1)"
          test -n "$MARKET_FOLDER_ID"; test -n "$BIRZHA_FOLDER_ID"
          [[ "$MARKET_FOLDER_ID" != "$BIRZHA_FOLDER_ID" ]]
          echo "MARKET_FOLDER_ID=$MARKET_FOLDER_ID" >> "$GITHUB_ENV"
          echo "BIRZHA_FOLDER_ID=$BIRZHA_FOLDER_ID" >> "$GITHUB_ENV"

          timeout 45s yc iam service-account get "$PUBLISHER_SA_ID" --format json --no-user-output > "$RUNNER_TEMP/publisher.json"
          jq -e --arg id "$PUBLISHER_SA_ID" --arg name "$PUBLISHER_SA_NAME" --arg folder "$MARKET_FOLDER_ID" \
            '(.id==$id) and (.name==$name) and (.folder_id==$folder or .folderId==$folder)' "$RUNNER_TEMP/publisher.json" >/dev/null

          timeout 45s yc iam workload-identity oidc federation get "$SHARED_GITHUB_FEDERATION_ID" --format json --no-user-output > "$RUNNER_TEMP/federation.json"
          jq -e --arg id "$SHARED_GITHUB_FEDERATION_ID" --arg folder "$BIRZHA_FOLDER_ID" --arg issuer "$EXPECTED_ISSUER" --arg aud "$EXPECTED_AUDIENCE" '
            (.id==$id) and
            ((.folder_id==$folder) or (.folderId==$folder)) and
            (.issuer==$issuer) and
            (((.audiences // []) | index($aud)) != null) and
            ((.disabled // false)==false)
          ' "$RUNNER_TEMP/federation.json" >/dev/null
          echo 'existing_cross_project_identity_boundary=PASS'

      - name: Record pre-existing bootstrap bindings
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s yc resource-manager folder list-access-bindings "$MARKET_FOLDER_ID" --format json --no-user-output > "$RUNNER_TEMP/market-bindings-before.json"
          timeout 45s yc resource-manager folder list-access-bindings "$BIRZHA_FOLDER_ID" --format json --no-user-output > "$RUNNER_TEMP/birzha-bindings-before.json"
          timeout 45s yc iam service-account list-access-bindings "$PUBLISHER_SA_ID" --format json --no-user-output > "$RUNNER_TEMP/publisher-bindings-before.json"

          MARKET_ADMIN_PRESENT="$(jq -r --arg id "$CI_SA_ID" 'any(.[]; .role_id=="admin" and .subject.type=="serviceAccount" and .subject.id==$id)' "$RUNNER_TEMP/market-bindings-before.json")"
          BIRZHA_USER_PRESENT="$(jq -r --arg id "$CI_SA_ID" 'any(.[]; .role_id=="iam.workloadIdentityFederations.user" and .subject.type=="serviceAccount" and .subject.id==$id)' "$RUNNER_TEMP/birzha-bindings-before.json")"
          PUBLISHER_EDITOR_PRESENT="$(jq -r --arg id "$CI_SA_ID" 'any(.[]; .role_id=="iam.serviceAccounts.federatedCredentialEditor" and .subject.type=="serviceAccount" and .subject.id==$id)' "$RUNNER_TEMP/publisher-bindings-before.json")"
          echo "MARKET_ADMIN_PRESENT=$MARKET_ADMIN_PRESENT" >> "$GITHUB_ENV"
          echo "BIRZHA_USER_PRESENT=$BIRZHA_USER_PRESENT" >> "$GITHUB_ENV"
          echo "PUBLISHER_EDITOR_PRESENT=$PUBLISHER_EDITOR_PRESENT" >> "$GITHUB_ENV"
          echo 'bootstrap_binding_inventory=PASS'

      - name: Grant only temporary permissions required to link existing resources
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MARKET_ADMIN_PRESENT" != "true" ]]; then
            timeout 90s yc resource-manager folder add-access-binding "$MARKET_FOLDER_ID" --role admin --service-account-id "$CI_SA_ID"
            echo 'MARKET_ADMIN_ADDED=true' >> "$GITHUB_ENV"
          fi
          sleep 15

          if [[ "$BIRZHA_USER_PRESENT" != "true" ]]; then
            timeout 90s yc resource-manager folder add-access-binding "$BIRZHA_FOLDER_ID" \
              --role iam.workloadIdentityFederations.user --service-account-id "$CI_SA_ID"
            echo 'BIRZHA_USER_ADDED=true' >> "$GITHUB_ENV"
          fi

          if [[ "$PUBLISHER_EDITOR_PRESENT" != "true" ]]; then
            timeout 90s yc iam service-account add-access-binding "$PUBLISHER_SA_ID" \
              --role iam.serviceAccounts.federatedCredentialEditor --service-account-id "$CI_SA_ID"
            echo 'PUBLISHER_EDITOR_ADDED=true' >> "$GITHUB_ENV"
          fi
          sleep 20
          echo 'temporary_cross_project_link_permissions=READY'

      - name: Create or reuse exact Marketplaces federated credential
        id: credential
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s yc iam workload-identity federated-credential list \
            --service-account-id "$PUBLISHER_SA_ID" --format json --no-user-output > "$RUNNER_TEMP/credentials-before.json"
          EXISTING_ID="$(jq -r --arg f "$SHARED_GITHUB_FEDERATION_ID" --arg s "$EXPECTED_SUBJECT" '
            [.[] | select(((.federation_id // .federationId)==$f) and ((.external_subject_id // .externalSubjectId)==$s)) | (.id // .federated_credential_id // .federatedCredentialId)] | first // empty
          ' "$RUNNER_TEMP/credentials-before.json")"

          if [[ -n "$EXISTING_ID" ]]; then
            CREDENTIAL_ID="$EXISTING_ID"
            echo 'credential_action=REUSED'
          else
            timeout 90s yc iam workload-identity federated-credential create \
              --service-account-id "$PUBLISHER_SA_ID" \
              --federation-id "$SHARED_GITHUB_FEDERATION_ID" \
              --external-subject-id "$EXPECTED_SUBJECT" \
              --format json --no-user-output > "$RUNNER_TEMP/credential-created.json"
            CREDENTIAL_ID="$(jq -r '.id // .federated_credential_id // .federatedCredentialId // empty' "$RUNNER_TEMP/credential-created.json")"
            test -n "$CREDENTIAL_ID"
            echo 'credential_action=CREATED'
          fi
          echo "CREDENTIAL_ID=$CREDENTIAL_ID" >> "$GITHUB_ENV"
          echo "credential_id=$CREDENTIAL_ID" >> "$GITHUB_OUTPUT"

      - name: Verify exact credential and no identity widening
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s yc iam workload-identity federated-credential list \
            --service-account-id "$PUBLISHER_SA_ID" --format json --no-user-output > "$RUNNER_TEMP/credentials-after.json"
          MATCHES="$(jq --arg f "$SHARED_GITHUB_FEDERATION_ID" --arg s "$EXPECTED_SUBJECT" '[.[] | select(((.federation_id // .federationId)==$f) and ((.external_subject_id // .externalSubjectId)==$s))] | length' "$RUNNER_TEMP/credentials-after.json")"
          test "$MATCHES" -eq 1
          jq -e --arg id "$CREDENTIAL_ID" --arg f "$SHARED_GITHUB_FEDERATION_ID" --arg s "$EXPECTED_SUBJECT" '
            .[] | select(
              ((.id // .federated_credential_id // .federatedCredentialId)==$id) and
              ((.federation_id // .federationId)==$f) and
              ((.external_subject_id // .externalSubjectId)==$s)
            )
          ' "$RUNNER_TEMP/credentials-after.json" >/dev/null
          echo 'marketplaces_federated_credential=PASS'

          mkdir -p evidence
          jq -n \
            --arg publisher_service_account_id "$PUBLISHER_SA_ID" \
            --arg federation_id "$SHARED_GITHUB_FEDERATION_ID" \
            --arg federated_credential_id "$CREDENTIAL_ID" \
            --arg external_subject_id "$EXPECTED_SUBJECT" \
            '{schema:"MARKETPLACES_PUBLISHER_FEDERATED_CREDENTIAL_V1", publisher_service_account_id:$publisher_service_account_id, federation_id:$federation_id, federated_credential_id:$federated_credential_id, external_subject_id:$external_subject_id, production_changed:false}' \
            > evidence/marketplaces-publisher-federated-credential.json

      - name: Upload non-secret recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: marketplaces-publisher-federated-credential
          path: evidence/marketplaces-publisher-federated-credential.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary bootstrap permissions and ephemeral key
        if: always()
        shell: bash
        run: |
          set +e
          if [[ "${PUBLISHER_EDITOR_ADDED:-false}" == "true" && -n "${PUBLISHER_SA_ID:-}" && -n "${CI_SA_ID:-}" ]]; then
            yc iam service-account remove-access-binding "$PUBLISHER_SA_ID" \
              --role iam.serviceAccounts.federatedCredentialEditor --service-account-id "$CI_SA_ID" >/dev/null 2>&1 || true
          fi
          if [[ "${BIRZHA_USER_ADDED:-false}" == "true" && -n "${BIRZHA_FOLDER_ID:-}" && -n "${CI_SA_ID:-}" ]]; then
            yc resource-manager folder remove-access-binding "$BIRZHA_FOLDER_ID" \
              --role iam.workloadIdentityFederations.user --service-account-id "$CI_SA_ID" >/dev/null 2>&1 || true
          fi
          if [[ "${MARKET_ADMIN_ADDED:-false}" == "true" && -n "${MARKET_FOLDER_ID:-}" && -n "${CI_SA_ID:-}" ]]; then
            yc resource-manager folder remove-access-binding "$MARKET_FOLDER_ID" \
              --role admin --service-account-id "$CI_SA_ID" >/dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP"/*bindings-before.json "$RUNNER_TEMP"/publisher.json "$RUNNER_TEMP"/federation.json "$RUNNER_TEMP"/credentials-*.json "$RUNNER_TEMP"/credential-created.json
          echo 'temporary_bootstrap_permissions=CLEANUP_ATTEMPTED'
