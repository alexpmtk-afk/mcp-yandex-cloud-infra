name: Resume Marketplaces TEST Runtime Once

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplaces-test-runtime-write
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 30
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          ARCHIVE="$RUNNER_TEMP/yc/yc.tgz"
          wget --quiet --timeout=30 --tries=3 --output-document="$ARCHIVE" "$URL"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate existing TEST deployer
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "YC_SERVICE_ACCOUNT_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          yc config profile create bridge-v1-resume || true
          yc config set service-account-key "$KEY_FILE"

      - name: Resolve existing Marketplaces TEST resources
        id: resources
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          CLUSTER_ID="$(timeout 45s yc managed-redis cluster list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-valkey")|.id'|head -1)"
          GATEWAY_ID="$(timeout 45s yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].id//empty')"
          GATEWAY_DOMAIN="$(timeout 45s yc serverless api-gateway get --id "$GATEWAY_ID" --format json --no-user-output | jq -r '.domain//empty')"
          CONTAINER_ID="$(timeout 45s yc serverless container list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          CONTAINER_URL="$(timeout 45s yc serverless container get --id "$CONTAINER_ID" --format json --no-user-output | jq -r '.url//empty')"
          for v in CLUSTER_ID GATEWAY_ID GATEWAY_DOMAIN CONTAINER_ID CONTAINER_URL; do test -n "${!v}"; done
          echo "cluster=$CLUSTER_ID" >> "$GITHUB_OUTPUT"
          echo "gateway=$GATEWAY_ID" >> "$GITHUB_OUTPUT"
          echo "gateway_domain=$GATEWAY_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "container=$CONTAINER_ID" >> "$GITHUB_OUTPUT"
          echo "container_url=$CONTAINER_URL" >> "$GITHUB_OUTPUT"
          echo 'MARKETPLACES_EXISTING_RESOURCES=RESOLVED'

      - name: Start existing Valkey cluster if stopped
        shell: bash
        env:
          CLUSTER_ID: ${{ steps.resources.outputs.cluster }}
        run: |
          set -euo pipefail
          STATUS="$(yc managed-redis cluster get --id "$CLUSTER_ID" --format json --no-user-output | jq -r '.status//empty')"
          echo "valkey_initial_status=$STATUS"
          if [[ "$STATUS" == "STOPPED" ]]; then
            yc managed-redis cluster start --id "$CLUSTER_ID" --async --format json --no-user-output > "$RUNNER_TEMP/valkey-start-operation.json"
            OPERATION_ID="$(jq -r '.id//empty' "$RUNNER_TEMP/valkey-start-operation.json")"
            test -n "$OPERATION_ID"
            echo "valkey_start_operation=$OPERATION_ID"
          elif [[ "$STATUS" != "RUNNING" && "$STATUS" != "STARTING" ]]; then
            echo "Unexpected Valkey status before start: $STATUS" >&2
            exit 1
          fi

          for attempt in $(seq 1 120); do
            STATUS="$(yc managed-redis cluster get --id "$CLUSTER_ID" --format json --no-user-output | jq -r '.status//empty')"
            HEALTH="$(yc managed-redis cluster get --id "$CLUSTER_ID" --format json --no-user-output | jq -r '.health//empty')"
            echo "valkey_wait attempt=$attempt status=$STATUS health=$HEALTH"
            [[ "$STATUS" == "RUNNING" ]] && break
            [[ "$STATUS" == "ERROR" ]] && { echo 'Valkey entered ERROR state' >&2; exit 1; }
            sleep 5
          done
          [[ "$STATUS" == "RUNNING" ]]
          echo 'MARKETPLACES_VALKEY=RUNNING'

      - name: Resume existing API Gateway if stopped
        shell: bash
        env:
          GATEWAY_ID: ${{ steps.resources.outputs.gateway }}
        run: |
          set -euo pipefail
          STATUS="$(yc serverless api-gateway get --id "$GATEWAY_ID" --format json --no-user-output | jq -r '.status//empty')"
          echo "gateway_initial_status=$STATUS"
          if [[ "$STATUS" == "STOPPED" ]]; then
            yc serverless api-gateway resume --id "$GATEWAY_ID" --async --format json --no-user-output > "$RUNNER_TEMP/gateway-resume-operation.json"
            OPERATION_ID="$(jq -r '.id//empty' "$RUNNER_TEMP/gateway-resume-operation.json")"
            test -n "$OPERATION_ID"
            echo "gateway_resume_operation=$OPERATION_ID"
          elif [[ "$STATUS" != "ACTIVE" && "$STATUS" != "UPDATING" ]]; then
            echo "Unexpected API Gateway status before resume: $STATUS" >&2
            exit 1
          fi

          for attempt in $(seq 1 90); do
            STATUS="$(yc serverless api-gateway get --id "$GATEWAY_ID" --format json --no-user-output | jq -r '.status//empty')"
            echo "gateway_wait attempt=$attempt status=$STATUS"
            [[ "$STATUS" == "ACTIVE" ]] && break
            [[ "$STATUS" == "ERROR" ]] && { echo 'API Gateway entered ERROR state' >&2; exit 1; }
            sleep 5
          done
          [[ "$STATUS" == "ACTIVE" ]]
          echo 'MARKETPLACES_API_GATEWAY=ACTIVE'

      - name: Verify active Bridge v1 runtime health
        shell: bash
        env:
          CONTAINER_URL: ${{ steps.resources.outputs.container_url }}
          GATEWAY_DOMAIN: ${{ steps.resources.outputs.gateway_domain }}
        run: |
          set -euo pipefail
          IAM_TOKEN="$(timeout 45s yc iam create-token)"
          test -n "$IAM_TOKEN"
          echo "::add-mask::$IAM_TOKEN"
          DIRECT_CODE=000
          GATEWAY_CODE=000
          for attempt in $(seq 1 36); do
            DIRECT_CODE="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/direct-health" -w '%{http_code}' -H "Authorization: Bearer $IAM_TOKEN" "${CONTAINER_URL%/}/healthz" || true)"
            GATEWAY_CODE="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/gateway-health" -w '%{http_code}' "https://${GATEWAY_DOMAIN}/healthz" || true)"
            echo "health_wait attempt=$attempt direct=$DIRECT_CODE gateway=$GATEWAY_CODE"
            [[ "$DIRECT_CODE" == 200 && "$GATEWAY_CODE" == 200 ]] && break
            sleep 5
          done
          if [[ "$DIRECT_CODE" != 200 || "$GATEWAY_CODE" != 200 ]]; then
            echo '--- sanitized health response bodies ---'
            python - <<'PY'
          import re
          from pathlib import Path
          def clean(s):
              s=re.sub(r'https?://[^\s\"\']+','<url>',s)
              s=re.sub(r'(?i)(authorization|bearer|token|secret|password)(\s*[:=]\s*)[^,}\s]+',r'\1\2<redacted>',s)
              return s[:1500]
          for label,name in [('DIRECT_HEALTH_BODY','direct-health'),('GATEWAY_HEALTH_BODY','gateway-health')]:
              p=Path('/home/runner/work/_temp')/name
              print(label+'='+clean(p.read_text(errors='replace') if p.exists() else '<missing>'))
          PY
            exit 1
          fi
          echo 'MARKETPLACES_ACTIVE_REVISION_HEALTH=PASS'

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/valkey-start-operation.json" "$RUNNER_TEMP/gateway-resume-operation.json" "$RUNNER_TEMP/direct-health" "$RUNNER_TEMP/gateway-health"
