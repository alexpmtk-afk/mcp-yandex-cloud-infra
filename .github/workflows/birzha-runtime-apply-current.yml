name: Deploy current BIRZHA MCP TEST runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/birzha-runtime-apply-current.yml"
      - "terraform/birzha_test/**"

permissions:
  contents: read

concurrency:
  group: birzha-current-test-runtime
  cancel-in-progress: false

env:
  SOURCE_SHA: b84da3ac95b8d5412f9614f91aa04c3273fb5075
  IMAGE_DIGEST: sha256:e160e6a12ea7d782f1446f7895a59f6b4f3354dd2f3a34969a017d65862e4c3e
  IMAGE_URL: cr.yandex/crpk5qvf4p7kcqil2u3v/birzha-mcp-forecast@sha256:e160e6a12ea7d782f1446f7895a59f6b4f3354dd2f3a34969a017d65862e4c3e
  EXPECTED_REGISTRY_ID: crpk5qvf4p7kcqil2u3v

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 35

    steps:
      - name: Checkout exact infrastructure main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.8"

      - name: Assert immutable application coordinates
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$IMAGE_URL" == "cr.yandex/${EXPECTED_REGISTRY_ID}/birzha-mcp-forecast@${IMAGE_DIGEST}" ]]

      - name: Prepare ephemeral Yandex provider key
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "TF_VAR_yc_service_account_key_file=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Initialize isolated BIRZHA state
        shell: bash
        env:
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$YC_TFSTATE_ACCESS_KEY"
          test -n "$YC_TFSTATE_SECRET_KEY"
          terraform -chdir=terraform/birzha_test init \
            -reconfigure -input=false -lockfile=readonly \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" \
            -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY"

      - name: Build phase-one fail-closed deployment plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/birzha_test plan \
            -input=false -no-color \
            -out=runtime-phase1.tfplan \
            -var="source_commit_sha=${SOURCE_SHA}" \
            -var="mcp_image_url=${IMAGE_URL}" \
            -var="mcp_allowed_hosts=__remote_host_not_configured__.invalid" \
            -var="mcp_allowed_origins="
          terraform -chdir=terraform/birzha_test show -json runtime-phase1.tfplan > "$RUNNER_TEMP/runtime-phase1-plan.json"
          terraform -chdir=terraform/birzha_test show -no-color runtime-phase1.tfplan > "$RUNNER_TEMP/runtime-phase1-plan.txt"

      - name: Assert phase-one plan safety and durable runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan=json.loads(Path(os.environ['RUNNER_TEMP']).joinpath('runtime-phase1-plan.json').read_text())
          changed={x['address']:x['change']['actions'] for x in plan.get('resource_changes',[]) if x['change']['actions'] != ['no-op']}
          allowed={
            'yandex_ydb_database_serverless.state',
            'yandex_ydb_database_iam_binding.runtime_editor',
            'yandex_serverless_container.mcp[0]',
            'yandex_serverless_container_iam_member.gateway_invoker[0]',
            'yandex_api_gateway.mcp[0]',
          }
          unexpected=set(changed)-allowed
          if unexpected:
              raise SystemExit(f'Unexpected deployment resource delta: {sorted(unexpected)}')
          if any('delete' in actions for actions in changed.values()):
              raise SystemExit(f'Destroy/replace action forbidden: {changed}')
          required={'yandex_ydb_database_serverless.state','yandex_ydb_database_iam_binding.runtime_editor','yandex_serverless_container.mcp[0]','yandex_serverless_container_iam_member.gateway_invoker[0]','yandex_api_gateway.mcp[0]'}
          missing=required-set(changed)
          if missing:
              raise SystemExit(f'Missing expected first deployment resources: {sorted(missing)}')
          rc={x['address']:x for x in plan['resource_changes']}
          c=rc['yandex_serverless_container.mcp[0]']['change']['after']
          if c.get('concurrency') != 1:
              raise SystemExit(f'Container concurrency must be 1, got {c.get("concurrency")}')
          image=c['image'][0]
          if image.get('url') != os.environ['IMAGE_URL']:
              raise SystemExit('Container image is not the approved immutable digest')
          env=image.get('environment') or {}
          expected={
            'BIRZHA_SOURCE_COMMIT':os.environ['SOURCE_SHA'],
            'BIRZHA_STATE_BACKEND':'ydb',
            'MCP_ALLOWED_HOSTS':'__remote_host_not_configured__.invalid',
            'MCP_ALLOWED_ORIGINS':'',
          }
          for k,v in expected.items():
              if env.get(k) != v:
                  raise SystemExit(f'{k} mismatch: {env.get(k)!r}')
          if not env.get('YDB_CONNECTION_STRING'):
              raise SystemExit('YDB_CONNECTION_STRING is absent from planned runtime')
          ydb=rc['yandex_ydb_database_serverless.state']['change']['after']
          if not ydb.get('deletion_protection'):
              raise SystemExit('YDB deletion_protection must be enabled')
          print('PHASE1_RUNTIME_PLAN_SAFETY_PASS')
          print('changed=' + ','.join(sorted(changed)))
          PY

      - name: Apply exact phase-one plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/birzha_test apply -input=false -auto-approve runtime-phase1.tfplan

      - name: Capture phase-one outputs and gateway domain
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/birzha_test output -json > "$RUNNER_TEMP/phase1-outputs.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'phase1-outputs.json'
          o=json.loads(p.read_text())
          required=('test_folder_id','container_registry_id','runtime_service_account_id','gateway_service_account_id','ydb_database_id','serverless_container_id','api_gateway_id','api_gateway_domain','mcp_endpoint')
          values={k:o[k]['value'] for k in required}
          for k,v in values.items():
              if not v:
                  raise SystemExit(f'Missing deployment output {k}')
          if values['container_registry_id'] != os.environ['EXPECTED_REGISTRY_ID']:
              raise SystemExit('Registry identity drift')
          domain=values['api_gateway_domain'].strip()
          if '/' in domain or not domain:
              raise SystemExit(f'Invalid gateway domain {domain!r}')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'GATEWAY_DOMAIN={domain}\n')
              f.write(f'MCP_ENDPOINT=https://{domain}/mcp\n')
          print('PHASE1_OUTPUTS_PASS')
          print('gateway_domain=' + domain)
          print('ydb_database_id=' + values['ydb_database_id'])
          PY

      - name: Build phase-two real-host plan
        shell: bash
        run: |
          set -euo pipefail
          REAL_HOSTS="${GATEWAY_DOMAIN},${GATEWAY_DOMAIN}:*"
          terraform -chdir=terraform/birzha_test plan \
            -input=false -no-color \
            -out=runtime-phase2.tfplan \
            -var="source_commit_sha=${SOURCE_SHA}" \
            -var="mcp_image_url=${IMAGE_URL}" \
            -var="mcp_allowed_hosts=${REAL_HOSTS}" \
            -var="mcp_allowed_origins=" 
          terraform -chdir=terraform/birzha_test show -json runtime-phase2.tfplan > "$RUNNER_TEMP/runtime-phase2-plan.json"
          terraform -chdir=terraform/birzha_test show -no-color runtime-phase2.tfplan > "$RUNNER_TEMP/runtime-phase2-plan.txt"

      - name: Assert phase-two only opens the exact Gateway Host
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan=json.loads(Path(os.environ['RUNNER_TEMP']).joinpath('runtime-phase2-plan.json').read_text())
          changed={x['address']:x for x in plan.get('resource_changes',[]) if x['change']['actions'] != ['no-op']}
          allowed={'yandex_serverless_container.mcp[0]'}
          if set(changed) - allowed:
              raise SystemExit(f'Phase two contains unexpected resources: {sorted(set(changed)-allowed)}')
          if not changed:
              raise SystemExit('Phase two did not produce a Host-binding container revision')
          item=changed['yandex_serverless_container.mcp[0]']
          if 'delete' in item['change']['actions']:
              raise SystemExit('Container replacement/destroy forbidden in host-binding phase')
          after=item['change']['after']
          if after.get('concurrency') != 1:
              raise SystemExit('Container concurrency drift')
          image=after['image'][0]
          if image.get('url') != os.environ['IMAGE_URL']:
              raise SystemExit('Image digest drift in phase two')
          env=image.get('environment') or {}
          expected_hosts=f"{os.environ['GATEWAY_DOMAIN']},{os.environ['GATEWAY_DOMAIN']}:*"
          if env.get('MCP_ALLOWED_HOSTS') != expected_hosts:
              raise SystemExit(f'Host binding mismatch: {env.get("MCP_ALLOWED_HOSTS")!r}')
          if env.get('BIRZHA_STATE_BACKEND') != 'ydb':
              raise SystemExit('YDB backend drift')
          if env.get('BIRZHA_SOURCE_COMMIT') != os.environ['SOURCE_SHA']:
              raise SystemExit('Source SHA drift')
          print('PHASE2_EXACT_HOST_PLAN_PASS')
          PY

      - name: Apply exact phase-two Host-binding plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/birzha_test apply -input=false -auto-approve runtime-phase2.tfplan

      - name: Wait for remote health with YDB backend
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="https://${GATEWAY_DOMAIN}/healthz"
          for i in $(seq 1 30); do
            if curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 15 "$HEALTH_URL" > "$RUNNER_TEMP/health.json"; then
              if python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'health.json'
          d=json.loads(p.read_text())
          assert d.get('status') == 'ok', d
          assert d.get('service') == 'BIRZHA MCP FORECAST', d
          assert d.get('version') == '0.1.0', d
          assert d.get('state_backend') == 'ydb', d
          print('REMOTE_HEALTH_YDB_PASS')
          PY
              then break; fi
            fi
            if [ "$i" -eq 30 ]; then
              echo 'Remote health did not become ready' >&2
              cat "$RUNNER_TEMP/health.json" 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

      - name: Install MCP client for remote acceptance
        run: python -m pip install --disable-pip-version-check 'mcp==2.1.1'

      - name: Remote MCP, MOEX and durable Forecast roundtrip
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio, json, os
          from mcp import Client

          endpoint=os.environ['MCP_ENDPOINT']
          async def main():
              async with Client(endpoint) as client:
                  listed=await client.list_tools()
                  names={t.name for t in listed.tools}
                  required={'system.version','market.resolve_instrument','market.snapshot','forecast.create','forecast.get','forecast.list','outcome.evaluate','validation.walk_forward','validation.assess_model'}
                  missing=required-names
                  assert not missing, missing

                  version=await client.call_tool('system.version', {})
                  assert not version.is_error, version
                  v=version.structured_content
                  assert v['service']=='BIRZHA MCP FORECAST', v

                  resolved=await client.call_tool('market.resolve_instrument', {'symbol':'SBER'})
                  assert not resolved.is_error, resolved
                  r=resolved.structured_content
                  assert r['secid']=='SBER', r

                  created=await client.call_tool('forecast.create', {'symbol':'SBER'})
                  assert not created.is_error, created
                  c=created.structured_content
                  forecast_id=c.get('forecast_id') or (c.get('record') or {}).get('forecast_id')
                  assert forecast_id, c

                  fetched=await client.call_tool('forecast.get', {'forecast_id':forecast_id})
                  assert not fetched.is_error, fetched
                  f=fetched.structured_content
                  assert f.get('forecast_id')==forecast_id, f
                  assert f.get('symbol')=='SBER', f

                  print(json.dumps({
                      'remote_mcp':'PASS',
                      'tools':len(names),
                      'resolved_secid':r['secid'],
                      'forecast_id':forecast_id,
                      'forecast_direction':f.get('direction'),
                      'engine_version':f.get('engine_version'),
                  }, sort_keys=True))
          asyncio.run(main())
          PY

      - name: Verify post-deploy zero drift at exact runtime variables
        shell: bash
        run: |
          set -euo pipefail
          REAL_HOSTS="${GATEWAY_DOMAIN},${GATEWAY_DOMAIN}:*"
          set +e
          terraform -chdir=terraform/birzha_test plan \
            -detailed-exitcode -input=false -no-color \
            -var="source_commit_sha=${SOURCE_SHA}" \
            -var="mcp_image_url=${IMAGE_URL}" \
            -var="mcp_allowed_hosts=${REAL_HOSTS}" \
            -var="mcp_allowed_origins=" > "$RUNNER_TEMP/post-deploy-plan.txt"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            cat "$RUNNER_TEMP/post-deploy-plan.txt"
            exit "$RC"
          fi
          echo 'POST_DEPLOY_DRIFT=NONE'

      - name: Write deployment evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/birzha_test output -json > "$RUNNER_TEMP/final-outputs.json"
          mkdir -p "$RUNNER_TEMP/birzha-deployment-evidence"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          outputs=json.loads((root/'final-outputs.json').read_text())
          get=lambda k: outputs[k]['value']
          evidence={
            'schema':'BIRZHA_MCP_TEST_DEPLOYMENT_V1',
            'timestamp_utc':datetime.now(timezone.utc).isoformat(),
            'infra_sha':os.environ['GITHUB_SHA'],
            'application_source_sha':os.environ['SOURCE_SHA'],
            'image_digest':os.environ['IMAGE_DIGEST'],
            'image_url':os.environ['IMAGE_URL'],
            'folder_id':get('test_folder_id'),
            'registry_id':get('container_registry_id'),
            'ydb_database_id':get('ydb_database_id'),
            'serverless_container_id':get('serverless_container_id'),
            'api_gateway_id':get('api_gateway_id'),
            'api_gateway_domain':get('api_gateway_domain'),
            'mcp_endpoint':get('mcp_endpoint'),
            'state_backend':'ydb',
            'container_concurrency':1,
            'acceptance':{
              'phase1_plan':'PASS',
              'phase1_apply':'PASS',
              'phase2_exact_host_plan':'PASS',
              'phase2_apply':'PASS',
              'remote_health_ydb':'PASS',
              'remote_mcp':'PASS',
              'real_moex_resolve':'PASS',
              'durable_forecast_create_get':'PASS',
              'post_deploy_drift':'NONE',
            },
          }
          (root/'birzha-deployment-evidence'/'deployment.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print(json.dumps(evidence, sort_keys=True))
          PY

      - name: Upload deployment evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: birzha-mcp-test-deployment-evidence
          path: ${{ runner.temp }}/birzha-deployment-evidence/deployment.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove ephemeral provider key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json"
