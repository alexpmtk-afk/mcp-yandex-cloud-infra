name: Marketplaces Archive Storage Validate

on:
  pull_request:
    paths:
      - app/**
      - terraform/**
      - docs/apps_script/**
      - docs/MARKETPLACES_SEMANTIC_CORE_TEST_V17.md
      - .github/workflows/deploy-mcp-test.yml
      - .github/workflows/configure-card-monitor.yml
      - .github/workflows/marketplaces-system-map-acceptance.yml
      - .github/workflows/marketplaces-archive-storage-validate.yml
      - .github/workflows/marketplaces-archive-versioning.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  DRIVE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbzgFDAQY4rcsblKhiAONfOI6315k8W3vwbSIEsczE3ycQtnJ8ctcVKjhzjgdTgfy0cvIA/exec

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt and validate
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive terraform
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
          echo 'TERRAFORM_VALIDATE=PASS'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install vendored MCP and test runner
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./app
          python -m pip install 'pytest>=8,<9'

      - name: Runtime archive and Semantic Core guardrails
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            app/tests/test_archive_yandex.py \
            app/tests/test_archive_hybrid.py \
            app/tests/test_archive_drive_resumable.py \
            app/tests/test_archive_drive_resumable_v16.py \
            app/tests/test_archive_resumable_worker.py \
            app/tests/test_archive_resumable_diagnostic.py \
            app/tests/test_data_catalog.py \
            app/tests/test_semantic_advertising.py \
            app/tests/test_semantic_core_runtime.py \
            app/tests/test_system_map.py -q
          python -m compileall -q app/core
          grep -q 'marketplace_archive_resumable_diagnostic_step' app/core/archive_tools.py
          grep -q 'promote_verified_file' app/core/archive_google.py
          grep -q 'promotion_attempted' app/core/archive_resumable_worker.py
          grep -q 'canonical_untouched' app/core/archive_resumable_worker.py
          grep -q 'sha256Checksum' app/core/archive_resumable_worker.py
          grep -q 'marketplace_business_query' app/core/semantic_business_router.py
          grep -q 'advertising_performance' app/core/semantic_registry_extensions.yaml
          grep -q 'ads_campaign_daily' app/core/semantic_registry_extensions.yaml
          grep -q 'FULL_COVERAGE' app/core/semantic_advertising.py
          grep -q 'FULL_COVERAGE' app/core/semantic_execution.yaml
          grep -q 'agencyVat' app/core/semantic_registry.yaml
          grep -q 'source_not_suitable' app/core/errors.py
          grep -q 'trash_by_id' docs/apps_script/marketplaces_drive_bridge_v3.gs
          grep -q 'promote_verified' docs/apps_script/marketplaces_drive_bridge_v3.gs
          grep -q 'archive_root_id_guard:true' docs/apps_script/marketplaces_drive_bridge_v3.gs
          grep -q 'drive_api_preflight:true' docs/apps_script/marketplaces_drive_bridge_v3.gs
          grep -q 'sha256Checksum' docs/apps_script/marketplaces_drive_bridge_v3.gs
          grep -q 'MARKETPLACE_MCP_ARCHIVE_BUCKET' .github/workflows/deploy-mcp-test.yml
          grep -q 'MARKETPLACE_MCP_ARCHIVE_DRIVE_ROOT_ID' .github/workflows/deploy-mcp-test.yml
          grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_URL' .github/workflows/deploy-mcp-test.yml
          grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_SECRET' .github/workflows/deploy-mcp-test.yml
          grep -q 'google_drive_bridge_secret' .github/workflows/deploy-mcp-test.yml
          ! grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_OAUTH_JSON' .github/workflows/deploy-mcp-test.yml
          ! grep -q 'google_drive_oauth_json' .github/workflows/deploy-mcp-test.yml
          grep -q '2026-09-15.v17' .github/workflows/deploy-mcp-test.yml
          grep -q 'marketplace_business_query' .github/workflows/deploy-mcp-test.yml
          grep -q 'SEMANTIC_CORE_FAIL_CLOSED=PASS' .github/workflows/deploy-mcp-test.yml
          grep -q 'SEMANTIC_ADVERTISING_COVERAGE_GAP=PASS' .github/workflows/deploy-mcp-test.yml
          grep -q 'SEMANTIC_ADVERTISING_PRODUCT_FAIL_CLOSED=PASS' .github/workflows/deploy-mcp-test.yml
          grep -q 'SEMANTIC_ADVERTISING_CAMPAIGN_FAIL_CLOSED=PASS' .github/workflows/deploy-mcp-test.yml
          grep -q 'SEMANTIC_ADVERTISING_CURRENT_DAY_BOUNDARY=PASS' .github/workflows/deploy-mcp-test.yml
          grep -q 'bridge_version.*>= 3' .github/workflows/deploy-mcp-test.yml
          grep -q 'ARCHIVE_GOOGLE_DRIVE_BRIDGE=PASS' .github/workflows/deploy-mcp-test.yml
          grep -q 'marketplace_archive_resumable_diagnostic_step' .github/workflows/deploy-mcp-test.yml
          grep -q 'yandex_storage_bucket.marketplace_archive' .github/workflows/deploy-mcp-test.yml
          grep -q 'MARKETPLACE_MCP_ARCHIVE_BUCKET' .github/workflows/configure-card-monitor.yml
          grep -q 'MARKETPLACE_MCP_ARCHIVE_DRIVE_ROOT_ID' .github/workflows/configure-card-monitor.yml
          grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_URL' .github/workflows/configure-card-monitor.yml
          grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_SECRET' .github/workflows/configure-card-monitor.yml
          grep -q 'google_drive_bridge_secret' .github/workflows/configure-card-monitor.yml
          ! grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_OAUTH_JSON' .github/workflows/configure-card-monitor.yml
          ! grep -q 'google_drive_oauth_json' .github/workflows/configure-card-monitor.yml
          grep -q 'ARCHIVE_GOOGLE_DRIVE_AFTER_CARD_MONITOR=PASS' .github/workflows/configure-card-monitor.yml
          grep -q -- '--execution-timeout 600s' .github/workflows/configure-card-monitor.yml
          grep -q 'resource "yandex_resourcemanager_folder_iam_member" "deployer_archive_storage_editor"' terraform/mcp_test.tf
          grep -A5 'resource "yandex_resourcemanager_folder_iam_member" "deployer_archive_storage_editor"' terraform/mcp_test.tf | grep -q 'role.*=.*"storage.editor"'
          grep -A20 'resource "yandex_storage_bucket" "marketplace_archive"' terraform/mcp_test.tf | grep -q 'deployer_archive_storage_editor'
          ! grep -A25 'resource "yandex_storage_bucket" "marketplace_archive"' terraform/mcp_test.tf | grep -q 'disabled_statickey_auth.*=.*true'
          ! grep -A25 'resource "yandex_storage_bucket" "marketplace_archive"' terraform/mcp_test.tf | grep -q 'versioning'
          grep -q 'storage.api.cloud.yandex.net/storage/v1/buckets' .github/workflows/marketplaces-archive-versioning.yml
          grep -q '"updateMask":"versioning"' .github/workflows/marketplaces-archive-versioning.yml
          grep -q '"versioning":"VERSIONING_ENABLED"' .github/workflows/marketplaces-archive-versioning.yml
          grep -q 'VERSIONING_ENABLED' .github/workflows/marketplaces-archive-versioning.yml
          grep -q 'ARCHIVE_PRIVATE_ACCESS=PASS' .github/workflows/marketplaces-archive-versioning.yml
          ! grep -q 'yc storage bucket update' .github/workflows/marketplaces-archive-versioning.yml
          ! grep -q 'storage.admin' terraform/mcp_test.tf .github/workflows/deploy-mcp-test.yml .github/workflows/configure-card-monitor.yml
          grep -q 'folder add-access-binding' .github/workflows/marketplaces-archive-versioning.yml
          grep -q 'folder remove-access-binding' .github/workflows/marketplaces-archive-versioning.yml
          test "$(grep -c -- '--role storage.admin' .github/workflows/marketplaces-archive-versioning.yml)" = 2
          grep -q 'EXISTING_ADMIN.*= 0' .github/workflows/marketplaces-archive-versioning.yml
          grep -q 'ARCHIVE_TEMP_ADMIN_GRANTED=1' .github/workflows/marketplaces-archive-versioning.yml
          grep -q 'ARCHIVE_TEMP_ADMIN_REVOKED=PASS' .github/workflows/marketplaces-archive-versioning.yml
          ! grep -R -E 'resource "yandex_iam_service_account_(static_)?access_key"|aws_access_key_id|aws_secret_access_key' terraform/mcp_test.tf .github/workflows/deploy-mcp-test.yml .github/workflows/configure-card-monitor.yml .github/workflows/marketplaces-archive-versioning.yml
          test -f docs/apps_script/marketplaces_drive_bridge_v3.gs
          test -f docs/apps_script/appsscript.json
          test -f docs/MARKETPLACES_SEMANTIC_CORE_TEST_V17.md
          grep -q "BRIDGE_VERSION=3" docs/apps_script/marketplaces_drive_bridge_v3.gs
          grep -q 'script.external_request' docs/apps_script/appsscript.json
          grep -q '616a156cde2b0a1f1e50251726c728e7a1b24448' app/.source-revision
          grep -q '833eab826bfaa4691a05a21a5d00f1e8e0ba1b37' app/.source-revision
          echo 'ARCHIVE_SEMANTIC_RUNTIME_VALIDATE=PASS'

      - name: Probe live Apps Script bridge version and hardened capabilities (read only)
        shell: bash
        run: |
          set -euo pipefail
          BODY=''
          ok=0
          for attempt in 1 2 3 4 5; do
            if BODY="$(curl -fsSL --connect-timeout 10 --max-time 30 "$DRIVE_BRIDGE_URL")"; then
              ok=1
              break
            fi
            echo "Apps Script probe transient failure; retry $attempt/5"
            [[ "$attempt" -lt 5 ]]
            sleep $((attempt * 3))
          done
          test "$ok" = 1
          printf '%s' "$BODY" > "$RUNNER_TEMP/bridge-health.json"
          python - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'bridge-health.json')
          data=json.load(open(p,encoding='utf-8'))
          assert data.get('ok') is True, data
          assert int(data.get('version') or 0) >= 3, data
          assert data.get('root_id') == '1UVKUcFfDhCDk6nMHX1mWg9cRL05DT-OJ', data
          caps=data.get('capabilities') or {}
          for key in ('resumable_start','sha256_metadata','staged_promotion','diagnostic_cleanup','archive_root_id_guard','drive_api_preflight'):
              assert caps.get(key) is True, (key,data)
          print(f"LIVE_DRIVE_BRIDGE_VERSION={data.get('version')}")
          print(f"LIVE_DRIVE_BRIDGE_ROOT={data.get('root_name')}")
          print('LIVE_DRIVE_BRIDGE_HARDENED_CAPABILITIES=PASS')
          PY
