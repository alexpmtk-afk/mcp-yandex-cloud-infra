name: Codex Quota Router v0.3 Status Relay

on:
  workflow_run:
    workflows:
      - Codex Quota Router v0.3
    types:
      - completed

permissions:
  statuses: write

jobs:
  publish:
    if: github.event.workflow_run.head_branch == 'tooling/codex-quota-router-v0.1'
    runs-on: ubuntu-latest
    steps:
      - name: Publish router CI status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$CONCLUSION" = "success" ]; then
            state=success
            description='Codex Quota Router v0.3 CI passed'
          else
            state=failure
            description="Codex Quota Router v0.3 CI: $CONCLUSION"
          fi

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context='codex-quota-router-v0.3' \
            -f description="$description" \
            -f target_url="$RUN_URL"
