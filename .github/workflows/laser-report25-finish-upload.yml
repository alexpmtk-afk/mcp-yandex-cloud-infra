name: Laser Report 25 Finish Resumable Upload
on:
  push:
    branches: [fix/marketplaces-destroy-v1-lockbox-history]
    paths: ['.github/workflows/laser-report25-finish-upload.yml']
permissions:
  contents: read
concurrency:
  group: marketplaces-archive-queue-worker
  cancel-in-progress: false
jobs:
  finish-upload:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Install and resolve MCP
        id: live
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"; curl -fsSL --retry 5 --retry-delay 3 https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tgz"; tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"; chmod +x "$RUNNER_TEMP/yc/yc"; export PATH="$RUNNER_TEMP/yc:$PATH"; python -m pip install --quiet 'httpx>=0.27,<1'
          K="$RUNNER_TEMP/k"; umask 077; printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$K"; yc config profile create laser25-finish-upload >/dev/null 2>&1 || true; yc config set service-account-key "$K"
          F="$(yc resource-manager folder list --cloud-id b1gi4pr9msenirafh2c7 --format json|jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"; yc config set folder-id "$F"; S="$(yc lockbox secret list --folder-id "$F" --format json|jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"; yc lockbox secret list-versions --id "$S" --format json --no-user-output > "$RUNNER_TEMP/v"
          V="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys//[])|index("gdrive_bridge_v1_secret")==null)|select((.payload_entry_keys//[])|index("mcp_bearer_token")!=null)]|sort_by(.created_at)|last|.id//empty' "$RUNNER_TEMP/v")"; test "$V" = e6qnvjc1fpqj2osspbtt
          D="$(yc serverless api-gateway list --folder-id "$F" --format json|jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//empty')"; yc lockbox payload get --id "$S" --version-id "$V" --format json --no-user-output > "$RUNNER_TEMP/p"; B="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value//empty' "$RUNNER_TEMP/p")"; echo "::add-mask::$B"; printf '%s' "$B" > "$RUNNER_TEMP/b"; echo "url=https://${D}/mcp" >> "$GITHUB_OUTPUT"
      - name: Upload remaining chunks and stop before COMMIT
        env:
          MCP_URL: ${{ steps.live.outputs.url }}
        run: |
          set -euo pipefail; export MCP_BEARER="$(cat "$RUNNER_TEMP/b")"
          python -u - <<'PY'
          import itertools,json,os,httpx
          J='wb-finance-wb_laser_master-2026'; R=751229976
          def unpack(r):
            r.raise_for_status()
            for line in r.text.splitlines():
              if line.startswith('data:'): return json.loads(line[5:].strip())
            return r.json()
          h0={'Authorization':'Bearer '+os.environ['MCP_BEARER'],'Accept':'application/json, text/event-stream','Content-Type':'application/json'}; ids=itertools.count(1)
          with httpx.Client(timeout=httpx.Timeout(connect=15,read=540,write=30,pool=15),follow_redirects=True) as c:
            r=c.post(os.environ['MCP_URL'],headers=h0,json={'jsonrpc':'2.0','id':next(ids),'method':'initialize','params':{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'laser25-finish-upload','version':'1'}}}); init=unpack(r); h=dict(h0); sid=r.headers.get('mcp-session-id')
            if sid: h['Mcp-Session-Id']=sid
            h['MCP-Protocol-Version']=init['result'].get('protocolVersion','2025-06-18'); c.post(os.environ['MCP_URL'],headers=h,json={'jsonrpc':'2.0','method':'notifications/initialized'})
            def tool(n,a):
              d=unpack(c.post(os.environ['MCP_URL'],headers=h,json={'jsonrpc':'2.0','id':next(ids),'method':'tools/call','params':{'name':n,'arguments':a}})); x=d['result']; assert not x.get('isError'),x; t=next(i.get('text') for i in x.get('content',[]) if i.get('type')=='text'); return json.loads(t)
            for n in range(1,13):
              s=tool('marketplace_archive_job_status',{'job_id':J}); assert int(s.get('report_index') or -1)==24,s; assert int(s.get('provider_calls') or -1)==51,s; assert int(s.get('finalize_report_id') or 0)==R,s; assert not s.get('last_error'),s
              phase=str(s.get('finalize_phase') or '')
              if phase=='COMMIT': print('UPLOAD_FINISHED_BEFORE_STEP=PASS',flush=True); break
              assert phase=='UPLOAD_ANNUAL',s
              step=tool('marketplace_archive_worker_step',{'job_id':J}); assert step.get('ok') is True,step; action=str(step.get('action') or ''); assert action in {'drive_resumable_chunk_uploaded','drive_resumable_upload_complete','report_annual_uploaded','report_annual_already_promoted'},step
              print('UPLOAD_STEP='+str(n)+' '+json.dumps(step,ensure_ascii=False),flush=True)
              s2=tool('marketplace_archive_job_status',{'job_id':J}); assert int(s2.get('report_index') or -1)==24,s2; assert int(s2.get('provider_calls') or -1)==51,s2; assert int(s2.get('finalize_report_id') or 0)==R,s2; assert not s2.get('last_error'),s2
              if str(s2.get('finalize_phase') or '')=='COMMIT': print('UPLOAD_REACHED_COMMIT=PASS',flush=True); break
            else: raise RuntimeError('resumable upload did not reach COMMIT within 12 bounded steps')
            final=tool('marketplace_archive_job_status',{'job_id':J}); assert int(final.get('report_index') or -1)==24,final; assert int(final.get('provider_calls') or -1)==51,final; assert str(final.get('finalize_phase'))=='COMMIT',final; assert int(final.get('finalize_report_id') or 0)==R,final; assert not final.get('last_error'),final
            print('STOPPED_BEFORE_COMMIT=PASS',flush=True)
          PY
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/yc" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/k" "$RUNNER_TEMP/v" "$RUNNER_TEMP/p" "$RUNNER_TEMP/b"
