name: Diagnose BIRZHA history on self-hosted runner

on:
  push:
    branches: [diag-birzha-history-selfhosted]
    paths:
      - ".github/workflows/diag-birzha-history-selfhosted.yml"
      - "scripts/diag_birzha_history.mjs"

permissions:
  contents: read

env:
  MCP_ENDPOINT: https://d5d6sgh96p1fs4mnlfsr.0ly8ed4d.apigw.yandexcloud.net/mcp
  MCP_AUTH_SECRET_ID: e6q98dsvire45t1tiko7
  MCP_AUTH_VERSION_ID: e6qlatpatlko5l44r60t

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64, codex-bridge-service]
    environment: test
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic script
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Prepare Node MCP SDK
        shell: cmd
        run: npm install --no-save --no-audit --no-fund @modelcontextprotocol/sdk

      - name: Probe MCP history dependencies
        shell: cmd
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: node scripts\diag_birzha_history.mjs

      - name: Cleanup temporary npm modules
        if: always()
        shell: cmd
        run: if exist node_modules rmdir /s /q node_modules
