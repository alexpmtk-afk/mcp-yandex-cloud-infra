name: Telegram Billing Audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-billing-audit.yml]
permissions:
  contents: read
jobs:
  billing:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 5
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/yc-key.json"
          chmod 600 "$RUNNER_TEMP/yc-key.json"
          yc config profile create tg-billing || true
          yc config profile activate tg-billing
          yc config set service-account-key "$RUNNER_TEMP/yc-key.json"
      - name: Service billing Sep 1-16
        shell: bash
        run: |
          yc billing consumption-core get-service-usage-report d01fl7g1trd2i5d8l7r6 \
            --start-date 2026-09-01T00:00:00Z --end-date 2026-09-16T23:59:59Z \
            --folder-ids b1gk4p83brasi8g811jv --aggregation-period day --format json
