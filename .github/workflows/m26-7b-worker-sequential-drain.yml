name: M26.8 Worker Sequential Drain

on:
  push:
    branches: [main]
    paths:
      - "control/run-m26-7b-worker-sequential-drain.txt"

permissions:
  contents: read
  id-token: write

concurrency:
  group: birzha-m26-8-worker-sequential-drain
  cancel-in-progress: false

env:
  TF_DIR: terraform/birzha_test
  DEPLOYER_SERVICE_ACCOUNT_ID: ajecdjjrkdo1t3itpl9k
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/mcp-yandex-cloud-infra@1349853397:environment:test
  WORKER_ID: bbamdg0po6fkukhod2e9
  TIMER_ID: a1s4ho32v7dha59aeu60
  EXPECTED_WORKER_SHA: fc4d205adc806446a98ebda5d3b210771f84d489
  MAX_TICKS: "120"

jobs:
  drain:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Mint deployer IAM token
        shell: bash
        run: |
          set -euo pipefail
          A="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          S='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && S='&'
          R="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${S}audience=${A}")"
          J="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$R")"
          echo "::add-mask::$J"
          python - "$J" <<'PY'
          import base64,json,os,sys
          p=sys.argv[1].split('.')[1]; p += '='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          assert c.get('sub')==os.environ['EXPECTED_OIDC_SUBJECT']
          assert c.get('aud')==os.environ['OIDC_AUDIENCE']
          assert c.get('ref')=='refs/heads/main'
          assert c.get('environment')=='test'
          PY
          X="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${DEPLOYER_SERVICE_ACCOUNT_ID}" --data-urlencode "subject_token=${J}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          T="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$X")"
          test -n "$T"
          echo "::add-mask::$T"
          umask 077
          printf '%s' "$T" > "$RUNNER_TEMP/deployer-iam-token"
          echo 'D1_DRAIN_DEPLOYER_AUTH=PASS'

      - name: Resolve timer identity
        shell: bash
        env:
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" init -reconfigure -input=false -lockfile=readonly \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" \
            -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY" >/dev/null
          terraform -chdir="$TF_DIR" output -raw m24_orchestrator_timer_service_account_id > "$RUNNER_TEMP/timer-sa-id"
          test -s "$RUNNER_TEMP/timer-sa-id"
          echo 'D1_DRAIN_TIMER_IDENTITY_RESOLVED=PASS'

      - name: Install YC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tar.gz"
          tar -xzf "$RUNNER_TEMP/yc.tar.gz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"

      - name: Protect targets, pause timer, mint worker caller token
        shell: bash
        run: |
          set -euo pipefail
          YC="$RUNNER_TEMP/yc/yc"
          export YC_IAM_TOKEN="$(cat "$RUNNER_TEMP/deployer-iam-token")"
          "$YC" serverless container get "$WORKER_ID" --format=json > "$RUNNER_TEMP/worker.json"
          "$YC" serverless trigger get "$TIMER_ID" --format=json > "$RUNNER_TEMP/timer-before.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])
          w=json.loads((base/'worker.json').read_text()); t=json.loads((base/'timer-before.json').read_text())
          assert w.get('id')==os.environ['WORKER_ID'] and w.get('status')=='ACTIVE'
          assert w.get('url','').startswith('https://')
          assert t.get('id')==os.environ['TIMER_ID'] and t.get('status') in {'ACTIVE','PAUSED'}
          assert os.environ['WORKER_ID'] in json.dumps(t)
          Path(os.environ['RUNNER_TEMP']+'/worker-url').write_text(w['url'].rstrip('/'))
          print('D1_DRAIN_TARGETS_PROTECTED=PASS')
          PY
          TIMER_SA="$(cat "$RUNNER_TEMP/timer-sa-id")"
          "$YC" iam create-token --impersonate-service-account-id "$TIMER_SA" --no-user-output > "$RUNNER_TEMP/timer-iam-token"
          test -s "$RUNNER_TEMP/timer-iam-token"
          TOKEN="$(cat "$RUNNER_TEMP/timer-iam-token")"; echo "::add-mask::$TOKEN"
          status="$(python -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["RUNNER_TEMP"])/"timer-before.json").read_text()).get("status",""))')"
          if [ "$status" = "ACTIVE" ]; then "$YC" serverless trigger pause "$TIMER_ID" >/dev/null; fi
          "$YC" serverless trigger get "$TIMER_ID" --format=json > "$RUNNER_TEMP/timer-paused.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'timer-paused.json').read_text())
          assert d.get('status')=='PAUSED'
          print('D1_DRAIN_TIMER_PAUSED=PASS')
          PY

      - name: Verify exact worker revision
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat "$RUNNER_TEMP/worker-url")"; TOKEN="$(cat "$RUNNER_TEMP/timer-iam-token")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 60 -H "Authorization: Bearer ${TOKEN}" "$URL/healthz" > "$RUNNER_TEMP/health.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'health.json').read_text())
          assert d.get('status')=='ok'
          assert d.get('source_sha')==os.environ['EXPECTED_WORKER_SHA'], d.get('source_sha')
          assert d.get('market_mirror_required') is True
          assert d.get('market_mirror_configured') is True
          print('D1_DRAIN_WORKER_HEALTH=PASS')
          PY

      - name: Drain D1 strictly sequentially
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat "$RUNNER_TEMP/worker-url")"; TOKEN="$(cat "$RUNNER_TEMP/timer-iam-token")"
          complete=0
          for i in $(seq 1 "$MAX_TICKS"); do
            rm -f "$RUNNER_TEMP/tick.json"
            set +e
            code="$(curl --proto '=https' --tlsv1.2 --silent --show-error --max-time 370 -o "$RUNNER_TEMP/tick.json" -w '%{http_code}' -X POST -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' --data '{}' "$URL/tick")"
            curl_rc=$?
            set -e
            if [ "$curl_rc" -ne 0 ] || [ "$code" = "000" ] || [ "$code" = "502" ] || [ "$code" = "503" ] || [ "$code" = "504" ]; then
              echo "D1_DRAIN_TRANSIENT_TRANSPORT_WAIT=tick:${i},curl_rc:${curl_rc},http:${code}"; sleep 10; continue
            fi
            if [ "$code" != "200" ]; then echo "D1_DRAIN_UNEXPECTED_HTTP=tick:${i},http:${code}"; [ -s "$RUNNER_TEMP/tick.json" ] && head -c 1000 "$RUNNER_TEMP/tick.json" || true; exit 1; fi
            export TICK_NO="$i"
            set +e
            result="$(python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'tick.json').read_text())
          ws=str(d.get('worker_status') or '')
          wf=d.get('workflow') if isinstance(d.get('workflow'),dict) else d.get('archive_workflow')
          wf=wf if isinstance(wf,dict) else {}
          status=str(wf.get('status') or d.get('archive_status') or '')
          na=wf.get('next_action') if isinstance(wf.get('next_action'),dict) else {}
          payload=na.get('payload') if isinstance(na.get('payload'),dict) else {}
          compact={'tick':int(os.environ['TICK_NO']),'worker_status':ws,'action_kind':str(d.get('action_kind') or ''),'fast_forwarded':int(d.get('fast_forwarded_verified_chunks') or 0),'workflow_status':status,'next_symbol':str(payload.get('symbol') or ''),'next_kind':str(na.get('kind') or ''),'archive_end':str(d.get('archive_end') or '')}
          print(json.dumps(compact,separators=(',',':'),sort_keys=True))
          if ws in {'ACTION_ERROR','D1_ARCHIVE_REFRESH_FAILED','STALE_LEASE'} or status=='FAILED': raise SystemExit(20)
          if status=='PASS': raise SystemExit(10)
          if ws in {'BUSY_OR_IDLE'}: raise SystemExit(30)
          PY
            )"
            rc=$?
            set -e
            echo "D1_DRAIN_TICK=$result"
            if [ "$rc" = "10" ]; then complete=1; break; fi
            if [ "$rc" = "20" ]; then echo 'D1_DRAIN_ACTION_FAILURE=YES'; exit 1; fi
            if [ "$rc" = "30" ]; then sleep 10; continue; fi
            test "$rc" = "0" || exit "$rc"
            sleep 2
          done
          [ "$complete" = "1" ] || { echo "D1_DRAIN_MAX_TICKS_REACHED=${MAX_TICKS}"; exit 2; }
          echo 'D1_ARCHIVE_WORKFLOW_COMPLETE=PASS'

      - name: Resume automatic timer only after complete PASS
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          YC="$RUNNER_TEMP/yc/yc"; export YC_IAM_TOKEN="$(cat "$RUNNER_TEMP/deployer-iam-token")"
          "$YC" serverless trigger get "$TIMER_ID" --format=json > "$RUNNER_TEMP/timer-current.json"
          status="$(python -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["RUNNER_TEMP"])/"timer-current.json").read_text()).get("status",""))')"
          if [ "$status" = "PAUSED" ]; then "$YC" serverless trigger resume "$TIMER_ID" >/dev/null; fi
          "$YC" serverless trigger get "$TIMER_ID" --format=json > "$RUNNER_TEMP/timer-after.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'timer-after.json').read_text())
          assert d.get('id')==os.environ['TIMER_ID'] and d.get('status')=='ACTIVE'
          assert os.environ['WORKER_ID'] in json.dumps(d)
          print('D1_DRAIN_TIMER_RESUMED_ACTIVE=PASS')
          PY

      - name: Prove fail-closed timer remains paused on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/deployer-iam-token" ] && [ -x "$RUNNER_TEMP/yc/yc" ] || exit 0
          YC="$RUNNER_TEMP/yc/yc"; export YC_IAM_TOKEN="$(cat "$RUNNER_TEMP/deployer-iam-token")"
          "$YC" serverless trigger get "$TIMER_ID" --format=json > "$RUNNER_TEMP/timer-failure.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'timer-failure.json').read_text())
          assert d.get('id')==os.environ['TIMER_ID'] and d.get('status')=='PAUSED', d.get('status')
          print('D1_DRAIN_FAILURE_TIMER_PAUSED=PASS')
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/deployer-iam-token" "$RUNNER_TEMP/timer-iam-token" "$RUNNER_TEMP/timer-sa-id" "$RUNNER_TEMP/worker-url" "$RUNNER_TEMP/worker.json" "$RUNNER_TEMP/timer-before.json" "$RUNNER_TEMP/timer-paused.json" "$RUNNER_TEMP/timer-current.json" "$RUNNER_TEMP/timer-after.json" "$RUNNER_TEMP/timer-failure.json" "$RUNNER_TEMP/health.json" "$RUNNER_TEMP/tick.json" "$RUNNER_TEMP/yc" "$RUNNER_TEMP/yc.tar.gz"
