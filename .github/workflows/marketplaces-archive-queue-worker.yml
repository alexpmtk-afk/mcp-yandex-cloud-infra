name: Marketplaces Archive Queue Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/control/run-marketplaces-archive-queue-worker.txt
  # Keep the 5-minute cadence, but stagger away from minute 00 where GitHub
  # documents the highest scheduled-workflow load. Rewriting this schedule on
  # main also re-registers the workflow after the archive cron was restored.
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: marketplaces-archive-queue-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DEPLOYER_SERVICE_ACCOUNT_ID: ajecdjjrkdo1t3itpl9k
      OIDC_AUDIENCE: https://github.com/alexpmtk-afk
      EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/mcp-yandex-cloud-infra@1349853397:ref:refs/heads/main
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          curl -fsSL --retry 5 --retry-delay 3 "$URL" -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate through GitHub OIDC and resolve live MCP
        id: live
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          ENCODED_AUDIENCE="$(python -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          SEP='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && SEP='&'
          OIDC_RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${SEP}audience=${ENCODED_AUDIENCE}")"
          OIDC_JWT="$(python -c 'import json,sys; print(json.load(sys.stdin).get("value",""))' <<< "$OIDC_RESPONSE")"
          test -n "$OIDC_JWT"
          echo "::add-mask::$OIDC_JWT"
          python - "$OIDC_JWT" <<'PY'
          import base64,json,os,sys
          payload=sys.argv[1].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims=json.loads(base64.urlsafe_b64decode(payload))
          assert claims.get('sub') == os.environ['EXPECTED_OIDC_SUBJECT'], claims.get('sub')
          assert claims.get('aud') == os.environ['OIDC_AUDIENCE'], claims.get('aud')
          assert claims.get('ref') == 'refs/heads/main', claims.get('ref')
          assert claims.get('repository') == 'alexpmtk-afk/mcp-yandex-cloud-infra', claims.get('repository')
          print('ARCHIVE_WORKER_OIDC_CLAIMS=PASS')
          PY
          TOKEN_RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -X POST 'https://auth.yandex.cloud/oauth/token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${DEPLOYER_SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${OIDC_JWT}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          IAM_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin).get("access_token",""))' <<< "$TOKEN_RESPONSE")"
          test -n "$IAM_TOKEN"
          echo "::add-mask::$IAM_TOKEN"
          echo "YC_IAM_TOKEN=$IAM_TOKEN" >> "$GITHUB_ENV"
          export YC_IAM_TOKEN="$IAM_TOKEN"
          echo 'ARCHIVE_WORKER_AUTH=OIDC_PASS'

          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(timeout 45s yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          VERSION_ID="$(timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json | jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys // [])|index("mcp_bearer_token") != null)|select((.payload_entry_keys // [])|index("gdrive_bridge_v1_secret") == null)]|sort_by(.created_at)|last|.id // empty')"
          DOMAIN="$(timeout 45s yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//.[0].domain//empty')"
          test -n "$SECRET_ID"
          test -n "$VERSION_ID"
          test -n "$DOMAIN"

          timeout 45s yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/sec.json"
          BEARER="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value' "$RUNNER_TEMP/sec.json")"
          test -n "$BEARER"
          echo "::add-mask::$BEARER"
          printf '%s' "$BEARER" > "$RUNNER_TEMP/bearer"
          chmod 600 "$RUNNER_TEMP/bearer"
          echo "url=https://${DOMAIN}/mcp" >> "$GITHUB_OUTPUT"

      - name: Drain due archive queue safely
        shell: bash
        timeout-minutes: 45
        env:
          MCP_URL: ${{ steps.live.outputs.url }}
        run: |
          set -euo pipefail
          python -m pip install --quiet 'httpx>=0.27,<1'
          export MCP_BEARER="$(cat "$RUNNER_TEMP/bearer")"
          python -u - <<'PY'
          import itertools
          import json
          import os
          import time
          import httpx

          DEADLINE = time.monotonic() + 42 * 60
          MAX_STEPS = 1000

          def unpack(response):
              response.raise_for_status()
              for line in response.text.splitlines():
                  if line.startswith('data:'):
                      return json.loads(line[5:].strip())
              return response.json() if response.text.strip() else None

          def tool(name, arguments):
              # Large Laser Master annual-file finalization legitimately exceeds
              # the old 75-second client read budget. Keep this below the live
              # container's 600-second execution timeout so provider/runtime
              # failures still surface instead of hanging indefinitely.
              timeout = httpx.Timeout(connect=15.0, read=540.0, write=30.0, pool=15.0)
              headers0 = {
                  'Authorization': 'Bearer ' + os.environ['MCP_BEARER'],
                  'Accept': 'application/json, text/event-stream',
                  'Content-Type': 'application/json',
              }
              ids = itertools.count(1)
              with httpx.Client(timeout=timeout, follow_redirects=True) as client:
                  response = client.post(os.environ['MCP_URL'], headers=headers0, json={
                      'jsonrpc': '2.0', 'id': next(ids), 'method': 'initialize', 'params': {
                          'protocolVersion': '2025-06-18', 'capabilities': {},
                          'clientInfo': {'name': 'marketplaces-archive-queue-worker', 'version': '1'}
                      }
                  })
                  init = unpack(response)
                  assert init and 'result' in init, init
                  headers = dict(headers0)
                  sid = response.headers.get('mcp-session-id')
                  if sid:
                      headers['Mcp-Session-Id'] = sid
                  headers['MCP-Protocol-Version'] = init['result'].get('protocolVersion', '2025-06-18')
                  ready = client.post(os.environ['MCP_URL'], headers=headers, json={
                      'jsonrpc': '2.0', 'method': 'notifications/initialized'
                  })
                  assert ready.status_code in (200, 202), ready.status_code
                  response = client.post(os.environ['MCP_URL'], headers=headers, json={
                      'jsonrpc': '2.0', 'id': next(ids), 'method': 'tools/call',
                      'params': {'name': name, 'arguments': arguments}
                  })
                  data = unpack(response)
                  assert data and 'result' in data, (name, data)
                  result = data['result']
                  if result.get('isError'):
                      raise RuntimeError(f'{name} failed: {result}')
                  text = next((item.get('text') for item in result.get('content', []) if item.get('type') == 'text'), None)
                  if text is None:
                      raise RuntimeError(f'{name} returned no text')
                  return json.loads(text)

          for step_no in range(1, MAX_STEPS + 1):
              if time.monotonic() >= DEADLINE:
                  print('ARCHIVE_QUEUE_WORKER=DEADLINE_REACHED', flush=True)
                  break
              result = tool('marketplace_archive_worker_step', {})
              assert result.get('ok') is True, result
              action = str(result.get('action') or '')
              delay = float(result.get('retry_after_seconds') or 0)
              print('STEP=' + str(step_no)
                    + ' job=' + str(result.get('job_id', ''))
                    + ' status=' + str(result.get('status', ''))
                    + ' action=' + action
                    + ' retry=' + str(delay), flush=True)

              if action == 'idle':
                  if delay <= 0:
                      print('ARCHIVE_QUEUE_WORKER=EMPTY', flush=True)
                      break
                  # A far-future due item should not keep a runner alive. The
                  # scheduled worker will return later and resume it.
                  if delay > 240 or time.monotonic() + delay + 5 >= DEADLINE:
                      print('ARCHIVE_QUEUE_WORKER=WAITING_FUTURE_SLOT', flush=True)
                      break
                  time.sleep(delay + 1.0)
                  continue

              if result.get('status') == 'FAILED':
                  raise RuntimeError('archive queue job failed: ' + json.dumps(result, ensure_ascii=False))
              if delay > 0:
                  if delay > 240 or time.monotonic() + delay + 5 >= DEADLINE:
                      print('ARCHIVE_QUEUE_WORKER=WAITING_FUTURE_SLOT', flush=True)
                      break
                  time.sleep(delay + 1.0)
              else:
                  time.sleep(1.0)
          else:
              raise RuntimeError('archive queue worker exceeded MAX_STEPS')
          PY

      - name: Cleanup ephemeral credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/sec.json" "$RUNNER_TEMP/bearer"
