name: PowerShell Admin Bridge LEGACY

on:
  push:
    branches:
      - tooling/powershell-bridge-v0.1
    paths:
      - 'tools/powershell-bridge/command.ps1'
      - '.github/workflows/powershell-admin-bridge.yml'

permissions:
  contents: read

concurrency:
  group: powershell-admin-bridge-legacy
  cancel-in-progress: false

jobs:
  admin-retired:
    if: startsWith(github.event.head_commit.message, 'bridge-admin-exec:')
    runs-on: ubuntu-latest
    steps:
      - name: Admin bridge retired
        shell: bash
        run: |
          echo 'ADMIN_BRIDGE_RETIRED=TRUE'
          echo 'COMMAND_EXECUTED=FALSE'
          echo 'USE_REPOSITORY=alexpmtk-afk/gpt-powershell-bridge'
          echo 'USE_BRANCH=bridge-v2'
          echo 'Normal HOME operations use GPT-PowerShell-Home-DESKTOP-7F6KPIL. Privileged maintenance remains explicit and fail-closed.'
          exit 64
