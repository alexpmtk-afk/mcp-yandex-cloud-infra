name: Telegram Lockbox Deployer Viewer

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-lockbox-deployer-viewer.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grant:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create tg-lockbox-deployer-viewer || true
          yc config profile activate tg-lockbox-deployer-viewer
          yc config set service-account-key "$key"
          yc config set folder-id b1gk4p83brasi8g811jv

      - name: Grant secret metadata viewer to deployer
        shell: bash
        run: |
          set -euo pipefail
          secret_id="e6qnt0bt655jltrr5sid"
          deployer_sa="ajecdjjrkdo1t3itpl9k"
          yc lockbox secret add-access-binding "$secret_id" \
            --role lockbox.viewer \
            --service-account-id "$deployer_sa" >/dev/null
          echo LOCKBOX_DEPLOYER_VIEWER_PASS

      - name: Cleanup local key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json"
