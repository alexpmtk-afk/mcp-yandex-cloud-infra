name: Bootstrap Google Drive Archive OAuth

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplaces-google-drive-oauth-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Validate one-time OAuth handoff
        shell: bash
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_DRIVE_OAUTH_JSON"
          python - <<'PY'
          import json, os
          cfg = json.loads(os.environ['GOOGLE_DRIVE_OAUTH_JSON'])
          required = {'client_id', 'client_secret', 'refresh_token', 'token_uri'}
          missing = sorted(k for k in required if not str(cfg.get(k, '')).strip())
          if missing:
              raise SystemExit('OAuth handoff is missing required fields: ' + ', '.join(missing))
          print('oauth_handoff_shape=PASS')
          PY

      - name: Install Yandex Cloud CLI
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          ARCHIVE="$RUNNER_TEMP/yc/yc.tgz"
          rm -f "$ARCHIVE"
          ok=0
          for attempt in $(seq 1 10); do
            if timeout 75s wget --quiet --continue --timeout=30 --tries=2 --retry-connrefused --output-document="$ARCHIVE" "$URL"; then
              if tar -tzf "$ARCHIVE" >/dev/null 2>&1; then
                ok=1
                break
              fi
              rm -f "$ARCHIVE"
            fi
            sleep 3
          done
          test "$ok" = 1
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate Yandex CI service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"

      - name: Resolve safe Lockbox base
        id: live
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(timeout 45s yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          test -n "$SECRET_ID"
          timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"
          VERSION_ID="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys // [])|index("cabinets_json") != null)|select((.payload_entry_keys // [])|index("mcp_bearer_token") != null)|select((.payload_entry_keys // [])|index("redis_password") != null)|select((.payload_entry_keys // [])|index("google_drive_bridge_secret") != null)]|sort_by(.created_at)|last|.id // empty' "$RUNNER_TEMP/versions.json")"
          test -n "$VERSION_ID"
          echo "secret=$SECRET_ID" >> "$GITHUB_OUTPUT"
          echo "base_version=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo 'LOCKBOX_BASE=RESOLVED'

      - name: Store Google Drive OAuth in Yandex Lockbox only
        id: lockbox
        shell: bash
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
          SECRET_ID: ${{ steps.live.outputs.secret }}
          BASE_VERSION_ID: ${{ steps.live.outputs.base_version }}
        run: |
          set -euo pipefail
          PAYLOAD="$RUNNER_TEMP/oauth-payload.json"
          python - <<'PY'
          import json, os
          cfg = json.loads(os.environ['GOOGLE_DRIVE_OAUTH_JSON'])
          compact = json.dumps(cfg, ensure_ascii=False, separators=(',', ':'))
          with open(os.environ['RUNNER_TEMP'] + '/oauth-payload.json', 'w', encoding='utf-8') as f:
              json.dump([{'key':'google_drive_oauth_json','text_value':compact}], f, ensure_ascii=False, separators=(',', ':'))
          PY
          chmod 600 "$PAYLOAD"
          timeout 60s yc lockbox secret add-version \
            --id "$SECRET_ID" \
            --base-version-id "$BASE_VERSION_ID" \
            --description "Google Drive resumable archive OAuth bootstrap 2026-09-14" \
            --payload - --format json --no-user-output \
            < "$PAYLOAD" > "$RUNNER_TEMP/new-version.json"
          NEW_VERSION_ID="$(jq -r '.id // .response.id // empty' "$RUNNER_TEMP/new-version.json")"
          test -n "$NEW_VERSION_ID"
          echo "version=$NEW_VERSION_ID" >> "$GITHUB_OUTPUT"

          timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions-after.json"
          jq -r --arg id "$NEW_VERSION_ID" '.[]|select(.id==$id)|.payload_entry_keys[]?' "$RUNNER_TEMP/versions-after.json" | sort -u > "$RUNNER_TEMP/keys.txt"
          for key in cabinets_json mcp_bearer_token redis_password google_drive_bridge_secret google_drive_oauth_json; do
            grep -Fxq "$key" "$RUNNER_TEMP/keys.txt"
          done

          timeout 45s yc lockbox payload get --id "$SECRET_ID" --version-id "$NEW_VERSION_ID" --key google_drive_oauth_json --format json --no-user-output > "$RUNNER_TEMP/oauth-entry.json"
          python - <<'PY'
          import json, os
          body = json.load(open(os.environ['RUNNER_TEMP'] + '/oauth-entry.json', encoding='utf-8'))
          raw = str((body.get('entries') or [{}])[0].get('text_value') or '')
          cfg = json.loads(raw)
          required = {'client_id','client_secret','refresh_token','token_uri'}
          assert all(str(cfg.get(k, '')).strip() for k in required)
          print('LOCKBOX_GOOGLE_DRIVE_OAUTH=PASS')
          PY

      - name: Cleanup temporary files
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/yc-service-account-key.json" \
            "$RUNNER_TEMP/yc/yc.tgz" \
            "$RUNNER_TEMP/oauth-payload.json" \
            "$RUNNER_TEMP/new-version.json" \
            "$RUNNER_TEMP/versions.json" \
            "$RUNNER_TEMP/versions-after.json" \
            "$RUNNER_TEMP/keys.txt" \
            "$RUNNER_TEMP/oauth-entry.json"
