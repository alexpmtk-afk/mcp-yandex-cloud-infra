name: Bootstrap Google Drive Archive OAuth

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplaces-google-drive-oauth-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 25
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Validate one-time OAuth handoff
        shell: bash
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_DRIVE_OAUTH_JSON"
          python - <<'PY'
          import json, os
          cfg = json.loads(os.environ['GOOGLE_DRIVE_OAUTH_JSON'])
          required = {'client_id', 'client_secret', 'refresh_token', 'token_uri'}
          missing = sorted(k for k in required if not str(cfg.get(k, '')).strip())
          if missing:
              raise SystemExit('OAuth handoff is missing required fields: ' + ', '.join(missing))
          print('oauth_handoff_shape=PASS')
          PY

      - name: Install Yandex Cloud CLI
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          ARCHIVE="$RUNNER_TEMP/yc/yc.tgz"
          rm -f "$ARCHIVE"
          ok=0
          for attempt in $(seq 1 10); do
            if timeout 75s wget --quiet --continue --timeout=30 --tries=2 --retry-connrefused --output-document="$ARCHIVE" "$URL"; then
              if tar -tzf "$ARCHIVE" >/dev/null 2>&1; then
                ok=1
                break
              fi
              rm -f "$ARCHIVE"
            fi
            sleep 3
          done
          test "$ok" = 1
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/yc/yc" version

      - name: Authenticate Yandex CI service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"

      - name: Resolve live MCP resources and current image
        id: live
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"

          SECRET_ID="$(timeout 45s yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          VERSION_ID="$(timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json | jq -r '[.[]|select(.status=="ACTIVE")]|sort_by(.created_at)|last|.id // empty')"
          CONTAINER_ID="$(timeout 45s yc serverless container list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          RUNTIME_SA="$(timeout 45s yc iam service-account list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-runtime")|.id'|head -1)"
          NETWORK_ID="$(timeout 45s yc vpc network list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-net")|.id'|head -1)"
          CLUSTER_ID="$(timeout 45s yc managed-redis cluster list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-valkey")|.id'|head -1)"
          REDIS_HOST="$(timeout 45s yc managed-redis hosts list --cluster-id "$CLUSTER_ID" --format json | jq -r '[.[]|select((.role//"")=="MASTER")][0].name // .[0].name // empty')"
          DOMAIN="$(timeout 45s yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain // .[0].domain // empty')"

          timeout 45s yc serverless container revision list --container-id "$CONTAINER_ID" --format json --no-user-output > "$RUNNER_TEMP/revisions.json"
          REVISION_ID="$(jq -r '[.[]|select(.status=="ACTIVE")]|sort_by(.created_at)|last|.id // empty' "$RUNNER_TEMP/revisions.json")"
          test -n "$REVISION_ID"
          timeout 45s yc serverless container revision get --id "$REVISION_ID" --format json --no-user-output > "$RUNNER_TEMP/current-revision.json"
          IMAGE="$(jq -r '.image.image_url // empty' "$RUNNER_TEMP/current-revision.json")"

          for v in SECRET_ID VERSION_ID CONTAINER_ID RUNTIME_SA NETWORK_ID CLUSTER_ID REDIS_HOST DOMAIN IMAGE; do
            test -n "${!v}"
          done
          echo "folder=$FOLDER_ID" >> "$GITHUB_OUTPUT"
          echo "secret=$SECRET_ID" >> "$GITHUB_OUTPUT"
          echo "base_version=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "container=$CONTAINER_ID" >> "$GITHUB_OUTPUT"
          echo "sa=$RUNTIME_SA" >> "$GITHUB_OUTPUT"
          echo "network=$NETWORK_ID" >> "$GITHUB_OUTPUT"
          echo "redis_host=$REDIS_HOST" >> "$GITHUB_OUTPUT"
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo 'live_runtime_resolved=PASS'

      - name: Add Google Drive OAuth to Yandex Lockbox
        id: lockbox
        shell: bash
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
          SECRET_ID: ${{ steps.live.outputs.secret }}
          BASE_VERSION_ID: ${{ steps.live.outputs.base_version }}
        run: |
          set -euo pipefail
          PAYLOAD="$RUNNER_TEMP/oauth-payload.json"
          python - <<'PY'
          import json, os
          raw = os.environ['GOOGLE_DRIVE_OAUTH_JSON']
          cfg = json.loads(raw)
          compact = json.dumps(cfg, ensure_ascii=False, separators=(',', ':'))
          with open(os.environ['RUNNER_TEMP'] + '/oauth-payload.json', 'w', encoding='utf-8') as f:
              json.dump([{'key':'google_drive_oauth_json','text_value':compact}], f, ensure_ascii=False, separators=(',', ':'))
          PY
          chmod 600 "$PAYLOAD"
          timeout 60s yc lockbox secret add-version \
            --id "$SECRET_ID" \
            --base-version-id "$BASE_VERSION_ID" \
            --description "Google Drive archive OAuth bootstrap 2026-09-13" \
            --payload - --format json --no-user-output \
            < "$PAYLOAD" > "$RUNNER_TEMP/new-version.json"
          NEW_VERSION_ID="$(jq -r '.id // .response.id // empty' "$RUNNER_TEMP/new-version.json")"
          test -n "$NEW_VERSION_ID"
          echo "version=$NEW_VERSION_ID" >> "$GITHUB_OUTPUT"

          timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"
          jq -r --arg id "$NEW_VERSION_ID" '.[]|select(.id==$id)|.payload_entry_keys[]?' "$RUNNER_TEMP/versions.json" | sort -u > "$RUNNER_TEMP/keys.txt"
          for key in cabinets_json mcp_bearer_token redis_password google_drive_oauth_json; do
            grep -Fxq "$key" "$RUNNER_TEMP/keys.txt"
          done
          echo 'lockbox_google_drive_oauth=PASS'

      - name: Deploy Drive-enabled MCP revision
        id: deploy
        shell: bash
        env:
          FOLDER_ID: ${{ steps.live.outputs.folder }}
          SECRET_ID: ${{ steps.live.outputs.secret }}
          VERSION_ID: ${{ steps.lockbox.outputs.version }}
          CONTAINER_ID: ${{ steps.live.outputs.container }}
          RUNTIME_SA: ${{ steps.live.outputs.sa }}
          NETWORK_ID: ${{ steps.live.outputs.network }}
          REDIS_HOST: ${{ steps.live.outputs.redis_host }}
          DOMAIN: ${{ steps.live.outputs.domain }}
          IMAGE: ${{ steps.live.outputs.image }}
        run: |
          set -euo pipefail
          timeout 180s yc serverless container revision deploy \
            --container-id "$CONTAINER_ID" --folder-id "$FOLDER_ID" \
            --image "$IMAGE" --memory 512MB --cores 1 --execution-timeout 600s --concurrency 8 \
            --service-account-id "$RUNTIME_SA" --network-id "$NETWORK_ID" \
            --environment "MARKETPLACE_REQUIRE_REDIS=1,MARKETPLACE_MCP_REDIS_HOST=$REDIS_HOST,MARKETPLACE_MCP_REDIS_PORT=6380,MARKETPLACE_MCP_REDIS_TLS=1,MARKETPLACE_MCP_REDIS_CA_CERT=/opt/yandex/YandexInternalRootCA.crt,OZON_GLOBAL_RPS=50,OZON_PERF_GLOBAL_RPS=10,MARKETPLACE_MCP_ARCHIVE_DRIVE_ROOT_ID=1UVKUcFfDhCDk6nMHX1mWg9cRL05DT-OJ" \
            --secret "environment-variable=MARKETPLACE_MCP_CABINETS_JSON,id=$SECRET_ID,version-id=$VERSION_ID,key=cabinets_json" \
            --secret "environment-variable=MARKETPLACE_MCP_BEARER_TOKEN,id=$SECRET_ID,version-id=$VERSION_ID,key=mcp_bearer_token" \
            --secret "environment-variable=MARKETPLACE_MCP_REDIS_PASSWORD,id=$SECRET_ID,version-id=$VERSION_ID,key=redis_password" \
            --secret "environment-variable=MARKETPLACE_MCP_GOOGLE_DRIVE_OAUTH_JSON,id=$SECRET_ID,version-id=$VERSION_ID,key=google_drive_oauth_json" \
            --format json --no-user-output > "$RUNNER_TEMP/drive-revision.json"
          REVISION_ID="$(jq -r '.id // empty' "$RUNNER_TEMP/drive-revision.json")"
          test -n "$REVISION_ID"
          BASE="https://${DOMAIN}"
          CODE=000
          for attempt in $(seq 1 18); do
            CODE="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/health" -w '%{http_code}' "$BASE/healthz" || true)"
            [[ "$CODE" == 200 ]] && break
            sleep 5
          done
          test "$CODE" = 200
          echo "gateway=$BASE" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION_ID" >> "$GITHUB_OUTPUT"
          echo 'drive_enabled_revision=PASS'

      - name: Prove Drive archive is live through remote MCP
        shell: bash
        timeout-minutes: 5
        env:
          SECRET_ID: ${{ steps.live.outputs.secret }}
          VERSION_ID: ${{ steps.lockbox.outputs.version }}
          GATEWAY_URL: ${{ steps.deploy.outputs.gateway }}
        run: |
          set -euo pipefail
          timeout 45s yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --key mcp_bearer_token --format json --no-user-output > "$RUNNER_TEMP/bearer-entry.json"
          BEARER="$(jq -r '.entries[0].text_value // empty' "$RUNNER_TEMP/bearer-entry.json")"
          test -n "$BEARER"
          echo "::add-mask::$BEARER"
          export MCP_BEARER="$BEARER"
          export MCP_URL="${GATEWAY_URL}/mcp"
          python -m pip install --quiet 'httpx>=0.27,<1'
          python -u - <<'PY'
          import datetime, itertools, json, os
          import httpx

          headers = {
              'Authorization': 'Bearer ' + os.environ['MCP_BEARER'],
              'Accept': 'application/json, text/event-stream',
              'Content-Type': 'application/json',
          }
          ids = itertools.count(1)
          timeout = httpx.Timeout(connect=10, read=90, write=30, pool=10)

          def unpack(resp):
              resp.raise_for_status()
              for line in resp.text.splitlines():
                  if line.startswith('data:'):
                      return json.loads(line[5:].strip())
              return resp.json()

          with httpx.Client(timeout=timeout, follow_redirects=True) as c:
              r = c.post(os.environ['MCP_URL'], headers=headers, json={
                  'jsonrpc':'2.0','id':next(ids),'method':'initialize','params':{
                      'protocolVersion':'2025-06-18','capabilities':{},
                      'clientInfo':{'name':'drive-oauth-bootstrap','version':'1'}
                  }})
              init = unpack(r)
              assert 'result' in init, init
              h = dict(headers)
              sid = r.headers.get('mcp-session-id')
              if sid:
                  h['Mcp-Session-Id'] = sid
              h['MCP-Protocol-Version'] = init['result'].get('protocolVersion','2025-06-18')
              n = c.post(os.environ['MCP_URL'], headers=h, json={'jsonrpc':'2.0','method':'notifications/initialized'})
              assert n.status_code in (200,202), n.status_code

              def rpc(method, params=None):
                  rr = c.post(os.environ['MCP_URL'], headers=h, json={'jsonrpc':'2.0','id':next(ids),'method':method,'params':params or {}})
                  data = unpack(rr)
                  assert 'result' in data, data
                  return data['result']

              def call(name, args):
                  result = rpc('tools/call', {'name':name,'arguments':args})
                  assert not result.get('isError'), result
                  text = next(x['text'] for x in result['content'] if x.get('type')=='text')
                  return json.loads(text)

              names = {x['name'] for x in rpc('tools/list')['tools']}
              assert {'marketplace_archive_update','marketplace_archive_status','marketplace_archive_query'} <= names
              status = call('marketplace_archive_status', {'year': datetime.date.today().year})
              assert status.get('ok') is True, status
              storage = status.get('storage') or {}
              assert storage.get('configured') is True and storage.get('reachable') is True, storage
              assert storage.get('root_folder_id') == '1UVKUcFfDhCDk6nMHX1mWg9cRL05DT-OJ', storage
              assert storage.get('root_name') == 'MCP архив базы данных', storage
              print('DRIVE_ARCHIVE_LIVE=PASS')
          PY

      - name: Cleanup temporary files
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/yc-service-account-key.json" \
            "$RUNNER_TEMP/oauth-payload.json" \
            "$RUNNER_TEMP/new-version.json" \
            "$RUNNER_TEMP/versions.json" \
            "$RUNNER_TEMP/keys.txt" \
            "$RUNNER_TEMP/revisions.json" \
            "$RUNNER_TEMP/current-revision.json" \
            "$RUNNER_TEMP/drive-revision.json" \
            "$RUNNER_TEMP/bearer-entry.json" \
            "$RUNNER_TEMP/health"
