name: Google Drive Bridge v1 CI

on:
  pull_request:
    paths:
      - 'shared/google-drive-bridge/**'
      - 'tools/bootstrap_bridge_v1_apps_script.py'
      - 'terraform/birzha_test/m24_autonomous_worker.tf'
      - 'terraform/birzha_test/m25_market_mirror.tf'
      - '.github/workflows/*drive-bridge-v1*'
      - '.github/workflows/google-drive-bridge-v1-*'
  push:
    branches:
      - feature/google-drive-bridge-v1
      - feature/bridge-v1-large-read
      - bridge-v1-finalization-20260914
    paths:
      - 'shared/google-drive-bridge/**'
      - 'tools/bootstrap_bridge_v1_apps_script.py'
      - 'terraform/birzha_test/m24_autonomous_worker.tf'
      - 'terraform/birzha_test/m25_market_mirror.tf'
      - '.github/workflows/*drive-bridge-v1*'
      - '.github/workflows/google-drive-bridge-v1-*'

permissions:
  contents: read

jobs:
  python-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check httpx pytest
      - name: Compile all Bridge helpers
        run: |
          python -m py_compile \
            shared/google-drive-bridge/python_client/bridge_client.py \
            shared/google-drive-bridge/scripts/acceptance.py \
            shared/google-drive-bridge/scripts/sheets_acceptance.py \
            shared/google-drive-bridge/scripts/cross_project_acceptance.py \
            tools/bootstrap_bridge_v1_apps_script.py
      - run: pytest -q shared/google-drive-bridge/tests

  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Apps Script syntax
        shell: bash
        run: |
          set -euo pipefail
          cp shared/google-drive-bridge/bridge.gs "$RUNNER_TEMP/bridge.js"
          node --check "$RUNNER_TEMP/bridge.js"
          cp shared/google-drive-bridge/setup.gs "$RUNNER_TEMP/setup.js"
          node --check "$RUNNER_TEMP/setup.js"
          for f in shared/google-drive-bridge/deploy/*_config.gs; do
            cp "$f" "$RUNNER_TEMP/config.js"
            node --check "$RUNNER_TEMP/config.js"
          done

      - name: Validate required bridge invariants
        shell: bash
        run: |
          set -euo pipefail
          f='shared/google-drive-bridge/bridge.gs'
          grep -Fq 'MCP_DRIVE_BRIDGE_PROJECT_ID' "$f"
          grep -Fq 'MCP_DRIVE_BRIDGE_ROOT_ID' "$f"
          grep -Fq 'PROJECT_MISMATCH' "$f"
          grep -Fq 'SHORTCUT_FORBIDDEN' "$f"
          grep -Fq 'idempotency_key' "$f"
          grep -Fq 'resumable_start' "$f"
          grep -Fq 'large_download_start' "$f"
          grep -Fq 'large_download_poll' "$f"
          grep -Fq 'drive_files_download_lro' "$f"
          grep -Fq 'sheet_write_chunk' "$f"
          grep -Fq 'injected.secret' "$f"
          if grep -Fq 'getScriptLock(); lock.waitLock' "$f"; then
            echo 'Global whole-request ScriptLock pattern is forbidden'
            exit 1
          fi
          echo 'BRIDGE_STATIC_CONTRACT=PASS'

      - name: Prove secret values are not committed
        shell: bash
        run: |
          set -euo pipefail
          for f in shared/google-drive-bridge/deploy/*_config.gs; do
            grep -Fq "secret: ''" "$f"
          done
          if grep -R --line-number -E "gdrive_bridge_v1_secret['\"]?[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9_-]{20,}" shared tools .github terraform; then
            echo 'Potential committed Bridge v1 secret value detected' >&2
            exit 1
          fi
          echo 'BRIDGE_COMMITTED_SECRET_VALUES=NONE'

      - name: Validate project Lockbox isolation and joint acceptance
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'LOCKBOX_NAME: marketplaces-mcp-api-credentials' .github/workflows/marketplaces-drive-bridge-v1-bootstrap.yml
          grep -Fq 'LOCKBOX_KEY: gdrive_bridge_v1_secret' .github/workflows/marketplaces-drive-bridge-v1-bootstrap.yml
          grep -Fq 'LOCKBOX_NAME: birzha-mcp-forecast-test-auth' .github/workflows/birzha-drive-bridge-v1-bootstrap.yml
          grep -Fq 'LOCKBOX_KEY: gdrive_bridge_v1_secret' .github/workflows/birzha-drive-bridge-v1-bootstrap.yml
          grep -Fq 'LOCKBOX_NAME: marketplaces-mcp-api-credentials' .github/workflows/marketplaces-drive-bridge-v1-acceptance.yml
          grep -Fq 'LOCKBOX_NAME: birzha-mcp-forecast-test-auth' .github/workflows/birzha-drive-bridge-v1-acceptance.yml
          grep -Fq 'key                  = "gdrive_bridge_v1_secret"' terraform/birzha_test/m24_autonomous_worker.tf
          test -f .github/workflows/google-drive-bridge-v1-cross-project-acceptance.yml
          echo 'BRIDGE_PROJECT_ISOLATION_STATIC=PASS'
