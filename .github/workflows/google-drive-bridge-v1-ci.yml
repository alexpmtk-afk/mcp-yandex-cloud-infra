name: Google Drive Bridge v1 CI

on:
  pull_request:
    paths:
      - 'shared/google-drive-bridge/**'
      - '.github/workflows/google-drive-bridge-v1-ci.yml'
  push:
    branches:
      - feature/google-drive-bridge-v1
      - feature/bridge-v1-large-read
    paths:
      - 'shared/google-drive-bridge/**'
      - '.github/workflows/google-drive-bridge-v1-ci.yml'

permissions:
  contents: read

jobs:
  python-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check httpx pytest
      - run: |
          python -m py_compile \
            shared/google-drive-bridge/python_client/bridge_client.py \
            shared/google-drive-bridge/scripts/acceptance.py \
            shared/google-drive-bridge/scripts/sheets_acceptance.py \
            shared/google-drive-bridge/scripts/cross_project_acceptance.py
      - run: pytest -q shared/google-drive-bridge/tests

  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Apps Script syntax
        shell: bash
        run: |
          set -euo pipefail
          cp shared/google-drive-bridge/bridge.gs "$RUNNER_TEMP/bridge.js"
          node --check "$RUNNER_TEMP/bridge.js"
          cp shared/google-drive-bridge/setup.gs "$RUNNER_TEMP/setup.js"
          node --check "$RUNNER_TEMP/setup.js"
      - name: Validate required bridge invariants
        shell: bash
        run: |
          set -euo pipefail
          f='shared/google-drive-bridge/bridge.gs'
          grep -Fq "MCP_DRIVE_BRIDGE_PROJECT_ID" "$f"
          grep -Fq "MCP_DRIVE_BRIDGE_ROOT_ID" "$f"
          grep -Fq "PROJECT_MISMATCH" "$f"
          grep -Fq "SHORTCUT_FORBIDDEN" "$f"
          grep -Fq "idempotency_key" "$f"
          grep -Fq "resumable_start" "$f"
          grep -Fq "large_download_start" "$f"
          grep -Fq "large_download_poll" "$f"
          grep -Fq "drive_files_download_lro" "$f"
          grep -Fq "sheet_write_chunk" "$f"
          if grep -Fq "getScriptLock(); lock.waitLock" "$f"; then
            echo 'Global whole-request ScriptLock pattern is forbidden'
            exit 1
          fi
          echo 'BRIDGE_STATIC_CONTRACT=PASS'
