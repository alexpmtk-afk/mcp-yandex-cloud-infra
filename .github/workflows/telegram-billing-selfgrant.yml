name: Telegram Billing Selfgrant
on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-billing-selfgrant.yml]
permissions:
  contents: read
jobs:
  grant:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 8
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Attempt billing viewer grant and read report
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set +e
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          sa_id=$(jq -r '.service_account_id // .serviceAccountId // empty' "$key")
          yc config profile create tg-billing-selfgrant || true
          yc config profile activate tg-billing-selfgrant
          yc config set service-account-key "$key"
          token=$(yc iam create-token)
          body=$(jq -nc --arg sa "$sa_id" '{accessBindingDeltas:[{action:"ADD",accessBinding:{roleId:"billing.accounts.viewer",subject:{id:$sa,type:"serviceAccount"}}}]}')
          echo '=== GRANT RESULT ==='
          http=$(curl -sS -o "$RUNNER_TEMP/grant.json" -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data "$body" \
            "https://billing.api.cloud.yandex.net/billing/v1/billingAccounts/d01fl7g1trd2i5d8l7r6:updateAccessBindings")
          echo "GRANT_HTTP=$http"
          jq '{done,error}' "$RUNNER_TEMP/grant.json" 2>/dev/null || cat "$RUNNER_TEMP/grant.json"
          sleep 5
          echo '=== RESOURCE REPORT ==='
          yc billing consumption-core get-resource-usage-report d01fl7g1trd2i5d8l7r6 \
            --start-date 2026-09-01T00:00:00Z --end-date 2026-09-16T23:59:59Z \
            --folder-ids b1gk4p83brasi8g811jv --aggregation-period month --format json
          echo "REPORT_EXIT=$?"
