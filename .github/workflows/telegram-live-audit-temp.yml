name: Telegram live audit temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-live-audit-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 5
    steps:
      - name: Install YC CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"

      - name: Authenticate
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"
          chmod 600 "$RUNNER_TEMP/key.json"
          yc config profile create telegram-live-audit || true
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          yc config set cloud-id b1gi4pr9msenirafh2c7
          yc config set folder-id b1gk4p83brasi8g811jv

      - name: Read current Telegram cloud state
        shell: bash
        run: |
          set +e
          F=b1gk4p83brasi8g811jv
          echo '=== INSTANCES ==='
          yc compute instance list --folder-id "$F" --format json --no-user-output | jq '[.[] | {id,name,status,created_at,zone_id,resources,boot_disk:(.boot_disk.disk_id // null),secondary_disks:[.secondary_disks[]?.disk_id],network_interfaces:[.network_interfaces[]? | {subnet_id,internal_ip:(.primary_v4_address.address // null),public_ip:(.primary_v4_address.one_to_one_nat.address // null)}]}]'
          echo '=== DISKS ==='
          yc compute disk list --folder-id "$F" --format json --no-user-output | jq '[.[] | {id,name,status,created_at,type_id,zone_id,size,instance_ids}]'
          echo '=== ADDRESSES ==='
          yc vpc address list --folder-id "$F" --format json --no-user-output | jq '[.[] | {id,name,created_at,reserved,used,external_ipv4_address:(.external_ipv4_address.address // null),zone_id:(.external_ipv4_address.zone_id // null)}]'
          echo '=== NAT_GATEWAYS ==='
          yc vpc gateway list --folder-id "$F" --format json --no-user-output | jq '[.[] | {id,name,created_at}]'
          echo '=== SUBNETS ==='
          yc vpc subnet list --folder-id "$F" --format json --no-user-output | jq '[.[] | {id,name,network_id,zone_id,route_table_id,v4_cidr_blocks}]'
          echo '=== ROUTE_TABLES ==='
          yc vpc route-table list --folder-id "$F" --format json --no-user-output | jq '[.[] | {id,name,network_id,static_routes}]'
          echo '=== SERVERLESS_CONTAINERS ==='
          yc serverless container list --folder-id "$F" --format json --no-user-output | jq '[.[] | {id,name,status,created_at,url}]'
          echo '=== TRIGGERS ==='
          yc serverless trigger list --folder-id "$F" --format json --no-user-output | jq '[.[] | {id,name,status,created_at,rule}]'
          echo '=== API_GATEWAYS ==='
          yc serverless api-gateway list --folder-id "$F" --format json --no-user-output | jq '[.[] | {id,name,status,created_at,domain}]'
          echo '=== BUCKETS ==='
          yc storage bucket list --folder-id "$F" --format json --no-user-output | jq '[.[] | {name,folder_id,created_at,max_size,default_storage_class,versioning}]'
          echo '=== REGISTRIES ==='
          yc container registry list --folder-id "$F" --format json --no-user-output | jq '[.[] | {id,name,status,created_at}]'
          echo '=== REGISTRY_IMAGES ==='
          for R in $(yc container registry list --folder-id "$F" --format json --no-user-output | jq -r '.[].id'); do
            echo "--- registry=$R ---"
            yc container image list --registry-id "$R" --format json --no-user-output | jq '[.[] | {id,name,created_at,compressed_size}]'
          done
          echo '=== LOCKBOX_METADATA ==='
          yc lockbox secret list --folder-id "$F" --format json --no-user-output | jq '[.[] | {id,name,status,created_at}]'

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json"
