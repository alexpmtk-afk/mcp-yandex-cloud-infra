name: Semantic Core GitHub Bootstrap TEST v3

on:
  push:
    branches: [main]
    paths: [".github/workflows/semantic-core-github-bootstrap-test-v3.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplaces-test-runtime-write
  cancel-in-progress: false

env:
  FOLDER_ID: b1gnd0dqoq3ljod88i8t
  CONTAINER_ID: bba6lj5ggejtop0jl5k8
  RUNTIME_SA: ajems6nusv4frv6f29vt
  NETWORK_ID: enp3vuoau0hkv7hcb6mh
  REDIS_HOST: rc1a-bu0kmsr3iferj161.mdb.yandexcloud.net
  DOMAIN: d5deoa6cl4irtmkp5ad6.bu9mdbe1.apigw.yandexcloud.net
  SECRET_ID: e6qb8b3u57e71731j1os
  VERSION_ID: e6qucjo70kqmnplsibb8
  BASE_IMAGE: cr.yandex/crp6o36mbl2tqonu1qbi/marketplaces-mcp:test-17debe3190caa575c270ecdd3484e1411410307e
  BOOTSTRAP_COMMIT: d1989df3ab48d37d4b791c771005b360463041c2
  BOOTSTRAP_URL: https://raw.githubusercontent.com/alexpmtk-afk/mcp-yandex-cloud-infra/d1989df3ab48d37d4b791c771005b360463041c2/tools/semantic-test-bootstrap.py
  SEMANTIC_SOURCE: 920f3f1458a1700ad350d43cf35178256e8e858f
  ARCHIVE_BUCKET: marketplaces-mcp-archive-b1gnd0dqoq3ljod88i8t
  ARCHIVE_DRIVE_ROOT_ID: 1UVKUcFfDhCDk6nMHX1mWg9cRL05DT-OJ
  DRIVE_BRIDGE_URL: https://script.google.com/macros/s/AKfycbzgFDAQY4rcsblKhiAONfOI6315k8W3vwbSIEsczE3ycQtnJ8ctcVKjhzjgdTgfy0cvIA/exec

jobs:
  deploy-and-accept:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prove TEST scripts
        run: |
          python -m py_compile tools/semantic-test-acceptance.py
          curl -fsSL "https://raw.githubusercontent.com/alexpmtk-afk/mcp-yandex-cloud-infra/${BOOTSTRAP_COMMIT}/app/.source-revision" > "$RUNNER_TEMP/source-revision"
          grep -Fq "Semantic Core source: alexpmtk-afk/marketplaces-mcp-ru@${SEMANTIC_SOURCE}" "$RUNNER_TEMP/source-revision"
          curl -fsSL "$BOOTSTRAP_URL" > "$RUNNER_TEMP/bootstrap.py"
          python -m py_compile "$RUNNER_TEMP/bootstrap.py"

      - name: Install yc
        run: |
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"

      - name: Authenticate and capture TEST state
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY"
          chmod 600 "$KEY"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY"
          yc config set folder-id "$FOLDER_ID"
          PREVIOUS_ACTIVE_REVISION="$(yc serverless container revision list --container-id "$CONTAINER_ID" --format json --no-user-output | jq -r '[.[]|select(.status=="ACTIVE")]|last|.id // empty')"
          test -n "$PREVIOUS_ACTIVE_REVISION"
          echo "PREVIOUS_ACTIVE_REVISION=$PREVIOUS_ACTIVE_REVISION" >> "$GITHUB_ENV"
          yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/payload.json"
          BEARER="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value' "$RUNNER_TEMP/payload.json")"
          test -n "$BEARER"
          echo "::add-mask::$BEARER"
          printf '%s' "$BEARER" > "$RUNNER_TEMP/bearer"
          echo "ROLLBACK_TARGET=$PREVIOUS_ACTIVE_REVISION"

      - name: Deploy immutable Semantic Core bootstrap
        id: deploy
        run: |
          set -euo pipefail
          BOOTSTRAP_CODE="import urllib.request;exec(urllib.request.urlopen(\"${BOOTSTRAP_URL}\").read().decode())"
          export BOOTSTRAP_CODE
          ARGS_CSV="$(python - <<'PY'
          import csv, io, os
          buf = io.StringIO()
          csv.writer(buf, lineterminator='').writerow([os.environ['BOOTSTRAP_CODE']])
          print(buf.getvalue(), end='')
          PY
          )"
          yc serverless container revision deploy \
            --container-id "$CONTAINER_ID" --folder-id "$FOLDER_ID" \
            --image "$BASE_IMAGE" --memory 2048MB --cores 1 --execution-timeout 600s --concurrency 8 \
            --service-account-id "$RUNTIME_SA" --network-id "$NETWORK_ID" \
            --command python,-c --args "$ARGS_CSV" \
            --environment "MARKETPLACE_SEMANTIC_BOOTSTRAP_COMMIT=$BOOTSTRAP_COMMIT,MARKETPLACE_REQUIRE_REDIS=1,MARKETPLACE_MCP_REDIS_HOST=$REDIS_HOST,MARKETPLACE_MCP_REDIS_PORT=6380,MARKETPLACE_MCP_REDIS_TLS=1,MARKETPLACE_MCP_REDIS_CA_CERT=/opt/yandex/YandexInternalRootCA.crt,OZON_GLOBAL_RPS=50,OZON_PERF_GLOBAL_RPS=10,MARKETPLACE_MCP_ARCHIVE_BUCKET=$ARCHIVE_BUCKET,MARKETPLACE_MCP_ARCHIVE_DRIVE_ROOT_ID=$ARCHIVE_DRIVE_ROOT_ID,MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_URL=$DRIVE_BRIDGE_URL" \
            --secret "environment-variable=MARKETPLACE_MCP_CABINETS_JSON,id=$SECRET_ID,version-id=$VERSION_ID,key=cabinets_json" \
            --secret "environment-variable=MARKETPLACE_MCP_BEARER_TOKEN,id=$SECRET_ID,version-id=$VERSION_ID,key=mcp_bearer_token" \
            --secret "environment-variable=MARKETPLACE_MCP_REDIS_PASSWORD,id=$SECRET_ID,version-id=$VERSION_ID,key=redis_password" \
            --secret "environment-variable=MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_SECRET,id=$SECRET_ID,version-id=$VERSION_ID,key=google_drive_bridge_secret" \
            --description "TEST Semantic Core ${SEMANTIC_SOURCE} immutable GitHub bootstrap" \
            --format json --no-user-output > "$RUNNER_TEMP/revision.json"
          REVISION_ID="$(jq -r '.id // empty' "$RUNNER_TEMP/revision.json")"
          test -n "$REVISION_ID"
          echo "revision_id=$REVISION_ID" >> "$GITHUB_OUTPUT"
          echo "BOOTSTRAP_REVISION=$REVISION_ID"

      - name: Live MCP acceptance
        run: |
          set -euo pipefail
          python -m pip install --quiet 'httpx>=0.27,<1'
          export MCP_URL="https://${DOMAIN}/mcp"
          export MCP_BEARER="$(cat "$RUNNER_TEMP/bearer")"
          python -u tools/semantic-test-acceptance.py

      - name: Roll back failed TEST revision
        if: ${{ failure() && steps.deploy.outputs.revision_id != '' }}
        run: |
          yc serverless container rollback --id "$CONTAINER_ID" --revision-id "$PREVIOUS_ACTIVE_REVISION"
          echo "TEST_ROLLBACK=PASS revision=$PREVIOUS_ACTIVE_REVISION"

      - name: Final TEST evidence
        if: success()
        run: |
          yc serverless container revision get "${{ steps.deploy.outputs.revision_id }}" --format json --no-user-output | jq '{id,container_id,status,created_at,image,service_account_id,description}'
          echo "SEMANTIC_CORE_TEST_LIVE=${{ steps.deploy.outputs.revision_id }}"

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/source-revision" "$RUNNER_TEMP/bootstrap.py" "$RUNNER_TEMP/payload.json" "$RUNNER_TEMP/bearer" "$RUNNER_TEMP/revision.json"
