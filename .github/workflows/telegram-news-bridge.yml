name: Telegram News Bridge

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-news-bridge.yml]
  workflow_dispatch:
  schedule:
    # Candidate UTC hours for 02:00, 08:00, 14:00 and 20:00 Europe/Helsinki.
    # The gate below handles EET/EEST automatically, so local times do not drift at DST changes.
    - cron: '0 0,5,6,11,12,17,18,23 * * *'

permissions:
  contents: write

concurrency:
  group: telegram-news-reader-serverless-rolling
  cancel-in-progress: false

# Canonical rolling 192-hour snapshot, produced directly from the private
# Serverless Reader. Scheduled production refreshes run every six hours at
# 02:00, 08:00, 14:00 and 20:00 Europe/Helsinki. Manual and push runs remain allowed.
jobs:
  schedule_gate:
    runs-on: ubuntu-latest
    outputs:
      run_export: ${{ steps.gate.outputs.run_export }}
      helsinki_time: ${{ steps.gate.outputs.helsinki_time }}
    steps:
      - id: gate
        name: Resolve Europe/Helsinki schedule
        shell: bash
        run: |
          set -euo pipefail
          local_time="$(TZ=Europe/Helsinki date '+%Y-%m-%d %H:%M:%S %Z')"
          local_hour="$(TZ=Europe/Helsinki date '+%H')"
          run_export=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$local_hour" in
              02|08|14|20) run_export=true ;;
              *) run_export=false ;;
            esac
          fi
          echo "run_export=$run_export" >> "$GITHUB_OUTPUT"
          echo "helsinki_time=$local_time" >> "$GITHUB_OUTPUT"
          echo "HELSINKI_TIME=$local_time"
          echo "RUN_EXPORT=$run_export"

  export:
    needs: schedule_gate
    if: needs.schedule_gate.outputs.run_export == 'true'
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-news-bridge-serverless || true
          yc config profile activate telegram-news-bridge-serverless
          yc config set service-account-key "$key"
          yc config set folder-id b1gk4p83brasi8g811jv

      - name: Validate private production Reader
        shell: bash
        run: |
          set -euo pipefail
          folder=b1gk4p83brasi8g811jv
          url="$(yc serverless container get telegram-reader-serverless --folder-id "$folder" --format json | jq -r '.url')"
          url="${url%/}"
          test -n "$url" && test "$url" != null
          token="$(yc iam create-token)"
          healthy=0
          for attempt in $(seq 1 12); do
            body="$(curl -sS --max-time 30 -H "Authorization: Bearer $token" "$url/health" || true)"
            if echo "$body" | jq -e '.status=="ok" and .telegram_authorized==true and .allowed_chats>=1 and .media_storage=="enabled"' >/dev/null 2>&1; then
              healthy=1
              echo "PRODUCTION_READER_HEALTH_ATTEMPT=$attempt"
              break
            fi
            sleep 5
          done
          test "$healthy" -eq 1
          public_code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$url/internal/chats")"
          test "$public_code" = 401 -o "$public_code" = 403
          echo "READER_URL=$url" >> "$GITHUB_ENV"
          echo PRODUCTION_READER_HEALTH_PASS

      - name: Read all managed chats for the rolling 192-hour window
        shell: bash
        run: |
          set -euo pipefail
          token="$(yc iam create-token)"
          generated_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          date_from="$(date -u -d '192 hours ago' '+%Y-%m-%dT%H:%M:%SZ')"
          work="$RUNNER_TEMP/telegram-production-rolling"
          mkdir -p "$work"
          : > "$work/messages.ndjson"

          chats="$(curl -fsS --retry 2 --retry-delay 2 --max-time 30 -H "Authorization: Bearer $token" "$READER_URL/internal/chats")"
          echo "$chats" | jq -e '.chat_count>=1 and (.chats|length)==.chat_count' >/dev/null
          allowed_chats="$(echo "$chats" | jq -r '.chat_count')"
          echo "ALLOWED_CHATS=$allowed_chats" >> "$GITHUB_ENV"

          while read -r cid; do
            before=''
            pages=0
            while :; do
              pages=$((pages+1))
              test "$pages" -le 25
              args=(--get --data-urlencode "date_from=$date_from" --data-urlencode "date_to=$generated_at" --data-urlencode 'limit=2000')
              if [ -n "$before" ]; then args+=(--data-urlencode "before_id=$before"); fi
              page="$(curl -fsS --retry 2 --retry-delay 2 --max-time 110 -H "Authorization: Bearer $token" "${args[@]}" "$READER_URL/internal/chats/$cid/messages")"
              echo "$page" | jq -e --argjson id "$cid" '.chat_id==$id and (.messages|length)==.message_count' >/dev/null
              echo "$page" | jq -c --arg collected_at "$generated_at" '.messages[]+{username:null,collected_at:$collected_at}' >> "$work/messages.ndjson"
              full="$(echo "$page" | jq -r '.page_full')"
              next="$(echo "$page" | jq -r '.next_before_id // empty')"
              if [ "$full" != true ]; then break; fi
              test -n "$next"
              if [ -n "$before" ]; then test "$next" -lt "$before"; fi
              before="$next"
            done
          done < <(echo "$chats" | jq -r '.chats[].chat_id')

          jq -s 'unique_by([.chat_id,.message_id])|sort_by(.datetime)|reverse|.[:20000]' "$work/messages.ndjson" > "$work/messages.json"
          test "$(jq 'length' "$work/messages.json")" -gt 0

          echo "WORK=$work" >> "$GITHUB_ENV"
          echo "GENERATED_AT=$generated_at" >> "$GITHUB_ENV"
          echo "DATE_FROM=$date_from" >> "$GITHUB_ENV"
          echo "ROLLING_MESSAGES=$(jq 'length' "$work/messages.json")"
          echo PRODUCTION_ROLLING_READ_PASS

      - name: Reuse existing media assets and issue fresh signed URLs
        shell: bash
        run: |
          set -euo pipefail
          canonical=telegram-news-reader/export/TELEGRAM_NEWS_LATEST.json
          verified=telegram-news-reader/export/TELEGRAM_NEWS_LATEST_SERVERLESS_MEDIA_CUTOVER_SAFE.json
          test -s "$canonical"

          media_url="$(yc serverless container get telegram-reader-media --folder-id b1gk4p83brasi8g811jv --format json | jq -r '.url')"
          media_url="${media_url%/}"
          media_secret="$(yc lockbox secret list --folder-id b1gk4p83brasi8g811jv --format json | jq -r '.[]|select(.name=="telegram-reader-media-runtime")|.id' | head -1)"
          test -n "$media_secret"
          cloud_token="$(yc iam create-token)"
          curl -fsS -H "Authorization: Bearer $cloud_token" \
            "https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/$media_secret/payload" \
            -o "$RUNNER_TEMP/media-secret.json"

          CANONICAL="$canonical" VERIFIED="$verified" MEDIA_URL="$media_url" python3 - <<'PY'
          import hashlib, hmac, json, os, time, urllib.parse
          work = os.environ['WORK']
          cur = json.load(open(work + '/messages.json', encoding='utf-8'))
          sec = json.load(open(os.environ['RUNNER_TEMP'] + '/media-secret.json', encoding='utf-8'))
          vals = {str(e.get('key') or ''): str(e.get('textValue') or '') for e in sec.get('entries', [])}
          secret = vals.get('TELEGRAM_MEDIA_LINK_SECRET', '')
          if not secret:
              raise SystemExit('missing media link secret')
          base = os.environ['MEDIA_URL'].rstrip('/')
          expires = int(time.time()) + 7200
          def fresh(key):
              sig = hmac.new(secret.encode(), f'{key}\n{expires}'.encode(), hashlib.sha256).hexdigest()
              return base + '/media/object?' + urllib.parse.urlencode({'key': key, 'expires': expires, 'sig': sig})

          pmap = {}
          for path in (os.environ['VERIFIED'], os.environ['CANONICAL']):
              if not os.path.isfile(path) or not os.path.getsize(path):
                  continue
              data = json.load(open(path, encoding='utf-8'))
              for row in data.get('messages', []):
                  asset = row.get('media_asset')
                  if isinstance(asset, dict) and asset.get('object_key') and asset.get('preview_object_key'):
                      pmap[f"{row.get('chat_id')}:{row.get('message_id')}"] = asset

          supported = {'photo', 'image', 'gif', 'animation'}
          reused, missing = [], []
          for row in cur:
              if row.get('media_type') not in supported:
                  continue
              asset = pmap.get(f"{row['chat_id']}:{row['message_id']}")
              if asset:
                  reused.append({
                      'chat_id': row['chat_id'], 'message_id': row['message_id'],
                      'media_asset': {
                          'media_type': asset.get('media_type') or row.get('media_type'),
                          'size': asset.get('size'),
                          'object_key': asset['object_key'],
                          'media_url': fresh(asset['object_key']),
                          'preview_size': asset.get('preview_size'),
                          'preview_object_key': asset['preview_object_key'],
                          'preview_url': fresh(asset['preview_object_key']),
                      },
                  })
              else:
                  missing.append((row['chat_id'], row['message_id'], row['media_type']))

          with open(work + '/assets.ndjson', 'w', encoding='utf-8') as f:
              for item in reused:
                  f.write(json.dumps(item, ensure_ascii=False) + '\n')
          with open(work + '/missing.tsv', 'w', encoding='utf-8') as f:
              for item in missing:
                  f.write('\t'.join(map(str, item)) + '\n')
          print('REUSED_MEDIA=' + str(len(reused)))
          print('MISSING_MEDIA=' + str(len(missing)))
          PY
          echo PRODUCTION_MEDIA_REUSE_PASS

      - name: Capture only new or previously missing visual media
        shell: bash
        run: |
          set -euo pipefail
          token="$(yc iam create-token)"
          missing=0
          if [ -s "$WORK/missing.tsv" ]; then missing="$(wc -l < "$WORK/missing.tsv" | tr -d ' ')"; fi
          captured=0
          while IFS=$'\t' read -r cid mid mtype; do
            [ -n "$cid" ] || continue
            asset="$(curl -fsS --retry 2 --retry-delay 2 --max-time 105 -H "Authorization: Bearer $token" --get --data-urlencode "media_type=$mtype" "$READER_URL/internal/chats/$cid/messages/$mid/media")"
            echo "$asset" | jq -e --argjson cid "$cid" --argjson mid "$mid" '.chat_id==$cid and .message_id==$mid and (.object_key|length)>0 and (.preview_object_key|length)>0 and (.media_url|length)>0 and (.preview_url|length)>0' >/dev/null
            echo "$asset" | jq -c '{chat_id,message_id,media_asset:{media_type,size,object_key,media_url,preview_size,preview_object_key,preview_url}}' >> "$WORK/assets.ndjson"
            captured=$((captured+1))
          done < "$WORK/missing.tsv"
          test "$captured" -eq "$missing"
          echo "CAPTURED_NEW_MEDIA=$captured"
          echo PRODUCTION_MEDIA_CAPTURE_PASS

      - name: Validate canonical V1 snapshot and one signed preview
        shell: bash
        run: |
          set -euo pipefail
          supported="$(jq '[.[]|select(.media_type=="photo" or .media_type=="image" or .media_type=="gif" or .media_type=="animation")]|length' "$WORK/messages.json")"
          assets=0
          if [ -s "$WORK/assets.ndjson" ]; then assets="$(wc -l < "$WORK/assets.ndjson" | tr -d ' ')"; fi
          test "$assets" -eq "$supported"
          test "$assets" -ge 1

          jq -s 'map({key:((.chat_id|tostring)+":"+(.message_id|tostring)),value:.media_asset})|from_entries' "$WORK/assets.ndjson" > "$WORK/assets.json"
          jq --slurpfile a "$WORK/assets.json" '$a[0] as $m|map(. as $r|(($r.chat_id|tostring)+":"+($r.message_id|tostring)) as $k|.media_asset=($m[$k]//null))' "$WORK/messages.json" > "$WORK/enriched.json"
          media="$(jq '[.[]|select(.media_asset!=null)]|length' "$WORK/enriched.json")"
          previews="$(jq '[.[]|select(.media_asset.preview_url?!=null)]|length' "$WORK/enriched.json")"
          test "$media" -eq "$supported"
          test "$previews" -eq "$media"

          jq -n \
            --arg schema TELEGRAM_NEWS_READER_V1 \
            --arg generated_at "$GENERATED_AT" \
            --argjson window_hours 192 \
            --argjson allowed_chats "$ALLOWED_CHATS" \
            --argjson media "$media" \
            --argjson previews "$previews" \
            --slurpfile messages "$WORK/enriched.json" \
            '{schema:$schema,generated_at:$generated_at,window_hours:$window_hours,allowed_chats:$allowed_chats,message_count:($messages[0]|length),media_message_count:$media,preview_message_count:$previews,messages:$messages[0]}' \
            > "$WORK/output.json"

          jq -e '
            .schema=="TELEGRAM_NEWS_READER_V1" and
            .window_hours==192 and
            .allowed_chats>=1 and
            .message_count==(.messages|length) and
            .message_count>0 and
            .media_message_count==([.messages[]|select(.media_asset!=null)]|length) and
            .preview_message_count==.media_message_count and
            ([.messages[]|select((.media_type=="photo" or .media_type=="image" or .media_type=="gif" or .media_type=="animation") and .media_asset==null)]|length)==0 and
            ([.messages[]|[.chat_id,.message_id]]|length)==([.messages[]|[.chat_id,.message_id]]|unique|length)
          ' "$WORK/output.json" >/dev/null

          python3 - "$WORK/output.json" "$DATE_FROM" "$GENERATED_AT" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          path, low_raw, high_raw = sys.argv[1:]
          def dt(v):
              x = datetime.fromisoformat(v.replace('Z', '+00:00'))
              return (x if x.tzinfo else x.replace(tzinfo=timezone.utc)).astimezone(timezone.utc)
          low, high = dt(low_raw), dt(high_raw)
          data = json.load(open(path, encoding='utf-8'))
          for row in data['messages']:
              if not low <= dt(row['datetime']) <= high:
                  raise SystemExit('message outside rolling window')
          PY

          preview="$(jq -r '[.messages[]|select(.media_asset.preview_url?!=null)][0].media_asset.preview_url' "$WORK/output.json")"
          curl -fsS --max-time 30 "$preview" -o "$WORK/preview.bin"
          test -s "$WORK/preview.bin"

          mkdir -p telegram-news-reader/export
          cp "$WORK/output.json" telegram-news-reader/export/TELEGRAM_NEWS_LATEST.json
          echo "CANONICAL_MESSAGES=$(jq -r '.message_count' "$WORK/output.json")"
          echo "CANONICAL_MEDIA=$media"
          echo "CANONICAL_PREVIEWS=$previews"
          echo "CANONICAL_PREVIEW_BYTES=$(wc -c < "$WORK/preview.bin")"
          echo SERVERLESS_PRODUCTION_ROLLING_PASS

      - name: Commit latest canonical snapshot
        shell: bash
        run: |
          set -euo pipefail
          file=telegram-news-reader/export/TELEGRAM_NEWS_LATEST.json
          git config user.name telegram-news-bridge
          git config user.email telegram-news-bridge@users.noreply.github.com
          git add "$file"
          if git diff --cached --quiet; then
            echo SNAPSHOT_UNCHANGED
            exit 0
          fi
          git commit -m "telegram-news: refresh latest snapshot via serverless"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo SERVERLESS_CANONICAL_SNAPSHOT_PUBLISH_PASS
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 2
          done
          echo SNAPSHOT_PUSH_FAILED
          exit 1

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/media-secret.json"
