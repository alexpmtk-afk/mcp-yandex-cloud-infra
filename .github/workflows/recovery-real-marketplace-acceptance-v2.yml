name: Recovery Real Marketplace Acceptance V2

on:
  push:
    branches: [recovery/marketplaces-mcp-deploy-20260830]
    paths: ['.github/workflows/recovery-real-marketplace-acceptance-v2.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsS -o "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Real remote-only acceptance
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create marketplace-accept-v2 || true
          yc config set service-account-key "$KEY_FILE"
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          VERSION_ID="$(yc lockbox secret list-versions --id "$SECRET_ID" --format json | jq -r '[.[]|select(.status=="ACTIVE")][0].id')"
          CONTAINER_ID="$(yc serverless container list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          DOMAIN="$(yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//.[0].domain')"
          yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/sec.json"
          BEARER="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value' "$RUNNER_TEMP/sec.json")"
          echo "::add-mask::$BEARER"
          export MCP_URL="https://${DOMAIN}/mcp" MCP_BEARER="$BEARER"
          python - <<'PY'
          import itertools, json, os
          import httpx

          def unpack(r):
              r.raise_for_status()
              for line in r.text.splitlines():
                  if line.startswith('data:'):
                      return json.loads(line[5:].strip())
              return r.json() if r.text.strip() else None

          base_headers = {
              'Authorization': 'Bearer ' + os.environ['MCP_BEARER'],
              'Accept': 'application/json, text/event-stream',
              'Content-Type': 'application/json',
          }
          ids = itertools.count(1)
          with httpx.Client(timeout=120, follow_redirects=True) as c:
              r = c.post(os.environ['MCP_URL'], headers=base_headers, json={
                  'jsonrpc':'2.0','id':next(ids),'method':'initialize','params':{
                      'protocolVersion':'2025-06-18','capabilities':{},
                      'clientInfo':{'name':'real-acceptance-v2','version':'1'}
                  }})
              init = unpack(r)
              assert init and 'result' in init
              sid = r.headers.get('mcp-session-id'); assert sid
              h = dict(base_headers)
              h['Mcp-Session-Id'] = sid
              h['MCP-Protocol-Version'] = init['result'].get('protocolVersion','2025-06-18')
              n = c.post(os.environ['MCP_URL'], headers=h, json={'jsonrpc':'2.0','method':'notifications/initialized'})
              assert n.status_code in (200,202)

              def rpc(method, params=None):
                  d = unpack(c.post(os.environ['MCP_URL'], headers=h, json={
                      'jsonrpc':'2.0','id':next(ids),'method':method,'params':params or {}}))
                  assert d and 'result' in d, method
                  return d['result']

              def call(name, args):
                  result = rpc('tools/call', {'name':name,'arguments':args})
                  assert not result.get('isError'), name
                  text = next((x.get('text') for x in result.get('content',[]) if x.get('type')=='text'), None)
                  assert text is not None, name
                  return json.loads(text)

              names = {x['name'] for x in rpc('tools/list')['tools']}
              need = {'wb_get_sales','ozon_get_products','wb_rate_limit_status','ozon_rate_limit_status'}
              assert need <= names, sorted(need-names)
              print(f'mcp_tools={len(names)}')

              wb = call('wb_get_sales', {'date_from':'2026-08-30','flag':0})
              print('wb_completed=true')
              print('wb_ok=' + str(wb.get('ok') is True).lower())
              print('wb_status=' + str(wb.get('status','unknown')))
              assert wb.get('ok') is True and 200 <= int(wb.get('status',0)) < 300

              oz = call('ozon_get_products', {'visibility':'ALL','limit':1,'last_id':''})
              print('ozon_completed=true')
              print('ozon_ok=' + str(oz.get('ok') is True).lower())
              print('ozon_status=' + str(oz.get('status','unknown')))
              assert oz.get('ok') is True and 200 <= int(oz.get('status',0)) < 300

              wbr = call('wb_rate_limit_status', {})
              ozr = call('ozon_rate_limit_status', {})
              assert wbr.get('backend') == 'redis' and ozr.get('backend') == 'redis'
              print('limiter_backend=redis')
              print('REMOTE_WB_OZON_ACCEPTANCE=PASS')
          PY
          LOG_COUNT="$(yc logging read --resource-ids="$CONTAINER_ID" --since '10m ago' --limit 100 --format json 2>/dev/null | jq 'length')"
          test "$LOG_COUNT" -gt 0
          echo "yandex_runtime_logs=true"
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/sec.json"
