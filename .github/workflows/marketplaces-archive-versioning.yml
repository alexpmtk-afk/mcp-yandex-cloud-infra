name: Marketplaces Archive Versioning

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/marketplaces-archive-versioning.yml
  workflow_run:
    workflows:
      - Deploy Marketplaces MCP TEST
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: marketplaces-archive-versioning
  cancel-in-progress: false

jobs:
  enable:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          curl -fsSL --retry 5 --retry-delay 3 "$URL" -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate CI service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          DEPLOYER_SA="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          test -n "$DEPLOYER_SA"
          echo "ARCHIVE_DEPLOYER_SA=$DEPLOYER_SA" >> "$GITHUB_ENV"
          yc config profile create archive-versioning || true
          yc config set service-account-key "$KEY_FILE"

      - name: Enable and verify archive bucket versioning
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          echo "ARCHIVE_FOLDER_ID=$FOLDER_ID" >> "$GITHUB_ENV"
          BUCKET="marketplaces-mcp-archive-${FOLDER_ID}"

          timeout 60s yc storage bucket get --name "$BUCKET" --format json > "$RUNNER_TEMP/bucket-before.json"
          test "$(jq -r '.name//empty' "$RUNNER_TEMP/bucket-before.json")" = "$BUCKET"

          if [[ "$(jq -r '.versioning//empty' "$RUNNER_TEMP/bucket-before.json")" != "VERSIONING_ENABLED" ]]; then
            IAM_TOKEN="$(timeout 45s yc iam create-token)"
            test -n "$IAM_TOKEN"
            echo "::add-mask::$IAM_TOKEN"
            timeout 45s curl -fsS \
              -H "Authorization: Bearer ${IAM_TOKEN}" \
              "https://resource-manager.api.cloud.yandex.net/resource-manager/v1/folders/${FOLDER_ID}:listAccessBindings?pageSize=1000" \
              > "$RUNNER_TEMP/folder-bindings-before.json"
            EXISTING_ADMIN="$(jq --arg sa "$ARCHIVE_DEPLOYER_SA" '[.accessBindings[]? | select(.roleId=="storage.admin" and .subject.type=="serviceAccount" and .subject.id==$sa)] | length' "$RUNNER_TEMP/folder-bindings-before.json")"
            test "$EXISTING_ADMIN" = 0

            timeout 60s yc resource-manager folder add-access-binding \
              --id "$FOLDER_ID" \
              --role storage.admin \
              --service-account-id "$ARCHIVE_DEPLOYER_SA" \
              --no-user-output
            echo 'ARCHIVE_TEMP_ADMIN_GRANTED=1' >> "$GITHUB_ENV"

            UPDATED=0
            for attempt in $(seq 1 12); do
              IAM_TOKEN="$(timeout 45s yc iam create-token)"
              test -n "$IAM_TOKEN"
              echo "::add-mask::$IAM_TOKEN"
              HTTP_CODE="$(timeout 60s curl -sS -o "$RUNNER_TEMP/bucket-update.json" -w '%{http_code}' -X PATCH \
                "https://storage.api.cloud.yandex.net/storage/v1/buckets/${BUCKET}" \
                -H "Authorization: Bearer ${IAM_TOKEN}" \
                -H 'Content-Type: application/json' \
                --data '{"updateMask":"versioning","versioning":"VERSIONING_ENABLED"}' || true)"
              if [[ "$HTTP_CODE" == 200 || "$HTTP_CODE" == 201 || "$HTTP_CODE" == 202 ]]; then
                UPDATED=1
                break
              fi
              if [[ "$HTTP_CODE" != 403 ]]; then
                echo "unexpected versioning update status=$HTTP_CODE"
                exit 1
              fi
              echo "temporary admin propagation attempt $attempt/12"
              sleep 5
            done
            test "$UPDATED" = 1
          fi

          ok=0
          for attempt in $(seq 1 12); do
            timeout 60s yc storage bucket get --name "$BUCKET" --format json > "$RUNNER_TEMP/bucket-after.json"
            if [[ "$(jq -r '.versioning//empty' "$RUNNER_TEMP/bucket-after.json")" == "VERSIONING_ENABLED" ]]; then
              ok=1
              break
            fi
            echo "versioning propagation attempt $attempt/12"
            sleep 5
          done
          test "$ok" = 1
          test "$(jq -r '.anonymous_access_flags.read//false' "$RUNNER_TEMP/bucket-after.json")" != "true"
          test "$(jq -r '.anonymous_access_flags.list//false' "$RUNNER_TEMP/bucket-after.json")" != "true"
          test "$(jq -r '.anonymous_access_flags.config_read//false' "$RUNNER_TEMP/bucket-after.json")" != "true"
          echo "archive_bucket=$BUCKET"
          echo 'ARCHIVE_VERSIONING=PASS'
          echo 'ARCHIVE_PRIVATE_ACCESS=PASS'

      - name: Revoke temporary archive admin and cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ARCHIVE_TEMP_ADMIN_GRANTED:-0}" == 1 ]]; then
            test -n "${ARCHIVE_FOLDER_ID:-}"
            test -n "${ARCHIVE_DEPLOYER_SA:-}"
            timeout 60s yc resource-manager folder remove-access-binding \
              --id "$ARCHIVE_FOLDER_ID" \
              --role storage.admin \
              --service-account-id "$ARCHIVE_DEPLOYER_SA" \
              --no-user-output
            IAM_TOKEN="$(timeout 45s yc iam create-token)"
            test -n "$IAM_TOKEN"
            echo "::add-mask::$IAM_TOKEN"
            timeout 45s curl -fsS \
              -H "Authorization: Bearer ${IAM_TOKEN}" \
              "https://resource-manager.api.cloud.yandex.net/resource-manager/v1/folders/${ARCHIVE_FOLDER_ID}:listAccessBindings?pageSize=1000" \
              > "$RUNNER_TEMP/folder-bindings-after.json"
            REMAINING_ADMIN="$(jq --arg sa "$ARCHIVE_DEPLOYER_SA" '[.accessBindings[]? | select(.roleId=="storage.admin" and .subject.type=="serviceAccount" and .subject.id==$sa)] | length' "$RUNNER_TEMP/folder-bindings-after.json")"
            test "$REMAINING_ADMIN" = 0
            echo 'ARCHIVE_TEMP_ADMIN_REVOKED=PASS'
          fi
          rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/bucket-before.json" "$RUNNER_TEMP/bucket-update.json" "$RUNNER_TEMP/bucket-after.json" "$RUNNER_TEMP/folder-bindings-before.json" "$RUNNER_TEMP/folder-bindings-after.json"
