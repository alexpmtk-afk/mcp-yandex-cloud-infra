name: Deploy Marketplaces MCP TEST

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app/**
      - terraform/**
      - .github/workflows/deploy-mcp-test.yml

permissions:
  contents: read

concurrency:
  group: marketplaces-mcp-test-terraform
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 45
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Prove vendored runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -f app/.source-revision
          grep -Eq 'alexpmtk-afk/marketplaces-mcp-ru@[0-9a-f]{40}' app/.source-revision
          test -z "$(find app -type d -name __pycache__ -print -quit)"
          test -z "$(find app -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit)"
          git diff --check
          echo "source_revision=$(head -1 app/.source-revision)"
          echo 'snapshot_gate=PASS'

      - name: Install Yandex Cloud CLI with bounded resumable retries
        shell: bash
        timeout-minutes: 18
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          ARCHIVE="$RUNNER_TEMP/yc/yc.tgz"
          rm -f "$ARCHIVE"
          ok=0
          for attempt in $(seq 1 15); do
            echo "yc download attempt $attempt/15"
            if timeout 75s wget --continue --timeout=30 --tries=2 --retry-connrefused --output-document="$ARCHIVE" "$URL"; then
              if tar -tzf "$ARCHIVE" >/dev/null 2>&1; then
                ok=1
                break
              fi
              echo 'archive validation failed; restarting download'
              rm -f "$ARCHIVE"
            fi
            sleep 4
          done
          test "$ok" = 1
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/yc/yc" version

      - name: Authenticate CI service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "YC_SERVICE_ACCOUNT_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "TF_VAR_yc_service_account_key_file=$KEY_FILE" >> "$GITHUB_ENV"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Reconcile TEST foundation only
        shell: bash
        env:
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$YC_TFSTATE_ACCESS_KEY"
          test -n "$YC_TFSTATE_SECRET_KEY"
          terraform -chdir=terraform init -reconfigure -input=false \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" \
            -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY"
          terraform -chdir=terraform apply -auto-approve -input=false \
            -target=yandex_resourcemanager_folder.mcp_test \
            -target=yandex_container_registry.mcp \
            -target=yandex_iam_service_account.runtime \
            -target=yandex_iam_service_account.gateway \
            -target=yandex_resourcemanager_folder_iam_member.runtime_registry_pull \
            -target=yandex_resourcemanager_folder_iam_member.runtime_lockbox_viewer \
            -target=yandex_lockbox_secret.marketplace_credentials

      - name: Resolve existing TEST runtime resources
        id: resources
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(timeout 45s yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          VERSION_ID="$(timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json | jq -r '[.[]|select(.status=="ACTIVE")][0].id')"
          CONTAINER_ID="$(timeout 45s yc serverless container list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          RUNTIME_SA="$(timeout 45s yc iam service-account list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-runtime")|.id'|head -1)"
          REGISTRY_ID="$(timeout 45s yc container registry list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp")|.id'|head -1)"
          NETWORK_ID="$(timeout 45s yc vpc network list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-net")|.id'|head -1)"
          CLUSTER_ID="$(timeout 45s yc managed-redis cluster list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-valkey")|.id'|head -1)"
          REDIS_HOST="$(timeout 45s yc managed-redis hosts list --cluster-id "$CLUSTER_ID" --format json | jq -r '[.[]|select((.role//"")=="MASTER")][0].name // .[0].name // empty')"
          DOMAIN="$(timeout 45s yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//.[0].domain//empty')"
          for v in SECRET_ID VERSION_ID CONTAINER_ID RUNTIME_SA REGISTRY_ID NETWORK_ID CLUSTER_ID REDIS_HOST DOMAIN; do
            test -n "${!v}"
          done
          echo "folder=$FOLDER_ID" >> "$GITHUB_OUTPUT"
          echo "secret=$SECRET_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "container=$CONTAINER_ID" >> "$GITHUB_OUTPUT"
          echo "sa=$RUNTIME_SA" >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY_ID" >> "$GITHUB_OUTPUT"
          echo "network=$NETWORK_ID" >> "$GITHUB_OUTPUT"
          echo "redis_host=$REDIS_HOST" >> "$GITHUB_OUTPUT"
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo 'test_resources=RESOLVED'

      - name: Build and push exact MCP image
        id: image
        shell: bash
        env:
          REGISTRY_ID: ${{ steps.resources.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="cr.yandex/${REGISTRY_ID}/marketplaces-mcp:test-${GITHUB_SHA}"
          yc container registry configure-docker
          test -f app/Dockerfile
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$IMAGE" app
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo 'image_publish=PASS'

      - name: Deploy authenticated networked runtime revision
        id: deploy
        shell: bash
        env:
          FOLDER_ID: ${{ steps.resources.outputs.folder }}
          SECRET_ID: ${{ steps.resources.outputs.secret }}
          VERSION_ID: ${{ steps.resources.outputs.version }}
          CONTAINER_ID: ${{ steps.resources.outputs.container }}
          RUNTIME_SA: ${{ steps.resources.outputs.sa }}
          NETWORK_ID: ${{ steps.resources.outputs.network }}
          REDIS_HOST: ${{ steps.resources.outputs.redis_host }}
          DOMAIN: ${{ steps.resources.outputs.domain }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          timeout 180s yc serverless container revision deploy \
            --container-id "$CONTAINER_ID" --folder-id "$FOLDER_ID" \
            --image "$IMAGE" --memory 512MB --cores 1 --execution-timeout 60s --concurrency 8 \
            --service-account-id "$RUNTIME_SA" --network-id "$NETWORK_ID" \
            --environment "MARKETPLACE_REQUIRE_REDIS=1,MARKETPLACE_MCP_REDIS_HOST=$REDIS_HOST,MARKETPLACE_MCP_REDIS_PORT=6380,MARKETPLACE_MCP_REDIS_TLS=1,MARKETPLACE_MCP_REDIS_CA_CERT=/opt/yandex/YandexInternalRootCA.crt,WB_GLOBAL_RPS=5,OZON_GLOBAL_RPS=20,OZON_PERF_GLOBAL_RPS=10" \
            --secret "environment-variable=MARKETPLACE_MCP_CABINETS_JSON,id=$SECRET_ID,version-id=$VERSION_ID,key=cabinets_json" \
            --secret "environment-variable=MARKETPLACE_MCP_BEARER_TOKEN,id=$SECRET_ID,version-id=$VERSION_ID,key=mcp_bearer_token" \
            --secret "environment-variable=MARKETPLACE_MCP_REDIS_PASSWORD,id=$SECRET_ID,version-id=$VERSION_ID,key=redis_password" \
            --format json --no-user-output > "$RUNNER_TEMP/revision.json"
          REVISION_ID="$(jq -r '.id//empty' "$RUNNER_TEMP/revision.json")"
          test -n "$REVISION_ID"
          BASE="https://${DOMAIN}"
          CODE=000
          for attempt in $(seq 1 18); do
            CODE="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/health" -w '%{http_code}' "$BASE/healthz" || true)"
            [[ "$CODE" == 200 ]] && break
            echo "health attempt $attempt/18 status=$CODE"
            sleep 5
          done
          test "$CODE" = 200
          echo "gateway_url=$BASE" >> "$GITHUB_OUTPUT"
          echo "revision_id=$REVISION_ID" >> "$GITHUB_OUTPUT"
          echo "deployed_revision=$REVISION_ID"
          echo 'healthz=PASS'

      - name: Resolve MCP bearer
        shell: bash
        env:
          SECRET_ID: ${{ steps.resources.outputs.secret }}
          VERSION_ID: ${{ steps.resources.outputs.version }}
        run: |
          set -euo pipefail
          timeout 45s yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/sec.json"
          BEARER="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value' "$RUNNER_TEMP/sec.json")"
          test -n "$BEARER"
          echo "::add-mask::$BEARER"
          printf '%s' "$BEARER" > "$RUNNER_TEMP/bearer"
          chmod 600 "$RUNNER_TEMP/bearer"
          echo 'bearer=RESOLVED'

      - name: Remote MCP and live WB/Ozon acceptance
        shell: bash
        timeout-minutes: 8
        env:
          GATEWAY_URL: ${{ steps.deploy.outputs.gateway_url }}
        run: |
          set -euo pipefail
          python -m pip install --quiet 'httpx>=0.27,<1'
          export MCP_URL="${GATEWAY_URL}/mcp"
          export MCP_BEARER="$(cat "$RUNNER_TEMP/bearer")"
          timeout 300s python -u - <<'PY'
          import datetime, itertools, json, os
          import httpx

          timeout = httpx.Timeout(connect=10.0, read=45.0, write=30.0, pool=10.0)

          def unpack(r):
              r.raise_for_status()
              for line in r.text.splitlines():
                  if line.startswith('data:'):
                      return json.loads(line[5:].strip())
              return r.json() if r.text.strip() else None

          headers0 = {
              'Authorization': 'Bearer ' + os.environ['MCP_BEARER'],
              'Accept': 'application/json, text/event-stream',
              'Content-Type': 'application/json',
          }
          ids = itertools.count(1)
          with httpx.Client(timeout=timeout, follow_redirects=True) as c:
              r = c.post(os.environ['MCP_URL'], headers=headers0, json={
                  'jsonrpc':'2.0','id':next(ids),'method':'initialize','params':{
                      'protocolVersion':'2025-06-18','capabilities':{},
                      'clientInfo':{'name':'permanent-deploy-acceptance','version':'2'}
                  }})
              init = unpack(r); assert init and 'result' in init, init
              print('initialize=PASS', flush=True)
              h = dict(headers0)
              sid = r.headers.get('mcp-session-id')
              if sid: h['Mcp-Session-Id'] = sid
              h['MCP-Protocol-Version'] = init['result'].get('protocolVersion','2025-06-18')
              n = c.post(os.environ['MCP_URL'], headers=h, json={'jsonrpc':'2.0','method':'notifications/initialized'})
              assert n.status_code in (200,202), n.status_code

              def rpc(method, params=None):
                  rr = c.post(os.environ['MCP_URL'], headers=h, json={
                      'jsonrpc':'2.0','id':next(ids),'method':method,'params':params or {}})
                  d = unpack(rr)
                  assert d and 'result' in d, (method, d)
                  return d['result']

              def call(name, args):
                  result = rpc('tools/call', {'name':name,'arguments':args})
                  assert not result.get('isError'), (name, result)
                  text = next((x.get('text') for x in result.get('content',[]) if x.get('type')=='text'), None)
                  assert text is not None, name
                  return json.loads(text)

              tools = rpc('tools/list')['tools']
              names = {x['name'] for x in tools}
              need = {'wb_get_sales','ozon_get_products','wb_rate_limit_status','ozon_rate_limit_status'}
              assert need <= names, sorted(need-names)
              print(f'tools_list=PASS count={len(names)}', flush=True)

              wb = call('wb_get_sales', {'date_from':datetime.date.today().isoformat(),'flag':0})
              assert wb.get('ok') is True and 200 <= int(wb.get('status',0)) < 300, wb
              print('WB_LIVE=PASS', flush=True)

              oz = call('ozon_get_products', {'visibility':'ALL','limit':1,'last_id':''})
              assert oz.get('ok') is True and 200 <= int(oz.get('status',0)) < 300, oz
              print('OZON_LIVE=PASS', flush=True)

              wbr = call('wb_rate_limit_status', {})
              ozr = call('ozon_rate_limit_status', {})
              assert wbr.get('backend') == 'redis', wbr
              assert ozr.get('backend') == 'redis', ozr
              print('LIMITER_BACKEND=redis', flush=True)
              print('REMOTE_WB_OZON_ACCEPTANCE=PASS', flush=True)
          PY

      - name: Best-effort Yandex runtime-log evidence
        continue-on-error: true
        shell: bash
        timeout-minutes: 2
        env:
          CONTAINER_ID: ${{ steps.resources.outputs.container }}
        run: |
          set -euo pipefail
          if timeout 45s yc logging read --resource-ids="$CONTAINER_ID" --since '20m ago' --limit 100 --format json > "$RUNNER_TEMP/logs.json"; then
            LOG_COUNT="$(jq 'length' "$RUNNER_TEMP/logs.json")"
            echo "yandex_runtime_logs=$LOG_COUNT"
          else
            echo 'runtime_log_read=TIMEOUT_OR_UNAVAILABLE'
          fi

      - name: Cleanup ephemeral credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/sec.json" "$RUNNER_TEMP/bearer" "$RUNNER_TEMP/logs.json" "$RUNNER_TEMP/revision.json" "$RUNNER_TEMP/health"
