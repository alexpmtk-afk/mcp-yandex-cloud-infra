name: WB Other Cabinets Archive 2026

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/wb-other-cabinets-archive-2026.yml

permissions:
  contents: read

concurrency:
  group: wb-other-cabinets-archive-2026
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill ${{ matrix.label }} 2026
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - seller: wb_dmitrieva
            label: Dmitrieva
          - seller: wb_laser_master
            label: Laser Master
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          curl -fsSL --retry 5 --retry-delay 3 "$URL" -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate and resolve live MCP
        id: live
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create archive-other-wb || true
          yc config set service-account-key "$KEY_FILE"

          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(timeout 45s yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          test -n "$SECRET_ID"
          timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"
          VERSION_ID="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys // [])|index("mcp_bearer_token") != null)]|sort_by(.created_at)|last|.id // empty' "$RUNNER_TEMP/versions.json")"
          test -n "$VERSION_ID"
          DOMAIN="$(timeout 45s yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//.[0].domain//empty')"
          test -n "$DOMAIN"
          timeout 45s yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/bearer-entry.json"
          BEARER="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value' "$RUNNER_TEMP/bearer-entry.json")"
          test -n "$BEARER"
          echo "::add-mask::$BEARER"
          printf '%s' "$BEARER" > "$RUNNER_TEMP/bearer"
          chmod 600 "$RUNNER_TEMP/bearer"
          echo "url=https://${DOMAIN}/mcp" >> "$GITHUB_OUTPUT"
          echo 'LIVE_MCP_RESOLVED=PASS'

      - name: Backfill ${{ matrix.label }} 2026 through durable queue
        shell: bash
        timeout-minutes: 170
        env:
          MCP_URL: ${{ steps.live.outputs.url }}
          SELLER: ${{ matrix.seller }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          python -m pip install --quiet 'httpx>=0.27,<1'
          export MCP_BEARER="$(cat "$RUNNER_TEMP/bearer")"
          python -u - <<'PY'
          import itertools
          import json
          import os
          import time
          import httpx

          YEAR = 2026
          SELLER = os.environ['SELLER']
          LABEL = os.environ['LABEL']
          MAX_STEPS = 500

          def unpack(response):
              response.raise_for_status()
              for line in response.text.splitlines():
                  if line.startswith('data:'):
                      return json.loads(line[5:].strip())
              return response.json() if response.text.strip() else None

          def tool(name, arguments):
              timeout = httpx.Timeout(connect=15.0, read=75.0, write=30.0, pool=15.0)
              headers0 = {
                  'Authorization': 'Bearer ' + os.environ['MCP_BEARER'],
                  'Accept': 'application/json, text/event-stream',
                  'Content-Type': 'application/json',
              }
              ids = itertools.count(1)
              with httpx.Client(timeout=timeout, follow_redirects=True) as client:
                  response = client.post(os.environ['MCP_URL'], headers=headers0, json={
                      'jsonrpc':'2.0','id':next(ids),'method':'initialize','params':{
                          'protocolVersion':'2025-06-18','capabilities':{},
                          'clientInfo':{'name':'wb-other-cabinets-archive-2026','version':'1'}
                      }
                  })
                  init = unpack(response)
                  assert init and 'result' in init, init
                  headers = dict(headers0)
                  sid = response.headers.get('mcp-session-id')
                  if sid:
                      headers['Mcp-Session-Id'] = sid
                  headers['MCP-Protocol-Version'] = init['result'].get('protocolVersion','2025-06-18')
                  ready = client.post(os.environ['MCP_URL'], headers=headers, json={'jsonrpc':'2.0','method':'notifications/initialized'})
                  assert ready.status_code in (200,202), ready.status_code
                  response = client.post(os.environ['MCP_URL'], headers=headers, json={
                      'jsonrpc':'2.0','id':next(ids),'method':'tools/call',
                      'params':{'name':name,'arguments':arguments}
                  })
                  data = unpack(response)
                  assert data and 'result' in data, (name, data)
                  result = data['result']
                  if result.get('isError'):
                      raise RuntimeError(f'{name} failed: {result}')
                  text = next((x.get('text') for x in result.get('content',[]) if x.get('type')=='text'), None)
                  if text is None:
                      raise RuntimeError(f'{name} returned no text')
                  return json.loads(text)

          before = tool('marketplace_archive_status', {'year': YEAR})
          assert before.get('ok') is True, before
          print('SELLER=' + SELLER, flush=True)
          print('STATUS_BEFORE=' + json.dumps(before.get('cabinets',{}).get(SELLER,{}), ensure_ascii=False), flush=True)

          queued = tool('marketplace_archive_update', {'year': YEAR, 'seller': SELLER})
          assert queued.get('ok') is True and queued.get('queued') is True, queued
          jobs = queued.get('jobs') or []
          assert len(jobs) == 1 and jobs[0].get('job_id'), queued
          job_id = jobs[0]['job_id']
          print('JOB_ID=' + job_id, flush=True)

          complete = False
          for step_no in range(1, MAX_STEPS + 1):
              status = tool('marketplace_archive_job_status', {'job_id': job_id})
              assert status.get('ok') is True, status
              if status.get('status') == 'COMPLETE':
                  complete = True
                  break
              if status.get('status') == 'FAILED':
                  raise RuntimeError('archive job failed: ' + json.dumps(status, ensure_ascii=False))
              result = tool('marketplace_archive_worker_step', {'job_id': job_id})
              assert result.get('ok') is True, result
              print('STEP=' + str(step_no)
                    + ' status=' + str(result.get('status'))
                    + ' phase=' + str(result.get('phase'))
                    + ' action=' + str(result.get('action'))
                    + ' provider_calls=' + str(result.get('provider_calls','')), flush=True)
              if result.get('status') == 'COMPLETE':
                  complete = True
                  break
              delay = float(result.get('retry_after_seconds') or 0)
              if delay > 0:
                  print('QUEUE_WAIT_SECONDS=' + str(delay), flush=True)
                  time.sleep(delay + 1.0)
              else:
                  time.sleep(1.0)

          if not complete:
              raise RuntimeError(f'{LABEL} 2026 durable archive job did not reach COMPLETE')

          final_job = tool('marketplace_archive_job_status', {'job_id': job_id})
          assert final_job.get('status') == 'COMPLETE', final_job
          print('JOB_FINAL=' + json.dumps(final_job, ensure_ascii=False), flush=True)

          again = tool('marketplace_archive_update', {'year': YEAR, 'seller': SELLER})
          assert again.get('ok') is True and (again.get('jobs') or [{}])[0].get('status') == 'COMPLETE', again
          noop = tool('marketplace_archive_worker_step', {'job_id': job_id})
          assert noop.get('ok') is True and noop.get('status') == 'COMPLETE', noop
          print('IDEMPOTENCY=PASS', flush=True)

          sql = f'SELECT MIN(dateFrom) AS min_date_from, MAX(dateTo) AS max_date_to, COUNT(DISTINCT reportId) AS reports, COUNT(*) AS rows FROM {SELLER}'
          query = tool('marketplace_archive_query', {'year': YEAR, 'sql': sql})
          assert query.get('ok') is True, query
          print('BOUNDARY_AND_COUNTS=' + json.dumps(query.get('rows') or [], ensure_ascii=False), flush=True)

          final = tool('marketplace_archive_status', {'year': YEAR})
          assert final.get('ok') is True, final
          print('STATUS_FINAL=' + json.dumps(final.get('cabinets',{}).get(SELLER,{}), ensure_ascii=False), flush=True)
          print('WB_' + SELLER.upper() + '_ARCHIVE_2026=PASS', flush=True)
          PY

      - name: Cleanup ephemeral credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/bearer-entry.json" "$RUNNER_TEMP/bearer"
