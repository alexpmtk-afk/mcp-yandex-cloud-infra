name: Telegram Media Diagnostic

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-media-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-media-diagnostic || true
          yc config profile activate telegram-media-diagnostic
          yc config set service-account-key "$key"

      - name: Inspect media state
        shell: bash
        run: |
          set -euo pipefail
          folder="b1gk4p83brasi8g811jv"
          ip="$(curl -fsS https://api.ipify.org)"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/tgkey"
          old_keys="$(yc compute instance get telegram-news-reader --folder-id "$folder" --format json | jq -r '.metadata["ssh-keys"] // ""')"
          printf '%s' "$old_keys" > "$RUNNER_TEMP/oldkeys"
          { printf '%s\n' "$old_keys"; printf 'ubuntu:'; cat "$RUNNER_TEMP/tgkey.pub"; } > "$RUNNER_TEMP/newkeys"
          yc compute instance add-metadata telegram-news-reader --folder-id "$folder" --metadata-from-file ssh-keys="$RUNNER_TEMP/newkeys"
          yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id "$folder" --add-rule "description=github-telegram-media-diagnostic,direction=ingress,port=22,protocol=tcp,v4-cidrs=$ip/32"
          sleep 20

          ssh -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o ConnectTimeout=20 -i "$RUNNER_TEMP/tgkey" ubuntu@111.88.248.156 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== HEALTH ==="
          curl -fsS http://127.0.0.1:8080/health | jq '{status,telegram_status,telegram_connected,telegram_authorized,allowed_chats,messages,media_storage}'
          echo "=== MEDIA FILES ==="
          echo -n "manifests="; sudo find /state/media -type f -name '*.json' 2>/dev/null | wc -l
          echo -n "binary_files="; sudo find /state/media -type f ! -name '*.json' 2>/dev/null | wc -l
          echo -n "uploaded_manifests="; sudo grep -rl '"object_key": "' /state/media --include='*.json' 2>/dev/null | wc -l
          echo "=== RECENT ERRORS ==="
          sudo docker logs --tail 300 telegram-reader 2>&1 | grep -E 'collector_error|media_fetch_error|telegram_connect_error' | tail -30 || true
          echo "=== SAMPLE MANIFEST STATUS ==="
          sudo python3 - <<'PY'
          from pathlib import Path
          import json
          rows=[]
          for p in Path('/state/media').rglob('*.json'):
              try:
                  d=json.loads(p.read_text())
              except Exception:
                  continue
              rows.append({
                  'chat_id': d.get('chat_id'),
                  'message_id': d.get('message_id'),
                  'media_type': d.get('media_type'),
                  'size': d.get('size'),
                  'has_object_key': bool(d.get('object_key')),
                  'has_media_url': bool(d.get('media_url')),
              })
          print(json.dumps(rows[-10:], ensure_ascii=False))
          PY
          echo "MEDIA_DIAGNOSTIC_PASS"
          REMOTE

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          yc config profile activate telegram-media-diagnostic >/dev/null 2>&1 || true
          folder="b1gk4p83brasi8g811jv"
          ids=$(yc vpc security-group get enpocnvnpdu2goj9nkjn --folder-id "$folder" --format json | jq -r '.rules[] | select(.description=="github-telegram-media-diagnostic") | .id')
          for id in $ids; do yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id "$folder" --delete-rule-id "$id"; done
          if [ -f "$RUNNER_TEMP/oldkeys" ]; then yc compute instance add-metadata telegram-news-reader --folder-id "$folder" --metadata-from-file ssh-keys="$RUNNER_TEMP/oldkeys"; fi
          rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/tgkey" "$RUNNER_TEMP/tgkey.pub" "$RUNNER_TEMP/oldkeys" "$RUNNER_TEMP/newkeys"
