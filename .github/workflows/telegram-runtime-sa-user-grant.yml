name: Telegram Runtime SA User Grant
on:
  push:
    paths:
      - '.github/workflows/telegram-runtime-sa-user-grant.yml'
permissions:
  contents: read
jobs:
  grant:
    runs-on: ubuntu-latest
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Authenticate
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create tg-runtime-sa-user-grant || true
          yc config profile activate tg-runtime-sa-user-grant
          yc config set service-account-key "$key"
          yc config set folder-id b1gk4p83brasi8g811jv
      - name: Grant deployer permission to use runtime service account
        shell: bash
        run: |
          set -euo pipefail
          yc iam service-account add-access-binding ajeaad0m00gncv22tagf \
            --role iam.serviceAccounts.user \
            --service-account-id ajecdjjrkdo1t3itpl9k
          echo IAM_SERVICE_ACCOUNTS_USER_GRANT_PASS
      - name: Cleanup local key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json"
