name: M24 Worker Zero Drift

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m24-worker-zero-drift.yml"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    env:
      TF_DIR: terraform/birzha_test
      DEPLOYER_SERVICE_ACCOUNT_ID: ajecdjjrkdo1t3itpl9k
      OIDC_AUDIENCE: https://github.com/alexpmtk-afk
      EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/mcp-yandex-cloud-infra@1349853397:environment:test
      M24_WORKER_SOURCE_SHA: 1b7564bdeab31484efba61da270d519998c97cd2
      M24_WORKER_IMAGE: cr.yandex/crpk5qvf4p7kcqil2u3v/birzha-mcp-forecast@sha256:9b70ca5f94c651da55834b478a2508ef9f16d6404d279b295bf5a9fd31ad2975
      MCP_IMAGE: cr.yandex/crpk5qvf4p7kcqil2u3v/birzha-mcp-forecast@sha256:5db7e3b1bbd69ee0c797d1d9a5a9289633914ef9f360f3d0f45187cb219113fc
      MCP_SOURCE_SHA: b6ce037915ee993f2758f2ff6b29341f15554308
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Mint Yandex token through GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          A="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          S='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && S='&'
          R="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${S}audience=${A}")"
          J="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$R")"
          echo "::add-mask::$J"
          python - "$J" <<'PY'
          import base64,json,os,sys
          p=sys.argv[1].split('.')[1]; p += '='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          assert c.get('sub')==os.environ['EXPECTED_OIDC_SUBJECT']
          assert c.get('aud')==os.environ['OIDC_AUDIENCE']
          assert c.get('environment')=='test'
          print('OIDC_CLAIMS=PASS')
          PY
          X="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${DEPLOYER_SERVICE_ACCOUNT_ID}" --data-urlencode "subject_token=${J}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          T="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$X")"
          test -n "$T"
          echo "::add-mask::$T"
          printf '%s' "$T" > "$RUNNER_TEMP/iam-token"
          echo 'OIDC_EXCHANGE=PASS'

      - name: Initialize protected remote state
        shell: bash
        env:
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" init -reconfigure -input=false -lockfile=readonly \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" \
            -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY" >/dev/null

      - name: Verify immutable live coordinates
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" show -json > "$RUNNER_TEMP/state.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'state.json').read_text())
          rr=(s.get('values',{}).get('root_module',{}).get('resources') or [])
          r={x.get('address'):x.get('values',{}) for x in rr}
          m=(r['yandex_serverless_container.mcp[0]'].get('image') or [])[0]
          assert m.get('url')==os.environ['MCP_IMAGE']
          assert (m.get('environment') or {}).get('BIRZHA_SOURCE_COMMIT')==os.environ['MCP_SOURCE_SHA']
          print('PUBLIC_MCP_UNCHANGED=PASS')
          w=r['yandex_serverless_container.orchestrator_worker[0]']
          wi=(w.get('image') or [])[0]; e=wi.get('environment') or {}
          assert wi.get('url')==os.environ['M24_WORKER_IMAGE']
          assert e.get('BIRZHA_SOURCE_COMMIT')==os.environ['M24_WORKER_SOURCE_SHA']
          assert e.get('BIRZHA_ORCHESTRATOR_WORKER')=='true'
          assert e.get('BIRZHA_STATE_BACKEND')=='ydb'
          assert e.get('YDB_CONNECTION_STRING','').startswith('grpcs://')
          assert (wi.get('command') or [])==['python','-m','birzha.worker']
          assert w.get('memory')==512 and w.get('concurrency')==1
          t=r['yandex_function_trigger.orchestrator_timer[0]']
          tm=(t.get('timer') or [])[0]
          assert tm.get('cron_expression')=='* * ? * * *'
          assert tm.get('payload')=='m24-orchestration-tick'
          print('M24_WORKER_CONTAINER_ID='+str(w.get('id')))
          print('M24_TIMER_TRIGGER_ID='+str(t.get('id')))
          print('M24_WORKER_TIMER_COORDINATES=PASS')
          PY

      - name: Prove Terraform zero drift
        shell: bash
        run: |
          set -euo pipefail
          export TF_VAR_yc_token="$(cat "$RUNNER_TEMP/iam-token")"
          set +e
          terraform -chdir="$TF_DIR" plan -detailed-exitcode -input=false -no-color \
            -var="mcp_image_url=${MCP_IMAGE}" \
            -var="source_commit_sha=${MCP_SOURCE_SHA}" \
            -var="mcp_allowed_hosts=d5d6sgh96p1fs4mnlfsr.0ly8ed4d.apigw.yandexcloud.net,d5d6sgh96p1fs4mnlfsr.0ly8ed4d.apigw.yandexcloud.net:*" \
            -var="mcp_allowed_origins=https://chatgpt.com" \
            -var="m24_worker_image_url=${M24_WORKER_IMAGE}" \
            -var="m24_worker_source_sha=${M24_WORKER_SOURCE_SHA}" \
            -var="m24_infra_oidc_bootstrap_enabled=false" > "$RUNNER_TEMP/plan.txt"
          rc=$?
          set -e
          test "$rc" = 0 || { cat "$RUNNER_TEMP/plan.txt"; exit "$rc"; }
          echo 'M24_WORKER_ZERO_DRIFT=PASS'

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/iam-token" "$RUNNER_TEMP/state.json" "$RUNNER_TEMP/plan.txt"
