name: Telegram Bucket Stats
on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-bucket-stats.yml]
permissions:
  contents: read
jobs:
  stats:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 5
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Read bucket stats
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"
          chmod 600 "$RUNNER_TEMP/key.json"
          yc config profile create tg-bucket || true
          yc config profile activate tg-bucket
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          token=$(yc iam create-token)
          curl -fsS -H "Authorization: Bearer $token" \
            "https://storage.api.cloud.yandex.net/storage/v1/buckets/telegram-reader-media-alexpmtk-20260910:getStats" \
            | jq '{name,usedSize,storageClassUsedSizes,storageClassCounters}'
