name: BIRZHA M23 BR capacity plan live once

on:
  push:
    branches: [birzha-m23-br-capacity-plan-20260914]
    paths:
      - ".github/workflows/birzha-m23-br-capacity-plan-live-once.yml"

permissions:
  contents: read

env:
  APP_SHA: 926d9060eac6b8efb77924c77aa4cfee41bc26d3
  YDB_CONNECTION_STRING: grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1gi4pr9msenirafh2c7/etnes7omhgut11oulsd5

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Checkout infrastructure source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: infra
          persist-credentials: false

      - name: Checkout exact Birzha source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: alexpmtk-afk/birzha-mcp-forecast
          ref: ${{ env.APP_SHA }}
          path: app
          fetch-depth: 1
          persist-credentials: false

      - name: Mint ephemeral Yandex IAM token
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/yc-key.json"
          chmod 600 "$RUNNER_TEMP/yc-key.json"
          python -m pip install --disable-pip-version-check 'PyJWT==2.10.0' cryptography
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          import jwt
          key=json.loads((Path(os.environ['RUNNER_TEMP'])/'yc-key.json').read_text())
          now=int(time.time())
          signed=jwt.encode({'aud':'https://iam.api.cloud.yandex.net/iam/v1/tokens','iss':key['service_account_id'],'iat':now,'exp':now+3600}, key['private_key'], algorithm='PS256', headers={'kid':key['id']})
          req=urllib.request.Request('https://iam.api.cloud.yandex.net/iam/v1/tokens', data=json.dumps({'jwt':signed}).encode(), headers={'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(req, timeout=30) as response:
              token=json.loads(response.read())['iamToken']
          assert token and len(token)>100
          print(f'::add-mask::{token}')
          p=Path(os.environ['RUNNER_TEMP'])/'yandex-iam-token'
          p.write_text(token); p.chmod(0o600)
          print('YANDEX_IAM_TOKEN=PASS')
          PY

      - name: Install exact application source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = "$APP_SHA"
          python -m pip install --disable-pip-version-check -e ./app

      - name: Read-only BR capacity plan
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/app/src"
          python - <<'PY'
          import json, os
          from pathlib import Path
          import ydb
          from birzha.application.historical_data import HistoricalDataService
          from birzha.application.market_data import MarketDataService
          from birzha.application.validation_capacity_plan import plan_contiguous_equal_windows
          from birzha.storage.ydb_runtime_storage import YdbRuntimeHistoricalCandleStore

          token=(Path(os.environ['RUNNER_TEMP'])/'yandex-iam-token').read_text().strip()
          driver=ydb.Driver(connection_string=os.environ['YDB_CONNECTION_STRING'], credentials=ydb.AccessTokenCredentials(token))
          driver.wait(timeout=20, fail_fast=True)
          pool=ydb.QuerySessionPool(driver)
          try:
              history=HistoricalDataService(
                  market_data=MarketDataService.default(),
                  store=YdbRuntimeHistoricalCandleStore(pool),
              )
              checks={}
              for start in ('2013-01-01','2012-01-01','2011-01-01','2010-01-01','2009-01-01'):
                  checks[start]=history.is_range_verified('BR', timeframe='D1', from_date=start, till_date='2024-12-31')

              plan_2013=None
              if checks['2013-01-01']:
                  plan_2013=plan_contiguous_equal_windows(
                      history, 'BR', available_from='2013-01-01', holdout_end='2024-12-31',
                      minimum_observations=20, minimum_window_years=2, maximum_window_years=6,
                      step_sessions=5, max_points=400,
                  ).to_dict()

              plan_2011=None
              if checks['2011-01-01']:
                  plan_2011=plan_contiguous_equal_windows(
                      history, 'BR', available_from='2011-01-01', holdout_end='2024-12-31',
                      minimum_observations=20, minimum_window_years=7, maximum_window_years=7,
                      step_sessions=5, max_points=400,
                  ).to_dict()

              payload={
                  'schema':'BIRZHA_M23_BR_CAPACITY_PLAN_LIVE_V1',
                  'mode':'CAPACITY_ONLY_READ_ONLY',
                  'app_sha':os.environ['APP_SHA'],
                  'verified_through_2024':checks,
                  'current_stored_plan':plan_2013,
                  'next_7y_plan_if_already_stored':plan_2011,
                  'next_backfill_candidate':None if checks['2011-01-01'] else {'from_date':'2011-01-01','till_date':'2012-12-31','reason':'shortest next equal-window candidate is 7y+7y ending 2024-12-31'},
                  'model_status':'NOT_EVALUATED',
                  'holdout_evaluated':False,
                  'holdout_sealed':True,
              }
              out=Path(os.environ['RUNNER_TEMP'])/'br-capacity-plan.json'
              out.write_text(json.dumps(payload,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
              print('BR_CAPACITY_PLAN='+json.dumps(payload,ensure_ascii=False,sort_keys=True), flush=True)
          finally:
              pool.stop(); driver.stop()
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: birzha-m23-br-capacity-plan-live
          path: ${{ runner.temp }}/br-capacity-plan.json
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/yandex-iam-token"
          echo 'EPHEMERAL_CREDENTIAL_CLEANUP=PASS'
