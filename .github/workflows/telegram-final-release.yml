name: Telegram Reader Final Release

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-final-release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-reader-final-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Authenticate and resolve image
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-final-release || true
          yc config profile activate telegram-final-release
          yc config set service-account-key "$key"
          registry="$(yc container registry get --name telegram-news-reader --folder-id b1gk4p83brasi8g811jv --format json | jq -r .id)"
          echo "IMAGE=cr.yandex/$registry/telegram-news-reader:a645233371f7f3c65f2c06ad67ad0f6d88739710" >> "$GITHUB_ENV"
      - name: Open temporary SSH
        shell: bash
        run: |
          set -euo pipefail
          folder='b1gk4p83brasi8g811jv'
          ip="$(curl -fsS https://api.ipify.org)"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/tgkey"
          old_keys="$(yc compute instance get telegram-news-reader --folder-id "$folder" --format json | jq -r '.metadata["ssh-keys"] // ""')"
          printf '%s' "$old_keys" > "$RUNNER_TEMP/oldkeys"
          { printf '%s\n' "$old_keys"; printf 'ubuntu:'; cat "$RUNNER_TEMP/tgkey.pub"; } > "$RUNNER_TEMP/newkeys"
          yc compute instance add-metadata telegram-news-reader --folder-id "$folder" --metadata-from-file ssh-keys="$RUNNER_TEMP/newkeys"
          yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id "$folder" --add-rule "description=github-telegram-final-release,direction=ingress,port=22,protocol=tcp,v4-cidrs=$ip/32"
          sleep 20
      - name: Deploy immutable image without losing state
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i "$RUNNER_TEMP/tgkey" ubuntu@111.88.248.156 "IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          echo CHECK_STATE
          test -f /opt/telegram-reader/runtime.env
          test -f /state/telegram_news.session
          test -f /state/allowed_chats.yaml
          sudo mkdir -p /state/media /state/exports
          sudo chown -R 10001:10001 /state/media /state/exports
          echo STATE_PASS

          echo PULL_IMAGE
          sudo docker pull "$IMAGE"
          echo PULL_PASS

          sudo systemctl stop telegram-reader-launcher.service || true
          sudo tee /usr/local/sbin/telegram-reader-launcher >/dev/null <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          IMAGE='$IMAGE'
          while true; do
            if [ ! -f /state/setup.complete ] || [ ! -f /state/telegram_news.session ] || [ ! -f /state/allowed_chats.yaml ] || [ ! -f /opt/telegram-reader/runtime.env ]; then sleep 5; continue; fi
            mkdir -p /state/media /state/exports
            chown -R 10001:10001 /state/media /state/exports
            docker rm -f telegram-reader >/dev/null 2>&1 || true
            docker run -d --name telegram-reader --restart unless-stopped -p 127.0.0.1:8080:8080 --env-file /opt/telegram-reader/runtime.env -v /state:/state "\$IMAGE"
            exit 0
          done
          EOF
          sudo chmod 0750 /usr/local/sbin/telegram-reader-launcher
          sudo systemctl daemon-reload
          sudo systemctl restart telegram-reader-launcher.service
          echo RESTARTED

          for attempt in $(seq 1 60); do
            body="$(curl -fsS http://127.0.0.1:8080/health 2>/dev/null || true)"
            if printf '%s' "$body" | jq -e '.status=="ok" and .telegram_connected==true and .telegram_authorized==true and .allowed_chats>=1' >/dev/null 2>&1; then
              echo RUNTIME_HEALTH_PASS
              printf '%s' "$body" | jq '{status,telegram_connected,telegram_authorized,allowed_chats,messages,media_storage}'
              break
            fi
            [ "$attempt" -eq 60 ] && { echo RUNTIME_HEALTH_FAIL >&2; exit 1; }
            sleep 5
          done

          sudo docker exec telegram-reader ffmpeg -version | head -1
          sudo docker exec telegram-reader python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from app.media_pipeline import MediaPipeline
          p=Path('/tmp/media-final-test'); p.mkdir(exist_ok=True)
          a=Image.new('RGB',(80,60),(255,255,255)); b=Image.new('RGB',(80,60),(0,0,0))
          gif=p/'sample.gif'; a.save(gif,save_all=True,append_images=[b],duration=100,loop=0)
          preview=MediaPipeline._build_preview(gif,'gif')
          assert preview and preview.exists() and preview.stat().st_size>0
          print('GIF_PREVIEW_PASS')
          PY
          sudo docker exec telegram-reader sh -lc "ffmpeg -loglevel error -y -f lavfi -i color=c=black:s=96x64:d=1 -pix_fmt yuv420p /tmp/sample.mp4 && python - <<'PY'
          from pathlib import Path
          from app.media_pipeline import MediaPipeline
          preview=MediaPipeline._build_preview(Path('/tmp/sample.mp4'),'animation')
          assert preview and preview.exists() and preview.stat().st_size>0
          print('ANIMATION_PREVIEW_PASS')
          PY"

          sleep 75
          if sudo docker logs --since 2m telegram-reader 2>&1 | grep -q 'PermissionError'; then
            echo PERMISSION_ERROR_FOUND >&2
            exit 1
          fi
          sudo docker exec telegram-reader python -m app.export_cli >/dev/null
          sudo docker exec telegram-reader python - <<'PY'
          import json
          d=json.load(open('/state/exports/TELEGRAM_NEWS_LATEST.json',encoding='utf-8'))
          assert d['schema']=='TELEGRAM_NEWS_READER_V1'
          assert d['window_hours']==192
          assert d['allowed_chats']>=1 and d['message_count']>=1
          assert 'media_message_count' in d and 'preview_message_count' in d
          print('EXPORT_FINAL_PASS', d['allowed_chats'], d['message_count'], d['media_message_count'], d['preview_message_count'])
          PY
          echo FINAL_RUNTIME_PASS
          REMOTE
      - name: Publish fresh final snapshot to GitHub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p telegram-news-reader/export
          ssh -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i "$RUNNER_TEMP/tgkey" ubuntu@111.88.248.156 'sudo cat /state/exports/TELEGRAM_NEWS_LATEST.json' > telegram-news-reader/export/TELEGRAM_NEWS_LATEST.json
          jq -e '.schema=="TELEGRAM_NEWS_READER_V1" and .window_hours==192 and .message_count>=1' telegram-news-reader/export/TELEGRAM_NEWS_LATEST.json >/dev/null
          git config user.name telegram-final-release
          git config user.email telegram-final-release@users.noreply.github.com
          git add telegram-news-reader/export/TELEGRAM_NEWS_LATEST.json
          if ! git diff --cached --quiet; then
            git commit -m 'telegram-news: publish final weekly-capable snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          yc config profile activate telegram-final-release >/dev/null 2>&1 || true
          folder='b1gk4p83brasi8g811jv'
          ids=$(yc vpc security-group get enpocnvnpdu2goj9nkjn --folder-id "$folder" --format json | jq -r '.rules[] | select(.description=="github-telegram-final-release") | .id')
          for id in $ids; do yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id "$folder" --delete-rule-id "$id"; done
          if [ -f "$RUNNER_TEMP/oldkeys" ]; then yc compute instance add-metadata telegram-news-reader --folder-id "$folder" --metadata-from-file ssh-keys="$RUNNER_TEMP/oldkeys"; fi
          rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/tgkey" "$RUNNER_TEMP/tgkey.pub" "$RUNNER_TEMP/oldkeys" "$RUNNER_TEMP/newkeys"
