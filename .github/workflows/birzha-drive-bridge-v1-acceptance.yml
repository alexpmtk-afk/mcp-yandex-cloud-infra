name: Accept Birzha Google Drive Bridge v1

on:
  workflow_dispatch:
    inputs:
      bridge_url:
        description: Birzha Apps Script Bridge v1 /exec URL
        required: true
        type: string
      foreign_file_id:
        description: File ID outside Birzha root for isolation test
        required: false
        default: 1UVKUcFfDhCDk6nMHX1mWg9cRL05DT-OJ
        type: string

permissions:
  contents: read

env:
  PROJECT_ID: birzha
  EXPECTED_ROOT_ID: 1A7IzjXYSCWReZXdtrPZgZgLTnFIifsT2
  EXPECTED_BRIDGE_RELEASE: 1.0.0-alpha.2
  LOCKBOX_NAME: birzha-mcp-forecast-test-auth
  LOCKBOX_KEY: gdrive_bridge_v1_secret

concurrency:
  group: birzha-drive-bridge-v1-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: python -m pip install 'httpx>=0.27,<1'

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          ARCHIVE="$RUNNER_TEMP/yc.tgz"
          curl --fail --silent --show-error --retry 5 --retry-all-errors -o "$ARCHIVE" 'https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate Yandex CI service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create bridge-v1-birzha-acceptance || true
          yc config set service-account-key "$KEY_FILE"

      - name: Resolve Birzha project Bridge v1 credential
        shell: bash
        run: |
          set -euo pipefail
          FOLDER_ID="$(yc resource-manager folder list --cloud-id b1gi4pr9msenirafh2c7 --format json | jq -r '.[]|select(.name=="birzha-mcp-forecast-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r --arg n "$LOCKBOX_NAME" '.[]|select(.name==$n)|.id'|head -1)"
          test -n "$SECRET_ID"
          yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"
          VERSION_ID="$(jq -r --arg k "$LOCKBOX_KEY" '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys // [])|index($k) != null)]|sort_by(.created_at)|last|.id // empty' "$RUNNER_TEMP/versions.json")"
          test -n "$VERSION_ID"
          yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --key "$LOCKBOX_KEY" --format json --no-user-output > "$RUNNER_TEMP/payload.json"
          BRIDGE_SECRET="$(jq -r --arg k "$LOCKBOX_KEY" '.entries[]|select(.key==$k)|.text_value // empty' "$RUNNER_TEMP/payload.json")"
          test -n "$BRIDGE_SECRET"
          echo "::add-mask::$BRIDGE_SECRET"
          printf '%s' "$BRIDGE_SECRET" > "$RUNNER_TEMP/bridge-secret"
          chmod 600 "$RUNNER_TEMP/bridge-secret"
          echo "BIRZHA_BRIDGE_V1_SECRET_VERSION_ID=$VERSION_ID"
          echo 'BIRZHA_PROJECT_BRIDGE_V1_CREDENTIAL=RESOLVED'

      - name: Deep health and fixed-root security
        shell: bash
        env:
          GDRIVE_BRIDGE_URL: ${{ inputs.bridge_url }}
          GDRIVE_BRIDGE_FOREIGN_FILE_ID: ${{ inputs.foreign_file_id }}
        run: |
          set -euo pipefail
          export GDRIVE_BRIDGE_SECRET="$(cat "$RUNNER_TEMP/bridge-secret")"
          export GDRIVE_BRIDGE_PROJECT_ID=birzha
          export GDRIVE_BRIDGE_EXPECTED_ROOT_ID="$EXPECTED_ROOT_ID"
          python - <<'PY'
          import asyncio, os, sys
          from pathlib import Path
          sys.path.insert(0,str(Path('shared/google-drive-bridge/python_client')))
          from bridge_client import BridgeConfig, BridgeError, GoogleDriveBridgeClient
          async def main():
              c=GoogleDriveBridgeClient(BridgeConfig(url=os.environ['GDRIVE_BRIDGE_URL'],secret=os.environ['GDRIVE_BRIDGE_SECRET'],project_id='birzha'))
              h=await c.health()
              assert h.get('bridge_release') == '1.0.0-alpha.2', h
              assert h.get('root_id') == os.environ['GDRIVE_BRIDGE_EXPECTED_ROOT_ID'], h
              caps=h.get('capabilities') or {}
              assert caps.get('google_sheets_chunked') is True, h
              assert caps.get('fixed_root_file_id_guard') is True, h
              wrong=GoogleDriveBridgeClient(BridgeConfig(url=os.environ['GDRIVE_BRIDGE_URL'],secret=os.environ['GDRIVE_BRIDGE_SECRET'],project_id='marketplaces'))
              try:
                  await wrong.health()
              except BridgeError as e:
                  assert e.code == 'PROJECT_MISMATCH', e
              else:
                  raise AssertionError('wrong project_id was accepted')
              foreign=os.environ.get('GDRIVE_BRIDGE_FOREIGN_FILE_ID','').strip()
              if foreign:
                  try:
                      await c.metadata_by_id(foreign)
                  except BridgeError as e:
                      assert e.code == 'OUTSIDE_ROOT', e
                  else:
                      raise AssertionError('foreign-root object was accepted')
              print('BIRZHA_DEEP_HEALTH_SECURITY=PASS')
          asyncio.run(main())
          PY

      - name: Google Sheets staged/chunked acceptance
        shell: bash
        env:
          GDRIVE_BRIDGE_URL: ${{ inputs.bridge_url }}
        run: |
          set -euo pipefail
          export GDRIVE_BRIDGE_SECRET="$(cat "$RUNNER_TEMP/bridge-secret")"
          export GDRIVE_BRIDGE_PROJECT_ID=birzha
          export GDRIVE_BRIDGE_EXPECTED_ROOT_ID="$EXPECTED_ROOT_ID"
          python shared/google-drive-bridge/scripts/sheets_acceptance.py
          echo 'BIRZHA_SHEETS_STAGE_VERIFY_COMMIT_ABORT=PASS'

      - name: Confirm production remains untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'market_mirror' terraform/birzha_test/m25_market_mirror.tf
          echo 'BIRZHA_PRODUCTION_CUTOVER_PERFORMED=NO'

      - name: Cleanup credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/payload.json" "$RUNNER_TEMP/bridge-secret"
