name: PowerShell Bridge v2

on:
  push:
    branches:
      - tooling/powershell-bridge-v2
    paths:
      - 'tools/powershell-bridge/command.ps1'
      - 'tools/powershell-bridge/guard.ps1'
      - '.github/workflows/powershell-bridge.yml'

permissions:
  contents: read

concurrency:
  group: powershell-bridge-v2
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      startsWith(github.event.head_commit.message, 'bridge-safe-home:') ||
      startsWith(github.event.head_commit.message, 'bridge-safe-work:') ||
      startsWith(github.event.head_commit.message, 'bridge-write-home:') ||
      startsWith(github.event.head_commit.message, 'bridge-write-work:') ||
      startsWith(github.event.head_commit.message, 'bridge-danger-home:') ||
      startsWith(github.event.head_commit.message, 'bridge-danger-work:')
    runs-on:
      - self-hosted
      - Windows
      - X64
      - "${{ (startsWith(github.event.head_commit.message, 'bridge-safe-work:') || startsWith(github.event.head_commit.message, 'bridge-write-work:') || startsWith(github.event.head_commit.message, 'bridge-danger-work:')) && 'codex-bridge-work' || 'codex-bridge-service' }}"
    timeout-minutes: 10

    steps:
      - name: Fetch, guard and execute PowerShell command
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"'
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '=== POWERSHELL_BRIDGE_V2_BEGIN ==='
          Write-Host "Commit=$env:GITHUB_SHA"
          Write-Host "Runner=$env:RUNNER_NAME"
          Write-Host "Computer=$env:COMPUTERNAME"

          $msg = $env:BRIDGE_COMMIT_MESSAGE
          if ($msg -match '^bridge-safe-') { $mode = 'safe' }
          elseif ($msg -match '^bridge-write-') { $mode = 'write' }
          elseif ($msg -match '^bridge-danger-') { $mode = 'dangerous' }
          else { throw 'Unsupported bridge execution prefix.' }
          Write-Host "RequestedMode=$mode"

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'powershell-bridge-v2'
          }

          function Fetch-CommitFile([string]$RepoPath, [string]$Destination) {
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$RepoPath?ref=$env:GITHUB_SHA"
            $resp = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
            $raw = ($resp.content -replace '\s', '')
            [IO.File]::WriteAllBytes($Destination, [Convert]::FromBase64String($raw))
          }

          $commandFile = Join-Path $env:RUNNER_TEMP 'bridge-v2-command.ps1'
          $guardFile = Join-Path $env:RUNNER_TEMP 'bridge-v2-guard.ps1'
          $stdoutFile = Join-Path $env:RUNNER_TEMP 'bridge-v2-stdout.txt'
          $stderrFile = Join-Path $env:RUNNER_TEMP 'bridge-v2-stderr.txt'

          Fetch-CommitFile 'tools/powershell-bridge/command.ps1' $commandFile
          Fetch-CommitFile 'tools/powershell-bridge/guard.ps1' $guardFile

          Write-Host '--- policy ---'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $guardFile -Mode $mode -ScriptPath $commandFile
          $guardExit = $LASTEXITCODE
          if ($null -eq $guardExit) { $guardExit = 0 }
          if ($guardExit -ne 0) {
            Write-Host "GUARD_EXIT_CODE=$guardExit"
            exit $guardExit
          }

          function Redact-Line([string]$Line) {
            if ($null -eq $Line) { return '' }
            $v = $Line
            $v = [regex]::Replace($v, '(?i)(Authorization\s*:\s*Bearer\s+)\S+', '$1<REDACTED>')
            $v = [regex]::Replace($v, '(?i)((?:password|passwd|api[_-]?key|client[_-]?secret|access[_-]?token|refresh[_-]?token)\s*[:=]\s*)\S+', '$1<REDACTED>')
            $v = [regex]::Replace($v, '(?i)\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b', '<REDACTED_JWT>')
            return $v
          }

          Write-Host '--- output ---'
          $proc = Start-Process -FilePath 'powershell.exe' `
            -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $commandFile) `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile

          if (Test-Path $stdoutFile) {
            Get-Content $stdoutFile | ForEach-Object { Write-Host (Redact-Line ([string]$_)) }
          }
          if (Test-Path $stderrFile) {
            Get-Content $stderrFile | ForEach-Object { Write-Host ('STDERR: ' + (Redact-Line ([string]$_))) }
          }

          $exit = $proc.ExitCode
          Write-Host "EXIT_CODE=$exit"
          Write-Host '=== POWERSHELL_BRIDGE_V2_END ==='

          Remove-Item $commandFile, $guardFile, $stdoutFile, $stderrFile -Force -ErrorAction SilentlyContinue
          if ($exit -ne 0) { exit $exit }
