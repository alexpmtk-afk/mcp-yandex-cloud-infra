name: PowerShell Bridge v2 LEGACY

on:
  push:
    branches:
      - tooling/powershell-bridge-v2
    paths:
      - 'tools/powershell-bridge/command.ps1'
      - 'tools/powershell-bridge/guard.ps1'
      - '.github/workflows/powershell-bridge.yml'

permissions:
  contents: read

concurrency:
  group: powershell-bridge-v2-legacy-${{ contains(github.event.head_commit.message, '-work:') && 'work' || 'home' }}
  cancel-in-progress: false

jobs:
  work-retired:
    if: >-
      startsWith(github.event.head_commit.message, 'bridge-safe-work:') ||
      startsWith(github.event.head_commit.message, 'bridge-write-work:') ||
      startsWith(github.event.head_commit.message, 'bridge-danger-work:')
    runs-on: ubuntu-latest
    steps:
      - name: WORK bridge migrated
        shell: bash
        run: |
          echo 'WORK_BRIDGE_RETIRED=TRUE'
          echo 'COMMAND_EXECUTED=FALSE'
          echo 'USE_REPOSITORY=alexpmtk-afk/gpt-powershell-bridge'
          echo 'USE_BRANCH=bridge-v2'
          echo 'USE_RUNNER=GPT-PowerShell-Work-MANAGER-MP2'
          echo 'USE_LABEL=gpt-powershell-work'
          echo 'This public WORK bridge is retired. Use the private bridge.'
          exit 64

  home-retired:
    if: >-
      startsWith(github.event.head_commit.message, 'bridge-safe-home:') ||
      startsWith(github.event.head_commit.message, 'bridge-write-home:') ||
      startsWith(github.event.head_commit.message, 'bridge-danger-home:')
    runs-on: ubuntu-latest
    steps:
      - name: HOME bridge migrated
        shell: bash
        run: |
          echo 'HOME_BRIDGE_RETIRED=TRUE'
          echo 'COMMAND_EXECUTED=FALSE'
          echo 'USE_REPOSITORY=alexpmtk-afk/gpt-powershell-bridge'
          echo 'USE_BRANCH=bridge-v2'
          echo 'USE_RUNNER=GPT-PowerShell-Home-DESKTOP-7F6KPIL'
          echo 'USE_LABEL=gpt-powershell-home'
          echo 'This public HOME bridge is retired. Use the private bridge.'
          exit 64
