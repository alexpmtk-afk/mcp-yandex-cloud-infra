name: Marketplaces Native Codex E2E

on:
  push:
    branches:
      - marketplaces-native-e2e-2026-09-07
    paths:
      - 'tools/powershell-bridge/command.ps1'
      - '.github/workflows/powershell-bridge.yml'

permissions:
  contents: read

concurrency:
  group: marketplaces-native-codex-e2e-work
  cancel-in-progress: false

jobs:
  execute:
    if: startsWith(github.event.head_commit.message, 'marketplaces-e2e-run:')
    runs-on: [self-hosted, Windows, X64, codex-bridge-work]
    timeout-minutes: 12
    steps:
      - name: Fetch and execute approved read-only E2E command
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '=== MARKETPLACES_NATIVE_E2E_BEGIN ==='
          Write-Host "Commit: $env:GITHUB_SHA"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Computer: $env:COMPUTERNAME"

          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/tools/powershell-bridge/command.ps1?ref=$env:GITHUB_SHA"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'marketplaces-native-e2e'
          }
          $resp = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
          $raw = ($resp.content -replace '\s','')
          $tmp = Join-Path $env:RUNNER_TEMP 'marketplaces-native-e2e.ps1'
          [IO.File]::WriteAllBytes($tmp, [Convert]::FromBase64String($raw))

          Write-Host '--- approved command.ps1 ---'
          Get-Content $tmp
          Write-Host '--- output ---'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tmp
          $exit = $LASTEXITCODE
          if ($null -eq $exit) { $exit = 0 }
          Write-Host "--- exit_code=$exit ---"
          Write-Host '=== MARKETPLACES_NATIVE_E2E_END ==='
          if ($exit -ne 0) { exit $exit }
