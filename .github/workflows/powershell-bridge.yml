name: PowerShell Bridge v0.1 LEGACY

on:
  push:
    branches:
      - tooling/powershell-bridge-v0.1
    paths:
      - 'tools/powershell-bridge/command.ps1'
      - '.github/workflows/powershell-bridge.yml'

permissions:
  contents: read

concurrency:
  group: powershell-bridge-v0-legacy-${{ startsWith(github.event.head_commit.message, 'bridge-exec-work:') && 'work' || 'home' }}
  cancel-in-progress: false

jobs:
  work-retired:
    if: startsWith(github.event.head_commit.message, 'bridge-exec-work:')
    runs-on: ubuntu-latest
    steps:
      - name: WORK bridge migrated
        shell: bash
        run: |
          echo 'WORK_BRIDGE_RETIRED=TRUE'
          echo 'COMMAND_EXECUTED=FALSE'
          echo 'USE_REPOSITORY=alexpmtk-afk/gpt-powershell-bridge'
          echo 'USE_BRANCH=bridge-v2'
          echo 'USE_RUNNER=GPT-PowerShell-Work-MANAGER-MP2'
          echo 'USE_LABEL=gpt-powershell-work'
          echo 'Legacy bridge-exec-work routing was retired on 2026-09-11. Read tools/powershell-bridge/README.md.'
          exit 64

  home-legacy:
    if: startsWith(github.event.head_commit.message, 'bridge-exec-home:') || startsWith(github.event.head_commit.message, 'bridge-exec:') || startsWith(github.event.head_commit.message, 'bridge-bootstrap:')
    runs-on: [self-hosted, Windows, X64, codex-bridge-service]
    timeout-minutes: 10
    steps:
      - name: Fetch and execute approved HOME PowerShell command
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '=== POWERSHELL_BRIDGE_HOME_LEGACY_BEGIN ==='
          Write-Host "Commit: $env:GITHUB_SHA"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Computer: $env:COMPUTERNAME"

          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/tools/powershell-bridge/command.ps1?ref=$env:GITHUB_SHA"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'powershell-bridge'
          }
          $resp = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
          $raw = ($resp.content -replace '\s','')
          $tmp = Join-Path $env:RUNNER_TEMP 'bridge-command.ps1'
          [IO.File]::WriteAllBytes($tmp, [Convert]::FromBase64String($raw))

          Write-Host '--- command.ps1 ---'
          Get-Content $tmp
          Write-Host '--- output ---'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tmp
          $exit = $LASTEXITCODE
          if ($null -eq $exit) { $exit = 0 }
          Write-Host "--- exit_code=$exit ---"
          Write-Host '=== POWERSHELL_BRIDGE_HOME_LEGACY_END ==='
          if ($exit -ne 0) { exit $exit }
