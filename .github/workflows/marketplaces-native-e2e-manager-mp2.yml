name: Marketplaces Native E2E MANAGER-MP2

on:
  push:
    branches:
      - tooling/powershell-bridge-v0.1
    paths:
      - '.github/workflows/marketplaces-native-e2e-manager-mp2.yml'
      - 'tools/powershell-bridge/command.ps1'

permissions:
  contents: read

concurrency:
  group: marketplaces-native-e2e-manager-mp2
  cancel-in-progress: true

jobs:
  execute:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Verify exact runner and execute approved E2E command
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "COMPUTER=$env:COMPUTERNAME"
          if ($env:RUNNER_NAME -ne 'Codex-Bridge-Work-MANAGER-MP2') {
            throw "Refusing to execute on unexpected runner: $env:RUNNER_NAME"
          }

          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/tools/powershell-bridge/command.ps1?ref=$env:GITHUB_SHA"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'marketplaces-native-e2e-manager-mp2'
          }
          $resp = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
          $raw = ($resp.content -replace '\s','')
          $tmp = Join-Path $env:RUNNER_TEMP 'marketplaces-native-e2e-command.ps1'
          [IO.File]::WriteAllBytes($tmp, [Convert]::FromBase64String($raw))
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tmp
          $exit = $LASTEXITCODE
          if ($null -eq $exit) { $exit = 0 }
          Write-Host "E2E_COMMAND_EXIT=$exit"
          if ($exit -ne 0) { exit $exit }
