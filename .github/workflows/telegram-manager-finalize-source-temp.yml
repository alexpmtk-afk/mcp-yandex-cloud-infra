name: Telegram Manager Finalize Source TEMP

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-manager-finalize-source-temp.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Copy verified Telegram Reader source into main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin telegram-manager-serverless-20260917
          git checkout origin/telegram-manager-serverless-20260917 -- \
            telegram-news-reader/.env.example \
            telegram-news-reader/.gitignore \
            telegram-news-reader/Dockerfile \
            telegram-news-reader/Dockerfile.media \
            telegram-news-reader/app \
            telegram-news-reader/config \
            telegram-news-reader/pyproject.toml \
            telegram-news-reader/requirements-dev.txt \
            telegram-news-reader/requirements.txt \
            telegram-news-reader/scripts \
            telegram-news-reader/tests
          python3 -m py_compile \
            telegram-news-reader/app/admin_page.py \
            telegram-news-reader/app/lockbox_runtime.py \
            telegram-news-reader/app/manager_extension.py \
            telegram-news-reader/app/serverless_bootstrap.py \
            telegram-news-reader/app/service.py \
            telegram-news-reader/app/telegram_client.py
          grep -q 'localStorage' telegram-news-reader/app/admin_page.py
          grep -q '_SAFE_DIRECT_PAGE_SIZE = 250' telegram-news-reader/app/manager_extension.py
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Resolve and verify manager public URL
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-manager-finalize || true
          yc config profile activate telegram-manager-finalize
          yc config set service-account-key "$key"
          yc config set folder-id b1gk4p83brasi8g811jv
          domain="$(yc serverless api-gateway get --name telegram-reader-manager --folder-id b1gk4p83brasi8g811jv --format json | jq -r '.domain')"
          test -n "$domain" && test "$domain" != null
          url="https://$domain/manage"
          code="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/manage.html" -w '%{http_code}' "$url")"
          test "$code" = 200
          grep -q 'Telegram Reader — управление чатами' "$RUNNER_TEMP/manage.html"
          printf '%s\n' "$url" > telegram-news-reader/MANAGER_PUBLIC_URL.txt
      - name: Commit canonical Reader source and manager URL
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add telegram-news-reader
          if git diff --cached --quiet; then
            echo NO_SOURCE_CHANGES
            exit 0
          fi
          git commit -m 'feat(telegram): canonicalize serverless manager source'
          git push origin HEAD:main
          echo TELEGRAM_MANAGER_SOURCE_MAIN_PASS
