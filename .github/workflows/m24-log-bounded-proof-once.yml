name: M24 Log Bounded Proof Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m24-log-bounded-proof-once.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: birzha-m24-log-bounded-proof-once
  cancel-in-progress: false

env:
  DEPLOYER_SERVICE_ACCOUNT_ID: ajecdjjrkdo1t3itpl9k
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/mcp-yandex-cloud-infra@1349853397:environment:test
  FOLDER_ID: b1g00gqb66tbnfoumnkv
  WORKER_CONTAINER_ID: bbamdg0po6fkukhod2e9
  TIMER_TRIGGER_ID: a1s4ho32v7dha59aeu60
  EXPECTED_REVISION_ID: bbaojh9elqpd5p5mdsei

jobs:
  evidence:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 8
    steps:
      - name: Mint Yandex IAM token through GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          A="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          S='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && S='&'
          R="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${S}audience=${A}")"
          J="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$R")"; echo "::add-mask::$J"
          python - "$J" <<'PY'
          import base64,json,os,sys
          p=sys.argv[1].split('.')[1]; p += '='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p))
          assert c.get('sub')==os.environ['EXPECTED_OIDC_SUBJECT']
          assert c.get('aud')==os.environ['OIDC_AUDIENCE']
          assert c.get('environment')=='test'
          assert c.get('ref')=='refs/heads/main'
          print('M24_BOUNDED_LOG_OIDC=PASS')
          PY
          X="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${DEPLOYER_SERVICE_ACCOUNT_ID}" --data-urlencode "subject_token=${J}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          T="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$X")"; test -n "$T"; echo "::add-mask::$T"; printf '%s' "$T" > "$RUNNER_TEMP/iam-token"

      - name: Install yc
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tar.gz"
          tar -xzf "$RUNNER_TEMP/yc.tar.gz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"

      - name: Verify active corrected runtime
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/iam-token")"
          YC_IAM_TOKEN="$TOKEN" "$RUNNER_TEMP/yc/yc" serverless trigger get --id="$TIMER_TRIGGER_ID" --format=json > "$RUNNER_TEMP/trigger.json"
          YC_IAM_TOKEN="$TOKEN" "$RUNNER_TEMP/yc/yc" serverless container revision list --container-id="$WORKER_CONTAINER_ID" --format=json > "$RUNNER_TEMP/revisions.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])
          t=json.loads((base/'trigger.json').read_text())
          rule=t.get('rule') or {}; timer=rule.get('timer') or {}; inv=timer.get('invoke_container_with_retry') or timer.get('invokeContainerWithRetry') or {}
          assert str(t.get('status') or '')=='ACTIVE'
          assert str(inv.get('container_id') or inv.get('containerId') or '')==os.environ['WORKER_CONTAINER_ID']
          d=json.loads((base/'revisions.json').read_text()); rows=d if isinstance(d,list) else (d.get('revisions') or d.get('containerRevisions') or [])
          rows=[r for r in rows if isinstance(r,dict) and str(r.get('container_id') or r.get('containerId') or '')==os.environ['WORKER_CONTAINER_ID']]
          assert rows
          rows.sort(key=lambda r:str(r.get('created_at') or r.get('createdAt') or ''),reverse=True)
          assert str(rows[0].get('id') or '')==os.environ['EXPECTED_REVISION_ID']
          assert str(rows[0].get('status') or '')=='ACTIVE'
          print('M24_BOUNDED_LOG_RUNTIME_COORDINATES=PASS')
          PY

      - name: Read finite log window
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/iam-token")"
          read -r SINCE NOW < <(python - <<'PY'
          from datetime import datetime,timedelta,timezone
          now=datetime.now(timezone.utc)
          since=now-timedelta(minutes=10)
          print(since.isoformat().replace('+00:00','Z'), now.isoformat().replace('+00:00','Z'))
          PY
          )
          timeout 75s env YC_IAM_TOKEN="$TOKEN" "$RUNNER_TEMP/yc/yc" logging read \
            --resource-ids="$WORKER_CONTAINER_ID" \
            --since="$SINCE" \
            --until="$NOW" \
            --limit=500 \
            --format=json \
            --folder-id="$FOLDER_ID" \
            > "$RUNNER_TEMP/worker-logs.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['RUNNER_TEMP'])/'worker-logs.json').read_text())
          assert isinstance(rows,list) and rows, 'no worker log records in finite window'
          print(f'M24_BOUNDED_LOG_RECORDS={len(rows)}')
          PY

      - name: Enforce no runtime failure signatures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re
          from collections import Counter
          from pathlib import Path
          rows=json.loads((Path(os.environ['RUNNER_TEMP'])/'worker-logs.json').read_text())
          starts=ends=level_errors=0
          known=Counter(); exc=Counter()
          patterns={
            'TRACEBACK':r'\bTraceback\b',
            'ASGI_EXCEPTION':r'Exception in ASGI application',
            'GENERIC_ERROR':r'GenericError',
            'EXEC_ERROR':r'ExecError',
            'USER_CODE_ERROR':r'UserCodeError',
            'SCHEMA_LIMIT':r'Request exceeded a limit on number of schema operations',
            'HTTP_5XX':r'\b50[0-9]\b|Internal Server Error',
          }
          exre=re.compile(r'\b([A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception|Denied|Unauthenticated|Unavailable|DeadlineExceeded|Aborted|Failure))\b')
          for e in rows:
              if not isinstance(e,dict): continue
              msg=str(e.get('message') or '')
              jp=e.get('json_payload') or e.get('jsonPayload') or {}
              vals=[msg]
              if isinstance(jp,dict): vals.extend(str(v) for v in jp.values())
              text=' '.join(vals)
              if re.search(r'\bSTART\b',text,re.I): starts+=1
              if re.search(r'\bEND\b',text,re.I): ends+=1
              if str(e.get('level') or '').upper() in {'ERROR','FATAL'}: level_errors+=1
              for k,p in patterns.items():
                  if re.search(p,text,re.I): known[k]+=1
              for x in exre.findall(text): exc[x]+=1
          print(f'M24_BOUNDED_LOG_START_MARKERS={starts}')
          print(f'M24_BOUNDED_LOG_END_MARKERS={ends}')
          print(f'M24_BOUNDED_LOG_ERROR_LEVEL_ENTRIES={level_errors}')
          print('M24_BOUNDED_LOG_KNOWN_SIGNATURES=' + ','.join(f'{k}:{v}' for k,v in sorted(known.items())))
          print('M24_BOUNDED_LOG_EXCEPTION_TYPES=' + ','.join(f'{k}:{v}' for k,v in exc.most_common(20)))
          assert starts>0 and ends>0, 'timer execution markers missing'
          assert level_errors==0, 'ERROR/FATAL entries remain'
          assert sum(known.values())==0, 'known runtime failure signature remains'
          print('M24_BOUNDED_LOG_RUNTIME_ERRORS=NONE')
          print('M24_BOUNDED_LOG_PROOF=PASS')
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/iam-token" "$RUNNER_TEMP/yc" "$RUNNER_TEMP/yc.tar.gz" "$RUNNER_TEMP/trigger.json" "$RUNNER_TEMP/revisions.json" "$RUNNER_TEMP/worker-logs.json"
