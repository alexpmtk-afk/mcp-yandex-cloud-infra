name: M24 Infra OIDC Claims

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m24-infra-oidc-claims.yml"

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 5
    env:
      OIDC_AUDIENCE: https://github.com/alexpmtk-afk
    steps:
      - name: Print safe GitHub OIDC claims only
        shell: bash
        run: |
          set -euo pipefail
          ENCODED_AUDIENCE="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          SEP='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && SEP='&'
          RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${SEP}audience=${ENCODED_AUDIENCE}")"
          JWT="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")"
          echo "::add-mask::$JWT"
          python - "$JWT" <<'PY'
          import base64,json,sys
          p=sys.argv[1].split('.')[1]; p += '=' * (-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          print('OIDC_SUB='+str(c.get('sub','')))
          print('OIDC_AUD='+str(c.get('aud','')))
          print('OIDC_REF='+str(c.get('ref','')))
          print('OIDC_ENVIRONMENT='+str(c.get('environment','')))
          print('OIDC_CLAIMS_DIAGNOSTIC=PASS')
          PY
