name: Temporary card-monitor full inventory with scoped viewer roles

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/card-monitor-scoped-viewer-trigger.txt"

permissions:
  contents: read
  id-token: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    env:
      SA_ID: ajecdjjrkdo1t3itpl9k
      AUD: https://github.com/alexpmtk-afk
      FOLDER_ID: b1g0224nfivl9224dm96

    steps:
      - name: Exchange GitHub OIDC for Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          A="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["AUD"], safe=""))')"
          SEP='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && SEP='&'
          R="$(curl -fsS --retry 5 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${SEP}audience=${A}")"
          J="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$R")"
          echo "::add-mask::$J"
          X="$(curl -fsS --retry 5 -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded'             --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange'             --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token'             --data-urlencode "audience=${SA_ID}"             --data-urlencode "subject_token=${J}"             --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          T="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$X")"
          test -n "$T"
          echo "::add-mask::$T"
          echo "YC_IAM_TOKEN=$T" >> "$GITHUB_ENV"
          echo "OIDC_AUTH=PASS"

      - name: Install Yandex CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL --retry 5 --retry-delay 3 https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Grant temporary read-only viewer roles on old folder
        shell: bash
        run: |
          set -euo pipefail
          for ROLE in compute.viewer storage.viewer ydb.viewer; do
            yc resource-manager folder add-access-binding               --id "$FOLDER_ID"               --role "$ROLE"               --service-account-id "$SA_ID"
            echo "TEMP_ROLE_GRANTED=$ROLE"
          done
          sleep 5

      - name: Read-only full inventory
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json, os, subprocess
          fid=os.environ["FOLDER_ID"]
          commands={
            "compute_instances":["yc","compute","instance","list","--folder-id",fid,"--format","json"],
            "compute_disks":["yc","compute","disk","list","--folder-id",fid,"--format","json"],
            "compute_snapshots":["yc","compute","snapshot","list","--folder-id",fid,"--format","json"],
            "compute_images":["yc","compute","image","list","--folder-id",fid,"--format","json"],
            "ydb":["yc","ydb","database","list","--folder-id",fid,"--format","json"],
            "lockbox":["yc","lockbox","secret","list","--folder-id",fid,"--format","json"],
            "containers":["yc","serverless","container","list","--folder-id",fid,"--format","json"],
            "functions":["yc","serverless","function","list","--folder-id",fid,"--format","json"],
            "gateways":["yc","serverless","api-gateway","list","--folder-id",fid,"--format","json"],
            "buckets":["yc","storage","bucket","list","--folder-id",fid,"--format","json"],
            "registries":["yc","container","registry","list","--folder-id",fid,"--format","json"],
          }
          for kind,cmd in commands.items():
              p=subprocess.run(cmd,text=True,capture_output=True,timeout=120)
              if p.returncode:
                  detail=(p.stderr or p.stdout or "").strip().replace("\n"," ")[:240]
                  print(f"RESOURCE type={kind} status=ERROR rc={p.returncode} detail={detail}")
                  continue
              data=json.loads(p.stdout or "[]")
              items=data if isinstance(data,list) else ([data] if data else [])
              print(f"RESOURCE type={kind} count={len(items)}")
              for x in items:
                  if not isinstance(x,dict):
                      continue
                  out={"id":x.get("id",""),"name":x.get("name",""),"status":x.get("status","")}
                  if kind=="compute_disks":
                      out.update(size=x.get("size",""),type_id=x.get("type_id",""),instance_ids=x.get("instance_ids",[]),source_image_id=x.get("source_image_id",""),source_snapshot_id=x.get("source_snapshot_id",""))
                  if kind=="compute_instances":
                      out.update(zone_id=x.get("zone_id",""),resources=x.get("resources",{}),boot_disk=x.get("boot_disk",{}))
                  if kind=="buckets":
                      out.update(max_size=x.get("max_size",""),versioning=x.get("versioning",""))
                  print("ITEM type=%s data=%s"%(kind,json.dumps(out,ensure_ascii=False,separators=(",",":"))))
          print("FULL_INVENTORY_DONE=YES")
          PY

      - name: Remove temporary viewer roles
        if: always()
        shell: bash
        run: |
          set +e
          for ROLE in compute.viewer storage.viewer ydb.viewer; do
            yc resource-manager folder remove-access-binding               --id "$FOLDER_ID"               --role "$ROLE"               --service-account-id "$SA_ID"
            echo "TEMP_ROLE_REMOVED=$ROLE"
          done
