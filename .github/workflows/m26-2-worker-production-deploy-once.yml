name: M26.2 Worker Production Deploy Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m26-2-worker-production-deploy-once.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: birzha-m26-2-worker-production-deploy-once
  cancel-in-progress: false

env:
  TF_DIR: terraform/birzha_test
  DEPLOYER_SERVICE_ACCOUNT_ID: ajecdjjrkdo1t3itpl9k
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/mcp-yandex-cloud-infra@1349853397:environment:test
  TARGET_APP_SHA: 28996668fb35f05cacf08bceea276e58e697c6d5
  TARGET_WORKER_IMAGE: cr.yandex/crpk5qvf4p7kcqil2u3v/birzha-mcp-forecast@sha256:479c7f1641d159d9d0cc8ff776f4d6547a45b80f4f4eccbaa1abfb5e227c333b
  PUBLIC_IMAGE: cr.yandex/crpk5qvf4p7kcqil2u3v/birzha-mcp-forecast@sha256:5db7e3b1bbd69ee0c797d1d9a5a9289633914ef9f360f3d0f45187cb219113fc
  PUBLIC_SHA: b6ce037915ee993f2758f2ff6b29341f15554308
  PUBLIC_HOSTS: d5d6sgh96p1fs4mnlfsr.0ly8ed4d.apigw.yandexcloud.net,d5d6sgh96p1fs4mnlfsr.0ly8ed4d.apigw.yandexcloud.net:*
  PUBLIC_ORIGINS: https://chatgpt.com
  MCP_URL: https://d5d6sgh96p1fs4mnlfsr.0ly8ed4d.apigw.yandexcloud.net/mcp
  WORKER_ID: bbamdg0po6fkukhod2e9
  TIMER_ID: a1s4ho32v7dha59aeu60
  BRIDGE_URL: https://script.google.com/macros/s/AKfycbxRqmudGWqwCSgEuikPi23pe9YjqK5wfSk4syldQQmI9cDMxcYfKz6DzftRnSgGm69H9g/exec
  BRIDGE_ROOT: 1A7IzjXYSCWReZXdtrPZgZgLTnFIifsT2
  BRIDGE_CHUNK_ROWS: "500"
  BRIDGE_SECRET_ID: e6qecl857uj9b21reng9
  BRIDGE_SECRET_VERSION: e6qrir8bf747fu333qdi

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Mint Yandex token
        shell: bash
        run: |
          set -euo pipefail
          A="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          S='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && S='&'
          R="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${S}audience=${A}")"
          J="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$R")"
          echo "::add-mask::$J"
          python - "$J" <<'PY'
          import base64,json,os,sys
          p=sys.argv[1].split('.')[1]; p += '='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          assert c.get('sub')==os.environ['EXPECTED_OIDC_SUBJECT']
          assert c.get('aud')==os.environ['OIDC_AUDIENCE']
          assert c.get('ref')=='refs/heads/main'
          assert c.get('environment')=='test'
          PY
          X="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${DEPLOYER_SERVICE_ACCOUNT_ID}" --data-urlencode "subject_token=${J}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          T="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$X")"
          test -n "$T"; echo "::add-mask::$T"; printf '%s' "$T" > "$RUNNER_TEMP/iam-token"
      - name: Verify applied state
        shell: bash
        env:
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" init -reconfigure -input=false -lockfile=readonly -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY" >/dev/null
          terraform -chdir="$TF_DIR" validate
          terraform -chdir="$TF_DIR" show -json > "$RUNNER_TEMP/state.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'state.json').read_text())
          by={r['address']:r['values'] for r in s['values']['root_module']['resources']}
          p=by['yandex_serverless_container.mcp[0]']['image'][0]; pe=p.get('environment') or {}
          w=by['yandex_serverless_container.orchestrator_worker[0]']; wi=w['image'][0]; we=wi.get('environment') or {}
          assert p['url']==os.environ['PUBLIC_IMAGE'] and pe.get('BIRZHA_SOURCE_COMMIT')==os.environ['PUBLIC_SHA']
          assert pe.get('MCP_ALLOWED_HOSTS','')==os.environ['PUBLIC_HOSTS'] and pe.get('MCP_ALLOWED_ORIGINS','')==os.environ['PUBLIC_ORIGINS']
          assert w['id']==os.environ['WORKER_ID']
          assert wi['url']==os.environ['TARGET_WORKER_IMAGE'] and we.get('BIRZHA_SOURCE_COMMIT')==os.environ['TARGET_APP_SHA']
          assert str(w.get('execution_timeout')) in {'6m0s','360s','360'}
          assert we.get('BIRZHA_MARKET_MIRROR_BRIDGE_URL')==os.environ['BRIDGE_URL'] and we.get('BIRZHA_MARKET_MIRROR_ROOT_FOLDER_ID')==os.environ['BRIDGE_ROOT']
          m=[x for x in (w.get('secrets') or []) if x.get('environment_variable')=='BIRZHA_MARKET_MIRROR_BRIDGE_SECRET']
          assert len(m)==1 and m[0].get('id')==os.environ['BRIDGE_SECRET_ID'] and m[0].get('version_id')==os.environ['BRIDGE_SECRET_VERSION']
          assert by['yandex_function_trigger.orchestrator_timer[0]']['id']==os.environ['TIMER_ID']
          print('M26_2_APPLIED_STATE=PASS')
          print('M26_2_WORKER_IMAGE_ACTIVE=PASS')
          print('M26_2_6_MINUTE_LIMIT_ACTIVE=PASS')
          print('M26_2_PUBLIC_SERVICE_UNCHANGED=PASS')
          PY
      - name: Verify timer active
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tar.gz"
          tar -xzf "$RUNNER_TEMP/yc.tar.gz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          YC_IAM_TOKEN="$(cat "$RUNNER_TEMP/iam-token")" "$RUNNER_TEMP/yc/yc" serverless trigger get "$TIMER_ID" --format=json > "$RUNNER_TEMP/timer.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'timer.json').read_text())
          assert d.get('status')=='ACTIVE' and d.get('id')==os.environ['TIMER_ID']
          assert os.environ['WORKER_ID'] in json.dumps(d)
          print('M26_2_AUTOMATIC_UPDATES_ACTIVE=PASS')
          PY
      - name: Verify zero drift
        shell: bash
        run: |
          set -euo pipefail
          export TF_VAR_yc_token="$(cat "$RUNNER_TEMP/iam-token")"
          set +e
          terraform -chdir="$TF_DIR" plan -detailed-exitcode -input=false -no-color \
            -var="mcp_image_url=${PUBLIC_IMAGE}" -var="source_commit_sha=${PUBLIC_SHA}" \
            -var="mcp_allowed_hosts=${PUBLIC_HOSTS}" -var="mcp_allowed_origins=${PUBLIC_ORIGINS}" \
            -var="m24_worker_image_url=${TARGET_WORKER_IMAGE}" -var="m24_worker_source_sha=${TARGET_APP_SHA}" \
            -var="m24_infra_oidc_bootstrap_enabled=false" -var="m24_observability_probe_enabled=false" \
            -var="m25_birzha_bridge_v1_url=${BRIDGE_URL}" -var="m25_birzha_bridge_v1_required=true" \
            -var="m25_birzha_bridge_v1_root_folder_id=${BRIDGE_ROOT}" \
            -var="m25_birzha_bridge_v1_secret_id=${BRIDGE_SECRET_ID}" \
            -var="m25_birzha_bridge_v1_secret_version_id=${BRIDGE_SECRET_VERSION}" \
            -var="m25_birzha_bridge_v1_chunk_rows=${BRIDGE_CHUNK_ROWS}" > "$RUNNER_TEMP/zero.txt"
          rc=$?; set -e
          test "$rc" = 0 || { cat "$RUNNER_TEMP/zero.txt"; exit "$rc"; }
          echo 'M26_2_ZERO_DRIFT=PASS'
      - name: First real SBER forecast through production MCP
        if: github.event.head_commit.message == 'ops: create first real SBER forecast once'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'mcp==2.1.1' >/dev/null
          T="$(cat "$RUNNER_TEMP/iam-token")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -H "Authorization: Bearer ${T}" \
            "https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/${BRIDGE_SECRET_ID}/payload?versionId=${BRIDGE_SECRET_VERSION}" \
            -o "$RUNNER_TEMP/mcp-secret.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'mcp-secret.json'
          d=json.loads(p.read_text())
          values={str(e.get('key')):e.get('textValue') for e in d.get('entries',[])}
          token=values.get('bearer_token')
          assert token and len(token) >= 32
          print(f'::add-mask::{token}')
          (Path(os.environ['RUNNER_TEMP'])/'mcp-bearer').write_text(token)
          PY
          python - <<'PY'
          import asyncio, json, os
          from pathlib import Path
          import httpx2
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          def unpack(result):
              if bool(getattr(result, 'isError', False) or getattr(result, 'is_error', False)):
                  raise RuntimeError(f'MCP tool error: {result}')
              structured=getattr(result,'structuredContent',None)
              if structured is None:
                  structured=getattr(result,'structured_content',None)
              if structured is not None:
                  return structured
              for item in getattr(result,'content',[]) or []:
                  text=getattr(item,'text',None)
                  if text:
                      try: return json.loads(text)
                      except json.JSONDecodeError: pass
              raise RuntimeError('MCP tool returned no structured JSON')

          async def main():
              token=(Path(os.environ['RUNNER_TEMP'])/'mcp-bearer').read_text()
              async with httpx2.AsyncClient(
                  headers={'Authorization':f'Bearer {token}','Origin':'https://chatgpt.com'},
                  timeout=httpx2.Timeout(30.0, read=120.0),
              ) as http_client:
                  async with streamable_http_client(os.environ['MCP_URL'], http_client=http_client) as (read_stream, write_stream):
                      async with ClientSession(read_stream, write_stream) as session:
                          init=await session.initialize()
                          print('FIRST_MCP_SERVER='+json.dumps({'name':init.serverInfo.name,'version':init.serverInfo.version},sort_keys=True))
                          snap=unpack(await session.call_tool('market.snapshot',arguments={'symbol':'SBER'}))
                          summary={
                              'symbol':snap.get('symbol'),'secid':snap.get('secid'),'as_of':snap.get('as_of'),
                              'data_quality':snap.get('data_quality'),'warnings':snap.get('warnings') or [],
                              'quality_contract':snap.get('quality_contract') or {},
                          }
                          print('FIRST_REAL_SNAPSHOT='+json.dumps(summary,ensure_ascii=False,sort_keys=True))
                          if snap.get('data_quality') != 'PASS' or (snap.get('quality_contract') or {}).get('status') != 'PASS':
                              print('FIRST_REAL_FORECAST_CREATE=SKIPPED_DEGRADED_DATA')
                              return
                          created=unpack(await session.call_tool('forecast.create',arguments={'symbol':'SBER'}))
                          fc=created['forecast']; journal=created['journal']
                          assert created.get('storage_scope')=='distributed'
                          assert journal.get('status') in {'APPENDED','DUPLICATE_IDENTICAL'}
                          assert fc.get('validation_status')=='UNVALIDATED_BASELINE'
                          got=unpack(await session.call_tool('forecast.get',arguments={'forecast_id':fc['forecast_id']}))
                          assert got.get('forecast_id')==fc['forecast_id']
                          assert got==fc
                          print('FIRST_REAL_FORECAST='+json.dumps(fc,ensure_ascii=False,sort_keys=True))
                          print('FIRST_REAL_FORECAST_JOURNAL='+json.dumps(journal,sort_keys=True))
                          print('FIRST_REAL_FORECAST_READBACK=PASS')
          asyncio.run(main())
          PY
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/iam-token" "$RUNNER_TEMP/yc" "$RUNNER_TEMP/yc.tar.gz" "$RUNNER_TEMP/state.json" "$RUNNER_TEMP/timer.json" "$RUNNER_TEMP/zero.txt" "$RUNNER_TEMP/mcp-secret.json" "$RUNNER_TEMP/mcp-bearer"
