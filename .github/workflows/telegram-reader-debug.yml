name: Debug Telegram Reader Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-reader-debug || true
          yc config set service-account-key "$key"
      - name: Open ephemeral SSH and deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/tgkey"
          ip="$(curl -fsS https://api.ipify.org)"
          old="$(yc compute instance get telegram-news-reader --folder-id b1gk4p83brasi8g811jv --format json | jq -r '.metadata["ssh-keys"] // ""')"
          printf '%s' "$old" > "$RUNNER_TEMP/oldkeys"
          { printf '%s\n' "$old"; printf 'ubuntu:'; cat "$RUNNER_TEMP/tgkey.pub"; } > "$RUNNER_TEMP/newkeys"
          yc compute instance add-metadata telegram-news-reader --folder-id b1gk4p83brasi8g811jv --metadata-from-file ssh-keys="$RUNNER_TEMP/newkeys"
          yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id b1gk4p83brasi8g811jv --add-rule "description=github-ephemeral,direction=ingress,port=22,protocol=tcp,v4-cidrs=$ip/32"
          sleep 5
          ssh -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i "$RUNNER_TEMP/tgkey" ubuntu@111.88.248.156 'set -e; image=cr.yandex/crphagvid8e8g5pp4fpe/telegram-news-reader:d2b147ed1b1a44745bd5346baefa75cbdd696911; token=$(curl -sf -H Metadata-Flavor:Google 169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token | jq -r .access_token); echo "$token" | sudo docker login --username iam --password-stdin cr.yandex >/dev/null; sudo docker pull "$image" >/dev/null; sudo docker rm -f telegram-reader telegram-reader-setup >/dev/null 2>&1 || true; sudo rm -f /state/setup.complete; sudo docker run -d --name telegram-reader-setup --restart unless-stopped --network host -e SETUP_TOKEN_SHA256=b33311a41482a4a1ccd84a293fdfc1c3097306249147e84f409920b915f07c2f -e TELEGRAM_CREDENTIALS_SECRET_ID=e6qgrhklnqgnml4lgn5u -e TELEGRAM_SESSION_PATH=/state/telegram_news -e TELEGRAM_WHITELIST_PATH=/state/allowed_chats.yaml -e SETUP_COMPLETE_MARKER=/state/setup.complete -e TELEGRAM_WS_RELAY_URL=telegram-reader-relay.alexpmtk.workers.dev -e TELEGRAM_WS_RELAY_LOCAL_PORT=18888 -v /state:/state "$image" uvicorn app.setup_service:app --host 127.0.0.1 --port 8081 --workers 1 >/dev/null; sleep 3; echo IMAGE; sudo docker inspect -f "{{.Config.Image}}" telegram-reader-setup; echo HEALTH; curl -sS http://127.0.0.1:8081/healthz; echo; echo PROBE; curl -sS http://127.0.0.1:8081/probe; echo'
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          ids=$(yc vpc security-group get enpocnvnpdu2goj9nkjn --folder-id b1gk4p83brasi8g811jv --format json | jq -r '.rules[] | select(.description=="github-ephemeral") | .id')
          for id in $ids; do yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id b1gk4p83brasi8g811jv --delete-rule-id "$id"; done
          if [ -f "$RUNNER_TEMP/oldkeys" ]; then yc compute instance add-metadata telegram-news-reader --folder-id b1gk4p83brasi8g811jv --metadata-from-file ssh-keys="$RUNNER_TEMP/oldkeys"; fi
          rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/tgkey" "$RUNNER_TEMP/tgkey.pub" "$RUNNER_TEMP/oldkeys" "$RUNNER_TEMP/newkeys"
