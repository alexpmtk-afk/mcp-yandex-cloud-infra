name: Validate Birzha Google Drive Bridge v1 Readiness

on:
  pull_request:
    paths:
      - 'shared/google-drive-bridge/**'
      - '.github/workflows/birzha-drive-bridge-v1-*.yml'
      - '.github/workflows/provision-google-drive-bridge-v1-lockboxes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate central Bridge alpha.2 contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'bridge_release=1.0.0-alpha.2' shared/google-drive-bridge/VERSION
          grep -q "BRIDGE_RELEASE = '1.0.0-alpha.2'" shared/google-drive-bridge/bridge.gs
          grep -q "projectId: 'birzha'" shared/google-drive-bridge/deploy/birzha_config.gs
          grep -q "rootId: '1A7IzjXYSCWReZXdtrPZgZgLTnFIifsT2'" shared/google-drive-bridge/deploy/birzha_config.gs
          grep -q 'sheetsEnabled: true' shared/google-drive-bridge/deploy/birzha_config.gs
          python -m pip install 'pytest>=8,<9' 'httpx>=0.27,<1'
          python -m pytest shared/google-drive-bridge/tests -q
          python -m compileall -q shared/google-drive-bridge/python_client shared/google-drive-bridge/scripts
          echo 'BIRZHA_SHARED_PROTOCOL_ALPHA2=PASS'

      - name: Validate Birzha bootstrap and acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            .github/workflows/birzha-drive-bridge-v1-bootstrap.yml \
            .github/workflows/birzha-drive-bridge-v1-acceptance.yml; do
            test -f "$f"
            grep -q 'workflow_dispatch:' "$f"
          done
          grep -q 'PROJECT_ID: birzha' .github/workflows/birzha-drive-bridge-v1-bootstrap.yml
          grep -q 'PROJECT_ID: birzha' .github/workflows/birzha-drive-bridge-v1-acceptance.yml
          grep -q 'birzha-google-drive-bridge-v1' .github/workflows/birzha-drive-bridge-v1-bootstrap.yml
          grep -q 'BIRZHA_GDRIVE_BRIDGE_V1_BOOTSTRAP_SECRET' .github/workflows/birzha-drive-bridge-v1-bootstrap.yml
          grep -q 'sheets_acceptance.py' .github/workflows/birzha-drive-bridge-v1-acceptance.yml
          grep -q 'OUTSIDE_ROOT' .github/workflows/birzha-drive-bridge-v1-acceptance.yml
          echo 'BIRZHA_BRIDGE_V1_READINESS_CONTRACT=PASS'

      - name: Validate isolated Lockbox provisioning contract
        shell: bash
        run: |
          set -euo pipefail
          f=.github/workflows/provision-google-drive-bridge-v1-lockboxes.yml
          grep -q 'marketplaces-google-drive-bridge-v1' "$f"
          grep -q 'birzha-google-drive-bridge-v1' "$f"
          grep -q 'marketplaces-mcp-runtime' "$f"
          grep -q 'birzha-mcp-forecast-runtime' "$f"
          grep -q 'SECRET_PAYLOAD_CREATED=NO' "$f"
          grep -q 'PRODUCTION_BINDINGS_CHANGED=NO' "$f"
          echo 'BRIDGE_LOCKBOX_PROVISIONING_CONTRACT=PASS'
