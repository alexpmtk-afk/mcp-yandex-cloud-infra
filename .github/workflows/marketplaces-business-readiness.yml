name: Marketplaces MCP Business Readiness

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/marketplaces-business-readiness.yml
  workflow_run:
    workflows:
      - Deploy Marketplaces MCP TEST
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: marketplaces-mcp-business-readiness
  cancel-in-progress: true

jobs:
  readiness:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          ARCHIVE="$RUNNER_TEMP/yc/yc.tgz"
          ok=0
          for attempt in $(seq 1 6); do
            echo "yc download attempt $attempt/6"
            if timeout 75s wget --continue --timeout=30 --tries=2 --retry-connrefused --output-document="$ARCHIVE" "$URL"; then
              if tar -tzf "$ARCHIVE" >/dev/null 2>&1; then
                ok=1
                break
              fi
              rm -f "$ARCHIVE"
            fi
            sleep 3
          done
          test "$ok" = 1
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate and resolve TEST MCP
        id: mcp
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"

          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"

          DOMAIN="$(timeout 45s yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//.[0].domain//empty')"
          SECRET_ID="$(timeout 45s yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          VERSION_ID="$(timeout 45s yc lockbox secret list-versions --id "$SECRET_ID" --format json | jq -r '[.[]|select(.status=="ACTIVE")][0].id')"
          test -n "$DOMAIN"
          test -n "$SECRET_ID"
          test -n "$VERSION_ID"

          timeout 45s yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/sec.json"
          BEARER="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value' "$RUNNER_TEMP/sec.json")"
          test -n "$BEARER"
          echo "::add-mask::$BEARER"
          printf '%s' "$BEARER" > "$RUNNER_TEMP/bearer"
          chmod 600 "$RUNNER_TEMP/bearer"
          echo "url=https://${DOMAIN}/mcp" >> "$GITHUB_OUTPUT"
          echo 'mcp_endpoint=RESOLVED'

      - name: Assert business-critical MCP tools
        shell: bash
        timeout-minutes: 3
        env:
          MCP_URL: ${{ steps.mcp.outputs.url }}
        run: |
          set -euo pipefail
          export MCP_BEARER="$(cat "$RUNNER_TEMP/bearer")"
          python -m pip install --quiet 'httpx>=0.27,<1'
          timeout 120s python -u - <<'PY'
          import itertools, json, os
          import httpx

          required = {
              'wb_get_sales',
              'wb_get_stocks',
              'wb_get_orders_summary',
              'ozon_get_products',
              'ozon_get_prices',
              'wb_rate_limit_status',
              'ozon_rate_limit_status',
          }

          def unpack(response):
              response.raise_for_status()
              for line in response.text.splitlines():
                  if line.startswith('data:'):
                      return json.loads(line[5:].strip())
              return response.json() if response.text.strip() else None

          headers = {
              'Authorization': 'Bearer ' + os.environ['MCP_BEARER'],
              'Accept': 'application/json, text/event-stream',
              'Content-Type': 'application/json',
          }
          ids = itertools.count(1)
          timeout = httpx.Timeout(connect=10.0, read=45.0, write=30.0, pool=10.0)
          with httpx.Client(timeout=timeout, follow_redirects=True) as client:
              init_response = client.post(os.environ['MCP_URL'], headers=headers, json={
                  'jsonrpc': '2.0',
                  'id': next(ids),
                  'method': 'initialize',
                  'params': {
                      'protocolVersion': '2025-06-18',
                      'capabilities': {},
                      'clientInfo': {'name': 'business-readiness', 'version': '1'},
                  },
              })
              init = unpack(init_response)
              assert init and 'result' in init, init
              session_headers = dict(headers)
              session_id = init_response.headers.get('mcp-session-id')
              if session_id:
                  session_headers['Mcp-Session-Id'] = session_id
              session_headers['MCP-Protocol-Version'] = init['result'].get('protocolVersion', '2025-06-18')
              notice = client.post(os.environ['MCP_URL'], headers=session_headers, json={
                  'jsonrpc': '2.0', 'method': 'notifications/initialized'
              })
              assert notice.status_code in (200, 202), notice.status_code

              listed = client.post(os.environ['MCP_URL'], headers=session_headers, json={
                  'jsonrpc': '2.0', 'id': next(ids), 'method': 'tools/list', 'params': {}
              })
              payload = unpack(listed)
              assert payload and 'result' in payload, payload
              names = {tool['name'] for tool in payload['result']['tools']}
              missing = sorted(required - names)
              assert not missing, f'missing business-critical tools: {missing}'
              print(f'MCP_TOOL_COUNT={len(names)}')
              print('BUSINESS_CRITICAL_TOOLS=' + ','.join(sorted(required)))
              print('MARKETPLACES_BUSINESS_READINESS=PASS')
          PY

      - name: Cleanup credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/sec.json" "$RUNNER_TEMP/bearer"
