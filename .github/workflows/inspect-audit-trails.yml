name: Inspect Yandex Audit Trails

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-audit-trails.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"

      - name: Authenticate deployer
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"
          yc config set cloud-id b1gi4pr9msenirafh2c7
          yc config set folder-id b1gnd0dqoq3ljod88i8t

      - name: List visible Audit Trails in every visible folder
        shell: bash
        run: |
          set +e
          CLOUD_ID=b1gi4pr9msenirafh2c7
          yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json --no-user-output > "$RUNNER_TEMP/folders.json"
          echo '--- VISIBLE_FOLDERS ---'
          jq -c '.[]|{id,name}' "$RUNNER_TEMP/folders.json"
          echo '--- AUDIT_TRAILS ---'
          jq -r '.[].id' "$RUNNER_TEMP/folders.json" | while read -r fid; do
            echo "folder=$fid"
            yc audit-trails trail list --folder-id "$fid" --format json --no-user-output || true
          done

      - name: Inspect Serverless container operation history
        shell: bash
        run: |
          set +e
          CONTAINER_ID=bba6lj5ggejtop0jl5k8
          echo '--- SERVERLESS_CONTAINER_OPERATIONS ---'
          yc serverless container list-operations --id "$CONTAINER_ID" --format json --no-user-output

      - name: Inspect Registry operations if supported
        shell: bash
        run: |
          set +e
          echo '--- REGISTRY_OPERATION_HELP ---'
          yc container registry --help 2>&1 | grep -i -C2 operation || true
          echo '--- AUDIT_TRAILS_HELP ---'
          yc audit-trails trail --help 2>&1 | head -120 || true

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/folders.json"
