name: Telegram Legacy Cleanup Exec Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/telegram-legacy-cleanup-exec-temp.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-cleanup-exec || true
          yc config profile activate telegram-cleanup-exec
          yc config set service-account-key "$key"
          yc config set folder-id b1gk4p83brasi8g811jv

      - name: Pre-cleanup production safety gate
        shell: bash
        run: |
          set -euo pipefail
          folder=b1gk4p83brasi8g811jv
          ! grep -n '111\.88\.248\.156' .github/workflows/telegram-news-bridge.yml .github/workflows/telegram-news-ondemand.yml
          ! grep -n 'ssh-keygen\|ubuntu@111\.88\.248\.156' .github/workflows/telegram-news-bridge.yml .github/workflows/telegram-news-ondemand.yml
          jq -e '.schema=="TELEGRAM_NEWS_READER_V1" and .allowed_chats==9 and .message_count>0' telegram-news-reader/export/TELEGRAM_NEWS_LATEST.json >/dev/null
          jq -e '.schema=="TELEGRAM_NEWS_ONDEMAND_V3" and .chat_count>=1 and .chat_count<=5' telegram-news-reader/ondemand/latest.json >/dev/null
          url="$(yc serverless container get telegram-reader-serverless --folder-id "$folder" --format json | jq -r '.url')"
          url="${url%/}"
          token="$(yc iam create-token)"
          healthy=0
          for attempt in $(seq 1 12); do
            body="$(curl -sS --max-time 30 -H "Authorization: Bearer $token" "$url/health" || true)"
            if echo "$body" | jq -e '.status=="ok" and .telegram_authorized==true and .allowed_chats==9 and .media_storage=="enabled"' >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 5
          done
          test "$healthy" -eq 1
          echo PRE_CLEANUP_PRODUCTION_GATE_PASS

      - name: Ensure legacy Telegram static public IP is released
        shell: bash
        run: |
          set -euo pipefail
          folder=b1gk4p83brasi8g811jv
          prod_vm=fhm7p41jpj4uc2c6buou
          address_id=e9bv4ec7lo22sahplcpj
          old_ip=111.88.248.156

          vm="$(yc compute instance get --id "$prod_vm" --folder-id "$folder" --format json)"
          echo "$vm" | jq -e '.name=="telegram-news-reader" and .status=="STOPPED"' >/dev/null
          nat="$(echo "$vm" | jq -r '.network_interfaces[0].primary_v4_address.one_to_one_nat.address // empty')"
          if [ -n "$nat" ]; then
            test "$nat" = "$old_ip"
            yc compute instance remove-one-to-one-nat --id "$prod_vm" --network-interface-index 0 --folder-id "$folder" >/dev/null
          fi

          if yc vpc address get --id "$address_id" --folder-id "$folder" --format json > "$RUNNER_TEMP/old-address.json" 2>/dev/null; then
            jq -e --arg ip "$old_ip" '.name=="telegram-reader-public-ip" and .external_ipv4_address.address==$ip' "$RUNNER_TEMP/old-address.json" >/dev/null
            yc vpc address delete --id "$address_id" --folder-id "$folder" >/dev/null
            echo STATIC_IP_RELEASE_PASS
          else
            echo STATIC_IP_RELEASE_ALREADY_DONE
          fi

          if yc vpc address get --id "$address_id" --folder-id "$folder" >/dev/null 2>&1; then
            echo STATIC_IP_STILL_EXISTS
            exit 1
          fi
          post="$(yc compute instance get --id "$prod_vm" --folder-id "$folder" --format json)"
          test "$(echo "$post" | jq -r '.network_interfaces[0].primary_v4_address.one_to_one_nat.address // empty')" = ""

      - name: Ensure temporary builder compute and network contour is deleted
        shell: bash
        run: |
          set -euo pipefail
          folder=b1gk4p83brasi8g811jv
          builder_vm=fhm4dcokf4herjhn8aiv
          builder_disk=fhmrot9tje8e7pg7teqb
          builder_subnet=e9b8k00chkpj4dd11uui
          builder_rt=enpgequlsevs5jl4gtl6
          builder_gw=enpkq16qa4ismtl2lap5

          if yc compute instance get --id "$builder_vm" --folder-id "$folder" --format json > "$RUNNER_TEMP/builder-vm.json" 2>/dev/null; then
            jq -e '.name=="telegram-reader-builder-temp" and .status=="STOPPED" and .boot_disk.disk_id=="fhmrot9tje8e7pg7teqb"' "$RUNNER_TEMP/builder-vm.json" >/dev/null
            yc compute instance delete --id "$builder_vm" --folder-id "$folder" >/dev/null
          fi

          if yc compute disk get --id "$builder_disk" --folder-id "$folder" --format json > "$RUNNER_TEMP/builder-disk.json" 2>/dev/null; then
            jq -e '.id=="fhmrot9tje8e7pg7teqb" and .size=="21474836480"' "$RUNNER_TEMP/builder-disk.json" >/dev/null
            yc compute disk delete --id "$builder_disk" --folder-id "$folder" >/dev/null
          fi

          if yc vpc subnet get --id "$builder_subnet" --folder-id "$folder" --format json > "$RUNNER_TEMP/builder-subnet.json" 2>/dev/null; then
            jq -e '.name=="telegram-builder-subnet-temp" and .route_table_id=="enpgequlsevs5jl4gtl6"' "$RUNNER_TEMP/builder-subnet.json" >/dev/null
            yc vpc subnet delete --id "$builder_subnet" --folder-id "$folder" >/dev/null
          fi

          if yc vpc route-table get --id "$builder_rt" --folder-id "$folder" --format json > "$RUNNER_TEMP/builder-rt.json" 2>/dev/null; then
            jq -e '.name=="telegram-builder-rt-temp"' "$RUNNER_TEMP/builder-rt.json" >/dev/null
            yc vpc route-table delete --id "$builder_rt" --folder-id "$folder" >/dev/null
          fi

          if yc vpc gateway get --id "$builder_gw" --folder-id "$folder" --format json > "$RUNNER_TEMP/builder-gw.json" 2>/dev/null; then
            jq -e '.name=="telegram-builder-nat-temp"' "$RUNNER_TEMP/builder-gw.json" >/dev/null
            yc vpc gateway delete --id "$builder_gw" --folder-id "$folder" >/dev/null
          fi

          for check in instance disk subnet route gateway; do
            case "$check" in
              instance) yc compute instance get --id "$builder_vm" --folder-id "$folder" >/dev/null 2>&1 && exit 1 || true ;;
              disk) yc compute disk get --id "$builder_disk" --folder-id "$folder" >/dev/null 2>&1 && exit 1 || true ;;
              subnet) yc vpc subnet get --id "$builder_subnet" --folder-id "$folder" >/dev/null 2>&1 && exit 1 || true ;;
              route) yc vpc route-table get --id "$builder_rt" --folder-id "$folder" >/dev/null 2>&1 && exit 1 || true ;;
              gateway) yc vpc gateway get --id "$builder_gw" --folder-id "$folder" >/dev/null 2>&1 && exit 1 || true ;;
            esac
          done
          echo BUILDER_CONTOUR_CLEANUP_PASS

      - name: Remove obsolete Telegram smoke and cutover containers
        shell: bash
        run: |
          set -euo pipefail
          folder=b1gk4p83brasi8g811jv
          test "$(yc serverless container get telegram-reader-serverless --folder-id "$folder" --format json | jq -r '.name')" = telegram-reader-serverless
          test "$(yc serverless container get telegram-reader-media --folder-id "$folder" --format json | jq -r '.name')" = telegram-reader-media
          for name in telegram-relay-serverless-smoke telegram-reader-serverless-cutover-test telegram-reader-serverless-smoke; do
            if yc serverless container get "$name" --folder-id "$folder" >/dev/null 2>&1; then
              yc serverless container delete "$name" --folder-id "$folder" >/dev/null
            fi
            if yc serverless container get "$name" --folder-id "$folder" >/dev/null 2>&1; then
              echo "TEST_CONTAINER_STILL_EXISTS=$name"
              exit 1
            fi
          done
          echo TEST_CONTAINERS_CLEANUP_PASS

      - name: Remove obsolete builder SSH security-group rule
        shell: bash
        run: |
          set -euo pipefail
          folder=b1gk4p83brasi8g811jv
          sg=enpocnvnpdu2goj9nkjn
          rule=enpbefq221lqv8qh15h9
          if yc vpc security-group get "$sg" --folder-id "$folder" --format json | jq -e --arg r "$rule" 'any(.rules[]?; .id==$r and .description=="telegram-builder-internal-ssh")' >/dev/null; then
            yc vpc security-group update-rules "$sg" --folder-id "$folder" --delete-rule-id "$rule" >/dev/null
          fi
          if yc vpc security-group get "$sg" --folder-id "$folder" --format json | jq -e --arg r "$rule" 'any(.rules[]?; .id==$r)' >/dev/null; then
            echo BUILDER_SSH_RULE_STILL_EXISTS
            exit 1
          fi
          echo BUILDER_SSH_RULE_CLEANUP_PASS

      - name: Post-cleanup safety and rollback verification
        shell: bash
        run: |
          set -euo pipefail
          folder=b1gk4p83brasi8g811jv
          prod_vm=fhm7p41jpj4uc2c6buou
          state_disk=fhm6hcjd5blbrbg8oine
          vm="$(yc compute instance get --id "$prod_vm" --folder-id "$folder" --format json)"
          echo "$vm" | jq -e --arg d "$state_disk" '.name=="telegram-news-reader" and .status=="STOPPED" and ((.network_interfaces[0].primary_v4_address.one_to_one_nat.address // "")=="") and any(.secondary_disks[]?; .disk_id==$d)' >/dev/null
          disk="$(yc compute disk get --id "$state_disk" --folder-id "$folder" --format json)"
          echo "$disk" | jq -e '.name=="telegram-reader-state" and .status=="READY" and .id=="fhm6hcjd5blbrbg8oine"' >/dev/null
          yc serverless container get telegram-reader-serverless --folder-id "$folder" >/dev/null
          yc serverless container get telegram-reader-media --folder-id "$folder" >/dev/null
          url="$(yc serverless container get telegram-reader-serverless --folder-id "$folder" --format json | jq -r '.url')"; url="${url%/}"
          token="$(yc iam create-token)"
          body="$(curl -fsS --max-time 30 -H "Authorization: Bearer $token" "$url/health")"
          echo "$body" | jq -e '.status=="ok" and .telegram_authorized==true and .allowed_chats==9' >/dev/null
          echo STATE_DISK_PRESERVED_PASS
          echo TELEGRAM_LEGACY_PAID_CLEANUP_PASS

      - name: Cleanup credential file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP"/old-address.json "$RUNNER_TEMP"/builder-*.json
