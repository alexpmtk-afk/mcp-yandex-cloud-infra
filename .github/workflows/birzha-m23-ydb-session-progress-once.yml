name: BIRZHA M23 YDB raw D1 progress once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/birzha-m23-ydb-session-progress-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - name: Checkout infrastructure source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: infra
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Mint viewer IAM token
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/yc-key.json"
          chmod 600 "$RUNNER_TEMP/yc-key.json"
          python -m pip install --disable-pip-version-check 'PyJWT==2.10.0' cryptography
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          import jwt
          key=json.loads((Path(os.environ['RUNNER_TEMP'])/'yc-key.json').read_text())
          now=int(time.time())
          signed=jwt.encode({'aud':'https://iam.api.cloud.yandex.net/iam/v1/tokens','iss':key['service_account_id'],'iat':now,'exp':now+3600},key['private_key'],algorithm='PS256',headers={'kid':key['id']})
          req=urllib.request.Request('https://iam.api.cloud.yandex.net/iam/v1/tokens',data=json.dumps({'jwt':signed}).encode(),headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: token=json.loads(r.read())['iamToken']
          print(f'::add-mask::{token}')
          p=Path(os.environ['RUNNER_TEMP'])/'token'; p.write_text(token); p.chmod(0o600)
          PY

      - name: Read YDB endpoint
        shell: bash
        env:
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          cd infra
          terraform -chdir=terraform/birzha_test init -reconfigure -input=false -lockfile=readonly \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" \
            -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY" >/dev/null
          terraform -chdir=terraform/birzha_test output -json > "$RUNNER_TEMP/o.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'o.json').read_text())
          (Path(os.environ['RUNNER_TEMP'])/'endpoint').write_text(d['ydb_connection_string']['value'])
          PY

      - name: Query raw D1 progress read-only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'ydb[yc]==3.31.4'
          python - <<'PY'
          import json, os
          from pathlib import Path
          import ydb
          root=Path(os.environ['RUNNER_TEMP'])
          driver=ydb.Driver(connection_string=(root/'endpoint').read_text().strip(),credentials=ydb.AccessTokenCredentials((root/'token').read_text().strip()))
          driver.wait(timeout=20,fail_fast=True)
          pool=ydb.QuerySessionPool(driver)
          def rows(query):
              result=pool.execute_with_retries(query,retry_settings=ydb.RetrySettings(idempotent=True))
              out=[]
              for rs in (result if isinstance(result,list) else list(result)):
                  out.extend(list(getattr(rs,'rows',[]) or []))
              return out
          def val(row,key):
              try: return row[key]
              except Exception: return getattr(row,key,None)
          try:
              sessions=rows('''SELECT symbol, COUNT(*) AS cnt, MIN(trade_date) AS first_date, MAX(trade_date) AS last_date FROM `historical_candles_sessions` GROUP BY symbol ORDER BY symbol;''')
              candles=rows('''SELECT secid, COUNT(*) AS cnt, MIN(begin) AS first_begin, MAX(begin) AS last_begin FROM `historical_candles` WHERE timeframe = "D1" GROUP BY secid ORDER BY secid;''')
              verified=rows('''SELECT symbol, timeframe, from_date, till_date FROM `historical_candles_verified_ranges` WHERE timeframe = "D1" ORDER BY symbol, from_date, till_date;''')
              session_verified=rows('''SELECT symbol, from_date, till_date FROM `historical_candles_session_verified_ranges` ORDER BY symbol, from_date, till_date;''')
              sber_session_rows=rows('''SELECT trade_date FROM `historical_candles_sessions` WHERE symbol = "SBER#D1_SESSION_V1" AND trade_date >= "2020-03-07" AND trade_date <= "2024-12-31" ORDER BY trade_date;''')
              sber_candle_rows=rows('''SELECT begin FROM `historical_candles` WHERE secid = "SBER" AND timeframe = "D1" AND begin >= "2020-03-07" AND begin < "2025-01-01" ORDER BY begin;''')
              sber_sessions={str(val(r,'trade_date'))[:10] for r in sber_session_rows}
              sber_candles={str(val(r,'begin'))[:10] for r in sber_candle_rows}
              missing=sorted(sber_sessions-sber_candles)
              unexpected=sorted(sber_candles-sber_sessions)
              payload={
                  'session_rows':[{'symbol':str(val(r,'symbol')),'count':int(val(r,'cnt') or 0),'first_date':str(val(r,'first_date') or ''),'last_date':str(val(r,'last_date') or '')} for r in sessions],
                  'd1_candle_rows':[{'secid':str(val(r,'secid')),'count':int(val(r,'cnt') or 0),'first_begin':str(val(r,'first_begin') or ''),'last_begin':str(val(r,'last_begin') or '')} for r in candles],
                  'd1_verified_ranges':[{'symbol':str(val(r,'symbol')),'from_date':str(val(r,'from_date')),'till_date':str(val(r,'till_date'))} for r in verified],
                  'session_verified_ranges':[{'symbol':str(val(r,'symbol')),'from_date':str(val(r,'from_date')),'till_date':str(val(r,'till_date'))} for r in session_verified],
                  'sber_d1_gap':{
                      'expected_sessions':len(sber_sessions),
                      'stored_candle_dates':len(sber_candles),
                      'missing_count':len(missing),
                      'missing_dates':missing[:100],
                      'extra_candle_count':len(unexpected),
                      'extra_candle_dates':unexpected[:100],
                  },
              }
              (root/'raw-progress.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
              print('SBER_D1_GAP='+json.dumps(payload['sber_d1_gap'],sort_keys=True))
          finally:
              pool.stop(); driver.stop(timeout=5)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: birzha-m23-ydb-raw-d1-progress
          path: ${{ runner.temp }}/raw-progress.json
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/token" "$RUNNER_TEMP/endpoint" "$RUNNER_TEMP/o.json"
