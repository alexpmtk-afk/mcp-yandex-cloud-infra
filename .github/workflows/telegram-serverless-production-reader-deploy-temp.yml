name: Telegram Serverless Production Reader Deploy Temp

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-serverless-production-reader-deploy-temp.yml]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create tg-prod-reader || true
          yc config profile activate tg-prod-reader
          yc config set service-account-key "$key"
          yc config set folder-id b1gk4p83brasi8g811jv

      - name: Deploy stable private production Reader
        shell: bash
        run: |
          set -euo pipefail
          folder=b1gk4p83brasi8g811jv
          name=telegram-reader-serverless
          image='cr.yandex/crphagvid8e8g5pp4fpe/telegram-news-reader:media-ebe405f2765d'
          if ! yc serverless container list --folder-id "$folder" --format json | jq -e --arg n "$name" '.[]|select(.name==$n)' >/dev/null; then
            yc serverless container create --folder-id "$folder" --name "$name" >/dev/null
          fi
          yc serverless container revision deploy \
            --folder-id "$folder" --container-name "$name" \
            --runtime http --image "$image" \
            --cores 1 --memory 512MB --concurrency 1 --execution-timeout 120s \
            --service-account-id ajeaad0m00gncv22tagf \
            --environment LOCKBOX_RUNTIME_SECRET_ID=e6qnt0bt655jltrr5sid \
            --environment TELEGRAM_DATABASE_PATH=/tmp/telegram.db \
            --environment TELEGRAM_SESSION_PATH=/tmp/telegram_news \
            --environment TELEGRAM_MEDIA_PATH=/tmp/media \
            --environment COLLECTOR_ENABLED=false >/dev/null
          url="$(yc serverless container get "$name" --folder-id "$folder" --format json | jq -r '.url')"
          url="${url%/}"
          token="$(yc iam create-token)"
          ok=0
          for attempt in $(seq 1 18); do
            body="$(curl -sS --max-time 30 -H "Authorization: Bearer $token" "$url/health" || true)"
            if echo "$body" | jq -e '.status=="ok" and .telegram_authorized==true and .allowed_chats==9 and .media_storage=="enabled"' >/dev/null 2>&1; then ok=1; break; fi
            sleep 5
          done
          test "$ok" -eq 1
          public_code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$url/internal/chats")"
          test "$public_code" = 401 -o "$public_code" = 403
          echo PRODUCTION_SERVERLESS_READER_PASS

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json"
