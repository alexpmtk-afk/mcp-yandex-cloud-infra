name: M24 Corrected Worker Deploy Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m24-worker-deploy-corrected-once.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: birzha-m24-corrected-worker-deploy
  cancel-in-progress: false

env:
  TF_DIR: terraform/birzha_test
  DEPLOYER_SERVICE_ACCOUNT_ID: ajecdjjrkdo1t3itpl9k
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/mcp-yandex-cloud-infra@1349853397:environment:test
  WORKER_SOURCE_SHA: 02b1ae09040903d59615478b664ba3f9c526df92
  WORKER_IMAGE: cr.yandex/crpk5qvf4p7kcqil2u3v/birzha-mcp-forecast@sha256:bc8a8041bfa37831195f90ccb973fb318a7e033fcf6b08c568e69d7854cf03be
  WORKER_ID: bbamdg0po6fkukhod2e9
  TIMER_ID: a1s4ho32v7dha59aeu60
  PUBLIC_IMAGE: cr.yandex/crpk5qvf4p7kcqil2u3v/birzha-mcp-forecast@sha256:5db7e3b1bbd69ee0c797d1d9a5a9289633914ef9f360f3d0f45187cb219113fc
  PUBLIC_SHA: b6ce037915ee993f2758f2ff6b29341f15554308
  PUBLIC_HOSTS: d5d6sgh96p1fs4mnlfsr.0ly8ed4d.apigw.yandexcloud.net,d5d6sgh96p1fs4mnlfsr.0ly8ed4d.apigw.yandexcloud.net:*
  PUBLIC_ORIGINS: https://chatgpt.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Mint Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          A="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          S='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && S='&'
          R="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${S}audience=${A}")"
          J="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$R")"
          echo "::add-mask::$J"
          python - "$J" <<'PY'
          import base64,json,os,sys
          p=sys.argv[1].split('.')[1]; p += '='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          assert c.get('sub')==os.environ['EXPECTED_OIDC_SUBJECT']
          assert c.get('aud')==os.environ['OIDC_AUDIENCE']
          assert c.get('ref')=='refs/heads/main'
          assert c.get('environment')=='test'
          print('M24_CORRECTED_DEPLOY_OIDC=PASS')
          PY
          X="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${DEPLOYER_SERVICE_ACCOUNT_ID}" --data-urlencode "subject_token=${J}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          T="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$X")"
          test -n "$T"; echo "::add-mask::$T"; umask 077; printf '%s' "$T" > "$RUNNER_TEMP/iam-token"

      - name: Install yc and initialize Terraform
        shell: bash
        env:
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tar.gz"
          tar -xzf "$RUNNER_TEMP/yc.tar.gz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          terraform -chdir="$TF_DIR" init -reconfigure -input=false -lockfile=readonly \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" \
            -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY" >/dev/null
          terraform -chdir="$TF_DIR" validate

      - name: Preflight protected resources
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" show -json > "$RUNNER_TEMP/state-before.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'state-before.json').read_text())
          rs=s['values']['root_module']['resources']; by={r['address']:r['values'] for r in rs}
          m=by['yandex_serverless_container.mcp[0]']; i=m['image'][0]; e=i.get('environment') or {}
          assert i['url']==os.environ['PUBLIC_IMAGE']; assert e['BIRZHA_SOURCE_COMMIT']==os.environ['PUBLIC_SHA']
          assert e.get('MCP_ALLOWED_HOSTS','')==os.environ['PUBLIC_HOSTS']; assert e.get('MCP_ALLOWED_ORIGINS','')==os.environ['PUBLIC_ORIGINS']
          assert by['yandex_serverless_container.orchestrator_worker[0]']['id']==os.environ['WORKER_ID']
          assert by['yandex_function_trigger.orchestrator_timer[0]']['id']==os.environ['TIMER_ID']
          assert 'yandex_resourcemanager_folder_iam_member.m24_observability_logging_reader[0]' in by
          assert 'yandex_resourcemanager_folder_iam_member.m24_observability_monitoring_viewer[0]' in by
          print('M24_PROTECTED_STATE=PASS')
          print('M24_OBSERVABILITY_PRESERVED=PASS')
          PY
          TOKEN="$(cat "$RUNNER_TEMP/iam-token")"
          YC_IAM_TOKEN="$TOKEN" "$RUNNER_TEMP/yc/yc" serverless trigger get "$TIMER_ID" --format=json > "$RUNNER_TEMP/timer.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'timer.json').read_text())
          assert d.get('status')=='PAUSED'; assert d.get('id')==os.environ['TIMER_ID']; assert os.environ['WORKER_ID'] in json.dumps(d)
          print('M24_TIMER_PAUSED=PASS')
          PY

      - name: Strict worker-only plan
        shell: bash
        run: |
          set -euo pipefail
          export TF_VAR_yc_token="$(cat "$RUNNER_TEMP/iam-token")"
          terraform -chdir="$TF_DIR" plan -input=false -no-color -out="$RUNNER_TEMP/plan" \
            -var="mcp_image_url=${PUBLIC_IMAGE}" \
            -var="source_commit_sha=${PUBLIC_SHA}" \
            -var="mcp_allowed_hosts=${PUBLIC_HOSTS}" \
            -var="mcp_allowed_origins=${PUBLIC_ORIGINS}" \
            -var="m24_worker_image_url=${WORKER_IMAGE}" \
            -var="m24_worker_source_sha=${WORKER_SOURCE_SHA}" \
            -var="m24_infra_oidc_bootstrap_enabled=false" \
            -var="m24_observability_probe_enabled=true"
          terraform -chdir="$TF_DIR" show -json "$RUNNER_TEMP/plan" > "$RUNNER_TEMP/plan.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads((Path(os.environ['RUNNER_TEMP'])/'plan.json').read_text())
          c=[]
          for r in p.get('resource_changes') or []:
              a=(r.get('change') or {}).get('actions') or []
              if a not in (['no-op'],['read']): c.append((r.get('address'),a))
          assert c==[('yandex_serverless_container.orchestrator_worker[0]',['update'])], c
          print('M24_STRICT_WORKER_ONLY_PLAN=PASS')
          PY

      - name: Apply saved worker-only plan
        shell: bash
        run: |
          set -euo pipefail
          export TF_VAR_yc_token="$(cat "$RUNNER_TEMP/iam-token")"
          terraform -chdir="$TF_DIR" apply -input=false -auto-approve "$RUNNER_TEMP/plan"
          echo 'M24_CORRECTED_WORKER_APPLY=PASS'

      - name: Verify applied state and zero drift
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" show -json > "$RUNNER_TEMP/state-after.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'state-after.json').read_text()); rs=s['values']['root_module']['resources']; by={r['address']:r['values'] for r in rs}
          w=by['yandex_serverless_container.orchestrator_worker[0]']; i=w['image'][0]; e=i.get('environment') or {}
          assert w['id']==os.environ['WORKER_ID']; assert i['url']==os.environ['WORKER_IMAGE']; assert e['BIRZHA_SOURCE_COMMIT']==os.environ['WORKER_SOURCE_SHA']
          assert (i.get('command') or [])==['python','-m','birzha.worker']; assert e.get('BIRZHA_ORCHESTRATOR_WORKER')=='true'; assert e.get('BIRZHA_STATE_BACKEND')=='ydb'
          m=by['yandex_serverless_container.mcp[0]']; mi=m['image'][0]; me=mi.get('environment') or {}
          assert mi['url']==os.environ['PUBLIC_IMAGE']; assert me['BIRZHA_SOURCE_COMMIT']==os.environ['PUBLIC_SHA']
          assert by['yandex_function_trigger.orchestrator_timer[0]']['id']==os.environ['TIMER_ID']
          assert 'yandex_resourcemanager_folder_iam_member.m24_observability_logging_reader[0]' in by
          assert 'yandex_resourcemanager_folder_iam_member.m24_observability_monitoring_viewer[0]' in by
          print('M24_CORRECTED_WORKER_STATE=PASS'); print('PUBLIC_MCP_UNCHANGED=PASS'); print('M24_OBSERVABILITY_STILL_PRESENT=PASS')
          PY
          TOKEN="$(cat "$RUNNER_TEMP/iam-token")"
          YC_IAM_TOKEN="$TOKEN" "$RUNNER_TEMP/yc/yc" serverless trigger get "$TIMER_ID" --format=json > "$RUNNER_TEMP/timer-after.json"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads((Path(__import__('os').environ['RUNNER_TEMP'])/'timer-after.json').read_text()); assert d.get('status')=='PAUSED'
          print('M24_TIMER_STILL_PAUSED=PASS')
          PY
          export TF_VAR_yc_token="$TOKEN"
          set +e
          terraform -chdir="$TF_DIR" plan -detailed-exitcode -input=false -no-color \
            -var="mcp_image_url=${PUBLIC_IMAGE}" -var="source_commit_sha=${PUBLIC_SHA}" \
            -var="mcp_allowed_hosts=${PUBLIC_HOSTS}" -var="mcp_allowed_origins=${PUBLIC_ORIGINS}" \
            -var="m24_worker_image_url=${WORKER_IMAGE}" -var="m24_worker_source_sha=${WORKER_SOURCE_SHA}" \
            -var="m24_infra_oidc_bootstrap_enabled=false" -var="m24_observability_probe_enabled=true" > "$RUNNER_TEMP/zero.txt"
          rc=$?; set -e
          test "$rc" = 0 || { cat "$RUNNER_TEMP/zero.txt"; exit "$rc"; }
          echo 'M24_WORKER_ZERO_DRIFT=PASS'

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/iam-token" "$RUNNER_TEMP/yc" "$RUNNER_TEMP/yc.tar.gz" "$RUNNER_TEMP/state-before.json" "$RUNNER_TEMP/state-after.json" "$RUNNER_TEMP/timer.json" "$RUNNER_TEMP/timer-after.json" "$RUNNER_TEMP/plan" "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/zero.txt"
