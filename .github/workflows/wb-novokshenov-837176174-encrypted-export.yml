          kPE/iP65hrzY+iv/ecSk7TNMqgkpt8WI8z02E2ePZcSO91ImB67ueV9JIbRHF5/a
          VYFarD6EiWHVRNvXfMuppdffjqDSljFZC2m+e5g35uggc0Lynxy7ECBcy0gyKhAa
          lmc9+OT+vHWqknnVrYFdb7Zk1zvSFYaenbaG+FM0Byal
          -----END CERTIFICATE-----
          CERT
          python -m pip install --quiet 'httpx>=0.27,<1'
          timeout 840s python -u - <<'PY'
          import csv, hashlib, itertools, json, os, time
          import httpx

          EXPECTED_SHA='7858ad6c85f458d6b0063ccdf04e465185f2ce001b613e756eae6e1832f5946b'
          REPORT_ID=837176174

          def unpack(r):
              r.raise_for_status()
              for line in r.text.splitlines():
                  if line.startswith('data:'):
                      return json.loads(line[5:].strip())
              return r.json() if r.text.strip() else None

          def retry_after(data):
              return float(data.get('retry_after_seconds',0) or data.get('retry_after_sec',0) or 0)

          def is_rate_limited(data):
              return retry_after(data)>0 and (data.get('error_type')=='rate_limit' or data.get('error') in ('rate_limit','rate_limit_busy'))

          timeout=httpx.Timeout(connect=10.0,read=90.0,write=30.0,pool=10.0)
          headers={'Authorization':'Bearer '+os.environ['MCP_BEARER'],'Accept':'application/json, text/event-stream','Content-Type':'application/json'}
          ids=itertools.count(1)
          with httpx.Client(timeout=timeout,follow_redirects=True) as c:
              r=c.post(os.environ['MCP_URL'],headers=headers,json={'jsonrpc':'2.0','id':next(ids),'method':'initialize','params':{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'encrypted-weekly-export','version':'1'}}})
              init=unpack(r); assert init and 'result' in init,init
              h=dict(headers); sid=r.headers.get('mcp-session-id')
              if sid: h['Mcp-Session-Id']=sid
              h['MCP-Protocol-Version']=init['result'].get('protocolVersion','2025-06-18')
              n=c.post(os.environ['MCP_URL'],headers=h,json={'jsonrpc':'2.0','method':'notifications/initialized'}); assert n.status_code in (200,202)
              def rpc(method,params=None):
                  rr=c.post(os.environ['MCP_URL'],headers=h,json={'jsonrpc':'2.0','id':next(ids),'method':method,'params':params or {}})
                  d=unpack(rr); assert d and 'result' in d,(method,d); return d['result']
              def call(name,args):
                  result=rpc('tools/call',{'name':name,'arguments':args}); assert not result.get('isError'),(name,result)
                  text=next((x.get('text') for x in result.get('content',[]) if x.get('type')=='text'),None); assert text is not None,name
                  return json.loads(text)
              def call_wait(name,args):
                  deadline=time.monotonic()+150
                  while True:
                      data=call(name,args)
                      if not is_rate_limited(data): return data
                      wait=max(1.0,retry_after(data)+1.0)
                      assert time.monotonic()+wait <= deadline,(name,data)
                      print(f'WAIT_FOR_WB_QUOTA seconds={wait:.2f}',flush=True)
                      time.sleep(wait)

              all_rows=[]; rrd_id=0
              while True:
                  detail=call_wait('wb_get_realization_report_by_id',{'seller':'wb_novokshenov','report_id':REPORT_ID,'limit':100000,'rrd_id':rrd_id})
                  assert detail.get('ok') is True,detail
                  status=int(detail.get('status',0))
                  if status==204: break
                  assert status==200,detail
                  rows=detail.get('data') or []
                  assert isinstance(rows,list) and rows,detail
                  all_rows.extend(rows)
                  new_rrd=rows[-1].get('rrdId')
                  assert new_rrd is not None and int(new_rrd)!=int(rrd_id),(rrd_id,new_rrd)
                  rrd_id=int(new_rrd)

              columns=[]; seen=set()
              for row in all_rows:
                  for key in row:
                      if key not in seen: seen.add(key); columns.append(key)
              def scalar(v):
                  if v is None: return ''
                  if isinstance(v,(dict,list)): return json.dumps(v,ensure_ascii=False,separators=(',',':'))
                  if isinstance(v,bool): return 'true' if v else 'false'
                  return str(v)
              path=os.environ['CSV_PATH']
              with open(path,'w',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=columns,extrasaction='raise',lineterminator='\n'); w.writeheader()
                  for row in all_rows: w.writerow({k:scalar(row.get(k)) for k in columns})
              sha=hashlib.sha256(open(path,'rb').read()).hexdigest()
              assert sha==EXPECTED_SHA,(sha,EXPECTED_SHA)
              assert len(all_rows)==6 and len(columns)==90,(len(all_rows),len(columns))
              print(f'PLAINTEXT_VERIFICATION=PASS rows={len(all_rows)} columns={len(columns)} sha256={sha}',flush=True)
          PY
          openssl cms -encrypt -binary -aes-256-cbc -outform DER -in "$CSV_PATH" -out "$ENC_PATH" "$CERT_PATH"
          echo 'ENCRYPTED_EXPORT_BEGIN'
          base64 -w0 "$ENC_PATH"
          echo
          echo 'ENCRYPTED_EXPORT_END'
          echo "ENCRYPTED_BYTES=$(wc -c < "$ENC_PATH")"
          rm -f "$CSV_PATH" "$ENC_PATH" "$CERT_PATH"
          echo 'PLAINTEXT_AND_CIPHERTEXT_CLEANUP=PASS'

      - name: Cleanup credentials and temporary files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/sec.json" "$RUNNER_TEMP/bearer" "$RUNNER_TEMP/wb_novokshenov__weekly__2026-09-01__2026-09-06__report_837176174.csv" "$RUNNER_TEMP/report_837176174.csv.p7m" "$RUNNER_TEMP/archive-transfer-cert.pem"
