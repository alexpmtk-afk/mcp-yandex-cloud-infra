name: Google Drive Bridge v1 End-to-End Finisher CI

on:
  pull_request:
    paths:
      - 'tools/finish_bridge_v1.py'
      - 'tools/run_finish_bridge_v1.py'
      - 'tools/resume_bridge_v1_apps_script.py'
      - 'tools/run_bridge_v1_owner_bootstrap.ps1'
      - 'shared/google-drive-bridge/bootstrap.gs'
      - '.github/workflows/google-drive-bridge-v1-finish-ci.yml'
      - '.github/workflows/google-drive-bridge-v1-lockbox-bootstrap.yml'
      - '.github/workflows/marketplaces-drive-bridge-v1-acceptance.yml'
      - '.github/workflows/birzha-drive-bridge-v1-acceptance.yml'
      - '.github/workflows/google-drive-bridge-v1-cross-project-acceptance.yml'
      - '.github/workflows/marketplaces-drive-bridge-v1-cutover-gate.yml'
      - '.github/workflows/birzha-drive-bridge-v1-cutover-gate.yml'
      - '.github/workflows/marketplaces-drive-bridge-v1-cutover.yml'
      - '.github/workflows/birzha-drive-bridge-v1-cutover.yml'
  push:
    branches:
      - main
      - bridge-v1-one-command-finish
      - bridge-v1-windows-exec-fix
      - bridge-v1-windows-exec-fix-v2
      - bridge-v1-clasp-auth-fix
      - bridge-v1-appsscript-redeploy-retry-v2
      - bridge-v1-appsscript-all-transitions-retry
    paths:
      - 'tools/finish_bridge_v1.py'
      - 'tools/run_finish_bridge_v1.py'
      - 'tools/resume_bridge_v1_apps_script.py'
      - 'tools/run_bridge_v1_owner_bootstrap.ps1'
      - 'shared/google-drive-bridge/bootstrap.gs'
      - '.github/workflows/google-drive-bridge-v1-finish-ci.yml'
      - '.github/workflows/google-drive-bridge-v1-lockbox-bootstrap.yml'
      - '.github/workflows/marketplaces-drive-bridge-v1-acceptance.yml'
      - '.github/workflows/birzha-drive-bridge-v1-acceptance.yml'
      - '.github/workflows/google-drive-bridge-v1-cross-project-acceptance.yml'
      - '.github/workflows/marketplaces-drive-bridge-v1-cutover-gate.yml'
      - '.github/workflows/birzha-drive-bridge-v1-cutover-gate.yml'
      - '.github/workflows/marketplaces-drive-bridge-v1-cutover.yml'
      - '.github/workflows/birzha-drive-bridge-v1-cutover.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile end-to-end scripts
        run: |
          python -m py_compile \
            tools/bootstrap_bridge_v1_apps_script.py \
            tools/finish_bridge_v1.py \
            tools/run_finish_bridge_v1.py \
            tools/resume_bridge_v1_apps_script.py
      - name: Validate clasp named-user auth is fail-closed
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, sys
          sys.path.insert(0, 'tools')
          import finish_bridge_v1 as f
          no_auth = subprocess.CompletedProcess([], 0, stdout=json.dumps({'loggedIn': False, 'clientType': 'google-provided'}), stderr='')
          assert f._clasp_login_state(no_auth) == (False, '')
          yes_auth = subprocess.CompletedProcess([], 0, stdout=json.dumps({'loggedIn': True, 'email': 'owner@example.invalid'}), stderr='')
          assert f._clasp_login_state(yes_auth) == (True, 'owner@example.invalid')
          seen = {}
          def fake_run(args, **kwargs):
              seen['args'] = args
              return subprocess.CompletedProcess(args, 0, stdout='', stderr='')
          f.portable_run = fake_run
          f.portable_clasp(['show-authorized-user', '--json'], capture=True, check=False)
          assert seen['args'] == ['npx', '-y', f.base.CLASP_PACKAGE, 'show-authorized-user', '--user', f.base.CLASP_USER, '--json'], seen
          print('BRIDGE_V1_CLASP_AUTH_FAIL_CLOSED=PASS')
          PY
      - name: Validate Apps Script transient bootstrap retry
        shell: bash
        run: |
          python - <<'PY'
          import io, sys, urllib.error
          sys.path.insert(0, 'tools')
          import run_finish_bridge_v1 as r
          calls={'n':0}
          def flaky(url, token, project_id, secret):
              calls['n'] += 1
              if calls['n'] < 3:
                  raise urllib.error.HTTPError(url, 404, 'Not Found', {}, io.BytesIO())
              return None
          r._original_install_script_properties = flaky
          original_sleep = r.time.sleep
          r.time.sleep = lambda _: None
          try:
              r.install_script_properties_with_retry('https://example.invalid/exec','token','marketplaces','secret',timeout_seconds=5)
          finally:
              r.time.sleep = original_sleep
          assert calls['n'] == 3
          semantic={'n':0}
          def bad(url, token, project_id, secret):
              semantic['n'] += 1
              raise RuntimeError('BOOTSTRAP_CONFIGURATION_CONFLICT')
          r._original_install_script_properties = bad
          try:
              r.install_script_properties_with_retry('https://example.invalid/exec','token','marketplaces','secret',timeout_seconds=5)
              raise AssertionError('semantic bootstrap error was incorrectly retried/ignored')
          except RuntimeError as exc:
              assert 'BOOTSTRAP_CONFIGURATION_CONFLICT' in str(exc)
          assert semantic['n'] == 1
          print('BRIDGE_V1_APPS_SCRIPT_BOOTSTRAP_RETRY=PASS')
          PY
      - name: Validate Apps Script redeploy propagation retry
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          import run_finish_bridge_v1 as r
          calls={'n':0}
          def flaky(url, project_id, secret):
              calls['n'] += 1
              if calls['n'] < 3:
                  raise RuntimeError('temporary Apps Script propagation state')
              return {'ok': True}
          r._original_bridge_health = flaky
          original_sleep = r.time.sleep
          r.time.sleep = lambda _: None
          try:
              result = r.bridge_health_with_propagation_retry('https://example.invalid/exec','birzha','secret',timeout_seconds=5)
          finally:
              r.time.sleep = original_sleep
          assert result == {'ok': True}
          assert calls['n'] == 3
          print('BRIDGE_V1_APPS_SCRIPT_REDEPLOY_RETRY=PASS')
          PY
      - name: Validate bootstrap retirement propagation retry
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          import run_finish_bridge_v1 as r
          calls={'n':0}
          def flaky(url, project_id):
              calls['n'] += 1
              if calls['n'] < 2:
                  raise RuntimeError('old bootstrap version still served')
              return None
          r._original_prove_bootstrap_removed = flaky
          original_sleep = r.time.sleep
          r.time.sleep = lambda _: None
          try:
              r.prove_bootstrap_removed_with_retry('https://example.invalid/exec','birzha',timeout_seconds=5)
          finally:
              r.time.sleep = original_sleep
          assert calls['n'] == 2
          print('BRIDGE_V1_BOOTSTRAP_RETIREMENT_RETRY=PASS')
          PY
      - name: Validate resume discovery parser and deployment URL binding
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          import resume_bridge_v1_apps_script as r
          assert r._deployment_id_from_url('https://script.google.com/macros/s/AKfyExample_123/exec') == 'AKfyExample_123'
          assert r._deployment_id_from_url('https://example.invalid') == ''
          rows=r._json_list('[{"name":"X","scriptId":"S"}]')
          assert rows[0]['scriptId']=='S'
          rows=r._json_list('{"deployments":[{"deploymentId":"AKfyD"}]}')
          assert rows[0]['deploymentId']=='AKfyD'
          print('BRIDGE_V1_RESUME_DISCOVERY_PARSER=PASS')
          PY
      - name: Reject single-key Lockbox JSON parsing regression
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/workflows/google-drive-bridge-v1-lockbox-bootstrap.yml
            .github/workflows/marketplaces-drive-bridge-v1-acceptance.yml
            .github/workflows/birzha-drive-bridge-v1-acceptance.yml
            .github/workflows/google-drive-bridge-v1-cross-project-acceptance.yml
          )
          for f in "${files[@]}"; do
            if grep -E -- '--key[^\n]*--format[ =]+json' "$f"; then
              echo "Single-key Lockbox reads return raw values, not JSON: $f" >&2
              exit 1
            fi
          done
          echo 'BRIDGE_V1_LOCKBOX_SINGLE_KEY_RAW=PASS'
      - name: Reject recursive runtime stub scans over docs and tests
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/workflows/marketplaces-drive-bridge-v1-acceptance.yml
            .github/workflows/birzha-drive-bridge-v1-acceptance.yml
            .github/workflows/marketplaces-drive-bridge-v1-cutover-gate.yml
            .github/workflows/birzha-drive-bridge-v1-cutover-gate.yml
          )
          for f in "${files[@]}"; do
            if grep -Fq "grep -R -n 'NOT_IMPLEMENTED' shared/google-drive-bridge" "$f"; then
              echo "Runtime stub check must target executable source, not docs/tests: $f" >&2
              exit 1
            fi
            grep -Fq "grep -n 'NOT_IMPLEMENTED' shared/google-drive-bridge/bridge.gs" "$f"
          done
          echo 'BRIDGE_V1_RUNTIME_STUB_CHECK_SCOPE=PASS'
      - name: Require transient identity retry in Lockbox bootstrap
        shell: bash
        run: |
          set -euo pipefail
          f='.github/workflows/google-drive-bridge-v1-lockbox-bootstrap.yml'
          grep -Fq 'deadline = time.monotonic() + 180' "$f"
          grep -Fq 'exc.code in (404, 408, 425, 429)' "$f"
          grep -Fq '500 <= exc.code < 600' "$f"
          grep -Fq 'Bridge identity endpoint still propagating' "$f"
          grep -Fq "assert data.get('project_id') == os.environ['PROJECT']" "$f"
          grep -Fq "assert result.get('root_id') == os.environ['ROOT_ID']" "$f"
          echo 'BRIDGE_V1_LOCKBOX_IDENTITY_PROPAGATION_RETRY=PASS'
      - name: Validate resumable bootstrap secret rotation remains identity-locked
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'sameIdentity' shared/google-drive-bridge/bootstrap.gs
          grep -Fq "throw new Error('BOOTSTRAP_CONFIGURATION_CONFLICT')" shared/google-drive-bridge/bootstrap.gs
          grep -Fq "props.setProperty('MCP_DRIVE_BRIDGE_SECRET', secret)" shared/google-drive-bridge/bootstrap.gs
          grep -Fq 'rotated: !replayed' shared/google-drive-bridge/bootstrap.gs
          grep -Fq 'resume.deploy_or_reuse_project' tools/run_finish_bridge_v1.py
          echo 'BRIDGE_V1_RESUME_SECRET_ROTATION=PASS'
      - name: Validate final workflow chain
        shell: bash
        run: |
          set -euo pipefail
          f='tools/finish_bridge_v1.py'
          grep -Fq 'google-drive-bridge-v1-lockbox-bootstrap.yml' "$f"
          grep -Fq 'marketplaces-drive-bridge-v1-acceptance.yml' tools/bootstrap_bridge_v1_apps_script.py
          grep -Fq 'birzha-drive-bridge-v1-acceptance.yml' tools/bootstrap_bridge_v1_apps_script.py
          grep -Fq 'google-drive-bridge-v1-cross-project-acceptance.yml' "$f"
          grep -Fq 'marketplaces-drive-bridge-v1-cutover.yml' "$f"
          grep -Fq 'publish-m25-worker-image.yml' "$f"
          grep -Fq 'birzha-drive-bridge-v1-cutover.yml' "$f"
          grep -Fq 'BRIDGE_V1_END_TO_END_PRODUCTION_PASS' "$f"
          grep -Fq 'run_finish_bridge_v1.py' tools/run_bridge_v1_owner_bootstrap.ps1
          grep -Fq 'BRIDGE_V1_END_TO_END_PRODUCTION=PASS' tools/run_bridge_v1_owner_bootstrap.ps1
          test -f .github/workflows/marketplaces-drive-bridge-v1-cutover.yml
          test -f .github/workflows/birzha-drive-bridge-v1-cutover.yml
          echo 'BRIDGE_V1_END_TO_END_CHAIN=PASS'

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse owner command
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/run_bridge_v1_owner_bootstrap.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          'BRIDGE_V1_OWNER_COMMAND_PARSE=PASS'
      - name: Prove Python can execute Windows command shims
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0, 'tools'); import finish_bridge_v1 as f; p=f.portable_run(['npx','--version'], capture=True); assert p.returncode == 0 and p.stdout.strip(); print('BRIDGE_V1_WINDOWS_NPX_EXEC=PASS')"
