name: Google Drive Bridge v1 End-to-End Finisher CI

on:
  pull_request:
    paths:
      - 'tools/finish_bridge_v1.py'
      - 'tools/run_bridge_v1_owner_bootstrap.ps1'
      - '.github/workflows/google-drive-bridge-v1-finish-ci.yml'
      - '.github/workflows/marketplaces-drive-bridge-v1-cutover.yml'
      - '.github/workflows/birzha-drive-bridge-v1-cutover.yml'
  push:
    branches:
      - bridge-v1-one-command-finish
      - bridge-v1-windows-exec-fix
    paths:
      - 'tools/finish_bridge_v1.py'
      - 'tools/run_bridge_v1_owner_bootstrap.ps1'
      - '.github/workflows/google-drive-bridge-v1-finish-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile end-to-end scripts
        run: |
          python -m py_compile tools/bootstrap_bridge_v1_apps_script.py tools/finish_bridge_v1.py
      - name: Validate final workflow chain
        shell: bash
        run: |
          set -euo pipefail
          f='tools/finish_bridge_v1.py'
          grep -Fq 'google-drive-bridge-v1-lockbox-bootstrap.yml' "$f"
          grep -Fq 'marketplaces-drive-bridge-v1-acceptance.yml' tools/bootstrap_bridge_v1_apps_script.py
          grep -Fq 'birzha-drive-bridge-v1-acceptance.yml' tools/bootstrap_bridge_v1_apps_script.py
          grep -Fq 'google-drive-bridge-v1-cross-project-acceptance.yml' "$f"
          grep -Fq 'marketplaces-drive-bridge-v1-cutover.yml' "$f"
          grep -Fq 'publish-m25-worker-image.yml' "$f"
          grep -Fq 'birzha-drive-bridge-v1-cutover.yml' "$f"
          grep -Fq 'BRIDGE_V1_END_TO_END_PRODUCTION_PASS' "$f"
          grep -Fq 'finish_bridge_v1.py' tools/run_bridge_v1_owner_bootstrap.ps1
          grep -Fq 'BRIDGE_V1_END_TO_END_PRODUCTION=PASS' tools/run_bridge_v1_owner_bootstrap.ps1
          test -f .github/workflows/marketplaces-drive-bridge-v1-cutover.yml
          test -f .github/workflows/birzha-drive-bridge-v1-cutover.yml
          echo 'BRIDGE_V1_END_TO_END_CHAIN=PASS'

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse owner command
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/run_bridge_v1_owner_bootstrap.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          'BRIDGE_V1_OWNER_COMMAND_PARSE=PASS'
      - name: Prove Python can execute Windows command shims
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0, 'tools'); import finish_bridge_v1 as f; p=f.portable_run(['npx','--version'], capture=True); assert p.returncode == 0 and p.stdout.strip(); print('BRIDGE_V1_WINDOWS_NPX_EXEC=PASS')"
