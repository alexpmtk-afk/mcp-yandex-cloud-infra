name: Validate Marketplaces Google Drive Bridge v1 Readiness

on:
  pull_request:
    paths:
      - shared/google-drive-bridge/**
      - .github/workflows/marketplaces-drive-bridge-v1-bootstrap.yml
      - .github/workflows/marketplaces-drive-bridge-v1-acceptance.yml
      - .github/workflows/marketplaces-drive-bridge-v1-cutover-gate.yml
      - .github/workflows/marketplaces-drive-bridge-v1-static-validate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate central Protocol v1 alpha.2 contract tests
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'bridge_release=1.0.0-alpha.2' shared/google-drive-bridge/VERSION
          grep -q "BRIDGE_RELEASE = '1.0.0-alpha.2'" shared/google-drive-bridge/bridge.gs
          python -m pip install 'pytest>=8,<9' 'httpx>=0.27,<1'
          python -m pytest shared/google-drive-bridge/tests -q
          python -m compileall -q shared/google-drive-bridge/python_client shared/google-drive-bridge/scripts
          grep -q 'def large_download_start' shared/google-drive-bridge/python_client/bridge_client.py
          grep -q 'def large_download_poll' shared/google-drive-bridge/python_client/bridge_client.py
          grep -q 'def download_large_by_id' shared/google-drive-bridge/python_client/bridge_client.py
          test -f shared/google-drive-bridge/scripts/cross_project_acceptance.py
          echo 'SHARED_PROTOCOL_V1_ALPHA2_TESTS=PASS'

      - name: Validate Marketplaces readiness contract
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            .github/workflows/marketplaces-drive-bridge-v1-bootstrap.yml \
            .github/workflows/marketplaces-drive-bridge-v1-acceptance.yml \
            .github/workflows/marketplaces-drive-bridge-v1-cutover-gate.yml; do
            test -f "$file"
            grep -q 'workflow_dispatch:' "$file"
          done
          grep -q 'PROJECT_ID: marketplaces' .github/workflows/marketplaces-drive-bridge-v1-bootstrap.yml
          grep -q 'PROJECT_ID: marketplaces' .github/workflows/marketplaces-drive-bridge-v1-acceptance.yml
          grep -q 'EXPECTED_ROOT_ID: 1UVKUcFfDhCDk6nMHX1mWg9cRL05DT-OJ' .github/workflows/marketplaces-drive-bridge-v1-bootstrap.yml
          grep -q 'EXPECTED_ROOT_ID: 1UVKUcFfDhCDk6nMHX1mWg9cRL05DT-OJ' .github/workflows/marketplaces-drive-bridge-v1-acceptance.yml
          grep -q 'EXPECTED_BRIDGE_RELEASE: 1.0.0-alpha.2' .github/workflows/marketplaces-drive-bridge-v1-acceptance.yml
          grep -q 'marketplaces-google-drive-bridge-v1' .github/workflows/marketplaces-drive-bridge-v1-bootstrap.yml
          grep -q 'marketplaces-google-drive-bridge-v1' .github/workflows/marketplaces-drive-bridge-v1-acceptance.yml
          grep -q 'MARKETPLACES_GDRIVE_BRIDGE_V1_BOOTSTRAP_SECRET' .github/workflows/marketplaces-drive-bridge-v1-bootstrap.yml
          grep -q 'download_large_by_id' .github/workflows/marketplaces-drive-bridge-v1-acceptance.yml
          grep -q 'drive_files_download_lro' .github/workflows/marketplaces-drive-bridge-v1-acceptance.yml
          grep -Eqi 'concurr|parallel' .github/workflows/marketplaces-drive-bridge-v1-acceptance.yml
          echo 'MARKETPLACES_V1_ALPHA2_READINESS_CONTRACT=PASS'

      - name: Prove production deployment remains legacy
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_URL' .github/workflows/deploy-mcp-test.yml
          grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_SECRET' .github/workflows/deploy-mcp-test.yml
          ! grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_V1_URL' .github/workflows/deploy-mcp-test.yml
          ! grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_V1_SECRET' .github/workflows/deploy-mcp-test.yml
          ! grep -q 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_PROTOCOL=v1' .github/workflows/deploy-mcp-test.yml
          echo 'PRODUCTION_CUTOVER_PERFORMED=NO'
