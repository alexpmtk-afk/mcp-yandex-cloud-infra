name: Bootstrap Birzha Google Drive Bridge v1

on:
  workflow_dispatch:
    inputs:
      bridge_url:
        description: Dedicated Birzha Apps Script Bridge v1 /exec URL
        required: true
        type: string

permissions:
  contents: read

env:
  PROJECT_ID: birzha
  EXPECTED_ROOT_ID: 1A7IzjXYSCWReZXdtrPZgZgLTnFIifsT2
  EXPECTED_ROOT_NAME: Архив рыночных данных
  LOCKBOX_NAME: birzha-google-drive-bridge-v1
  LOCKBOX_KEY: gdrive_bridge_secret

concurrency:
  group: birzha-drive-bridge-v1-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate central Bridge v1 contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'bridge_release=1.0.0-alpha.2' shared/google-drive-bridge/VERSION
          grep -q "projectId: 'birzha'" shared/google-drive-bridge/deploy/birzha_config.gs
          grep -q "rootId: '$EXPECTED_ROOT_ID'" shared/google-drive-bridge/deploy/birzha_config.gs
          grep -q 'idempotency_key' shared/google-drive-bridge/PROTOCOL.md
          grep -q 'sheet_write_chunk' shared/google-drive-bridge/PROTOCOL.md
          echo 'BIRZHA_SHARED_BRIDGE_CONTRACT=PASS'

      - name: Validate dedicated Birzha Bridge identity before Lockbox bootstrap
        shell: bash
        env:
          BRIDGE_URL: ${{ inputs.bridge_url }}
          BOOTSTRAP_SECRET: ${{ secrets.BIRZHA_GDRIVE_BRIDGE_V1_BOOTSTRAP_SECRET }}
        run: |
          set -euo pipefail
          test -n "$BRIDGE_URL"
          test -n "$BOOTSTRAP_SECRET"
          echo "::add-mask::$BOOTSTRAP_SECRET"
          python - <<'PY'
          import json, os, urllib.request, uuid
          body={
            'secret':os.environ['BOOTSTRAP_SECRET'],
            'project_id':'birzha',
            'request_id':str(uuid.uuid4()),
            'action':'health',
            'payload':{},
          }
          req=urllib.request.Request(os.environ['BRIDGE_URL'],data=json.dumps(body).encode(),headers={'Content-Type':'application/json','Accept':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=60) as resp:
            data=json.loads(resp.read().decode())
          assert data.get('ok') is True, data
          assert data.get('project_id') == 'birzha', data
          assert data.get('request_id') == body['request_id'], data
          result=data.get('result') or {}
          assert result.get('root_id') == os.environ['EXPECTED_ROOT_ID'], data
          caps=result.get('capabilities') or {}
          assert caps.get('google_sheets_chunked') is True, data
          assert caps.get('fixed_root_file_id_guard') is True, data
          assert caps.get('global_script_lock') is False, data
          print('DEDICATED_BIRZHA_BRIDGE_IDENTITY=PASS')
          PY

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          ARCHIVE="$RUNNER_TEMP/yc.tgz"
          URL='https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz'
          curl --fail --silent --show-error --retry 5 --retry-all-errors -o "$ARCHIVE" "$URL"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate Yandex CI service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"

      - name: Store Birzha Bridge v1 secret in dedicated Lockbox
        shell: bash
        env:
          BOOTSTRAP_SECRET: ${{ secrets.BIRZHA_GDRIVE_BRIDGE_V1_BOOTSTRAP_SECRET }}
        run: |
          set -euo pipefail
          echo "::add-mask::$BOOTSTRAP_SECRET"
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="birzha-mcp-forecast-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r --arg n "$LOCKBOX_NAME" '.[]|select(.name==$n)|.id'|head -1)"
          test -n "$SECRET_ID"
          PAYLOAD="$RUNNER_TEMP/birzha-bridge-payload.json"
          python - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP']+'/birzha-bridge-payload.json','w',encoding='utf-8') as f:
            json.dump([{'key':'gdrive_bridge_secret','text_value':os.environ['BOOTSTRAP_SECRET']}],f,separators=(',',':'))
          PY
          chmod 600 "$PAYLOAD"
          yc lockbox secret add-version --id "$SECRET_ID" --description 'Birzha Google Drive Bridge Protocol v1' --payload - --format json --no-user-output < "$PAYLOAD" > "$RUNNER_TEMP/version.json"
          VERSION_ID="$(jq -r '.id // .response.id // empty' "$RUNNER_TEMP/version.json")"
          test -n "$VERSION_ID"
          echo 'BIRZHA_BRIDGE_V1_LOCKBOX_BOOTSTRAP=PASS'
          echo 'RUNTIME_BINDING_CHANGED=NO'

      - name: Cleanup credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/birzha-bridge-payload.json" "$RUNNER_TEMP/version.json"
