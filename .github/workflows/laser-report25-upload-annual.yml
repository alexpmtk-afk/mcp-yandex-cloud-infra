name: Laser Report 25 Upload Annual
on:
  push:
    branches: [fix/marketplaces-destroy-v1-lockbox-history]
    paths: ['.github/workflows/laser-report25-upload-annual.yml']
permissions:
  contents: read
concurrency:
  group: marketplaces-archive-queue-worker
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - name: Install
        run: |
          set -euo pipefail; mkdir -p "$RUNNER_TEMP/yc"; curl -fsSL --retry 5 --retry-delay 3 https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tgz"; tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"; chmod +x "$RUNNER_TEMP/yc/yc"; echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"; python -m pip install --quiet 'httpx>=0.27,<1'
      - name: Resolve V3 MCP
        id: live
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail; K="$RUNNER_TEMP/k"; umask 077; printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$K"; yc config profile create laser25-upload >/dev/null 2>&1 || true; yc config set service-account-key "$K"; F="$(yc resource-manager folder list --cloud-id b1gi4pr9msenirafh2c7 --format json|jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"; yc config set folder-id "$F"; S="$(yc lockbox secret list --folder-id "$F" --format json|jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"; yc lockbox secret list-versions --id "$S" --format json --no-user-output > "$RUNNER_TEMP/v"; V="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys//[])|index("gdrive_bridge_v1_secret")==null)|select((.payload_entry_keys//[])|index("mcp_bearer_token")!=null)]|sort_by(.created_at)|last|.id//empty' "$RUNNER_TEMP/v")"; test "$V" = e6qnvjc1fpqj2osspbtt; D="$(yc serverless api-gateway list --folder-id "$F" --format json|jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//empty')"; yc lockbox payload get --id "$S" --version-id "$V" --format json --no-user-output > "$RUNNER_TEMP/p"; B="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value//empty' "$RUNNER_TEMP/p")"; echo "::add-mask::$B"; printf '%s' "$B" > "$RUNNER_TEMP/b"; echo "url=https://${D}/mcp" >> "$GITHUB_OUTPUT"
      - name: Upload exactly one annual candidate
        env:
          MCP_URL: ${{ steps.live.outputs.url }}
        run: |
          set -euo pipefail; export MCP_BEARER="$(cat "$RUNNER_TEMP/b")"
          python -u - <<'PY'
          import itertools,json,os,httpx
          J='wb-finance-wb_laser_master-2026'; R=751229976
          def unpack(r):
            r.raise_for_status()
            for line in r.text.splitlines():
              if line.startswith('data:'): return json.loads(line[5:].strip())
            return r.json()
          h0={'Authorization':'Bearer '+os.environ['MCP_BEARER'],'Accept':'application/json, text/event-stream','Content-Type':'application/json'}; ids=itertools.count(1)
          with httpx.Client(timeout=httpx.Timeout(connect=15,read=540,write=30,pool=15),follow_redirects=True) as c:
            r=c.post(os.environ['MCP_URL'],headers=h0,json={'jsonrpc':'2.0','id':next(ids),'method':'initialize','params':{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'laser25-upload','version':'1'}}}); init=unpack(r); h=dict(h0); sid=r.headers.get('mcp-session-id');
            if sid: h['Mcp-Session-Id']=sid
            h['MCP-Protocol-Version']=init['result'].get('protocolVersion','2025-06-18'); c.post(os.environ['MCP_URL'],headers=h,json={'jsonrpc':'2.0','method':'notifications/initialized'})
            def tool(n,a):
              d=unpack(c.post(os.environ['MCP_URL'],headers=h,json={'jsonrpc':'2.0','id':next(ids),'method':'tools/call','params':{'name':n,'arguments':a}})); x=d['result']; assert not x.get('isError'),x; t=next(i.get('text') for i in x.get('content',[]) if i.get('type')=='text'); return json.loads(t)
            before=tool('marketplace_archive_job_status',{'job_id':J}); assert int(before.get('report_index') or -1)==24,before; assert int(before.get('provider_calls') or -1)==51,before; assert str(before.get('finalize_phase'))=='UPLOAD_ANNUAL',before; assert int(before.get('finalize_report_id') or 0)==R,before; assert not before.get('last_error'),before; print('PRECHECK_UPLOAD=PASS',flush=True)
            step=tool('marketplace_archive_worker_step',{'job_id':J}); print('STEP_RESULT='+json.dumps(step,ensure_ascii=False),flush=True); assert step.get('ok') is True,step; assert str(step.get('action') or '') in {'report_annual_uploaded','report_annual_already_promoted'},step; assert int(step.get('report_id') or 0)==R,step
            after=tool('marketplace_archive_job_status',{'job_id':J}); assert int(after.get('report_index') or -1)==24,after; assert int(after.get('provider_calls') or -1)==51,after; assert str(after.get('finalize_phase'))=='COMMIT',after; assert int(after.get('finalize_report_id') or 0)==R,after; assert not after.get('last_error'),after
            print('POST_ACTION='+str(step.get('action')),flush=True); print('POST_FINALIZE_PHASE='+str(after.get('finalize_phase')),flush=True); print('POST_PROVIDER_CALLS='+str(after.get('provider_calls')),flush=True); print('UPLOAD_ONLY=PASS',flush=True)
          PY
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/yc" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/k" "$RUNNER_TEMP/v" "$RUNNER_TEMP/p" "$RUNNER_TEMP/b"
