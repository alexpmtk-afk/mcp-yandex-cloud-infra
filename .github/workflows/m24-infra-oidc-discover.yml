name: M24 Infra OIDC Discover

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m24-infra-oidc-discover.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    env:
      DEPLOYER_SERVICE_ACCOUNT_ID: ajecdjjrkdo1t3itpl9k
      EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/mcp-yandex-cloud-infra@1349853397:ref:refs/heads/main
      EXPECTED_ISSUER: https://token.actions.githubusercontent.com
      EXPECTED_AUDIENCE: https://github.com/alexpmtk-afk
    steps:
      - name: Mint masked read token
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          umask 077
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/yc-key.json"
          python -m pip install --disable-pip-version-check 'PyJWT==2.10.0' cryptography >/dev/null
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          import jwt
          key=json.loads((Path(os.environ['RUNNER_TEMP'])/'yc-key.json').read_text())
          assert key['service_account_id']==os.environ['DEPLOYER_SERVICE_ACCOUNT_ID']
          now=int(time.time())
          signed=jwt.encode({'aud':'https://iam.api.cloud.yandex.net/iam/v1/tokens','iss':key['service_account_id'],'iat':now,'exp':now+900}, key['private_key'], algorithm='PS256', headers={'kid':key['id']})
          req=urllib.request.Request('https://iam.api.cloud.yandex.net/iam/v1/tokens',data=json.dumps({'jwt':signed}).encode(),headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: token=json.loads(r.read())['iamToken']
          print(f'::add-mask::{token}')
          (Path(os.environ['RUNNER_TEMP'])/'iam-token').write_text(token)
          print('READ_TOKEN=PASS')
          PY

      - name: Discover unique credential by service account and GitHub subject
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/iam-token")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://iam.api.cloud.yandex.net/iam/v1/workload/federatedCredentials?serviceAccountId=${DEPLOYER_SERVICE_ACCOUNT_ID}&pageSize=1000" \
            -o "$RUNNER_TEMP/credentials.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'credentials.json').read_text())
          assert not d.get('nextPageToken')
          all_items=d.get('federatedCredentials',[])
          candidates=[x for x in all_items if x.get('serviceAccountId')==os.environ['DEPLOYER_SERVICE_ACCOUNT_ID'] and x.get('externalSubjectId')==os.environ['EXPECTED_OIDC_SUBJECT']]
          assert len(candidates)==1, f'expected exactly one GitHub-subject credential, got {len(candidates)}'
          x=candidates[0]
          cid=x.get('id',''); fid=x.get('federationId','')
          assert cid.startswith('aje') and fid.startswith('aje')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'INFRA_OIDC_CREDENTIAL_ID={cid}\n')
              f.write(f'INFRA_OIDC_FEDERATION_ID={fid}\n')
          print('EXISTING_INFRA_OIDC_CREDENTIAL_DISCOVERY=PASS')
          print(f'INFRA_OIDC_CREDENTIAL_ID={cid}')
          print(f'INFRA_OIDC_FEDERATION_ID={fid}')
          PY

      - name: Verify actual federation is enabled GitHub OIDC for this repository audience
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/iam-token")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://iam.api.cloud.yandex.net/iam/v1/workload/oidc/federations/${INFRA_OIDC_FEDERATION_ID}" \
            -o "$RUNNER_TEMP/federation.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ['RUNNER_TEMP'])/'federation.json').read_text())
          assert x.get('id')==os.environ['INFRA_OIDC_FEDERATION_ID']
          assert x.get('enabled') is True
          assert x.get('issuer')==os.environ['EXPECTED_ISSUER'], x.get('issuer')
          assert os.environ['EXPECTED_AUDIENCE'] in (x.get('audiences') or []), x.get('audiences')
          print('ACTUAL_INFRA_OIDC_FEDERATION=PASS')
          print(f'FEDERATION_NAME={x.get("name","")}')
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/iam-token" "$RUNNER_TEMP/credentials.json" "$RUNNER_TEMP/federation.json"
