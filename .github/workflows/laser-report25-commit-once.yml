name: Laser Report 25 Commit Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/control/run-laser-report25-commit-once.txt

permissions:
  contents: read

concurrency:
  group: marketplaces-archive-queue-worker
  cancel-in-progress: false

jobs:
  commit-once:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL --retry 5 --retry-delay 3 https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
          python -m pip install --quiet 'httpx>=0.27,<1'

      - name: Resolve live V3-only MCP
        id: live
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY"
          chmod 600 "$KEY"
          yc config profile create laser25-commit || true
          yc config set service-account-key "$KEY"
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          test -n "$SECRET_ID"
          yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"
          VERSION_ID="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys // [])|index("mcp_bearer_token") != null)|select((.payload_entry_keys // [])|index("gdrive_bridge_v1_secret") == null)]|sort_by(.created_at)|last|.id // empty' "$RUNNER_TEMP/versions.json")"
          test -n "$VERSION_ID"
          DOMAIN="$(yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//.[0].domain//empty')"
          test -n "$DOMAIN"
          yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/payload.json"
          BEARER="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value' "$RUNNER_TEMP/payload.json")"
          test -n "$BEARER"
          echo "::add-mask::$BEARER"
          printf '%s' "$BEARER" > "$RUNNER_TEMP/bearer"
          chmod 600 "$RUNNER_TEMP/bearer"
          echo "url=https://${DOMAIN}/mcp" >> "$GITHUB_OUTPUT"

      - name: Commit exactly report 751229976 and verify 24 to 25
        shell: bash
        timeout-minutes: 10
        env:
          MCP_URL: ${{ steps.live.outputs.url }}
        run: |
          set -euo pipefail
          export MCP_BEARER="$(cat "$RUNNER_TEMP/bearer")"
          python -u - <<'PY'
          import itertools, json, os, httpx

          JOB='wb-finance-wb_laser_master-2026'
          REPORT=751229976
          BEFORE=24
          AFTER=25
          CALLS=51
          BYTES=36269883
          SHA='918f63c5cbef4e45cde9124573169ebf4ac1f52d72d47ac9a4fa05e90d3cf81c'

          def unpack(r):
              r.raise_for_status()
              for line in r.text.splitlines():
                  if line.startswith('data:'):
                      return json.loads(line[5:].strip())
              return r.json() if r.text.strip() else None

          h0={'Authorization':'Bearer '+os.environ['MCP_BEARER'],'Accept':'application/json, text/event-stream','Content-Type':'application/json'}
          ids=itertools.count(1)
          with httpx.Client(timeout=httpx.Timeout(connect=15,read=540,write=30,pool=15),follow_redirects=True) as c:
              r=c.post(os.environ['MCP_URL'],headers=h0,json={'jsonrpc':'2.0','id':next(ids),'method':'initialize','params':{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'laser-report25-commit-once','version':'1'}}})
              init=unpack(r); assert init and 'result' in init, init
              h=dict(h0); sid=r.headers.get('mcp-session-id')
              if sid: h['Mcp-Session-Id']=sid
              h['MCP-Protocol-Version']=init['result'].get('protocolVersion','2025-06-18')
              ready=c.post(os.environ['MCP_URL'],headers=h,json={'jsonrpc':'2.0','method':'notifications/initialized'})
              assert ready.status_code in (200,202), ready.status_code

              def tool(name,args):
                  d=unpack(c.post(os.environ['MCP_URL'],headers=h,json={'jsonrpc':'2.0','id':next(ids),'method':'tools/call','params':{'name':name,'arguments':args}}))
                  assert d and 'result' in d,(name,d)
                  result=d['result']; assert not result.get('isError'),result
                  text=next((x.get('text') for x in result.get('content',[]) if x.get('type')=='text'),None)
                  assert text is not None,result
                  return json.loads(text)

              before=tool('marketplace_archive_job_status',{'job_id':JOB})
              completed=[int(x) for x in (before.get('completed_report_ids') or [])]
              assert before.get('ok') is True,before
              assert int(before.get('report_index') or -1)==BEFORE,before
              assert len(completed)==BEFORE,before
              assert REPORT not in completed,before
              assert str(before.get('finalize_phase') or '')=='COMMIT',before
              assert int(before.get('finalize_report_id') or 0)==REPORT,before
              assert int(before.get('provider_calls') or -1)==CALLS,before
              assert not before.get('last_error'),before
              print('PRE_COMMIT_GATE=PASS',flush=True)

              step=tool('marketplace_archive_worker_step',{'job_id':JOB})
              assert step.get('ok') is True,step
              assert str(step.get('action') or '')=='report_finalized',step
              assert int(step.get('report_id') or 0)==REPORT,step
              assert int(step.get('provider_calls') or -1)==CALLS,step
              assert int(step.get('annual_bytes') or 0)==BYTES,step
              print('COMMIT_ACTION=report_finalized',flush=True)

              after=tool('marketplace_archive_job_status',{'job_id':JOB})
              ids_done=[int(x) for x in (after.get('completed_report_ids') or [])]
              assert after.get('ok') is True,after
              assert int(after.get('report_index') or -1)==AFTER,after
              assert len(ids_done)==AFTER,after
              assert ids_done.count(REPORT)==1,after
              assert int(after.get('provider_calls') or -1)==CALLS,after
              assert after.get('finalize_phase') in (None,''),after
              assert int(after.get('finalize_report_id') or 0)==0,after
              assert int(after.get('current_rrd_id') or 0)==0,after
              assert not after.get('last_error'),after

              tele=after.get('finalize_telemetry') or {}
              assert tele.get('correlation_id','').startswith('archive-finalize-'),tele
              assert int(tele.get('report_id') or 0)==REPORT,tele
              assert int(tele.get('candidate_bytes') or 0)==BYTES,tele
              assert str(tele.get('candidate_sha256') or '')==SHA,tele
              assert str(tele.get('canonical_file_id') or ''),tele
              assert str(tele.get('last_event') or '')=='COMMIT_COMPLETE',tele
              events=[str(x.get('event') or '') for x in (tele.get('events') or [])]
              assert 'COMMIT_STARTED' in events and 'COMMIT_COMPLETE' in events,tele
              print('POST_COMMIT_GATE=PASS',flush=True)
              print('COMPLETED_COUNT='+str(len(ids_done)),flush=True)
              print('REPORT_INDEX='+str(after.get('report_index')),flush=True)
              print('PROVIDER_CALLS='+str(after.get('provider_calls')),flush=True)
              print('TELEMETRY_CORRELATION_ID='+str(tele.get('correlation_id')),flush=True)
              print('TELEMETRY_LAST_EVENT='+str(tele.get('last_event')),flush=True)
              print('LASER_24_TO_25=PASS',flush=True)
          PY

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/payload.json" "$RUNNER_TEMP/bearer"
