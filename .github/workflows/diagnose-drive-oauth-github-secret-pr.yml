name: Diagnose Drive OAuth GitHub Secret PR

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-drive-oauth-github-secret-pr.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Check protected OAuth handoff presence
        shell: bash
        env:
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
        run: |
          if [ -n "$GOOGLE_DRIVE_OAUTH_JSON" ]; then
            echo 'GOOGLE_DRIVE_OAUTH_GITHUB_SECRET=FOUND'
          else
            echo 'GOOGLE_DRIVE_OAUTH_GITHUB_SECRET=ABSENT'
          fi
