name: Compare Marketplaces Drive Bridge v1 vs v3

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/compare-marketplaces-drive-bridges.yml'
      - 'shared/google-drive-bridge/scripts/compare_marketplaces_v1_v3.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplaces-drive-bridge-comparison
  cancel-in-progress: false

env:
  CLOUD_ID: b1gi4pr9msenirafh2c7
  ROOT_ID: 1UVKUcFfDhCDk6nMHX1mWg9cRL05DT-OJ
  FOREIGN_FILE_ID: 1A7IzjXYSCWReZXdtrPZgZgLTnFIifsT2
  V3_URL: https://script.google.com/macros/s/AKfycbzgFDAQY4rcsblKhiAONfOI6315k8W3vwbSIEsczE3ycQtnJ8ctcVKjhzjgdTgfy0cvIA/exec

jobs:
  compare:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 35
    steps:
      - name: Checkout comparison branch
        uses: actions/checkout@v4

      - name: Install dependencies and Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'httpx>=0.27,<1'
          mkdir -p "$RUNNER_TEMP/yc"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 5 \
            https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Resolve isolated v1 and v3 credentials
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/yc-key.json"
          umask 077
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY"
          yc config profile create bridge-comparison >/dev/null 2>&1 || true
          yc config set service-account-key "$KEY"
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          test -n "$SECRET_ID"
          yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"
          V1_VERSION="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys//[])|index("gdrive_bridge_v1_secret")!=null)]|sort_by(.created_at)|last|.id//empty' "$RUNNER_TEMP/versions.json")"
          V3_VERSION="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys//[])|index("google_drive_bridge_secret")!=null)]|sort_by(.created_at)|last|.id//empty' "$RUNNER_TEMP/versions.json")"
          test -n "$V1_VERSION"; test -n "$V3_VERSION"
          yc lockbox payload get --id "$SECRET_ID" --version-id "$V1_VERSION" --key gdrive_bridge_v1_secret --no-user-output > "$RUNNER_TEMP/v1-secret"
          yc lockbox payload get --id "$SECRET_ID" --version-id "$V3_VERSION" --key google_drive_bridge_secret --no-user-output > "$RUNNER_TEMP/v3-secret"
          test -s "$RUNNER_TEMP/v1-secret"; test -s "$RUNNER_TEMP/v3-secret"
          echo "::add-mask::$(cat "$RUNNER_TEMP/v1-secret")"
          echo "::add-mask::$(cat "$RUNNER_TEMP/v3-secret")"
          printf '%s' "$FOLDER_ID" > "$RUNNER_TEMP/folder-id"
          echo "V1_SECRET_VERSION=$V1_VERSION"
          echo "V3_SECRET_VERSION=$V3_VERSION"

      - name: Read current Marketplaces runtime binding (no mutation)
        shell: bash
        run: |
          set -euo pipefail
          FOLDER_ID="$(cat "$RUNNER_TEMP/folder-id")"
          CONTAINER_ID="$(yc serverless container list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$CONTAINER_ID"
          yc serverless container revision list --container-id "$CONTAINER_ID" --format json > "$RUNNER_TEMP/revisions.json"
          REVISION_ID="$(jq -r '[.[]|select((.status//"")=="ACTIVE")]|sort_by(.created_at)|last|.id//empty' "$RUNNER_TEMP/revisions.json")"
          test -n "$REVISION_ID"
          yc serverless container revision get "$REVISION_ID" --format json > "$RUNNER_TEMP/revision.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'revision.json').read_text())
          image=d.get('image') or {}
          env=image.get('environment') or {}
          blob=json.dumps(d)
          if env.get('MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_PROTOCOL') == 'v1' or 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_V1_SECRET' in blob:
              binding='v1'
          elif env.get('MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_URL') or 'MARKETPLACE_MCP_GOOGLE_DRIVE_BRIDGE_SECRET' in blob:
              binding='v3/legacy-envelope'
          else:
              binding='unknown'
          print('CURRENT_RUNTIME_BRIDGE_BINDING='+binding)
          print('CURRENT_RUNTIME_REVISION='+str(d.get('id') or ''))
          print('CURRENT_RUNTIME_SOURCE_COMMIT='+str(env.get('MARKETPLACE_MCP_SOURCE_COMMIT') or ''))
          PY

      - name: Run isolated live comparison
        shell: bash
        env:
          V1_URL: ${{ vars.MARKETPLACES_GDRIVE_BRIDGE_V1_URL }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "$V1_URL"
          [[ "$V1_URL" == https://script.google.com/macros/s/*/exec ]]
          export V1_SECRET="$(cat "$RUNNER_TEMP/v1-secret")"
          export V3_SECRET="$(cat "$RUNNER_TEMP/v3-secret")"
          python -u shared/google-drive-bridge/scripts/compare_marketplaces_v1_v3.py | tee "$RUNNER_TEMP/bridge-comparison.log"
          grep '^BRIDGE_COMPARISON_JSON=' "$RUNNER_TEMP/bridge-comparison.log"

      - name: Cleanup local credentials
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/yc" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/yc-key.json" \
            "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/v1-secret" "$RUNNER_TEMP/v3-secret" \
            "$RUNNER_TEMP/folder-id" "$RUNNER_TEMP/revisions.json" "$RUNNER_TEMP/revision.json" \
            "$RUNNER_TEMP/bridge-comparison.log"
