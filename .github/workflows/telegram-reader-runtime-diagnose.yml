name: Diagnose Telegram Reader Runtime

on:
  push:
    branches:
      - feature/telegram-news-reader
    paths:
      - ".github/workflows/telegram-reader-runtime-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-reader-diagnose || true
          yc config set service-account-key "$key"
      - name: Inspect VM and serial output
        shell: bash
        run: |
          set -euo pipefail
          folder='b1gk4p83brasi8g811jv'
          yc compute instance get --name telegram-news-reader --folder-id "$folder" --format json > "$RUNNER_TEMP/vm.json"
          jq '{id,name,status,zone_id,network_interfaces}' "$RUNNER_TEMP/vm.json" | tee "$RUNNER_TEMP/vm-summary.json"
          yc compute instance get-serial-port-output --name telegram-news-reader --folder-id "$folder" > "$RUNNER_TEMP/serial.txt" || true
          tail -n 120 "$RUNNER_TEMP/serial.txt" > "$RUNNER_TEMP/serial-tail.txt"
          echo 'RUNTIME_DIAGNOSTIC=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-reader-runtime-diagnostic
          path: |
            ${{ runner.temp }}/vm-summary.json
            ${{ runner.temp }}/serial-tail.txt
          retention-days: 3
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/yc-key.json"
