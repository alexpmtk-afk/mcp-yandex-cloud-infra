name: Inspect Container Revision

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-container-revision.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 8
    steps:
      - name: Install and authenticate YC CLI
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL --retry 5 --retry-delay 3 https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          export PATH="$RUNNER_TEMP/yc:$PATH"
          KEY="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY"
          chmod 600 "$KEY"
          yc config profile create inspect-revision || true
          yc config set service-account-key "$KEY"
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id b1gi4pr9msenirafh2c7 --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          yc config set folder-id "$FOLDER_ID"
          CONTAINER_ID="$(timeout 45s yc serverless container list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$CONTAINER_ID"
          echo "CONTAINER_ID=$CONTAINER_ID"
          timeout 45s yc serverless container revision list --container-id "$CONTAINER_ID" --format json --no-user-output > "$RUNNER_TEMP/revisions.json"
          jq -r '.[] | [.id, (.status//""), (.created_at//""), (.resources.memory//.memory//""|tostring), (.resources.cores//.cores//""|tostring), (.execution_timeout//""|tostring)] | @tsv' "$RUNNER_TEMP/revisions.json" | head -n 10
          echo 'LATEST_REVISION_JSON='
          jq 'sort_by(.created_at)|last|{id,status,created_at,resources,execution_timeout,concurrency,image}' "$RUNNER_TEMP/revisions.json"

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/revisions.json"
