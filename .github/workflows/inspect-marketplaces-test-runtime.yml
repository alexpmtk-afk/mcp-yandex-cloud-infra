name: Inspect Marketplaces TEST Runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-marketplaces-test-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUD_ID: b1gi4pr9msenirafh2c7
  TEST_FOLDER_NAME: marketplaces-mcp-test
  REGISTRY_ID: crp6o36mbl2tqonu1qbi
  REGISTRY_API: https://container-registry.api.cloud.yandex.net/container-registry/v1

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"

      - name: Authenticate read-only diagnostic identity
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r --arg n "$TEST_FOLDER_NAME" '.[]|select(.name==$n)|.id' | head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          echo "FOLDER_ID=$FOLDER_ID" >> "$GITHUB_ENV"
          IAM_TOKEN="$(yc iam create-token)"
          test -n "$IAM_TOKEN"
          echo "::add-mask::$IAM_TOKEN"
          umask 077
          printf '%s' "$IAM_TOKEN" > "$RUNNER_TEMP/iam-token"

      - name: Inventory existing registry images
        shell: bash
        run: |
          set -euo pipefail
          IAM_TOKEN="$(cat "$RUNNER_TEMP/iam-token")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${IAM_TOKEN}" \
            "${REGISTRY_API}/images?registryId=${REGISTRY_ID}&pageSize=1000" \
            -o "$RUNNER_TEMP/images.json"
          echo '--- MARKETPLACES_REGISTRY_IMAGES ---'
          jq -c '[.images[]? | {id,name,digest,tags,created_at:(.createdAt//.created_at)}] | sort_by(.created_at)' "$RUNNER_TEMP/images.json"
          echo "image_count=$(jq '.images|length' "$RUNNER_TEMP/images.json")"

      - name: Inventory active TEST container and revisions
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_ID="$(yc serverless container list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id' | head -1)"
          test -n "$CONTAINER_ID"
          echo "CONTAINER_ID=$CONTAINER_ID" >> "$GITHUB_ENV"
          yc serverless container get --id "$CONTAINER_ID" --format json --no-user-output > "$RUNNER_TEMP/container.json"
          yc serverless container revision list --container-id "$CONTAINER_ID" --format json --no-user-output > "$RUNNER_TEMP/revisions.json"
          echo '--- TEST_CONTAINER ---'
          jq -c '{id,name,url,status,created_at:(.createdAt//.created_at)}' "$RUNNER_TEMP/container.json"
          echo '--- TEST_REVISIONS ---'
          jq -c '[.[] | {id,status,image_url:(.image_url//.imageUrl),created_at:(.created_at//.createdAt),service_account_id:(.service_account_id//.serviceAccountId)}] | sort_by(.created_at)' "$RUNNER_TEMP/revisions.json"

      - name: Resolve live gateway and bearer
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN="$(yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain // .[0].domain // empty')"
          test -n "$DOMAIN"
          echo "GATEWAY_URL=https://${DOMAIN}" >> "$GITHUB_ENV"
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          test -n "$SECRET_ID"
          yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"
          VERSION_ID="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys//[])|index("mcp_bearer_token")!=null)]|sort_by(.created_at)|last|.id // empty' "$RUNNER_TEMP/versions.json")"
          test -n "$VERSION_ID"
          yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/payload.json"
          BEARER="$(jq -r '.entries[]|select(.key=="mcp_bearer_token")|.text_value' "$RUNNER_TEMP/payload.json")"
          test -n "$BEARER"
          echo "::add-mask::$BEARER"
          umask 077
          printf '%s' "$BEARER" > "$RUNNER_TEMP/bearer"
          HEALTH_CODE="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/health" -w '%{http_code}' "https://${DOMAIN}/healthz" || true)"
          echo "live_health_http=$HEALTH_CODE"
          test "$HEALTH_CODE" = 200

      - name: Inspect live MCP Semantic Core surface
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'httpx>=0.27,<1'
          export MCP_URL="${GATEWAY_URL}/mcp"
          export MCP_BEARER="$(cat "$RUNNER_TEMP/bearer")"
          python -u - <<'PY'
          import itertools,json,os
          import httpx
          def unpack(r):
              r.raise_for_status()
              for line in r.text.splitlines():
                  if line.startswith('data:'):
                      return json.loads(line[5:].strip())
              return r.json() if r.text.strip() else None
          ids=itertools.count(1)
          h={'Authorization':'Bearer '+os.environ['MCP_BEARER'],'Accept':'application/json, text/event-stream','Content-Type':'application/json'}
          with httpx.Client(timeout=httpx.Timeout(connect=10,read=60,write=30,pool=10),follow_redirects=True) as c:
              r=c.post(os.environ['MCP_URL'],headers=h,json={'jsonrpc':'2.0','id':next(ids),'method':'initialize','params':{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'test-runtime-inspector','version':'1'}}})
              init=unpack(r); assert init and 'result' in init,init
              print('initialize_instructions='+json.dumps(init['result'].get('instructions',''),ensure_ascii=False),flush=True)
              sid=r.headers.get('mcp-session-id'); hh=dict(h)
              if sid: hh['Mcp-Session-Id']=sid
              hh['MCP-Protocol-Version']=init['result'].get('protocolVersion','2025-06-18')
              n=c.post(os.environ['MCP_URL'],headers=hh,json={'jsonrpc':'2.0','method':'notifications/initialized'})
              assert n.status_code in (200,202),n.status_code
              def rpc(method,params=None):
                  rr=c.post(os.environ['MCP_URL'],headers=hh,json={'jsonrpc':'2.0','id':next(ids),'method':method,'params':params or {}})
                  d=unpack(rr); assert d and 'result' in d,(method,d)
                  return d['result']
              tools=rpc('tools/list').get('tools',[])
              names=sorted(t.get('name') for t in tools)
              print('tool_names='+json.dumps(names,ensure_ascii=False),flush=True)
              print('has_marketplace_business_query='+str('marketplace_business_query' in names).lower(),flush=True)
              print('has_marketplace_system_map='+str('marketplace_system_map' in names).lower(),flush=True)
              if 'marketplace_system_map' in names:
                  z=rpc('tools/call',{'name':'marketplace_system_map','arguments':{}})
                  text=next((x.get('text') for x in z.get('content',[]) if x.get('type')=='text'),None)
                  print('marketplace_system_map='+str(text),flush=True)
          PY

      - name: Cleanup diagnostic credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/iam-token" "$RUNNER_TEMP/images.json" "$RUNNER_TEMP/container.json" "$RUNNER_TEMP/revisions.json" "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/payload.json" "$RUNNER_TEMP/bearer" "$RUNNER_TEMP/health"
