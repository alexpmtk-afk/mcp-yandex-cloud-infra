name: Yandex Cloud cost candidates now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yandex-cloud-cost-candidates-now.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 5
    steps:
      - name: Install YC CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"
      - name: Authenticate
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"
          chmod 600 "$RUNNER_TEMP/key.json"
          yc config profile create cost-audit || true
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          yc config set cloud-id b1gi4pr9msenirafh2c7
      - name: Inspect recurring and storage resources
        shell: bash
        run: |
          set +e
          BIRZHA=b1g00gqb66tbnfoumnkv
          MP=b1gnd0dqoq3ljod88i8t
          TG=b1gk4p83brasi8g811jv

          echo '=== BIRZHA_TRIGGERS ==='
          timeout 25s yc serverless trigger list --folder-id "$BIRZHA" --format json --no-user-output | jq '[.[] | {id,name,status,created_at,rule}]' || true

          echo '=== BIRZHA_ORCHESTRATOR_REVISIONS ==='
          timeout 25s yc serverless container revision list --container-id bbamdg0po6fkukhod2e9 --format json --no-user-output | jq '[.[] | {id,created_at,status,resources,execution_timeout,concurrency,provision_policy,service_account_id}]' || true

          echo '=== BIRZHA_MAIN_REVISIONS ==='
          timeout 25s yc serverless container revision list --container-id bbavossdt8rp9op9q3rl --format json --no-user-output | jq '[.[] | {id,created_at,status,resources,execution_timeout,concurrency,provision_policy,service_account_id}]' || true

          echo '=== BIRZHA_REGISTRY_IMAGES ==='
          timeout 25s yc container image list --registry-id crpk5qvf4p7kcqil2u3v --format json --no-user-output | jq '[.[] | {id,name,created_at,compressed_size}]' || true

          echo '=== MARKETPLACES_REGISTRY_IMAGES_1 ==='
          timeout 25s yc container image list --registry-id crp6o36mbl2tqonu1qbi --format json --no-user-output | jq '[.[] | {id,name,created_at,compressed_size}]' || true
          echo '=== MARKETPLACES_REGISTRY_IMAGES_2 ==='
          timeout 25s yc container image list --registry-id crpi89vgdta1237ndquv --format json --no-user-output | jq '[.[] | {id,name,created_at,compressed_size}]' || true
          echo '=== MARKETPLACES_REGISTRY_IMAGES_3 ==='
          timeout 25s yc container image list --registry-id crpnhk1hs1gsai91b164 --format json --no-user-output | jq '[.[] | {id,name,created_at,compressed_size}]' || true

          echo '=== TELEGRAM_REGISTRY_IMAGES ==='
          timeout 25s yc container image list --registry-id crphagvid8e8g5pp4fpe --format json --no-user-output | jq '[.[] | {id,name,created_at,compressed_size}]' || true

          echo '=== TELEGRAM_DISKS ==='
          timeout 25s yc compute disk list --folder-id "$TG" --format json --no-user-output | jq '[.[] | {id,name,status,created_at,type_id,zone_id,size,instance_ids}]' || true
          echo '=== TELEGRAM_SNAPSHOTS ==='
          timeout 25s yc compute snapshot list --folder-id "$TG" --format json --no-user-output | jq '[.[] | {id,name,status,created_at,disk_size,storage_size}]' || true
          echo '=== TELEGRAM_PUBLIC_ADDRESSES ==='
          timeout 25s yc vpc address list --folder-id "$TG" --format json --no-user-output | jq '[.[] | {id,name,created_at,reserved,used,address}]' || true

          echo '=== MARKETPLACES_DISKS ==='
          timeout 25s yc compute disk list --folder-id "$MP" --format json --no-user-output | jq '[.[] | {id,name,status,created_at,type_id,zone_id,size,instance_ids}]' || true

          echo '=== BIRZHA_DISKS ==='
          timeout 25s yc compute disk list --folder-id "$BIRZHA" --format json --no-user-output | jq '[.[] | {id,name,status,created_at,type_id,zone_id,size,instance_ids}]' || true
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json"
