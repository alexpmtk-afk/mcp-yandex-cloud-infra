name: M24 Worker Verify Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m24-worker-deploy-once.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: birzha-m24-worker-verify-once
  cancel-in-progress: false

env:
  TF_DIR: terraform/birzha_test
  DEPLOYER_SERVICE_ACCOUNT_ID: ajecdjjrkdo1t3itpl9k
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/mcp-yandex-cloud-infra@1349853397:environment:test
  M24_WORKER_SOURCE_SHA: a8a633547ce6bc86c723952ace6b680d8a5a5634
  M24_WORKER_IMAGE: cr.yandex/crpk5qvf4p7kcqil2u3v/birzha-mcp-forecast@sha256:eea5d561d78bf755b85cfb47a3ff2e88c04563fb63e9b580a80bbc26f3a7ce12
  EXPECTED_WORKER_CONTAINER_ID: bbamdg0po6fkukhod2e9
  EXPECTED_TIMER_TRIGGER_ID: a1s4ho32v7dha59aeu60
  EXPECTED_PUBLIC_MCP_IMAGE: cr.yandex/crpk5qvf4p7kcqil2u3v/birzha-mcp-forecast@sha256:5db7e3b1bbd69ee0c797d1d9a5a9289633914ef9f360f3d0f45187cb219113fc
  EXPECTED_PUBLIC_MCP_SOURCE_SHA: b6ce037915ee993f2758f2ff6b29341f15554308
  EXPECTED_PUBLIC_ALLOWED_HOSTS: d5d6sgh96p1fs4mnlfsr.0ly8ed4d.apigw.yandexcloud.net,d5d6sgh96p1fs4mnlfsr.0ly8ed4d.apigw.yandexcloud.net:*
  EXPECTED_PUBLIC_ALLOWED_ORIGINS: https://chatgpt.com

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Checkout exact infrastructure main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Terraform 1.9.8
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Exchange GitHub Environment OIDC for Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          ENCODED_AUDIENCE="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          SEP='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && SEP='&'
          OIDC_RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${SEP}audience=${ENCODED_AUDIENCE}")"
          OIDC_JWT="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$OIDC_RESPONSE")"
          echo "::add-mask::$OIDC_JWT"
          python - "$OIDC_JWT" <<'PY'
          import base64,json,os,sys
          p=sys.argv[1].split('.')[1]; p += '=' * (-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          assert c.get('sub')==os.environ['EXPECTED_OIDC_SUBJECT']
          assert c.get('aud')==os.environ['OIDC_AUDIENCE']
          assert c.get('ref')=='refs/heads/main'
          assert c.get('environment')=='test'
          print('M24_VERIFY_OIDC_CLAIMS=PASS')
          PY
          RESPONSE="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${DEPLOYER_SERVICE_ACCOUNT_ID}" --data-urlencode "subject_token=${OIDC_JWT}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$RESPONSE")"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          umask 077
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/oidc-iam-token"
          echo 'M24_VERIFY_OIDC_EXCHANGE=PASS'

      - name: Initialize protected remote state
        shell: bash
        env:
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" init -reconfigure -input=false -lockfile=readonly \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" \
            -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY" >/dev/null

      - name: Verify applied worker, timer, binding and public MCP state
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" show -json > "$RUNNER_TEMP/state.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'state.json').read_text())
          resources=(s.get('values',{}).get('root_module',{}).get('resources') or [])
          by_addr={r.get('address'):r for r in resources}

          mcp=by_addr['yandex_serverless_container.mcp[0]']['values']
          mcp_image=(mcp.get('image') or [])[0]
          mcp_env=mcp_image.get('environment') or {}
          assert mcp_image.get('url')==os.environ['EXPECTED_PUBLIC_MCP_IMAGE']
          assert mcp_env.get('BIRZHA_SOURCE_COMMIT')==os.environ['EXPECTED_PUBLIC_MCP_SOURCE_SHA']
          assert mcp_env.get('MCP_ALLOWED_HOSTS','')==os.environ['EXPECTED_PUBLIC_ALLOWED_HOSTS']
          assert mcp_env.get('MCP_ALLOWED_ORIGINS','')==os.environ['EXPECTED_PUBLIC_ALLOWED_ORIGINS']

          worker=by_addr['yandex_serverless_container.orchestrator_worker[0]']['values']
          assert worker.get('id')==os.environ['EXPECTED_WORKER_CONTAINER_ID']
          image=(worker.get('image') or [])[0]
          env=image.get('environment') or {}
          assert image.get('url')==os.environ['M24_WORKER_IMAGE']
          assert env.get('BIRZHA_SOURCE_COMMIT')==os.environ['M24_WORKER_SOURCE_SHA']
          assert env.get('BIRZHA_ORCHESTRATOR_WORKER')=='true'
          assert env.get('BIRZHA_STATE_BACKEND')=='ydb'
          assert env.get('YDB_CONNECTION_STRING','').startswith('grpcs://')
          assert (image.get('command') or [])==['python','-m','birzha.worker']
          assert worker.get('concurrency')==1

          raw_timeout=worker.get('execution_timeout')
          if isinstance(raw_timeout,(int,float)):
              timeout_ok=float(raw_timeout)==120.0
          else:
              normalized=str(raw_timeout or '').strip().lower()
              if normalized.endswith('s'):
                  normalized=normalized[:-1]
              try:
                  timeout_ok=float(normalized)==120.0
              except ValueError:
                  timeout_ok=False
          print(f'M24_WORKER_EXECUTION_TIMEOUT_REPR={raw_timeout!r}')
          assert timeout_ok, raw_timeout

          binding=by_addr['yandex_serverless_container_iam_member.orchestrator_timer_invoker[0]']['values']
          assert binding.get('container_id')==os.environ['EXPECTED_WORKER_CONTAINER_ID']
          trigger=by_addr['yandex_function_trigger.orchestrator_timer[0]']['values']
          assert trigger.get('id')==os.environ['EXPECTED_TIMER_TRIGGER_ID']
          timer=(trigger.get('timer') or [])[0]
          assert timer.get('cron_expression')=='* * ? * * *', timer
          print('M24_WORKER_APPLIED_STATE=PASS')
          print('M24_TIMER_AND_INVOKER_STATE=PASS')
          print('PUBLIC_MCP_UNCHANGED=PASS')
          PY

      - name: Prove zero drift without applying anything
        shell: bash
        run: |
          set -euo pipefail
          export TF_VAR_yc_token="$(cat "$RUNNER_TEMP/oidc-iam-token")"
          set +e
          terraform -chdir="$TF_DIR" plan -detailed-exitcode -input=false -no-color \
            -var="mcp_image_url=${EXPECTED_PUBLIC_MCP_IMAGE}" \
            -var="source_commit_sha=${EXPECTED_PUBLIC_MCP_SOURCE_SHA}" \
            -var="mcp_allowed_hosts=${EXPECTED_PUBLIC_ALLOWED_HOSTS}" \
            -var="mcp_allowed_origins=${EXPECTED_PUBLIC_ALLOWED_ORIGINS}" \
            -var="m24_worker_image_url=${M24_WORKER_IMAGE}" \
            -var="m24_worker_source_sha=${M24_WORKER_SOURCE_SHA}" \
            -var="m24_infra_oidc_bootstrap_enabled=false" > "$RUNNER_TEMP/verify-plan.txt"
          rc=$?
          set -e
          test "$rc" = 0 || { cat "$RUNNER_TEMP/verify-plan.txt"; exit "$rc"; }
          echo 'M24_WORKER_ZERO_DRIFT=PASS'

      - name: Confirm stable resource identifiers
        shell: bash
        run: |
          set -euo pipefail
          WORKER_ID="$(terraform -chdir="$TF_DIR" output -raw m24_orchestrator_worker_container_id)"
          TIMER_ID="$(terraform -chdir="$TF_DIR" output -raw m24_orchestrator_timer_trigger_id)"
          [[ "$WORKER_ID" == "$EXPECTED_WORKER_CONTAINER_ID" ]]
          [[ "$TIMER_ID" == "$EXPECTED_TIMER_TRIGGER_ID" ]]
          echo "M24_WORKER_CONTAINER_ID=$WORKER_ID"
          echo "M24_TIMER_TRIGGER_ID=$TIMER_ID"
          echo 'M24_RESOURCE_IDS_PRESERVED=PASS'

      - name: Cleanup ephemeral credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/oidc-iam-token" "$RUNNER_TEMP/state.json" "$RUNNER_TEMP/verify-plan.txt"
