name: M24 Worker Deploy Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m24-worker-deploy-once.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: birzha-m24-worker-deploy-once
  cancel-in-progress: false

env:
  TF_DIR: terraform/birzha_test
  DEPLOYER_SERVICE_ACCOUNT_ID: ajecdjjrkdo1t3itpl9k
  OIDC_AUDIENCE: https://github.com/alexpmtk-afk
  EXPECTED_OIDC_SUBJECT: repo:alexpmtk-afk@309119594/mcp-yandex-cloud-infra@1349853397:environment:test
  M24_WORKER_SOURCE_SHA: 02b1ae09040903d59615478b664ba3f9c526df92
  M24_WORKER_IMAGE: cr.yandex/crpk5qvf4p7kcqil2u3v/birzha-mcp-forecast@sha256:bc8a8041bfa37831195f90ccb973fb318a7e033fcf6b08c568e69d7854cf03be
  EXPECTED_WORKER_CONTAINER_ID: bbamdg0po6fkukhod2e9
  EXPECTED_TIMER_TRIGGER_ID: a1s4ho32v7dha59aeu60
  EXPECTED_PUBLIC_MCP_IMAGE: cr.yandex/crpk5qvf4p7kcqil2u3v/birzha-mcp-forecast@sha256:5db7e3b1bbd69ee0c797d1d9a5a9289633914ef9f360f3d0f45187cb219113fc
  EXPECTED_PUBLIC_MCP_SOURCE_SHA: b6ce037915ee993f2758f2ff6b29341f15554308
  EXPECTED_PUBLIC_ALLOWED_HOSTS: d5d6sgh96p1fs4mnlfsr.0ly8ed4d.apigw.yandexcloud.net,d5d6sgh96p1fs4mnlfsr.0ly8ed4d.apigw.yandexcloud.net:*
  EXPECTED_PUBLIC_ALLOWED_ORIGINS: https://chatgpt.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 25
    steps:
      - name: Checkout exact infrastructure main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Terraform 1.9.8
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Exchange GitHub Environment OIDC for Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          A="$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe=""))')"
          S='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && S='&'
          R="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${S}audience=${A}")"
          J="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$R")"
          echo "::add-mask::$J"
          python - "$J" <<'PY'
          import base64,json,os,sys
          p=sys.argv[1].split('.')[1]; p += '='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          assert c.get('sub')==os.environ['EXPECTED_OIDC_SUBJECT']
          assert c.get('aud')==os.environ['OIDC_AUDIENCE']
          assert c.get('ref')=='refs/heads/main'
          assert c.get('environment')=='test'
          print('M24_DEPLOY_OIDC_CLAIMS=PASS')
          PY
          X="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 -X POST 'https://auth.yandex.cloud/oauth/token' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${DEPLOYER_SERVICE_ACCOUNT_ID}" --data-urlencode "subject_token=${J}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token')"
          T="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$X")"
          test -n "$T"; echo "::add-mask::$T"; umask 077; printf '%s' "$T" > "$RUNNER_TEMP/iam-token"
          echo 'M24_DEPLOY_OIDC_EXCHANGE=PASS'

      - name: Install yc
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tar.gz"
          tar -xzf "$RUNNER_TEMP/yc.tar.gz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"

      - name: Initialize protected remote state
        shell: bash
        env:
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" init -reconfigure -input=false -lockfile=readonly \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" \
            -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY" >/dev/null
          terraform -chdir="$TF_DIR" validate

      - name: Preserve protected state and prove timer is paused
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" show -json > "$RUNNER_TEMP/before-state.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'before-state.json').read_text())
          resources=(s.get('values',{}).get('root_module',{}).get('resources') or [])
          by={r.get('address'):r.get('values',{}) for r in resources}
          mcp=by['yandex_serverless_container.mcp[0]']; mi=(mcp.get('image') or [])[0]; me=mi.get('environment') or {}
          assert mi.get('url')==os.environ['EXPECTED_PUBLIC_MCP_IMAGE']
          assert me.get('BIRZHA_SOURCE_COMMIT')==os.environ['EXPECTED_PUBLIC_MCP_SOURCE_SHA']
          assert me.get('MCP_ALLOWED_HOSTS','')==os.environ['EXPECTED_PUBLIC_ALLOWED_HOSTS']
          assert me.get('MCP_ALLOWED_ORIGINS','')==os.environ['EXPECTED_PUBLIC_ALLOWED_ORIGINS']
          worker=by['yandex_serverless_container.orchestrator_worker[0]']
          assert worker.get('id')==os.environ['EXPECTED_WORKER_CONTAINER_ID']
          trigger=by['yandex_function_trigger.orchestrator_timer[0]']
          assert trigger.get('id')==os.environ['EXPECTED_TIMER_TRIGGER_ID']
          print('M24_PROTECTED_STATE_BEFORE=PASS')
          PY
          TOKEN="$(cat "$RUNNER_TEMP/iam-token")"
          YC_IAM_TOKEN="$TOKEN" "$RUNNER_TEMP/yc/yc" serverless trigger get "$EXPECTED_TIMER_TRIGGER_ID" --format=json > "$RUNNER_TEMP/timer-before.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'timer-before.json').read_text())
          assert d.get('id')==os.environ['EXPECTED_TIMER_TRIGGER_ID']
          assert d.get('status')=='PAUSED', d.get('status')
          assert os.environ['EXPECTED_WORKER_CONTAINER_ID'] in json.dumps(d)
          print('M24_TIMER_PAUSED_BEFORE_DEPLOY=PASS')
          PY

      - name: Create strict worker-only saved plan
        shell: bash
        run: |
          set -euo pipefail
          export TF_VAR_yc_token="$(cat "$RUNNER_TEMP/iam-token")"
          terraform -chdir="$TF_DIR" plan -input=false -no-color -out="$RUNNER_TEMP/m24-worker.tfplan" \
            -var="mcp_image_url=${EXPECTED_PUBLIC_MCP_IMAGE}" \
            -var="source_commit_sha=${EXPECTED_PUBLIC_MCP_SOURCE_SHA}" \
            -var="mcp_allowed_hosts=${EXPECTED_PUBLIC_ALLOWED_HOSTS}" \
            -var="mcp_allowed_origins=${EXPECTED_PUBLIC_ALLOWED_ORIGINS}" \
            -var="m24_worker_image_url=${M24_WORKER_IMAGE}" \
            -var="m24_worker_source_sha=${M24_WORKER_SOURCE_SHA}" \
            -var="m24_infra_oidc_bootstrap_enabled=false"
          terraform -chdir="$TF_DIR" show -json "$RUNNER_TEMP/m24-worker.tfplan" > "$RUNNER_TEMP/plan.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads((Path(os.environ['RUNNER_TEMP'])/'plan.json').read_text())
          changes=[]
          for r in p.get('resource_changes') or []:
              acts=(r.get('change') or {}).get('actions') or []
              if acts not in (['no-op'], ['read']):
                  changes.append((r.get('address'),acts))
          expected=[('yandex_serverless_container.orchestrator_worker[0]',['update'])]
          assert changes==expected, f'unexpected Terraform changes: {changes}'
          print('M24_STRICT_WORKER_ONLY_PLAN=PASS')
          PY

      - name: Apply exact saved plan
        shell: bash
        run: |
          set -euo pipefail
          export TF_VAR_yc_token="$(cat "$RUNNER_TEMP/iam-token")"
          terraform -chdir="$TF_DIR" apply -input=false -auto-approve "$RUNNER_TEMP/m24-worker.tfplan"
          echo 'M24_WORKER_APPLY=PASS'

      - name: Verify corrected worker and protected resources
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" show -json > "$RUNNER_TEMP/after-state.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'after-state.json').read_text())
          resources=(s.get('values',{}).get('root_module',{}).get('resources') or [])
          by={r.get('address'):r.get('values',{}) for r in resources}
          mcp=by['yandex_serverless_container.mcp[0]']; mi=(mcp.get('image') or [])[0]; me=mi.get('environment') or {}
          assert mi.get('url')==os.environ['EXPECTED_PUBLIC_MCP_IMAGE']
          assert me.get('BIRZHA_SOURCE_COMMIT')==os.environ['EXPECTED_PUBLIC_MCP_SOURCE_SHA']
          assert me.get('MCP_ALLOWED_HOSTS','')==os.environ['EXPECTED_PUBLIC_ALLOWED_HOSTS']
          assert me.get('MCP_ALLOWED_ORIGINS','')==os.environ['EXPECTED_PUBLIC_ALLOWED_ORIGINS']
          worker=by['yandex_serverless_container.orchestrator_worker[0]']
          assert worker.get('id')==os.environ['EXPECTED_WORKER_CONTAINER_ID']
          wi=(worker.get('image') or [])[0]; we=wi.get('environment') or {}
          assert wi.get('url')==os.environ['M24_WORKER_IMAGE']
          assert we.get('BIRZHA_SOURCE_COMMIT')==os.environ['M24_WORKER_SOURCE_SHA']
          assert we.get('BIRZHA_ORCHESTRATOR_WORKER')=='true'
          assert we.get('BIRZHA_STATE_BACKEND')=='ydb'
          assert (wi.get('command') or [])==['python','-m','birzha.worker']
          assert worker.get('concurrency')==1
          trigger=by['yandex_function_trigger.orchestrator_timer[0]']
          assert trigger.get('id')==os.environ['EXPECTED_TIMER_TRIGGER_ID']
          print('M24_CORRECTED_WORKER_APPLIED_STATE=PASS')
          print('PUBLIC_MCP_UNCHANGED=PASS')
          print('M24_RESOURCE_IDS_PRESERVED=PASS')
          PY
          TOKEN="$(cat "$RUNNER_TEMP/iam-token")"
          YC_IAM_TOKEN="$TOKEN" "$RUNNER_TEMP/yc/yc" serverless trigger get "$EXPECTED_TIMER_TRIGGER_ID" --format=json > "$RUNNER_TEMP/timer-after.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'timer-after.json').read_text())
          assert d.get('status')=='PAUSED', d.get('status')
          assert os.environ['EXPECTED_WORKER_CONTAINER_ID'] in json.dumps(d)
          print('M24_TIMER_STILL_PAUSED_AFTER_DEPLOY=PASS')
          PY

      - name: Prove zero drift after deployment
        shell: bash
        run: |
          set -euo pipefail
          export TF_VAR_yc_token="$(cat "$RUNNER_TEMP/iam-token")"
          set +e
          terraform -chdir="$TF_DIR" plan -detailed-exitcode -input=false -no-color \
            -var="mcp_image_url=${EXPECTED_PUBLIC_MCP_IMAGE}" \
            -var="source_commit_sha=${EXPECTED_PUBLIC_MCP_SOURCE_SHA}" \
            -var="mcp_allowed_hosts=${EXPECTED_PUBLIC_ALLOWED_HOSTS}" \
            -var="mcp_allowed_origins=${EXPECTED_PUBLIC_ALLOWED_ORIGINS}" \
            -var="m24_worker_image_url=${M24_WORKER_IMAGE}" \
            -var="m24_worker_source_sha=${M24_WORKER_SOURCE_SHA}" \
            -var="m24_infra_oidc_bootstrap_enabled=false" > "$RUNNER_TEMP/zero-drift.txt"
          rc=$?
          set -e
          test "$rc" = 0 || { cat "$RUNNER_TEMP/zero-drift.txt"; exit "$rc"; }
          echo 'M24_WORKER_ZERO_DRIFT=PASS'

      - name: Cleanup ephemeral credentials
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/iam-token" "$RUNNER_TEMP/yc" "$RUNNER_TEMP/yc.tar.gz" "$RUNNER_TEMP/before-state.json" "$RUNNER_TEMP/after-state.json" "$RUNNER_TEMP/timer-before.json" "$RUNNER_TEMP/timer-after.json" "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/m24-worker.tfplan" "$RUNNER_TEMP/zero-drift.txt"
