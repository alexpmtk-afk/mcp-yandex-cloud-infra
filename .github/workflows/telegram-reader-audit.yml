name: Telegram Reader Audit

on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-reader-audit.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-news-reader-ssh
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"

      - name: Authenticate
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          yc config profile create telegram-reader-audit || true
          yc config profile activate telegram-reader-audit
          yc config set service-account-key "$key"

      - name: Audit production Reader
        shell: bash
        run: |
          set -euo pipefail
          folder="b1gk4p83brasi8g811jv"
          ip="$(curl -fsS https://api.ipify.org)"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/tgkey"
          old_keys="$(yc compute instance get telegram-news-reader --folder-id "$folder" --format json | jq -r '.metadata["ssh-keys"] // ""')"
          printf '%s' "$old_keys" > "$RUNNER_TEMP/oldkeys"
          { printf '%s\n' "$old_keys"; printf 'ubuntu:'; cat "$RUNNER_TEMP/tgkey.pub"; } > "$RUNNER_TEMP/newkeys"
          yc compute instance add-metadata telegram-news-reader --folder-id "$folder" --metadata-from-file ssh-keys="$RUNNER_TEMP/newkeys"
          yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id "$folder" --add-rule "description=github-telegram-reader-audit,direction=ingress,port=22,protocol=tcp,v4-cidrs=$ip/32"

          ssh_opts=(-o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -i "$RUNNER_TEMP/tgkey")
          ready=0
          for attempt in $(seq 1 12); do
            if ssh "${ssh_opts[@]}" ubuntu@111.88.248.156 true >/dev/null 2>&1; then ready=1; break; fi
            echo "SSH key not active yet; retry $attempt/12"
            sleep 10
          done
          test "$ready" -eq 1

          ssh "${ssh_opts[@]}" ubuntu@111.88.248.156 'set -euo pipefail
            echo "=== VM / STATE ==="
            test -d /state
            findmnt /state
            df -h /state
            echo "=== CONTAINER ==="
            sudo docker inspect -f "status={{.State.Status}} started={{.State.StartedAt}} restart={{.HostConfig.RestartPolicy.Name}}" telegram-reader
            test "$(sudo docker inspect -f "{{.State.Running}}" telegram-reader)" = "true"
            echo "=== DATABASE ==="
            sudo docker exec telegram-reader python -c "import sqlite3; c=sqlite3.connect(\"/state/telegram.db\"); print(\"quick_check=\"+str(c.execute(\"pragma quick_check\").fetchone()[0])); print(\"messages=\"+str(c.execute(\"select count(*) from messages\").fetchone()[0])); print(\"latest=\"+str(c.execute(\"select max(datetime) from messages\").fetchone()[0]))"
            echo "=== SESSION ==="
            session_count=$(sudo find /state -maxdepth 2 -type f -name "*.session" | wc -l)
            echo "session_files=$session_count"
            test "$session_count" -ge 1
            echo "=== EXPORT ==="
            sudo docker exec telegram-reader python -c "import json; d=json.load(open(\"/state/exports/TELEGRAM_NEWS_LATEST.json\")); print(\"schema=\"+str(d.get(\"schema\"))); print(\"generated_at=\"+str(d.get(\"generated_at\"))); print(\"window_hours=\"+str(d.get(\"window_hours\"))); print(\"allowed_chats=\"+str(d.get(\"allowed_chats\"))); print(\"message_count=\"+str(d.get(\"message_count\"))); print(\"media=\"+str(d.get(\"media_message_count\"))); print(\"preview=\"+str(d.get(\"preview_message_count\")))"
            echo "=== RECENT LOG ERRORS ==="
            sudo docker logs --since 6h telegram-reader 2>&1 | grep -Ei "traceback|permissionerror|error|exception" | tail -n 30 || true
          '

          echo "=== HTTPS ==="
          health_code=$(curl -k -sS -o "$RUNNER_TEMP/health.out" -w '%{http_code}' https://111-88-248-156.sslip.io/health || true)
          manage_code=$(curl -k -sS -o "$RUNNER_TEMP/manage.out" -w '%{http_code}' https://111-88-248-156.sslip.io/manage || true)
          echo "health_http=$health_code"
          echo "manage_http=$manage_code"
          test "$health_code" = "200"
          case "$manage_code" in 200|401|403) ;; *) echo "Unexpected /manage status"; exit 1;; esac
          echo TELEGRAM_READER_AUDIT_PASS

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          yc config profile activate telegram-reader-audit >/dev/null 2>&1 || true
          folder="b1gk4p83brasi8g811jv"
          ids=$(yc vpc security-group get enpocnvnpdu2goj9nkjn --folder-id "$folder" --format json | jq -r '.rules[] | select(.description=="github-telegram-reader-audit") | .id')
          for id in $ids; do yc vpc security-group update-rules enpocnvnpdu2goj9nkjn --folder-id "$folder" --delete-rule-id "$id"; done
          if [ -f "$RUNNER_TEMP/oldkeys" ]; then yc compute instance add-metadata telegram-news-reader --folder-id "$folder" --metadata-from-file ssh-keys="$RUNNER_TEMP/oldkeys"; fi
          rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/tgkey" "$RUNNER_TEMP/tgkey.pub" "$RUNNER_TEMP/oldkeys" "$RUNNER_TEMP/newkeys"
