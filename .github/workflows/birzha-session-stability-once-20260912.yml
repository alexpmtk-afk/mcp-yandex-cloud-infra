name: BIRZHA MCP session stability once 2026-09-12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/birzha-session-stability-once-20260912.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false
      - name: Runtime coordinates
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          YC_TFSTATE_ACCESS_KEY: ${{ secrets.YC_TFSTATE_ACCESS_KEY }}
          YC_TFSTATE_SECRET_KEY: ${{ secrets.YC_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"; chmod 600 "$RUNNER_TEMP/key.json"
          echo "YC_KEY_FILE=$RUNNER_TEMP/key.json" >> "$GITHUB_ENV"
          terraform -chdir=terraform/birzha_test init -reconfigure -input=false -lockfile=readonly \
            -backend-config="access_key=$YC_TFSTATE_ACCESS_KEY" -backend-config="secret_key=$YC_TFSTATE_SECRET_KEY" >/dev/null
          terraform -chdir=terraform/birzha_test output -json > "$RUNNER_TEMP/o.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          o=json.loads((Path(os.environ['RUNNER_TEMP'])/'o.json').read_text()); v=lambda k:o[k]['value']
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'MCP_ENDPOINT={v("mcp_endpoint")}\nMCP_AUTH_SECRET_ID={v("mcp_auth_secret_id")}\nMCP_AUTH_VERSION_ID={v("mcp_auth_secret_version_id")}\n')
          PY
      - name: Install clients and token
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'mcp==2.1.1' 'yandexcloud' >/dev/null
          python - <<'PY'
          import json,os
          from pathlib import Path
          import yandexcloud
          from yandex.cloud.lockbox.v1.payload_service_pb2 import GetPayloadRequest
          from yandex.cloud.lockbox.v1.payload_service_pb2_grpc import PayloadServiceStub
          k=json.loads(Path(os.environ['YC_KEY_FILE']).read_text())
          p=yandexcloud.SDK(service_account_key=k).client(PayloadServiceStub).Get(GetPayloadRequest(secret_id=os.environ['MCP_AUTH_SECRET_ID'],version_id=os.environ['MCP_AUTH_VERSION_ID']))
          t=[x.text_value for x in p.entries if x.key=='bearer_token'][0]; print(f'::add-mask::{t}'); Path(os.environ['RUNNER_TEMP']+'/token').write_text(t)
          PY
      - name: Probe repeated MCP sessions
        shell: bash
        run: |
          python - <<'PY'
          import asyncio,json,os
          from pathlib import Path
          import httpx2
          from mcp import Client
          from mcp.client.streamable_http import streamable_http_client

          async def one(i):
              token=Path(os.environ['RUNNER_TEMP']+'/token').read_text()
              try:
                  async with httpx2.AsyncClient(headers={'Authorization':f'Bearer {token}'},timeout=httpx2.Timeout(30,read=90),follow_redirects=True) as hc:
                      async with Client(streamable_http_client(os.environ['MCP_ENDPOINT'],http_client=hc)) as c:
                          tools=await c.list_tools()
                          r=await c.call_tool('system.version',{})
                          if r.is_error: raise RuntimeError(str(r))
                          return {'attempt':i,'ok':True,'tool_count':len(tools.tools),'version':(r.structured_content or {}).get('version')}
              except Exception as e:
                  return {'attempt':i,'ok':False,'type':type(e).__name__,'error':str(e)[:300]}

          async def continuous():
              token=Path(os.environ['RUNNER_TEMP']+'/token').read_text(); out=[]
              try:
                  async with httpx2.AsyncClient(headers={'Authorization':f'Bearer {token}'},timeout=httpx2.Timeout(30,read=90),follow_redirects=True) as hc:
                      async with Client(streamable_http_client(os.environ['MCP_ENDPOINT'],http_client=hc)) as c:
                          for i in range(1,11):
                              try:
                                  r=await c.call_tool('system.version',{})
                                  out.append({'call':i,'ok':not r.is_error,'error':str(r)[:200] if r.is_error else None})
                              except Exception as e:
                                  out.append({'call':i,'ok':False,'type':type(e).__name__,'error':str(e)[:300]})
              except Exception as e:
                  out.append({'session_init':False,'type':type(e).__name__,'error':str(e)[:300]})
              return out

          async def main():
              independent=[]
              for i in range(1,13): independent.append(await one(i))
              cont=await continuous()
              report={'independent':independent,'continuous':cont,'independent_ok':sum(x.get('ok',False) for x in independent),'independent_total':len(independent),'continuous_ok':sum(x.get('ok',False) for x in cont if 'call' in x),'continuous_total':sum(1 for x in cont if 'call' in x)}
              print('BIRZHA_SESSION_STABILITY_REPORT='+json.dumps(report,sort_keys=True))
          asyncio.run(main())
          PY
      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/token"
