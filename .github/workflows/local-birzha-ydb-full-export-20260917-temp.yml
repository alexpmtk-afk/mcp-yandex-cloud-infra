name: Local Birzha YDB full export 2026-09-17

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/local-birzha-ydb-full-export-20260917-temp.yml"

permissions:
  contents: read

concurrency:
  group: local-birzha-ydb-full-export-20260917
  cancel-in-progress: false

env:
  YDB_ENDPOINT: grpcs://ydb.serverless.yandexcloud.net:2135
  YDB_DATABASE: /ru-central1/b1gi4pr9msenirafh2c7/etnes7omhgut11oulsd5

jobs:
  dump:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 60
    env:
      YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
    steps:
      - name: Install YDB CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL https://install.ydb.tech/cli | bash
          YDB_BIN="$(find "$HOME" -type f -name ydb -perm -111 2>/dev/null | head -1)"
          test -x "$YDB_BIN"
          echo "YDB_BIN=$YDB_BIN" >> "$GITHUB_ENV"
          "$YDB_BIN" version

      - name: Prepare service-account credentials
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/ydb-sa-key.json"
          chmod 600 "$RUNNER_TEMP/ydb-sa-key.json"

      - name: Inspect and dump full Birzha YDB schema plus data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ydb-export-parent"
          OUT="$RUNNER_TEMP/ydb-export-parent/full-dump"
          "$YDB_BIN" -e "$YDB_ENDPOINT" -d "$YDB_DATABASE" --sa-key-file "$RUNNER_TEMP/ydb-sa-key.json" discovery whoami
          "$YDB_BIN" -e "$YDB_ENDPOINT" -d "$YDB_DATABASE" --sa-key-file "$RUNNER_TEMP/ydb-sa-key.json" scheme ls -lR > "$RUNNER_TEMP/ydb-export-parent/scheme-list.txt"
          "$YDB_BIN" -e "$YDB_ENDPOINT" -d "$YDB_DATABASE" --sa-key-file "$RUNNER_TEMP/ydb-sa-key.json" tools dump -o "$OUT" --consistency-level database
          FILES="$(find "$OUT" -type f | wc -l)"
          BYTES="$(du -sb "$OUT" | awk '{print $1}')"
          echo "YDB_DUMP=PASS files=$FILES bytes=$BYTES"
          tar -C "$RUNNER_TEMP/ydb-export-parent" -czf "$GITHUB_WORKSPACE/birzha-ydb-full-dump.tar.gz" full-dump scheme-list.txt
          ARCHIVE_BYTES="$(stat -c%s "$GITHUB_WORKSPACE/birzha-ydb-full-dump.tar.gz")"
          echo "YDB_ARCHIVE=PASS bytes=$ARCHIVE_BYTES"
          printf '{"dump_files":%s,"dump_bytes":%s,"archive_bytes":%s}\n' "$FILES" "$BYTES" "$ARCHIVE_BYTES" > "$GITHUB_WORKSPACE/birzha-ydb-export-summary.json"

      - name: Upload full YDB dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: birzha-ydb-full-dump
          path: |
            birzha-ydb-full-dump.tar.gz
            birzha-ydb-export-summary.json
          if-no-files-found: error
          retention-days: 3

      - name: Cleanup credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ydb-sa-key.json"

  copy_to_work:
    needs: dump
    runs-on: [self-hosted, Windows, X64, gpt-powershell-work]
    timeout-minutes: 30
    steps:
      - name: Download YDB dump artifact
        uses: actions/download-artifact@v4
        with:
          name: birzha-ydb-full-dump
          path: ${{ runner.temp }}\birzha-ydb-transfer

      - name: Extract full dump to WORK
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:RUNNER_TEMP 'birzha-ydb-transfer\birzha-ydb-full-dump.tar.gz'
          $summary=Join-Path $env:RUNNER_TEMP 'birzha-ydb-transfer\birzha-ydb-export-summary.json'
          $dest='C:\MCP\migration\yandex-manual\birzha\ydb-export'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          if (@(Get-ChildItem -LiteralPath $dest -Force -ErrorAction SilentlyContinue).Count -gt 0) { throw 'YDB destination is not empty; refusing to overwrite' }
          tar -xzf $src -C $dest
          Copy-Item -LiteralPath $summary -Destination (Join-Path $dest '_export_summary.json')
          $files=@(Get-ChildItem -LiteralPath $dest -File -Recurse -Force)
          $bytes=($files | Measure-Object Length -Sum).Sum
          Write-Host ("YDB_LOCAL_COPY=PASS files={0} bytes={1}" -f $files.Count,[int64]$bytes)
