name: Diagnose Laser WB Finance Timeout

on:
  push:
    paths:
      - 'control/run-laser-wb-finance-timeout-diag.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
      CLOUD_ID: b1gi4pr9msenirafh2c7
      FOLDER_NAME: marketplaces-mcp-test
      LASER_JOB_KEY: app/jobs/wb-finance/wb-finance-wb_laser_master-2026.json
    steps:
      - name: Install diagnostic dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL --retry 5 --retry-delay 3 https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz -o "$RUNNER_TEMP/yc.tgz"
          tar -xzf "$RUNNER_TEMP/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
          python -m pip install --quiet 'httpx>=0.27,<1'

      - name: Resolve Yandex resources and secret payload
        shell: bash
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY"
          chmod 600 "$KEY"
          yc config profile create laser-wb-diag || true
          yc config set service-account-key "$KEY"
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r --arg n "$FOLDER_NAME" '.[]|select(.name==$n)|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          SECRET_ID="$(yc lockbox secret list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-api-credentials")|.id'|head -1)"
          test -n "$SECRET_ID"
          yc lockbox secret list-versions --id "$SECRET_ID" --format json --no-user-output > "$RUNNER_TEMP/versions.json"
          VERSION_ID="$(jq -r '[.[]|select(.status=="ACTIVE")|select((.payload_entry_keys // [])|index("cabinets_json") != null)]|sort_by(.created_at)|last|.id // empty' "$RUNNER_TEMP/versions.json")"
          test -n "$VERSION_ID"
          yc lockbox payload get --id "$SECRET_ID" --version-id "$VERSION_ID" --format json --no-user-output > "$RUNNER_TEMP/payload.json"
          DOMAIN="$(yc serverless api-gateway list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|contains("marketplaces"))][0].domain//.[0].domain//empty')"
          CONTAINER_ID="$(yc serverless container list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          BUCKET="$(yc storage bucket list --folder-id "$FOLDER_ID" --format json | jq -r '[.[]|select((.name//"")|startswith("marketplaces-mcp-archive-"))][0].name//empty')"
          test -n "$DOMAIN"; test -n "$CONTAINER_ID"; test -n "$BUCKET"
          IAM_TOKEN="$(yc iam create-token)"
          test -n "$IAM_TOKEN"
          echo "::add-mask::$IAM_TOKEN"
          printf '%s' "$IAM_TOKEN" > "$RUNNER_TEMP/iam-token"
          chmod 600 "$RUNNER_TEMP/iam-token"
          printf '%s' "$DOMAIN" > "$RUNNER_TEMP/domain"
          printf '%s' "$CONTAINER_ID" > "$RUNNER_TEMP/container-id"
          printf '%s' "$BUCKET" > "$RUNNER_TEMP/bucket"
          echo 'RESOURCE_RESOLUTION=PASS'

      - name: Read durable Laser state directly from Object Storage
        shell: bash
        run: |
          set -euo pipefail
          export IAM_TOKEN="$(cat "$RUNNER_TEMP/iam-token")"
          export BUCKET="$(cat "$RUNNER_TEMP/bucket")"
          python -u - <<'PY'
          import json, os, httpx
          key=os.environ['LASER_JOB_KEY']
          url=f"https://storage.yandexcloud.net/{os.environ['BUCKET']}/{key}"
          r=httpx.get(url,headers={'Authorization':'Bearer '+os.environ['IAM_TOKEN']},timeout=60)
          r.raise_for_status()
          s=r.json()
          idx=int(s.get('report_index',0) or 0)
          frags=s.get('fragments') or []
          assert 0 <= idx < len(frags), (idx,len(frags))
          f=frags[idx]
          print('JOB_STATUS='+str(s.get('status')))
          print('JOB_PHASE='+str(s.get('phase')))
          print('REPORT_INDEX='+str(idx))
          print('REPORTS_TOTAL='+str(len(frags)))
          print('CURRENT_REPORT_ID='+str(f.get('report_id')))
          print('CURRENT_DATE_FROM='+str(f.get('date_from')))
          print('CURRENT_DATE_TO='+str(f.get('date_to')))
          print('CURRENT_LOGICAL_WEEK='+str(f.get('logical_week_from'))+'..'+str(f.get('logical_week_to')))
          print('CURRENT_RRD_ID='+str(s.get('current_rrd_id')))
          print('PROVIDER_CALLS='+str(s.get('provider_calls')))
          with open(os.environ['RUNNER_TEMP']+'/laser-current.json','w',encoding='utf-8') as h:
              json.dump({'report_id':int(f['report_id']),'rrd_id':int(s.get('current_rrd_id',0) or 0),'date_from':f['date_from'],'date_to':f['date_to']},h)
          PY

      - name: Inspect runtime logs around failed worker calls
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_ID="$(cat "$RUNNER_TEMP/container-id")"
          if timeout 60s yc logging read --resource-ids="$CONTAINER_ID" --since '3h ago' --limit 1000 --format json > "$RUNNER_TEMP/runtime-logs.json"; then
            echo "RUNTIME_LOG_COUNT=$(jq 'length' "$RUNNER_TEMP/runtime-logs.json")"
            jq -r '.[] | [(.timestamp // .ingested_at // ""), (.level // ""), (.message // .json_payload.message // .text_payload // "")] | @tsv' "$RUNNER_TEMP/runtime-logs.json" \
              | grep -Ei 'timeout|readtimeout|finance-api|sales-reports|traceback|error|exception' \
              | tail -n 120 || true
          else
            echo 'RUNTIME_LOG_READ=UNAVAILABLE'
          fi

      - name: Direct WB probe bypassing MCP and API Gateway
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -u - <<'PY'
          import json, os, time, httpx
          with open(os.environ['RUNNER_TEMP']+'/payload.json',encoding='utf-8') as h:
              payload=json.load(h)
          entries={e.get('key'): e.get('text_value','') for e in payload.get('entries',[])}
          cabinets=json.loads(entries['cabinets_json'])
          token=cabinets['wb']['cabinets']['wb_laser_master']['token']
          assert token
          with open(os.environ['RUNNER_TEMP']+'/laser-current.json',encoding='utf-8') as h:
              cur=json.load(h)
          report_id=int(cur['report_id']); rrd_id=int(cur['rrd_id'])
          url=f'https://finance-api.wildberries.ru/api/finance/v1/sales-reports/detailed/{report_id}'
          body={'limit':5000,'rrdId':rrd_id}
          timeout=httpx.Timeout(connect=15.0,read=180.0,write=30.0,pool=15.0)
          t0=time.monotonic()
          try:
              with httpx.Client(timeout=timeout) as c:
                  r=c.post(url,headers={'Authorization':token,'Accept':'application/json','Content-Type':'application/json','User-Agent':'marketplace-mcp-diagnostic/1'},json=body)
              elapsed=time.monotonic()-t0
              print(f'DIRECT_WB_HTTP_STATUS={r.status_code}')
              print(f'DIRECT_WB_ELAPSED_SECONDS={elapsed:.3f}')
              print(f'DIRECT_WB_RESPONSE_BYTES={len(r.content)}')
              retry=r.headers.get('Retry-After') or r.headers.get('X-Ratelimit-Retry') or ''
              if retry: print('DIRECT_WB_RETRY_AFTER='+retry)
              if r.status_code == 200:
                  data=r.json()
                  print('DIRECT_WB_ROWS='+str(len(data) if isinstance(data,list) else -1))
                  if isinstance(data,list) and data:
                      print('DIRECT_WB_FIRST_RRD='+str(data[0].get('rrdId')))
                      print('DIRECT_WB_LAST_RRD='+str(data[-1].get('rrdId')))
                      print('DIRECT_WB_REPORT_IDS='+','.join(str(x) for x in sorted({row.get('reportId') for row in data if row.get('reportId') is not None})[:10]))
              elif r.status_code == 204:
                  print('DIRECT_WB_ROWS=0')
              else:
                  print('DIRECT_WB_ERROR_BODY='+r.text[:500].replace('\n',' '))
          except Exception as exc:
              elapsed=time.monotonic()-t0
              print(f'DIRECT_WB_EXCEPTION={type(exc).__name__}:{exc}')
              print(f'DIRECT_WB_ELAPSED_SECONDS={elapsed:.3f}')
              raise
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/yc.tgz" "$RUNNER_TEMP/versions.json" "$RUNNER_TEMP/payload.json" "$RUNNER_TEMP/iam-token" "$RUNNER_TEMP/domain" "$RUNNER_TEMP/container-id" "$RUNNER_TEMP/bucket" "$RUNNER_TEMP/laser-current.json" "$RUNNER_TEMP/runtime-logs.json"
