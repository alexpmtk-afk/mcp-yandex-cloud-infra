name: Yandex cost audit fast temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yandex-cost-audit-fast-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 5
    steps:
      - name: Install YC CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"
      - name: Authenticate
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"
          chmod 600 "$RUNNER_TEMP/key.json"
          yc config profile create cost-audit-fast || true
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          yc config set cloud-id b1gi4pr9msenirafh2c7
      - name: Fast cost inventory
        shell: bash
        run: |
          set +e
          for ITEM in \
            'birzha-mcp-forecast-test:b1g00gqb66tbnfoumnkv' \
            'default:b1g0r8h0no6tomn7f5rs' \
            'marketplace-card-monitor:b1g5t7v7u1mnsjd2ai7u' \
            'marketplaces-mcp-test:b1gnd0dqoq3ljod88i8t' \
            'telegram-news-reader:b1gk4p83brasi8g811jv'; do
            N="${ITEM%%:*}"; F="${ITEM##*:}"
            echo "=== $N ==="
            echo DISKS; timeout 15s yc compute disk list --folder-id "$F" --format json --no-user-output 2>/dev/null | jq '{count:length,total_gib:(map((.size|tonumber)/1073741824)|add//0),items:[.[]|{name,type_id,size_gib:((.size|tonumber)/1073741824),instance_ids}]}' || true
            echo ADDRESSES; timeout 15s yc vpc address list --folder-id "$F" --format json --no-user-output 2>/dev/null | jq '[.[]|{name,reserved,used,external_ipv4_address:(.external_ipv4_address.address//null)}]' || true
            echo INSTANCES; timeout 15s yc compute instance list --folder-id "$F" --format json --no-user-output 2>/dev/null | jq '[.[]|{name,status,resources,public_ips:[.network_interfaces[]?.primary_v4_address.one_to_one_nat.address//empty]}]' || true
            echo CONTAINERS; timeout 15s yc serverless container list --folder-id "$F" --format json --no-user-output 2>/dev/null | jq '[.[]|{id,name,status}]' || true
            echo GATEWAYS; timeout 15s yc serverless api-gateway list --folder-id "$F" --format json --no-user-output 2>/dev/null | jq '[.[]|{name,status}]' || true
            echo YDB; timeout 15s yc ydb database list --folder-id "$F" --format json --no-user-output 2>/dev/null | jq '[.[]|{id,name,status,type}]' || true
            echo BUCKETS; timeout 15s yc storage bucket list --folder-id "$F" --format json --no-user-output 2>/dev/null | jq '[.[]|{name,max_size,default_storage_class}]' || true
            echo REGISTRIES; timeout 15s yc container registry list --folder-id "$F" --format json --no-user-output 2>/dev/null | jq '[.[]|{id,name,status}]' || true
            for R in $(timeout 15s yc container registry list --folder-id "$F" --format json --no-user-output 2>/dev/null | jq -r '.[].id'); do
              timeout 15s yc container image list --registry-id "$R" --format json --no-user-output 2>/dev/null | jq --arg r "$R" '{registry:$r,images:length,compressed_gib_upper_bound:((map((.compressed_size//"0")|tonumber)|add//0)/1073741824)}' || true
            done
            echo LOCKBOX; timeout 15s yc lockbox secret list --folder-id "$F" --format json --no-user-output 2>/dev/null | jq '{count:length,names:[.[].name]}' || true
          done
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json"
