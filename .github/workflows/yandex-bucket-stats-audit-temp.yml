name: Yandex bucket stats audit temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yandex-bucket-stats-audit-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 4
    steps:
      - name: Install YC CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"
      - name: Authenticate and read bucket stats
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"
          chmod 600 "$RUNNER_TEMP/key.json"
          yc config profile create bucket-cost-audit || true
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          yc config set cloud-id b1gi4pr9msenirafh2c7
          for B in \
            marketplaces-mcp-archive-b1gnd0dqoq3ljod88i8t \
            marketplaces-mcp-tfstate-b1gnd0dqoq3ljod88i8t \
            telegram-reader-media-alexpmtk-20260910; do
            echo "=== $B ==="
            yc storage bucket stats "$B" --format json --no-user-output | jq '{name,max_size,used_size,default_storage_class,storage_class_used_sizes,storage_class_counters}'
          done
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json"
