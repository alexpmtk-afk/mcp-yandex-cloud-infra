name: Finalize Bridge v1 release once

on:
  push:
    branches:
      - bridge-v1-final-release
    paths:
      - scripts/finalize_bridge_v1_release.py
      - .github/workflows/bridge-v1-final-release-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge-v1-final-release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic final release patch
        run: python scripts/finalize_bridge_v1_release.py
      - name: Validate generated release
        shell: bash
        run: |
          set -euo pipefail
          cp shared/google-drive-bridge/bridge.gs "$RUNNER_TEMP/bridge.js"
          node --check "$RUNNER_TEMP/bridge.js"
          python -m pip install --disable-pip-version-check pytest httpx
          pytest -q shared/google-drive-bridge/tests
          grep -Fq "BRIDGE_RELEASE = '1.0.0'" shared/google-drive-bridge/bridge.gs
          ! grep -R -n 'NOT_IMPLEMENTED' shared/google-drive-bridge
          echo BRIDGE_V1_FINAL_RELEASE_VALIDATION=PASS
      - name: Commit generated release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shared/google-drive-bridge/bridge.gs shared/google-drive-bridge/VERSION shared/google-drive-bridge/STATUS.md shared/google-drive-bridge/tests/test_protocol_contract.py
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'bridge v1: finalize stable 1.0.0 runtime'
            git push origin HEAD:bridge-v1-final-release
          fi
