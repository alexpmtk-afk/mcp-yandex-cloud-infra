name: Inspect Cloud Billing State

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-cloud-billing-state.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"

      - name: Authenticate deployer
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"
          yc config set cloud-id b1gi4pr9msenirafh2c7
          yc config set folder-id b1gnd0dqoq3ljod88i8t

      - name: Inspect cloud object and quotas
        shell: bash
        run: |
          set +e
          echo '--- CLOUD_GET ---'
          yc resource-manager cloud get b1gi4pr9msenirafh2c7 --format json --no-user-output
          echo "cloud_get_exit=$?"
          echo '--- CLOUD_QUOTAS ---'
          yc quota-manager quota-limit list --resource-id b1gi4pr9msenirafh2c7 --format json --no-user-output
          echo "quota_list_exit=$?"
          echo '--- SERVERLESS_QUOTAS ---'
          yc serverless container --help 2>&1 | grep -i -C2 quota || true

      - name: Inspect visible billing accounts and cloud bindings
        shell: bash
        run: |
          set +e
          echo '--- BILLING_ACCOUNTS ---'
          yc billing account list --format json --no-user-output > "$RUNNER_TEMP/billing.json"
          BILL_EXIT=$?
          echo "billing_list_exit=$BILL_EXIT"
          if [[ $BILL_EXIT -eq 0 ]]; then
            jq -c '.[] | {id,name,active,status,country_code,currency}' "$RUNNER_TEMP/billing.json"
            jq -r '.[].id' "$RUNNER_TEMP/billing.json" | while read -r bid; do
              echo "--- BILLING_CLOUD_BINDINGS account=$bid ---"
              yc billing account list-cloud-bindings --id "$bid" --format json --no-user-output || true
            done
          fi

      - name: Inspect billing CLI surface for status and suspension
        shell: bash
        run: |
          set +e
          echo '--- BILLING_HELP ---'
          yc billing account --help 2>&1 | head -180
          echo '--- CLOUD_HELP_STATUS ---'
          yc resource-manager cloud --help 2>&1 | grep -i -C3 'status\|suspend\|billing' || true

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/billing.json"
