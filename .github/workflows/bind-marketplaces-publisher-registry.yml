name: Bind Marketplaces Publisher to TEST Registry
# Trigger narrow direct registry binding.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bind-marketplaces-publisher-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUD_ID: b1gi4pr9msenirafh2c7
  TEST_FOLDER_NAME: marketplaces-mcp-test
  REGISTRY_ID: crp6o36mbl2tqonu1qbi
  PUBLISHER_SA_ID: ajepo7pe5jcrufdf0mv0

jobs:
  bind:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"

      - name: Authenticate central deployer
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          CI_SA_ID="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          [[ "$CI_SA_ID" == "ajecdjjrkdo1t3itpl9k" ]]
          echo "::add-mask::$CI_SA_ID"
          echo "CI_SA_ID=$CI_SA_ID" >> "$GITHUB_ENV"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r --arg n "$TEST_FOLDER_NAME" '.[]|select(.name==$n)|.id' | head -1)"
          test -n "$FOLDER_ID"
          echo "FOLDER_ID=$FOLDER_ID" >> "$GITHUB_ENV"
          yc config set folder-id "$FOLDER_ID"

      - name: Ensure direct registry pusher binding for dedicated publisher
        shell: bash
        run: |
          set -euo pipefail
          yc container registry list-access-bindings "$REGISTRY_ID" --format json --no-user-output > "$RUNNER_TEMP/before.json"
          PRESENT="$(jq -r --arg id "$PUBLISHER_SA_ID" 'any(.[]; .role_id=="container-registry.images.pusher" and .subject.type=="serviceAccount" and .subject.id==$id)' "$RUNNER_TEMP/before.json")"
          if [[ "$PRESENT" != "true" ]]; then
            yc container registry add-access-binding "$REGISTRY_ID" --role container-registry.images.pusher --service-account-id "$PUBLISHER_SA_ID"
            sleep 15
          fi
          yc container registry list-access-bindings "$REGISTRY_ID" --format json --no-user-output > "$RUNNER_TEMP/after.json"
          jq -e --arg id "$PUBLISHER_SA_ID" '.[]|select(.role_id=="container-registry.images.pusher" and .subject.type=="serviceAccount" and .subject.id==$id)' "$RUNNER_TEMP/after.json" >/dev/null
          echo 'publisher_direct_registry_pusher=PASS'

      - name: Cleanup ephemeral key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json" "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json"
