name: Telegram encrypted local migration bundle 2026-09-17 temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-local-migration-bundle-20260917-temp.yml"

permissions:
  contents: read

env:
  FOLDER_ID: b1gk4p83brasi8g811jv
  MIGRATION_PUBLIC_KEY_B64: 

jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    env:
      YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
    steps:
      - name: Install Yandex CLI and crypto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          echo "$RUNNER_TEMP/yc" >> "$GITHUB_PATH"
          python -m pip install --quiet cryptography

      - name: Authenticate without exposing credential material
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          "$RUNNER_TEMP/yc/yc" config profile create tg-local-migration >/dev/null 2>&1 || true
          "$RUNNER_TEMP/yc/yc" config profile activate tg-local-migration >/dev/null
          "$RUNNER_TEMP/yc/yc" config set service-account-key "$key" >/dev/null
          "$RUNNER_TEMP/yc/yc" config set folder-id "$FOLDER_ID" >/dev/null
          echo YANDEX_AUTH=PASS

      - name: Build and encrypt Telegram migration bundle
        shell: bash
        run: |
          set -euo pipefail
          export YC_BIN="$RUNNER_TEMP/yc/yc"
          python - <<'PY'
          import base64, json, os, subprocess, time, urllib.parse, urllib.request
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          folder = os.environ['FOLDER_ID']
          yc = os.environ['YC_BIN']

          def yc_json(*args):
              p = subprocess.run([yc, *args, '--folder-id', folder, '--format', 'json', '--no-user-output'], capture_output=True, text=True, timeout=120)
              if p.returncode != 0:
                  return {'_error': (p.stderr or p.stdout or '')[-2000:], '_args': list(args)}
              try:
                  return json.loads(p.stdout)
              except Exception:
                  return {'_error': 'invalid json', '_args': list(args)}

          def iam_token():
              p = subprocess.run([yc, 'iam', 'create-token'], capture_output=True, text=True, timeout=60, check=True)
              return p.stdout.strip()

          token = iam_token()

          def get_json(url):
              req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode('utf-8'))

          def paged(url, key):
              out=[]; page=None
              while True:
                  sep='&' if '?' in url else '?'
                  full=url+sep+'pageSize=1000'
                  if page:
                      full += '&pageToken=' + urllib.parse.quote(page, safe='')
                  data=get_json(full)
                  out.extend(data.get(key, []))
                  page=data.get('nextPageToken')
                  if not page:
                      return out

          inventory = {
              'generated_at_epoch': int(time.time()),
              'folder_id': folder,
              'instances': yc_json('compute','instance','list'),
              'disks': yc_json('compute','disk','list'),
              'buckets': yc_json('storage','bucket','list'),
              'serverless_containers': yc_json('serverless','container','list'),
              'api_gateways': yc_json('serverless','api-gateway','list'),
              'ydb_databases': yc_json('ydb','database','list'),
              'registries': yc_json('container','registry','list'),
          }

          bucket_stats=[]
          if isinstance(inventory['buckets'], list):
              for b in inventory['buckets']:
                  name=b.get('name')
                  if not name:
                      continue
                  stats=yc_json('storage','bucket','stats',name)
                  bucket_stats.append({'name':name,'stats':stats})
          inventory['bucket_stats']=bucket_stats

          secrets = paged(f'https://lockbox.api.cloud.yandex.net/lockbox/v1/secrets?folderId={urllib.parse.quote(folder)}', 'secrets')
          secret_bundle=[]
          for secret in secrets:
              sid=secret['id']
              versions=paged(f'https://lockbox.api.cloud.yandex.net/lockbox/v1/secrets/{urllib.parse.quote(sid)}/versions', 'versions')
              exported=[]
              for version in versions:
                  status=version.get('status')
                  item={'metadata':version,'payload_status':status,'payload':None}
                  if status != 'DESTROYED':
                      vid=version['id']
                      url=(f'https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/{urllib.parse.quote(sid)}/payload'
                           f'?versionId={urllib.parse.quote(vid)}')
                      try:
                          item['payload']=get_json(url)
                          item['payload_status']='EXPORTED'
                      except Exception as exc:
                          item['payload_status']='ERROR:'+type(exc).__name__
                  exported.append(item)
              try:
                  current=get_json(f'https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/{urllib.parse.quote(sid)}/payload')
              except Exception as exc:
                  current={'_error':type(exc).__name__}
              secret_bundle.append({'secret':secret,'versions':exported,'current_payload':current})

          bundle={'inventory':inventory,'lockbox':secret_bundle}
          raw=json.dumps(bundle, ensure_ascii=False, separators=(',',':')).encode('utf-8')
          pub=serialization.load_pem_public_key(base64.b64decode(os.environ['MIGRATION_PUBLIC_KEY_B64']))
          aes=AESGCM.generate_key(bit_length=256)
          nonce=os.urandom(12)
          aad=b'telegram-yandex-migration-bundle-20260917'
          ct=AESGCM(aes).encrypt(nonce,raw,aad)
          ek=pub.encrypt(aes,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          envelope={'v':1,'ek':base64.b64encode(ek).decode(),'nonce':base64.b64encode(nonce).decode(),'ct':base64.b64encode(ct).decode()}
          packed=base64.b64encode(json.dumps(envelope,separators=(',',':')).encode()).decode()

          safe_names=[{'id':x.get('id'),'name':x.get('name')} for x in secrets]
          print('TELEGRAM_RESOURCE_INVENTORY=PASS')
          print('TELEGRAM_LOCKBOX_SECRET_COUNT='+str(len(secrets)))
          print('TELEGRAM_LOCKBOX_SECRET_NAMES='+json.dumps(safe_names,separators=(',',':')))
          print('TELEGRAM_MIGRATION_BUNDLE_BYTES='+str(len(raw)))
          print('TELEGRAM_MIGRATION_ENVELOPE_B64='+packed)
          print('TELEGRAM_MIGRATION_BUNDLE_ENCRYPTED=PASS')
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json"

