name: Inspect Marketplaces TEST Bucket Access

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-marketplaces-bucket-access.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"
      - name: Authenticate and inspect bucket access
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/yc-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          yc config set folder-id "$FOLDER_ID"
          RUNTIME_SA="$(yc iam service-account list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-runtime")|.id'|head -1)"
          CI_SA="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          BUCKET="marketplaces-mcp-archive-${FOLDER_ID}"
          echo "folder=$FOLDER_ID runtime_sa=$RUNTIME_SA ci_sa=$CI_SA bucket=$BUCKET"
          echo '--- BUCKET_FULL ---'
          yc storage bucket get "$BUCKET" --full --format json --no-user-output | jq '{name,folder_id,default_storage_class,versioning,max_size,anonymous_access_flags,acl,policy,encryption}'
          echo '--- FOLDER_BINDINGS_RELEVANT ---'
          yc resource-manager folder list-access-bindings "$FOLDER_ID" --format json --no-user-output \
            | jq --arg r "$RUNTIME_SA" --arg c "$CI_SA" '[.[] | select(.subject.id==$r or .subject.id==$c)]'
          echo '--- CLOUD_BINDINGS_RELEVANT ---'
          yc resource-manager cloud list-access-bindings "$CLOUD_ID" --format json --no-user-output \
            | jq --arg r "$RUNTIME_SA" --arg c "$CI_SA" '[.[] | select(.subject.id==$r or .subject.id==$c)]'
          echo 'BUCKET_ACCESS_DIAGNOSTIC=PASS'
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-key.json"
