name: Probe TEST Folder Registry Pusher

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-test-registry-pusher.yml

permissions:
  contents: read

concurrency:
  group: marketplaces-test-registry-bootstrap
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/yc/bin/yc" version

      - name: Authenticate CI service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          CI_SA_ID="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          test -n "$CI_SA_ID"
          echo "CI_SA_ID=$CI_SA_ID" >> "$GITHUB_ENV"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"

      - name: Grant folder-scoped pusher and push disposable probe
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          REGISTRY_ID="$(timeout 45s yc container registry list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp")|.id'|head -1)"
          test -n "$REGISTRY_ID"

          timeout 90s yc resource-manager folder add-access-binding "$FOLDER_ID" \
            --role container-registry.images.pusher \
            --service-account-id "$CI_SA_ID"
          echo 'folder_registry_pusher_binding=PASS'
          sleep 20

          IAM_TOKEN="$(yc iam create-token)"
          test -n "$IAM_TOKEN"
          echo "::add-mask::$IAM_TOKEN"
          printf '%s' "$IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
          unset IAM_TOKEN

          PROBE_TAG="folder-scope-probe-${GITHUB_SHA}"
          IMAGE="cr.yandex/${REGISTRY_ID}/auth-probe:${PROBE_TAG}"
          mkdir -p "$RUNNER_TEMP/registry-probe"
          printf 'FROM scratch\nLABEL purpose="marketplaces-test-folder-registry-pusher-probe"\n' > "$RUNNER_TEMP/registry-probe/Dockerfile"
          docker build --tag "$IMAGE" "$RUNNER_TEMP/registry-probe"
          docker push "$IMAGE"
          echo 'folder_scoped_pusher_docker_push=PASS'

          REPO_NAME="${REGISTRY_ID}/auth-probe"
          IMAGE_ID="$(yc container image list --registry-id "$REGISTRY_ID" --repository-name "$REPO_NAME" --format json | jq -r --arg tag "$PROBE_TAG" '[.[] | select((.tags // []) | index($tag) != null)][0].id // empty')"
          if [[ -n "$IMAGE_ID" ]]; then
            yc container image delete "$IMAGE_ID" || true
            echo 'probe_cleanup=PASS'
          else
            echo 'probe_cleanup=IMAGE_NOT_RESOLVED'
          fi

      - name: Cleanup ephemeral credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json"
