name: Diagnose TEST Registry Policy Chain

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-test-registry-pusher.yml

permissions:
  contents: read

concurrency:
  group: marketplaces-test-registry-bootstrap
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/yc/bin/yc" version

      - name: Authenticate CI service account
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          KEY_FILE="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          CI_SA_ID="$(jq -r '.service_account_id // .serviceAccountId // empty' "$KEY_FILE")"
          test -n "$CI_SA_ID"
          echo "CI_SA_ID=$CI_SA_ID" >> "$GITHUB_ENV"
          yc config profile create github-ci || true
          yc config set service-account-key "$KEY_FILE"

      - name: Inspect effective role and policy chain
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_ID=b1gi4pr9msenirafh2c7
          FOLDER_ID="$(timeout 45s yc resource-manager folder list --cloud-id "$CLOUD_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp-test")|.id'|head -1)"
          test -n "$FOLDER_ID"
          yc config set folder-id "$FOLDER_ID"
          REGISTRY_ID="$(timeout 45s yc container registry list --folder-id "$FOLDER_ID" --format json | jq -r '.[]|select(.name=="marketplaces-mcp")|.id'|head -1)"
          test -n "$REGISTRY_ID"

          timeout 45s yc resource-manager folder list-access-bindings "$FOLDER_ID" --format json > "$RUNNER_TEMP/folder-bindings.json"
          FOLDER_PUSHER="$(jq -r --arg id "$CI_SA_ID" '[.[] | select(.role_id=="container-registry.images.pusher" and .subject.id==$id and .subject.type=="serviceAccount")] | length' "$RUNNER_TEMP/folder-bindings.json")"
          echo "folder_ci_pusher_bindings=$FOLDER_PUSHER"
          test "$FOLDER_PUSHER" -ge 1

          timeout 45s yc container registry list-access-bindings "$REGISTRY_ID" --format json > "$RUNNER_TEMP/registry-bindings.json"
          REGISTRY_PUSHER="$(jq -r --arg id "$CI_SA_ID" '[.[] | select(.role_id=="container-registry.images.pusher" and .subject.id==$id and .subject.type=="serviceAccount")] | length' "$RUNNER_TEMP/registry-bindings.json")"
          echo "registry_ci_pusher_bindings=$REGISTRY_PUSHER"
          test "$REGISTRY_PUSHER" -ge 1

          timeout 45s yc container registry list-ip-permissions "$REGISTRY_ID" --format json > "$RUNNER_TEMP/registry-ip.json"
          echo "registry_ip_permission_count=$(jq 'length' "$RUNNER_TEMP/registry-ip.json")"

          timeout 45s yc container repository list --registry-id "$REGISTRY_ID" --format json > "$RUNNER_TEMP/repositories.json"
          echo "repository_count=$(jq 'length' "$RUNNER_TEMP/repositories.json")"
          TARGET_REPO_ID="$(jq -r --arg n "$REGISTRY_ID/marketplaces-mcp" '.[] | select(.name==$n) | .id' "$RUNNER_TEMP/repositories.json" | head -1)"
          if [[ -n "$TARGET_REPO_ID" ]]; then
            echo 'target_repository_exists=true'
            if timeout 45s yc container repository list-access-bindings "$TARGET_REPO_ID" --format json > "$RUNNER_TEMP/repository-bindings.json"; then
              REPO_PUSHER="$(jq -r --arg id "$CI_SA_ID" '[.[] | select(.role_id=="container-registry.images.pusher" and .subject.id==$id and .subject.type=="serviceAccount")] | length' "$RUNNER_TEMP/repository-bindings.json")"
              echo "repository_direct_ci_pusher_bindings=$REPO_PUSHER"
            else
              echo 'repository_access_bindings=UNAVAILABLE'
            fi
          else
            echo 'target_repository_exists=false'
          fi

          if timeout 45s yc resource-manager folder list-access-policy-bindings "$FOLDER_ID" --format json > "$RUNNER_TEMP/folder-policies.json" 2>/dev/null; then
            echo 'folder_access_policy_templates:'
            jq -cr '[.[] | .access_policy_template_id // .accessPolicyTemplateId // empty] | sort' "$RUNNER_TEMP/folder-policies.json"
          else
            echo 'folder_access_policies=UNAVAILABLE_OR_NONE'
          fi

          if timeout 45s yc resource-manager cloud list-access-policy-bindings "$CLOUD_ID" --format json > "$RUNNER_TEMP/cloud-policies.json" 2>/dev/null; then
            echo 'cloud_access_policy_templates:'
            jq -cr '[.[] | .access_policy_template_id // .accessPolicyTemplateId // empty] | sort' "$RUNNER_TEMP/cloud-policies.json"
          else
            echo 'cloud_access_policies=UNAVAILABLE_OR_NONE'
          fi

          CLOUD_JSON="$(timeout 45s yc resource-manager cloud get "$CLOUD_ID" --format json)"
          ORG_ID="$(printf '%s' "$CLOUD_JSON" | jq -r '.organization_id // .organizationId // empty')"
          if [[ -n "$ORG_ID" ]] && timeout 45s yc organization-manager organization list-access-policy-bindings "$ORG_ID" --format json > "$RUNNER_TEMP/org-policies.json" 2>/dev/null; then
            echo 'organization_access_policy_templates:'
            jq -cr '[.[] | .access_policy_template_id // .accessPolicyTemplateId // empty] | sort' "$RUNNER_TEMP/org-policies.json"
          else
            echo 'organization_access_policies=UNAVAILABLE_OR_NONE'
          fi

          echo 'registry_policy_chain_diagnostic=PASS'

      - name: Cleanup diagnostic files and credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yc-service-account-key.json" "$RUNNER_TEMP/folder-bindings.json" "$RUNNER_TEMP/registry-bindings.json" "$RUNNER_TEMP/registry-ip.json" "$RUNNER_TEMP/repositories.json" "$RUNNER_TEMP/repository-bindings.json" "$RUNNER_TEMP/folder-policies.json" "$RUNNER_TEMP/cloud-policies.json" "$RUNNER_TEMP/org-policies.json"
