name: Yandex serverless hot audit 2026-09-17 temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yandex-serverless-hot-audit-20260917-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 5
    steps:
      - name: Install and audit
        shell: bash
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          export PATH="$RUNNER_TEMP/yc/bin:$PATH"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/key.json"
          chmod 600 "$RUNNER_TEMP/key.json"
          yc config profile create hot-cost-audit || true
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          yc config set cloud-id b1gi4pr9msenirafh2c7
          TOKEN="$(yc iam create-token)"
          START='2026-09-16T12:18:03Z'
          MONTH='2026-09-01T00:00:00Z'
          END="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "HOT_START=$START HOT_END=$END"

          read_metric() {
            F="$1"; METRIC="$2"; FROM="$3"; OUT="$RUNNER_TEMP/body.json"
            Q='"'"$METRIC"'"{service="serverless-containers"}'
            jq -n --arg q "$Q" --arg f "$FROM" --arg t "$END" '{query:$q,fromTime:$f,toTime:$t,downsampling:{gridAggregation:"LAST",gapFilling:"NONE",gridInterval:900000}}' > "$OUT"
            curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @"$OUT" "https://monitoring.api.cloud.yandex.net/monitoring/v2/data/read?folderId=$F" | jq --arg metric "$METRIC" --arg from "$FROM" '{metric:$metric,from:$from,series:[.metrics[]? | {labels,first:((.timeseries.doubleValues // .timeseries.int64Values // [])[0] // null),last:((.timeseries.doubleValues // .timeseries.int64Values // [])[-1] // null),points:((.timeseries.doubleValues // .timeseries.int64Values // [])|length)}]}' || true
          }

          for ITEM in \
            'birzha:b1g00gqb66tbnfoumnkv' \
            'marketplaces:b1gnd0dqoq3ljod88i8t' \
            'telegram:b1gk4p83brasi8g811jv'; do
            N="${ITEM%%:*}"; F="${ITEM##*:}"
            echo "=== HOT_FOLDER $N ==="
            yc serverless container list --folder-id "$F" --format json --no-user-output 2>/dev/null | jq '[.[]|{id,name,status}]' || true
            yc serverless trigger list --folder-id "$F" --format json --no-user-output 2>/dev/null | jq '[.[]|{id,name,status,rule}]' || true
            echo 'COUNT_INTERVAL'; read_metric "$F" 'serverless.containers.execution_time_milliseconds_count' "$START"
            echo 'SUM_INTERVAL'; read_metric "$F" 'serverless.containers.execution_time_milliseconds_sum' "$START"
            echo 'COUNT_MONTH'; read_metric "$F" 'serverless.containers.execution_time_milliseconds_count' "$MONTH"
            echo 'SUM_MONTH'; read_metric "$F" 'serverless.containers.execution_time_milliseconds_sum' "$MONTH"
          done

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/body.json"
