#cloud-config
write_files:
  - path: /usr/local/bin/telegram-nat-probe.py
    permissions: '0755'
    content: |
      #!/usr/bin/env python3
      import socket
      import urllib.request

      def tcp(label, host, port):
          try:
              with socket.create_connection((host, port), timeout=6):
                  print(f"{label}=PASS", flush=True)
          except Exception as exc:
              print(f"{label}=FAIL {type(exc).__name__}", flush=True)

      def https(label, url):
          try:
              with urllib.request.urlopen(url, timeout=10) as response:
                  print(f"{label}=PASS status={response.status}", flush=True)
          except Exception as exc:
              print(f"{label}=FAIL {type(exc).__name__}", flush=True)

      print("NAT_TEST_BEGIN", flush=True)
      https("GENERIC_HTTPS", "https://api.ipify.org")
      https("TG_HTTPS", "https://api.telegram.org")
      tcp("TG_DC2_443", "149.154.167.51", 443)
      tcp("TG_DC2_80", "149.154.167.51", 80)
      tcp("TG_DC2_5222", "149.154.167.51", 5222)
      tcp("TG_DC4_443", "149.154.167.91", 443)
      print("NAT_TEST_DONE", flush=True)

runcmd:
  - [bash, -lc, 'python3 /usr/local/bin/telegram-nat-probe.py > /dev/ttyS0 2>&1']
