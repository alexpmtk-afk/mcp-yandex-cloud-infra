[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-news-reader"
version = "0.1.0"
description = "Read-only Telegram user-client for personal news monitoring"
requires-python = ">=3.12"
dependencies = [
  "Telethon==1.44.0",
  "python-socks[asyncio]==3.1.1",
  "python-dotenv==1.2.2",
  "PyYAML==6.0.2",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "fastmcp==4.0.3",
  "websockets==15.0.1",
  "Pillow==12.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
